.layout{display:flex;min-height:100vh}
.side{width:250px;flex:0 0 250px;background:var(--side);border-right:1px solid var(--line);
 padding:22px 18px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}

details.layer[open]>summary .arrow{transform:rotate(90deg)}

.tagx{background:#c0392b;color:#fff}
.tagm{background:var(--acc);color:#fff}
.tagc{background:var(--line2);color:var(--ink2)}

.intuit{background:var(--acc-bg);border-radius:8px;padding:9px 13px;margin:10px 0;font-size:13.5px}

.readrow{margin:8px 0 2px;text-align:right}
.readbtn{font:inherit;font-size:12.5px;min-height:40px;padding:7px 15px;border-radius:99px;border:1px solid var(--line2);background:var(--surf);color:var(--ink2);cursor:pointer}
.readbtn[aria-pressed="true"]{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}

.fchip{font:inherit;font-size:12.5px;min-height:36px;padding:5px 14px;border-radius:99px;border:1px solid var(--line2);background:var(--surf);color:var(--ink2);cursor:pointer}
.fchip.on{background:var(--acc-bg);color:var(--acc);border-color:var(--acc);font-weight:600}

.pc-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.lv{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px}
.lv1{background:var(--ok-bg);color:var(--ok)} .lv2{background:var(--info-bg);color:var(--info)}
.lv3{background:var(--warn-bg);color:var(--warn)} .lv4{background:var(--acc-bg);color:var(--acc)}
.tagc{font-size:11px;color:var(--ink3);font-family:"IBM Plex Mono",monospace}
.srcb{font-size:10px;color:var(--ink3);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.sdot{width:9px;height:9px;border-radius:99px;background:var(--line2);margin-left:auto;flex:0 0 auto}

.pbtn.grade-c{border-color:var(--ok);color:var(--ok)}

.exam-setup .grp{margin-bottom:14px}
.exam-setup label.ck{display:inline-flex;align-items:center;gap:6px;margin:0 12px 6px 0;font-size:13.5px;min-height:36px}
.exam-setup input[type=checkbox]{accent-color:var(--acc);width:17px;height:17px}
.exam-setup select{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--surf);color:var(--ink)}

.bigbtn:disabled{opacity:.5;cursor:default}
.exam-top{display:flex;align-items:center;gap:10px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink3);margin-bottom:12px}
.exam-top .bar{flex:1;height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.exam-top .bar i{display:block;height:100%;background:var(--acc)}
.report{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:18px 20px;box-shadow:var(--shadow)}
.report .score{font-family:Newsreader,Georgia,serif;font-size:34px;font-weight:600;color:var(--acc)}

th,td{border:1px solid var(--line);padding:7px 10px;text-align:left}
th{background:var(--surf2);white-space:nowrap}
.empty{border:1px dashed var(--line2);border-radius:10px;padding:24px;color:var(--ink3);font-size:13.5px;text-align:center}

.tabbar{display:none}
#tb-sheet{display:none}
@media(max-width:960px){
 body{font-size:16px}
 input,textarea,select{font-size:16px}
 .layout{flex-direction:column}
 .side{width:100%;flex:none;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line);
  padding:12px 16px;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap}
 .side nav,.ng,.foot-side{display:none}

 #tb-sheet a:active{background:var(--surf2)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* 문제은행 공용 헬퍼 — 브라우저(런타임)와 node(검산 러너) 양쪽에서 동일 코드 실행 (이중 구현 금지) */
(function (g) {
  'use strict';

    /* 유효숫자 정리 (부동소수 노이즈 제거). 표시용 — ans에는 절대 쓰지 말 것 */
    fmt: function (x, sig) {
      if (typeof x !== 'number' || !isFinite(x)) return String(x);
      if (x === 0) return '0';
      var v = Number(x.toPrecision(sig || 4));
      return String(v);
    },
    /* SI 접두 표기 (표시용) */
    si: function (x, unit, sig) {
      if (x === 0) return '0 ' + unit;
      var a = Math.abs(x);
      var P = [[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p']];
      for (var i = 0; i < P.length; i++) {
        if (a >= P[i][0] * 0.9999) return SVH.fmt(x / P[i][0], sig) + ' ' + P[i][1] + unit;
      }
      return SVH.fmt(x, sig) + ' ' + unit;
    },
    par: function (a, b) { return a * b / (a + b); },        // 병렬 저항
    par3: function (a, b, c) { return 1 / (1/a + 1/b + 1/c); },
    deg: function (rad) { return rad * 180 / Math.PI; },
    rad: function (d) { return d * Math.PI / 180; },
    /* 복소수 최소 연산 (페이저용) */
    cx: function (re, im) { return { re: re, im: im }; },
    cadd: function (a, b) { return { re: a.re + b.re, im: a.im + b.im }; },
    csub: function (a, b) { return { re: a.re - b.re, im: a.im - b.im }; },
    cmul: function (a, b) { return { re: a.re * b.re - a.im * b.im, im: a.re * b.im + a.im * b.re }; },
    cdiv: function (a, b) {
      var d = b.re * b.re + b.im * b.im;
      return { re: (a.re * b.re + a.im * b.im) / d, im: (a.im * b.re - a.re * b.im) / d };
    },
    cmag: function (a) { return Math.hypot(a.re, a.im); },
    cang: function (a) { return Math.atan2(a.im, a.re) * 180 / Math.PI; }, // deg
    cpar: function (a, b) { return SVH.cdiv(SVH.cmul(a, b), SVH.cadd(a, b)); },
    /* 2x2 / 3x3 실계수 선형계 풀이 (절점/망로 검산·풀이 공용) */
    solve2: function (a11, a12, b1, a21, a22, b2) {
      var D = a11 * a22 - a12 * a21;
      return [ (b1 * a22 - a12 * b2) / D, (a11 * b2 - b1 * a21) / D ];
    },
    solve3: function (A, b) { // A: 3x3 배열, b: [3]
      var d = SVH.det3(A);
      function rep(A, i, b) {
        var M = A.map(function (r) { return r.slice(); });
        for (var r = 0; r < 3; r++) M[r][i] = b[r];
        return M;
      }
      return [SVH.det3(rep(A,0,b))/d, SVH.det3(rep(A,1,b))/d, SVH.det3(rep(A,2,b))/d];
    },
    det3: function (A) {
      return A[0][0]*(A[1][1]*A[2][2]-A[1][2]*A[2][1])
           - A[0][1]*(A[1][0]*A[2][2]-A[1][2]*A[2][0])
           + A[0][2]*(A[1][0]*A[2][1]-A[1][1]*A[2][0]);
    }
  };
  g.SVH = SVH;
})(typeof window !== 'undefined' ? window : globalThis);

    statement:'수정란이 복잡한 성체로 자라며 몸의 질서가 커지는(엔트로피가 줄어드는) 현상이 열역학 법칙과 모순되지 않는 이유로 옳은 것은?',
    choices:['성장 과정에서 내놓은 열이 주변의 엔트로피를 더 크게 늘려, 우주 전체의 엔트로피는 증가하기 때문이다(제2법칙)','생명체 안에서는 에너지가 새로 만들어지기 때문이다(제1법칙의 예외)','생물은 열역학 법칙을 따르지 않기 때문이다','성장하는 동안에는 열이 전혀 방출되지 않기 때문이다'],
    answer:0, expl:'2법칙은 "우주(계+주변)"의 엔트로피를 말한다. 생물 안의 질서는 주변을 더 어지럽히는 대가로 얻는다. (자료 해당 문단 끝의 "1법칙을 따르게 된다"는 표현은 2법칙의 내용이다 — 자료 표기와 다름)' },
  { id:'u5-l4-03', level:4, type:'mc', tags:['되먹임','다른자리'], src:'강의자료 대조', ref:'5강 효소 (4)④⑤',
    statement:'어떤 대사 경로의 최종 산물이 쌓이면, 그 산물이 경로 첫 효소의 활성부위가 아닌 조절부위에 결합해 효소를 비활성화한다. 이 조절에 대한 설명으로 옳은 것은?',
    choices:['되먹임 억제이며, 최종 산물이 다른자리 입체성 조절자로 작용한 경우다','경쟁적 억제이며, 최종 산물이 기질과 활성부위를 두고 경쟁한 경우다','보조인자가 효소를 활성화한 경우다','효소가 변성되어 비가역적으로 손상된 경우다'],
    answer:0, expl:'"최종 산물이 앞 효소를 끈다" = 되먹임 억제, "활성부위가 아닌 조절부위에 붙어 모양을 바꾼다" = 다른자리 입체성 조절. 필요한 만큼만 만들게 하는 자동 조절 장치다.' },
  { id:'u5-l4-04', level:4, type:'mc', tags:['ATP'], src:'강의자료 대조', ref:'5강 ATP (2)',

    choices:['기계적 작업 — 아미노산을 이어 폴리펩티드를 합성','수송 작업 — 농도 기울기를 거스르는 능동수송','기계적 작업 — 섬모 운동과 근육세포 수축','화학적 작업 — 단량체로부터 중합체 합성'],
    answer:0, expl:'중합체 합성은 스스로 일어나지 않는 반응에 에너지를 대는 화학적 작업이다. 기계적 작업은 섬모·근수축·염색체 이동처럼 무언가를 움직이는 일이다.' },

<script>
window.SV_CONTENT = {"course": {"bigpicture": "\n<p><b>이 과목의 뼈대</b> — 수업계획서는 한 학기를 \"생명체는 무엇이 다른가\"라는 물음 하나로 묶는다.\n답은 다섯 가지 특징이다: <b>규칙적 배열</b><span class=\"en\">(order)</span> → <b>에너지 이용</b><span class=\"en\">(energy)</span> →\n<b>영속성</b><span class=\"en\">(heredity)</span> → <b>다양성</b><span class=\"en\">(evolution)</span> → <b>항상성</b><span class=\"en\">(homeostasis)</span>.</p>\n<p>지금까지의 1~5강은 앞의 두 막이다. ① <b>규칙적 배열</b>: 원자가 결합해 물과 거대분자가 되고(1·2강),\n거대분자가 막으로 구획된 세포와 세포소기관을 이루며(3강), 세포는 막을 통해 물질과 신호를 주고받는다(4강).\n② <b>에너지 이용</b>: 그 구조물을 유지하는 화학반응 전체가 물질대사이고, 방향은 열역학이, 속도는 효소가 정한다(5강).</p>\n<div class=\"mapline\">원소·결합(1강) → 물·pH(1강) → 거대분자 4종(2강) → 세포·소기관(3강) → 막·수송·신호(4강) → 에너지·ATP·효소(5강)</div>\n<p><b>공부 전략</b> — 개념 과목의 시험은 \"정의를 아는가\"보다 <b>\"비슷한 둘을 구별하는가\"</b>와 <b>\"원인과 결과를 잇는가\"</b>에서 갈린다.\n각 단원의 비교 쌍(공유 vs 수소결합, 녹말 vs 셀룰로오스, 원핵 vs 진핵, 확산 vs 능동수송, ΔG vs 활성화에너지)을 표로 만들고,\n문제의 L3·L4는 그 표를 상황에 적용하는 연습이다.</p>"}, "u1": {"concept": "\n<div class=\"bigpic\"><span class=\"bt\">U1 큰그림</span>\n생명의 모든 구조는 결국 <b>원자들이 어떻게 전자를 나누느냐</b>에서 출발한다. 전기음성도 차이가 결합의 종류를 정하고,\n결합의 종류가 물의 성질을 정하며, 물의 성질이 세포가 사는 환경을 정한다. 이 단원은 그 사슬을 한 줄로 꿰는 연습이다.</div>\n\n<h4>1. 생명체의 원소와 원자 <span class=\"en\">(Elements &amp; Atoms)</span><span class=\"tagm\">용어 필수</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 사람 몸을 원소 단위로 쪼개면 무엇이 얼마나 나오는가? 그리고 같은 원소인데 무게가 다른 원자는 어떻게 가능한가?</div>\n<p>생명체 질량의 약 96%는 <b>C·O·H·N</b>, 나머지 약 4%의 대부분은 Ca·P·K·S·Na·Cl·Mg이며, 극소량의 미량원소도 필수다.\n원자는 양성자·중성자로 된 원자핵과 그 둘레의 전자로 이루어진다. <b>원자번호 = 양성자 수</b>, <b>질량수 = 양성자 + 중성자</b>.\n양성자 수는 같고 중성자 수만 다르면 <b>동위원소</b><span class=\"en\">(isotope)</span>이고, 핵이 스스로 붕괴하는 것이 방사성 동위원소다.\n붕괴로 양성자 수가 바뀌면 다른 원소가 된다.</p>\n<p>반응성을 정하는 것은 <b>최외각 전자(원자가전자)</b>다. 첫 껍질은 전자 2개, 그 바깥 껍질은 대개 8개가 차면 안정하다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[개념] 원자번호·질량수·동위원소 정의 구별. [함정] 전자 수만 다른 것은 동위원소가 아니라 이온.</div>\n\n<h4>2. 화학결합 네 가지 <span class=\"en\">(Chemical Bonds)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 원자끼리 붙는 방법이 하나뿐이라면 DNA 두 가닥은 풀리지 않고, 단백질은 접히지 않는다. 강한 결합과 약한 결합이 왜 둘 다 필요한가?</div>\n<p><b>전기음성도</b><span class=\"en\">(electronegativity)</span> = 결합 전자를 끌어당기는 힘. 이 차이 하나로 결합이 갈린다.</p>\n<ul><li><b>공유결합</b>: 전자쌍을 나눠 가짐. 전기음성도가 같으면 <b>비극성</b>(H₂, O₂), 다르면 <b>극성</b>(H₂O: Oδ−, Hδ+).</li>\n<li><b>이온결합</b>: 차이가 매우 커서 전자를 아예 빼앗음 → 양·음이온끼리 끌림(NaCl).</li>\n<li><b>수소결합</b>: 전기음성도 큰 원자와 공유결합한 H가 <b>이웃 분자(또는 부위)</b>의 전기음성도 큰 원자에 끌리는 약한 인력.</li>\n<li><b>반데르발스 인력</b>: 비극성 분자에서 순간적으로 생긴 전하 치우침끼리의 아주 약한 인력.</li></ul>\n<p class=\"intuit\">💡 <b>직관</b> — 공유·이온결합은 \"분자를 만드는 용접\", 수소결합·반데르발스는 \"분자끼리 붙이는 벨크로\". 벨크로라서 떼었다 붙였다 할 수 있다 — DNA 복제와 단백질 변성의 열쇠.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[비교] 공유결합 vs 수소결합(전자 공유 여부), 극성 vs 비극성 판정. [연결] 2강 단백질 2·3차 구조, DNA 이중나선이 모두 약한 결합에 기댄다.</div>\n\n<h4>3. 물 — 극성이 만든 네 가지 성질 <span class=\"en\">(Properties of Water)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 물은 흔한 작은 분자인데 왜 \"생명의 용매\"라고 부르는가? 성질 네 가지의 공통 원인은 무엇인가?</div>\n<p>물은 극성 분자라 분자끼리 <b>수소결합</b>을 한다. 여기서 네 성질이 나온다.\n① <b>응집·흡착</b>: 분자들이 서로 붙어 식물 속에서 물이 중력을 거슬러 올라간다.\n② <b>온도 조절</b>: 비열이 높아 온도가 잘 안 변하고, 증발할 때 많은 열을 가져가 냉각시킨다.\n③ <b>결빙 시 팽창</b>: 얼음이 물보다 밀도가 낮아 뜨고, 아래 물을 단열해 생물이 얼지 않는다.\n④ <b>용매</b>: 이온·극성 물질 둘레에 <b>수화층</b><span class=\"en\">(hydration layer)</span>을 만들어 녹이고, 비극성 물질과는 섞이지 않아 막 같은 경계가 생긴다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[적용] 현상 → 성질 짝짓기(호수 결빙·땀·나무 수송·해안 기후). [함정] 호수 표면만 어는 이유를 \"비열\"로 고르는 오답.</div>\n\n<h4>4. pH와 완충 <span class=\"en\">(pH &amp; Buffers)</span><span class=\"tagm\">개념 필수</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 세포 안 단백질은 pH가 조금만 바뀌어도 모양이 무너진다. 그런데 몸에는 산과 염기가 끊임없이 들어온다.</div>\n<p><b>산</b>은 용액의 H⁺ 농도를 높이고, <b>염기</b>는 낮춘다(H⁺를 받거나 OH⁻를 내놓아서). \\(\\mathrm{pH}=-\\log[\\mathrm{H^+}]\\),\n중성에서는 \\([\\mathrm{H^+}][\\mathrm{OH^-}]=10^{-14}\\) 이라 pH 7. 세포 안은 pH 7 부근을 지켜야 하므로\n산·염기가 더해져도 pH를 버티게 하는 <b>완충용액</b><span class=\"en\">(buffer)</span>이 필요하다(탄산–중탄산 체계).</p>\n<p><b>해양 산성화</b> — CO₂가 물에 녹아 탄산 → H⁺와 중탄산이온으로 해리 → 늘어난 H⁺가 탄산이온과 결합 → 탄산이온이 줄어 산호의 석회화가 느려진다.\n산성비(산화황·산화질소)와는 다른 경로다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[순서] CO₂ → 산호초 경로 배열. [계산 감각] pH 1 차이 = [H⁺] 10배.</div>"}, "u2": {"concept": "\n<div class=\"bigpic\"><span class=\"bt\">U2 큰그림</span>\n생명체의 분자는 네 가족뿐이다 — <b>탄수화물·지질·단백질·핵산</b>. 이 중 셋은 작은 단위체를 줄줄이 이은 중합체이고,\n잇는 방법(탈수축합)과 끊는 방법(가수분해)은 모두 같다. 차이는 <b>무엇을 어떻게 이었는가</b>이며, 그것이 기능을 정한다.</div>\n\n<h4>1. 탄소와 중합체 <span class=\"en\">(Carbon &amp; Polymers)</span><span class=\"tagm\">개념 필수</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 원소는 몇 개 안 되는데 생체 분자의 종류는 셀 수 없이 많다. 다양성은 어디서 오는가?</div>\n<p>탄소는 최외각 전자가 4개라 <b>네 방향으로 결합</b>할 수 있다(4가). 그래서 길이가 다양한 사슬, 가지, 이중결합, 고리를 모두 만든다.\n큰 분자는 단위체를 이은 <b>중합체</b><span class=\"en\">(polymer)</span>: 탄수화물←단당류, 단백질←아미노산, 핵산←뉴클레오티드\n(지질은 지방산 등으로 이루어지지만 진짜 중합체는 아니다).\n<b>탈수축합</b><span class=\"en\">(dehydration)</span>은 물 분자를 빼며 공유결합으로 잇고, <b>가수분해</b><span class=\"en\">(hydrolysis)</span>는 물을 넣어 끊는다. 둘 다 효소가 돕는다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[비교] 합성=물 빠짐 / 분해=물 들어감. [함정] 지질을 \"중합체\"로 부르는 선지.</div>\n\n<h4>2. 탄수화물 <span class=\"en\">(Carbohydrates)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 녹말과 셀룰로오스는 둘 다 포도당만으로 만든다. 그런데 사람은 밥은 소화하고 종이는 못 한다. 왜?</div>\n<p><b>단당류</b>((CH₂O)ₙ, 주로 3·5·6탄당, 물속에서 고리 구조) → 두 개가 글리코시드 결합하면 <b>이당류</b>:\n엿당(포도당+포도당), 설탕(포도당+과당, 식물의 운반 형태), 젖당(포도당+갈락토오스).\n<b>다당류</b>의 성질은 단위체 종류와 <b>결합 위치·방향</b>이 정한다.</p>\n<ul><li><b>저장용</b>: 식물의 녹말(α-포도당 1-4 결합의 나선. 아밀로오스는 가지 없음, 아밀로펙틴은 1-6 가지), 동물의 글리코겐(간·근육, 가지가 더 많음).</li>\n<li><b>구조용</b>: 셀룰로오스(β-포도당 1-4 결합, 단위체가 번갈아 뒤집혀 곧은 사슬 → 사슬 사이 수소결합으로 미세섬유 → 녹말 분해효소로 못 끊음),\n키틴(질소 포함, 절지동물 외골격·균류 세포벽).</li></ul>\n<p class=\"intuit\">💡 <b>직관</b> — 같은 레고 블록도 \"같은 방향으로 끼우면 나선(녹말), 번갈아 뒤집어 끼우면 판자(셀룰로오스)\". 효소는 모양을 알아보는 열쇠라 판자는 못 연다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[비교] 녹말 vs 글리코겐 vs 셀룰로오스 표(단위체·결합·모양·기능). [적용] 소·흰개미가 셀룰로오스를 소화하는 방법(미생물).</div>\n\n<h4>3. 지질 <span class=\"en\">(Lipids)</span><span class=\"tagm\">개념 필수</span></h4>\n<p><b>지방</b> = 글리세롤 + 지방산 3개(에스터 결합, 트리아실글리세롤). 탄화수소 사슬이 소수성이라 물과 섞이지 않는다.\n<b>포화지방산</b>(이중결합 없음, 주로 동물성, 실온 고체) vs <b>불포화지방산</b>(cis 이중결합으로 꺾임, 식물·생선, 실온 액체).\n같은 무게에 탄수화물보다 에너지를 많이 저장하고, 기관 보호·보온에 쓰인다.\n<b>인지질</b>은 지방산 2개 + 인산기 머리 → 친수성 머리와 소수성 꼬리가 물속에서 <b>이중층</b>을 이뤄 세포막이 된다.\n<b>스테로이드</b>는 고리 4개 골격(콜레스테롤: 동물 세포막 성분이자 호르몬 전구체).</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[비교] 포화 vs 불포화(구조→실온 상태). [연결] 인지질·콜레스테롤은 4강 막 유동성의 재료.</div>\n\n<h4>4. 단백질 — 서열이 모양을, 모양이 기능을 <span class=\"en\">(Proteins)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 아미노산 하나만 바뀌었는데 적혈구가 낫 모양이 되어 빈혈이 생긴다. 한 글자 오타가 어떻게 전체를 무너뜨리는가?</div>\n<p>아미노산은 중심 탄소에 아미노기·카르복실기·H·<b>R기</b>가 붙은 분자이고, R기가 종류(20종)와 성질(비극성 / 극성 / 산성·염기성 전하)을 정한다.\n<b>펩티드 결합</b>은 한 아미노산의 카르복실기와 다음 것의 아미노기가 탈수축합한 공유결합이며, 사슬에 아미노 말단·카르복실 말단이 생긴다.</p>\n<ul><li><b>1차</b>: 아미노산 서열(유전정보가 정함).</li>\n<li><b>2차</b>: 골격의 O·N–H 사이 수소결합이 만드는 α나선·β병풍.</li>\n<li><b>3차</b>: R기끼리의 상호작용(소수성 상호작용·수소결합·이온결합·시스테인 사이 이황화 다리)으로 접힌 전체 모양.</li>\n<li><b>4차</b>: 폴리펩티드 여러 개의 조립(헤모글로빈 = α 2 + β 2).</li></ul>\n<p>pH·염농도·온도·유기용매 등이 약한 결합을 깨면 <b>변성</b><span class=\"en\">(denaturation)</span>. 조건이 돌아오면 다시 접히기도 하는데(<b>재생</b>),\n이는 모양 정보가 <b>1차 구조에 들어 있다</b>는 증거다. 겸상적혈구빈혈증은 1차 구조 한 자리 변화(글루탐산→발린)가 2·3·4차 구조로 번진 예다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[구별] 각 차수를 만드는 결합. [추론] 재생 실험이 말해 주는 것. [함정] 자료의 \"글루타민→발린\"은 오기 — 글루탐산.</div>\n\n<h4>5. 핵산 <span class=\"en\">(Nucleic Acids)</span><span class=\"tagx\">시험 핵심</span></h4>\n<p><b>뉴클레오티드</b> = 염기 + 오탄당 + 인산기(염기+오탄당만이면 뉴클레오시드). 염기는 <b>피리미딘</b>(고리 1개: C·T·U)과 <b>퓨린</b>(고리 2개: A·G).\nDNA의 당은 2′ 탄소에 산소가 없는 데옥시리보오스, RNA는 리보오스.\n한 뉴클레오티드의 3′-OH와 다음 것의 5′ 인산이 인산디에스테르 결합으로 이어져 <b>5′ 말단 → 3′ 말단</b> 방향성이 생긴다.\nDNA는 두 가닥이 <b>역평행</b>으로 꼬인 이중나선: 당–인산 골격은 바깥, 염기쌍(A–T, G–C)은 안쪽이며 수소결합으로 붙는다.\n한 가닥을 알면 다른 가닥이 정해져, 복제 때 각 가닥이 주형이 된다(반보존적 복제). RNA는 단일 가닥이지만 자기 안에서 염기쌍을 이루기도 한다(tRNA).</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[비교] DNA vs RNA(당·염기·가닥). [적용] 상보 가닥 서열·방향 쓰기. [연결] 7·8주차 유전정보 흐름의 입구.</div>"}, "u3": {"concept": "\n<div class=\"bigpic\"><span class=\"bt\">U3 큰그림</span>\n세포는 <b>막으로 구획된 공간</b>이다. 구획이 있어야 내부를 일정하게 지킬 수 있고, 진핵세포는 그 구획을 안쪽에도 여러 개 만들어\n서로 섞이면 안 되는 반응을 동시에 돌린다. 세포소기관은 \"무엇을 만들고, 어디로 보내고, 무엇을 부수는가\"의 분업표로 읽는다.</div>\n\n<h4>1. 세포설과 세포가 작은 이유 <span class=\"en\">(Cell Theory &amp; Cell Size)</span><span class=\"tagm\">개념 필수</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 코끼리 세포와 생쥐 세포의 크기는 비슷하다. 큰 생물은 세포를 키우지 않고 개수를 늘린다. 왜?</div>\n<p><b>세포설</b>: 세포는 생명의 기본 단위이고, 모든 생물은 세포로 되어 있으며, 세포는 이미 있는 세포에서 생긴다.\n세포가 커지면 부피가 표면적보다 빨리 늘어 <b>표면적/부피 비</b><span class=\"en\">(SA/V)</span>가 작아지고, 막을 통한 물질 교환이 모자라진다.\n그래서 세포는 작고(대개 1~100 μm), 소장 융모처럼 부피는 두고 표면적만 늘리는 구조가 쓰인다.\n<b>원형질막</b>은 선택적 투과 장벽이자 신호 교환·세포 부착의 자리다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[추론] 크기가 2배 → SA/V는 절반. [적용] 융모·주름 구조의 의미.</div>\n\n<h4>2. 원핵 vs 진핵, 동물 vs 식물 <span class=\"en\">(Prokaryote vs Eukaryote)</span><span class=\"tagx\">시험 핵심</span></h4>\n<p><b>공통</b>: 원형질막·세포질·DNA 유전자·리보솜. <b>원핵세포</b>(세균·고세균)는 핵막이 없어 DNA가 핵양체에 있고, 막성 소기관이 없으며 1~5 μm.\n<b>진핵세포</b>(원생생물·균류·동물·식물)는 핵과 막성 소기관을 갖고 10~100 μm.\n자료 기준으로 <b>식물세포에만</b> 세포벽·엽록체·원형질연락사·중앙 액포, <b>동물세포에만</b> 리소좀·중심립이 있는 중심체·편모가 있고,\n미토콘드리아·퍼옥시좀은 둘 다 있다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[표] 원핵/진핵 · 동물/식물 O·X 표. [함정] 리보솜은 원핵에도 있다(막이 없는 소기관).</div>\n\n<h4>3. 만들고 보내는 길 — 내막계 <span class=\"en\">(Endomembrane System)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 췌장 세포가 소화효소를 밖으로 분비하려면, 단백질은 어디서 만들어져 어떤 길로 나가는가?</div>\n<ul><li><b>핵</b>: DNA 복제·전사. 이중막(핵공으로 RNA·단백질 출입), <b>인</b>에서 rRNA 합성·리보솜 소단위 조립.</li>\n<li><b>리보솜</b>: 단백질 합성, 막 없음. 유리 리보솜 → 세포질 단백질 / 소포체 부착 리보솜 → 막·분비·소기관행 단백질. 구조는 같아 역할을 바꿀 수 있다.</li>\n<li><b>조면소포체</b>: 부착 리보솜이 만든 단백질을 받아 변형(이황화결합·접힘·당 부착)하고 수송낭으로 내보냄, 막 생산.\n<b>활면소포체</b>: 지질·스테로이드 합성, 해독(약물에 −OH를 붙여 배출을 쉽게 → 반복 복용 시 내성), Ca²⁺ 저장(근수축).</li>\n<li><b>골지체</b>: 소포체 쪽 <b>cis면</b>으로 받아 → 이동하며 변형 → <b>trans면</b>에서 목적지별 소낭으로 내보냄.</li>\n<li><b>리소좀</b>: 가수분해효소 주머니(단일막). 산성에서 활발해 세포질(pH 7)에 새어 나와도 해가 적다. 식세포·자기소화. 효소 결핍 → 테이삭스병.</li>\n<li><b>액포</b>(식물): 저장·노폐물 격리·팽압(지지와 성장)·색소·방어.</li></ul>\n<p class=\"intuit\">💡 <b>직관</b> — 분비 단백질의 여권 도장 순서: 부착 리보솜 → 조면소포체 → 수송낭 → 골지체(cis→trans) → 분비 소낭 → 세포 밖.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[순서] 분비 경로 배열. [구별] 활면 vs 조면 소포체 기능, 유리 vs 부착 리보솜의 산물.</div>\n\n<h4>4. 에너지 소기관과 내부공생설 <span class=\"en\">(Mitochondria, Chloroplasts &amp; Endosymbiosis)</span><span class=\"tagx\">시험 핵심</span></h4>\n<p><b>미토콘드리아</b>: 세포호흡으로 ATP 생산. 내막의 주름 <b>크리스타</b>가 효소가 일할 면적을 넓힌다. 기질에 리보솜·DNA·호흡 효소.\n<b>엽록체</b>(식물·조류): 광합성. 이중막 안에 <b>스트로마</b>(DNA·리보솜·효소)와 틸라코이드가 쌓인 <b>그라나</b>(엽록소가 빛 흡수).\n<b>퍼옥시좀</b>: 지방산 산화 후 미토콘드리아로 넘김, 과산화물 해독(간의 알코올 분해). 종자의 글리옥시좀은 지방→당.</p>\n<p><b>내부공생설</b>의 근거 — 미토콘드리아·엽록체는 ① 두 겹 이상의 막 ② 세균과 닮은 자체 DNA ③ 자체 리보솜 ④ 스스로 분열.\n→ 원핵생물이 큰 세포에 들어가 공생하게 되었다는 가설. 반면 <b>막진화설</b>은 세포막이 안으로 접혀 핵막·소포체 같은 내막계가 생겼다고 본다(핵막과 소포체가 이어진 것이 근거).</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[근거 고르기] 내부공생설을 지지하는 관찰. [구별] 두 가설이 설명하는 대상(에너지 소기관 vs 내막계).</div>\n\n<h4>5. 세포골격·세포 밖 구조·연접 <span class=\"en\">(Cytoskeleton, ECM &amp; Junctions)</span><span class=\"tagm\">개념 필수</span></h4>\n<p><b>세포골격</b>(진핵만): <b>미세소관</b>(중심체에서 형성, 섬모·편모의 9+2 구조, 디네인이 ATP를 써서 걷는 방식으로 굽힘, 염색체 이동),\n<b>미세섬유</b>(액틴 — 미오신과 함께 근수축·아메바 운동·세포질 유동), <b>중간섬유</b>(구조 지지).\n편모는 길고 적으며 파동 운동, 섬모는 짧고 많으며 노젓기 운동.</p>\n<p><b>세포 밖</b>: 세균 세포벽(펩티도글리칸), 식물 세포벽(셀룰로오스 — 1차 벽·펙틴 중간라멜라·2차 벽), 동물 <b>세포외기질</b>(콜라겐·프로테오글리칸·피브로넥틴이 막의 인테그린과 연결).\n<b>연접</b>: 식물 원형질연락사(벽을 뚫고 세포질이 이어짐) / 동물 밀착연접(새지 않게 봉함)·고착연접(데스모좀, 중간섬유로 고정)·간극연접(작은 분자가 지나는 통로).</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[짝짓기] 세포골격 3종 ↔ 기능, 연접 3종 ↔ 역할. [구별] 섬모 vs 편모.</div>"}, "u4": {"concept": "\n<div class=\"bigpic\"><span class=\"bt\">U4 큰그림</span>\n다세포 생물의 세포는 혼자 살지 않는다. 막은 <b>무엇을 들이고 내보낼지</b>(수송)와 <b>무슨 말을 들을지</b>(신호)를 고르는 관문이다.\n이 단원의 모든 내용은 두 질문으로 나뉜다: 에너지를 쓰는가? 그리고 신호는 어떻게 커지고 조절되는가?</div>\n\n<h4>1. 유동모자이크 막 <span class=\"en\">(Fluid Mosaic Model)</span><span class=\"tagm\">개념 필수</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 막이 딱딱하게 굳으면 왜 세포가 죽는가? 추운 곳에 사는 생물의 막은 무엇이 다른가?</div>\n<p>막 = 인지질 이중층 + 그 속에 박힌 단백질 + 일부 지질·단백질에 붙은 탄수화물. 성분이 옆으로 움직이는 <b>유동적</b> 구조다.\n굳으면 막단백질이 일을 못 해 물질 이동이 멈춘다. 유동성은 ① 인지질의 이동(옆으로는 빠르고 뒤집기는 드묾)\n② 꼬리의 <b>불포화도</b>(높을수록 유동적) ③ <b>콜레스테롤</b>(체온에선 움직임을 억제하고, 저온에선 굳는 것을 막는 \"온도 완충제\")이 정한다.\n막단백질은 수송·효소·수용체·세포 인지(당단백질)·세포 간 결합·골격 연결을 맡는다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[추론] 저온 적응 → 불포화 지방산 비율↑. [함정] 콜레스테롤이 \"항상\" 유동성을 높이거나 낮춘다는 선지.</div>\n\n<h4>2. 작은 분자의 수송 <span class=\"en\">(Passive &amp; Active Transport)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 산소는 막을 그냥 통과하는데 포도당과 이온은 못 한다. 그리고 세포는 이미 많은 쪽으로도 물질을 끌어모은다.</div>\n<p><b>선택적 투과성</b>의 두 원천: 지질 이중층은 작은 비극성 분자(O₂·CO₂·탄화수소)를 통과시키고, 극성 분자·이온은 수송단백질이 골라 통과시킨다.</p>\n<ul><li><b>수동수송</b>(에너지 X, 농도가 높은 쪽 → 낮은 쪽): <b>단순확산</b>(비극성 용질이 막을 직접) ·\n<b>삼투</b>(용질은 못 지나고 자유로운 물 분자가 이동. 동물세포는 고장액에서 쪼그라들고 저장액에서 터질 수 있음 → 짚신벌레 수축포, 식물세포는 세포벽이 버티며 팽압 유지) ·\n<b>촉진확산</b>(극성 분자·이온이 <b>통로단백질</b> 또는 <b>운반체단백질</b>을 통해. 운반체 결핍 예: 시스틴뇨증).</li>\n<li><b>능동수송</b>(에너지 O, 농도와 무관하게 — 기울기를 거슬러): 주로 운반체단백질. <b>1차</b>는 ATP가 펌프에 직접, <b>2차</b>는 1차가 만든 이온 기울기를 에너지로 씀.\n방향에 따라 단방향(양성자 펌프)·동방향(H⁺–설탕)·역방향(Na⁺–K⁺ 펌프).</li></ul>\n<p class=\"intuit\">💡 <b>직관</b> — 수동수송은 \"내리막 굴러가기\"(통로는 미끄럼틀일 뿐), 능동수송은 \"오르막 짐 나르기\"(펌프가 연료를 씀). 촉진확산도 단백질을 쓰지만 내리막이라 에너지는 들지 않는다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[분류] 수송 사례 → 단순/촉진/능동. [적용] 고장액·저장액에서 동물·식물세포의 변화. [함정] \"단백질을 쓰면 능동수송\".</div>\n\n<h4>3. 큰 분자의 수송 <span class=\"en\">(Exocytosis &amp; Endocytosis)</span><span class=\"tagm\">개념 필수</span></h4>\n<p><b>세포외 배출</b>: 소낭이 막과 합쳐 내용물을 밖으로. <b>세포내 섭취</b>: 막이 안으로 접혀 소낭 형성 —\n<b>식세포작용</b>(위족으로 입자를 감싸 삼킨 뒤 리소좀과 융합), <b>음세포작용</b>(세포 밖 액체를 가리지 않고 들이킴),\n<b>수용체매개</b>(필요한 물질만 수용체에 붙여 골라 들임).</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[구별] 특이적인 것은 수용체매개뿐. [연결] 3강 리소좀·골지체 분비 경로.</div>\n\n<h4>4. 신호전달 3단계 <span class=\"en\">(Reception → Transduction → Response)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 에피네프린 분자 몇 개가 간세포 밖에 붙었을 뿐인데, 세포 안에서는 글리코겐 수많은 분자가 분해된다. 신호는 어떻게 커지는가?</div>\n<p>① <b>수용</b>: 리간드가 특이적 수용체에 결합. 물에 녹는 큰 리간드는 <b>막 수용체</b>(예: G단백질 결합 수용체), 막을 통과하는 리간드(스테로이드 호르몬 등)는 <b>세포 안 수용체</b>.\n② <b>전달</b>: 대개 여러 단계 — 단계마다 <b>증폭</b>되고 <b>조절</b>할 기회가 생긴다. 인산화효소 연쇄(탈인산화효소가 끔), 또는 <b>2차 전달자</b> cAMP의 확산.\n에피네프린 → G단백질 결합 수용체 → G단백질 활성 → 아데닐산고리화효소 → cAMP → 단백질 인산화효소 → … → 글리코겐 분해.\n③ <b>반응</b>: 핵에서는 전사인자 활성 → 유전자 발현 조절, 세포질에서는 효소 활성 변화.</p>\n<p><b>콜레라</b>: 독소가 G단백질을 변형해 GTP를 끊지 못함 → 스위치가 켜진 채 cAMP가 쌓임 → 장세포가 물·염을 계속 내보내 설사.\n신호전달은 세포예정사(손가락 사이 물갈퀴 제거)에도 쓰인다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[순서] cAMP 경로 배열. [추론] 콜레라에서 \"꺼지지 않는 스위치\"가 어느 단계인가. [구별] 막 수용체 vs 세포 안 수용체 리간드.</div>"}, "u5": {"concept": "\n<div class=\"bigpic\"><span class=\"bt\">U5 큰그림</span>\n세포 안의 반응을 두 질문으로 나눠라. <b>일어날 수 있는가?</b> — 열역학과 자유에너지 ΔG가 답한다. <b>얼마나 빨리 일어나는가?</b> — 효소가 답한다.\n둘을 섞으면 틀린다: 효소는 속도를 바꿀 뿐 방향(ΔG)은 못 바꾼다. 그 사이에서 ATP는 내리막 반응의 에너지를 오르막 반응으로 옮기는 화폐다.</div>\n\n<h4>1. 물질대사와 열역학 <span class=\"en\">(Metabolism &amp; Thermodynamics)</span><span class=\"tagm\">개념 필수</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 생물은 수정란에서 복잡한 몸으로 점점 질서를 만든다. \"무질서는 늘 증가한다\"는 법칙을 어기는 것 아닌가?</div>\n<p><b>물질대사</b> = 생명 유지를 위한 모든 합성·분해 반응. 여러 단계로 일어나고 효소가 속도를 조절한다는 점이 일반 화학반응과 다르다.\n<b>1법칙</b>: 에너지는 형태만 바뀔 뿐 새로 생기거나 사라지지 않는다. <b>2법칙</b>: 변환 때마다 일부가 열로 흩어져 우주의 <b>엔트로피</b>(무질서도)가 증가한다 — 그래서 계속 먹어야 한다.\n외부 에너지 투입 없이 일어나는 과정이 <b>자발적</b>이다.\n생물이 자기 안의 엔트로피를 낮출 수 있는 것은 그 과정에서 내놓은 열이 <b>주변</b>의 엔트로피를 더 크게 늘리기 때문이며, 우주 전체로는 2법칙을 따른다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[예시 짝] 1법칙 vs 2법칙 사례. [함정] 자료 문장 끝의 \"1법칙을 따르게 된다\"는 오기 — 주변 엔트로피 증가는 2법칙의 내용.</div>\n\n<h4>2. 자유에너지 ΔG <span class=\"en\">(Free Energy)</span><span class=\"tagx\">시험 핵심</span></h4>\n<p><b>자유에너지</b> = 일에 쓸 수 있는 에너지. \\(\\Delta G = G_{\\text{생성물}} - G_{\\text{반응물}}\\).\n불안정한(자유에너지가 큰) 계는 자발적으로 안정한 쪽으로 가며 일을 하고, 끝에 도달하면 농도 변화가 없는 <b>평형</b>이다.\n자료의 분류: <b>ΔG&lt;0</b> → 자발적·에너지 방출·분해(이화), 자료 용어로 \"발열\" / <b>ΔG&gt;0</b> → 비자발적·에너지 흡수·합성(동화), \"흡열\".\n포도당 + O₂ → CO₂ + H₂O 의 ΔG가 −686 kcal/mol 이면 역반응은 +686 kcal/mol.\n세포는 연료를 계속 받고 노폐물을 버리는 <b>열린계</b>라 평형에 이르지 않고 일을 계속한다(평형 = 죽음).</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[부호] 정반응 ΔG → 역반응 ΔG. [추론] 세포가 평형에 도달하지 않는 이유.</div>\n\n<h4>3. ATP — 에너지 화폐 <span class=\"en\">(ATP)</span><span class=\"tagx\">시험 핵심</span></h4>\n<p>ATP + H₂O → ADP + Pᵢ, ΔG = −7.3 kcal/mol. 음전하를 띤 인산기 셋이 서로 밀어내 불안정해 쉽게 끊어지며,\n그 방출 에너지를 ΔG&gt;0 반응에 대준다. ATP가 하는 세 가지 일: <b>화학적</b>(단위체→중합체 합성), <b>수송</b>(기울기를 거스르는 능동수송), <b>기계적</b>(섬모·근수축·염색체 이동).\n쓰인 ADP는 다시 ATP로 재생된다(순환).</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[짝짓기] 세포 활동 ↔ ATP 작업 종류. [연결] 4강 1차 능동수송, 3강 디네인·미오신.</div>\n\n<h4>4. 효소 — 속도를 바꾸는 촉매 <span class=\"en\">(Enzymes)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 포도당은 공기 중에서 자발적으로 분해되는 반응(ΔG&lt;0)인데, 설탕 봉지는 수년이 지나도 멀쩡하다. 왜?</div>\n<p>반응을 시작하려면 분자를 불안정한 전이상태까지 올리는 <b>활성화에너지</b>(E<sub>A</sub>)가 필요하다. 생물은 고온으로 이를 넘을 수 없다(단백질 변성, 모든 반응을 무차별 촉발).\n그래서 <b>효소</b>가 E<sub>A</sub>를 낮춘다. <b>ΔG는 바꾸지 못한다</b> — 비자발 반응을 자발로 만들지 않는다.\n작동 특성: <b>기질특이성</b>(활성부위가 특정 기질만), 약한 결합으로 붙였다 떼는 <b>빠른 순환</b>, 결합 시 <b>활성부위 모양 변화</b>로 반응에 유리한 환경 제공.</p>\n<p><b>조절</b>: 온도·pH(3차 구조), <b>보조인자</b>(비타민·금속이온), <b>경쟁적 억제자</b>(기질을 닮아 활성부위를 두고 경쟁),\n<b>비경쟁적 억제자</b>(활성부위가 아닌 곳에 붙어 기능 저하), <b>다른자리 입체성 조절</b>(조절부위에 붙어 활성화·비활성화, 예: ATP·ADP),\n<b>되먹임 억제</b>(최종 산물이 경로 앞 효소를 억제). 효소는 필요한 구획에 모여 있다(호흡 효소 → 미토콘드리아).</p>\n<p class=\"intuit\">💡 <b>직관</b> — ΔG는 \"산 정상과 골짜기의 높이 차\", E<sub>A</sub>는 \"넘어야 할 고개\". 효소는 터널을 뚫는다 — 고개는 낮아지지만 출발점과 도착점의 높이 차는 그대로다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[함정] \"효소가 ΔG를 줄인다\". [구별] 경쟁적 vs 비경쟁적 억제(기질 농도를 높이면 극복되는 쪽은?), 되먹임 억제의 대상.</div>"}};
window.SV_BUILD = {"date": "2026-09-14", "units": 5, "problems": 122, "gate": "PASS 2026-09-14 (N=50/문제)"};
</script>
<script>
(function(){
'use strict';
var APP='course-bio', VP=Vault.progress(APP), VD=Vault.drill(APP), VM=Vault.meta(APP);
var UNITS=SV_BANK, BYID={}, ALL=[];
UNITS.forEach(function(u){ u.problems.forEach(function(p){ p._unit=u; BYID[p.id]=p; ALL.push(p); }); });
var LAYERS=['concept','derive','worked'], LAYER_KO={concept:'개념',derive:'수식·유도',worked:'풀이된 예제'};
/* 빈 레이어는 숨긴다 — 개념 과목(course-bio)은 derive·worked 가 없다 */
function hasLayer(c,l){ return l==='concept' || (l==='derive' ? (c.derive||[]).length>0 : !!c[l]); }
var $=function(s,el){ return (el||document).querySelector(s); };
var esc=function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
function typeset(el){
  if(window.MathJax&&window.__mjready){ MathJax.typesetPromise([el]).catch(function(){}); }
  else { (window.__mjq=window.__mjq||[]).push(el); }
}

/* ---------- 파라미터 추출/리롤 (러너와 동일 규칙) ---------- */
function draw(spec){ 
  if(spec.choices) return spec.choices[Math.floor(Math.random()*spec.choices.length)];
  var steps=Math.round((spec.max-spec.min)/spec.step);
  return spec.min+spec.step*Math.floor(Math.random()*(steps+1));
}
function sample(prob){
  for(var t=0;t<500;t++){
    var p={}; for(var k in prob.params) p[k]=draw(prob.params[k]);
    if(!prob.constraint||prob.constraint(p)) return p;
  }
  return null;
}
var CUR={}; // 문제별 현재 파라미터
function statementOf(prob){
  if(!prob.params) return (typeof prob.statement==='function')?prob.statement({}):prob.statement;
  if(!CUR[prob.id]) CUR[prob.id]=sample(prob);
  return prob.statement(CUR[prob.id]);
}
function ansText(r){
  if(r==null) return '';
  var a=r.ans, u=r.unit;
  if(typeof a==='number') return SVH.fmt(a)+' '+(u||'');
  var parts=[]; for(var k in a){ parts.push(k+' = '+SVH.fmt(a[k])+' '+((u&&u[k])||'')); }
  return parts.join(' · ');
}

/* ---------- 진도 ---------- */
function readItems(){ var ids=[]; UNITS.forEach(function(u){ LAYERS.filter(function(l){ return hasLayer(SV_CONTENT[u.id]||{},l); }).forEach(function(l){ ids.push(u.id+'-'+l); }); }); return ids; }

  $('#ptxt').textContent='읽음 '+n+' / '+ids.length+' · 문제 '+VD.counts().total+'/'+ALL.length;
  document.querySelectorAll('.readbtn[data-read]').forEach(function(b){
    var on=VP.get(b.getAttribute('data-read'));
    b.setAttribute('aria-pressed',on?'true':'false');
    b.textContent=on?'✓ 읽음':'읽음으로 표시';
  });
  var wc=wrongList().length, badge=$('#nav-wrong .nv'); if(badge) badge.textContent=wc||'';
}

  var all=VD.all(), ids=[];
  for(var k in all){ if((all[k]==='wrong'||all[k]==='partial')&&BYID[k]) ids.push(k); }
  return ids;
}

/* ---------- 문제 카드 ---------- */
function grade(prob, status, card){
  VD.set(prob.id, status);
  card.querySelectorAll('.pbtn.sel').forEach(function(b){ b.classList.remove('sel'); });
  var btn=card.querySelector('.pbtn.grade-'+status[0]); if(btn) btn.classList.add('sel');
  var dot=card.querySelector('.sdot'); if(dot){ dot.className='sdot '+status; }
  refreshProg();
  if(EXAM.running) examAnswered(prob.id, status);
}
function renderProblem(prob){
  var card=document.createElement('article'); card.className='pcard'; card.setAttribute('data-pid',prob.id);
  var st=VD.get(prob.id);
  var srcb=prob.src?'<span class="srcb">'+esc(prob.src)+'</span>':'';
  if(prob.ref) srcb+='<span class="srcb">근거 '+esc(prob.ref)+'</span>';
  card.innerHTML='<div class="pc-head"><span class="lv lv'+prob.level+'">L'+prob.level+'</span>'+
    '<span class="tagc">'+esc(prob.id)+' · '+esc((prob.tags||[]).join('·'))+'</span>'+srcb+
    '<span class="sdot'+(st?' '+st:'')+'"></span></div>'+
    '<div class="pc-st"></div><div class="pc-body"></div><div class="pc-btns"></div>';
  var stEl=$('.pc-st',card), body=$('.pc-body',card), btns=$('.pc-btns',card);
  stEl.innerHTML=statementOf(prob);

  function addBtn(label, cls, fn){
    var b=document.createElement('button'); b.type='button'; b.className='pbtn'+(cls?' '+cls:''); b.textContent=label;
    b.addEventListener('click',fn); btns.appendChild(b); return b;
  }
  function gradeBtns(){
    addBtn('맞음 ✓','grade-c',function(){ grade(prob,'correct',card); });
    addBtn('부분 △','grade-p',function(){ grade(prob,'partial',card); });
    addBtn('틀림 ✗','grade-w',function(){ grade(prob,'wrong',card); });
    if(st){ var b=card.querySelector('.pbtn.grade-'+st[0]); if(b) b.classList.add('sel'); }
  }

  if(prob.type==='mc'||prob.type==='tf'){
    var choices = prob.type==='tf' ? ['참 (O)','거짓 (X)'] : prob.choices;
    var correctIdx = prob.type==='tf' ? (prob.answer?0:1) : prob.answer;
    var wrap=document.createElement('div'); wrap.className='choices';
    choices.forEach(function(c,i){
      var b=document.createElement('button'); b.type='button'; b.className='choice'; b.innerHTML=c;
      b.addEventListener('click',function(){
        if(card.__done) return; card.__done=true;
        wrap.children[correctIdx].classList.add('right');
        if(i!==correctIdx) b.classList.add('wrongpick');
        var ex=document.createElement('div'); ex.className='expl'; ex.innerHTML='<b>해설</b> — '+prob.expl;
        body.appendChild(ex); typeset(ex);
        grade(prob, i===correctIdx?'correct':'wrong', card);
      });
      wrap.appendChild(b);
    });
    body.appendChild(wrap);
  } else {
    var hintIdx=0, hb=null;
    if(prob.hints&&prob.hints.length){
      addBtn('💡 힌트','',function(){
        if(hintIdx>=prob.hints.length) return;
        if(!hb){ hb=document.createElement('div'); hb.className='hintbox'; body.appendChild(hb); }
        var d=document.createElement('div'); d.innerHTML='힌트 '+(hintIdx+1)+'. '+prob.hints[hintIdx];
        hb.appendChild(d); typeset(d); hintIdx++;
        this.textContent = hintIdx>=prob.hints.length ? '힌트 끝' : '💡 힌트 '+(hintIdx+1);
      });
    }
    var solBtn=addBtn('풀이 보기','',function(){
      if(card.__sol){ card.__sol.hidden=!card.__sol.hidden; this.textContent=card.__sol.hidden?'풀이 보기':'풀이 닫기'; return; }
      var box=document.createElement('div'); box.className='solbox';
      var steps, aline='';
      if(prob.type==='derive'){ steps=prob.steps; }
      else{
        var r=prob.solve(prob.params?CUR[prob.id]:{});
        steps=r.steps; aline='<div class="ansline">답: '+esc(ansText(r))+'</div>';
      }
      box.innerHTML='<ol>'+steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol>'+aline+
        (prob.expl?'<div class="expl">'+prob.expl+'</div>':'');
      body.appendChild(box); typeset(box);
      card.__sol=box; this.textContent='풀이 닫기';
      if(!card.__graded){ card.__graded=true; gradeBtns(); }
    });
    if(prob.params){
      addBtn('🎲 새 숫자로','',function(){
        CUR[prob.id]=sample(prob);
        stEl.innerHTML=statementOf(prob); typeset(stEl);
        if(card.__sol){ card.__sol.remove(); card.__sol=null; solBtn.textContent='풀이 보기'; }
        if(hb){ hb.remove(); hb=null; hintIdx=0; }
      });
    }
    if(st&&!card.__graded){ card.__graded=true; gradeBtns(); }
  }
  return card;
}

    (SV_CONTENT.course?'<details class="layer" open><summary><span class="lb">MAP</span>과목 큰그림 — 한눈에<span class="arrow">›</span></summary><div class="body">'+SV_CONTENT.course.bigpicture+'</div></details>':'')+
    '<div class="ucards" id="ucards"></div>'+

    '<a class="ucard" href="#exam"><span class="uc-no">MOCK EXAM</span><span class="uc-ti">📝 모의고사</span><span class="uc-scope">범위·난이도·문항수를 골라 랜덤 출제 — 매번 새 수치, 종료 리포트 제공.</span></a>'+
    '<a class="ucard" href="#wrong"><span class="uc-no">RETRY QUEUE</span><span class="uc-ti">🔁 오답노트</span><span class="uc-scope">틀림·부분 문제만 모아 재도전. 맞음으로 바꾸면 큐에서 빠진다.</span></a></div>');
  var uc=$('#ucards');
  UNITS.forEach(function(u){

    var avail=LAYERS.filter(function(l){return hasLayer(SV_CONTENT[u.id]||{},l);});
    var reads=avail.filter(function(l){return VP.get(u.id+'-'+l);}).length;
    var a=document.createElement('a'); a.className='ucard'; a.href='#'+u.id;
    a.innerHTML='<span class="uc-no">UNIT '+u.no+'</span><span class="uc-ti">'+esc(u.title)+'</span>'+
      '<span class="uc-scope">'+esc(u.scope)+'</span>'+
      '<span class="uc-stat">읽음 '+reads+'/'+avail.length+' · 문제 '+solved+'/'+u.problems.length+(solved?' · 정답 '+ok:'')+'</span>';
    uc.appendChild(a);
  });
  typeset(view);
}
function renderUnit(u){
  var c=SV_CONTENT[u.id]||{};
  setView('<div class="eyebrow">UNIT '+u.no+' / '+UNITS.length+'</div><h1>'+esc(u.title)+'</h1>'+
    '<p class="lede">'+esc(u.scope)+'</p><div id="layers"></div>'+
    '<h3>문제 세트 <span class="src">L1 개념확인 → L4 시험급 · '+u.problems.length+'문제</span></h3>'+
    '<div class="filters" id="filters"></div><div id="plist"></div>');
  var layers=$('#layers');
  LAYERS.filter(function(l){ return hasLayer(c,l); }).forEach(function(l){
    var d=document.createElement('details'); d.className='layer'; if(l==='concept') d.open=true;
    var inner='';
    if(l==='derive'){
      (c.derive||[]).forEach(function(dv){
        inner+='<details class="dstep"><summary>'+esc(dv.title)+'</summary><ol>'+
          dv.steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol></details>';
      });
    } else inner=c[l]||'';
    d.innerHTML='<summary><span class="lb">'+(l.toUpperCase())+'</span>'+LAYER_KO[l]+'<span class="arrow">›</span></summary>'+
      '<div class="body">'+inner+'<div class="readrow"><button type="button" class="readbtn" data-read="'+u.id+'-'+l+'"></button></div></div>';
    layers.appendChild(d);
  });
  layers.addEventListener('click',function(e){
    var b=e.target.closest('.readbtn'); if(!b) return;
    VP.toggle(b.getAttribute('data-read')); refreshProg();
  });
  var lv=0, fl=$('#filters'), pl=$('#plist');
  function renderList(){
    pl.innerHTML='';
    u.problems.filter(function(p){ return !lv||p.level===lv; }).forEach(function(p){ pl.appendChild(renderProblem(p)); });
    typeset(pl);
  }
  [['전체',0],['L1 개념',1],['L2 기본',2],['L3 응용',3],['L4 시험급',4]].forEach(function(f){
    var b=document.createElement('button'); b.type='button'; b.className='fchip'+(f[1]===0?' on':''); b.textContent=f[0];
    b.addEventListener('click',function(){ lv=f[1]; fl.querySelectorAll('.fchip').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); renderList(); });
    fl.appendChild(b);
  });
  renderList(); typeset(layers);
}
function renderWrong(){
  var ids=wrongList();
  setView('<div class="eyebrow">RETRY QUEUE</div><h1>오답노트</h1>'+
    '<p class="lede">틀림·부분 표시 문제 '+ids.length+'개. 다시 풀어 <b>맞음</b>으로 바꾸면 큐에서 빠진다. 계산형은 자동으로 새 수치다.</p><div id="plist"></div>');
  var pl=$('#plist');
  if(!ids.length){ pl.innerHTML='<div class="empty">비어 있음 — 문제를 풀고 자가채점하면 틀림/부분이 여기 모인다.</div>'; return; }
  ids.forEach(function(id){ var p=BYID[id]; if(p&&p.params) CUR[id]=sample(p); pl.appendChild(renderProblem(BYID[id])); });
  typeset(pl);
}
/* ---------- 모의고사 ---------- */
var EXAM={running:false};
function renderExam(){
  if(EXAM.running){ renderExamRun(); return; }
  var uchecks=UNITS.map(function(u){ return '<label class="ck"><input type="checkbox" class="exu" value="'+u.id+'" checked> U'+u.no+' '+esc(u.title)+'</label>'; }).join('');
  setView('<div class="eyebrow">MOCK EXAM</div><h1>모의고사</h1>'+
    '<p class="lede">범위와 난이도를 고르면 랜덤 출제. 채점은 문제마다(객관식 자동 · 계산형 자가채점), 종료하면 리포트.</p>'+
    '<div class="exam-setup">'+
    '<div class="grp"><h4>범위</h4>'+uchecks+'</div>'+
    '<div class="grp"><h4>난이도</h4>'+[1,2,3,4].map(function(l){return '<label class="ck"><input type="checkbox" class="exl" value="'+l+'" '+(l>1?'checked':'')+'> L'+l+'</label>';}).join('')+'</div>'+
    '<div class="grp"><h4>문항 수</h4><select id="exn"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>'+
    '<button class="bigbtn" id="exgo">모의고사 시작 →</button></div>');
  $('#exgo').addEventListener('click',function(){
    var us={}, ls={};
    document.querySelectorAll('.exu:checked').forEach(function(c){us[c.value]=1;});
    document.querySelectorAll('.exl:checked').forEach(function(c){ls[+c.value]=1;});
    var pool=ALL.filter(function(p){ return us[p._unit.id]&&ls[p.level]; });
    var n=Math.min(+$('#exn').value, pool.length);
    if(!n){ alert('선택한 범위에 문제가 없습니다'); return; }
    for(var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
    EXAM={running:true, list:pool.slice(0,n), idx:0, res:{}};
    EXAM.list.forEach(function(p){ if(p.params) CUR[p.id]=sample(p); });
    renderExamRun();
  });
}
function examAnswered(pid, status){ if(EXAM.running&&EXAM.res) EXAM.res[pid]=status; }
function renderExamRun(){
  var i=EXAM.idx, p=EXAM.list[i];
  setView('<div class="eyebrow">MOCK EXAM · '+(i+1)+' / '+EXAM.list.length+'</div>'+
    '<div class="exam-top"><span>'+(i+1)+'/'+EXAM.list.length+'</span><div class="bar"><i style="width:'+Math.round(i/EXAM.list.length*100)+'%"></i></div>'+
    '<button class="pbtn" id="exquit">종료</button></div><div id="pslot"></div>'+
    '<div class="pc-btns" style="margin-top:14px"><button class="bigbtn" id="exnext">'+(i+1<EXAM.list.length?'다음 문제 →':'리포트 보기 →')+'</button></div>');
  $('#pslot').appendChild(renderProblem(p)); typeset($('#pslot'));
  $('#exnext').addEventListener('click',function(){
    if(EXAM.idx+1<EXAM.list.length){ EXAM.idx++; renderExamRun(); } else renderExamReport();
  });
  $('#exquit').addEventListener('click',renderExamReport);
}
function renderExamReport(){
  var res=EXAM.res, list=EXAM.list; EXAM.running=false;
  var c=0,pt=0,w=0,na=0;
  var perUnit={};
  list.forEach(function(p){
    var s=res[p.id];
    var u=perUnit[p._unit.id]=perUnit[p._unit.id]||{t:0,c:0,title:p._unit.title,no:p._unit.no};
    u.t++;
    if(s==='correct'){c++;u.c++;} else if(s==='partial'){pt++;} else if(s==='wrong'){w++;} else na++;
  });
  var score=Math.round((c+0.5*pt)/list.length*100);
  var rows=Object.keys(perUnit).sort().map(function(k){var u=perUnit[k];return '<tr><td>U'+u.no+' '+esc(u.title)+'</td><td>'+u.c+' / '+u.t+'</td></tr>';}).join('');
  setView('<div class="eyebrow">MOCK EXAM · REPORT</div><h1>결과 리포트</h1>'+
    '<div class="report"><div class="score">'+score+'점</div>'+
    '<p>맞음 '+c+' · 부분 '+pt+' · 틀림 '+w+(na?' · 무응답 '+na:'')+' (총 '+list.length+'문제)</p>'+
    '<table><thead><tr><th>단원</th><th>정답</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="pc-btns"><a class="pbtn" href="#wrong">🔁 오답노트로</a><a class="pbtn" href="#exam" onclick="">다시 설정</a><a class="pbtn" href="#home">홈</a></div></div>');
}

/* ---------- 내비 · 라우팅 ---------- */
function buildNav(){
  var nav=$('#sidenav'), sheet=$('#tb-sheet');
  var html='<div class="ng">학습</div><a href="#home" data-v="home">홈 · 현황</a>';
  UNITS.forEach(function(u){ html+='<a href="#'+u.id+'" data-v="'+u.id+'">U'+u.no+' '+esc(u.title)+'</a>'; });
  html+='<div class="ng">훈련</div><a href="#wrong" data-v="wrong" id="nav-wrong">오답노트<span class="nv"></span></a><a href="#exam" data-v="exam">모의고사</a>';
  nav.innerHTML=html;
  sheet.innerHTML=UNITS.map(function(u){ return '<a href="#'+u.id+'">U'+u.no+' '+esc(u.title)+'</a>'; }).join('');
}
function route(){
  var h=(location.hash||'#home').slice(1);
  var valid={home:1,wrong:1,exam:1}; UNITS.forEach(function(u){valid[u.id]=1;});
  if(!valid[h]) h='home';
  if(h!=='exam') EXAM.running=false;
  document.querySelectorAll('.side nav a').forEach(function(a){ a.classList.toggle('on',a.getAttribute('data-v')===h); });
  document.querySelectorAll('.tabbar [data-tv]').forEach(function(a){ a.classList.toggle('on',a.getAttribute('data-tv')===h); });
  var sh=$('#tb-sheet'); if(sh) sh.hidden=true;
  VM.touch(location.hash||'#home');
  if(h==='home') renderHome();
  else if(h==='wrong') renderWrong();
  else if(h==='exam') renderExam();
  else renderUnit(UNITS.filter(function(u){return u.id===h;})[0]);
  window.scrollTo(0,0);
  refreshProg();
}
var tbMore=$('#tb-more'), tbSheet=$('#tb-sheet');
if(tbMore){ tbMore.addEventListener('click',function(e){ e.stopPropagation(); tbSheet.hidden=!tbSheet.hidden; });
  document.addEventListener('click',function(e){ if(!tbSheet.hidden&&!tbSheet.contains(e.target)) tbSheet.hidden=true; }); }
window.addEventListener('hashchange',route);
buildNav(); route();
})();
