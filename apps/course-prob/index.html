    solve:function(p){ var v=(p.a+p.b)/p.b;
      return { ans:v, unit:'스텝', steps:[
        'm₁ = 1/π₁ = (a+b)/b = '+SVH.fmt(v)+'스텝',
        '자주 머무는 상태일수록(π↑) 빨리 돌아온다 — 재생 이론(U5)과 만나는 지점: 방문이 재생점' ] }; },
    hints:['카츠 공식 1/π.'] },

  /* ---------- L3 (14) ---------- */
  { id:'u6-l3-01', level:3, type:'num', tags:['3상태 π'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[0.1,0.2,0.3],unit:''}, b:{choices:[0.1,0.2,0.3],unit:''}, c:{choices:[0.1,0.2,0.3],unit:''} },
    statement:function(p){ return 'P의 행: (1−2a, a, a), (b, 1−2b, b), (c, c, 1−2c) — a='+p.a+', b='+p.b+', c='+p.c+'. 정상분포 π=(π₁,π₂,π₃)를 구하라. (π ∝ (1, a/b, a/c))'; },
    solve:function(p){ var w1=1, w2=p.a/p.b, w3=p.a/p.c, s=w1+w2+w3;
      return { ans:{p1:w1/s, p2:w2/s, p3:w3/s}, unit:{p1:'', p2:'', p3:''}, steps:[
        '상세균형: π₁a=π₂b, π₁a=π₃c → π ∝ (1, a/b, a/c) = (1, '+SVH.fmt(w2)+', '+SVH.fmt(w3)+')',
        '정규화 → ('+SVH.fmt(w1/s)+', '+SVH.fmt(w2/s)+', '+SVH.fmt(w3/s)+') — 이탈이 느린 상태(분모 작음)에 몰린다' ] }; },
    hints:['쌍별 유량 균형이 성립하는 구조.'] },
  { id:'u6-l3-02', level:3, type:'num', tags:['3상태 C-K'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[0.2,0.3],unit:''}, b:{choices:[0.1,0.2],unit:''}, c:{choices:[0.2,0.3],unit:''} },
    statement:function(p){ return '위 3상태 P(a='+p.a+', b='+p.b+', c='+p.c+')에서 두 스텝 전이확률 p₁₂⁽²⁾을 구하라.'; },
    solve:function(p){ var r1=[1-2*p.a,p.a,p.a], v=r1[0]*p.a+r1[1]*(1-2*p.b)+r1[2]*p.c;
      return { ans:v, unit:'', steps:[
        '중간 상태 합: p₁₁p₁₂+p₁₂p₂₂+p₁₃p₃₂ = '+SVH.fmt(r1[0]*p.a)+'+'+SVH.fmt(r1[1]*(1-2*p.b))+'+'+SVH.fmt(r1[2]*p.c),
        '= '+SVH.fmt(v)+' — P²의 (1,2): 행렬 곱 한 성분을 손으로' ] }; },
    hints:['행1×열2 내적.'] },
  { id:'u6-l3-03', level:3, type:'num', tags:['공정 파산'], src:'교재 표준',
    params:{ i:{choices:[2,3,5],unit:''}, N:{choices:[8,10],unit:''} },
    constraint:function(p){ return p.i < p.N; },
    statement:function(p){ return '공정 도박(p=1/2): 자본 i='+p.i+', 목표 N='+p.N+'. 목표 달성 확률과 파산 확률을 구하라.'; },
    solve:function(p){ return { ans:{win:p.i/p.N, ruin:1-p.i/p.N}, unit:{win:'', ruin:''}, steps:[
        '공정 게임: P(달성) = i/N = '+p.i+'/'+p.N+' = '+SVH.fmt(p.i/p.N)+' (자본 비례!)',
        'P(파산) = '+SVH.fmt(1-p.i/p.N)+' — 마팅게일 논법의 대표 결과' ] }; },
    hints:['선형 경계값 문제.'] },
  { id:'u6-l3-04', level:3, type:'num', tags:['편향 파산'], src:'교재 표준',
    params:{ pr:{choices:[0.4,0.45,0.6],unit:''}, i:{choices:[3,5],unit:''}, N:{choices:[10],unit:''} },
    statement:function(p){ return '승률 p='+p.pr+'(≠1/2), 자본 i='+p.i+', 목표 N='+p.N+'. 목표 달성 확률 \\(\\frac{1-(q/p)^i}{1-(q/p)^N}\\)은?'; },
    solve:function(p){ var r=(1-p.pr)/p.pr, v=(1-Math.pow(r,p.i))/(1-Math.pow(r,p.N));
      return { ans:v, unit:'', steps:[
        'q/p = '+SVH.fmt(r)+' → (1−r^i)/(1−r^N) = '+SVH.fmt(v),
        (p.pr<0.5?'불리한 게임에선 목표 확률이 지수적으로 붕괴 — 카지노가 이기는 수학':'유리하면 i가 작아도 꽤 높다 — 드리프트의 위력') ] }; },
    hints:['r=q/p 하나로 정리.'] },
  { id:'u6-l3-05', level:3, type:'num', tags:['공정 게임 길이'], src:'교재 표준',
    params:{ i:{choices:[2,4,5],unit:''}, N:{choices:[8,10],unit:''} },
    constraint:function(p){ return p.i < p.N; },
    statement:function(p){ return '공정 도박(i='+p.i+', N='+p.N+')에서 게임이 끝날 때까지의 기대 판 수 E=i(N−i)는?'; },
    solve:function(p){ var v=p.i*(p.N-p.i);
      return { ans:v, unit:'판', steps:[
        'E[T] = i(N−i) = '+p.i+'×'+(p.N-p.i)+' = '+v+'판',
        '가운데서 시작할수록 오래 걸린다(포물선) — 1스텝 조건화(U1 l4-04 틀)로 유도되는 값' ] }; },
    hints:['경계 0, 내부 차분방정식.'] },
  { id:'u6-l3-06', level:3, type:'num', tags:['성공 런'], src:'창작 문제(검산됨)',
    params:{ pr:{choices:[0.5,0.6,0.8],unit:''}, k:{choices:[2,3],unit:''} },
    statement:function(p){ return '성공률 p='+p.pr+' 시행에서 연속 k='+p.k+'회 성공이 처음 나올 때까지의 기대 시행 수 E=(p^{−k}−1)/(1−p)는?'; },
    solve:function(p){ var E=0,j; for(j=1;j<=p.k;j++){ E=(E+1)/p.pr; }
      return { ans:E, unit:'회', steps:[
        '재귀: 런 j−1 달성 후 성공이면 j, 실패면 처음부터 → E_j=(E_{j−1}+1)/p',
        '= '+SVH.fmt(E)+'회 — 상태(현재 런 길이)를 둔 마르코프 1스텝 분석' ] }; },
    hints:['런 길이가 상태다.'] },
  { id:'u6-l3-07', level:3, type:'num', tags:['시장 점유'], src:'기출 유형',
    params:{ a:{choices:[0.1,0.2],unit:''}, b:{choices:[0.2,0.3],unit:''}, N:{choices:[1000,5000],unit:'명'} },
    statement:function(p){ return '매달 우리→경쟁사 이탈률 a='+p.a+', 반대 유입률 b='+p.b+'. 총 '+p.N+'명 시장의 장기 우리 고객 수 N·π₁은?'; },
    solve:function(p){ var v=p.N*p.b/(p.a+p.b);
      return { ans:v, unit:'명', steps:[
        'π₁ = b/(a+b) = '+SVH.fmt(p.b/(p.a+p.b)),
        '×'+p.N+' = '+SVH.fmt(v)+'명 — 초기 점유율과 무관(에르고딕): 이탈·유입률만이 운명을 정한다' ] }; },
    hints:['2상태 π 응용.'] },
  { id:'u6-l3-08', level:3, type:'num', tags:['흡수 기대시간'], src:'창작 문제(검산됨)',
    params:{ a1:{choices:[0.2,0.3],unit:''}, a2:{choices:[0.2,0.3],unit:''}, b1:{choices:[0.1,0.2],unit:''}, b2:{choices:[0.3,0.4],unit:''} },
    statement:function(p){ return '일시 상태 {1,2}, 흡수 상태 3. Q=[['+p.a1+', '+p.a2+'],['+p.b1+', '+p.b2+']] (나머지는 흡수로). 상태 1에서 흡수까지 기대 스텝 t₁을 (I−Q)t=1로 구하라.'; },
    solve:function(p){ var A=1-p.a1, B=-p.a2, C=-p.b1, D=1-p.b2, det=A*D-B*C,
      t1=(D*1-B*1)/det;
      return { ans:t1, unit:'스텝', steps:[
        '(I−Q) = [['+SVH.fmt(A)+', '+SVH.fmt(B)+'],['+SVH.fmt(C)+', '+SVH.fmt(D)+']], 우변 (1,1)',
        't₁ = (D−B)/det = '+SVH.fmt(t1)+'스텝 — 기본 행렬(fundamental matrix) (I−Q)⁻¹의 행합' ] }; },
    hints:['t=1+Qt를 정리하면 (I−Q)t=1.'] },
  { id:'u6-l3-09', level:3, type:'num', tags:['2스텝 분포'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[0.25,0.35],unit:''}, b:{choices:[0.15,0.45],unit:''} },
    statement:function(p){ return '상태 1에서 출발(a='+p.a+', b='+p.b+'). 두 스텝 뒤 상태 2에 있을 확률 p₁₂⁽²⁾은?'; },
    solve:function(p){ var v=(1-p.a)*p.a+p.a*(1-p.b);
      return { ans:v, unit:'', steps:[
        '1→1→2 ('+SVH.fmt((1-p.a)*p.a)+') + 1→2→2 ('+SVH.fmt(p.a*(1-p.b))+')',
        '= '+SVH.fmt(v)+' — 검산: p₁₁⁽²⁾+p₁₂⁽²⁾=1' ] }; },
    hints:['두 경로 합.'] },
  { id:'u6-l3-10', level:3, type:'num', tags:['체류 분포'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[0.2,0.4],unit:''}, m:{choices:[2,3,4],unit:''} },
    statement:function(p){ return '상태 1 이탈률 a='+p.a+'. 정확히 m='+p.m+'스텝 머문 뒤 이탈할 확률 (1−a)^{m−1}a는?'; },
    solve:function(p){ var v=Math.pow(1-p.a,p.m-1)*p.a;
      return { ans:v, unit:'', steps:[
        'P(체류='+p.m+') = (1−a)^{m−1}a = '+SVH.fmt(v),
        '기하분포 그 자체 — 연속시간 판(후반부)에선 이 자리가 지수분포로 바뀐다' ] }; },
    hints:['버티기 m−1번, 이탈 1번.'] },
  { id:'u6-l3-11', level:3, type:'num', tags:['출생사망 π'], src:'창작 문제(검산됨)',
    params:{ pu:{choices:[0.2,0.3],unit:''}, pd:{choices:[0.1,0.4],unit:''} },
    statement:function(p){ return '상태 {0,1,2} 출생사망 연쇄: 위로 p='+p.pu+', 아래로 q='+p.pd+'(경계는 반사, 나머진 제자리). 상세균형 π∝(1, p/q, (p/q)²)로 π₀와 π₂를 구하라.'; },
    solve:function(p){ var r=p.pu/p.pd, s=1+r+r*r;
      return { ans:{p0:1/s, p2:r*r/s}, unit:{p0:'', p2:''}, steps:[
        '상세균형 π_{i}p = π_{i+1}q → 비율 r=p/q='+SVH.fmt(r)+' 등비',
        'π₀ = 1/(1+r+r²) = '+SVH.fmt(1/s)+', π₂ = r²/합 = '+SVH.fmt(r*r/s)+' — 대기행렬(후반부 M/M/1)의 뼈대' ] }; },
    hints:['이웃 간 유량 균형.'] },
  { id:'u6-l3-12', level:3, type:'num', tags:['장기 보상'], src:'강의자료 대조',
    params:{ a:{choices:[0.2,0.3],unit:''}, b:{choices:[0.3,0.4],unit:''}, r1:{choices:[100,200],unit:'만원'}, r2:{choices:[20,50],unit:'만원'} },
    statement:function(p){ return '상태 1(가동, 스텝당 '+p.r1+'만원)·상태 2(정비, '+p.r2+'만원), a='+p.a+', b='+p.b+'. 장기 평균 보상률 Σπᵢrᵢ는?'; },
    solve:function(p){ var s=p.a+p.b, v=p.b/s*p.r1+p.a/s*p.r2;
      return { ans:v, unit:'만원/스텝', steps:[
        'π = ('+SVH.fmt(p.b/s)+', '+SVH.fmt(p.a/s)+')',
        'rate = '+SVH.fmt(v)+'만원/스텝 — 마르코프 보상 = π 가중평균: U5 재생보상과 한 가족' ] }; },
    hints:['π 구하고 내적.'] },
  { id:'u6-l3-13', level:3, type:'num', tags:['수렴 스텝 수'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[0.2,0.3],unit:''}, b:{choices:[0.2,0.4],unit:''}, eps:{choices:[0.01,0.001],unit:''} },
    statement:function(p){ return 'a='+p.a+', b='+p.b+' 연쇄에서 과도항이 ε='+p.eps+' 이하가 되는 최소 스텝 수 n=ln(ε)/ln|1−a−b|(실수값)는?'; },
    solve:function(p){ var v=Math.log(p.eps)/Math.log(Math.abs(1-p.a-p.b));
      return { ans:v, unit:'스텝', steps:[
        '|1−a−b|ⁿ ≤ ε → n ≥ ln ε/ln|1−a−b| = '+SVH.fmt(Math.log(p.eps))+'/'+SVH.fmt(Math.log(Math.abs(1-p.a-p.b))),
        '= '+SVH.fmt(v)+'스텝 — 믹싱 타임의 1차 감각: 이후는 초기 조건이 사실상 지워진 상태' ] }; },
    hints:['로그로 n을 꺼낸다.'] },
  { id:'u6-l3-14', level:3, type:'num', tags:['자기상관'], src:'교재 표준',
    params:{ a:{choices:[0.2,0.3],unit:''}, b:{choices:[0.3,0.5],unit:''} },
    statement:function(p){ return '정상 상태의 2상태 연쇄(a='+p.a+', b='+p.b+')에서 상태 1 지시변수의 lag-1 자기상관 Corr(I_n, I_{n+1})=1−a−b는?'; },
    solve:function(p){ var v=1-p.a-p.b;
      return { ans:v, unit:'', steps:[
        '두 번째 고유값이 그대로 자기상관: 1−a−b = '+SVH.fmt(v),
        (v>0?'양(+): 상태가 끈적하다(관성)':'음(−): 매 스텝 튀는 경향(진동)')+' — 시계열 관점에서 본 마르코프 연쇄' ] }; },
    hints:['감쇠 인자=상관.'] },

  /* ---------- L4 (8) ---------- */
  { id:'u6-l4-01', level:4, type:'derive', tags:['C-K 유도'], src:'강의자료 대조',
    statement:'채프먼-콜모고로프 방정식 \\(p_{ij}^{(m+n)}=\\sum_k p_{ik}^{(m)}p_{kj}^{(n)}\\)을 유도하고 행렬 거듭제곱 해석을 밝혀라.',
    steps:[
      '중간 시점 m의 상태 k로 분할: P(X_{m+n}=j|X₀=i) = Σ_k P(X_m=k|X₀=i)P(X_{m+n}=j|X_m=k, X₀=i) [왜] U1 전확률 분해',
      '마르코프성으로 마지막 조건에서 X₀ 삭제: = Σ_k p_{ik}^{(m)}p_{kj}^{(n)}',
      '이 합은 정확히 행렬 곱의 (i,j) 성분 → P^{(m+n)}=P^{(m)}P^{(n)}',
      '귀납으로 P^{(n)}=Pⁿ — "n스텝 미래 = 행렬 n제곱": 계산·고유값 분석·수렴 이론이 전부 여기서 출발',
      '극한 체크: n=1 ⇒ 자명 ✓ · 행합 보존: Pⁿ도 확률행렬 ✓ · 대각화하면 고유값ⁿ — 수렴 속도(u6-l2-11)의 근거 ✓'
    ],
    hints:['전확률+마르코프성 두 줄.','합의 모양=행렬 곱.'],
    expl:'강의 개요 "행렬 관점에서의 마르코프 연쇄 분석"의 헌법 조항 — 이후 모든 계산이 이 등식의 각주다.' },
  { id:'u6-l4-02', level:4, type:'num', tags:['도박꾼 종합'], src:'기출 유형',
    params:{ pr:{choices:[0.45,0.48],unit:''}, i:{choices:[5,10],unit:''}, N:{choices:[20],unit:''} },
    statement:function(p){ return '승률 p='+p.pr+', 자본 i='+p.i+', 목표 N='+p.N+'. 목표 달성 확률과 파산 확률을 구하라.'; },
    solve:function(p){ var r=(1-p.pr)/p.pr, w=(1-Math.pow(r,p.i))/(1-Math.pow(r,p.N));
      return { ans:{win:w, ruin:1-w}, unit:{win:'', ruin:''}, steps:[
        'r=q/p='+SVH.fmt(r)+': P(달성) = (1−r^i)/(1−r^N) = '+SVH.fmt(w),
        'P(파산) = '+SVH.fmt(1-w)+' — 승률 몇 %p 차이가 지수 r^i로 증폭되는 것을 눈으로 확인' ] }; },
    hints:['미세한 편향의 지수적 결과.'] },
  { id:'u6-l4-03', level:4, type:'derive', tags:['2상태 완전 해'], src:'교재 표준',
    statement:'2상태 연쇄 P=[[1−a,a],[b,1−b]]의 정상분포와 n스텝 폐형식 \\(p_{11}^{(n)}=\\frac{b}{a+b}+\\frac{a}{a+b}(1-a-b)^n\\)을 유도하라.',
    steps:[
      '정상: πP=π ⇒ aπ₁=bπ₂ (유출=유입), Σπ=1 ⇒ π=(b, a)/(a+b) [왜] 균형식 하나+정규화면 2상태는 끝',
      '점화식: p₁₁^{(n+1)} = p₁₁^{(n)}(1−a)+(1−p₁₁^{(n)})b — 1스텝 조건화',
      '정리: x_{n+1} = b+(1−a−b)x_n — 아핀 점화식, 고정점 x*=b/(a+b)',
      '편차 y_n=x_n−x*는 등비(공비 1−a−b) → x_n = x*+(1−x*)(1−a−b)ⁿ (x₀=1 대입) = 폐형식',
      '극한 체크: n→∞ ⇒ π₁ (0<a+b<2일 때) ✓ · a+b=1 ⇒ 한 스텝 만에 평형(공비 0) ✓ · a=b=0 ⇒ 움직이지 않음 ✓'
    ],
    hints:['고정점+등비 편차 — 등비수열 문제로 환원.','U6 전체에서 가장 재사용되는 유도.'],
    expl:'경사하강 수렴(ML)·RC 방전(회로)과 같은 "고정점+기하 감쇠" 구조 — 과목을 넘나드는 패턴이다.' },
  { id:'u6-l4-04', level:4, type:'num', tags:['흡수 2문제'], src:'기출 유형',
    params:{ a:{choices:[0.3,0.4],unit:''}, pA:{choices:[0.2,0.3],unit:''}, b:{choices:[0.2,0.3],unit:''}, pB:{choices:[0.3,0.4],unit:''} },
    constraint:function(p){ return (1-p.a-p.pA) >= 0.05 && (1-p.b-p.pB) >= 0.05; },
    statement:function(p){ return '일시 {1,2}, 흡수 {A,B}: 1에서 →2 확률 '+p.a+', →A '+p.pA+', 잔류 나머지 / 2에서 →1 확률 '+p.b+', →B '+p.pB+', 잔류 나머지. 상태 1의 A-흡수 확률 h₁과 기대 흡수시간 t₁을 구하라.'; },
    solve:function(p){ var s1=1-p.a-p.pA, s2=1-p.b-p.pB,
      A11=1-s1, A12=-p.a, A21=-p.b, A22=1-s2, det=A11*A22-A12*A21,
      h1=(A22*p.pA-A12*0)/det, t1=(A22*1-A12*1)/det;
      return { ans:{h1:h1, t1:t1}, unit:{h1:'', t1:'스텝'}, steps:[
        '(I−Q)h=(p_A, 0): h₁ = '+SVH.fmt(h1)+' — A로 끝날 확률',
        '(I−Q)t=(1, 1): t₁ = '+SVH.fmt(t1)+'스텝 — 같은 행렬, 우변만 교체: 흡수 분석의 이중 사용' ] }; },
    hints:['h와 t가 같은 (I−Q)를 공유.'] },
  { id:'u6-l4-05', level:4, type:'num', tags:['선형 미로'], src:'창작 문제(검산됨)',
    params:{ r:{choices:[0.2,0.3,0.4],unit:''} },
    statement:function(p){ return '방 1→2→3→출구 선형 미로: 각 방에서 전진 확률 1−r, 후퇴(방 1은 제자리) 확률 r='+p.r+'. 방 1에서 출구까지 기대 이동 횟수 t₁을 구하라.'; },
    solve:function(p){ var f=1-p.r,
      // t3=1+r*t2, t2=1+r*t1+f*t3, t1=1+r*t1+f*t2 → 3원 연립을 직접 소거
      // t1=(1+f*t2)/f? from t1: t1(1-r)=1+f t2 → t1=(1+f t2)/f
      // 대입 소거를 수치로: 선형계 풀기
      a11=1-p.r, a12=-f, a13=0, b1=1,
      a21=-p.r, a22=1, a23=-f, b2=1,
      a31=0, a32=-p.r, a33=1, b3=1;
      // 3x3 가우스 소거
      var m=[[a11,a12,a13,b1],[a21,a22,a23,b2],[a31,a32,a33,b3]], i,j,k2,piv;
      for(i=0;i<3;i++){ piv=m[i][i];
        for(j=i;j<4;j++) m[i][j]/=piv;
        for(k2=0;k2<3;k2++){ if(k2!==i){ var fac=m[k2][i]; for(j=i;j<4;j++) m[k2][j]-=fac*m[i][j]; } } }
      return { ans:m[0][3], unit:'회', steps:[
        't₁=1+r·t₁+(1−r)t₂, t₂=1+r·t₁+(1−r)t₃, t₃=1+r·t₂ 의 3원 연립',
        '가우스 소거 → t₁ = '+SVH.fmt(m[0][3])+'회 — 1스텝 조건화(U1 l4-04)의 다상태 확장' ] }; },
    hints:['각 방의 기대시간에 연립.'] },
  { id:'u6-l4-06', level:4, type:'derive', tags:['상태분류·극한'], src:'교재 표준',
    statement:'상태 분류(재귀/일시·주기)와 유한 기약·비주기 연쇄의 극한 정리를 서사로 정리하라.',
    steps:[
      '재귀(recurrent): 돌아올 확률 1 / 일시(transient): <1 — 유한 기약 연쇄는 전부 재귀 [왜] 어딘가는 무한히 방문해야 하고 왕래 가능하면 전염된다',
      '주기 d: 복귀 가능 시점들의 최대공약수. d=1이면 비주기 — p_{ii}>0 하나만 있어도 비주기',
      '기약+비주기(에르고딕) ⇒ Pⁿ의 모든 행이 π로 수렴: 초기 조건 망각',
      '해석 3종 세트: π = ①정상분포(πP=π) ②극한분포(n→∞) ③장기 체류 비율(시간 평균) — 에르고딕 정리로 셋이 일치',
      '극한 체크: 주기 2 반례(0↔1 확정 이동)는 πP=π는 있으나 Pⁿ 진동 — 조건의 필요성 확인 ✓ · 가약 반례: 두 섬이면 초기 의존 ✓'
    ],
    hints:['정의→조건→수렴→해석 순서.','반례 두 개가 서술형 만점 포인트.'],
    expl:'"π를 구하라"가 정당한 질문이 되는 조건을 명시하는 단원의 이론적 지붕.' },
  { id:'u6-l4-07', level:4, type:'num', tags:['비용 종합'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[0.2,0.3],unit:''}, b:{choices:[0.3,0.4],unit:''}, r1:{choices:[50,80],unit:'만원'}, r2:{choices:[10,20],unit:'만원'}, c:{choices:[30,60],unit:'만원'} },
    statement:function(p){ return '상태별 스텝 수익(가동 '+p.r1+', 정비 '+p.r2+'만원), 상태 전환(1→2 또는 2→1)마다 수수료 '+p.c+'만원(a='+p.a+', b='+p.b+'). 장기 순수익률 Σπᵢrᵢ − c(π₁a+π₂b)는?'; },
    solve:function(p){ var s=p.a+p.b, p1=p.b/s, p2=p.a/s, v=p1*p.r1+p2*p.r2-p.c*(p1*p.a+p2*p.b);
      return { ans:v, unit:'만원/스텝', steps:[
        'π = ('+SVH.fmt(p1)+', '+SVH.fmt(p2)+'), 전환 빈도 = π₁a+π₂b = '+SVH.fmt(p1*p.a+p2*p.b)+'/스텝',
        '순수익률 = '+SVH.fmt(v)+'만원/스텝 — 상태 보상+전이 비용이 모두 π로 계산되는 종합형' ] }; },
    hints:['전환 빈도도 π 가중.'] },
  { id:'u6-l4-08', level:4, type:'num', tags:['재방문·재생 다리'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[0.25,0.4],unit:''}, b:{choices:[0.2,0.5],unit:''}, T:{choices:[100,300],unit:'스텝'} },
    statement:function(p){ return 'a='+p.a+', b='+p.b+' 연쇄를 T='+p.T+'스텝 돌릴 때 상태 1 방문 기대 횟수(≈Tπ₁)와 평균 재방문 간격(1/π₁)을 구하라.'; },
    solve:function(p){ var p1=p.b/(p.a+p.b);
      return { ans:{visits:p.T*p1, gap:1/p1}, unit:{visits:'회', gap:'스텝'}, steps:[
        '방문 횟수 ≈ Tπ₁ = '+p.T+'×'+SVH.fmt(p1)+' = '+SVH.fmt(p.T*p1)+'회',
        '재방문 간격 = 1/π₁ = '+SVH.fmt(1/p1)+'스텝 — 상태 1 방문을 재생점으로 보면 U5 장기율 정리(N(t)/t→1/μ)와 동일 문장' ] }; },
    hints:['마르코프↔재생의 왕복 번역.'] }

]});

</script>

<script>
window.SV_CONTENT = {"course": {"bigpicture": "\n<p><b>이 과목의 단 하나의 물음</b> — 무작위가 <b>시간 위에서 흘러갈 때</b>, 그 흐름을 어떻게 계산 가능한 수학으로 만들 것인가.\n확률변수<span class=\"en\">(random variable)</span> 하나가 \"한 번의 우연\"이라면,\n확률과정<span class=\"en\">(stochastic process)</span> \\(\\{X(t)\\}\\)는 \"우연의 궤적\"이다.\n서버로 밀려오는 요청, 부품의 고장과 교체, 고객의 브랜드 이동 — 전부 이 궤적의 사례다.</p>\n<p><b>중간범위의 서사는 세 막이다.</b></p>\n<p>① <b>기억 없음의 발견 (U1→U2)</b>: 확률의 문법(조건부·기댓값)을 복습하고 확률과정의 지도를 그린 뒤(U1),\n연속분포 중 유일하게 \"과거를 묻지 않는\" 지수분포<span class=\"en\">(exponential distribution)</span>를 만난다(U2).\n무기억성 \\(P(X>s+t\\mid X>s)=P(X>t)\\)이 이 과목 전반부의 엔진이다.</p>\n<p>② <b>완전한 우연의 흐름 (U3→U4)</b>: 지수 간격을 이어 붙이면 포아송과정<span class=\"en\">(Poisson process)</span>이 태어난다(U3).\n그리고 이 흐름은 합쳐도(중첩), 확률로 걸러도(분해) 다시 포아송이다(U4) — 무작위 흐름의 대수학.</p>\n<p>③ <b>일반화 두 방향 (U5→U6)</b>: 간격의 지수 조건을 버리면 재생과정<span class=\"en\">(renewal process)</span> —\n평균만으로 장기율과 보상률이 나오고, 검사역설이라는 반전이 기다린다(U5).\n시간을 이산화하고 상태 사이의 이동으로 보면 마르코프 연쇄<span class=\"en\">(Markov chain)</span> —\n행렬 \\(P\\) 하나로 미래 전체를 계산한다(U6).</p>\n<div class=\"mapline\">U1 확률 문법·과정의 지도 → U2 지수분포(무기억) → U3 포아송과정 → U4 중첩·분해 → U5 재생·보상 → U6 마르코프 연쇄 ⇒ (기말) 연속시간 마르코프 → 출생사망 → 대기행렬</div>\n<p><b>시험 전략</b> — 중간 45%는 <b>객관식+단답형</b>(강의계획서 확정). 이 앱의 mc가 객관식을, num이 단답형을 겨눈다.\n반복 출제 축은 셋: <b>[개념]</b> 무기억성·독립증분·분해 독립성·검사역설·마르코프성의 정확한 진술,\n<b>[계산]</b> \\(e^{-\\lambda t}\\) 꼬리, 포아송 pmf, \\(\\lambda_i/\\sum\\lambda\\) 경쟁, \\(E[R]/E[X]\\) 보상률, \\(\\pi P=\\pi\\),\n<b>[함정]</b> 단위(λt 무차원), \"평균 대기=간격 평균의 절반\"(검사역설로 오답), 분해 후 독립성.</p>"}, "u1": {"concept": "\n<div class=\"bigpic\"><span class=\"bt\">U1 큰그림</span>\n이 단원은 두 가지 일을 한다. 첫째, 전산수학에서 배운 확률의 문법 — 조건부확률·전확률·베이즈·기댓값·분산·주요 분포 — 를\n\"이 과목이 실제로 쓰는 형태\"로 재정비한다(선수과목 가정이라 강의는 빠르게 지나가지만, 여기서 무너지면 U3부터 전부 무너진다).\n둘째, 확률과정이라는 새 대상을 정의하고 2×2 지도를 그린다. 이후 다섯 단원은 전부 이 지도의 특정 칸을 탐사하는 여행이다.</div>\n\n<h4>1. 확률의 세 기둥 — 조건부·전확률·베이즈 <span class=\"en\">(Conditional Probability, Total Probability &amp; Bayes)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — \"서버가 다운됐다\"는 관측 하나로 \"원인이 디스크일 확률\"을 갱신하고 싶다.\n정보가 확률을 바꾸는 규칙이 필요하다.</div>\n<p><b>개념 등장</b> — 조건부확률은 우주를 줄이는 연산이다:</p>\n<p>\\[ P(A\\mid B)=\\frac{P(A\\cap B)}{P(B)} \\qquad(P(B)>0) \\]</p>\n<p>\"B가 일어난 세계\"로 표본공간을 줄이고 그 안에서 A의 비중을 잰다. 여기서 두 정리가 기계적으로 따라온다.\n표본공간을 칸막이 \\(\\{B_i\\}\\)(분할<span class=\"en\">(partition)</span>)로 나누면:</p>\n<p>\\[ \\text{전확률: } P(A)=\\sum_i P(B_i)\\,P(A\\mid B_i) \\qquad\n\\text{베이즈: } P(B_j\\mid A)=\\frac{P(B_j)P(A\\mid B_j)}{\\sum_i P(B_i)P(A\\mid B_i)} \\]</p>\n<p>전확률은 \"시나리오별 가중평균\"이고, 베이즈는 그 분모 위에서 사전확률<span class=\"en\">(prior)</span>을\n사후확률<span class=\"en\">(posterior)</span>로 갱신한다. 독립<span class=\"en\">(independence)</span>은\n\\(P(A\\cap B)=P(A)P(B)\\) — \"B를 알아도 A가 안 바뀐다\"의 수식 번역이다.</p>\n<p class=\"intuit\">💡 <b>직관</b> — 조건부확률은 나눗셈, 전확률은 가중평균, 베이즈는 그 둘의 왕복이다. 세 개가 한 몸.</p>\n<p>🔗 <b>연결</b> — U3 포아송의 결합확률 분해, U6 마르코프의 C-K 방정식이 전부 전확률 논법의 반복이다. 이 절 없이는 한 발도 못 간다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] 공장 양품(u1-l2-03/04), 진단검사 PPV(u1-l3-01 — 희귀병 함정), 몬티홀(u1-l4-02). [서술] 전확률+베이즈 유도(u1-l4-01). [개념] 독립 vs 배반 구별.</div>\n\n<h4>2. 기댓값·분산과 그 문법 <span class=\"en\">(Expectation &amp; Variance)</span><span class=\"tagm\">계산 필수</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 랜덤한 양(대기시간, 비용)을 하나의 수로 요약하고, 요약이 얼마나 믿을 만한지도 재야 한다.</div>\n<p><b>공식과 지름길</b> — 기댓값 \\(E[X]=\\sum x\\,p(x)\\) 또는 \\(\\int x f(x)dx\\)는 확률 가중 무게중심.\n분산은 정의식보다 <b>지름길</b>로 계산한다:</p>\n<p>\\[ \\mathrm{Var}(X)=E[X^2]-(E[X])^2 \\]</p>\n<p>연산 규칙 세 개가 실전의 전부다: ① <b>선형성</b> \\(E[aX+bY]=aE[X]+bE[Y]\\) — 독립이 아니어도 항상.\n② \\(\\mathrm{Var}(aX+b)=a^2\\mathrm{Var}(X)\\) — 이동은 무력, 배율은 제곱.\n③ 독립이면 \\(\\mathrm{Var}(X+Y)=\\mathrm{Var}(X)+\\mathrm{Var}(Y)\\).\n두 변수의 동행은 공분산 \\(\\mathrm{Cov}(X,Y)=E[XY]-E[X]E[Y]\\)과 그 무차원판 상관계수 \\(\\rho=\\mathrm{Cov}/(\\sigma_X\\sigma_Y)\\)로 잰다.</p>\n<p>조건부의 기댓값 버전이 <b>타워 법칙</b><span class=\"en\">(law of iterated expectation)</span>과 <b>전분산 공식</b>이다:</p>\n<p>\\[ E[X]=E\\big[E[X\\mid Y]\\big] \\qquad\n\\mathrm{Var}(X)=E[\\mathrm{Var}(X\\mid Y)]+\\mathrm{Var}(E[X\\mid Y]) \\]</p>\n<p>\"시나리오 안 흩어짐 + 시나리오 간 흩어짐\". 이 공식이 U4 복합 포아송 분산의 유일한 유도 경로다.</p>\n<p class=\"intuit\">💡 <b>직관</b> — 평균은 아무 조건 없이 더해지고, 분산은 독립일 때만 더해진다. 이 비대칭이 계산 실수의 8할을 만든다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] E·Var 지름길(u1-l2-05/06), 타워(u1-l3-05), 전분산 혼합(u1-l4-07 — U4 l4-03의 예습). [개념] 선형성의 무조건성.</div>\n\n<h4>3. 이 과목이 쓰는 분포 사전 <span class=\"en\">(Distribution Toolbox)</span><span class=\"tagm\">계산 필수</span></h4>\n<p>이후 단원에서 실제로 등장하는 것만 추리면 다섯이다. 각 분포는 \"어떤 우연의 모형인가\"로 기억한다:</p>\n<p>· <b>베르누이/이항</b> \\(B(n,p)\\): 성공 횟수. \\(P(X=k)=\\binom{n}{k}p^k(1-p)^{n-k}\\), \\(E=np\\), \\(\\mathrm{Var}=np(1-p)\\) — U3 조건부 균등성·U4 분해에서 재등장.<br>\n· <b>기하</b><span class=\"en\">(geometric)</span>: 첫 성공까지 시행 수. \\(P(X=k)=(1-p)^{k-1}p\\), \\(E=1/p\\) — <b>이산 무기억</b>. U6 체류시간이 이것.<br>\n· <b>포아송</b>: 희귀 사건 건수. \\(P(X=k)=e^{-\\mu}\\mu^k/k!\\), \\(E=\\mathrm{Var}=\\mu\\) — 이항의 \\(n\\to\\infty, np\\to\\mu\\) 극한. U3의 주인공.<br>\n· <b>균등</b> \\(U(a,b)\\): 무정보 위치. U3 조건부 균등성·U5 검사역설 예제의 단골.<br>\n· <b>지수</b> \\(Exp(\\lambda)\\): 무기억 대기시간. \\(P(X>t)=e^{-\\lambda t}\\), \\(E=1/\\lambda\\) — U2에서 단원 전체로 다룬다.</p><div class=\"jsbox\"><span class=\"jt\">정석 1.1</span>이항→포아송 근사: n 크고 p 작을 때 \\(B(n,p)\\approx Poisson(np)\\). n=100, p=0.02면 두 값이 소수 셋째 자리까지 일치(u1-l3-07). 이 극한이 U3 포아송과정 공리('미소구간 도착확률 λh')의 밑그림 — '많은 기회 × 작은 확률 = 포아송'은 과목 전체의 배경음이다.</div>\n<h4>4. 확률과정 — 우연의 궤적 <span class=\"en\">(Stochastic Process &amp; Sample Path)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 확률변수는 \"주사위 한 번\"이다. 그런데 서버 대기열은 매 순간 값이 있고, 그 값들이 서로 얽혀 있다.\n시간 축 전체를 하나의 확률 대상으로 봐야 한다.</div>\n<p><b>개념 등장</b> — 확률과정은 시간 지표가 붙은 확률변수의 족이다:</p>\n<p>\\[ \\{X(t),\\ t\\in T\\} \\]</p>\n<p>실험을 한 번 수행하면 숫자가 아니라 <b>시간 함수 하나</b> — 표본경로<span class=\"en\">(sample path)</span> — 가 뽑힌다.\n분류는 두 물음으로: 값이 셀 수 있는가(<b>상태공간</b><span class=\"en\">(state space)</span> 이산/연속),\n관측 시점이 셀 수 있는가(<b>시간지표</b><span class=\"en\">(index set)</span> 이산/연속). 2×2 지도가 나온다:</p>\n<p>· 이산상태 × 이산시간: 마르코프 연쇄(U6) — 매일의 날씨, 브랜드 선택<br>\n· 이산상태 × 연속시간: <b>포아송과정(U3~U4)·재생과정(U5)</b> — 시각 t까지의 도착 건수<br>\n· 연속상태 × 이산시간: 시계열 — 매일 종가<br>\n· 연속상태 × 연속시간: 브라운 운동류 — 이 과목 범위 밖</p>\n<p class=\"intuit\">💡 <b>직관</b> — 지도를 알면 범위가 보인다: 이 과목 전반부는 \"이산상태\" 줄만 오간다. 계수과정 N(t)는 그중 계단형 경로다.</p>\n<p>🔗 <b>연결</b> — 다음 단원(U2)은 이 지도에 올릴 첫 과정을 만들기 위한 재료 손질이다: 계단 사이 \"간격\"의 분포로 무엇을 쓸 것인가.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[개념] 2×2 짝짓기(u1-l1-02), 표본경로의 뜻(u1-l1-03). [서술] 지도 그리기+과목 로드맵 배치(u1-l4-08 — W1 강의 그대로).</div>", "derive": [{"title": "전확률·베이즈 — 곱셈규칙에서", "steps": ["분할 \\(\\{B_i\\}\\): 서로소+합집합 전체 [왜] A를 조각내는 칸막이", "\\(A=\\cup(A\\cap B_i)\\) 서로소 합 ⇒ \\(P(A)=\\sum P(A\\cap B_i)\\)", "곱셈규칙 \\(P(A\\cap B_i)=P(B_i)P(A|B_i)\\) 대입 → 전확률", "베이즈: \\(P(B_j|A)=P(B_j)P(A|B_j)/P(A)\\) — 분모가 전확률", "극한 체크: 확실한 B_j(P=1)면 갱신 무효 ✓ · \\(\\sum_jP(B_j|A)=1\\) ✓"]}, {"title": "기하 기댓값 1/p — 1스텝 조건화", "steps": ["첫 시행 조건화: 성공(p)이면 X=1, 실패(1−p)면 1회 소모 후 리셋 [왜] 무기억", "\\(E[X]=p\\cdot1+(1-p)(1+E[X])\\)", "정리: \\(pE[X]=1\\) ⇒ \\(E[X]=1/p\\)", "같은 틀이 U5 재생·U6 흡수시간의 원형(first-step analysis)", "극한 체크: p→1 ⇒ 1회 ✓ · p→0 ⇒ ∞ ✓"]}, {"title": "전분산 공식", "steps": ["\\(\\mathrm{Var}(X)=E[X^2]-E[X]^2\\)에서 \\(E[X^2]=E[E[X^2|Y]]\\) (타워)", "\\(E[X^2|Y]=\\mathrm{Var}(X|Y)+E[X|Y]^2\\) 대입", "\\(\\mathrm{Var}(X)=E[\\mathrm{Var}(X|Y)]+E[E[X|Y]^2]-E[E[X|Y]]^2\\)", "뒤 두 항 = \\(\\mathrm{Var}(E[X|Y])\\) ⇒ 안쪽 흩어짐+바깥 흩어짐", "극한 체크: Y가 X를 결정하면 첫 항 0 ✓ · Y 무정보면 둘째 항 0 ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 1-1</span>유병률 1%, 민감도 95%, 특이도 95%인 검사에서 양성. 실제 병일 확률은?</div><div class=\"xsol\"><b>풀이</b><ol><li>분자: 0.01×0.95=0.0095.</li><li>분모: 0.0095+0.99×0.05=0.059.</li><li>PPV=0.0095/0.059≈<b>16%</b> — 양성이어도 대부분 오탐: 사전확률(1%)이 지배한다.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u1-l3-01 · u1-l2-04 · u1-l4-02</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 1-2</span>캐시 적중 60%(처리 10µs), 미스 40%(처리 60µs). 평균 처리시간과, 적중여부까지 고려한 분산 구조는?</div><div class=\"xsol\"><b>풀이</b><ol><li>타워: E[T]=0.6×10+0.4×60=<b>30µs</b>.</li><li>전분산: 그룹 내 분산 평균+그룹 간 (10 vs 60) 벌어짐 — 후자가 지배적.</li><li>이 구조가 U4 복합 포아송 Var=λtE[Y²]의 원형.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u1-l3-05 · u1-l4-07 · u1-l2-06</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 1-3</span>n=100, p=0.02인 이항의 P(X=1)을 포아송 근사와 비교하라.</div><div class=\"xsol\"><b>풀이</b><ol><li>정확: 100×0.02×0.98⁹⁹=0.271.</li><li>근사: μ=2, e⁻²×2=0.271.</li><li>일치 — '많은 시행×작은 확률=Poisson(np)'. U3 공리의 예고편.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u1-l3-07 · u1-l2-09 · u1-l3-06</div></div>"}, "u2": {"concept": "\n<div class=\"bigpic\"><span class=\"bt\">U2 큰그림</span>\n확률과정을 지으려면 \"도착 사이 간격\"의 분포부터 정해야 한다. 이 단원은 그 후보 중 왕 — 지수분포 — 의 전과 기록이다.\n핵심은 세 정리: <b>무기억성(그리고 그 유일성)</b>, <b>min 지수는 지수(rate 합)</b>, <b>경쟁 확률은 rate 비</b>.\n이 셋이 있으면 U3 포아송과정이 조립되고, U4 중첩·분해는 이 셋의 재포장일 뿐이다.\n반대로 U5 재생과정은 \"지수를 버리면 무엇이 남는가\"라는 질문으로 이 단원을 되돌아본다.</div>\n\n<h4>1. 지수분포의 초상 <span class=\"en\">(Exponential Distribution)</span><span class=\"tagm\">계산 필수</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 콜센터의 \"다음 전화까지 시간\"을 모형화하자. 음수는 불가, 짧은 대기가 흔하고 긴 대기는 드물다.\n가장 단순한 후보는?</div>\n<p><b>개념 등장</b> — 율<span class=\"en\">(rate)</span> \\(\\lambda>0\\) 하나로 정해지는 분포:</p>\n<p>\\[ f(t)=\\lambda e^{-\\lambda t}\\ (t\\ge0),\\qquad P(X>t)=e^{-\\lambda t},\\qquad\nE[X]=\\frac{1}{\\lambda},\\quad \\mathrm{Var}(X)=\\frac{1}{\\lambda^2} \\]</p>\n<p>모든 계산은 생존함수<span class=\"en\">(survival function)</span> \\(e^{-\\lambda t}\\) 하나로 한다:\n구간 확률은 꼬리의 차 \\(P(s<X<t)=e^{-\\lambda s}-e^{-\\lambda t}\\), 중앙값은 \\(\\ln2/\\lambda\\approx0.69E[X]\\)(평균보다 왼쪽 — 오른꼬리),\n분위수는 \\(t_q=-\\ln(1-q)/\\lambda\\). 표준편차=평균, 즉 변동계수 \\(CV=\\sigma/\\mu=1\\)이 지수의 지문이다.</p>\n<p class=\"intuit\">💡 <b>직관</b> — λ는 \"시간당 발생 횟수\", 1/λ는 \"한 번의 평균 대기\". 무차원 조합 λt 하나가 모든 답을 정한다(단위 검산 도구!).</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] 꼬리·구간·중앙값·분위수(u2-l2-01~04, l4-07), λ 역산(u2-l2-08). [함정] λ와 1/λ 혼동, 단위 불일치 — λt가 무차원인지 늘 확인.</div>\n\n<h4>2. 무기억성 — 이 과목의 엔진 <span class=\"en\">(Memoryless Property)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 10년 쓴 전구와 새 전구, 어느 쪽이 먼저 나갈까? 직관은 \"낡은 쪽\"이지만, 그 직관을 수식으로 옮기면\n분포에 어떤 조건이 붙는지부터 물어야 한다.</div>\n<p><b>개념 등장</b> — 지수분포는 과거를 완전히 잊는다:</p>\n<p>\\[ P(X>s+t\\mid X>s)=\\frac{e^{-\\lambda(s+t)}}{e^{-\\lambda s}}=e^{-\\lambda t}=P(X>t) \\]</p>\n<p>이미 \\(s\\)만큼 살았다는 정보가 남은 수명의 분포를 <b>전혀</b> 바꾸지 못한다 — \"중고도 새것과 같다\".\n더 강한 사실: 생존함수의 함수방정식 \\(G(s+t)=G(s)G(t)\\)를 만족하는 연속분포는 지수뿐이다(<b>유일성</b>).\n그래서 \"무기억이라고 가정한다\"와 \"지수라고 가정한다\"는 같은 말이고, 이산 세계의 짝은 기하분포다.</p>\n<p>실전 사용법: 조건부 문제에서 경과 시간 \\(s\\)는 <b>미끼</b>다. 잔여수명은 언제나 새 \\(Exp(\\lambda)\\)로 리셋 —\n기대 잔여 \\(1/\\lambda\\), 조건부 생존 \\(e^{-\\lambda u}\\).</p>\n<p class=\"intuit\">💡 <b>직관</b> — 실패율(hazard) \\(h(t)=f/\\bar F=\\lambda\\)가 상수라는 것과 동치: 노화도, 길들이기도 없는 세계.</p>\n<p>🔗 <b>연결</b> — 이 성질이 없으면 U3의 \"언제 봐도 다음 도착까지 Exp(λ)\"가 성립하지 않고, U6 마르코프성(미래는 현재만)도 연속시간에서 지수 체류로만 구현된다. 반대로 U5 검사역설은 무기억이 <i>깨진</i> 세계의 이야기다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] 조건부 생존(u2-l2-05, l3-07/08 — s가 답에 안 들어감을 확인). [서술] 무기억성 유도+유일성 논증(u2-l4-01). [개념] 혼합은 무기억이 아니다(u2-l3-14 — 생존자 쏠림).</div>\n\n<h4>3. 여럿이 함께 — min과 경쟁 <span class=\"en\">(Minimum &amp; Competing Exponentials)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 부품 세 개가 각자 지수 수명으로 달린다. 시스템(직렬)은 \"첫 고장\"에 죽는다.\n첫 고장은 <b>언제</b> 나고, <b>누가</b> 내는가?</div>\n<p><b>두 공식</b> — 독립 \\(X_i\\sim Exp(\\lambda_i)\\)에 대해:</p>\n<p>\\[ \\min_i X_i\\sim Exp\\Big(\\sum_i\\lambda_i\\Big) \\qquad\\qquad\nP(X_1<X_2)=\\frac{\\lambda_1}{\\lambda_1+\\lambda_2} \\]</p>\n<p>min의 유도는 한 줄 — \\(P(\\min>t)=\\prod e^{-\\lambda_it}=e^{-(\\sum\\lambda_i)t}\\): \"모두 생존\"의 곱이 rate의 합이 된다.\n경쟁은 적분 한 번 — \\(\\int_0^\\infty e^{-\\lambda_2t}\\lambda_1e^{-\\lambda_1t}dt=\\lambda_1/(\\lambda_1+\\lambda_2)\\): 빠른 쪽이 rate에 비례해 이긴다.\n숨은 보석: <b>min의 값과 승자는 서로 독립</b>이다. 그리고 무기억성 덕에 1등이 정해진 뒤 남은 경쟁은 리셋 —\n순서 확률(u2-l3-02)·병렬 수명 \\(E[\\max]\\)(재출발 사다리, u2-l3-10)·\\(n\\)중화 \\(E[\\max]=H_n/\\lambda\\)(u2-l4-06, 쿠폰 수집!)가 전부 이 리셋 논법으로 풀린다.</p><div class=\"jsbox\"><span class=\"jt\">정석 2.1</span>신뢰도 공학 번역표: <b>직렬</b>(하나라도 죽으면 죽음)=min=rate 합=신뢰도 곱 \\(R_s=R_1R_2\\). <b>병렬</b>(다 죽어야 죽음)=max=신뢰도 여곱 \\(R_p=1-(1-R_1)(1-R_2)\\). '언제'는 Σλ로, '누가'는 λᵢ/Σλ로, '얼마나 자주'는 U5 재생률로 — 문제 문장을 이 세 질문으로 분류하는 것이 첫 단계다.</div><p class=\"intuit\">💡 <b>직관</b> — 알람 여러 개 중 첫 알람은 \"합쳐진 하나의 빠른 알람\"이고, 어느 알람이었는지는 시계와 무관한 제비뽑기다.</p>\n<p>🔗 <b>연결</b> — min(rate 합)이 U4의 중첩, 승자 확률(rate 비)이 U4의 타입 분해다. U3에서 포아송과정이 되면 이 둘은 \"흐름의 연산\"으로 승격된다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] E[min]·승자(u2-l2-06/07, l3-06), 순서(u2-l3-02), 병렬(u2-l3-01/10, l4-06), 직렬 신뢰도(u2-l2-10, l4-04). [서술] 두 공식 유도(u2-l4-03).</div>\n\n<h4>4. 지수의 합 — Erlang과 포아송으로 가는 다리 <span class=\"en\">(Erlang Distribution)</span><span class=\"tagm\">계산 필수</span></h4>\n<p>지수 \\(k\\)개의 합 \\(S_k=X_1+\\cdots+X_k\\)는 Erlang(\\(k,\\lambda\\)):\n\\(E=k/\\lambda\\), \\(\\mathrm{Var}=k/\\lambda^2\\), \\(CV=1/\\sqrt k\\) — 겹칠수록 규칙적으로.\n꼬리는 적분 없이 <b>사건 번역</b>으로 계산한다:</p>\n<p>\\[ P(S_k>t)=P(\\text{[0,t] 동안 도착}<k)=e^{-\\lambda t}\\sum_{j=0}^{k-1}\\frac{(\\lambda t)^j}{j!} \\]</p>\n<p>\"k번째 도착이 아직 안 왔다 = 지금까지 k건 미만\" — 이 번역이 U3의 핵심 항등식 \\(\\{N(t)\\ge k\\}\\Leftrightarrow\\{S_k\\le t\\}\\)이고,\n예비품 문제(핫스왑 k−1개면 \\(P(S_k>t)\\))의 정석 풀이다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] Erlang 꼬리(u2-l3-04, l4-02 — 급수로), 모멘트(u2-l3-05). [서술] 지수↔포아송 양방향 다리(u2-l4-08) — U3 입구의 예습.</div>", "derive": [{"title": "무기억성과 유일성", "steps": ["\\(P(X>s+t|X>s)=e^{-\\lambda(s+t)}/e^{-\\lambda s}=e^{-\\lambda t}\\) [왜] 지수 꼬리의 곱 구조", "역: 무기억 ⇔ \\(G(s+t)=G(s)G(t)\\) (G=생존함수)", "단조 해는 \\(G=e^{-\\lambda t}\\)뿐 (코시 함수방정식)", "이산판은 기하분포 — 무기억 가족은 단 둘", "극한 체크: λt≪1 ⇒ P(X≤t)≈λt (미소구간 발생확률=rate×시간, U3 공리의 씨앗) ✓"]}, {"title": "min ~ Exp(Σλ)와 경쟁 λ₁/Σ", "steps": ["\\(P(\\min>t)=\\prod P(X_i>t)=e^{-(\\sum\\lambda_i)t}\\) [왜] 독립 생존의 곱", "\\(P(X_1<X_2)=\\int_0^\\infty P(X_2>t)f_1(t)dt\\)", "\\(=\\lambda_1\\int_0^\\infty e^{-(\\lambda_1+\\lambda_2)t}dt=\\lambda_1/(\\lambda_1+\\lambda_2)\\)", "보석: min 값과 승자 독립 — U4 분해 독립성의 원형", "극한 체크: λ₂→0 ⇒ P→1 ✓ · 대칭이면 1/2 ✓"]}, {"title": "병렬 E[max] — 재출발 사다리", "steps": ["n개 동일 λ: 첫 고장까지 Exp(nλ) → 1/(nλ) [왜] min의 rate 합", "무기억: 생존 n−1개는 새것으로 리셋 → 다음 단계 Exp((n−1)λ)", "\\(E[\\max]=\\frac{1}{\\lambda}\\left(\\frac1n+\\frac1{n-1}+\\cdots+1\\right)=H_n/\\lambda\\)", "쿠폰 수집(U1)과 같은 조화수 — 이중화의 한계효용 체감", "극한 체크: n=1 ⇒ 1/λ ✓ · n=2 ⇒ 1/2λ+1/λ (u2-l3-10) ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 2-1</span>고장률 0.5/년 부품이 이미 3년 무고장이다. 앞으로 2년 더 버틸 확률과 기대 잔여수명은?</div><div class=\"xsol\"><b>풀이</b><ol><li>무기억: 3년은 미끼. P=e^{−0.5×2}=e⁻¹=<b>0.368</b>.</li><li>기대 잔여 = 1/λ = <b>2년</b> (새것과 동일).</li><li>'낡았으니 곧 죽는다'는 지수 세계에선 성립하지 않는다.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u2-l2-05 · u2-l3-07 · u2-l3-08</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 2-2</span>서버 A(λ=1/월)·B(λ=2/월)·C(λ=3/월). 첫 장애까지 기대 시간과 그것이 C일 확률은?</div><div class=\"xsol\"><b>풀이</b><ol><li>Σλ=6/월 → E[min]=1/6월=<b>5일</b>.</li><li>P(C)=3/6=<b>1/2</b>.</li><li>'언제'와 '누가'가 독립 — 두 답을 따로 계산해도 되는 이유.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u2-l3-06 · u2-l2-07 · u2-l3-02</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 2-3</span>부품+예비품 1개(각 Exp(λ=1/시간), 핫스왑). 총 수명이 2시간을 넘길 확률은?</div><div class=\"xsol\"><b>풀이</b><ol><li>S₂>2 ⇔ 2시간 동안 고장 ≤1건.</li><li>P=e^{−2}(1+2)=3e⁻²=<b>0.406</b>.</li><li>적분 대신 사건 번역(포아송 부분합) — U3 다리 항등식의 첫 사용.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u2-l3-04 · u2-l4-02 · u2-l3-05</div></div>"}, "u3": {"concept": "\n<div class=\"bigpic\"><span class=\"bt\">U3 큰그림</span>\n재료(지수분포)가 준비됐으니 과정을 조립한다. 지수 간격을 이어 붙인 계수과정 — 포아송과정 — 은\n\"완전히 균질한 우연의 흐름\"의 수학적 표준이다. 이 단원의 목표는 <b>세 개의 얼굴이 같은 하나</b>임을 보는 것:\n① 공리(미소구간 λh+독립·정상 증분) ② 분포(\\(N(t)\\sim Poisson(\\lambda t)\\)) ③ 간격(iid \\(Exp(\\lambda)\\)).\n어느 얼굴로 문제를 받아도 나머지 두 얼굴로 자유롭게 번역하는 능력이 곧 시험 실력이다.\nU4는 이 흐름의 대수학(합치기·거르기), U5는 간격 조건을 일반화한 세계다.</div>\n\n<h4>1. 계수과정과 포아송 공리 <span class=\"en\">(Counting Process &amp; Axioms)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — \"시각 t까지 도착한 건수\" \\(N(t)\\)를 모형화하자. 어떤 최소 가정이 \"순수한 우연\"을 정의하는가?</div>\n<p><b>공리 4개</b> — 율 λ의 포아송과정:</p>\n<p>① \\(N(0)=0\\) ② <b>독립 증분</b><span class=\"en\">(independent increments)</span>: 겹치지 않는 구간의 도착 수는 독립\n③ <b>정상 증분</b><span class=\"en\">(stationary increments)</span>: 증분 분포는 구간 <i>길이</i>에만 의존\n④ 미소구간: \\(P(\\text{h 동안 1건})=\\lambda h+o(h)\\), \\(P(\\ge2\\text{건})=o(h)\\) — 동시 도착 없음.</p>\n<p>이 4줄에서 미분방정식 사다리를 풀면(수식 레이어) pmf가 <b>강제</b>된다:</p>\n<p>\\[ P(N(t)=k)=e^{-\\lambda t}\\frac{(\\lambda t)^k}{k!},\\qquad E[N(t)]=\\mathrm{Var}[N(t)]=\\lambda t \\]</p>\n<p>계산 규율: 언제나 <b>기대 건수 \\(\\mu=\\lambda t\\)부터</b>(무차원인지 단위 확인!), 그다음 pmf·꼬리.\n\"2건 이상\"은 \\(1-e^{-\\mu}(1+\\mu)\\)처럼 부분합으로. 평균=분산이라 Fano 인자(분산/평균)가 1에서 벗어나면\n데이터가 포아송이 아니라는 진단이 된다.</p>\n<p class=\"intuit\">💡 <b>직관</b> — 독립 증분은 \"도박사 오류의 부정\"(오전 폭주가 오후를 못 바꿈), 정상 증분은 \"시작점 무관\"(문제 속 시각은 미끼).</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] pmf·꼬리(u3-l2-01/02/04), 시작점 미끼(u3-l2-05), 구간 곱(u3-l2-06, l3-02, l4-06). [개념] 공리 4개 중 아닌 것 고르기(u3-l1-01). [함정] 단위 불일치(u3-l3-11).</div>\n\n<h4>2. 간격의 얼굴 — 지수와 Erlang <span class=\"en\">(Interarrival Times &amp; Waiting Times)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 같은 과정을 \"몇 건 왔나\"(계수)가 아니라 \"언제 오나\"(시각)로 물으면?</div>\n<p><b>번역 규칙</b> — 첫 도착: \\(P(T_1>t)=P(N(t)=0)=e^{-\\lambda t}\\) → \\(T_1\\sim Exp(\\lambda)\\).\n무기억성+독립 증분으로 모든 간격 \\(T_i\\)가 iid \\(Exp(\\lambda)\\).\nk번째 도착 시각 \\(S_k=T_1+\\cdots+T_k\\sim\\) Erlang(\\(k,\\lambda\\)), \\(E[S_k]=k/\\lambda\\). 그리고 만능 다리:</p>\n<p>\\[ \\{N(t)\\ge k\\}\\iff\\{S_k\\le t\\} \\]</p>\n<p>\"k번째가 t 전에 왔다 = t까지 k건 이상\". 이 한 줄이 Erlang 꼬리를 포아송 부분합으로 바꾸고(적분 소멸),\n계수 질문과 시각 질문을 자유 왕복하게 한다. 현재 시점 관점(u3-l3-07)도 무기억으로 즉답:\n언제 관측을 시작하든 다음 도착까지 \\(Exp(\\lambda)\\), 창 길이 u의 기대 건수 \\(\\lambda u\\).</p>\n<p class=\"intuit\">💡 <b>직관</b> — 계수(N)와 시각(S)은 같은 계단 경로를 세로로 읽나 가로로 읽나의 차이다. 다리 항등식이 그 회전이다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] 간격 꼬리(u3-l2-09, l3-04/10), S_k 모멘트(u3-l2-07), 다리로 꼬리(u3-l3-03/14). [서술] pmf 유도(u3-l4-01)·Erlang 유도(u3-l4-03).</div>\n\n<h4>3. 조건부 균등성 — 총량이 정해지면 위치는 평등 <span class=\"en\">(Conditional Uniformity)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — \"오늘 하루 10건이 왔다\"는 것을 안 뒤, 그 10건이 <i>언제</i> 왔는지의 분포는?</div>\n<p><b>정리</b> — \\(N(t)=k\\)가 주어지면 도착 시각들은 iid \\(U(0,t)\\)의 순서통계량과 같은 분포다.\n즉 각 도착은 독립적으로 확률 \\(s/t\\)로 부분구간 \\([0,s]\\)에 떨어진다:</p>\n<p>\\[ P(N(s)=j\\mid N(t)=k)=\\binom{k}{j}\\Big(\\frac{s}{t}\\Big)^j\\Big(1-\\frac{s}{t}\\Big)^{k-j} \\]</p>\n<p>포아송이 <b>이항으로</b> 바뀌는 순간이며, λ가 답에서 완전히 사라진다(유도에서 소거 — 수식 레이어).\n조건부 기대 \\(E[N(s)|N(t)=k]=ks/t\\), 도착 시각 합 \\(E[\\sum S_i|k]=kt/2\\)도 즉시 따라온다.\n총량 고정 조건은 분산을 이항 \\(kp(1-p)\\)로 <i>줄인다</i>(포아송이면 평균=분산일 것을).</p>\n<p class=\"intuit\">💡 <b>직관</b> — \"포아송 = 시간축에 완전 무작위로 뿌려진 점들\". 총 개수를 알려주면 남는 무작위성은 위치의 균등함뿐이다.</p>\n<p>🔗 <b>연결</b> — U4 분해(thinning)의 독립성 증명이 이 성질의 쌍둥이 계산이고, 시뮬레이션(개수 뽑고 위치는 균등 산포)의 근거다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] s/t(u3-l3-01), 조건부 이항(u3-l2-08, l4-02), 기대(u3-l3-06/12). [서술] 유도(u3-l4-08 — λ 소거 과정을 쓰게 하는 문제).</div>\n\n<h4>4. 도구 상자 — 생성함수·공분산·실무 감각 <span class=\"en\">(Toolbox)</span><span class=\"tagc\">개념 이해용</span></h4>\n<p>· <b>공분산</b>: \\(\\mathrm{Cov}(N(s),N(t))=\\lambda\\min(s,t)\\) — 겹치는 구간만 상관을 만든다(독립 증분의 정량판).<br>\n· <b>확률생성함수</b>: \\(E[z^N]=e^{\\mu(z-1)}\\). \\(z=-1\\)이면 \\(P(\\text{짝수})-P(\\text{홀수})=e^{-2\\mu}\\) — 홀짝 문제(u3-l3-08)의 원천.<br>\n· <b>합의 재생산성</b>: 독립 포아송 합 ~ \\(Poisson(\\mu_1+\\mu_2)\\) — U4 중첩의 분포 버전.<br>\n· <b>율 추정</b>: \\(\\hat\\lambda=n/T\\) (관측 건수/관측 시간), 상대 요동 \\(1/\\sqrt{\\lambda t}\\) — 샷 노이즈 \\(SNR=\\sqrt\\mu\\)(u3-l4-07)까지 한 줄.</p><div class=\"jsbox\"><span class=\"jt\">정석 3.1</span>문제 분류기(포아송 5문형): ① '몇 건?' → pmf/부분합 ② '언제/얼마나 기다려?' → 지수·Erlang(다리로 번역) ③ '총량 주어짐' → 조건부 이항(s/t) ④ '두 흐름' → U4(중첩·분해) ⑤ 'λ 추정·요동' → n/T, √μ. 문장을 이 다섯으로 분류하면 공식이 자동 선택된다.</div>\n", "derive": [{"title": "공리 → pmf (미분방정식 사다리)", "steps": ["\\(P_0(t+h)=P_0(t)(1-\\lambda h)+o(h)\\) [왜] 독립 증분으로 곱", "\\(P_0'=-\\lambda P_0,\\ P_0(0)=1\\Rightarrow P_0=e^{-\\lambda t}\\)", "\\(P_k'=-\\lambda P_k+\\lambda P_{k-1}\\) — 유지 vs 한 건 도착", "귀납: \\(P_k=e^{-\\lambda t}(\\lambda t)^k/k!\\)", "극한 체크: ΣP_k=1 ✓ · E=λt ✓ · t→0 ⇒ P₀→1 ✓"]}, {"title": "조건부 균등성 — λ의 소거", "steps": ["\\(P(S_1\\le s|N(t)=1)=\\dfrac{P(N(s)=1)P(N(t)-N(s)=0)}{P(N(t)=1)}\\) [왜] 증분 곱", "\\(=\\dfrac{\\lambda se^{-\\lambda s}\\cdot e^{-\\lambda(t-s)}}{\\lambda te^{-\\lambda t}}=\\dfrac{s}{t}\\)", "cdf s/t ⇒ U(0,t): λ 완전 소거", "일반 k: 도착 시각들 ~ iid U(0,t)의 순서통계량", "극한 체크: s=t ⇒ 1 ✓ · 조건부 이항·kt/2가 즉시 파생 ✓"]}, {"title": "Erlang 밀도 — 다리에서 미분", "steps": ["\\(P(S_k\\le t)=P(N(t)\\ge k)=1-\\sum_{j<k}e^{-\\lambda t}(\\lambda t)^j/j!\\) [왜] 사건 번역", "t로 미분 — 인접 항 연쇄 상쇄(telescoping)", "\\(f_{S_k}(t)=\\lambda e^{-\\lambda t}(\\lambda t)^{k-1}/(k-1)!\\)", "독해: '마지막 순간 도착(λ) × 그 전까지 k−1건'", "극한 체크: k=1 ⇒ 지수 ✓ · E=k/λ ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 3-1</span>λ=3/시간 콜센터. 2시간 동안 ① 정확히 4건 ② 2건 이상일 확률은?</div><div class=\"xsol\"><b>풀이</b><ol><li>μ=6부터. P(4)=e⁻⁶6⁴/4!=<b>0.134</b>.</li><li>P(≥2)=1−e⁻⁶(1+6)=<b>0.983</b>.</li><li>μ 계산→pmf→부분합의 3단 정석.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u3-l2-01 · u3-l2-04 · u3-l3-05</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 3-2</span>λ=2/시간에서 세 번째 도착이 2시간 안에 올 확률은?</div><div class=\"xsol\"><b>풀이</b><ol><li>번역: {S₃≤2}⇔{N(2)≥3}, μ=4.</li><li>P=1−e⁻⁴(1+4+8)=<b>0.762</b>.</li><li>Erlang 적분 대신 포아송 부분합 — 다리 항등식의 힘.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u3-l3-03 · u3-l3-14 · u3-l2-07</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 3-3</span>오늘 12건 접수됐고 오전은 하루의 1/3이다. 오전 접수가 정확히 4건일 확률과 조건부 기대는?</div><div class=\"xsol\"><b>풀이</b><ol><li>조건부 이항 B(12, 1/3): P(4)=C(12,4)(1/3)⁴(2/3)⁸=<b>0.238</b>.</li><li>E=12×1/3=<b>4건</b>.</li><li>λ가 필요 없다 — 총량이 주어지면 균등성만 남는다.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u3-l2-08 · u3-l4-02 · u3-l3-12</div></div>"}, "u4": {"concept": "\n<div class=\"bigpic\"><span class=\"bt\">U4 큰그림</span>\n포아송과정 하나를 알았으니 이제 <b>여럿을 다루는 대수학</b>이다. 강의 개요가 \"포아송과정의 중첩 및 분해\"를 전반기 표제로\n못박은 이유: 실무의 흐름은 언제나 합쳐지고(두 노선 버스), 갈라진다(일반/긴급 신고). 이 단원의 정리 셋 —\n<b>중첩(rate 합)·분해(rate 곱, 그리고 놀라운 독립성)·경쟁(rate 비)</b> — 은 U2의 min·경쟁 공식이 \"흐름의 연산\"으로 승격된 것이다.\n여기에 정상성만 포기한 비균질 포아송(\\(m(t)=\\int\\lambda\\))과, 건수에 크기를 실은 복합 포아송(\\(E=\\lambda tE[Y]\\))까지 얹으면\n중간범위 포아송 파트가 완성된다.</div>\n\n<h4>1. 중첩 — 흐름의 덧셈 <span class=\"en\">(Superposition)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 전화(λ₁)와 이메일(λ₂)이 따로 포아송으로 온다. \"전체 문의\"라는 하나의 흐름은 무엇인가?</div>\n<p><b>정리</b> — 독립 포아송과정의 합은 다시 포아송과정이고 율은 더해진다:</p>\n<p>\\[ N(t)=N_1(t)+N_2(t)\\ \\sim\\ \\text{Poisson process}\\big(\\lambda_1+\\lambda_2\\big) \\]</p>\n<p>증명은 공리 검증(수식 레이어): 미소구간 도착확률이 \\((\\lambda_1+\\lambda_2)h\\)로 더해지고 동시 도착은 \\(o(h)\\).\n다음 도착까지 대기는 \\(Exp(\\Sigma\\lambda)\\)(=U2의 min!), 그 도착이 타입 \\(i\\)일 확률은 \\(\\lambda_i/\\Sigma\\lambda\\)(=U2의 경쟁!),\n그리고 \"언제\"와 \"누가\"는 독립 — 연속 k건의 타입은 iid 동전던지기가 된다.\n총량이 주어지면 출처는 이항: \\(P(\\text{타입1}=j\\mid\\text{총}=k)=\\binom{k}{j}(\\lambda_1/\\Sigma)^j(\\cdots)\\) — U3 조건부 균등성의 타입판.</p>\n<p class=\"intuit\">💡 <b>직관</b> — 서로 다른 원천의 우연을 합쳐도 \"더 빠른 하나의 우연\"일 뿐이다. 트래픽 공학에서 포아송 가정이 견고한 이유.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] 합 pmf(u4-l2-01), 타입 확률·연속 타입(u4-l2-04/05), 두 노선 대기(u4-l3-14, l4-06), 출처 이항(u4-l3-02/10). [서술] 공리 검증 유도(u4-l4-08).</div>\n\n<h4>2. 분해 — 흐름의 나눗셈과 독립성의 반전 <span class=\"en\">(Thinning / Splitting)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 도착 λ 중 각 건이 독립적으로 확률 p로 \"긴급\"이다. 긴급만 모은 흐름은 무엇이고,\n긴급이 많았던 날 일반 건수는 적었을까?</div>\n<p><b>정리</b> — 확률 p로 거른(thinning) 흐름은 \\(Poisson(p\\lambda)\\), 나머지는 \\(Poisson((1-p)\\lambda)\\),\n그리고 <b>두 흐름은 서로 독립이다</b>. 유도(수식 레이어)에서 결합확률이 정확히 곱으로 갈라진다:</p>\n<p>\\[ P(N_1=j,N_2=k)=\\underbrace{e^{-p\\lambda t}\\frac{(p\\lambda t)^j}{j!}}_{\\text{Poisson}(p\\lambda t)}\n\\cdot\\underbrace{e^{-(1-p)\\lambda t}\\frac{((1-p)\\lambda t)^k}{k!}}_{\\text{Poisson}((1-p)\\lambda t)} \\]</p>\n<p>독립성이 반직관적인 이유: 총량이 고정이라면 한쪽이 많으면 다른 쪽이 적어야 한다. 하지만 포아송의 총량은 <b>랜덤</b>이라\n\"긴급이 많았던 날\"은 그저 \"전체가 많았던 날\"일 뿐, 일반 건수엔 정보가 없다(시험 개념 문제 1순위).\n활용은 즉물적: 긴급만 볼 땐 새 과정 \\(p\\lambda\\)로 리셋(첫 긴급까지 \\(Exp(p\\lambda)\\)),\n연쇄 필터는 \\(\\lambda p_1p_2\\)(퍼널), 관측률 p의 역보정은 \\(\\lambda=\\lambda_{obs}/p\\), 3분할도 같은 정리.</p>\n<p class=\"intuit\">💡 <b>직관</b> — 포아송 흐름은 체로 걸러도, 몇 번을 걸러도, 걸러낸 것도 남은 것도 전부 포아송이고 서로 남남이다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] pλ 계산(u4-l2-02/03/11/12, l3-01/07/08), 미검출 품질(u4-l3-06, l4-07). [개념] 독립성 O/X(u4-l1-03). [서술] 곱 분해 유도(u4-l4-01 — 팩토리얼 재조립을 직접 쓰게 함).</div>\n\n<h4>3. 비균질 포아송 — 정상성의 대가 <span class=\"en\">(Nonhomogeneous Poisson Process)</span><span class=\"tagm\">계산 필수</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 점심시간엔 주문이 몰리고 새벽엔 뜸하다. 율이 상수라는 가정(정상성)만 틀렸고 나머지는 맞다면?</div>\n<p><b>개념</b> — 율을 함수 \\(\\lambda(t)\\)로 두면 독립 증분은 유지한 채:</p>\n<p>\\[ N(t)\\sim Poisson\\big(m(t)\\big),\\qquad m(t)=\\int_0^t\\lambda(s)\\,ds \\]</p>\n<p>모든 공식에서 \\(\\lambda t\\)를 \\(m(t)\\)로 교체하면 끝: 무도착 \\(e^{-m}\\), 구간 \\([t_1,t_2]\\)는 \\(m(t_2)-m(t_1)\\).\n실무형은 조각별 상수(한산 λ₁ 시간 T₁+피크 λ₂ 시간 T₂ → \\(m=\\lambda_1T_1+\\lambda_2T_2\\))와\n선형 램프(\\(\\lambda=a+bt\\Rightarrow m=at+bt^2/2\\)). 건수 통계만 필요하면 등가 균질율 \\(\\bar\\lambda=m/T\\)로 요약 가능하지만\n도착 <i>위치</i> 분포는 다르다(균등이 아니라 λ에 비례).</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] m(t) 적분(u4-l2-06/07, l3-03/05/11), 종합(u4-l4-02/05). [함정] 정상성 없이 \"시작점 무관\"을 쓰면 오답.</div>\n\n<h4>4. 복합 포아송 — 건수에 크기를 싣다 <span class=\"en\">(Compound Poisson Process)</span><span class=\"tagm\">계산 필수</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 보험사엔 \"몇 건\"보다 \"총 얼마\"가 문제다. 건수도 랜덤, 건당 금액도 랜덤일 때 총액은?</div>\n<p><b>개념</b> — \\(S(t)=\\sum_{i=1}^{N(t)}Y_i\\) (N~포아송, \\(Y_i\\) iid, N과 독립). 타워+전분산(U1)으로:</p>\n<p>\\[ E[S]=\\lambda t\\,E[Y] \\qquad\\qquad \\mathrm{Var}(S)=\\lambda t\\,E[Y^2] \\]</p>\n<p>분산에 \\(E[Y]^2\\)이 아니라 <b>2차 모멘트 \\(E[Y^2]=\\mathrm{Var}(Y)+E[Y]^2\\)</b>이 들어가는 것이 급소 —\n건수 요동과 크기 요동이 <i>둘 다</i> 실린다. Y가 지수(평균 m)면 \\(E[Y^2]=2m^2\\) 즉석 대입(u4-l3-12).\n보험 준비금(평균+kσ), 트래픽 총량, 누적 손상 모델이 전부 이 두 줄이다.</p>\n<p class=\"intuit\">💡 <b>직관</b> — E는 \"건수×단가\"로 당연하지만, Var는 당연하지 않다: 총량의 불확실성은 \"몇 건일지\"와 \"얼마일지\"의 합작이다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] E·Var·SD(u4-l2-08/09, l3-04/12). [서술] 전분산 유도(u4-l4-03 — U1 l4-07을 인용하며 쓰면 만점 구조).</div>", "derive": [{"title": "thinning — 결합의 곱 분해", "steps": ["\\(P(N_1=j,N_2=k)=P(N=j+k)\\binom{j+k}{j}p^j(1-p)^k\\) [왜] 총량 조건화+독립 표시", "포아송 pmf 대입, \\((j+k)!\\) 소거", "\\(e^{-\\lambda t}=e^{-p\\lambda t}e^{-(1-p)\\lambda t}\\)로 지수 분리", "= Poisson(pλt)[j] × Poisson((1−p)λt)[k] — 곱=독립", "극한 체크: p=1 ⇒ 원 과정 ✓ · 주변합으로 각 흐름 단독 확인 ✓"]}, {"title": "복합 포아송 모멘트 — 전분산", "steps": ["\\(E[S|N=n]=nE[Y],\\ \\mathrm{Var}(S|N=n)=n\\mathrm{Var}(Y)\\) [왜] 고정 n이면 iid 합", "타워: \\(E[S]=E[N]E[Y]=\\lambda tE[Y]\\)", "전분산: \\(\\mathrm{Var}(S)=E[N]\\mathrm{Var}(Y)+\\mathrm{Var}(N)E[Y]^2\\)", "포아송 E[N]=Var[N]=λt ⇒ \\(\\lambda t(\\mathrm{Var}(Y)+E[Y]^2)=\\lambda tE[Y^2]\\)", "극한 체크: Y≡1 ⇒ Var=λt(계수 복원) ✓ · 차원 [S²] ✓"]}, {"title": "중첩 — 공리 검증", "steps": ["합 과정의 독립 증분: 성분별 독립 증분+상호 독립 [왜] 공리를 직접 검사", "1건 확률: \\(\\lambda_1h+\\lambda_2h+o(h)\\)", "동시 도착: \\(\\lambda_1\\lambda_2h^2=o(h)\\) — 급소", "∴ 율 λ₁+λ₂ 포아송과정. n개 일반화 Σλᵢ", "극한 체크: λ₂=0 ⇒ 원 과정 ✓ · 분포 재생산성과 정합 ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 4-1</span>신고 λ=20/시간 중 10%가 긴급. 8시간 근무 중 긴급이 하나도 없을 확률과, 첫 긴급까지 기대 대기는?</div><div class=\"xsol\"><b>풀이</b><ol><li>긴급 흐름=Poisson(2/시간). P(0건/8h)=e^{−16}≈<b>1.1×10⁻⁷</b>.</li><li>E[첫 긴급]=1/2시간=<b>30분</b>.</li><li>원 흐름은 잊고 pλ로 리셋 — thinning의 실전 사용법.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u4-l3-01 · u4-l2-11 · u4-l2-02</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 4-2</span>청구 λ=5/월, 건당 평균 100·표준편차 50만원. 1년 총청구의 평균과 표준편차는?</div><div class=\"xsol\"><b>풀이</b><ol><li>E=60×100=<b>6000만원</b>.</li><li>E[Y²]=50²+100²=12500 → Var=60×12500 → SD=<b>866만원</b>.</li><li>준비금=평균+2σ≈7732만원 식으로 쓰는 것이 실무 문법.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u4-l3-04 · u4-l2-09 · u4-l3-12</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 4-3</span>버스 λ₁=4/시간·λ₂=2/시간(독립). 정류장 도착 승객의 기대 대기와, 다음 버스가 1번 노선일 확률은?</div><div class=\"xsol\"><b>풀이</b><ol><li>중첩 Σ=6/시간 → E[대기]=<b>10분</b>.</li><li>P(1번)=4/6=<b>2/3</b>.</li><li>'언제'는 rate 합, '누가'는 rate 비 — U2 두 공식의 흐름 버전.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u4-l3-14 · u4-l4-06 · u4-l2-04</div></div>"}, "u5": {"concept": "\n<div class=\"bigpic\"><span class=\"bt\">U5 큰그림</span>\n포아송의 지수 간격은 아름답지만, 부품 수명·정비 주기는 지수가 아니다. 간격을 \"iid이기만 한 일반 분포\"로 풀어준 것이\n재생과정<span class=\"en\">(renewal process)</span> — 강의 개요의 \"재생과정을 이용한 수명 변수의 분석\"이다.\n무기억성을 잃는 대신 두 개의 강력한 <b>분포-자유(distribution-free)</b> 정리를 얻는다:\n장기율 \\(N(t)/t\\to1/\\mu\\)와 재생보상정리 \\(E[R]/E[X]\\). 평균(과 분산)만 알면 장기 거동이 전부 나온다.\n그리고 무기억성의 빈자리에서 이 과목 최고의 반전 — <b>검사역설</b> — 이 튀어나온다.</div>\n\n<h4>1. 재생과정과 장기율 <span class=\"en\">(Renewal Process &amp; Long-run Rate)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 수명이 \"평균 2년, 분포는 모름\"인 부품을 즉시 교체하며 20년 쓴다. 교체는 몇 번쯤 일어날까?\n분포를 모르는데 답할 수 있는가?</div>\n<p><b>개념 등장</b> — 간격 \\(X_1,X_2,\\dots\\)이 iid(평균 \\(\\mu\\))인 계수과정이 재생과정.\n\"재생<span class=\"en\">(renewal)</span>\"이라는 이름은 매 도착 시점마다 과정이 <b>확률적으로 새로 시작</b>된다는 뜻이다. 두 정리:</p>\n<p>\\[ \\frac{N(t)}{t}\\xrightarrow{\\ t\\to\\infty\\ }\\frac{1}{\\mu}\\ \\text{(확률 1)}\\qquad\\qquad\n\\frac{E[N(t)]}{t}\\to\\frac{1}{\\mu}\\ \\text{(기본재생정리)} \\]</p>\n<p>유도는 샌드위치 \\(S_{N(t)}\\le t<S_{N(t)+1}\\)와 대수법칙 두 줄(수식 레이어). 실전은 \\(E[N(t)]\\approx t/\\mu\\),\n횟수의 요동까지 원하면 재생 CLT: \\(\\mathrm{Var}[N(t)]\\approx t\\sigma^2/\\mu^3\\) —\n간격이 불규칙할수록(σ↑) 횟수도 출렁인다.</p>\n<p class=\"intuit\">💡 <b>직관</b> — \"시간당 횟수 = 1/평균 간격\"이라는 당연한 문장이, 분포와 무관하게 참이라는 것이 정리의 내용이다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] 율·기대 횟수(u5-l2-01/02), CLT 요동(u5-l2-12, l3-13, l4-07). [서술] 샌드위치 유도(u5-l4-01).</div>\n\n<h4>2. 재생보상정리 — 장기 회계의 만능 공식 <span class=\"en\">(Renewal Reward Theorem)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 사이클(수명)마다 비용이 들고 수익이 난다. \"장기 시간당 순이익\"을 어떻게 계산하나?\n사이클 길이도, 사이클당 금액도 랜덤인데.</div>\n<p><b>정리</b> — 사이클마다 보상 \\(R_i\\)(간격 \\(X_i\\)와 짝, iid)일 때:</p>\n<p>\\[ \\frac{R(t)}{t}\\ \\xrightarrow{\\ t\\to\\infty\\ }\\ \\frac{E[R]}{E[X]} \\]</p>\n<p>급소 셋: ① \\(E[R/X]\\)가 <b>아니다</b> — 비율의 극한은 \"평균의 비율\". ② R과 X가 사이클 안에서 종속이어도 성립.\n③ 유도는 \\(R(t)/t=\\frac{\\sum R_i}{N(t)}\\cdot\\frac{N(t)}{t}\\to E[R]\\cdot\\frac1\\mu\\) — 장기율 정리의 곱(수식 레이어).</p>\n<p><b>대표 응용 — 교대 재생과 가용도</b><span class=\"en\">(alternating renewal, availability)</span>:\n가동 평균 \\(\\mu_{up}\\) ↔ 수리 평균 \\(\\mu_{dn}\\) 반복이면 사이클=\\(\\mu_{up}+\\mu_{dn}\\), 보상=가동시간:</p>\n<p>\\[ A=\\frac{\\mu_{up}}{\\mu_{up}+\\mu_{dn}} \\]</p>\n<p>비용률(만원/년)=사이클 비용/사이클 길이, 수익·벌금 혼합도 사이클 단위로 회계하면 한 줄(u5-l3-14, l4-08).\n계획교체 정책은 사이클=min(X,T)로: \\(E[\\min(X,T)]=\\int_0^T\\bar F(t)dt\\), 지수 수명이면 예방교체가 무익하다는\n반정리까지(무기억!, u5-l4-02).</p>\n<p class=\"intuit\">💡 <b>직관</b> — \"사이클로 자르고, 사이클 평균끼리 나눠라\". 장기 문제를 한 사이클 문제로 줄이는 것이 재생 논법의 전부다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] 보상률·가용도·비용률(u5-l2-03/08/09/11, l3-03/09/12/14), SLA 역산(u5-l4-05/08). [서술] 정리 유도(u5-l4-03). [함정] E[R/X]로 계산하면 오답.</div>\n\n<h4>3. 검사역설 — 관측이 표본을 휜다 <span class=\"en\">(Inspection Paradox)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 평균 10분 간격 버스. 임의로 정류장에 도착하면 평균 5분 기다릴 것 같다.\n그런데 지수 간격이면 실측 평균 대기는 10분이다. 어디서 5분이 새었나?</div>\n<p><b>개념 등장</b> — 내가 도착한 순간이 걸친 간격은 \"평범한 간격\"이 아니다. 긴 간격일수록 시간축에서 차지하는 폭이 넓어\n임의 시점에 걸릴 확률이 <b>길이에 비례</b>해 크다. 관측 간격 \\(X_I\\)의 밀도는 길이-편향<span class=\"en\">(length-biased)</span>:</p>\n<p>\\[ g(u)=\\frac{u\\,f(u)}{\\mu}\\quad\\Rightarrow\\quad\nE[X_I]=\\frac{E[X^2]}{E[X]}=\\mu(1+CV^2)\\ \\ge\\ \\mu \\]</p>\n<p>걸친 간격 안에서 내 위치는 균등하므로 평균 잔여 대기<span class=\"en\">(mean residual life)</span>는 그 절반:</p>\n<p>\\[ E[\\text{잔여}]=\\frac{E[X^2]}{2E[X]}=\\frac{\\mu(1+CV^2)}{2} \\]</p>\n<p>세 기준점: 결정적(CV=0) → \\(\\mu/2\\) (역설 없음) / 균등 U(0,2μ) (CV²=1/3) → \\(2\\mu/3\\) / 지수(CV=1) → \\(\\mu\\) (통째로!).\n같은 \"평균 간격\"이라도 <b>분산이 대기 품질을 정한다</b>. 나이<span class=\"en\">(age)</span>와 잔여는 대칭(평균 동일),\n나이+잔여=관측 간격. 검사 데이터로 평균 수명을 추정하면 과대평가된다는 통계적 경고(u5-l3-11)까지가 이 정리의 사정거리다.</p><div class=\"jsbox\"><span class=\"jt\">정석 5.1</span>공식 하나로 전 스펙트럼: \\(E[\\text{잔여}]=\\mu(1+CV^2)/2\\). CV만 읽으면 즉답 — 결정 0→μ/2, 균등 1/√3→2μ/3, 지수 1→μ. '평균의 절반'이라 답하면 CV=0 특수경우에만 맞는 오답이다. 시험은 거의 반드시 이 함정을 심는다.</div><p>🔗 <b>연결</b> — 지수의 잔여=μ는 무기억성(U2)과 동일 결론의 재유도다: 두 경로(무기억 / length-biased)가 같은 답을 주는 것이 이론의 자기검증. U6에서 방문 간격이 재생이 되며 이 개념들이 마르코프로 이식된다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] E[X_I]·잔여(u5-l2-04~07/10, l3-01/02/08), 3분포 비교(u5-l4-04), length-biased 확률(u5-l3-06). [서술] 유도(u5-l4-06 — g(u)=uf/μ부터).</div>", "derive": [{"title": "N(t)/t → 1/μ — 샌드위치", "steps": ["\\(S_{N(t)}\\le t<S_{N(t)+1}\\) [왜] 계수의 정의 그대로", "N(t)로 나누기: \\(\\frac{S_{N}}{N}\\le\\frac{t}{N}<\\frac{S_{N+1}}{N}\\)", "대수법칙 \\(S_n/n\\to\\mu\\), N(t)→∞", "t/N(t)→μ ⇒ N(t)/t→1/μ (확률 1)", "극한 체크: 지수면 1/μ=λ (포아송 정합) ✓ · μ=∞ ⇒ 율 0 ✓"]}, {"title": "재생보상정리", "steps": ["\\(\\frac{R(t)}{t}=\\frac{\\sum_{i\\le N(t)}R_i}{N(t)}\\cdot\\frac{N(t)}{t}\\)+유계 조각 [왜] 사이클 합으로 분해", "첫 인자 → E[R] (대수법칙)", "둘째 인자 → 1/μ (위 정리)", "∴ E[R]/E[X] — R·X 종속 허용이 강점", "극한 체크: R=X ⇒ 1 ✓ · R=1 ⇒ 1/μ (횟수 복원) ✓"]}, {"title": "검사역설 — 길이 편향", "steps": ["임의 시점이 길이 u 간격에 걸릴 가중 ∝ u [왜] 시간축 점유 폭이 u", "정규화: \\(g(u)=uf(u)/\\mu\\)", "\\(E[X_I]=\\int u\\,g=E[X^2]/\\mu\\ge\\mu\\) (코시-슈바르츠)", "위치 균등 → 잔여 = E[X_I]/2 = μ(1+CV²)/2", "극한 체크: CV=0 ⇒ 역설 소멸 ✓ · 지수 ⇒ 잔여 μ (무기억과 일치) ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 5-1</span>서버: 평균 95시간 가동↔5시간 수리 반복. 가용도와, 연간(8760h) 기대 다운 횟수는?</div><div class=\"xsol\"><b>풀이</b><ol><li>A=95/100=<b>0.95</b>.</li><li>사이클 100h → 다운 ≈ 8760/100=<b>87.6회</b>.</li><li>분포 몰라도 평균 둘로 두 지표가 끝 — 재생 논법의 상품성.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u5-l2-08 · u5-l3-03 · u5-l4-05</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 5-2</span>평균 10분·지수 간격 버스와 정확히 10분 간격 버스. 임의 도착 승객의 평균 대기를 비교하라.</div><div class=\"xsol\"><b>풀이</b><ol><li>지수(CV=1): μ(1+1)/2=<b>10분</b>.</li><li>결정적(CV=0): <b>5분</b>.</li><li>같은 배차 '평균'인데 2배 차이 — 검사역설: 배차의 규칙성이 곧 서비스다.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u5-l3-02 · u5-l4-04 · u5-l2-07</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 5-3</span>기계 사이클: 가동 28일(일 200만원 수익)↔수리 2일(일 80만원 비용). 장기 순수익률은?</div><div class=\"xsol\"><b>풀이</b><ol><li>사이클 순수익=200×28−80×2=5440만원.</li><li>사이클 길이 30일 → rate=<b>181.3만원/일</b>.</li><li>수익·비용을 한 사이클에 싣고 나누기 — 재생보상 회계의 정석.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u5-l3-14 · u5-l4-08 · u5-l2-03</div></div>"}, "u6": {"concept": "\n<div class=\"bigpic\"><span class=\"bt\">U6 큰그림</span>\n지금까지는 \"도착\"이라는 한 종류 사건의 흐름이었다. 이제 시스템이 여러 <b>상태</b>를 옮겨 다닌다 — 맑음/비, 가동/정비, 자본 0~N.\n시간을 이산 스텝으로 놓고 \"미래는 현재 상태만 본다\"(마르코프성)를 가정하면, 전 과정이 행렬 \\(P\\) 하나에 압축된다.\n강의 개요의 표현 그대로 <b>\"행렬 관점에서의 이산시간 마르코프 연쇄 분석\"</b>: n스텝 미래는 \\(P^n\\), 장기 운명은 \\(\\pi P=\\pi\\),\n흡수 문제는 \\((I-Q)^{-1}\\). 셋 다 선형대수 연산이다. 이 단원이 중간범위의 종착역이자,\n기말(연속시간 마르코프·대기행렬)의 출발역이다.</div>\n\n<h4>1. 마르코프성과 전이행렬 <span class=\"en\">(Markov Property &amp; Transition Matrix)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 내일 날씨를 예보하는 데 지난 한 달 궤적이 전부 필요하다면 모형은 다룰 수 없이 커진다.\n\"현재만 보면 충분하다\"는 가정은 무엇을 사주는가?</div>\n<p><b>개념 등장</b> — 마르코프성:</p>\n<p>\\[ P(X_{n+1}=j\\mid X_n=i,\\ X_{n-1},\\dots,X_0)=P(X_{n+1}=j\\mid X_n=i)\\equiv p_{ij} \\]</p>\n<p>과거 경로는 잊고 현 위치만 — U2 무기억성의 이산시간 판이다. 그러면 모형 전체가\n전이행렬<span class=\"en\">(transition matrix)</span> \\(P=[p_{ij}]\\)로 끝난다:\n성분 비음, <b>각 행의 합 1</b>(행=현재 상태의 다음 스텝 분포). 경로 확률은 화살표 따라 곱(\\(p_{12}p_{23}p_{33}\\)),\n분포의 시간 전개는 행벡터 곱 \\(\\pi_{n+1}=\\pi_nP\\). 상태 체류 시간은 기하분포(\\(E=1/(1-p_{ii})\\)) —\nU1 기하·U2 지수와 이어지는 무기억 가족의 세 번째 얼굴이다.</p>\n<p class=\"intuit\">💡 <b>직관</b> — 마르코프성은 \"상태가 충분히 요약적이다\"라는 모델링 선언이다. 부족하면 상태를 넓혀서(런 길이, 최근 2일) 되찾는다 — u6-l3-06 성공 런이 그 기술.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[개념] 마르코프성 진술(u6-l1-01), 행합 1(u6-l1-02). [계산] 경로 곱(u6-l2-02/06), 분포 전개(u6-l2-09), 체류 기하(u6-l2-05, l3-10).</div>\n\n<h4>2. 채프먼-콜모고로프 — n스텝은 행렬 거듭제곱 <span class=\"en\">(Chapman–Kolmogorov)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 이틀 뒤 상태 확률은? 가능한 중간 경로가 상태 수만큼 갈라진다. 전부 세지 않고 계산하는 법은?</div>\n<p><b>정리</b> — 중간 시점으로 전확률 분해(U1)+마르코프성:</p>\n<p>\\[ p_{ij}^{(m+n)}=\\sum_k p_{ik}^{(m)}p_{kj}^{(n)}\\quad\\Longleftrightarrow\\quad P^{(n)}=P^n \\]</p>\n<p>합의 모양이 정확히 행렬 곱 — \"n스텝 미래 = P의 n제곱\". 2상태는 폐형식까지 나온다\n(\\(P=\\begin{bmatrix}1-a&a\\\\b&1-b\\end{bmatrix}\\)):</p>\n<p>\\[ p_{11}^{(n)}=\\underbrace{\\frac{b}{a+b}}_{\\text{평형}}+\\underbrace{\\frac{a}{a+b}(1-a-b)^n}_{\\text{과도, 기하 감쇠}} \\]</p>\n<p>고유값 1(평형)과 \\(1-a-b\\)(기억 소멸률)의 이중주다. \\(|1-a-b|^n\\)이 수렴 오차의 스케일이고,\n필요 스텝 수는 \\(n\\ge\\ln\\varepsilon/\\ln|1-a-b|\\)(믹싱 타임의 1차 감각). 이 감쇠 인자는 lag-1 자기상관이기도 하다(u6-l3-14).</p>\n<p class=\"intuit\">💡 <b>직관</b> — 고정점+기하 감쇠: 경사하강 수렴(ML)·RC 방전(회로)과 같은 구조가 확률 세계에서 재방송된다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] 2스텝 손계산(u6-l2-01, l3-02/09), 폐형식(u6-l2-07), 수렴(u6-l2-11, l3-13). [서술] C-K 유도(u6-l4-01), 폐형식 유도(u6-l4-03).</div>\n\n<h4>3. 정상분포 — 장기 운명 <span class=\"en\">(Stationary Distribution)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 이탈률 a·유입률 b로 고객이 오간다. \"우리 시장점유율은 결국 얼마인가?\" 초기 점유율이 영향을 남길까?</div>\n<p><b>개념 등장</b> — 한 스텝 지나도 변하지 않는 분포:</p>\n<p>\\[ \\pi P=\\pi,\\qquad \\sum_i\\pi_i=1 \\]</p>\n<p>2상태는 균형식 \\(a\\pi_1=b\\pi_2\\)(유출=유입) 하나로 \\(\\pi=(b,a)/(a+b)\\).\n유한 상태에서 <b>기약</b><span class=\"en\">(irreducible, 모든 상태 왕래)</span>+<b>비주기</b><span class=\"en\">(aperiodic)</span>이면\n에르고딕 정리: \\(P^n\\)의 모든 행이 π로 수렴하고(초기 조건 망각), π는 <b>장기 체류 비율</b>이기도 하다.\n그래서 π의 세 해석 — 정상분포=극한분포=시간 평균 — 이 일치하고, 응용은 π의 가중평균으로 끝난다:\n연중 맑은 날 \\(365\\pi_1\\), 장기 보상률 \\(\\sum\\pi_ir_i\\)(마르코프 보상 — U5 재생보상의 사촌), 평균 재방문 시간 \\(1/\\pi_i\\)(방문=재생점!).\n구조가 좋으면(출생사망 등) 상세균형<span class=\"en\">(detailed balance)</span> \\(\\pi_ip_{ij}=\\pi_jp_{ji}\\)로 이웃끼리 등비 사다리 —\n기말 대기행렬(M/M/1)의 예고편이다(u6-l3-11).</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] 2상태 π(u6-l2-03/04/10/12), 3상태(u6-l3-01/07/11), 보상(u6-l3-12, l4-07/08). [서술] 에르고딕 조건+반례 2종(u6-l4-06 — 주기 진동·두 섬).</div>\n\n<h4>4. 흡수 분석 — 어디로, 언제 <span class=\"en\">(Absorption Analysis)</span><span class=\"tagm\">계산 필수</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 도박꾼이 자본 i로 시작해 0(파산) 또는 N(목표)에서 멈춘다. 어느 쪽으로 끝날 확률과, 끝까지 몇 판 걸리는가?</div>\n<p><b>도구</b> — 흡수상태(\\(p_{ii}=1\\))를 향한 두 질문, 하나의 행렬. 일시 상태끼리의 블록 \\(Q\\)에 대해:</p>\n<p>\\[ \\text{기대 흡수시간: } t=(I-Q)^{-1}\\mathbf{1} \\qquad\n\\text{흡수확률: } h=(I-Q)^{-1}R_{\\cdot A} \\]</p>\n<p>둘 다 1스텝 조건화(U1 기하 유도의 틀)에서 나온 선형계다 — 같은 \\((I-Q)\\)에 우변만 교체.\n도박꾼의 파산<span class=\"en\">(gambler's ruin)</span>은 폐형식까지: 공정 게임 \\(P(\\text{목표})=i/N\\), \\(E[\\text{판 수}]=i(N-i)\\);\n편향 게임은 \\(r=q/p\\)로 \\(P=\\frac{1-r^i}{1-r^N}\\) — 승률 몇 %p의 열세가 \\(r^i\\)로 <b>지수 증폭</b>되는 것이\n\"카지노가 이기는 수학\"이다.</p>\n<p class=\"intuit\">💡 <b>직관</b> — 흡수 문제는 \"미래 기대를 현재 상태의 미지수로 놓고 1스텝 조건화\" — 방정식 세우기가 답의 전부다.</p>\n<p>🔗 <b>연결</b> — U1 기하 기댓값(1스텝 조건화)→U6 흡수시간→기말 대기행렬 기대값 계산으로 이어지는 이 과목의 등뼈 기법.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] 파산 공정/편향(u6-l3-03/04/05, l4-02), (I−Q)⁻¹(u6-l3-08, l4-04/05), 성공 런(u6-l3-06). [서술] 연립 세우기 과정 자체가 채점 포인트.</div>", "derive": [{"title": "C-K 방정식", "steps": ["중간 시점 m 상태로 전확률 분해 [왜] U1 분할 논법", "마르코프성으로 조건에서 X₀ 삭제", "\\(p_{ij}^{(m+n)}=\\sum_kp_{ik}^{(m)}p_{kj}^{(n)}\\) = 행렬 곱 성분", "귀납 ⇒ \\(P^{(n)}=P^n\\)", "극한 체크: 행합 보존(Pⁿ도 확률행렬) ✓ · n=1 자명 ✓"]}, {"title": "2상태 완전 해 — 고정점+등비", "steps": ["πP=π ⇒ aπ₁=bπ₂, Σ=1 ⇒ π=(b,a)/(a+b) [왜] 균형+정규화", "점화: \\(x_{n+1}=b+(1-a-b)x_n\\) (x=p₁₁⁽ⁿ⁾)", "고정점 x*=b/(a+b), 편차는 공비 1−a−b 등비", "\\(x_n=x^*+(1-x^*)(1-a-b)^n\\)", "극한 체크: 0<a+b<2 ⇒ π 수렴 ✓ · a+b=1 ⇒ 1스텝 평형 ✓"]}, {"title": "흡수 연립 — 1스텝 조건화", "steps": ["\\(t_i=1+\\sum_{j\\in Q}p_{ij}t_j\\) [왜] 한 스텝 쓰고 그 자리에서 다시 기대", "행렬꼴 \\((I-Q)t=\\mathbf 1\\)", "흡수확률 \\(h_i=\\sum_{j\\in Q}p_{ij}h_j+p_{iA}\\) ⇒ \\((I-Q)h=R_{\\cdot A}\\)", "같은 (I−Q), 우변만 교체 — 기본행렬 \\((I-Q)^{-1}\\)의 이중 사용", "극한 체크: 흡수 인접 상태는 t 작음 ✓ · Σ(흡수확률)=1 ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 6-1</span>맑음→비 0.3, 비→맑음 0.6. ① 장기 맑음 비율 ② 오늘 맑음일 때 모레 맑음 확률은?</div><div class=\"xsol\"><b>풀이</b><ol><li>π₁=0.6/0.9=<b>2/3</b>.</li><li>폐형식: 2/3+(1/3)(0.1)²=<b>0.670</b> (또는 P² 손계산).</li><li>이틀 만에 벌써 평형 근처 — |1−a−b|=0.1의 빠른 믹싱.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u6-l2-03 · u6-l2-07 · u6-l2-01</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 6-2</span>승률 0.45, 자본 5, 목표 20. 목표 달성 확률은? 공정 게임이라면?</div><div class=\"xsol\"><b>풀이</b><ol><li>r=0.55/0.45=1.222: (1−r⁵)/(1−r²⁰)=<b>0.032</b>.</li><li>공정이면 5/20=<b>0.25</b>.</li><li>승률 −5%p가 달성 확률을 1/8로 — 지수 증폭의 체감.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u6-l3-04 · u6-l4-02 · u6-l3-03</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 6-3</span>가동(스텝당 +100만원)↔정비(+20만원), a=0.2, b=0.4. 장기 수익률은?</div><div class=\"xsol\"><b>풀이</b><ol><li>π=(0.4, 0.2)/0.6=(2/3, 1/3).</li><li>rate=2/3×100+1/3×20=<b>73.3만원/스텝</b>.</li><li>π 구하고 내적 — 마르코프 보상의 2줄 정석(전환 수수료가 붙으면 u6-l4-07).</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u6-l3-12 · u6-l4-07 · u6-l4-08</div></div>"}};
window.SV_BUILD = {"date": "2026-09-03", "units": 6, "problems": 240, "gate": "PASS 2026-09-03 (N=50/문제)"};
</script>
<script>
(function(){
'use strict';
var APP='course-prob', VP=Vault.progress(APP), VD=Vault.drill(APP), VM=Vault.meta(APP);
var UNITS=SV_BANK, BYID={}, ALL=[];
UNITS.forEach(function(u){ u.problems.forEach(function(p){ p._unit=u; BYID[p.id]=p; ALL.push(p); }); });
var LAYERS=['concept','derive','worked'], LAYER_KO={concept:'개념',derive:'수식·유도',worked:'풀이된 예제'};
var $=function(s,el){ return (el||document).querySelector(s); };
var esc=function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
function typeset(el){
  if(window.MathJax&&window.__mjready){ MathJax.typesetPromise([el]).catch(function(){}); }
  else { (window.__mjq=window.__mjq||[]).push(el); }
}

/* ---------- 파라미터 추출/리롤 (러너와 동일 규칙) ---------- */
function draw(spec){ 
  if(spec.choices) return spec.choices[Math.floor(Math.random()*spec.choices.length)];
  var steps=Math.round((spec.max-spec.min)/spec.step);
  return spec.min+spec.step*Math.floor(Math.random()*(steps+1));
}
function sample(prob){
  for(var t=0;t<500;t++){
    var p={}; for(var k in prob.params) p[k]=draw(prob.params[k]);
    if(!prob.constraint||prob.constraint(p)) return p;
  }
  return null;
}
var CUR={}; // 문제별 현재 파라미터
function statementOf(prob){
  if(!prob.params) return (typeof prob.statement==='function')?prob.statement({}):prob.statement;
  if(!CUR[prob.id]) CUR[prob.id]=sample(prob);
  return prob.statement(CUR[prob.id]);
}
function ansText(r){
  if(r==null) return '';
  var a=r.ans, u=r.unit;
  if(typeof a==='number') return SVH.fmt(a)+' '+(u||'');
  var parts=[]; for(var k in a){ parts.push(k+' = '+SVH.fmt(a[k])+' '+((u&&u[k])||'')); }
  return parts.join(' · ');
}

/* ---------- 진도 ---------- */
function readItems(){ var ids=[]; UNITS.forEach(function(u){ LAYERS.forEach(function(l){ ids.push(u.id+'-'+l); }); }); return ids; }
function refreshProg(){
  var ids=readItems(), n=0; ids.forEach(function(id){ if(VP.get(id)) n++; });
  $('#pbar').style.width=Math.round(n/ids.length*100)+'%';
  $('#ptxt').textContent='읽음 '+n+' / '+ids.length+' · 문제 '+VD.counts().total+'/'+ALL.length;
  document.querySelectorAll('.readbtn[data-read]').forEach(function(b){
    var on=VP.get(b.getAttribute('data-read'));
    b.setAttribute('aria-pressed',on?'true':'false');
    b.textContent=on?'✓ 읽음':'읽음으로 표시';
  });
  var wc=wrongList().length, badge=$('#nav-wrong .nv'); if(badge) badge.textContent=wc||'';
}
function wrongList(){
  var all=VD.all(), ids=[];
  for(var k in all){ if((all[k]==='wrong'||all[k]==='partial')&&BYID[k]) ids.push(k); }
  return ids;
}

/* ---------- 문제 카드 ---------- */
function grade(prob, status, card){
  VD.set(prob.id, status);
  card.querySelectorAll('.pbtn.sel').forEach(function(b){ b.classList.remove('sel'); });
  var btn=card.querySelector('.pbtn.grade-'+status[0]); if(btn) btn.classList.add('sel');
  var dot=card.querySelector('.sdot'); if(dot){ dot.className='sdot '+status; }
  refreshProg();
  if(EXAM.running) examAnswered(prob.id, status);
}
function renderProblem(prob){
  var card=document.createElement('article'); card.className='pcard'; card.setAttribute('data-pid',prob.id);
  var st=VD.get(prob.id);
  var srcb=prob.src?'<span class="srcb">'+esc(prob.src)+'</span>':'';
  card.innerHTML='<div class="pc-head"><span class="lv lv'+prob.level+'">L'+prob.level+'</span>'+
    '<span class="tagc">'+esc(prob.id)+' · '+esc((prob.tags||[]).join('·'))+'</span>'+srcb+
    '<span class="sdot'+(st?' '+st:'')+'"></span></div>'+
    '<div class="pc-st"></div><div class="pc-body"></div><div class="pc-btns"></div>';
  var stEl=$('.pc-st',card), body=$('.pc-body',card), btns=$('.pc-btns',card);
  stEl.innerHTML=statementOf(prob);

  function addBtn(label, cls, fn){
    var b=document.createElement('button'); b.type='button'; b.className='pbtn'+(cls?' '+cls:''); b.textContent=label;
    b.addEventListener('click',fn); btns.appendChild(b); return b;
  }
  function gradeBtns(){
    addBtn('맞음 ✓','grade-c',function(){ grade(prob,'correct',card); });
    addBtn('부분 △','grade-p',function(){ grade(prob,'partial',card); });
    addBtn('틀림 ✗','grade-w',function(){ grade(prob,'wrong',card); });
    if(st){ var b=card.querySelector('.pbtn.grade-'+st[0]); if(b) b.classList.add('sel'); }
  }

  if(prob.type==='mc'||prob.type==='tf'){
    var choices = prob.type==='tf' ? ['참 (O)','거짓 (X)'] : prob.choices;
    var correctIdx = prob.type==='tf' ? (prob.answer?0:1) : prob.answer;
    var wrap=document.createElement('div'); wrap.className='choices';
    choices.forEach(function(c,i){
      var b=document.createElement('button'); b.type='button'; b.className='choice'; b.innerHTML=c;
      b.addEventListener('click',function(){
        if(card.__done) return; card.__done=true;
        wrap.children[correctIdx].classList.add('right');
        if(i!==correctIdx) b.classList.add('wrongpick');
        var ex=document.createElement('div'); ex.className='expl'; ex.innerHTML='<b>해설</b> — '+prob.expl;
        body.appendChild(ex); typeset(ex);
        grade(prob, i===correctIdx?'correct':'wrong', card);
      });
      wrap.appendChild(b);
    });
    body.appendChild(wrap);
  } else {
    var hintIdx=0, hb=null;
    if(prob.hints&&prob.hints.length){
      addBtn('💡 힌트','',function(){
        if(hintIdx>=prob.hints.length) return;
        if(!hb){ hb=document.createElement('div'); hb.className='hintbox'; body.appendChild(hb); }
        var d=document.createElement('div'); d.innerHTML='힌트 '+(hintIdx+1)+'. '+prob.hints[hintIdx];
        hb.appendChild(d); typeset(d); hintIdx++;
        this.textContent = hintIdx>=prob.hints.length ? '힌트 끝' : '💡 힌트 '+(hintIdx+1);
      });
    }
    var solBtn=addBtn('풀이 보기','',function(){
      if(card.__sol){ card.__sol.hidden=!card.__sol.hidden; this.textContent=card.__sol.hidden?'풀이 보기':'풀이 닫기'; return; }
      var box=document.createElement('div'); box.className='solbox';
      var steps, aline='';
      if(prob.type==='derive'){ steps=prob.steps; }
      else{
        var r=prob.solve(prob.params?CUR[prob.id]:{});
        steps=r.steps; aline='<div class="ansline">답: '+esc(ansText(r))+'</div>';
      }
      box.innerHTML='<ol>'+steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol>'+aline+
        (prob.expl?'<div class="expl">'+prob.expl+'</div>':'');
      body.appendChild(box); typeset(box);
      card.__sol=box; this.textContent='풀이 닫기';
      if(!card.__graded){ card.__graded=true; gradeBtns(); }
    });
    if(prob.params){
      addBtn('🎲 새 숫자로','',function(){
        CUR[prob.id]=sample(prob);
        stEl.innerHTML=statementOf(prob); typeset(stEl);
        if(card.__sol){ card.__sol.remove(); card.__sol=null; solBtn.textContent='풀이 보기'; }
        if(hb){ hb.remove(); hb=null; hintIdx=0; }
      });
    }
    if(st&&!card.__graded){ card.__graded=true; gradeBtns(); }
  }
  return card;
}

/* ---------- 뷰 ---------- */
var view=$('#view');
function setView(html){ view.innerHTML=html; }
function renderHome(){
  var dc=VD.counts();
  var rate=dc.total?Math.round(dc.correct/dc.total*100):null;
  setView('<div class="eyebrow">COSE382 Probability and Random Processes · 중간범위 (중간 10/21)</div>'+
    '<h1>확률및랜덤과정 문제은행</h1>'+
    '<p class="lede">개념 → 유도 → 예제 → 4단계 문제(L1~L4). 전 문제가 검산 게이트(sympy 독립 재계산 대조)를 통과했고, 계산형 문제는 <b>🎲 새 숫자로</b>를 눌러 무한 반복할 수 있다.</p>'+
    '<p class="note-line">현황 — 풀어본 문제 '+dc.total+' / '+ALL.length+(rate!==null?(' · 정답률 '+rate+'%'):'')+
    ' · <a href="#wrong">오답노트 '+wrongList().length+'문제</a> · 빌드 '+SV_BUILD.date+' (게이트 '+SV_BUILD.gate+')</p>'+
    (SV_CONTENT.course?'<details class="layer" open><summary><span class="lb">MAP</span>과목 큰그림 — 한눈에<span class="arrow">›</span></summary><div class="body">'+SV_CONTENT.course.bigpicture+'</div></details>':'')+
    '<div class="ucards" id="ucards"></div>'+
    '<h3>모드</h3><div class="ucards">'+
    '<a class="ucard" href="#exam"><span class="uc-no">MOCK EXAM</span><span class="uc-ti">📝 모의고사</span><span class="uc-scope">범위·난이도·문항수를 골라 랜덤 출제 — 매번 새 수치, 종료 리포트 제공.</span></a>'+
    '<a class="ucard" href="#wrong"><span class="uc-no">RETRY QUEUE</span><span class="uc-ti">🔁 오답노트</span><span class="uc-scope">틀림·부분 문제만 모아 재도전. 맞음으로 바꾸면 큐에서 빠진다.</span></a></div>');
  var uc=$('#ucards');
  UNITS.forEach(function(u){
    var solved=0, ok=0;
    u.problems.forEach(function(p){ var s=VD.get(p.id); if(s){solved++; if(s==='correct')ok++;} });
    var reads=LAYERS.filter(function(l){return VP.get(u.id+'-'+l);}).length;
    var a=document.createElement('a'); a.className='ucard'; a.href='#'+u.id;
    a.innerHTML='<span class="uc-no">UNIT '+u.no+'</span><span class="uc-ti">'+esc(u.title)+'</span>'+
      '<span class="uc-scope">'+esc(u.scope)+'</span>'+
      '<span class="uc-stat">읽음 '+reads+'/3 · 문제 '+solved+'/'+u.problems.length+(solved?' · 정답 '+ok:'')+'</span>';
    uc.appendChild(a);
  });
  typeset(view);
}
function renderUnit(u){
  var c=SV_CONTENT[u.id]||{};
  setView('<div class="eyebrow">UNIT '+u.no+' / '+UNITS.length+'</div><h1>'+esc(u.title)+'</h1>'+
    '<p class="lede">'+esc(u.scope)+'</p><div id="layers"></div>'+
    '<h3>문제 세트 <span class="src">L1 개념확인 → L4 시험급 · '+u.problems.length+'문제</span></h3>'+
    '<div class="filters" id="filters"></div><div id="plist"></div>');
  var layers=$('#layers');
  LAYERS.forEach(function(l){
    var d=document.createElement('details'); d.className='layer'; if(l==='concept') d.open=true;
    var inner='';
    if(l==='derive'){
      (c.derive||[]).forEach(function(dv){
        inner+='<details class="dstep"><summary>'+esc(dv.title)+'</summary><ol>'+
          dv.steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol></details>';
      });
    } else inner=c[l]||'';
    d.innerHTML='<summary><span class="lb">'+(l.toUpperCase())+'</span>'+LAYER_KO[l]+'<span class="arrow">›</span></summary>'+
      '<div class="body">'+inner+'<div class="readrow"><button type="button" class="readbtn" data-read="'+u.id+'-'+l+'"></button></div></div>';
    layers.appendChild(d);
  });
  layers.addEventListener('click',function(e){
    var b=e.target.closest('.readbtn'); if(!b) return;
    VP.toggle(b.getAttribute('data-read')); refreshProg();
  });
  var lv=0, fl=$('#filters'), pl=$('#plist');
  function renderList(){
    pl.innerHTML='';
    u.problems.filter(function(p){ return !lv||p.level===lv; }).forEach(function(p){ pl.appendChild(renderProblem(p)); });
    typeset(pl);
  }
  [['전체',0],['L1 개념',1],['L2 기본',2],['L3 응용',3],['L4 시험급',4]].forEach(function(f){
    var b=document.createElement('button'); b.type='button'; b.className='fchip'+(f[1]===0?' on':''); b.textContent=f[0];
    b.addEventListener('click',function(){ lv=f[1]; fl.querySelectorAll('.fchip').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); renderList(); });
    fl.appendChild(b);
  });
  renderList(); typeset(layers);
}
function renderWrong(){
  var ids=wrongList();
  setView('<div class="eyebrow">RETRY QUEUE</div><h1>오답노트</h1>'+
    '<p class="lede">틀림·부분 표시 문제 '+ids.length+'개. 다시 풀어 <b>맞음</b>으로 바꾸면 큐에서 빠진다. 계산형은 자동으로 새 수치다.</p><div id="plist"></div>');
  var pl=$('#plist');
  if(!ids.length){ pl.innerHTML='<div class="empty">비어 있음 — 문제를 풀고 자가채점하면 틀림/부분이 여기 모인다.</div>'; return; }
  ids.forEach(function(id){ var p=BYID[id]; if(p&&p.params) CUR[id]=sample(p); pl.appendChild(renderProblem(BYID[id])); });
  typeset(pl);
}
/* ---------- 모의고사 ---------- */
var EXAM={running:false};
function renderExam(){
  if(EXAM.running){ renderExamRun(); return; }
  var uchecks=UNITS.map(function(u){ return '<label class="ck"><input type="checkbox" class="exu" value="'+u.id+'" checked> U'+u.no+' '+esc(u.title)+'</label>'; }).join('');
  setView('<div class="eyebrow">MOCK EXAM</div><h1>모의고사</h1>'+
    '<p class="lede">범위와 난이도를 고르면 랜덤 출제. 채점은 문제마다(객관식 자동 · 계산형 자가채점), 종료하면 리포트.</p>'+
    '<div class="exam-setup">'+
    '<div class="grp"><h4>범위</h4>'+uchecks+'</div>'+
    '<div class="grp"><h4>난이도</h4>'+[1,2,3,4].map(function(l){return '<label class="ck"><input type="checkbox" class="exl" value="'+l+'" '+(l>1?'checked':'')+'> L'+l+'</label>';}).join('')+'</div>'+
    '<div class="grp"><h4>문항 수</h4><select id="exn"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>'+
    '<button class="bigbtn" id="exgo">모의고사 시작 →</button></div>');
  $('#exgo').addEventListener('click',function(){
    var us={}, ls={};
    document.querySelectorAll('.exu:checked').forEach(function(c){us[c.value]=1;});
    document.querySelectorAll('.exl:checked').forEach(function(c){ls[+c.value]=1;});
    var pool=ALL.filter(function(p){ return us[p._unit.id]&&ls[p.level]; });
    var n=Math.min(+$('#exn').value, pool.length);
    if(!n){ alert('선택한 범위에 문제가 없습니다'); return; }
    for(var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
    EXAM={running:true, list:pool.slice(0,n), idx:0, res:{}};
    EXAM.list.forEach(function(p){ if(p.params) CUR[p.id]=sample(p); });
    renderExamRun();
  });
}
function examAnswered(pid, status){ if(EXAM.running&&EXAM.res) EXAM.res[pid]=status; }
function renderExamRun(){
  var i=EXAM.idx, p=EXAM.list[i];
  setView('<div class="eyebrow">MOCK EXAM · '+(i+1)+' / '+EXAM.list.length+'</div>'+
    '<div class="exam-top"><span>'+(i+1)+'/'+EXAM.list.length+'</span><div class="bar"><i style="width:'+Math.round(i/EXAM.list.length*100)+'%"></i></div>'+
    '<button class="pbtn" id="exquit">종료</button></div><div id="pslot"></div>'+
    '<div class="pc-btns" style="margin-top:14px"><button class="bigbtn" id="exnext">'+(i+1<EXAM.list.length?'다음 문제 →':'리포트 보기 →')+'</button></div>');
  $('#pslot').appendChild(renderProblem(p)); typeset($('#pslot'));
  $('#exnext').addEventListener('click',function(){
    if(EXAM.idx+1<EXAM.list.length){ EXAM.idx++; renderExamRun(); } else renderExamReport();
  });
  $('#exquit').addEventListener('click',renderExamReport);
}
function renderExamReport(){
  var res=EXAM.res, list=EXAM.list; EXAM.running=false;
  var c=0,pt=0,w=0,na=0;
  var perUnit={};
  list.forEach(function(p){
    var s=res[p.id];
    var u=perUnit[p._unit.id]=perUnit[p._unit.id]||{t:0,c:0,title:p._unit.title,no:p._unit.no};
    u.t++;
    if(s==='correct'){c++;u.c++;} else if(s==='partial'){pt++;} else if(s==='wrong'){w++;} else na++;
  });
  var score=Math.round((c+0.5*pt)/list.length*100);
  var rows=Object.keys(perUnit).sort().map(function(k){var u=perUnit[k];return '<tr><td>U'+u.no+' '+esc(u.title)+'</td><td>'+u.c+' / '+u.t+'</td></tr>';}).join('');
  setView('<div class="eyebrow">MOCK EXAM · REPORT</div><h1>결과 리포트</h1>'+
    '<div class="report"><div class="score">'+score+'점</div>'+
    '<p>맞음 '+c+' · 부분 '+pt+' · 틀림 '+w+(na?' · 무응답 '+na:'')+' (총 '+list.length+'문제)</p>'+
    '<table><thead><tr><th>단원</th><th>정답</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="pc-btns"><a class="pbtn" href="#wrong">🔁 오답노트로</a><a class="pbtn" href="#exam" onclick="">다시 설정</a><a class="pbtn" href="#home">홈</a></div></div>');
}

/* ---------- 내비 · 라우팅 ---------- */
function buildNav(){
  var nav=$('#sidenav'), sheet=$('#tb-sheet');
  var html='<div class="ng">학습</div><a href="#home" data-v="home">홈 · 현황</a>';
  UNITS.forEach(function(u){ html+='<a href="#'+u.id+'" data-v="'+u.id+'">U'+u.no+' '+esc(u.title)+'</a>'; });
  html+='<div class="ng">훈련</div><a href="#wrong" data-v="wrong" id="nav-wrong">오답노트<span class="nv"></span></a><a href="#exam" data-v="exam">모의고사</a>';
  nav.innerHTML=html;
  sheet.innerHTML=UNITS.map(function(u){ return '<a href="#'+u.id+'">U'+u.no+' '+esc(u.title)+'</a>'; }).join('');
}
function route(){
  var h=(location.hash||'#home').slice(1);
  var valid={home:1,wrong:1,exam:1}; UNITS.forEach(function(u){valid[u.id]=1;});
  if(!valid[h]) h='home';
  if(h!=='exam') EXAM.running=false;
  document.querySelectorAll('.side nav a').forEach(function(a){ a.classList.toggle('on',a.getAttribute('data-v')===h); });
  document.querySelectorAll('.tabbar [data-tv]').forEach(function(a){ a.classList.toggle('on',a.getAttribute('data-tv')===h); });
  var sh=$('#tb-sheet'); if(sh) sh.hidden=true;
  VM.touch(location.hash||'#home');
  if(h==='home') renderHome();
  else if(h==='wrong') renderWrong();
  else if(h==='exam') renderExam();
  else renderUnit(UNITS.filter(function(u){return u.id===h;})[0]);
  window.scrollTo(0,0);
  refreshProg();
}
var tbMore=$('#tb-more'), tbSheet=$('#tb-sheet');
if(tbMore){ tbMore.addEventListener('click',function(e){ e.stopPropagation(); tbSheet.hidden=!tbSheet.hidden; });
  document.addEventListener('click',function(e){ if(!tbSheet.hidden&&!tbSheet.contains(e.target)) tbSheet.hidden=true; }); }
window.addEventListener('hashchange',route);
buildNav(); route();
})();
</script>
