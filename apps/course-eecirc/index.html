<script>
/* U7 주파수응답·필터 — H(jω), LPF/HPF, -3dB 차단, dB, 보드 개형, 2차(RLC) 기초 */
SV_BANK.push({
  id: 'u7', no: 7, title: '주파수응답·필터', titleEn: 'Frequency Response & Filters',
  scope: '전달함수 H(jω) · 저역/고역통과 · 차단주파수(−3dB) · 데시벨 · 보드 개형 · RLC 2차 특성(ζ, ω₀) 기초',
  problems: [

  /* ---------- L1 (6) ---------- */
  { id:'u7-l1-01', level:1, type:'mc', tags:['H(jω)'], src:'교재 표준',
    statement:'주파수 응답 함수 \\(H(j\\omega)=\\mathbf{V}_{out}/\\mathbf{V}_{in}\\)에 대한 설명으로 옳은 것은?',
    choices:['크기 |H|는 이득, 각 ∠H는 출력의 위상 이동을 뜻한다','H는 항상 실수다','H는 입력 진폭에 따라 변한다','시간영역 과도응답을 직접 준다'],
    answer:0, expl:'선형 회로에서 H는 ω만의 복소함수. 입력 크기와 무관(선형성) — 정상상태 정현파 도구다.' },
  { id:'u7-l1-02', level:1, type:'mc', tags:['LPF 구조'], src:'기출 유형',
    statement:'저항 R과 축전기 C 각 1개로 저역통과 필터(LPF)를 만들 때 올바른 구성은?',
    choices:['R 직렬 + C에서 출력(출력을 C 양단에서)','C 직렬 + R에서 출력','R·C 병렬 후 직렬 출력','어느 쪽이든 같다'],
    answer:0, expl:'기출 6(a). 저주파: C 개방 → 입력 그대로 통과. 고주파: C 단락 → 출력 0. 출력을 R에서 따면 반대로 HPF.' },
  { id:'u7-l1-03', level:1, type:'tf', tags:['-3dB'], src:'교재 표준',
    statement:'차단 주파수 \\(\\omega_0=1/RC\\)에서 1차 필터의 이득은 최대의 \\(1/\\sqrt{2}\\)(≈0.707, −3 dB)이고 위상은 −45°다.',
    answer:true, expl:'|H|=1/√(1+1)=1/√2, ∠H=−tan⁻¹(1)=−45°. 전력으로는 절반이라 "반전력점"이라고도 한다.' },
  { id:'u7-l1-04', level:1, type:'mc', tags:['보드 기울기'], src:'교재 표준',
    statement:'1차 저역통과 필터에서 ω ≫ ω₀ 영역의 |H| 감쇠 기울기는?',
    choices:['−20 dB/decade (= −6 dB/octave)','−40 dB/decade','−3 dB/decade','0 dB/decade'],
    answer:0, expl:'|H|≈ω₀/ω → 10배마다 1/10 = −20 dB. 2차면 −40 dB/dec — 차수가 기울기를 정한다.' },
  { id:'u7-l1-05', level:1, type:'tf', tags:['위상 극한'], src:'기출 유형',
    statement:'1차 RC 저역통과 필터의 위상은 ω→0에서 0°, ω=ω₀에서 −45°, ω→∞에서 −90°로 변한다.',
    answer:true, expl:'기출 6(c)의 3점 세트. ∠H = −tan⁻¹(ω/ω₀)의 세 극한값이다.' },
  { id:'u7-l1-06', level:1, type:'mc', tags:['2차 분류'], src:'교재 표준',
    statement:'직렬 RLC 회로의 감쇠 특성 분류로 옳은 것은? (\\(\\zeta\\) = 감쇠비)',
    choices:['ζ<1 부족감쇠(진동), ζ=1 임계감쇠, ζ>1 과감쇠','ζ<1 과감쇠','ζ는 항상 1','ζ>1이면 진동한다'],
    answer:0, expl:'ζ = (R/2)√(C/L). 부족감쇠일 때만 링잉(진동)이 보인다 — 스코프 파형 판독 기준.' },

  /* ---------- L2 (12) ---------- */
  { id:'u7-l2-01', level:2, type:'num', tags:['차단주파수'], src:'기출 유형',
    params:{ R:{choices:[1,4.7,10],unit:'kΩ'}, C:{choices:[10,100,470],unit:'nF'} },
    statement:function(p){ return 'R='+p.R+' kΩ, C='+p.C+' nF인 RC 필터의 (a) ω₀(rad/s) (b) f₀(Hz)를 구하라.'; },
    solve:function(p){ var w0=1/(p.R*1000*p.C*1e-9), f0=w0/(2*Math.PI);
      return { ans:{w0:w0, f0:f0}, unit:{w0:'rad/s', f0:'Hz'}, steps:[
        'ω₀ = 1/RC = 1/('+SVH.fmt(p.R*1000)+'×'+SVH.fmt(p.C*1e-9)+') = '+SVH.fmt(w0)+' rad/s',
        'f₀ = ω₀/2π = '+SVH.fmt(f0)+' Hz' ] }; },
    hints:['ω₀=1/RC, f=ω/2π.'] },
  { id:'u7-l2-02', level:2, type:'num', tags:['LPF 이득'], src:'창작 문제(검산됨)',
    params:{ k:{choices:[0.5,1,2,5,10]} },
    statement:function(p){ return '1차 LPF에서 ω='+p.k+'ω₀일 때 |H|를 구하라.'; },
    solve:function(p){ var m=1/Math.sqrt(1+p.k*p.k);
      return { ans:m, unit:'', steps:[
        '|H| = 1/√(1+(ω/ω₀)²) = 1/√(1+'+p.k+'²)',
        '= '+SVH.fmt(m)+(p.k===1?' (−3dB 지점 ✓)':'') ] }; },
    hints:['정규화 ω/ω₀만 대입.'] },
  { id:'u7-l2-03', level:2, type:'num', tags:['dB 변환'], src:'창작 문제(검산됨)',
    params:{ g:{choices:[0.01,0.1,0.5,2,10,100]} },
    statement:function(p){ return '전압 이득 '+p.g+'를 데시벨로 변환하라.'; },
    solve:function(p){ var db=20*Math.log10(p.g);
      return { ans:db, unit:'dB', steps:[
        'dB = 20log₁₀|H| = 20log₁₀('+p.g+')',
        '= '+SVH.fmt(db)+' dB (10배=+20dB, 절반≈−6dB 등 기준점을 외워두면 빠르다)' ] }; },
    hints:['전압비는 20log.'] },
  { id:'u7-l2-04', level:2, type:'num', tags:['위상'], src:'기출 유형',
    params:{ k:{choices:[0.5,1,2,4]} },
    statement:function(p){ return '1차 LPF에서 ω='+p.k+'ω₀일 때 위상 ∠H(°)를 구하라.'; },
    solve:function(p){ var ph=-SVH.deg(Math.atan(p.k));
      return { ans:ph, unit:'°', steps:[
        '∠H = −tan⁻¹(ω/ω₀) = −tan⁻¹('+p.k+')',
        '= '+SVH.fmt(ph)+'°' ] }; },
    hints:['위상은 arctan.'] },
  { id:'u7-l2-05', level:2, type:'num', tags:['HPF 이득'], src:'창작 문제(검산됨)',
    params:{ k:{choices:[0.1,0.5,1,2]} },
    statement:function(p){ return '1차 고역통과 필터(HPF)에서 ω='+p.k+'ω₀일 때 |H|를 구하라.'; },
    solve:function(p){ var m=p.k/Math.sqrt(1+p.k*p.k);
      return { ans:m, unit:'', steps:[
        'HPF: |H| = (ω/ω₀)/√(1+(ω/ω₀)²) = '+p.k+'/√(1+'+p.k+'²)',
        '= '+SVH.fmt(m)+' (LPF와 거울상)' ] }; },
    hints:['분자에 ω/ω₀가 올라온다.'] },
  { id:'u7-l2-06', level:2, type:'num', tags:['설계 C'], src:'기출 유형',
    params:{ f0:{choices:[100,1000,5000],unit:'Hz'}, R:{choices:[1,10],unit:'kΩ'} },
    statement:function(p){ return '차단 주파수 f₀='+p.f0+' Hz인 RC LPF를 R='+p.R+' kΩ로 만들려 한다. C(nF)를 구하라.'; },
    solve:function(p){ var C=1/(2*Math.PI*p.f0*p.R*1000)*1e9;
      return { ans:C, unit:'nF', steps:[
        'C = 1/(2πf₀R)',
        '= 1/(2π×'+p.f0+'×'+SVH.fmt(p.R*1000)+') = '+SVH.fmt(C)+' nF' ] }; },
    hints:['f₀=1/2πRC를 C로.'] },
  { id:'u7-l2-07', level:2, type:'num', tags:['감쇠량 dB'], src:'창작 문제(검산됨)',
    params:{ k:{choices:[10,100,1000]} },
    statement:function(p){ return '1차 LPF에서 잡음 주파수가 ω='+p.k+'ω₀에 있다. 그 주파수에서의 감쇠량(dB, 근사 아님 정확값)을 구하라.'; },
    solve:function(p){ var db=-20*Math.log10(Math.sqrt(1+p.k*p.k));
      return { ans:db, unit:'dB', steps:[
        '|H| = 1/√(1+'+p.k+'²) → dB = −20log₁₀√(1+'+p.k+'²)',
        '= '+SVH.fmt(db)+' dB (근사 −20log'+p.k+' = '+SVH.fmt(-20*Math.log10(p.k))+' dB와 비교)' ] }; },
    hints:['정확식과 점근 근사를 둘 다.'] },
  { id:'u7-l2-08', level:2, type:'num', tags:['RLC ω₀·ζ'], src:'창작 문제(검산됨)',
    params:{ R:{choices:[10,40,100],unit:'Ω'}, L:{choices:[10,40],unit:'mH'}, C:{choices:[1,10],unit:'µF'} },
    statement:function(p){ return '직렬 RLC: R='+p.R+' Ω, L='+p.L+' mH, C='+p.C+' µF. (a) ω₀ (b) 감쇠비 ζ를 구하라.'; },
    solve:function(p){
      var L=p.L/1000, C=p.C*1e-6;
      var w0=1/Math.sqrt(L*C), z=p.R/2*Math.sqrt(C/L);
      return { ans:{w0:w0, z:z}, unit:{w0:'rad/s', z:''}, steps:[
        'ω₀ = 1/√(LC) = '+SVH.fmt(w0)+' rad/s',
        'ζ = (R/2)√(C/L) = '+SVH.fmt(z)+' → '+(z<1?'부족감쇠(진동)':(z>1?'과감쇠':'임계감쇠')) ] }; },
    hints:['ζ 공식의 √(C/L)에 주의(반대로 쓰기 쉬움).'] },
  { id:'u7-l2-09', level:2, type:'num', tags:['임계 저항'], src:'창작 문제(검산됨)',
    params:{ L:{choices:[10,100],unit:'mH'}, C:{choices:[0.1,1,10],unit:'µF'} },
    statement:function(p){ return 'L='+p.L+' mH, C='+p.C+' µF 직렬 RLC가 임계감쇠가 되는 저항 R을 구하라.'; },
    solve:function(p){ var R=2*Math.sqrt(p.L/1000/(p.C*1e-6));
      return { ans:R, unit:'Ω', steps:[
        'ζ=1 → R = 2√(L/C)',
        '= 2√('+SVH.fmt(p.L/1000)+'/'+SVH.fmt(p.C*1e-6)+') = '+SVH.fmt(R)+' Ω',
        '(이보다 작으면 링잉, 크면 느릿한 과감쇠)' ] }; },
    hints:['ζ=1 조건을 R로.'] },
  { id:'u7-l2-10', level:2, type:'num', tags:['출력 진폭'], src:'기출 유형',
    params:{ Vin:{choices:[2,5,10],unit:'V'}, k:{choices:[0.5,2,3]} },
    statement:function(p){ return '진폭 '+p.Vin+' V, ω='+p.k+'ω₀인 정현파가 1차 LPF를 지난다. 출력 진폭을 구하라.'; },
    solve:function(p){ var v=p.Vin/Math.sqrt(1+p.k*p.k);
      return { ans:v, unit:'V', steps:[
        'V_out = V_in·|H| = '+p.Vin+'/√(1+'+p.k+'²)',
        '= '+SVH.fmt(v)+' V' ] }; },
    hints:['|H|를 곱하면 끝.'] },
  { id:'u7-l2-11', level:2, type:'num', tags:['보드 점근'], src:'창작 문제(검산됨)',
    params:{ dec:{choices:[1,2,3]} },
    statement:function(p){ return '1차 LPF의 점근 보드 선도에서 ω₀보다 '+p.dec+' decade 위 주파수의 근사 이득(dB)은?'; },
    solve:function(p){ var db=-20*p.dec;
      return { ans:db, unit:'dB', steps:[
        '점근선: ω₀ 이후 −20 dB/decade',
        p.dec+' decade → '+SVH.fmt(db)+' dB' ] }; },
    hints:['기울기 × decade 수.'] },
  { id:'u7-l2-12', level:2, type:'num', tags:['감쇠 진동수'], src:'창작 문제(검산됨)',
    params:{ w0:{choices:[100,1000],unit:'rad/s'}, z:{choices:[0.2,0.5,0.8]} },
    statement:function(p){ return 'ω₀='+p.w0+' rad/s, ζ='+p.z+'인 부족감쇠 2차계의 감쇠 진동수 \\(\\omega_d=\\omega_0\\sqrt{1-\\zeta^2}\\)를 구하라.'; },
    solve:function(p){ var wd=p.w0*Math.sqrt(1-p.z*p.z);
      return { ans:wd, unit:'rad/s', steps:[
        'ω_d = '+p.w0+'×√(1−'+p.z+'²)',
        '= '+SVH.fmt(wd)+' rad/s (실제 링잉의 주파수 — ζ가 클수록 느려진다)' ] }; },
    hints:['√(1−ζ²)만 붙이면 된다.'] },

  /* ---------- L3 (14) ---------- */
  { id:'u7-l3-01', level:3, type:'num', tags:['기출 6 설계'], src:'기출 유형',
    params:{ ws:{choices:[2,5,10],unit:'rad/s'}, wn:{choices:[2000,5000],unit:'rad/s'}, R:{choices:[1,10],unit:'kΩ'} },
    statement:function(p){ return '로봇팔 전위차계 신호(최대 ω='+p.ws+' rad/s)에 ω≳'+p.wn+' rad/s 잡음이 실린다. R='+p.R+' kΩ로 RC LPF를 만들되 차단을 신호 최대의 10배(ω₀=10×'+p.ws+')에 두기로 했다. (a) C(µF) (b) 그때 잡음('+p.wn+' rad/s)의 감쇠량(dB)을 구하라.'; },
    solve:function(p){
      var w0=10*p.ws, C=1/(w0*p.R*1000)*1e6;
      var k=p.wn/w0, att=-20*Math.log10(Math.sqrt(1+k*k));
      return { ans:{C:C, att:att}, unit:{C:'µF', att:'dB'}, steps:[
        'ω₀ = '+w0+' rad/s → C = 1/(ω₀R) = '+SVH.fmt(C)+' µF',
        '잡음 위치 ω/ω₀ = '+SVH.fmt(k)+' → |H| = 1/√(1+'+SVH.fmt(k)+'²)',
        '감쇠 = '+SVH.fmt(att)+' dB — 신호(ω≤ω₀/10)는 거의 무손실, 잡음만 죽는다 (기출 6의 완성형)' ] }; },
    hints:['차단을 신호와 잡음 "사이"에.','신호 손실과 잡음 감쇠를 모두 확인.'] },
  { id:'u7-l3-02', level:3, type:'num', tags:['H(ω) 값 계산'], src:'기출 유형',
    params:{ R:{choices:[1,2],unit:'kΩ'}, C:{choices:[1,0.5],unit:'µF'}, w:{choices:[500,1000,2000],unit:'rad/s'} },
    statement:function(p){ return 'RC LPF(R='+p.R+' kΩ, C='+p.C+' µF)의 ω='+p.w+' rad/s에서 |H|와 ∠H(°)를 구하라.'; },
    solve:function(p){
      var w0=1/(p.R*1000*p.C*1e-6), k=p.w/w0;
      var m=1/Math.sqrt(1+k*k), ph=-SVH.deg(Math.atan(k));
      return { ans:{mag:m, ph:ph}, unit:{mag:'', ph:'°'}, steps:[
        'ω₀ = 1/RC = '+SVH.fmt(w0)+' rad/s → ω/ω₀ = '+SVH.fmt(k),
        '|H| = '+SVH.fmt(m)+', ∠H = −tan⁻¹('+SVH.fmt(k)+') = '+SVH.fmt(ph)+'°' ] }; },
    hints:['ω₀부터 계산해 정규화.'] },
  { id:'u7-l3-03', level:3, type:'num', tags:['HPF 허밍 제거'], src:'창작 문제(검산됨)',
    params:{ f0:{choices:[300,500],unit:'Hz'}, fh:{choices:[50,60],unit:'Hz'} },
    statement:function(p){ return '오디오 입력에서 '+p.fh+' Hz 전원 험을 줄이려 f₀='+p.f0+' Hz HPF를 쓴다. (a) 험의 감쇠량(dB) (b) 1 kHz 신호의 이득을 구하라.'; },
    solve:function(p){
      var k1=p.fh/p.f0, att=20*Math.log10(k1/Math.sqrt(1+k1*k1));
      var k2=1000/p.f0, g=k2/Math.sqrt(1+k2*k2);
      return { ans:{att:att, g:g}, unit:{att:'dB', g:''}, steps:[
        '험: ω/ω₀ = '+SVH.fmt(k1)+' → |H| = '+SVH.fmt(k1/Math.sqrt(1+k1*k1))+' = '+SVH.fmt(att)+' dB',
        '1 kHz: ω/ω₀ = '+SVH.fmt(k2)+' → |H| = '+SVH.fmt(g)+' (거의 통과)',
        '(HPF는 "낮은 것"을 버리는 필터 — 용도 매칭 연습)' ] }; },
    hints:['HPF 식에 두 주파수를 각각.'] },
  { id:'u7-l3-04', level:3, type:'num', tags:['위상→주파수 역산'], src:'창작 문제(검산됨)',
    params:{ ph:{choices:[30,60],unit:'°'}, f0:{choices:[200,400],unit:'Hz'} },
    statement:function(p){ return 'f₀='+p.f0+' Hz인 1차 LPF의 출력 위상이 −'+p.ph+'°가 되는 주파수 f를 구하라.'; },
    solve:function(p){ var f=p.f0*Math.tan(SVH.rad(p.ph));
      return { ans:f, unit:'Hz', steps:[
        'tan('+p.ph+'°) = f/f₀',
        'f = '+p.f0+'×'+SVH.fmt(Math.tan(SVH.rad(p.ph)))+' = '+SVH.fmt(f)+' Hz',
        '(위상 측정으로 주파수·차단을 역산하는 실험 기법)' ] }; },
    hints:['위상식을 뒤집는다.'] },
  { id:'u7-l3-05', level:3, type:'num', tags:['RLC 판별'], src:'기출 유형',
    params:{ R:{choices:[20,100,400],unit:'Ω'}, L:{choices:[10],unit:'mH'}, C:{choices:[1],unit:'µF'} },
    statement:function(p){ return '직렬 RLC(R='+p.R+' Ω, L='+p.L+' mH, C='+p.C+' µF)의 스텝 응답 형태를 판별하라: (a) ζ (b) 임계 저항 (c) 판정(부족=−1, 임계=0, 과=1).'; },
    solve:function(p){
      var L=p.L/1000, C=p.C*1e-6;
      var Rc=2*Math.sqrt(L/C), z=p.R/Rc;
      var t=z<0.999?-1:(z>1.001?1:0);
      return { ans:{z:z, Rc:Rc, t:t}, unit:{z:'', Rc:'Ω', t:''}, steps:[
        'R_c = 2√(L/C) = '+SVH.fmt(Rc)+' Ω',
        'ζ = R/R_c = '+SVH.fmt(z),
        (t<0?'ζ<1 → 부족감쇠: 오버슈트·링잉이 보인다':(t>0?'ζ>1 → 과감쇠: 느린 단조 접근':'임계감쇠: 가장 빠른 무진동')) ] }; },
    hints:['임계 저항과 비교가 제일 빠르다.'] },
  { id:'u7-l3-06', level:3, type:'num', tags:['대역 선택'], src:'창작 문제(검산됨)',
    params:{ f1:{choices:[100],unit:'Hz'}, f2:{choices:[10000],unit:'Hz'} },
    statement:function(p){ return '신호 대역이 '+p.f1+' Hz~'+p.f2+' Hz다. 양끝에서 이득이 최소 0.9 이상이 되도록 (a) LPF 차단 f_L의 최소값 (b) HPF 차단 f_H의 최대값을 구하라.'; },
    solve:function(p){
      var kmax=Math.sqrt(1/(0.9*0.9)-1); // |H|=0.9 → k
      var fL=p.f2/kmax, fH=p.f1*kmax;
      return { ans:{fL:fL, fH:fH}, unit:{fL:'Hz', fH:'Hz'}, steps:[
        '|H|=0.9 → (ω/ω₀) = √(1/0.81−1) = '+SVH.fmt(kmax),
        'LPF: 최악은 '+p.f2+' Hz → f_L ≥ '+p.f2+'/'+SVH.fmt(kmax)+' = '+SVH.fmt(fL)+' Hz',
        'HPF: 최악은 '+p.f1+' Hz → f_H ≤ '+SVH.fmt(fH)+' Hz (대역 확보 설계의 기본기)' ] }; },
    hints:['이득 조건을 k로 바꿔 경계 주파수에 적용.'] },
  { id:'u7-l3-07', level:3, type:'num', tags:['직렬 2단 dB 합'], src:'창작 문제(검산됨)',
    params:{ k:{choices:[2,5,10]} },
    statement:function(p){ return '동일한 1차 LPF 2단을 버퍼로 격리해 종속 연결했다. ω='+p.k+'ω₀에서 총 이득(dB)을 구하라.'; },
    solve:function(p){
      var db1=-20*Math.log10(Math.sqrt(1+p.k*p.k));
      return { ans:2*db1, unit:'dB', steps:[
        '1단 이득 = '+SVH.fmt(db1)+' dB',
        '종속(격리) = dB 합 → '+SVH.fmt(2*db1)+' dB (기울기도 −40 dB/dec로 — 2차 필터의 효과)' ] }; },
    hints:['dB는 곱을 합으로 바꾼다.'] },
  { id:'u7-l3-08', level:3, type:'num', tags:['|H|→주파수'], src:'창작 문제(검산됨)',
    params:{ att:{choices:[20,40],unit:'dB'}, f0:{choices:[100,1000],unit:'Hz'} },
    statement:function(p){ return 'f₀='+p.f0+' Hz LPF에서 감쇠가 정확히 '+p.att+' dB가 되는 주파수를 구하라.'; },
    solve:function(p){
      var g=Math.pow(10,-p.att/20), k=Math.sqrt(1/(g*g)-1);
      return { ans:p.f0*k, unit:'Hz', steps:[
        '|H| = 10^{−'+p.att+'/20} = '+SVH.fmt(g),
        'k = √(1/|H|²−1) = '+SVH.fmt(k)+' → f = '+SVH.fmt(p.f0*k)+' Hz',
        '(점근 근사 '+SVH.fmt(p.f0*Math.pow(10,p.att/20))+' Hz와 비교 — 큰 감쇠에선 거의 같다)' ] }; },
    hints:['dB→비율→k 순서로 역산.'] },
  { id:'u7-l3-09', level:3, type:'num', tags:['RL 필터'], src:'창작 문제(검산됨)',
    params:{ R:{choices:[100,500],unit:'Ω'}, L:{choices:[10,50],unit:'mH'}, k:{choices:[0.5,2]} },
    statement:function(p){ return 'RL 회로(직렬 L, 출력은 R 양단)는 어떤 필터인가? ω₀=R/L을 구하고 ω='+p.k+'ω₀에서 |H|를 구하라. (LPF=0, HPF=1로 유형 답)'; },
    solve:function(p){
      var w0=p.R/(p.L/1000), m=1/Math.sqrt(1+p.k*p.k);
      return { ans:{type:0, w0:w0, mag:m}, unit:{type:'', w0:'rad/s', mag:''}, steps:[
        '고주파: Z_L=jωL 커짐 → R 출력 작아짐 → 저역통과(0)',
        'ω₀ = R/L = '+SVH.fmt(w0)+' rad/s',
        '|H| = 1/√(1+(ω/ω₀)²) = '+SVH.fmt(m)+' (RC LPF와 같은 함수형!)' ] }; },
    hints:['극한(ω→0, ∞)으로 유형 판정.'] },
  { id:'u7-l3-10', level:3, type:'num', tags:['Q와 대역폭'], src:'창작 문제(검산됨)',
    params:{ w0:{choices:[1000,5000],unit:'rad/s'}, z:{choices:[0.05,0.1,0.25]} },
    statement:function(p){ return '직렬 RLC 대역통과 응답에서 ω₀='+p.w0+' rad/s, ζ='+p.z+'. (a) 품질계수 Q=1/(2ζ) (b) −3dB 대역폭 B=ω₀/Q를 구하라.'; },
    solve:function(p){ var Q=1/(2*p.z), B=p.w0/Q;
      return { ans:{Q:Q, B:B}, unit:{Q:'', B:'rad/s'}, steps:[
        'Q = 1/(2ζ) = '+SVH.fmt(Q),
        'B = ω₀/Q = '+SVH.fmt(B)+' rad/s (ζ가 작을수록 뾰족한 공진 — 라디오 선국의 원리)' ] }; },
    hints:['Q와 ζ는 역수 관계(×2).'] },
  { id:'u7-l3-11', level:3, type:'num', tags:['λ 근 계산'], src:'창작 문제(검산됨)',
    params:{ w0:{choices:[10,100],unit:'rad/s'}, z:{choices:[0.6,0.8]} },
    statement:function(p){ return '특성방정식 \\(s^2+2\\zeta\\omega_0 s+\\omega_0^2=0\\) (ω₀='+p.w0+', ζ='+p.z+')의 근의 (a) 실수부 (b) 허수부(양수 쪽)를 구하라.'; },
    solve:function(p){
      var re=-p.z*p.w0, im=p.w0*Math.sqrt(1-p.z*p.z);
      return { ans:{re:re, im:im}, unit:{re:'1/s', im:'rad/s'}, steps:[
        's = −ζω₀ ± jω₀√(1−ζ²)',
        '실수부 = '+SVH.fmt(re)+' (감쇠율), 허수부 = '+SVH.fmt(im)+' (=ω_d)',
        '(실수부가 지수 봉투, 허수부가 진동 주파수 — 파형 읽기와 직결)' ] }; },
    hints:['근의 공식 표준형 그대로.'] },
  { id:'u7-l3-12', level:3, type:'num', tags:['입력 스펙트럼 필터링'], src:'기출 유형',
    params:{ A1:{choices:[4,6],unit:'V'}, A2:{choices:[2,3],unit:'V'}, k2:{choices:[10,20]} },
    statement:function(p){ return '입력 \\(v_{in}='+p.A1+'\\cos(0.1\\omega_0 t)+'+p.A2+'\\cos('+p.k2+'\\omega_0 t)\\)가 1차 LPF를 지난다. 출력 각 성분의 진폭을 구하라.'; },
    solve:function(p){
      var g1=1/Math.sqrt(1+0.01), g2=1/Math.sqrt(1+p.k2*p.k2);
      return { ans:{V1:p.A1*g1, V2:p.A2*g2}, unit:{V1:'V', V2:'V'}, steps:[
        '선형 → 성분별 |H| 곱(중첩): 0.1ω₀: |H|='+SVH.fmt(g1)+' → '+SVH.fmt(p.A1*g1)+' V',
        p.k2+'ω₀: |H|='+SVH.fmt(g2)+' → '+SVH.fmt(p.A2*g2)+' V',
        '(신호는 살고 고주파만 죽는다 — 필터링의 정량 그림)' ] }; },
    hints:['주파수 성분마다 따로 |H|.'] },
  { id:'u7-l3-13', level:3, type:'num', tags:['버퍼 없는 2단 로딩'], src:'창작 문제(검산됨)',
    params:{ R:{choices:[1,10],unit:'kΩ'} },
    statement:function(p){ return '같은 R='+p.R+' kΩ·C인 RC LPF 2단을 버퍼 없이 직결하면 DC 근처(ω→0)에서 뒷단이 앞단에 주는 부하 때문에 이득이 1보다 작아질까? ω→0 극한 이득과, 부하 효과가 사라지는 이유를 답하라. (이득 값으로)'; },
    solve:function(p){
      return { ans:1, unit:'', steps:[
        'ω→0: C 개방 → 뒷단 입력 임피던스 ∞ → 부하 효과 없음',
        '따라서 DC 이득 = 1 (문제는 중간 주파수 — 거기선 상호작용으로 −3dB점이 이동한다)',
        '(버퍼가 필요한 이유는 "차단 근처"의 로딩 때문이라는 것까지)' ] }; },
    hints:['ω→0에서 C가 어떻게 보이는지.'] },
  { id:'u7-l3-14', level:3, type:'num', tags:['오버슈트'], src:'창작 문제(검산됨)',
    params:{ z:{choices:[0.2,0.4,0.6]} },
    statement:function(p){ return 'ζ='+p.z+'인 부족감쇠 2차계의 스텝 응답 오버슈트 \\(M_p=e^{-\\pi\\zeta/\\sqrt{1-\\zeta^2}}\\)를 %로 구하라.'; },
    solve:function(p){
      var Mp=Math.exp(-Math.PI*p.z/Math.sqrt(1-p.z*p.z))*100;
      return { ans:Mp, unit:'%', steps:[
        'M_p = e^{−πζ/√(1−ζ²)}×100',
        '= '+SVH.fmt(Mp)+' % (ζ 0.2→~53%, 0.7→~5% — 자동제어(MECH387)와 공유되는 공식)' ] }; },
    hints:['지수 안 분모의 √(1−ζ²).'] },

  /* ---------- L4 (8) ---------- */
  { id:'u7-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'옳은 것을 모두 고르면?<br>㉠ 수동 RC 필터의 통과대역 이득은 1을 넘을 수 없다<br>㉡ −3dB점에서 출력 전력은 절반이다<br>㉢ 1차 LPF의 위상은 −90°를 넘어 지연될 수 있다<br>㉣ 필터 차수가 높을수록 저지대역 기울기가 가파르다',
    choices:['㉠㉡㉣','㉠㉢','㉡㉢㉣','전부'],
    answer:0, expl:'1차는 −90°가 한계(㉢ ✗). 수동 소자는 증폭 불가·전력 절반·차수∝기울기 모두 표준 결과.' },
  { id:'u7-l4-02', level:4, type:'derive', tags:['기출 6(b) 유도'], src:'기출 유형',
    statement:'RC 저역통과 필터의 \\(H(j\\omega)=V_o/V_i\\)를 임피던스 분압으로 유도하고, 크기·위상 식과 세 극한(ω→0, ω₀, ∞)을 정리하라. (기출 6(b)·(c) 완전 재현)',
    steps:[
      '구성: 입력 → R 직렬 → 출력 = C 양단. 임피던스 분압: \\(H=\\dfrac{Z_C}{R+Z_C}=\\dfrac{1/j\\omega C}{R+1/j\\omega C}\\) [왜] AC에서 분압 법칙은 복소 임피던스로 그대로',
      '분자·분모에 jωC 곱: \\(H=\\dfrac{1}{1+j\\omega RC}=\\dfrac{1}{1+j\\omega/\\omega_0}\\), \\(\\omega_0=1/RC\\)',
      '크기: \\(|H|=1/\\sqrt{1+(\\omega/\\omega_0)^2}\\), 위상: \\(\\angle H=-\\tan^{-1}(\\omega/\\omega_0)\\)',
      '세 극한: ω→0 ⇒ |H|=1, 0° (통과) · ω=ω₀ ⇒ 1/√2(−3dB), −45° · ω→∞ ⇒ ω₀/ω→0, −90° (차단)',
      '차원 체크: ωRC = (1/s)(Ω)(F) = 무차원 ✓ · 극한이 DC(C 개방)·고주파(C 단락) 직관과 일치 ✓'
    ],
    hints:['분압 → 정규화(ω/ω₀) → 크기/위상 분리.','세 극한 값 6개(크기3+위상3)를 표로.'],
    expl:'기출 6(b)(c)가 요구하는 서술 전체. 이 유도를 통째로 쓸 수 있으면 15점 문항이 안정권이다.' },
  { id:'u7-l4-03', level:4, type:'num', tags:['기출 6 풀세트'], src:'기출 유형',
    params:{ wmax:{choices:[2],unit:'rad/s'}, wn:{choices:[2000],unit:'rad/s'}, C:{choices:[1,10],unit:'µF'}, marg:{choices:[10,20]} },
    statement:function(p){ return '기출 6 완전판: 신호 최대 ω='+p.wmax+' rad/s, 잡음 ω≳'+p.wn+' rad/s. 차단을 ω₀='+p.marg+'×'+p.wmax+' rad/s로 두고 C='+p.C+' µF를 쓴다. (a) R(kΩ) (b) 신호 최대 주파수에서의 이득 (c) 잡음 하한에서의 감쇠(dB)를 구하라.'; },
    solve:function(p){
      var w0=p.marg*p.wmax, R=1/(w0*p.C*1e-6)/1000;
      var ks=p.wmax/w0, gs=1/Math.sqrt(1+ks*ks);
      var kn=p.wn/w0, an=-20*Math.log10(Math.sqrt(1+kn*kn));
      return { ans:{R:R, gs:gs, an:an}, unit:{R:'kΩ', gs:'', an:'dB'}, steps:[
        'R = 1/(ω₀C) = '+SVH.fmt(R)+' kΩ',
        '신호: ω/ω₀ = '+SVH.fmt(ks)+' → |H| = '+SVH.fmt(gs)+' (사실상 무손실)',
        '잡음: ω/ω₀ = '+SVH.fmt(kn)+' → '+SVH.fmt(an)+' dB',
        '(차단 위치 선택의 트레이드오프: 너무 낮으면 신호 손실, 너무 높으면 잡음 잔존)' ] }; },
    hints:['ω₀부터 확정 → R → 두 주파수 평가.'] },
  { id:'u7-l4-04', level:4, type:'num', tags:['미지 필터 역공학'], src:'기출 유형',
    params:{ g1:{choices:[0.995,0.99]}, f1:{choices:[100],unit:'Hz'}, g2:{choices:[0.1,0.05]}, },
    statement:function(p){ return '측정: f₁='+p.f1+' Hz에서 |H|='+p.g1+', 어떤 f₂에서 |H|='+p.g2+'인 1차 LPF다. (a) f₀ (b) f₂를 구하라.'; },
    solve:function(p){
      var k1=Math.sqrt(1/(p.g1*p.g1)-1), f0=p.f1/k1;
      var k2=Math.sqrt(1/(p.g2*p.g2)-1), f2=f0*k2;
      return { ans:{f0:f0, f2:f2}, unit:{f0:'Hz', f2:'Hz'}, steps:[
        'f₁에서: (f₁/f₀) = √(1/|H|²−1) = '+SVH.fmt(k1)+' → f₀ = '+SVH.fmt(f0)+' Hz',
        'f₂ = f₀×√(1/'+p.g2+'²−1) = '+SVH.fmt(f2)+' Hz',
        '(측정 두 점이면 1차 필터는 완전히 결정된다)' ] }; },
    hints:['|H|→k 역산을 두 번.'] },
  { id:'u7-l4-05', level:4, type:'num', tags:['RLC 스텝 종합'], src:'기출 유형',
    params:{ R:{choices:[40,80],unit:'Ω'}, L:{choices:[10],unit:'mH'}, C:{choices:[2.5,10],unit:'µF'} },
    statement:function(p){ return '직렬 RLC(R='+p.R+' Ω, L='+p.L+' mH, C='+p.C+' µF)의 스텝 응답에 대해 (a) ω₀ (b) ζ (c) ω_d(부족감쇠 아니면 0) (d) 오버슈트 %(부족감쇠 아니면 0)를 구하라.'; },
    solve:function(p){
      var L=p.L/1000, C=p.C*1e-6;
      var w0=1/Math.sqrt(L*C), z=p.R/2*Math.sqrt(C/L);
      var wd=z<1?w0*Math.sqrt(1-z*z):0;
      var Mp=z<1?Math.exp(-Math.PI*z/Math.sqrt(1-z*z))*100:0;
      return { ans:{w0:w0, z:z, wd:wd, Mp:Mp}, unit:{w0:'rad/s', z:'', wd:'rad/s', Mp:'%'}, steps:[
        'ω₀ = 1/√(LC) = '+SVH.fmt(w0)+' rad/s, ζ = (R/2)√(C/L) = '+SVH.fmt(z),
        (z<1?'부족감쇠: ω_d = '+SVH.fmt(wd)+' rad/s':'ζ≥1: 진동 없음(ω_d=0)'),
        (z<1?'M_p = e^{−πζ/√(1−ζ²)} = '+SVH.fmt(Mp)+' %':'오버슈트 0 %'),
        '(2차 3대 수치: ω₀·ζ·M_p — MECH387 시간응답의 예고편)' ] }; },
    hints:['ζ 판정 후 분기.'] },
  { id:'u7-l4-06', level:4, type:'num', tags:['설계 트레이드오프'], src:'창작 문제(검산됨)',
    params:{ fs:{choices:[1000],unit:'Hz'}, fn:{choices:[50000],unit:'Hz'}, gmin:{choices:[0.95,0.99]}, amin:{choices:[26,32],unit:'dB'} },
    statement:function(p){ return '요구: 신호 f_s='+p.fs+' Hz에서 이득 ≥'+p.gmin+', 잡음 f_n='+SVH.si(p.fn,'Hz')+'에서 감쇠 ≥'+p.amin+' dB. 1차 LPF의 f₀ 허용 범위 [f₀min, f₀max]를 구하고, 설계 가능 여부를 판정하라(가능=1/불가=0).'; },
    solve:function(p){
      var kg=Math.sqrt(1/(p.gmin*p.gmin)-1), f0min_g=p.fs/kg;      // 신호 조건: f0 ≥ fs/kg
      var ga=Math.pow(10,-p.amin/20), ka=Math.sqrt(1/(ga*ga)-1);   // 잡음 조건: f0 ≤ fn/ka
      var f0max=p.fn/ka;
      var ok=f0min_g<=f0max?1:0;
      return { ans:{f0min:f0min_g, f0max:f0max, ok:ok}, unit:{f0min:'Hz', f0max:'Hz', ok:''}, steps:[
        '신호: (f_s/f₀) ≤ '+SVH.fmt(kg)+' → f₀ ≥ '+SVH.fmt(f0min_g)+' Hz',
        '잡음: (f_n/f₀) ≥ '+SVH.fmt(ka)+' → f₀ ≤ '+SVH.fmt(f0max)+' Hz',
        (ok?'교집합 존재 → 설계 가능(1). 여유를 반씩 두는 기하평균 f₀=√(min·max)가 무난':'교집합 없음(0) → 1차로는 불가: 2차 이상 필요 — 차수 선택의 근거'),
        ] }; },
    hints:['두 부등식을 f₀로 정리해 교집합.'] },
  { id:'u7-l4-07', level:4, type:'num', tags:['보드 스케치 수치'], src:'기출 유형',
    params:{ f0:{choices:[1000],unit:'Hz'} },
    statement:function(p){ return 'f₀='+p.f0+' Hz LPF의 보드 크기 선도를 그리기 위한 5점: f = 0.1f₀, f₀/2, f₀, 2f₀, 10f₀의 정확한 이득(dB)을 구하라.'; },
    solve:function(p){
      function db(k){ return -20*Math.log10(Math.sqrt(1+k*k)); }
      return { ans:{a:db(0.1), b:db(0.5), c:db(1), d:db(2), e:db(10)}, unit:{a:'dB',b:'dB',c:'dB',d:'dB',e:'dB'}, steps:[
        '0.1f₀: '+SVH.fmt(db(0.1))+' dB (≈0), 0.5f₀: '+SVH.fmt(db(0.5))+' dB',
        'f₀: '+SVH.fmt(db(1))+' dB (−3), 2f₀: '+SVH.fmt(db(2))+' dB, 10f₀: '+SVH.fmt(db(10))+' dB (≈−20)',
        '점근선(0dB, −20dB/dec)과의 최대 오차가 f₀에서 3dB — 스케치 채점 포인트' ] }; },
    hints:['각 점에 정확식 대입 — 점근선과 비교.'] },
  { id:'u7-l4-08', level:4, type:'num', tags:['실험: 스코프 링잉'], src:'기출 유형',
    params:{ T:{choices:[2,4],unit:'ms'}, r:{choices:[0.5,0.25]} },
    statement:function(p){ return '스텝 입력 후 스코프 파형: 진동 주기 '+p.T+' ms, 연속한 두 봉우리의 진폭비 '+p.r+'. (a) ω_d (b) 감쇠율 σ=−ln(r)/T (c) ζ를 구하라. (로그 감쇠법)'; },
    solve:function(p){
      var wd=2*Math.PI/(p.T/1000);
      var sg=-Math.log(p.r)/(p.T/1000);
      var z=sg/Math.hypot(sg,wd);
      return { ans:{wd:wd, sg:sg, z:z}, unit:{wd:'rad/s', sg:'1/s', z:''}, steps:[
        'ω_d = 2π/T = '+SVH.fmt(wd)+' rad/s',
        'σ = −ln('+p.r+')/T = '+SVH.fmt(sg)+' 1/s (봉우리들이 e^{−σt} 봉투를 따른다)',
        'ζ = σ/√(σ²+ω_d²) = '+SVH.fmt(z)+' — 파형만으로 2차계 파라미터 완전 복원 (실험 3 대비)' ] }; },
    hints:['주기→ω_d, 진폭비→σ.','ζ = σ/ω₀, ω₀=√(σ²+ω_d²).'] }
  ]
});

<script>
window.SV_CONTENT = {"course": {"bigpicture": "\n<p><b>이 과목의 단 하나의 물음</b> — 임의의 회로망이 주어졌을 때, 모든 지점의 전압 \\(V\\)와 전류 \\(I\\)를\n<b>체계적으로</b>(감이 아니라 절차로) 구하는 방법은 무엇인가. 답은 놀랄 만큼 경제적이다:\n법칙은 단 셋 — 옴 법칙<span class=\"en\">(Ohm's law)</span> \\(V=IR\\), 키르히호프 전류법칙 KCL, 전압법칙 KVL — 이고,\n나머지 전부는 이 셋을 빠르고 안전하게 굴리는 <b>기술</b>이다.</p>\n<p><b>서사는 3막이다.</b></p>\n<p>① <b>저항 회로의 완성 (U1→U4)</b>: 언어와 법칙(U1) → 직렬·병렬 압축과 분배(U2) →\n연립방정식의 기계화인 절점·망로 해석(U3) → 회로를 두 부품으로 요약하는 테브난·노턴과 중첩(U4).\nU4가 끝나면 어떤 저항 회로도 \"풀 수 있는가\"가 아니라 \"몇 분 걸리는가\"의 문제가 된다.</p>\n<p>② <b>시간이 흐르기 시작한다 (U5→U6)</b>: 축전기 \\(i=C\\,dv/dt\\)와 인덕터 \\(v=L\\,di/dt\\)가 미분을 데려온다(U5 전반).\n정현파 정상상태라면 페이저<span class=\"en\">(phasor)</span>가 미분방정식을 복소 산수로 바꾸고(U5 후반) —\n임피던스 \\(Z\\)만 끼우면 ①막의 모든 기술이 그대로 재사용된다. 스위치가 딸깍하는 순간의 과도응답은\n시정수 \\(\\tau\\) 하나로 요약되는 1차 지수 곡선이다(U6).</p>\n<p>③ <b>주파수의 눈 (U7)</b>: 회로를 \"주파수별 필터\"로 읽는다. 전달함수 \\(H(j\\omega)\\), −3dB 차단주파수,\n보드 선도<span class=\"en\">(Bode plot)</span> — 신호 처리·통신·제어(MECH387)로 나가는 관문이다.</p>\n<div class=\"mapline\">U1 법칙 3종 → U2 등가·분배 → U3 절점·망로(기계화) → U4 테브난·중첩(요약) → U5 C·L·페이저 → U6 과도응답(τ) → U7 주파수응답·필터</div>\n<p><b>시험 전략</b> — 기출 구조(중간 1세트 분석): 다중선택 개념 30점 + 절점/망로 대형 계산 + 페이저 + RC 스위칭 20점 + 필터 설계 15점.\n즉 <b>[개념]</b> 수동부호규약·전원 성질·정리들의 성립 조건, <b>[계산]</b> 절점·망로 연립과 완전응답 공식\n\\(v(t)=v_\\infty+(v_0-v_\\infty)e^{-t/\\tau}\\), <b>[설계]</b> 차단주파수 맞추는 RC 선정.\n전 단원에서 \"회로를 그리고 기준(부호·방향)을 먼저 박는\" 습관이 점수의 절반이다.</p>"}, "u1": {"concept": "\n<div class=\"bigpic\"><span class=\"bt\">U1 큰그림</span>\n회로 해석의 헌법을 제정하는 단원이다. 변수 4개(전하 \\(q\\)·전류 \\(I\\)·전압 \\(V\\)·전력 \\(P\\)), 법칙 3개(옴·KCL·KVL),\n그리고 부호를 다스리는 규약 1개(수동부호규약). 이후 여섯 단원은 새 법칙을 단 하나도 추가하지 않는다 —\n전부 이 헌법의 시행령이다. 여기서 부호가 흔들리면 U3 연립에서 반드시 무너진다.</div>\n\n<h4>1. 네 가지 변수 — 회로의 언어 <span class=\"en\">(Charge, Current, Voltage, Power)</span><span class=\"tagm\">계산 필수</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — \"전기가 흐른다\"를 계산 가능한 양으로 바꿔야 한다. 무엇이 흐르고, 무엇이 밀며, 무엇이 소비되는가?</div>\n<p><b>개념 등장</b> — 흐르는 것은 전하 \\(q\\)[C]. 그 시간율이 전류:</p>\n<p>\\[ I=\\frac{dq}{dt}\\ \\ [\\mathrm{A=C/s}] \\]</p>\n<p>미는 것은 전압 — 단위 전하가 두 점 사이를 이동할 때 주고받는 에너지 \\(V=dw/dq\\) [V=J/C].\n전압은 언제나 <b>두 점 사이</b>의 양(높이차와 같다)이라 기준점(접지) 선언이 먼저다.\n에너지의 시간율이 전력:</p>\n<p>\\[ P=VI\\ \\ [\\mathrm{W=J/s}] \\]</p>\n<p>전류는 방향(화살표), 전압은 극성(+/−)을 <b>먼저 임의로 박고</b> 계산 결과의 부호로 실제를 읽는다 —\n\"화살표를 잘못 그려도 답은 음수로 알려준다\"가 회로 해석의 태도다.</p>\n<p class=\"intuit\">💡 <b>직관</b> — 수로 비유: 전류=유량, 전압=수위차, 전력=수차가 뽑는 일률. 비유는 KCL(물은 안 새고)·KVL(한 바퀴 돌면 제자리)까지 정확히 이어진다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] q↔I 적분, P=VI=I²R=V²/R 3형제 환산. [개념] 전압이 \"두 점 사이\" 양임을 묻는 선지 — 한 점의 전압은 기준 선언 후에만 의미.</div>\n\n<h4>2. 수동부호규약 — 부호의 헌법 <span class=\"en\">(Passive Sign Convention)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — P=VI로 계산했더니 −20W가 나왔다. 이 소자는 전력을 먹는가, 내놓는가? 규약 없이는 답이 없다.</div>\n<p><b>규약</b> — 전류 화살표가 전압의 <b>+ 단자로 들어가게</b> 잡았을 때:</p>\n<p>\\[ P=VI>0\\ \\Rightarrow\\ \\text{흡수(소비)},\\qquad P<0\\ \\Rightarrow\\ \\text{공급} \\]</p>\n<p>저항은 항상 흡수(\\(P=I^2R\\ge0\\)), 전원은 대개 공급이지만 충전당하는 배터리처럼 흡수일 수도 있다 —\n부호가 그 역할을 판정한다. 회로 전체에선 \\(\\sum P=0\\)(에너지 보존): 모든 문제의 공짜 검산기다.</p>\n<p class=\"intuit\">💡 <b>직관</b> — \"+로 들어가며 떨어지면 소비\". 규약은 진리가 아니라 약속이지만, 온 세계 교재가 같은 약속을 쓴다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[개념] 다중선택 단골 — 각 소자의 P 부호 판정, ΣP=0 검산. [함정] 화살표가 −단자로 들어가게 그려진 그림에서 부호 뒤집기.</div>\n\n<h4>3. 전원 — 이상 전원과 종속 전원 <span class=\"en\">(Independent &amp; Dependent Sources)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 트랜지스터 증폭기를 회로 이론으로 다루려면 \"다른 곳의 전압·전류에 조종되는 전원\"이 필요하다.</div>\n<p><b>개념</b> — 이상 전압원은 전류와 무관하게 \\(V\\)를 유지(내부저항 0), 이상 전류원은 전압과 무관하게 \\(I\\)를 유지(내부저항 ∞).\n종속 전원<span class=\"en\">(dependent source)</span>은 제어 변수에 비례하는 전원 4종(VCVS·VCCS·CCVS·CCCS) —\n증폭기·트랜지스터의 회로 모델이다. 해석 규칙: <b>종속 전원은 켠 채로 둔다</b>(중첩·테브난에서 끄는 것은 독립 전원만, U4).</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[개념] 이상 전원의 정의(내부저항), 종속 전원 4종 구별. [계산] 종속 전원 낀 회로는 U3·U4에서 집중 — 여기선 정의를 정확히.</div>\n\n<h4>4. 법칙 3종 — 옴·KCL·KVL <span class=\"en\">(Ohm's Law &amp; Kirchhoff's Laws)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 소자 하나의 성질(옴)만으론 회로망을 못 푼다. 소자들이 <b>연결</b>됐다는 사실 자체가 주는 방정식이 필요하다.</div>\n<p><b>법칙</b> — ① 옴 법칙 \\(V=IR\\): 저항 양단 전압은 전류에 비례(수동부호규약 방향으로).\n② KCL<span class=\"en\">(Kirchhoff's Current Law)</span>: 임의 절점에서 \\(\\sum I_{in}=\\sum I_{out}\\) — 전하 보존.\n③ KVL<span class=\"en\">(Kirchhoff's Voltage Law)</span>: 임의 폐루프에서 \\(\\sum V=0\\) — 에너지 보존(한 바퀴 돌면 제 높이).</p>\n<p>구조적 사실: 절점 \\(n\\)개·가지 \\(b\\)개 회로에서 독립 KCL은 \\(n-1\\)개, 독립 KVL은 \\(b-n+1\\)개 —\n합치면 미지수 \\(b\\)개(가지 전류)와 정확히 맞는다. U3의 절점법·망로법은 이 세기를 체계적으로 뽑는 알고리즘일 뿐이다.</p>\n<p class=\"intuit\">💡 <b>직관</b> — KCL은 \"물이 안 샌다\", KVL은 \"등산로 한 바퀴의 고도차 합=0\". 옴은 소자의 사정, K법칙은 연결의 사정.</p>\n<p>🔗 <b>연결</b> — U2의 직렬·병렬 공식은 전부 K법칙 2~3줄 유도의 캐시(암기용 결과)다. 유도 과정을 한 번은 손으로 — 수식 레이어.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] 단일 루프·단일 절점 직접 적용. [서술] 독립 방정식 개수(n−1, b−n+1). [함정] KVL 순회 부호(전압 상승 +로 통일할 것).</div>", "derive": [{"title": "p = vi 가 '흡수'인 이유 (정의→전력)", "steps": ["전압 정의 \\(v=dw/dq\\): + → − 로 단위 전하가 이동하며 소자에 에너지를 넘긴다.", "전류 기준을 + 단자 유입으로: \\(i=dq/dt\\).", "연쇄율: \\(p=\\dfrac{dw}{dt}=\\dfrac{dw}{dq}\\cdot\\dfrac{dq}{dt}=vi\\) — w가 '소자가 받은' 에너지이므로 p>0 = 흡수.", "부호 반전 2경우: 실제 전류가 기준과 반대(i<0), 또는 극성 반대(v<0) → 공급.", "차원 체크: (J/C)(C/s)=J/s=W ✓ · 극한 체크: v=0 또는 i=0 → p=0 ✓"]}, {"title": "KCL·KVL의 출처 (보존 법칙)", "steps": ["KCL: 절점은 전하를 저장하지 못한다(이상 도체 접합) → \\(\\sum i_{in}=\\sum i_{out}\\).", "KVL: 폐루프를 돈 단위 전하의 에너지 변화 = 0 (보존장) → \\(\\sum v = 0\\).", "독립 식 수: KCL은 절점−1개, KVL은 독립 루프 수 — U3 해석법의 뼈대.", "전위가 존재하는 이유: ∮E·dl=0 (시변 자기장이 관통하면 깨진다 — 한계까지).", "극한 체크: 가지 하나뿐인 절점이면 i=0 ✓ · 소자 하나뿐인 루프면 v=0 ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 1-1</span>소자 양단 12 V(+가 위), 전류 2 A가 −단자로 유입. 이 소자는 전력을 흡수하는가 공급하는가, 얼마나?</div><div class=\"xsol\"><b>풀이</b><ol><li>기준 확인: 전류가 +단자로 들어가야 p=vi가 흡수 → 지금은 반대이므로 i=−2 A.</li><li>p = 12×(−2) = −24 W → <b>24 W 공급</b>.</li><li>검토: 전류를 +쪽으로 밀어올리는 소자 = 전원 역할 ✓</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u1-l2-05 · u1-l2-12 · u1-l4-06</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 1-2</span>\\(q(t)=3t^2+2t\\) C가 5 Ω 저항을 지난다. t=2 s의 순시 전력은?</div><div class=\"xsol\"><b>풀이</b><ol><li>\\(i=dq/dt=6t+2\\) → i(2)=14 A.</li><li>\\(p=i^2R=14^2×5=\\) <b>980 W</b>.</li><li>차원: [A²·Ω]=[W] ✓</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u1-l2-02 · u1-l3-01 · u1-l3-13</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 1-3</span>기전력 12 V·내부저항 0.5 Ω 전원이 부하에 4 A를 공급한다. 단자 전압과 효율은?</div><div class=\"xsol\"><b>풀이</b><ol><li>\\(V_t=12−4×0.5=\\) <b>10 V</b>.</li><li>효율 = V_t/V_s = 10/12 = <b>83.3%</b> (전류 약분).</li><li>내부저항 손실 = 4²×0.5 = 8 W가 어디로 갔는지 설명할 수 있어야 한다.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u1-l3-09 · u1-l3-04 · u1-l4-02</div></div>"}, "u2": {"concept": "\n<div class=\"bigpic\"><span class=\"bt\">U2 큰그림</span>\nU1의 법칙을 \"매번 연립\"으로 쓰면 느리다. 이 단원은 자주 나오는 연결 패턴 — 직렬·병렬·분배·사다리·브리지 — 을\n공식으로 캐시해서 회로를 <b>눈으로 압축</b>하는 기술을 만든다. U3(연립이 정말 필요한 경우)와의 분업이 포인트:\n등가로 줄일 수 있는 데까지 줄이고, 남는 것만 연립한다. U5에서 임피던스가 등장하면 이 공식들이 복소수 버전으로 전부 재사용된다.</div>\n\n<h4>1. 직렬·병렬 등가 <span class=\"en\">(Series &amp; Parallel Equivalents)</span><span class=\"tagm\">계산 필수</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 저항 열 개짜리 회로도, 전원에서 보면 \"하나의 저항\"처럼 행동한다. 그 하나를 빨리 구하자.</div>\n<p><b>공식</b> — 같은 전류가 꿰뚫으면 직렬: \\(R_{eq}=R_1+R_2+\\cdots\\) (KVL에서).\n같은 전압이 걸리면 병렬: \\(\\dfrac{1}{R_{eq}}=\\dfrac{1}{R_1}+\\dfrac{1}{R_2}+\\cdots\\) (KCL에서), 두 개면 \\(R_{eq}=\\dfrac{R_1R_2}{R_1+R_2}\\).</p>\n<p>감각 세 개: 병렬 등가는 가장 작은 저항보다 작다 · 같은 값 \\(n\\)개 병렬은 \\(R/n\\) ·\n큰 저항과 작은 저항의 병렬은 작은 쪽 근처(큰 쪽은 \"거의 없는 길\"). 판정 기준은 <b>모양이 아니라 연결</b>(같은 두 절점 사이=병렬)이다.</p>\n<p class=\"intuit\">💡 <b>직관</b> — 직렬은 좁은 길이 이어진 것(저항 누적), 병렬은 차선이 늘어난 것(컨덕턴스 \\(G=1/R\\) 누적).</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] R_eq 사다리 압축(끝에서부터 접는다). [함정] 그림을 90° 돌려 그린 병렬, 도선으로 단락된 저항(=0Ω 취급).</div>\n\n<h4>2. 분배 법칙 — 전압은 저항에, 전류는 컨덕턴스에 <span class=\"en\">(Voltage &amp; Current Division)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 전체를 다 풀지 않고 \"이 저항에 걸리는 전압만\" 빨리 알고 싶다.</div>\n<p><b>공식</b> — 직렬(같은 I)에서 전압분배와, 2병렬(같은 V)에서 전류분배:</p>\n<p>\\[ V_k=V\\,\\frac{R_k}{R_1+R_2+\\cdots} \\qquad\\qquad I_1=I\\,\\frac{R_2}{R_1+R_2} \\]</p>\n<p>전류분배 분자에 <b>상대편 저항</b>이 오는 것(전류는 쉬운 길을 더 간다)이 최다 실수 지점.\nn갈래 일반형은 \\(I_k=I\\,G_k/\\sum G\\) — \"전류는 컨덕턴스 비례\"로 기억하면 헷갈리지 않는다.</p>\n<p><b>응용 — 분압기의 부하 효과</b><span class=\"en\">(loading effect)</span>: 분압기 출력에 부하 \\(R_L\\)을 달면\n아래 저항이 \\(R_2\\parallel R_L\\)로 바뀌어 출력이 처진다. \"측정기가 회로를 바꾼다\"의 첫 사례 — U4 테브난이 이 문제의 정식 해법이다.</p>\n<p class=\"intuit\">💡 <b>직관</b> — 분배는 비례배분: 전압은 \"누가 더 버티나(R)\", 전류는 \"누가 더 잘 통하나(G)\".</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] 2단 분배 연쇄(등가→분배→분배), 부하 낀 분압기. [함정] 전류분배 분자 바꿔치기, 분배 공식을 병렬 전압에 잘못 적용.</div>\n\n<h4>3. 브리지와 균형 <span class=\"en\">(Wheatstone Bridge)</span><span class=\"tagm\">계산 필수</span></h4>\n<p>브리지 균형 조건 \\(R_1R_4=R_2R_3\\)(맞은편 곱 동일)이면 가운데 가지에 전류가 없다 — 검류계 0을 이용한 정밀 저항 측정의 원리.\n균형이면 가운데를 떼거나 붙여도 같아서 회로가 직·병렬로 붕괴한다. 불균형 브리지는 U3(절점법)이나 U4(테브난)의 몫 —\n\"균형 확인 먼저\"가 풀이 순서다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] 균형 판정 후 등가 계산. [개념] 균형의 물리(가운데 양단 등전위).</div>", "derive": [{"title": "분압 법칙 유도와 3중 극한 검증", "steps": ["직렬 = 같은 전류: 갈라질 절점이 없다 (KCL).", "KVL: \\(v_s=i(R_1+R_2)\\) → \\(i=v_s/(R_1+R_2)\\).", "옴: \\(v_2=iR_2=v_s\\dfrac{R_2}{R_1+R_2}\\).", "극한: R₂→∞ ⇒ v₂→v_s ✓ · R₂→0 ⇒ 0 ✓ · R₁=R₂ ⇒ 절반 ✓", "부하가 붙으면 1행(같은 전류)이 깨진다 — 부하 효과의 정확한 원인. 차원: 무차원 비 × [V] ✓"]}, {"title": "분류 법칙 — 왜 '반대편'이 분자인가", "steps": ["병렬 = 같은 전압 v: \\(i_1=v/R_1,\\ i_2=v/R_2\\).", "KCL: \\(i_s=v(1/R_1+1/R_2)\\) → \\(v=i_s\\dfrac{R_1R_2}{R_1+R_2}\\).", "대입: \\(i_1=v/R_1=i_s\\dfrac{R_2}{R_1+R_2}\\) — 분자에 R₂.", "직관: R₁이 작을수록 i₁ 커짐(쉬운 길) ✓", "극한: R₂→∞이면 전부 R₁로 ✓ · 차원: 무차원 비 × [A] ✓"]}, {"title": "브리지 평형 조건", "steps": ["왼쪽 가지 중점: \\(v_A=v_s\\dfrac{R_3}{R_1+R_3}\\), 오른쪽: \\(v_B=v_s\\dfrac{R_4}{R_2+R_4}\\) (가운데 개방 가정).", "평형 = \\(v_A=v_B\\): \\(R_3(R_2+R_4)=R_4(R_1+R_3)\\).", "전개·정리: \\(R_2R_3=R_1R_4\\) — 교차곱 조건.", "평형이면 가운데 어떤 소자를 달아도 전류 0 → 제거 가능(등가 불변).", "극한 체크: 네 저항이 모두 같으면 자명하게 평형 ✓ · 차원: [Ω²]=[Ω²] ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 2-1</span>24 V → 6 Ω 직렬 → (12 Ω ∥ 4 Ω). 병렬부 전압과 12 Ω의 전류는?</div><div class=\"xsol\"><b>풀이</b><ol><li>12∥4 = 3 Ω → 분압 \\(V=24×\\frac{3}{9}\\) = <b>8 V</b>.</li><li>12 Ω 전류 = 8/12 = <b>0.667 A</b>.</li><li>검산: 4 Ω 전류 2 A, 합 2.67 A = 전원 전류 24/9 ✓</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u2-l2-14 · u2-l2-04 · u2-l3-03</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 2-2</span>10 kΩ–10 kΩ 분압기(입력 10 V) 출력에 10 kΩ 부하를 달면 출력은?</div><div class=\"xsol\"><b>풀이</b><ol><li>무부하 5 V.</li><li>부하 시 아래쪽 = 10∥10 = 5 kΩ → \\(V=10×\\frac{5}{15}\\) = <b>3.33 V</b> (33% 하락!).</li><li>교훈: R_L이 출력임피던스와 비슷하면 크게 무너진다.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u2-l3-01 · u2-l4-08 · u2-l3-11</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 2-3</span>브리지 R₁=100, R₂=200, R₃=150 Ω일 때 평형 R₄는? 그리고 R₄가 5% 커지면 중점 전압차의 부호는? (V_s=10 V)</div><div class=\"xsol\"><b>풀이</b><ol><li>교차곱: R₄ = R₂R₃/R₁ = <b>300 Ω</b>.</li><li>R₄↑ → 오른쪽 중점 전압 \\(v_B=v_s\\frac{R_4}{R_2+R_4}\\)↑ → \\(v_A−v_B\\) <b>음수</b>.</li><li>스트레인게이지가 이 부호로 인장/압축을 구분한다.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u2-l3-02 · u2-l4-03 · u2-l4-07</div></div>"}, "u3": {"concept": "\n<div class=\"bigpic\"><span class=\"bt\">U3 큰그림</span>\n등가·분배(U2)로 안 줄어드는 회로의 최종 병기 — 미지수를 최소로 잡고 연립을 <b>기계적으로</b> 세우는 두 알고리즘이다.\n절점전압법은 KCL을, 망로전류법은 KVL을 자동화한다. 기출 대형 계산 문제의 본체이며,\nU5에서 임피던스로 바꿔 끼우면 AC 회로에서도 글자 하나 안 바뀌고 재사용된다. 여기서의 실력 = 부호 규율이다.</div>\n\n<h4>1. 절점전압법 <span class=\"en\">(Nodal Analysis)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 가지 전류를 전부 미지수로 잡으면 b개 연립이다. 더 적은 미지수로 같은 정보를 담을 수 없나?</div>\n<p><b>알고리즘</b> — 미지수를 절점전압 \\(V_1,V_2,\\dots\\)(기준 절점=0V 선언)으로 잡으면 가지 전류는 옴 법칙으로 자동 표현된다:\n① 기준 절점(가지 많은 곳) 선택 ② 나머지 각 절점에 KCL — 나가는 전류를 \\((V_i-V_j)/R\\)로 적는다 ③ 연립 풀기.\n\\(n-1\\)개 방정식으로 끝. 전형 2절점계는:</p>\n<p>\\[ \\Big(\\tfrac1{R_1}+\\tfrac1{R_2}\\Big)V_1-\\tfrac1{R_2}V_2=I_{s1},\\quad\\cdots \\]</p>\n<p>— 대각(자기 컨덕턴스 합)·비대각(−공유 컨덕턴스)의 대칭 패턴이라 검산이 쉽다.</p>\n<p><b>변칙 두 개</b> — 전압원이 두 비기준 절점 사이에 끼면 그 전류를 못 쓰므로 두 절점을 묶어\n<b>초절점</b><span class=\"en\">(supernode)</span>: 묶음 KCL 1개+전압 제약 \\(V_a-V_b=V_s\\) 1개.\n종속 전원은 제어 변수를 절점전압으로 번역해 대입 — 방정식 수는 안 는다.</p>\n<p class=\"intuit\">💡 <b>직관</b> — 절점전압법은 \"수위(전위)를 미지수로, 물길(전류)은 수위차/저항으로\" — KCL이 수지 균형식이 된다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] 2~3절점+종속 전원+초절점이 대형 문항의 표준 배합. [함정] 나가는 방향 통일 안 함, 전압원 가지에 옴 법칙 적용(금지 — 초절점으로).</div>\n\n<h4>2. 망로전류법 <span class=\"en\">(Mesh Analysis)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 절점은 적고 루프가 많은(사다리형) 회로는 절점법이 오히려 크다. 쌍대 도구가 필요하다.</div>\n<p><b>알고리즘</b> — 평면회로의 각 창(mesh)에 순환 망로전류 \\(I_1,I_2,\\dots\\)(관례: 전부 시계방향)를 잡고 KVL:\n공유 가지 전류는 \\(I_i-I_j\\). \\(b-n+1\\)개 방정식. 전류원이 두 망로에 걸치면\n<b>초망로</b><span class=\"en\">(supermesh)</span>: 전류원 가지를 비켜 합친 KVL+전류 제약 \\(I_i-I_j=I_s\\).</p>\n<p><b>선택 기준</b> — 미지수 개수(\\(n-1\\) vs \\(b-n+1\\)) 적은 쪽, 전압원 많으면 망로·전류원 많으면 절점이 대체로 유리.\n둘 다 익혀 교차 검산하는 것이 시험장 안전벨트다. 전압원을 지나는 전류는 KVL이 아니라 <b>그 절점의 KCL</b>로 회수한다.</p>\n<p class=\"intuit\">💡 <b>직관</b> — 절점법:KCL:전위 = 망로법:KVL:순환류. 완전한 쌍대(dual) — 하나를 알면 거울에 비친 다른 하나다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] 시계방향 통일 후 (자기 저항 합)I_i−(공유)I_j=Σ전압상승 패턴. [함정] 공유 가지 부호, 초망로에서 제약식 누락.</div>", "derive": [{"title": "절점 방정식의 행렬 구조 (대칭·대각우세)", "steps": ["2절점 예: KCL@1 \\(G_1v_1+G_2(v_1-v_2)=I_s\\), KCL@2 \\(G_3v_2+G_2(v_2-v_1)=0\\).", "행렬형: \\(\\begin{bmatrix}G_1+G_2&-G_2\\\\-G_2&G_2+G_3\\end{bmatrix}\\!\\begin{bmatrix}v_1\\\\v_2\\end{bmatrix}=\\begin{bmatrix}I_s\\\\0\\end{bmatrix}\\).", "대칭: 비대각 = −(공유 컨덕턴스) — 같은 소자를 양쪽에서 본 것 (종속 전원이 끼면 깨진다).", "대각 우세: 대각 ≥ |비대각 합| — '내 전압을 올리면 나가는 전류가 는다'는 안정성.", "극한 체크: G₂→0 → 대각행렬(두 독립 회로) ✓ · 차원: [S][V]=[A] ✓"]}, {"title": "초노드가 필요한 이유", "steps": ["이상 전압원의 전류는 소자식이 없다(미지수) → 그 절점 KCL에 바로 못 쓴다.", "가우스면을 넓혀 전압원을 포함한 경계(두 절점 묶음)로 KCL → 전원 전류가 내부로 사라진다.", "부족한 식 1개는 전압원이 준다: \\(v_a-v_b=V_s\\).", "쌍대: 공유 전류원 ↔ 초메시, \\(i_a-i_b=I_s\\).", "극한 체크: V_s=0이면 두 절점 병합과 동일 ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 3-1</span>(기출 2(a)형) 3 V 전압원(접지—절점1), 절점1—절점2에 2 Ω, 절점2—접지에 4 Ω, 전류원 2 A가 절점2 유입. 전압원 전류는?</div><div class=\"xsol\"><b>풀이</b><ol><li>v₁=3 V 확정.</li><li>KCL@2: \\((3−v_2)/2+2=v_2/4\\) → v₂=22/3≈7.33 V.</li><li>전압원 전류 = (3−7.33)/2 = <b>−2.17 A</b> (음수: 전류원이 역으로 밀어넣는 중).</li><li>검산: 절점2 KCL 재대입 ✓</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u3-l3-07 · u3-l4-02 · u3-l4-08</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 3-2</span>(초메시) 2메시, 공유 가지에 1 A 전류원, 메시1에 10 V·2 Ω, 메시2에 3 Ω. 두 메시 전류는?</div><div class=\"xsol\"><b>풀이</b><ol><li>구속: i₁−i₂=1.</li><li>초메시 KVL: 10=2i₁+3i₂ → 10=2(i₂+1)+3i₂ → i₂=<b>1.6 A</b>, i₁=<b>2.6 A</b>.</li><li>검산: 전류원 전압 v=10−2×2.6=4.8 V, 메시2 KVL 4.8=3×1.6 ✓</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u3-l2-08 · u3-l3-04 · u3-l3-12</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 3-3</span>(종속 전원) 절점 v: 전류원 4 A 유입, R₁=4 Ω→접지, VCCS 0.5v가 절점에서 접지로. v와 종속 전원의 흡수 전력은?</div><div class=\"xsol\"><b>풀이</b><ol><li>KCL: 4 = v/4 + 0.5v = 0.75v → v = <b>5.33 V</b>.</li><li>종속 전원 전류 = 2.67 A(v에서 접지로) → 흡수 p = 5.33×2.67 = <b>14.2 W</b>.</li><li>수지: 전류원 공급 21.3 W = R(7.1)+종속(14.2) ✓</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u3-l2-10 · u3-l4-04 · u1-l4-06</div></div>"}, "u4": {"concept": "\n<div class=\"bigpic\"><span class=\"bt\">U4 큰그림</span>\n연립(U3)은 만능이지만, \"전원이 여럿일 때 기여를 나눠 보고 싶다\", \"부하만 바꿔가며 여러 번 풀고 싶다\"는 질문엔 비효율적이다.\n이 단원의 정리들 — 중첩·전원 변환·테브난/노턴·최대 전력 전달 — 은 회로의 <b>선형성</b>이 주는 특권이다.\n특히 테브난 등가는 \"복잡한 회로 전체를 \\(V_{th}\\)와 \\(R_{th}\\) 둘로 요약\"하는, 회로 이론에서 가장 실무적인 정리다(계측·모델링·U6 시정수까지).</div>\n\n<h4>1. 선형성과 중첩 <span class=\"en\">(Linearity &amp; Superposition)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 전원이 3개인 회로. 각 전원이 출력에 얼마나 기여하는지 따로 보고 싶다(설계 감각의 기본).</div>\n<p><b>정리</b> — R·독립전원·종속전원으로 된 회로는 선형이라, 임의 응답은 전원별 기여의 합:</p>\n<p>\\[ y=\\sum_k y^{(k)}\\quad(\\text{전원 k만 켜고 나머지는 끔}) \\]</p>\n<p>\"끈다\" = 전압원은 <b>단락</b>(0V), 전류원은 <b>개방</b>(0A). <b>종속 전원은 절대 끄지 않는다</b>(회로의 일부다).\n전력은 \\(I^2R\\)이 비선형이라 중첩 불가 — 전류를 합한 뒤 제곱해야 한다(최다 출제 함정).</p>\n<p class=\"intuit\">💡 <b>직관</b> — 선형 세계에선 \"원인을 쪼개 결과를 더한다\"가 합법. 이 한 줄이 U7 주파수 해석(성분별 처리)의 근거이기도 하다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] 2전원 중첩(각 회로가 U2 수준으로 붕괴하는 쾌감). [함정] 전력 중첩 금지, 종속 전원 끄기 금지 — 개념 선지 단골.</div>\n\n<h4>2. 전원 변환 <span class=\"en\">(Source Transformation)</span><span class=\"tagm\">계산 필수</span></h4>\n<p>직렬 \\(V_s\\)-\\(R\\) ↔ 병렬 \\(I_s\\)-\\(R\\)은 단자 밖에서 완전 동일(\\(V_s=I_sR\\)).\n변환을 연쇄하면 회로가 한쪽으로 \"말려 들어가며\" 단순화된다 — 테브난의 육체노동 버전.\n주의: 변환 순간 <b>내부</b> 변수(그 R의 전류 등)는 의미가 바뀌므로, 묻는 변수는 끝까지 단자 밖에 두어야 한다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] 변환 2~3연쇄로 단일 루프 만들기. [함정] 묻는 소자를 변환에 삼켜버리기.</div>\n\n<h4>3. 테브난·노턴 등가 <span class=\"en\">(Thévenin &amp; Norton Equivalents)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 부하 \\(R_L\\)을 5가지 값으로 바꿔가며 전류를 구하라. 매번 전체 연립을 다시? 회로를 한 번만 풀고 요약해 두자.</div>\n<p><b>정리</b> — 선형 2단자 회로는 단자 밖에서 전압원 \\(V_{th}\\)+직렬 \\(R_{th}\\)(테브난) 또는\n전류원 \\(I_N\\)+병렬 \\(R_N\\)(노턴)과 완전히 등가다:</p>\n<p>\\[ V_{th}=V_{oc}\\ (\\text{개방 전압}),\\qquad I_N=I_{sc}\\ (\\text{단락 전류}),\\qquad\nR_{th}=R_N=\\frac{V_{oc}}{I_{sc}} \\]</p>\n<p>\\(R_{th}\\) 구하는 법 3종: ① 독립전원 끄고 단자에서 본 등가저항(종속 전원 없을 때) ② \\(V_{oc}/I_{sc}\\)\n③ 시험전원 인가(종속 전원 있으면 ②·③만). 측정 기반 등가(두 부하점에서 V·I 재서 직선의 절편·기울기)도 같은 그림 —\n\"모든 선형 회로는 단자에서 보면 직선 \\(V=V_{oc}-R_{th}I\\)\"이라는 문장이 이 단원의 요지다.</p>\n<p class=\"intuit\">💡 <b>직관</b> — 테브난은 회로의 \"명함\": 밖에서 물어볼 수 있는 것(개방 전압·내부 저항) 둘만 남기고 전부 접는다.</p>\n<p>🔗 <b>연결</b> — U6에서 C가 보는 저항 = R_th → τ=R_thC. U2 부하 효과의 정식 해법. 최대 전력 전달의 무대.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] V_oc(절점법)→I_sc 또는 R_th→부하 질문. 종속 전원 낀 R_th(시험전원법)가 고배점. [함정] R_th 구할 때 종속 전원까지 끄는 오답.</div>\n\n<h4>4. 최대 전력 전달 <span class=\"en\">(Maximum Power Transfer)</span><span class=\"tagm\">계산 필수</span></h4>\n<p>테브난 등가에 부하를 달면 \\(P_L=\\Big(\\dfrac{V_{th}}{R_{th}+R_L}\\Big)^2R_L\\) — 미분하면 \\(R_L=R_{th}\\)에서 최대:</p>\n<p>\\[ P_{max}=\\frac{V_{th}^2}{4R_{th}} \\]</p>\n<p>이때 효율은 50%(절반은 \\(R_{th}\\)가 태운다) — \"최대 전력\"과 \"최대 효율\"은 다른 목표라는 개념 선지가 함께 나온다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] 테브난 요약 후 P_max 한 줄. [개념] 매칭 조건과 효율 50%.</div>", "derive": [{"title": "최대 전력 전달 정리", "steps": ["\\(P_L=\\left(\\dfrac{V_T}{R_T+R_L}\\right)^2R_L\\) — 변수 R_L 하나의 함수.", "\\(\\dfrac{dP_L}{dR_L}=V_T^2\\dfrac{R_T-R_L}{(R_T+R_L)^3}=0\\) → \\(R_L=R_T\\).", "부호: R_L<R_T에서 +, 지나면 − → 최대 확정.", "\\(P_{max}=V_T^2/4R_T\\), R_T에도 같은 전력 → 효율 50%.", "극한 체크: R_L→0, ∞ 모두 P→0 ✓ · 차원 [V²/Ω]=[W] ✓"]}, {"title": "전원 변환의 성립 조건", "steps": ["테브난형 단자식: \\(v=V_s-iR\\).", "노턴형 단자식: \\(i=I_s-v/R\\) → \\(v=I_sR-iR\\).", "모든 (v,i)에서 일치 조건: \\(V_s=I_sR\\), 기울기 −R 동일.", "외부에서 본 v–i 직선(절편 V_oc, 기울기 −R_T)만 같으면 내부는 무엇이든 등가.", "극한 체크: 개방 v=V_s=I_sR ✓, 단락 i=V_s/R=I_s ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 4-1</span>12 V — 4 Ω — 절점A(—접지 12 Ω), A — 3 Ω — 단자B. 테브난 등가와 정합 최대 전력은?</div><div class=\"xsol\"><b>풀이</b><ol><li>개방 시 3 Ω 전류 0 → V_oc = 분압 12×12/16 = <b>9 V</b>.</li><li>전원 단락 → R_T = 3+(4∥12) = <b>6 Ω</b>.</li><li>P_max = 81/24 = <b>3.375 W</b> (R_L=6 Ω).</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u4-l3-01 · u4-l4-02 · u4-l3-06</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 4-2</span>(중첩) 10 V — 2 Ω — 절점 — 3 Ω — 접지, 전류원 2 A 절점 유입. 절점 전압?</div><div class=\"xsol\"><b>풀이</b><ol><li>I원 개방: 분압 6 V.</li><li>V원 단락: 2×(2∥3) = 2.4 V.</li><li>합 <b>8.4 V</b>. 절점법 검산: (10−v)/2+2=v/3 → 8.4 ✓</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u4-l2-09 · u4-l3-03 · u4-l3-10</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 4-3</span>(측정 기반) 개방 전압 10 V, 20 Ω을 달았더니 8 V. R_T와, 이 전원에서 뽑을 수 있는 최대 전력은?</div><div class=\"xsol\"><b>풀이</b><ol><li>분압 역산: R_T = R_L(V_oc−V_L)/V_L = 20×2/8 = <b>5 Ω</b>.</li><li>P_max = 100/20 = <b>5 W</b> (R_L=5 Ω일 때).</li><li>단락 없이 등가를 완성하는 실전 절차.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u4-l3-04 · u4-l2-05 · u4-l4-06</div></div>"}, "u5": {"concept": "\n<div class=\"bigpic\"><span class=\"bt\">U5 큰그림</span>\n저항 세계(대수)에 시간(미분)이 들어온다. 전반부: C와 L의 \\(v\\)–\\(i\\) 관계·에너지·DC 정상상태 규칙.\n후반부: 정현파 정상상태<span class=\"en\">(sinusoidal steady state)</span>라면 미분방정식을 풀 필요가 없다는 대발견 —\n페이저 변환이 \\(d/dt\\)를 \\(j\\omega\\) 곱으로 바꿔, 임피던스 \\(Z\\)라는 \"복소 저항\"으로 U1~U4의 모든 기술을 재사용하게 한다.\n이 단원이 서면 U6(과도)·U7(주파수응답)은 각각 \"지수 하나\"와 \"H(jω) 읽기\"로 줄어든다.</div>\n\n<h4>1. 축전기와 인덕터 <span class=\"en\">(Capacitor &amp; Inductor)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 저항은 현재만 산다(\\(V=IR\\)). 에너지를 <b>저장</b>했다가 내놓는 소자는 어떤 수식이 필요한가?</div>\n<p><b>관계식</b> — 축전기는 전하를(전기장에), 인덕터는 전류를(자기장에) 저장한다:</p>\n<p>\\[ i_C=C\\frac{dv}{dt},\\qquad v_L=L\\frac{di}{dt},\\qquad\nW_C=\\tfrac12Cv^2,\\qquad W_L=\\tfrac12Li^2 \\]</p>\n<p>따라오는 연속성 규칙: \\(v_C\\)와 \\(i_L\\)은 <b>순간 점프 불가</b>(점프하면 무한 전류/전압) —\nU6 스위칭에서 초기값을 잇는 다리다. DC 정상상태(모든 미분=0)에선:</p>\n<p>\\[ \\text{C는 개방}^{\\ (i_C=0)},\\qquad \\text{L은 단락}^{\\ (v_L=0)} \\]</p>\n<p>— 이 두 줄로 DC 회로의 C·L을 지우고 저항 회로(U1~U4)로 되돌린다. 결합 규칙은 저항과 쌍대: C는 병렬이 합, L은 직렬이 합.</p>\n<p class=\"intuit\">💡 <b>직관</b> — C는 \"전압의 관성\"(수조: 수위 급변 불가), L은 \"전류의 관성\"(플라이휠: 유량 급변 불가).</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] DC 정상상태에서 C·L 지우고 풀기, 저장 에너지. [개념] 연속성(무엇이 점프 못 하나), C·L 결합 규칙의 쌍대성.</div>\n\n<h4>2. 페이저 — 미분방정식의 우회로 <span class=\"en\">(Phasor)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — \\(v_s=V_m\\cos(\\omega t+\\phi)\\)가 걸린 RLC 회로의 정상상태. 미분방정식을 세우면 매번 삼각함수 지옥이다.\n선형 회로에 정현파를 넣으면 <b>같은 ω의 정현파</b>만 나온다는 사실을 이용할 수 없나?</div>\n<p><b>변환</b> — 진폭과 위상만 남긴 복소수로 신호를 표현한다:</p>\n<p>\\[ v(t)=V_m\\cos(\\omega t+\\phi)\\ \\longleftrightarrow\\ \\mathbf{V}=V_m\\angle\\phi \\]</p>\n<p>핵심 성질: \\(\\dfrac{d}{dt}\\ \\longleftrightarrow\\ j\\omega\\times\\). 미분이 곱셈이 되는 순간 소자 관계식이 전부 \"옴 법칙 꼴\"이 된다:</p>\n<p>\\[ \\mathbf{V}=Z\\mathbf{I}:\\qquad Z_R=R,\\qquad Z_L=j\\omega L,\\qquad Z_C=\\frac{1}{j\\omega C} \\]</p>\n<p>임피던스<span class=\"en\">(impedance)</span> \\(Z\\)는 복소 저항 — 크기는 진폭비, 각은 위상차.\nL은 +90°(전류가 전압에 뒤짐<span class=\"en\">(lag)</span>), C는 −90°(앞섬<span class=\"en\">(lead)</span>) — \"ELI the ICE man\".\nω 극한 감각: DC(ω→0)에서 L단락·C개방, 고주파(ω→∞)에서 L개방·C단락 — DC 규칙과 정합.</p><div class=\"jsbox\"><span class=\"jt\">정석 5.1</span>AC 문제 5단계 기계: ① 소스를 페이저로 ② 소자를 Z로 ③ <b>U1~U4의 아무 기술</b>(등가·분배·절점·테브난)을 복소수로 실행 ④ 결과 페이저 \\(V_m\\angle\\phi\\) ⑤ 시간역: \\(V_m\\cos(\\omega t+\\phi)\\). 새 이론이 아니라 '숫자가 복소수가 된 옛 이론'임을 몸에 붙이는 것이 이 단원의 전부다.</div><p class=\"intuit\">💡 <b>직관</b> — 페이저는 회전하는 벡터의 \"스냅숏\". 모두 같은 ω로 돌므로 상대 각도(위상차)만 기록하면 충분하다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] RL·RC 직렬의 Z, 전류 페이저, 위상차 판독(기출 페이저 문항의 표준형). [함정] 시간역변환 생략, ELI/ICE 방향 뒤집기, 극좌표↔직교좌표 변환 실수.</div>", "derive": [{"title": "Z_C = 1/jωC 유도", "steps": ["정상상태 가정: \\(v(t)=V_m e^{j\\omega t}\\) (실신호는 실수부) [왜] 미분을 곱셈으로 바꾸려고.", "\\(i=C\\,dv/dt=j\\omega C\\,V_me^{j\\omega t}\\) — 미분이 \\(j\\omega\\) 곱으로.", "\\(Z_C=\\mathbf{V}/\\mathbf{I}=1/(j\\omega C)=-j/(\\omega C)\\) — 각 −90°.", "해석: 전류가 먼저 흘러야 전압이 쌓인다(전류 앞섬).", "극한 체크: ω→0 ⇒ |Z|→∞(DC 개방) ✓, ω→∞ ⇒ 0(고주파 단락) ✓ · 차원: V·s/C=Ω ✓"]}, {"title": "A cosωt + B sinωt 합성", "steps": ["sinωt = cos(ωt−90°) → 페이저: \\(A\\angle 0° + B\\angle(-90°) = A - jB\\).", "크기 \\(\\sqrt{A^2+B^2}\\), 각 \\(-\\tan^{-1}(B/A)\\).", "복원: \\(\\sqrt{A^2+B^2}\\cos(\\omega t - \\tan^{-1}(B/A))\\).", "t=0 값으로 검산: 원식=A, 합성식=크기·cos(−φ)=A ✓.", "극한 체크: B=0이면 그대로 A cos ✓ · A=0이면 B sin ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 5-1</span>(기출 3번형) 25∠0° V, ω=2 rad/s. 직렬 12 Ω + L=6 H 뒤에 6 Ω 병렬. 6 Ω 전압을 시간영역까지.</div><div class=\"xsol\"><b>풀이</b><ol><li>Z_L = jωL = j12 Ω. 분압: \\(\\mathbf{V}_2=25\\cdot\\frac{6}{18+j12}\\).</li><li>분모 = 21.63∠33.7° → \\(\\mathbf{V}_2\\) = <b>6.93∠−33.7° V</b>.</li><li>복원: \\(v_2(t)=6.93\\cos(2t−33.7°)\\) V — ω를 다시 붙이는 것까지가 답.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u5-l4-02 · u5-l3-03 · u5-l2-10</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 5-2</span>C₁=20 µF(직렬)C₂=60 µF를 12 V에 연결. 각 전압은?</div><div class=\"xsol\"><b>풀이</b><ol><li>직렬 C: 전하 공통. C_eq=15 µF → q=180 µC.</li><li>v₁=q/C₁=<b>9 V</b>, v₂=<b>3 V</b> (작은 C에 큰 전압).</li><li>합=12 V ✓ — R 분압과 반대 방향인 것에 주의.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u5-l3-08 · u5-l2-05 · u5-l3-12</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 5-3</span>블랙박스: v=20cos(100t) V에 i=4cos(100t−30°) A. R+L 직렬 모델의 R·L은?</div><div class=\"xsol\"><b>풀이</b><ol><li>|Z|=5 Ω, ∠Z=+30°.</li><li>R=5cos30°=<b>4.33 Ω</b>, X_L=5sin30°=2.5 Ω → L=<b>25 mH</b>.</li><li>전류 뒤짐=유도성 판정과 부호 일치 ✓</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u5-l4-04 · u5-l3-01 · u5-l4-08</div></div>"}, "u6": {"concept": "\n<div class=\"bigpic\"><span class=\"bt\">U6 큰그림</span>\n스위치가 딸깍하는 순간과 새 평형 사이 — 과도응답<span class=\"en\">(transient response)</span>이다.\n1차 회로(C 하나 또는 L 하나)의 답은 언제나 지수 곡선 하나이고, 시정수 \\(\\tau\\)가 빠르기의 전부다.\n이 단원의 상품은 공식 하나: \\(x(t)=x_\\infty+(x_0-x_\\infty)e^{-t/\\tau}\\) — \"3점 요약\"(처음·끝·빠르기)만 하면\n미분방정식 없이 답이 나온다. 기출 RC 스위칭 20점 문항이 정확히 이 절차를 묻는다.</div>\n\n<h4>1. 시정수 — 빠르기의 단위 <span class=\"en\">(Time Constant)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — RC 방전 \\(v'=-v/RC\\)의 해 \\(v=V_0e^{-t/RC}\\)에서, 회로마다 다른 \"감쇠 속도\"를 한 숫자로 요약하자.</div>\n<p><b>개념</b> — 시정수:</p>\n<p>\\[ \\tau_{RC}=RC,\\qquad \\tau_{RL}=\\frac{L}{R} \\]</p>\n<p>1τ에 63.2% 진행, 5τ면 완료로 간주(0.7%). 여기서의 \\(R\\)은 <b>그 C(또는 L)가 바라보는 테브난 저항 \\(R_{th}\\)</b>(U4의 재사용!) —\n전원 끄고 C 단자에서 본 등가저항이다. 반감기 \\(t_{1/2}=\\tau\\ln2\\), 실험에선 63.2% 지점이나 초기 기울기 접선이 τ를 준다.</p>\n<p class=\"intuit\">💡 <b>직관</b> — τ=저장 용량×새는 통로의 저항. 큰 물통(C↑)·좁은 배수구(R↑)일수록 천천히 빠진다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] R_th로 τ 구하기(테브난과 결합), 63.2%·반감기 판독. [함정] 스위칭 후 회로의 R_th를 스위칭 전 걸로 계산.</div>\n\n<h4>2. 완전응답 — 3점 요약법 <span class=\"en\">(Complete Response)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — t=0에 스위치가 움직였다. 미분방정식을 세우지 않고 v(t)를 쓰는 절차가 필요하다.</div>\n<p><b>공식</b> — 1차 회로의 모든 응답은:</p>\n<p>\\[ x(t)=x_\\infty+(x_0-x_\\infty)e^{-t/\\tau} \\]</p>\n<p>절차 4단계: ① \\(x_0\\): 스위칭 <b>직전</b> DC 정상상태(C개방·L단락)를 풀고 연속성(\\(v_C\\)·\\(i_L\\) 불변)으로 넘긴다\n② \\(x_\\infty\\): 스위칭 <b>후</b> 회로의 새 DC 정상상태 ③ \\(\\tau\\): 스위칭 후 회로의 \\(R_{th}\\)로\n④ 대입. 시작점에서 끝점으로 지수 활강 — 그래프까지 그려 검산한다(단조, 5τ 완료).\n이중 스위칭은 구간별로 같은 절차를 반복하되, 앞 구간의 끝값이 뒤 구간의 \\(x_0\\)이 된다.</p>\n<p class=\"intuit\">💡 <b>직관</b> — \"어디서 출발해(x₀), 어디로 가며(x∞), 얼마나 빨리 가나(τ)\" — 1차 시스템의 이력서는 세 줄이면 끝난다.</p>\n<p>🔗 <b>연결</b> — U5 연속성이 ①을, U4 테브난이 ③을 담당 — 앞 단원들이 부품으로 조립되는 단원이다. 같은 지수 구조가 자동제어(MECH387)의 1차 시스템·ML 경사하강 수렴에도 재방송된다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] 기출 20점 표준형: 직전 정상상태→x₀→x∞→τ→v(t)→특정 시각 값. [함정] x₀를 스위칭 후 회로로 계산(연속성 위반), τ의 R 선택 오류.</div>", "derive": [{"title": "RC 방전·충전의 일반해", "steps": ["KCL(방전): \\(C\\dfrac{dv}{dt}+\\dfrac{v}{R}=0\\) [왜] 전원 없는 루프의 전류 보존.", "변수 분리 → \\(\\ln v = -t/RC + K\\) → \\(v=V_0e^{-t/RC}\\), τ=RC 자연 등장.", "충전: \\(C\\dfrac{dv}{dt}+\\dfrac{v-V_s}{R}=0\\) → \\(v=V_s+(V_0-V_s)e^{-t/\\tau}\\) (일반형).", "에너지: 방전 시 R 소산 = ½CV₀² 전량, 충전 시 효율 정확히 50%(R와 무관).", "극한 체크: t=0 ⇒ V₀ ✓, t→∞ ⇒ V_s ✓, R→∞ ⇒ 불변 ✓ · 차원: RC=[s] ✓"]}, {"title": "τ에 테브난 저항이 들어가는 이유", "steps": ["복잡한 선형 회로 + C 하나 = (테브난 등가 V_T, R_T) + C 로 항상 축약 가능 (U4).", "그 등가 회로의 ODE가 \\(R_TC\\,dv/dt + v = V_T\\) → τ=R_TC.", "따라서 '전원 끄고 C에서 본 저항'이 유일하게 옳은 R.", "L도 동일: τ=L/R_T.", "극한 체크: R_T→0(이상 전압원 직결)이면 τ→0, 즉각 추종 ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 6-1</span>(기출 5번형) t<0: 20 V—5 Ω—C(8 F), 전류 0 정상상태. t=0에 전원 분리, C가 [4 Ω 직렬 후 (3 Ω∥6 Ω)] + 전류원 4 A(병렬부 유입)에 연결. v_C(t)는?</div><div class=\"xsol\"><b>풀이</b><ol><li>초기: 전류 0 → 5 Ω 강하 없음 → v_C(0)=<b>20 V</b>.</li><li>τ: 전류원 개방 → R=4+(3∥6)=6 Ω → τ=<b>48 s</b>.</li><li>최종: C 개방 → 4 A가 3∥6=2 Ω에 → v(∞)=<b>8 V</b> (4Ω 전류 0).</li><li>\\(v_C=8+12e^{-t/48}\\) V — 스케치: 20→8 지수 하강.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u6-l4-02 · u6-l3-01 · u6-l3-07</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 6-2</span>(기말 P2형) 15 V—1 kΩ—(C=25 µF ∥ 1 kΩ), t=0 충전 시작(0 V), t=50 ms에 전원 스위치 개방. 전 구간 v_C는?</div><div class=\"xsol\"><b>풀이</b><ol><li>구간1: τ₁=(1k∥1k)·25µ=12.5 ms, 목표 7.5 V → v(50ms)=7.5(1−e⁻⁴)=<b>7.36 V</b>.</li><li>구간2: τ₂=1k·25µ=25 ms(2배!), v=7.36e^{−(t−50ms)/25ms}.</li><li>스케치: 빠른 상승 → 꺾여 느린 하강. τ 변화가 채점 핵심.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u6-l4-03 · u6-l3-14 · u6-l3-02</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 6-3</span>RL: t<0에 12 V—4 Ω—L(2 H) 정상상태, t=0에 전원 끊고 8 Ω로 방전. i(t)와 v_L(0⁺)는?</div><div class=\"xsol\"><b>풀이</b><ol><li>i(0)=12/4=<b>3 A</b> (연속).</li><li>τ=L/R₂=2/8=0.25 s → i=3e^{−4t} A.</li><li>v_L(0⁺)=−3×8=<b>−24 V</b> — 전원(12 V)보다 큰 역전압(유도 킥). 릴레이에 다이오드를 다는 이유.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u6-l4-04 · u6-l3-08 · u6-l3-03</div></div>"}, "u7": {"concept": "\n<div class=\"bigpic\"><span class=\"bt\">U7 큰그림</span>\n같은 회로가 주파수에 따라 다르게 행동한다 — 회로를 \"주파수별 통과/차단 장치(필터)\"로 읽는 눈이 이 단원이다.\n페이저(U5)에서 ω를 변수로 승격시킨 것이 전달함수 \\(H(j\\omega)\\)이고, 그 크기를 로그 눈금에 그린 것이 보드 선도다.\n기출 필터 설계 15점(차단주파수 맞추는 RC 선정)이 여기서 나오며, 2차 RLC의 ζ·ω₀는 자동제어(MECH387)와의 접속 단자다.</div>\n\n<h4>1. 전달함수 <span class=\"en\">(Transfer Function)</span><span class=\"tagx\">시험 핵심</span></h4>\n<div class=\"whyq\"><b>❓ 문제 상황</b> — 입력 정현파의 주파수를 바꿔가며 출력을 재면, 회로의 \"주파수 취향\"이 드러난다. 그 취향을 함수 하나로.</div>\n<p><b>개념</b> — 출력/입력 페이저 비:</p>\n<p>\\[ H(j\\omega)=\\frac{\\mathbf{V}_{out}}{\\mathbf{V}_{in}},\\qquad\n|H|=\\text{이득},\\quad \\angle H=\\text{위상차} \\]</p>\n<p>RC 저역통과<span class=\"en\">(low-pass)</span>가 원형이다 — 전압분배(U2)를 임피던스로:</p>\n<p>\\[ H=\\frac{1/j\\omega C}{R+1/j\\omega C}=\\frac{1}{1+j\\omega RC},\\qquad\n|H|=\\frac{1}{\\sqrt{1+(\\omega/\\omega_c)^2}},\\quad \\omega_c=\\frac{1}{RC} \\]</p>\n<p>차단주파수<span class=\"en\">(cutoff frequency)</span> \\(\\omega_c\\)에서 \\(|H|=1/\\sqrt2\\)(전력 절반, <b>−3dB</b>), 위상 −45°.\nR과 C의 자리를 바꾸면 고역통과 \\(H=\\dfrac{j\\omega/\\omega_c}{1+j\\omega/\\omega_c}\\). 극한 검산이 습관이다:\nω→0과 ω→∞에서 C를 개방/단락으로 갈아끼워 |H|이 1인지 0인지 — 회로만 보고 필터 종류를 판정한다.</p>\n<p class=\"intuit\">💡 <b>직관</b> — 저역통과는 \"C가 고주파를 접지로 흘려버리는\" 회로. 필터 판정은 공식보다 극한 두 개가 빠르다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[설계] 원하는 f_c=1/(2πRC)에 R 또는 C 선정(기출 15점형). [계산] 주어진 ω에서 |H|·∠H. [개념] 극한으로 LPF/HPF 판정.</div>\n\n<h4>2. 데시벨과 보드 선도 <span class=\"en\">(Decibels &amp; Bode Plot)</span><span class=\"tagm\">계산 필수</span></h4>\n<p>이득을 로그로: \\(G_{dB}=20\\log_{10}|H|\\) — 곱이 합이 되어 필터 연쇄가 덧셈이 된다.\n기준점 셋만 외운다: 1배=0dB, \\(1/\\sqrt2\\)=−3dB, 10배=20dB.\n1차 저역통과의 보드 개형: \\(\\omega_c\\)까지 0dB 평탄 → 이후 <b>−20dB/decade</b> 직선 하강(꺾은선 근사, 실제 곡선은 모서리에서 −3dB).\n위상은 0°→−45°(ω_c)→−90°. 이 개형 읽기가 MECH387 보드 선도의 출발점이다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] dB 환산, 10ω_c에서 −20dB 등 개형 수치. [개념] −20dB/dec의 의미(주파수 10배당 이득 1/10).</div>\n\n<h4>3. 2차 회로 맛보기 — RLC와 공진 <span class=\"en\">(Second-Order &amp; Resonance)</span><span class=\"tagc\">개념 이해용</span></h4>\n<p>C와 L이 함께 있으면 2차: 특성 주파수 \\(\\omega_0=1/\\sqrt{LC}\\), 감쇠비 ζ에 따라 과감쇠/임계/부족감쇠.\n직렬 RLC는 \\(\\omega_0\\)에서 \\(Z_L+Z_C=0\\) — 공진<span class=\"en\">(resonance)</span>: 임피던스 최소·전류 최대,\n선택도 \\(Q=\\omega_0L/R\\)가 대역폭 \\(\\Delta\\omega=\\omega_0/Q\\)를 정한다. 깊은 해석은 자동제어(MECH387 2차 시스템)로 —\n여기선 ω₀·ζ·Q의 정의와 공진의 물리(L·C 에너지 교환)까지가 범위다.</p>\n<div class=\"exambox\"><span class=\"xt\">시험 연결</span>[계산] ω₀=1/√(LC), Q와 대역폭. [개념] 공진 시 Z 순저항, 전류 최대.</div>", "derive": [{"title": "RC LPF의 H(jω) 완전 유도 (기출 6(b)(c))", "steps": ["임피던스 분압: \\(H=\\dfrac{Z_C}{R+Z_C}=\\dfrac{1/j\\omega C}{R+1/j\\omega C}\\).", "정리: \\(H=\\dfrac{1}{1+j\\omega RC}=\\dfrac{1}{1+j\\omega/\\omega_0}\\), \\(\\omega_0=1/RC\\).", "크기 \\(1/\\sqrt{1+(\\omega/\\omega_0)^2}\\), 위상 \\(-\\tan^{-1}(\\omega/\\omega_0)\\).", "3극한: ω→0 ⇒ 1∠0°(통과) · ω₀ ⇒ 0.707∠−45°(−3dB) · ω→∞ ⇒ 0∠−90°(차단).", "차원 체크: ωRC 무차원 ✓ · 극한이 C 개방/단락 직관과 일치 ✓"]}, {"title": "2차 특성방정식과 감쇠 분류", "steps": ["직렬 RLC KVL: \\(L\\ddot q + R\\dot q + q/C = 0\\) → \\(s^2 + (R/L)s + 1/LC = 0\\).", "표준형 \\(s^2+2\\zeta\\omega_0 s+\\omega_0^2=0\\)과 비교: \\(\\omega_0=1/\\sqrt{LC}\\), \\(2\\zeta\\omega_0=R/L\\) → \\(\\zeta=(R/2)\\sqrt{C/L}\\).", "근: \\(s=-\\zeta\\omega_0\\pm\\omega_0\\sqrt{\\zeta^2-1}\\) — ζ<1이면 복소(진동), ζ>1이면 실근 둘(과감쇠).", "부족감쇠 근 \\(-\\zeta\\omega_0\\pm j\\omega_d\\): 실수부=감쇠 봉투, 허수부=링잉 주파수.", "극한 체크: R=0 ⇒ ζ=0, 무감쇠 진동 ✓ · C→∞ ⇒ ω₀→0(L-R 1차로 퇴화) ✓ · 차원: ζ 무차원 ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 7-1</span>(기출 6 완성형) 신호 최대 ω=2 rad/s, 잡음 ω≳2000 rad/s. C=10 µF로 LPF 설계(차단=신호의 10배).</div><div class=\"xsol\"><b>풀이</b><ol><li>ω₀=20 rad/s → R=1/(ω₀C)=<b>5 kΩ</b>.</li><li>신호: ω/ω₀=0.1 → |H|=0.995 (무손실).</li><li>잡음: ω/ω₀=100 → −40 dB (1/100).</li><li>유도·극한 3점(7.1 정석 박스)까지 쓰면 풀세트.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u7-l4-03 · u7-l3-01 · u7-l4-02</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 7-2</span>RLC: R=40 Ω, L=10 mH, C=2.5 µF의 스텝 응답 성격은?</div><div class=\"xsol\"><b>풀이</b><ol><li>R_c=2√(L/C)=2√4000=<b>126.5 Ω</b> → ζ=40/126.5=<b>0.316</b><1 부족감쇠.</li><li>ω₀=1/√(LC)=6325 rad/s, ω_d=6000 rad/s.</li><li>M_p=e^{−πζ/√(1−ζ²)}=<b>35%</b> 오버슈트 — 스코프에 링잉이 보인다.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u7-l4-05 · u7-l3-05 · u7-l3-14</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 7-3</span>(파형 역산) 스텝 후 링잉: 주기 4 ms, 연속 봉우리 진폭비 0.25. 이 2차계의 ζ는?</div><div class=\"xsol\"><b>풀이</b><ol><li>ω_d=2π/T=1571 rad/s.</li><li>σ=−ln(0.25)/T=347 1/s.</li><li>ζ=σ/√(σ²+ω_d²)=<b>0.216</b> — 파형만으로 파라미터 복원(실험 3).</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u7-l4-08 · u7-l2-12 · u7-l3-11</div></div>"}};

<script>
(function(){
'use strict';
var APP='course-eecirc', VP=Vault.progress(APP), VD=Vault.drill(APP), VM=Vault.meta(APP);
var UNITS=SV_BANK, BYID={}, ALL=[];
UNITS.forEach(function(u){ u.problems.forEach(function(p){ p._unit=u; BYID[p.id]=p; ALL.push(p); }); });
var LAYERS=['concept','derive','worked'], LAYER_KO={concept:'개념',derive:'수식·유도',worked:'풀이된 예제'};
var $=function(s,el){ return (el||document).querySelector(s); };
var esc=function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
function typeset(el){
  if(window.MathJax&&window.__mjready){ MathJax.typesetPromise([el]).catch(function(){}); }
  else { (window.__mjq=window.__mjq||[]).push(el); }
}

/* ---------- 파라미터 추출/리롤 (러너와 동일 규칙) ---------- */
function draw(spec){ 
  if(spec.choices) return spec.choices[Math.floor(Math.random()*spec.choices.length)];
  var steps=Math.round((spec.max-spec.min)/spec.step);
  return spec.min+spec.step*Math.floor(Math.random()*(steps+1));
}
function sample(prob){
  for(var t=0;t<500;t++){
    var p={}; for(var k in prob.params) p[k]=draw(prob.params[k]);
    if(!prob.constraint||prob.constraint(p)) return p;
  }
  return null;
}
var CUR={}; // 문제별 현재 파라미터
function statementOf(prob){
  if(!prob.params) return (typeof prob.statement==='function')?prob.statement({}):prob.statement;
  if(!CUR[prob.id]) CUR[prob.id]=sample(prob);
  return prob.statement(CUR[prob.id]);
}
function ansText(r){
  if(r==null) return '';
  var a=r.ans, u=r.unit;
  if(typeof a==='number') return SVH.fmt(a)+' '+(u||'');
  var parts=[]; for(var k in a){ parts.push(k+' = '+SVH.fmt(a[k])+' '+((u&&u[k])||'')); }
  return parts.join(' · ');
}

/* ---------- 진도 ---------- */
function readItems(){ var ids=[]; UNITS.forEach(function(u){ LAYERS.forEach(function(l){ ids.push(u.id+'-'+l); }); }); return ids; }
function refreshProg(){
  var ids=readItems(), n=0; ids.forEach(function(id){ if(VP.get(id)) n++; });
  $('#pbar').style.width=Math.round(n/ids.length*100)+'%';
  $('#ptxt').textContent='읽음 '+n+' / '+ids.length+' · 문제 '+VD.counts().total+'/'+ALL.length;
  document.querySelectorAll('.readbtn[data-read]').forEach(function(b){
    var on=VP.get(b.getAttribute('data-read'));
    b.setAttribute('aria-pressed',on?'true':'false');
    b.textContent=on?'✓ 읽음':'읽음으로 표시';
  });
  var wc=wrongList().length, badge=$('#nav-wrong .nv'); if(badge) badge.textContent=wc||'';
}
function wrongList(){
  var all=VD.all(), ids=[];
  for(var k in all){ if((all[k]==='wrong'||all[k]==='partial')&&BYID[k]) ids.push(k); }
  return ids;
}

/* ---------- 문제 카드 ---------- */
function grade(prob, status, card){
  VD.set(prob.id, status);
  card.querySelectorAll('.pbtn.sel').forEach(function(b){ b.classList.remove('sel'); });
  var btn=card.querySelector('.pbtn.grade-'+status[0]); if(btn) btn.classList.add('sel');
  var dot=card.querySelector('.sdot'); if(dot){ dot.className='sdot '+status; }
  refreshProg();
  if(EXAM.running) examAnswered(prob.id, status);
}
function renderProblem(prob){
  var card=document.createElement('article'); card.className='pcard'; card.setAttribute('data-pid',prob.id);
  var st=VD.get(prob.id);
  var srcb=prob.src?'<span class="srcb">'+esc(prob.src)+'</span>':'';
  card.innerHTML='<div class="pc-head"><span class="lv lv'+prob.level+'">L'+prob.level+'</span>'+
    '<span class="tagc">'+esc(prob.id)+' · '+esc((prob.tags||[]).join('·'))+'</span>'+srcb+
    '<span class="sdot'+(st?' '+st:'')+'"></span></div>'+
    '<div class="pc-st"></div><div class="pc-body"></div><div class="pc-btns"></div>';
  var stEl=$('.pc-st',card), body=$('.pc-body',card), btns=$('.pc-btns',card);
  stEl.innerHTML=statementOf(prob);

  function addBtn(label, cls, fn){
    var b=document.createElement('button'); b.type='button'; b.className='pbtn'+(cls?' '+cls:''); b.textContent=label;
    b.addEventListener('click',fn); btns.appendChild(b); return b;
  }
  function gradeBtns(){
    addBtn('맞음 ✓','grade-c',function(){ grade(prob,'correct',card); });
    addBtn('부분 △','grade-p',function(){ grade(prob,'partial',card); });
    addBtn('틀림 ✗','grade-w',function(){ grade(prob,'wrong',card); });
    if(st){ var b=card.querySelector('.pbtn.grade-'+st[0]); if(b) b.classList.add('sel'); }
  }

  if(prob.type==='mc'||prob.type==='tf'){
    var choices = prob.type==='tf' ? ['참 (O)','거짓 (X)'] : prob.choices;
    var correctIdx = prob.type==='tf' ? (prob.answer?0:1) : prob.answer;
    var wrap=document.createElement('div'); wrap.className='choices';
    choices.forEach(function(c,i){
      var b=document.createElement('button'); b.type='button'; b.className='choice'; b.innerHTML=c;
      b.addEventListener('click',function(){
        if(card.__done) return; card.__done=true;
        wrap.children[correctIdx].classList.add('right');
        if(i!==correctIdx) b.classList.add('wrongpick');
        var ex=document.createElement('div'); ex.className='expl'; ex.innerHTML='<b>해설</b> — '+prob.expl;
        body.appendChild(ex); typeset(ex);
        grade(prob, i===correctIdx?'correct':'wrong', card);
      });
      wrap.appendChild(b);
    });
    body.appendChild(wrap);
  } else {
    var hintIdx=0, hb=null;
    if(prob.hints&&prob.hints.length){
      addBtn('💡 힌트','',function(){
        if(hintIdx>=prob.hints.length) return;
        if(!hb){ hb=document.createElement('div'); hb.className='hintbox'; body.appendChild(hb); }
        var d=document.createElement('div'); d.innerHTML='힌트 '+(hintIdx+1)+'. '+prob.hints[hintIdx];
        hb.appendChild(d); typeset(d); hintIdx++;
        this.textContent = hintIdx>=prob.hints.length ? '힌트 끝' : '💡 힌트 '+(hintIdx+1);
      });
    }
    var solBtn=addBtn('풀이 보기','',function(){
      if(card.__sol){ card.__sol.hidden=!card.__sol.hidden; this.textContent=card.__sol.hidden?'풀이 보기':'풀이 닫기'; return; }
      var box=document.createElement('div'); box.className='solbox';
      var steps, aline='';
      if(prob.type==='derive'){ steps=prob.steps; }
      else{
        var r=prob.solve(prob.params?CUR[prob.id]:{});
        steps=r.steps; aline='<div class="ansline">답: '+esc(ansText(r))+'</div>';
      }
      box.innerHTML='<ol>'+steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol>'+aline+
        (prob.expl?'<div class="expl">'+prob.expl+'</div>':'');
      body.appendChild(box); typeset(box);
      card.__sol=box; this.textContent='풀이 닫기';
      if(!card.__graded){ card.__graded=true; gradeBtns(); }
    });
    if(prob.params){
      addBtn('🎲 새 숫자로','',function(){
        CUR[prob.id]=sample(prob);
        stEl.innerHTML=statementOf(prob); typeset(stEl);
        if(card.__sol){ card.__sol.remove(); card.__sol=null; solBtn.textContent='풀이 보기'; }
        if(hb){ hb.remove(); hb=null; hintIdx=0; }
      });
    }
    if(st&&!card.__graded){ card.__graded=true; gradeBtns(); }
  }
  return card;
}

/* ---------- 뷰 ---------- */
var view=$('#view');
function setView(html){ view.innerHTML=html; }

    '<p class="note-line">현황 — 풀어본 문제 '+dc.total+' / '+ALL.length+(rate!==null?(' · 정답률 '+rate+'%'):'')+
    ' · <a href="#wrong">오답노트 '+wrongList().length+'문제</a> · 빌드 '+SV_BUILD.date+' (게이트 '+SV_BUILD.gate+')</p>'+
    (SV_CONTENT.course?'<details class="layer" open><summary><span class="lb">MAP</span>과목 큰그림 — 한눈에<span class="arrow">›</span></summary><div class="body">'+SV_CONTENT.course.bigpicture+'</div></details>':'')+
    '<div class="ucards" id="ucards"></div>'+
    '<h3>모드</h3><div class="ucards">'+
    '<a class="ucard" href="#exam"><span class="uc-no">MOCK EXAM</span><span class="uc-ti">📝 모의고사</span><span class="uc-scope">범위·난이도·문항수를 골라 랜덤 출제 — 매번 새 수치, 종료 리포트 제공.</span></a>'+
    '<a class="ucard" href="#wrong"><span class="uc-no">RETRY QUEUE</span><span class="uc-ti">🔁 오답노트</span><span class="uc-scope">틀림·부분 문제만 모아 재도전. 맞음으로 바꾸면 큐에서 빠진다.</span></a></div>');
  var uc=$('#ucards');
  UNITS.forEach(function(u){
    var solved=0, ok=0;
    u.problems.forEach(function(p){ var s=VD.get(p.id); if(s){solved++; if(s==='correct')ok++;} });
    var reads=LAYERS.filter(function(l){return VP.get(u.id+'-'+l);}).length;
    var a=document.createElement('a'); a.className='ucard'; a.href='#'+u.id;
    a.innerHTML='<span class="uc-no">UNIT '+u.no+'</span><span class="uc-ti">'+esc(u.title)+'</span>'+
      '<span class="uc-scope">'+esc(u.scope)+'</span>'+
      '<span class="uc-stat">읽음 '+reads+'/3 · 문제 '+solved+'/'+u.problems.length+(solved?' · 정답 '+ok:'')+'</span>';
    uc.appendChild(a);
  });
  typeset(view);
}
function renderUnit(u){
  var c=SV_CONTENT[u.id]||{};
  setView('<div class="eyebrow">UNIT '+u.no+' / '+UNITS.length+'</div><h1>'+esc(u.title)+'</h1>'+
    '<p class="lede">'+esc(u.scope)+'</p><div id="layers"></div>'+
    '<h3>문제 세트 <span class="src">L1 개념확인 → L4 시험급 · '+u.problems.length+'문제</span></h3>'+
    '<div class="filters" id="filters"></div><div id="plist"></div>');
  var layers=$('#layers');
  LAYERS.forEach(function(l){
    var d=document.createElement('details'); d.className='layer'; if(l==='concept') d.open=true;
    var inner='';
    if(l==='derive'){
      (c.derive||[]).forEach(function(dv){
        inner+='<details class="dstep"><summary>'+esc(dv.title)+'</summary><ol>'+
          dv.steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol></details>';
      });
    } else inner=c[l]||'';
    d.innerHTML='<summary><span class="lb">'+(l.toUpperCase())+'</span>'+LAYER_KO[l]+'<span class="arrow">›</span></summary>'+
      '<div class="body">'+inner+'<div class="readrow"><button type="button" class="readbtn" data-read="'+u.id+'-'+l+'"></button></div></div>';
    layers.appendChild(d);
  });
  layers.addEventListener('click',function(e){
    var b=e.target.closest('.readbtn'); if(!b) return;
    VP.toggle(b.getAttribute('data-read')); refreshProg();
  });
  var lv=0, fl=$('#filters'), pl=$('#plist');
  function renderList(){
    pl.innerHTML='';
    u.problems.filter(function(p){ return !lv||p.level===lv; }).forEach(function(p){ pl.appendChild(renderProblem(p)); });
    typeset(pl);
  }
  [['전체',0],['L1 개념',1],['L2 기본',2],['L3 응용',3],['L4 시험급',4]].forEach(function(f){
    var b=document.createElement('button'); b.type='button'; b.className='fchip'+(f[1]===0?' on':''); b.textContent=f[0];
    b.addEventListener('click',function(){ lv=f[1]; fl.querySelectorAll('.fchip').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); renderList(); });
    fl.appendChild(b);
  });
  renderList(); typeset(layers);
}
function renderWrong(){
  var ids=wrongList();
  setView('<div class="eyebrow">RETRY QUEUE</div><h1>오답노트</h1>'+
    '<p class="lede">틀림·부분 표시 문제 '+ids.length+'개. 다시 풀어 <b>맞음</b>으로 바꾸면 큐에서 빠진다. 계산형은 자동으로 새 수치다.</p><div id="plist"></div>');
  var pl=$('#plist');
  if(!ids.length){ pl.innerHTML='<div class="empty">비어 있음 — 문제를 풀고 자가채점하면 틀림/부분이 여기 모인다.</div>'; return; }
  ids.forEach(function(id){ var p=BYID[id]; if(p&&p.params) CUR[id]=sample(p); pl.appendChild(renderProblem(BYID[id])); });
  typeset(pl);
}
/* ---------- 모의고사 ---------- */
var EXAM={running:false};
function renderExam(){
  if(EXAM.running){ renderExamRun(); return; }
  var uchecks=UNITS.map(function(u){ return '<label class="ck"><input type="checkbox" class="exu" value="'+u.id+'" checked> U'+u.no+' '+esc(u.title)+'</label>'; }).join('');
  setView('<div class="eyebrow">MOCK EXAM</div><h1>모의고사</h1>'+
    '<p class="lede">범위와 난이도를 고르면 랜덤 출제. 채점은 문제마다(객관식 자동 · 계산형 자가채점), 종료하면 리포트.</p>'+
    '<div class="exam-setup">'+
    '<div class="grp"><h4>범위</h4>'+uchecks+'</div>'+
    '<div class="grp"><h4>난이도</h4>'+[1,2,3,4].map(function(l){return '<label class="ck"><input type="checkbox" class="exl" value="'+l+'" '+(l>1?'checked':'')+'> L'+l+'</label>';}).join('')+'</div>'+
    '<div class="grp"><h4>문항 수</h4><select id="exn"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>'+
    '<button class="bigbtn" id="exgo">모의고사 시작 →</button></div>');
  $('#exgo').addEventListener('click',function(){
    var us={}, ls={};
    document.querySelectorAll('.exu:checked').forEach(function(c){us[c.value]=1;});
    document.querySelectorAll('.exl:checked').forEach(function(c){ls[+c.value]=1;});
    var pool=ALL.filter(function(p){ return us[p._unit.id]&&ls[p.level]; });
    var n=Math.min(+$('#exn').value, pool.length);
    if(!n){ alert('선택한 범위에 문제가 없습니다'); return; }
    for(var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
    EXAM={running:true, list:pool.slice(0,n), idx:0, res:{}};
    EXAM.list.forEach(function(p){ if(p.params) CUR[p.id]=sample(p); });
    renderExamRun();
  });
}
function examAnswered(pid, status){ if(EXAM.running&&EXAM.res) EXAM.res[pid]=status; }
function renderExamRun(){
  var i=EXAM.idx, p=EXAM.list[i];
  setView('<div class="eyebrow">MOCK EXAM · '+(i+1)+' / '+EXAM.list.length+'</div>'+
    '<div class="exam-top"><span>'+(i+1)+'/'+EXAM.list.length+'</span><div class="bar"><i style="width:'+Math.round(i/EXAM.list.length*100)+'%"></i></div>'+
    '<button class="pbtn" id="exquit">종료</button></div><div id="pslot"></div>'+
    '<div class="pc-btns" style="margin-top:14px"><button class="bigbtn" id="exnext">'+(i+1<EXAM.list.length?'다음 문제 →':'리포트 보기 →')+'</button></div>');
  $('#pslot').appendChild(renderProblem(p)); typeset($('#pslot'));
  $('#exnext').addEventListener('click',function(){
    if(EXAM.idx+1<EXAM.list.length){ EXAM.idx++; renderExamRun(); } else renderExamReport();
  });
  $('#exquit').addEventListener('click',renderExamReport);
}
function renderExamReport(){
  var res=EXAM.res, list=EXAM.list; EXAM.running=false;
  var c=0,pt=0,w=0,na=0;
  var perUnit={};
  list.forEach(function(p){
    var s=res[p.id];
    var u=perUnit[p._unit.id]=perUnit[p._unit.id]||{t:0,c:0,title:p._unit.title,no:p._unit.no};
    u.t++;
    if(s==='correct'){c++;u.c++;} else if(s==='partial'){pt++;} else if(s==='wrong'){w++;} else na++;
  });
  var score=Math.round((c+0.5*pt)/list.length*100);
  var rows=Object.keys(perUnit).sort().map(function(k){var u=perUnit[k];return '<tr><td>U'+u.no+' '+esc(u.title)+'</td><td>'+u.c+' / '+u.t+'</td></tr>';}).join('');
  setView('<div class="eyebrow">MOCK EXAM · REPORT</div><h1>결과 리포트</h1>'+
    '<div class="report"><div class="score">'+score+'점</div>'+
    '<p>맞음 '+c+' · 부분 '+pt+' · 틀림 '+w+(na?' · 무응답 '+na:'')+' (총 '+list.length+'문제)</p>'+
    '<table><thead><tr><th>단원</th><th>정답</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="pc-btns"><a class="pbtn" href="#wrong">🔁 오답노트로</a><a class="pbtn" href="#exam" onclick="">다시 설정</a><a class="pbtn" href="#home">홈</a></div></div>');
}

/* ---------- 내비 · 라우팅 ---------- */
function buildNav(){
  var nav=$('#sidenav'), sheet=$('#tb-sheet');
  var html='<div class="ng">학습</div><a href="#home" data-v="home">홈 · 현황</a>';
  UNITS.forEach(function(u){ html+='<a href="#'+u.id+'" data-v="'+u.id+'">U'+u.no+' '+esc(u.title)+'</a>'; });
  html+='<div class="ng">훈련</div><a href="#wrong" data-v="wrong" id="nav-wrong">오답노트<span class="nv"></span></a><a href="#exam" data-v="exam">모의고사</a>';
  nav.innerHTML=html;
  sheet.innerHTML=UNITS.map(function(u){ return '<a href="#'+u.id+'">U'+u.no+' '+esc(u.title)+'</a>'; }).join('');
}
function route(){
  var h=(location.hash||'#home').slice(1);
  var valid={home:1,wrong:1,exam:1}; UNITS.forEach(function(u){valid[u.id]=1;});
  if(!valid[h]) h='home';
  if(h!=='exam') EXAM.running=false;
  document.querySelectorAll('.side nav a').forEach(function(a){ a.classList.toggle('on',a.getAttribute('data-v')===h); });
  document.querySelectorAll('.tabbar [data-tv]').forEach(function(a){ a.classList.toggle('on',a.getAttribute('data-tv')===h); });
  var sh=$('#tb-sheet'); if(sh) sh.hidden=true;
  VM.touch(location.hash||'#home');
  if(h==='home') renderHome();
  else if(h==='wrong') renderWrong();
  else if(h==='exam') renderExam();
  else renderUnit(UNITS.filter(function(u){return u.id===h;})[0]);
  window.scrollTo(0,0);
  refreshProg();
}
var tbMore=$('#tb-more'), tbSheet=$('#tb-sheet');
if(tbMore){ tbMore.addEventListener('click',function(e){ e.stopPropagation(); tbSheet.hidden=!tbSheet.hidden; });
  document.addEventListener('click',function(e){ if(!tbSheet.hidden&&!tbSheet.contains(e.target)) tbSheet.hidden=true; }); }
window.addEventListener('hashchange',route);
buildNav(); route();
})();
