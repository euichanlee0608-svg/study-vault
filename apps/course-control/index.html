        'a = −2kx₀ = '+SVH.fmt(a)+' < 0 → 평형 안정(1)',
        '(선형화 δẋ = aδx + δu — 동작점이 클수록 더 빨리 정착)' ] }; },
    hints:['x²의 미분.'] },
  { id:'u5-l2-09', level:2, type:'num', tags:['C 행렬 역할'], src:'창작 문제(검산됨)',
    params:{ x1:{choices:[2,3]}, x2:{choices:[4,6]}, c1:{choices:[1,2]}, c2:{choices:[0,1]} },
    statement:function(p){ return '상태 x=['+p.x1+', '+p.x2+']ᵀ, C=['+p.c1+', '+p.c2+'], D=0일 때 출력 y를 구하라.'; },
    solve:function(p){ var y=p.c1*p.x1+p.c2*p.x2;
      return { ans:y, unit:'', steps:[
        'y = Cx = '+p.c1+'×'+p.x1+'+'+p.c2+'×'+p.x2+' = '+SVH.fmt(y),
        '(C는 "무엇을 재는가"의 행렬 — 센서 선택)' ] }; },
    hints:['행렬 곱 한 줄.'] },
  { id:'u5-l2-10', level:2, type:'num', tags:['(sI−A) 역'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[2,4]}, s0:{choices:[0,1]} },
    statement:function(p){ return 'A=[[0,1],[0,−'+p.a+']] (적분기+1차)에서 \\((sI-A)^{-1}\\)의 (1,2) 성분을 s='+p.s0+'에서... 대신 일반식으로 구해 s='+(p.s0+1)+'에서 값을 구하라.'; },
    solve:function(p){ var sv=p.s0+1, v=1/(sv*(sv+p.a));
      return { ans:v, unit:'', steps:[
        'sI−A = [[s,−1],[0,s+'+p.a+']] → 역의 (1,2) = 1/[s(s+'+p.a+')]',
        's='+sv+': '+SVH.fmt(v)+' (G(s)의 핵심 성분이 이렇게 나온다)' ] }; },
    hints:['상삼각의 역행렬.'] },
  { id:'u5-l2-11', level:2, type:'num', tags:['모드 분해'], src:'창작 문제(검산됨)',
    params:{ l1:{choices:[-1]}, l2:{choices:[-4,-5]}, c1:{choices:[2,3]}, c2:{choices:[1,2]}, t1:{choices:[1]} },
    statement:function(p){ return '자유응답이 \\(y='+p.c1+'e^{'+p.l1+'t}+'+p.c2+'e^{'+p.l2+'t}\\)일 때 (a) t='+p.t1+'의 y (b) 두 모드 크기가 같아지는... 대신 t='+p.t1+'에서 빠른 모드가 차지하는 비율(%)을 구하라.'; },
    solve:function(p){
      var m1=p.c1*Math.exp(p.l1*p.t1), m2=p.c2*Math.exp(p.l2*p.t1);
      return { ans:{y:m1+m2, pct:m2/(m1+m2)*100}, unit:{y:'', pct:'%'}, steps:[
        '느린 모드 '+SVH.fmt(m1)+', 빠른 모드 '+SVH.fmt(m2),
        '합 '+SVH.fmt(m1+m2)+', 빠른 모드 비중 '+SVH.fmt(m2/(m1+m2)*100)+' % (수치로 보는 지배극점)' ] }; },
    hints:['각 항을 따로 평가.'] },
  { id:'u5-l2-12', level:2, type:'num', tags:['이산 개념 아님—단위 확인'], src:'창작 문제(검산됨)',
    params:{ m:{choices:[1,2]}, c:{choices:[3,4]}, k:{choices:[8,10]} },
    statement:function(p){ return 'MSD(m='+p.m+', c='+p.c+', k='+p.k+')의 상태방정식에서 A(2,1)=−k/m, A(2,2)=−c/m의 값을 구하라.'; },
    solve:function(p){
      return { ans:{a21:-p.k/p.m, a22:-p.c/p.m}, unit:{a21:'1/s²', a22:'1/s'}, steps:[
        'A(2,1) = −'+p.k+'/'+p.m+' = '+SVH.fmt(-p.k/p.m)+' [1/s²]',
        'A(2,2) = −'+p.c+'/'+p.m+' = '+SVH.fmt(-p.c/p.m)+' [1/s] (성분마다 차원이 다르다!)' ] }; },
    hints:['물리 EOM을 m으로 나눔.'] },

  /* ---------- L3 (14) ---------- */
  { id:'u5-l3-01', level:3, type:'num', tags:['3차 동반형'], src:'창작 문제(검산됨)',
    params:{ a2:{choices:[2,3]}, a1:{choices:[5,7]}, a0:{choices:[4,6]} },
    statement:function(p){ return '\\(\\dddot y+'+p.a2+'\\ddot y+'+p.a1+'\\dot y+'+p.a0+'y=u\\)의 동반형 A 3행을 구하라.'; },
    solve:function(p){
      return { ans:{a31:-p.a0, a32:-p.a1, a33:-p.a2}, unit:{a31:'',a32:'',a33:''}, steps:[
        '3행 = [−a₀, −a₁, −a₂] = [−'+p.a0+', −'+p.a1+', −'+p.a2+']',
        '(위 두 행은 [0,1,0], [0,0,1] — 사다리 구조)' ] }; },
    hints:['계수 역순+부호.'] },
  { id:'u5-l3-02', level:3, type:'num', tags:['고유값 완전'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[3,5]}, b:{choices:[2,6]} },
    statement:function(p){ return 'A=[[−'+p.a+',1],[0,−'+p.b+']]의 (a) 고유값 둘 (b) e^{At}의 (1,1) 성분이 t=1에서 갖는 값을 구하라.'; },
    solve:function(p){
      var v=Math.exp(-p.a);
      return { ans:{l1:-p.a, l2:-p.b, e11:v}, unit:{l1:'',l2:'',e11:''}, steps:[
        '삼각 → λ = −'+p.a+', −'+p.b,
        'e^{At}(1,1) = e^{−'+p.a+'t} → t=1: '+SVH.fmt(v)+' (대각 모드는 독립 감쇠)' ] }; },
    hints:['삼각행렬의 지수도 대각은 그대로.'] },
  { id:'u5-l3-03', level:3, type:'num', tags:['TF→상태공간→검증'], src:'기출 유형',
    params:{ b0:{choices:[8,12]}, a1:{choices:[6,7]}, a0:{choices:[8,12]} },
    statement:function(p){ return '\\(G=\\dfrac{'+p.b0+'}{s^2+'+p.a1+'s+'+p.a0+'}\\)를 동반형으로 쓰고, tr(A)와 det(A)가 −a₁·a₀와 일치함을 확인하라. (tr, det 값)'; },
    solve:function(p){
      return { ans:{tr:-p.a1, det:p.a0}, unit:{tr:'', det:''}, steps:[
        'A=[[0,1],[−'+p.a0+',−'+p.a1+']] → tr = −'+p.a1+', det = '+p.a0,
        '특성다항식 s²−tr·s+det = s²+'+p.a1+'s+'+p.a0+' ✓ (분모 재현)' ] }; },
    hints:['tr=합, det=곱의 부호 규칙.'] },
  { id:'u5-l3-04', level:3, type:'num', tags:['진자 상태공간'], src:'기출 유형',
    params:{ L:{choices:[0.5,1]}, c:{choices:[0.4,1]} },
    statement:function(p){ return '감쇠 진자 \\(\\ddot\\theta+'+p.c+'\\dot\\theta+(g/L)\\sin\\theta=u\\) (L='+p.L+', g=9.8)를 θ=0에서 선형화한 A의 (2,1)·(2,2)와 고유값 실수부를 구하라.'; },
    solve:function(p){
      var k=9.8/p.L;
      var D=p.c*p.c-4*k;
      var re=D>=0?(-p.c+Math.sqrt(D))/2:-p.c/2;
      return { ans:{a21:-k, a22:-p.c, re:re}, unit:{a21:'',a22:'',re:''}, steps:[
        'sinθ≈θ → A=[[0,1],[−'+SVH.fmt(k)+',−'+p.c+']]',
        '고유값 실수부 = '+SVH.fmt(re)+' (감쇠가 작아 복소근 — 흔들리며 멈춘다)' ] }; },
    hints:['선형화 후 동반형.'] },
  { id:'u5-l3-05', level:3, type:'num', tags:['도립 진자 불안정'], src:'기출 유형',
    params:{ L:{choices:[0.5,1]} },
    statement:function(p){ return '도립(거꾸로) 진자: θ=π 근방 선형화 \\(\\ddot\\phi-(g/L)\\phi=0\\) (L='+p.L+'). (a) 고유값 둘 (b) 불안정 모드의 시정수(발산 e배 시간)를 구하라.'; },
    solve:function(p){
      var lam=Math.sqrt(9.8/p.L);
      return { ans:{l1:lam, l2:-lam, tau:1/lam}, unit:{l1:'',l2:'',tau:'s'}, steps:[
        'λ = ±√(g/L) = ±'+SVH.fmt(lam),
        '양의 고유값 → 불안정. e배 시간 = 1/λ = '+SVH.fmt(1/lam)+' s',
        '(이 시간 안에 제어가 개입해야 세울 수 있다 — 피드백 필요성의 대표 사례)' ] }; },
    hints:['부호가 뒤집힌 스프링.'] },
  { id:'u5-l3-06', level:3, type:'num', tags:['2탱크 연립'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[1,2]}, b:{choices:[1,3]} },
    statement:function(p){ return '2탱크: \\(\\dot x_1=-'+p.a+'x_1+u,\\ \\dot x_2='+p.a+'x_1-'+p.b+'x_2\\). (a) A의 고유값 둘 (b) u=1 스텝의 정상 x₂를 구하라.'; },
    solve:function(p){
      return { ans:{l1:-p.a, l2:-p.b, x2:p.a/(p.a*p.b)}, unit:{l1:'',l2:'',x2:''}, steps:[
        '하삼각 → λ = −'+p.a+', −'+p.b,
        '정상: x₁=1/'+p.a+', x₂ = '+p.a+'x₁/'+p.b+' = 1/'+p.b+' = '+SVH.fmt(1/p.b),
        '(직렬 1차계 둘 = 극점 둘의 물리적 그림)' ] }; },
    hints:['정상상태는 ẋ=0 연립.'] },
  { id:'u5-l3-07', level:3, type:'num', tags:['출력에 D'], src:'창작 문제(검산됨)',
    params:{ d:{choices:[1,2]}, b0:{choices:[3,4]}, a0:{choices:[6,8]} },
    statement:function(p){ return 'G(s) = '+p.d+' + \\(\\dfrac{'+p.b0+'}{s+'+p.a0+'}\\) (D≠0 시스템). (a) D (b) 스텝 입력의 y(0⁺) (c) y(∞)를 구하라.'; },
    solve:function(p){
      return { ans:{D:p.d, y0:p.d, yinf:p.d+p.b0/p.a0}, unit:{D:'',y0:'',yinf:''}, steps:[
        'D = 직결항 = '+p.d+' → y(0⁺) = D×1 = '+p.d+' (즉시 점프!)',
        'y(∞) = G(0) = '+p.d+'+'+SVH.fmt(p.b0/p.a0)+' = '+SVH.fmt(p.d+p.b0/p.a0),
        '(D는 분자·분모 같은 차수의 흔적)' ] }; },
    hints:['D가 있으면 스텝에 즉답 성분.'] },
  { id:'u5-l3-08', level:3, type:'num', tags:['좌표 변환 불변량'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[2,3]}, b:{choices:[4,5]} },
    statement:function(p){ return 'A=[[−'+p.a+',0],[0,−'+p.b+']]를 T=[[1,1],[0,1]]로 변환한 \\(\\tilde A=T^{-1}AT\\)의 (a) tr (b) det를 구해 불변임을 확인하라.'; },
    solve:function(p){
      return { ans:{tr:-(p.a+p.b), det:p.a*p.b}, unit:{tr:'',det:''}, steps:[
        '유사 변환은 고유값 보존 → tr = −'+(p.a+p.b)+', det = '+p.a*p.b+' 그대로',
        '(직접 계산해도 같다 — 불변량 확인이 계산 검산보다 빠를 때가 많다)' ] }; },
    hints:['유사 변환의 성질.'] },
  { id:'u5-l3-09', level:3, type:'num', tags:['모터 상태공간'], src:'기출 유형',
    params:{ J:{choices:[0.5,1]}, b:{choices:[1,2]}, Kt:{choices:[1,2]}, Ra:{choices:[2]} },
    statement:function(p){ return '전기자 인덕턴스 무시 DC 모터(1차): \\(J\\dot\\omega=-(b+K_t^2/R_a)\\omega+(K_t/R_a)V\\). (a) A(스칼라) (b) B (c) 고유값을 구하라. (J='+p.J+', b='+p.b+', K_t='+p.Kt+', R_a='+p.Ra+')'; },
    solve:function(p){
      var A=-(p.b+p.Kt*p.Kt/p.Ra)/p.J, B=(p.Kt/p.Ra)/p.J;
      return { ans:{A:A, B:B, lam:A}, unit:{A:'',B:'',lam:''}, steps:[
        'A = −(b+K_t²/R_a)/J = '+SVH.fmt(A),
        'B = (K_t/R_a)/J = '+SVH.fmt(B),
        '1차라 고유값=A 자신 = '+SVH.fmt(A)+' (U3 시정수의 역수와 부호)' ] }; },
    hints:['1차계는 스칼라 상태방정식.'] },
  { id:'u5-l3-10', level:3, type:'num', tags:['평형 2개'], src:'기출 유형',
    params:{ r:{choices:[2,4]} },
    statement:function(p){ return '\\(\\dot x = x('+p.r+'-x)\\) (로지스틱형). (a) 평형점 둘 (b) 각 평형의 선형화 계수 (c) 안정한 평형점을 구하라.'; },
    solve:function(p){
      return { ans:{x1:0, x2:p.r, a1:p.r, a2:-p.r, stable:p.r}, unit:{x1:'',x2:'',a1:'',a2:'',stable:''}, steps:[
        '평형: x=0, x='+p.r,
        '∂f/∂x = '+p.r+'−2x → x=0에서 +'+p.r+'(불안정), x='+p.r+'에서 −'+p.r+'(안정)',
        '(같은 시스템에 안정·불안정 평형이 공존 — 선형화는 "점"의 이야기)' ] }; },
    hints:['f=0 근 두 개, 각각 미분.'] },
  { id:'u5-l3-11', level:3, type:'num', tags:['가제어 소개'], src:'교재 표준',
    params:{ a:{choices:[2,3]}, b1:{choices:[1]}, },
    statement:function(p){ return 'A=[[−'+p.a+',0],[0,−'+(p.a+1)+']], B=['+p.b1+',0]ᵀ. 가제어성 행렬 [B, AB]의 행렬식을 구하고 제어 가능 여부(1/0)를 답하라.'; },
    solve:function(p){
      return { ans:{det:0, ctrl:0}, unit:{det:'', ctrl:''}, steps:[
        'AB = [−'+p.a+'·'+p.b1+', 0]ᵀ → [B, AB] = [['+p.b1+',−'+p.a*p.b1+'],[0,0]]',
        'det = 0 → 제어 불가(0): 둘째 모드에 입력이 닿지 않는다',
        '(소개 수준: "B가 0인 모드는 못 움직인다"는 직관 확인)' ] }; },
    hints:['둘째 상태에 B성분이 없다.'] },
  { id:'u5-l3-12', level:3, type:'num', tags:['수치 적분 한 스텝'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[2,4]}, h:{choices:[0.1,0.2]}, x0:{choices:[1,2]} },
    statement:function(p){ return '\\(\\dot x=-'+p.a+'x\\), x(0)='+p.x0+'를 오일러법(스텝 h='+p.h+')으로 한 스텝 진행한 값과 참값을 비교하라: (a) 오일러 x₁ (b) 참값 (c) 오차.'; },
    solve:function(p){
      var xe=p.x0*(1-p.a*p.h), xt=p.x0*Math.exp(-p.a*p.h);
      return { ans:{xe:xe, xt:xt, err:xe-xt}, unit:{xe:'',xt:'',err:''}, steps:[
        '오일러: x₁ = x₀(1−ah) = '+SVH.fmt(xe),
        '참값: x₀e^{−ah} = '+SVH.fmt(xt),
        '오차 = '+SVH.fmt(xe-xt)+' (시뮬레이션이 왜 h에 민감한지 — HW 수치문제 대비)' ] }; },
    hints:['(1−ah)는 e^{−ah}의 1차 근사.'] },
  { id:'u5-l3-13', level:3, type:'num', tags:['직렬 RC 2단 상태'], src:'창작 문제(검산됨)',
    params:{ t1:{choices:[1,2]}, t2:{choices:[3,4]} },
    statement:function(p){ return '독립(버퍼) 1차계 두 개: \\(\\dot x_1=-x_1/'+p.t1+'+u,\\ \\dot x_2=-x_2/'+p.t2+'+x_1\\). u=1 스텝의 정상 (a) x₁ (b) x₂를 구하라.'; },
    solve:function(p){
      var x1=p.t1, x2=p.t1*p.t2;
      return { ans:{x1:x1, x2:x2}, unit:{x1:'',x2:''}, steps:[
        '정상: x₁ = τ₁·u = '+p.t1+', x₂ = τ₂·x₁ = '+SVH.fmt(x2),
        '(DC 이득이 곱으로 쌓인다 — 직렬 구조의 상태공간 확인)' ] }; },
    hints:['ẋ=0 대입 순서대로.'] },
  { id:'u5-l3-14', level:3, type:'num', tags:['선형화 B'], src:'기출 유형',
    params:{ x0:{choices:[1,2]}, u0:{choices:[2,3]} },
    statement:function(p){ return '\\(\\dot x=-x^2+xu\\)의 평형 (x₀='+p.x0+', 대응 u₀)에서 (a) u₀ (b) a=∂f/∂x (c) b=∂f/∂u를 구하라.'; },
    solve:function(p){
      var u0=p.x0; // 0=-x0²+x0·u0 → u0=x0
      var a=-2*p.x0+u0, b=p.x0;
      return { ans:{u0:u0, a:a, b:b}, unit:{u0:'',a:'',b:''}, steps:[
        '평형: 0 = −x₀²+x₀u₀ → u₀ = x₀ = '+u0,
        'a = −2x₀+u₀ = '+SVH.fmt(a)+', b = x₀ = '+SVH.fmt(b),
        '(B도 동작점에 의존 — 입력 유효성이 상태에 따라 변한다)' ] }; },
    hints:['두 편미분 모두 평형점에서 평가.'] },

  /* ---------- L4 (8) ---------- */
  { id:'u5-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'옳은 것을 모두 고르면?<br>㉠ 상태 차원 = 독립 에너지 저장 요소 수<br>㉡ 고유값은 좌표 변환에 불변이다<br>㉢ det(sI−A)=0 이 특성방정식이다<br>㉣ 선형화 모델의 타당성은 동작점 근방으로 제한된다',
    choices:['전부','㉠㉡㉢','㉡㉢㉣','㉠㉣'],
    answer:0, expl:'전부 참 — "소개 수준"에서 시험이 물을 수 있는 핵심 4명제.' },
  { id:'u5-l4-02', level:4, type:'num', tags:['MSD 상태공간 풀코스'], src:'기출 유형',
    params:{ m:{choices:[1,2]}, c:{choices:[2,4]}, k:{choices:[8,18]}, F:{choices:[4,6]} },
    statement:function(p){ return 'MSD(m='+p.m+', c='+p.c+', k='+p.k+')에 스텝 힘 F='+p.F+'. 상태공간으로 (a) A(2,·) (b) 정상 상태 벡터 (x₁,x₂) (c) 고유값 실수부를 구하라.'; },
    solve:function(p){
      var xss=p.F/p.k;
      var D=(p.c/p.m)*(p.c/p.m)-4*p.k/p.m;
      var re=D>=0?(-p.c/p.m+Math.sqrt(D))/2:-p.c/(2*p.m);
      return { ans:{a21:-p.k/p.m, a22:-p.c/p.m, x1:xss, x2:0, re:re}, unit:{a21:'',a22:'',x1:'m',x2:'m/s',re:''}, steps:[
        'A(2,·)=[−k/m, −c/m]=['+SVH.fmt(-p.k/p.m)+', '+SVH.fmt(-p.c/p.m)+']',
        '정상: ẋ=0 → x₂=0, x₁=F/k='+SVH.fmt(xss),
        '고유값 실수부 = '+SVH.fmt(re)+' (<0 안정)' ] }; },
    hints:['정상 속도는 0이라는 물리 직관 확인.'] },
  { id:'u5-l4-03', level:4, type:'derive', tags:['유도'], src:'교재 표준',
    statement:'상태방정식에서 전달함수 공식 \\(G(s)=C(sI-A)^{-1}B+D\\)를 유도하라.',
    steps:[
      '라플라스(초기 0): \\(sX(s)=AX(s)+BU(s)\\) [왜] TF 정의가 초기 0 전제',
      '정리: \\((sI-A)X=BU\\) → \\(X=(sI-A)^{-1}BU\\) — 행렬이라 나눗셈 대신 역행렬',
      '출력: \\(Y=CX+DU=[C(sI-A)^{-1}B+D]U\\) → G(s) 완성',
      '분모: \\((sI-A)^{-1}=\\mathrm{adj}(sI-A)/\\det(sI-A)\\) → 극점 = det(sI−A)=0 = 고유값',
      '극한 체크: A 대각이면 (sI−A)⁻¹ 대각 = 1/(s−λᵢ) — 모드별 1차계 합 ✓ · 차원: [C][s⁻¹][B]=[y]/[u] ✓'
    ],
    hints:['스칼라 유도를 행렬로 그대로.','역행렬의 분모가 특성다항식.'],
    expl:'고유값=극점의 증명이자, "표현은 많아도 TF는 하나"의 근거.' },
  { id:'u5-l4-04', level:4, type:'num', tags:['도립진자+제어 예고'], src:'기출 유형',
    params:{ L:{choices:[1]}, kp:{choices:[15,20]} },
    statement:function(p){ return '도립 진자 선형화 \\(\\ddot\\phi=(g/L)\\phi+u\\) (L='+p.L+', g=9.8)에 비례 제어 u=−k_pφ (k_p='+p.kp+')를 걸면 닫힌 계는 \\(\\ddot\\phi=(g/L-k_p)\\phi\\)다. (a) 유효 강성 (b) 진동 여부(진동=1/발산=0) (c) 진동이면 그 주파수를 구하라.'; },
    solve:function(p){
      var keff=9.8/p.L-p.kp;
      var osc=keff<0?1:0;
      var w=osc?Math.sqrt(-keff):0;
      return { ans:{keff:keff, osc:osc, w:w}, unit:{keff:'', osc:'', w:'rad/s'}, steps:[
        '유효 계수 = g/L−k_p = '+SVH.fmt(keff),

        '(감쇠가 없어 계속 흔들린다 — 미분 제어가 왜 필요한지의 예고)' ] }; },
    hints:['이득이 중력 항을 이겨야 한다.'] },
  { id:'u5-l4-05', level:4, type:'num', tags:['비선형 밸브 완주'], src:'기출 유형',
    params:{ A:{choices:[2]}, k:{choices:[1]}, h0:{choices:[4,9]}, dq:{choices:[0.1,0.2]} },
    statement:function(p){ return '탱크(A='+p.A+', 유출 k√h, h₀='+p.h0+')에서 유입이 δq='+p.dq+'만큼 스텝 증가. 선형 모델로 (a) 새 정상 수위 변화 δh_ss (b) 시정수 (c) 실제 비선형 새 평형과의 오차(%)를 구하라.'; },
    solve:function(p){
      var m=p.k/(2*Math.sqrt(p.h0));

        'τ = A/m = '+SVH.fmt(tau)+' s',
        '비선형 참값: '+SVH.fmt(dtrue)+' m → 선형화 오차 '+SVH.fmt(err)+' %',
        '(작은 δq에선 오차 작음 — 선형화의 정당성과 한계를 같은 문제에서)' ] }; },
    hints:['참 평형은 √h 식을 직접 뒤집는다.'] },
  { id:'u5-l4-06', level:4, type:'num', tags:['모드 응답 완주'], src:'기출 유형',
    params:{ l1:{choices:[-1]}, l2:{choices:[-3,-5]}, t1:{choices:[0.5,1]} },
    statement:function(p){ return '대각계 x(0)=[1,1]ᵀ, Λ=diag('+p.l1+','+p.l2+'), y=x₁+x₂. (a) y(t) 식의 t='+p.t1+' 값 (b) 느린 모드만 남는 근사가 5% 이내가 되는 시각(빠른 모드 ≤ 느린 모드의 5%)을 구하라.'; },
    solve:function(p){
      var y=Math.exp(p.l1*p.t1)+Math.exp(p.l2*p.t1);
      // e^{l2 t} = 0.05 e^{l1 t} → t = ln(0.05)/(l2-l1)
      var tc=Math.log(0.05)/(p.l2-p.l1);
      return { ans:{y:y, tc:tc}, unit:{y:'', tc:'s'}, steps:[
        'y = e^{'+p.l1+'t}+e^{'+p.l2+'t} → t='+p.t1+': '+SVH.fmt(y),
        '비율 조건: e^{('+p.l2+'−'+p.l1+')t} = 0.05 → t = '+SVH.fmt(tc)+' s',
        '(그 후는 1차계로 근사 가능 — 지배극점 근사의 정량 기준)' ] }; },
    hints:['모드 비율에 ln.'] },
  { id:'u5-l4-07', level:4, type:'num', tags:['RLC→상태→TF 왕복'], src:'기출 유형',
    params:{ R:{choices:[3,5]}, L:{choices:[1]}, C:{choices:[0.25,0.5]} },
    statement:function(p){ return '직렬 RLC(u→v_C 출력, x=[i_L, v_C])의 (a) det(A) (b) tr(A) (c) 복원된 TF 분모 s²+c₁s+c₀의 계수와 U3 직접 모델링 결과의 일치 여부(1)를 구하라. (R='+p.R+', L='+p.L+', C='+p.C+')'; },
    solve:function(p){
      var tr=-p.R/p.L, det=1/(p.L*p.C);
      return { ans:{det:det, tr:tr, c1:-tr, c0:det, match:1}, unit:{det:'',tr:'',c1:'',c0:'',match:''}, steps:[
        'A=[[−R/L,−1/L],[1/C,0]] → tr=−'+SVH.fmt(p.R/p.L)+', det = 1/LC = '+SVH.fmt(det),
        '분모: s²+'+SVH.fmt(-tr)+'s+'+SVH.fmt(det)+' = LCs²+RCs+1 나누기 LC ✓ 일치(1)',
        '(두 표현이 같은 물리 — 왕복 확인이 시험 검산법)' ] }; },
    hints:['tr·det로 분모 재구성.'] },
  { id:'u5-l4-08', level:4, type:'num', tags:['임계 이득(상태공간 관점)'], src:'기출 유형',
    params:{ a:{choices:[2,4]} },
    statement:function(p){ return '피드백 u=−Kx₁을 건 이중 적분기 \\(\\ddot y=u-'+p.a+'\\dot y\\)... 정리하면 \\(\\ddot y+'+p.a+'\\dot y+Ky=0\\). (a) 임의 K>0에서 안정 여부(1/0) (b) ζ=1이 되는 K를 구하라.'; },
    solve:function(p){

        'ζ=1: a=2√K → K = a²/4 = '+SVH.fmt(Kc),
        '(이득이 감쇠비를 정한다: K<'+SVH.fmt(Kc)+' 과감쇠, 초과 시 진동)' ] }; },
    hints:['2차 표준형 비교.'] }
  ]
});

<script>
/* U6 시간응답 — 1차계(τ·Tr·Ts), 2차계(Mp·Tp·Tr·Ts), 추가 극점·영점 효과, 지배극점 */
SV_BANK.push({
  id: 'u6', no: 6, title: '시간응답 (1·2차계)', titleEn: 'Time Response',
  scope: '1차계 τ·상승·정착 · 2차계 사양(M_p, T_p, T_s, T_r) · ζ별 응답 형태 · 추가 극점·영점 효과 · 지배극점 근사',
  problems: [

  /* ---------- L1 (6) ---------- */
  { id:'u6-l1-01', level:1, type:'mc', tags:['1차 사양'], src:'교재 표준',

    choices:['T_p는 최종값에 도달하는 최초 시각','M_p는 (최대값−최종값)/최종값','T_s(2%)는 ±2% 띠에 들어가 머무는 시각','T_r은 보통 10→90%(또는 0→100%) 상승 시간'],

  { id:'u6-l1-03', level:1, type:'tf', tags:['공식'], src:'교재 표준',
    statement:'부족감쇠 2차계에서 \\(T_p=\\pi/\\omega_d\\), \\(M_p=e^{-\\pi\\zeta/\\sqrt{1-\\zeta^2}}\\), \\(T_s\\approx4/(\\zeta\\omega_0)\\)이다.',

  { id:'u6-l1-04', level:1, type:'mc', tags:['극점 위치'], src:'교재 표준',

    choices:['실수부=감쇠 속도, 허수부=진동 주파수, 원점 거리=ω₀, 각도=ζ','실수부=진동','허수부=감쇠','거리=ζ'],
    answer:0, expl:'cosθ=ζ (음의 실축 기준 각). 이 지도 하나로 극점→파형을 즉시 스케치한다.' },
  { id:'u6-l1-05', level:1, type:'tf', tags:['지배극점'], src:'교재 표준',

  { id:'u6-l1-06', level:1, type:'mc', tags:['영점 효과'], src:'교재 표준',

    choices:['오버슈트 증가·응답 빨라짐','느려짐','최종값 변화','아무 영향 없음'],

  /* ---------- L2 (12) ---------- */
  { id:'u6-l2-01', level:2, type:'num', tags:['1차 사양'], src:'창작 문제(검산됨)',
    params:{ K:{choices:[2,5]}, tau:{choices:[0.2,0.5,1]} },

  { id:'u6-l2-02', level:2, type:'num', tags:['극점→τ'], src:'창작 문제(검산됨)',

    statement:function(p){ return '극점이 s=−'+p.a+'인 1차계의 (a) 시정수 (b) 정착시간(2%)을 구하라.'; },
    solve:function(p){
      return { ans:{tau:1/p.a, Ts:4/p.a}, unit:{tau:'s', Ts:'s'}, steps:[

    hints:['τ=1/a.'] },
  { id:'u6-l2-03', level:2, type:'num', tags:['Mp'], src:'창작 문제(검산됨)',
    params:{ z:{choices:[0.3,0.5,0.7]} },
    statement:function(p){ return 'ζ='+p.z+'인 2차계의 오버슈트 M_p(%)를 구하라.'; },
    solve:function(p){ var Mp=Math.exp(-Math.PI*p.z/Math.sqrt(1-p.z*p.z))*100;

    hints:['ζ만 들어가는 공식.'] },
  { id:'u6-l2-04', level:2, type:'num', tags:['Tp·Ts'], src:'창작 문제(검산됨)',

        'T_s = 4/(ζω₀) = '+SVH.fmt(4/(p.z*p.w0))+' s' ] }; },
    hints:['ω_d 먼저.'] },
  { id:'u6-l2-05', level:2, type:'num', tags:['분모→사양'], src:'기출 유형',

      return { ans:{z:z, Mp:Mp, Ts:4/(z*w0)}, unit:{z:'', Mp:'%', Ts:'s'}, steps:[

    hints:['계수 비교 → 공식 셋.'] },
  { id:'u6-l2-06', level:2, type:'num', tags:['극점→사양'], src:'기출 유형',

    statement:function(p){ return '지배극점 s=−'+p.sg+'±j'+p.wd+'인 시스템의 (a) ζ (b) M_p (c) T_p를 구하라.'; },

        'M_p = e^{−πσ/ω_d} = '+SVH.fmt(Mp)+' % (σ/ω_d 형태가 계산이 빠르다)',
        'T_p = π/ω_d = '+SVH.fmt(Math.PI/p.wd)+' s' ] }; },
    hints:['극점 성분으로 바로.'] },
  { id:'u6-l2-07', level:2, type:'num', tags:['ζ 역산'], src:'창작 문제(검산됨)',
    params:{ Mp:{choices:[5,10,25]} },

        '= '+SVH.fmt(z)+' (설계는 늘 이 역방향부터 시작한다)' ] }; },
    hints:['역산 공식 자체를 암기 대상으로.'] },
  { id:'u6-l2-08', level:2, type:'num', tags:['응답값 계산'], src:'창작 문제(검산됨)',
    params:{ z:{choices:[0.5]}, w0:{choices:[2,4]}, t1:{choices:[1,2]} },
    statement:function(p){ return 'ζ='+p.z+', ω₀='+p.w0+' 2차계(단위 DC)의 스텝 응답 y('+p.t1+')을 표준 공식으로 구하라.'; },
    solve:function(p){
      var wd=p.w0*Math.sqrt(1-p.z*p.z), ph=Math.acos(p.z);
      var v=1-Math.exp(-p.z*p.w0*p.t1)/Math.sqrt(1-p.z*p.z)*Math.sin(wd*p.t1+ph);
      return { ans:v, unit:'', steps:[
        'y = 1−e^{−ζω₀t}sin(ω_dt+φ)/√(1−ζ²), φ=cos⁻¹ζ',
        't='+p.t1+': '+SVH.fmt(v) ] }; },
    hints:['라디안으로.'] },
  { id:'u6-l2-09', level:2, type:'num', tags:['과감쇠 지배 근사'], src:'창작 문제(검산됨)',
    params:{ p1:{choices:[1,2]}, k:{choices:[6,10]} },
    statement:function(p){ return '극점 −'+p.p1+', −'+(p.p1*p.k)+'인 과감쇠 2차계를 1차로 근사할 때 (a) 근사 τ (b) 근사 정착시간을 구하라.'; },
    solve:function(p){
      return { ans:{tau:1/p.p1, Ts:4/p.p1}, unit:{tau:'s', Ts:'s'}, steps:[
        '지배극점 −'+p.p1+' → τ ≈ '+SVH.fmt(1/p.p1)+' s',
        'T_s ≈ '+SVH.fmt(4/p.p1)+' s ('+p.k+'배 떨어져 있어 근사 타당)' ] }; },
    hints:['빠른 극점은 무시.'] },
  { id:'u6-l2-10', level:2, type:'num', tags:['ω₀ 스케일'], src:'창작 문제(검산됨)',
    params:{ z:{choices:[0.5,0.7]}, k:{choices:[2,3]} },
    statement:function(p){ return '같은 ζ='+p.z+'에서 ω₀를 '+p.k+'배로 키우면 (a) M_p (b) T_p는 각각 몇 배가 되는가?'; },
    solve:function(p){
      return { ans:{Mp:1, Tp:1/p.k}, unit:{Mp:'배', Tp:'배'}, steps:[
        'M_p는 ζ만의 함수 → 1배(불변)',
        'T_p = π/ω_d ∝ 1/ω₀ → 1/'+p.k+'배',
        '(모양은 ζ, 속도는 ω₀ — 역할 분담)' ] }; },
    hints:['어떤 사양이 어떤 파라미터 소관인지.'] },
  { id:'u6-l2-11', level:2, type:'num', tags:['첫 언더슈트'], src:'창작 문제(검산됨)',
    params:{ z:{choices:[0.3,0.5]} },
    statement:function(p){ return 'ζ='+p.z+' 2차계에서 첫 봉우리 다음의 첫 골(undershoot)의 최종값 대비 깊이(%)를 구하라. (힌트: 골은 t=2π/ω_d, 깊이 = M_p²... 아님 — e^{−2πζ/√(1−ζ²)})'; },
    solve:function(p){
      var d=Math.exp(-2*Math.PI*p.z/Math.sqrt(1-p.z*p.z))*100;
      return { ans:d, unit:'%', steps:[
        '봉우리·골의 편차는 반주기마다 e^{−πζ/√(1−ζ²)}배',
        '첫 골 깊이 = (M_p 비율)² = e^{−2πζ/√(1−ζ²)} = '+SVH.fmt(d)+' %',
        '(연속 진폭비가 일정 — U1 로그 감쇠법과 같은 구조)' ] }; },
    hints:['반주기마다 같은 비율로 준다.'] },
  { id:'u6-l2-12', level:2, type:'num', tags:['DC와 사양 분리'], src:'창작 문제(검산됨)',
    params:{ K:{choices:[3,5]}, c1:{choices:[2,4]}, c0:{choices:[16,25]} },
    statement:function(p){ return '\\(G=\\dfrac{'+p.K+'·'+p.c0+'}{s^2+'+p.c1+'s+'+p.c0+'}\\) 스텝 응답의 (a) 최종값 (b) 최대값을 구하라.'; },
    solve:function(p){
      var w0=Math.sqrt(p.c0), z=p.c1/(2*w0);
      var Mp=Math.exp(-Math.PI*z/Math.sqrt(1-z*z));
      return { ans:{fin:p.K, peak:p.K*(1+Mp)}, unit:{fin:'', peak:''}, steps:[
        '최종값 = G(0) = '+p.K,
        'ζ='+SVH.fmt(z)+' → M_p='+SVH.fmt(Mp*100)+'% → 최대값 = '+p.K+'(1+'+SVH.fmt(Mp)+') = '+SVH.fmt(p.K*(1+Mp)),
        '(오버슈트는 최종값 기준 비율)' ] }; },
    hints:['DC 이득과 M_p를 곱으로 결합.'] },

  /* ---------- L3 (14) ---------- */
  { id:'u6-l3-01', level:3, type:'num', tags:['사양 풀세트'], src:'기출 유형',
    params:{ c1:{choices:[4,8]}, c0:{choices:[64,100]} },
    statement:function(p){ return '\\(G=\\dfrac{'+p.c0+'}{s^2+'+p.c1+'s+'+p.c0+'}\\)의 (a) M_p (b) T_p (c) T_s(2%) (d) 대략 상승시간 T_r≈1.8/ω₀(ζ≈0.5 근방 근사)를 구하라.'; },
    solve:function(p){
      var w0=Math.sqrt(p.c0), z=p.c1/(2*w0), wd=w0*Math.sqrt(1-z*z);
      var Mp=Math.exp(-Math.PI*z/Math.sqrt(1-z*z))*100;
      return { ans:{Mp:Mp, Tp:Math.PI/wd, Ts:8/p.c1, Tr:1.8/w0}, unit:{Mp:'%', Tp:'s', Ts:'s', Tr:'s'}, steps:[
        'ω₀='+SVH.fmt(w0)+', ζ='+SVH.fmt(z)+', ω_d='+SVH.fmt(wd),
        'M_p='+SVH.fmt(Mp)+'%, T_p='+SVH.fmt(Math.PI/wd)+' s',
        'T_s=4/(ζω₀)=8/c₁='+SVH.fmt(8/p.c1)+' s, T_r≈'+SVH.fmt(1.8/w0)+' s' ] }; },
    hints:['네 사양을 한 표로.'] },
  { id:'u6-l3-02', level:3, type:'num', tags:['설계: 분모 결정'], src:'기출 유형',
    params:{ Mp:{choices:[10,20],unit:'%'}, Ts:{choices:[1,2],unit:'s'} },
    statement:function(p){ return '요구: M_p≤'+p.Mp+'%, T_s≤'+p.Ts+' s (2%). 경계 설계의 (a) ζ (b) ω₀ (c) 특성다항식 계수 c₁·c₀를 구하라.'; },
    solve:function(p){
      var lnM=Math.log(p.Mp/100);
      var z=-lnM/Math.sqrt(Math.PI*Math.PI+lnM*lnM);
      var w0=4/(p.Ts*z);
      return { ans:{z:z, w0:w0, c1:2*z*w0, c0:w0*w0}, unit:{z:'', w0:'rad/s', c1:'', c0:''}, steps:[
        'ζ = '+SVH.fmt(z)+' (M_p 역산)',
        'ζω₀ = 4/T_s → ω₀ = '+SVH.fmt(w0),
        '분모: s²+'+SVH.fmt(2*z*w0)+'s+'+SVH.fmt(w0*w0) ] }; },
    hints:['ζ 먼저, 그다음 ω₀.'] },
  { id:'u6-l3-03', level:3, type:'num', tags:['추가 극점 정량'], src:'기출 유형',
    params:{ sg:{choices:[1,2]}, wd:{choices:[3,4]}, k:{choices:[2,5,10]} },
    statement:function(p){ return '지배극점 −'+p.sg+'±j'+p.wd+'에 실극점 −'+p.sg*5*1+'... 대신 −'+p.sg+'×'+p.k+' 위치의 극점 추가. (a) 극점비 (b) 2차 근사 타당 여부(1/0) (c) 근사 시 M_p를 구하라.'; },
    solve:function(p){
      var Mp=Math.exp(-Math.PI*p.sg/p.wd)*100;
      return { ans:{ratio:p.k, ok:p.k>=5?1:0, Mp:Mp}, unit:{ratio:'배', ok:'', Mp:'%'}, steps:[
        '극점비 = '+p.k+'배 → '+(p.k>=5?'5배 규칙 충족: 근사 타당(1)':'5배 미만: 근사 주의(0) — 실제 응답은 더 느리고 M_p 감소'),
        '2차 근사 M_p = e^{−πσ/ω_d} = '+SVH.fmt(Mp)+' %' ] }; },
    hints:['5배 규칙 + 추가 극점은 응답을 누른다.'] },
  { id:'u6-l3-04', level:3, type:'num', tags:['영점 효과 정량'], src:'기출 유형',
    params:{ z:{choices:[0.5]}, w0:{choices:[2]}, zz:{choices:[1,2,10]} },
    statement:function(p){ return '\\(G=\\dfrac{\\omega_0^2(s/'+p.zz+'+1)}{s^2+2ζω_0s+ω_0^2}\\) (ζ='+p.z+', ω₀='+p.w0+'). 응답은 y₀(무영점 응답)+ẏ₀/'+p.zz+'. t=T_p(무영점 기준)에서 미분항이 0임을 이용해, 영점이 최대값을 바꾸는 방향과 t=0.5에서 ẏ₀/'+p.zz+' 항의 값을 구하라.'; },
    solve:function(p){
      var wd=p.w0*Math.sqrt(1-p.z*p.z);
      // y0' (스텝응답 미분 = 임펄스 응답) = w0/√(1-ζ²) e^{-ζw0t} sin wd t
      var t1=0.5;
      var yd=p.w0/Math.sqrt(1-p.z*p.z)*Math.exp(-p.z*p.w0*t1)*Math.sin(wd*t1)/p.zz;
      return { ans:yd, unit:'', steps:[
        'ẏ₀ = ω₀e^{−ζω₀t}sin(ω_dt)/√(1−ζ²) (임펄스 응답)',
        't=0.5: 기여 = '+SVH.fmt(yd)+' (양수 → 응답을 들어올림 = 오버슈트 증가)',
        '영점이 멀수록(1/z 작음) 기여↓ — z='+p.zz+'는 '+(p.zz>=10?'무시 가능':'뚜렷한 효과') ] }; },
    hints:['영점 = 원응답+미분/z.'] },
  { id:'u6-l3-05', level:3, type:'num', tags:['우반평면 영점'], src:'기출 유형',
    params:{ z:{choices:[0.5]}, w0:{choices:[2]}, zz:{choices:[1,2]} },
    statement:function(p){ return '위와 같으나 영점이 우반평면(+'+p.zz+'): y = y₀ − ẏ₀/'+p.zz+'. (a) 초기 미분 ẏ(0⁺)의 부호 (b) t=0.3에서 y를 구하라. (역응답 확인)'; },
    solve:function(p){
      var wd=p.w0*Math.sqrt(1-p.z*p.z), t1=0.3, ph=Math.acos(p.z);
      var y0=1-Math.exp(-p.z*p.w0*t1)/Math.sqrt(1-p.z*p.z)*Math.sin(wd*t1+ph);
      var yd=p.w0/Math.sqrt(1-p.z*p.z)*Math.exp(-p.z*p.w0*t1)*Math.sin(wd*t1);
      var y=y0-yd/p.zz;
      return { ans:{sgn:-1, y:y}, unit:{sgn:'', y:''}, steps:[
        'ẏ(0⁺) = ẏ₀(0)−ÿ₀(0)/z... 초기 기울기 부호 = 음(−1): 목표 반대로 먼저 움직인다',
        't=0.3: y = '+SVH.fmt(y0)+'−'+SVH.fmt(yd/p.zz)+' = '+SVH.fmt(y),
        '(비최소위상: 자전거 핸들·보일러 수위의 그 현상)' ] }; },
    hints:['빼기 부호가 역응답을 만든다.'] },
  { id:'u6-l3-06', level:3, type:'num', tags:['폐루프 K→사양'], src:'기출 유형',
    params:{ a:{choices:[2,4]}, K:{choices:[16,36]} },
    statement:function(p){ return '단위 피드백, \\(G=\\dfrac{'+p.K+'}{s(s+'+p.a+')}\\) 폐루프의 (a) ζ (b) M_p (c) K를 4배로 올리면 M_p는 어떻게 변하는지(새 값)를 구하라.'; },
    solve:function(p){
      function mp(K){ var z=p.a/(2*Math.sqrt(K)); return Math.exp(-Math.PI*z/Math.sqrt(1-z*z))*100; }
      var z=p.a/(2*Math.sqrt(p.K));
      return { ans:{z:z, Mp:mp(p.K), Mp4:mp(4*p.K)}, unit:{z:'', Mp:'%', Mp4:'%'}, steps:[
        'ζ = a/(2√K) = '+SVH.fmt(z)+' → M_p = '+SVH.fmt(mp(p.K))+' %',
        'K 4배 → ζ 절반 → M_p = '+SVH.fmt(mp(4*p.K))+' %',
        '(이득↑ = 빠르지만 요동↑ — 제어 설계 갈등의 원형)' ] }; },
    hints:['ζ∝1/√K.'] },
  { id:'u6-l3-07', level:3, type:'num', tags:['측정→사양 역산'], src:'기출 유형',
    params:{ peak:{choices:[1.25,1.4]}, Tp:{choices:[0.5,1]} },
    statement:function(p){ return '스텝 응답 실측: 최대 '+p.peak+'(최종 1), 봉우리 시각 '+p.Tp+' s. (a) ζ (b) ω₀ (c) T_s(2%)를 구하라.'; },
    solve:function(p){
      var lnM=Math.log(p.peak-1);
      var z=-lnM/Math.sqrt(Math.PI*Math.PI+lnM*lnM);
      var wd=Math.PI/p.Tp, w0=wd/Math.sqrt(1-z*z);
      return { ans:{z:z, w0:w0, Ts:4/(z*w0)}, unit:{z:'', w0:'rad/s', Ts:'s'}, steps:[
        'M_p = '+SVH.fmt((p.peak-1)*100)+'% → ζ = '+SVH.fmt(z),
        'ω_d = π/T_p = '+SVH.fmt(wd)+' → ω₀ = '+SVH.fmt(w0),
        'T_s = 4/(ζω₀) = '+SVH.fmt(4/(z*w0))+' s' ] }; },
    hints:['측정 2개 → 파라미터 2개.'] },
  { id:'u6-l3-08', level:3, type:'num', tags:['정착 대역 비교'], src:'창작 문제(검산됨)',
    params:{ z:{choices:[0.5,0.6]}, w0:{choices:[4,8]} },
    statement:function(p){ return 'ζ='+p.z+', ω₀='+p.w0+'에서 (a) 2% 정착 (b) 5% 정착(≈3/(ζω₀))의 시간을 구하고 비율을 확인하라.'; },
    solve:function(p){
      var s2=4/(p.z*p.w0), s5=3/(p.z*p.w0);
      return { ans:{Ts2:s2, Ts5:s5}, unit:{Ts2:'s', Ts5:'s'}, steps:[
        'T_s(2%) = '+SVH.fmt(s2)+' s, T_s(5%) = '+SVH.fmt(s5)+' s',
        '비 = 4:3 (ln50 vs ln20의 근사 — 기준을 문제에서 확인하는 습관!)' ] }; },
    hints:['4/ζω₀ vs 3/ζω₀.'] },
  { id:'u6-l3-09', level:3, type:'num', tags:['1차+지연 근사'], src:'창작 문제(검산됨)',
    params:{ tau:{choices:[1,2]}, k:{choices:[5,10]} },
    statement:function(p){ return '극점 −1/'+p.tau+'과 −'+p.k+'/'+p.tau+'의 2극점계(DC 1). 정확 정착시간은 지배극점 기준 4'+p.tau+'보다 약간 크다. 빠른 극점의 τ₂와, 근사 정착시간에 τ₂를 더한 보정 추정치를 구하라.'; },
    solve:function(p){
      var t2=p.tau/p.k;
      return { ans:{t2:t2, Ts:4*p.tau+t2}, unit:{t2:'s', Ts:'s'}, steps:[
        'τ₂ = '+SVH.fmt(t2)+' s',
        '보정 T_s ≈ 4τ₁+τ₂ = '+SVH.fmt(4*p.tau+t2)+' s (엔지니어링 룰)',
        '(빠른 모드는 "지연"처럼 더해진다)' ] }; },
    hints:['빠른 모드의 기여를 지연으로.'] },
  { id:'u6-l3-10', level:3, type:'num', tags:['진동 수 세기'], src:'창작 문제(검산됨)',
    params:{ z:{choices:[0.2,0.4]} },
    statement:function(p){ return 'ζ='+p.z+' 2차계가 2% 정착 전까지 보이는 진동(봉우리) 개수를 추정하라: N ≈ T_s/T_주기 = (4/ζω₀)/(2π/ω_d).'; },
    solve:function(p){
      var N=4*Math.sqrt(1-p.z*p.z)/(2*Math.PI*p.z);
      return { ans:N, unit:'개', steps:[
        'N = (4/ζω₀)·(ω_d/2π) = 4√(1−ζ²)/(2πζ)',
        '= '+SVH.fmt(N)+' (ω₀와 무관! ζ만이 "몇 번 흔들리는가"를 정한다)' ] }; },
    hints:['정착시간/주기.'] },
  { id:'u6-l3-11', level:3, type:'num', tags:['ζ별 형태 판정'], src:'기출 유형',
    params:{ c1:{choices:[4,10,20]}, c0:{choices:[25]} },
    statement:function(p){ return '\\(s^2+'+p.c1+'s+'+p.c0+'\\)의 응답 형태를 판정하고(부족=−1/임계=0/과=1), 부족감쇠면 M_p, 과감쇠면 두 시정수를 구하라. (해당 없는 값은 0)'; },
    solve:function(p){
      var w0=Math.sqrt(p.c0), z=p.c1/(2*w0);
      if(z<0.999){ var Mp=Math.exp(-Math.PI*z/Math.sqrt(1-z*z))*100;
        return { ans:{t:-1, Mp:Mp, tau1:0, tau2:0}, unit:{t:'',Mp:'%',tau1:'',tau2:''}, steps:[
          'ζ='+SVH.fmt(z)+'<1 부족감쇠(−1)','M_p = '+SVH.fmt(Mp)+' %'] }; }
      if(z>1.001){ var D=Math.sqrt(p.c1*p.c1-4*p.c0);
        var r1=(p.c1-D)/2, r2=(p.c1+D)/2;
        return { ans:{t:1, Mp:0, tau1:1/r1, tau2:1/r2}, unit:{t:'',Mp:'',tau1:'s',tau2:'s'}, steps:[
          'ζ='+SVH.fmt(z)+'>1 과감쇠(1)','τ = '+SVH.fmt(1/r1)+', '+SVH.fmt(1/r2)+' s'] }; }
      return { ans:{t:0, Mp:0, tau1:2/p.c1, tau2:2/p.c1}, unit:{t:'',Mp:'',tau1:'s',tau2:'s'}, steps:['ζ=1 임계(0)','중근 τ = '+SVH.fmt(2/p.c1)] }; },
    hints:['ζ 계산 후 분기.'] },
  { id:'u6-l3-12', level:3, type:'num', tags:['첫 도달 시각'], src:'창작 문제(검산됨)',
    params:{ z:{choices:[0.5,0.707]}, w0:{choices:[2,4]} },
    statement:function(p){ return 'ζ='+p.z+', ω₀='+p.w0+' 2차계가 최종값을 "처음" 통과하는 시각(=100% 상승시간) \\(T=\\dfrac{\\pi-\\cos^{-1}\\zeta}{\\omega_d}\\)을 구하라.'; },
    solve:function(p){
      var wd=p.w0*Math.sqrt(1-p.z*p.z);
      var T=(Math.PI-Math.acos(p.z))/wd;
      return { ans:T, unit:'s', steps:[
        'ω_d = '+SVH.fmt(wd)+', cos⁻¹ζ = '+SVH.fmt(Math.acos(p.z))+' rad',
        'T = (π−'+SVH.fmt(Math.acos(p.z))+')/'+SVH.fmt(wd)+' = '+SVH.fmt(T)+' s',

  { id:'u6-l3-13', level:3, type:'num', tags:['모터 위치 서보'], src:'기출 유형',

  { id:'u6-l3-14', level:3, type:'num', tags:['임계감쇠 최속'], src:'창작 문제(검산됨)',
    params:{ w0:{choices:[2,5]}, t1:{choices:[1]} },

  /* ---------- L4 (8) ---------- */
  { id:'u6-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'옳은 것을 모두 고르면?<br>㉠ M_p는 ζ만의 함수다<br>㉡ T_s≈4/(ζω₀)는 극점 실수부만으로 정해진다<br>㉢ 우반평면 영점은 역응답(초기 반대 방향)을 일으킨다<br>㉣ 추가 좌반평면 극점은 응답을 느리게 하고 오버슈트를 줄이는 경향이 있다',
    choices:['전부','㉠㉡㉢','㉠㉢㉣','㉡㉣'],
    answer:0, expl:'전부 참. ㉡: ζω₀=|실수부|. 네 명제가 곧 "극영점 지도 읽기"다.' },
  { id:'u6-l4-02', level:4, type:'num', tags:['HW 종합: K 설계'], src:'기출 유형',
    params:{ a:{choices:[4,6]}, Mp:{choices:[10,15],unit:'%'} },
    statement:function(p){ return '단위 피드백 \\(G=\\dfrac{K}{s(s+'+p.a+')}\\)에서 M_p='+p.Mp+'%가 되도록 K를 정하고, 그때 (a) K (b) T_p (c) T_s를 구하라.'; },
    solve:function(p){
      var lnM=Math.log(p.Mp/100);

        'T_p = π/ω_d = '+SVH.fmt(Math.PI/wd)+' s, T_s = 8/'+p.a+' = '+SVH.fmt(8/p.a)+' s (a 고정이라 K로는 못 바꾼다!)' ] }; },
    hints:['ζ→ω₀→K 순서.','T_s가 K와 무관함을 지적하면 가산점 감각.'] },
  { id:'u6-l4-03', level:4, type:'derive', tags:['유도'], src:'교재 표준',
    statement:'부족감쇠 2차계 스텝 응답에서 \\(T_p=\\pi/\\omega_d\\)와 \\(M_p=e^{-\\pi\\zeta/\\sqrt{1-\\zeta^2}}\\)를 유도하라.',
    steps:[
      '스텝 응답: \\(y=1-\\dfrac{e^{-\\zeta\\omega_0t}}{\\sqrt{1-\\zeta^2}}\\sin(\\omega_dt+\\phi)\\), \\(\\phi=\\cos^{-1}\\zeta\\) [왜] U2 역변환 결과를 출발점으로',
      '극값: \\(\\dot y=\\dfrac{\\omega_0}{\\sqrt{1-\\zeta^2}}e^{-\\zeta\\omega_0t}\\sin\\omega_dt=0\\) → \\(\\omega_dt=n\\pi\\) — 미분하면 위상항이 깨끗이 사라지는 것이 포인트',
      '첫 봉우리 n=1: \\(T_p=\\pi/\\omega_d\\)',
      '대입: \\(y(T_p)=1+e^{-\\zeta\\omega_0\\pi/\\omega_d}\\) → \\(M_p=e^{-\\pi\\zeta/\\sqrt{1-\\zeta^2}}\\) (ζω₀/ω_d=ζ/√(1−ζ²))',
      '극한 체크: ζ→0 ⇒ M_p→1(100%) ✓ · ζ→1 ⇒ M_p→0 ✓ · 차원: 지수 무차원 ✓'
    ],
    hints:['미분에서 sin항만 남는 것을 확인.','ζω₀T_p를 ζ/√(1−ζ²)π로 정리.'],
    expl:'중간 서술형 1순위 후보 — 매년 어느 학교든 낸다.' },
  { id:'u6-l4-04', level:4, type:'num', tags:['3극점 실응답'], src:'기출 유형',
    params:{ sg:{choices:[1]}, wd:{choices:[2,3]}, p3:{choices:[2,10]} },
    statement:function(p){ return '극점 −'+p.sg+'±j'+p.wd+'와 −'+p.p3+' (DC 1). t=1에서 (a) 2차 근사 응답 (b) 3차 정확 응답의 빠른 모드 항 크기(잔차 근사 R≈ω₀²/(ω₀²−...) 생략, 단순히 e^{−'+p.p3+'t}의 크기)를 구해 근사 오차 감을 잡아라.'; },
    solve:function(p){
      var w0=Math.hypot(p.sg,p.wd), z=p.sg/w0, ph=Math.acos(z);

        '(근사의 좋고 나쁨을 수치로 감각하기)' ] }; },

  { id:'u6-l4-05', level:4, type:'num', tags:['속도 피드백 설계 종합'], src:'기출 유형',
    params:{ K:{choices:[100]}, a:{choices:[2]}, Mp:{choices:[5,10],unit:'%'} },
    statement:function(p){ return '단위 피드백+속도 피드백 h: 분모 s²+('+p.a+'+'+p.K+'h)s+'+p.K+'. M_p='+p.Mp+'%가 되는 h와 그때 T_s를 구하라.'; },

  { id:'u6-l4-06', level:4, type:'num', tags:['두 설계 비교'], src:'기출 유형',

    hints:['사양별로 승자가 다르다.'] },
  { id:'u6-l4-07', level:4, type:'num', tags:['영점+2차 최대값'], src:'기출 유형',
    params:{ zz:{choices:[1,3]} },
    statement:function(p){ return 'ζ=0.5, ω₀=2, 영점 −'+p.zz+'인 \\(G=\\dfrac{4(s/'+p.zz+'+1)}{s^2+2s+4}\\)의 스텝 응답을 t=0~3에서 0.05 간격으로 훑어 최대값을 구하라(수치 탐색 — 리롤마다 재계산).'; },
    solve:function(p){
      var z=0.5, w0=2, wd=w0*Math.sqrt(1-z*z), ph=Math.acos(z);

    hints:['격자 계산 — 표를 만들며.'] },
  { id:'u6-l4-08', level:4, type:'num', tags:['사양 지도(허용 영역)'], src:'기출 유형',
    params:{ Ts:{choices:[2,4],unit:'s'}, Mp:{choices:[10,20],unit:'%'}, wdmax:{choices:[5]} },

    hints:['두 사양 = 두 기하 제약.'] }
  ]
});

  { id:'u7-l2-03', level:2, type:'num', tags:['3차 Routh'], src:'기출 유형',
    params:{ a2:{choices:[3,5]}, a1:{choices:[4,7]}, a0:{choices:[2,6]} },
    statement:function(p){ return '\\(s^3+'+p.a2+'s^2+'+p.a1+'s+'+p.a0+'\\)의 Routh 1열 셋째 원소 b₁ = (a₂a₁−a₀)/a₂와 안정 여부(1/0)를 구하라.'; },
    solve:function(p){
      var b1=(p.a2*p.a1-p.a0)/p.a2;
      var st=b1>0?1:0;
      return { ans:{b1:b1, st:st}, unit:{b1:'', st:''}, steps:[
        'b₁ = ('+p.a2+'×'+p.a1+'−'+p.a0+')/'+p.a2+' = '+SVH.fmt(b1),
        '1열: 1, '+p.a2+', '+SVH.fmt(b1)+', '+p.a0+' — '+(st?'모두 양수 → 안정(1)':'부호 변화 → 불안정(0)'),
        '(3차 안정 조건 a₂a₁>a₀의 정체가 이 b₁이다)' ] }; },
    hints:['교차곱 공식 한 번.'] },
  { id:'u7-l2-04', level:2, type:'num', tags:['3차 조건식'], src:'교재 표준',
    params:{ a2:{choices:[2,4]}, a0:{choices:[6,10]} },
    statement:function(p){ return '\\(s^3+'+p.a2+'s^2+a_1s+'+p.a0+'\\)이 안정이 되기 위한 a₁의 최소 조건(a₁ > ?)을 구하라.'; },
    solve:function(p){ var v=p.a0/p.a2;
      return { ans:v, unit:'', steps:[
        '3차 조건: a₂a₁ > a₀ → a₁ > '+p.a0+'/'+p.a2+' = '+SVH.fmt(v),
        '(계수 전부 양수 + 이 교차 조건 = 3차의 전부)' ] }; },
    hints:['a₂a₁>a₀.'] },
  { id:'u7-l2-05', level:2, type:'num', tags:['K 범위 1차식'], src:'기출 유형',
    params:{ a:{choices:[2,5]}, b:{choices:[3,4]} },
    statement:function(p){ return '단위 피드백 \\(G=\\dfrac{K}{(s+'+p.a+')(s+'+p.b+')}\\)의 폐루프가 안정할 K 범위(K > ?)를 구하라.'; },
    solve:function(p){ var lim=-p.a*p.b;
      return { ans:lim, unit:'', steps:[
        '특성식: s²+'+(p.a+p.b)+'s+('+p.a*p.b+'+K)=0',
        '2차 특례: 상수항>0 → K > −'+p.a*p.b+' = '+SVH.fmt(lim),
        '(양의 K에선 항상 안정 — 2차 루프의 너그러움)' ] }; },
    hints:['2차는 계수 양수면 끝.'] },
  { id:'u7-l2-06', level:2, type:'num', tags:['K 범위 3차'], src:'기출 유형',
    params:{ a:{choices:[1,2]}, b:{choices:[3,4]} },
    statement:function(p){ return '단위 피드백 \\(G=\\dfrac{K}{s(s+'+p.a+')(s+'+p.b+')}\\)의 안정 K 범위 0<K<K_max의 K_max를 구하라.'; },
    solve:function(p){ var Kmax=(p.a+p.b)*p.a*p.b;
      return { ans:Kmax, unit:'', steps:[
        '특성식: s³+'+(p.a+p.b)+'s²+'+p.a*p.b+'s+K',
        'Routh: (a₂a₁−K)/a₂>0 → K < '+(p.a+p.b)+'×'+p.a*p.b+' = '+SVH.fmt(Kmax),
        '(K_max = 계수 교차곱 — 이 유형은 몸이 풀도록)' ] }; },
    hints:['3차 교차 조건에 K.'] },
  { id:'u7-l2-07', level:2, type:'num', tags:['임계 진동수'], src:'기출 유형',
    params:{ a:{choices:[1,2]}, b:{choices:[3,4]} },
    statement:function(p){ return '위 문제의 K=K_max(임계)에서 지속 진동의 주파수 ω를 보조 다항식 \\(a_2s^2+K_{max}=0\\)에서 구하라.'; },
    solve:function(p){
      var Kmax=(p.a+p.b)*p.a*p.b;
      var w=Math.sqrt(Kmax/(p.a+p.b));
      return { ans:w, unit:'rad/s', steps:[
        '보조식: '+(p.a+p.b)+'s²+'+SVH.fmt(Kmax)+'=0 → s=±j√('+SVH.fmt(Kmax/(p.a+p.b))+')',
        'ω = '+SVH.fmt(w)+' = √(a₁) = √('+p.a*p.b+') (허수축 극점의 주파수)' ] }; },
    hints:['s² 행이 보조 다항식.'] },
  { id:'u7-l2-08', level:2, type:'num', tags:['RHP 개수'], src:'기출 유형',
    params:{ c:{choices:[1,2]} },
    statement:function(p){ return '\\(s^3+s^2+s+'+ (p.c===1?6:10) +'\\)... 고정형: \\(s^3+s^2+'+p.c+'s+'+(p.c+4)+'\\)의 Routh 1열을 만들고 RHP 극점 수를 구하라.'; },
    solve:function(p){
      var a2=1, a1=p.c, a0=p.c+4;
      var b1=(a2*a1-a0)/a2;
      // 1열: 1, 1, b1(<0), a0(>0) → 부호변화 2회
      return { ans:2, unit:'개', steps:[
        'b₁ = ('+a1+'−'+a0+')/1 = '+SVH.fmt(b1)+' < 0',
        '1열 부호: +, +, −, + → 변화 2회',
        'RHP 극점 = 2개 (계수가 다 양수여도 불안정 — 필요≠충분의 실물 예)' ] }; },
    hints:['부호 변화 횟수를 센다.'] },
  { id:'u7-l2-09', level:2, type:'num', tags:['안정 여유'], src:'창작 문제(검산됨)',
    params:{ Kmax:{choices:[60,120]}, K:{choices:[10,20]} },
    statement:function(p){ return '임계 이득 K_max='+p.Kmax+'인 루프를 K='+p.K+'로 운용한다. 이득 여유(gain margin) = K_max/K를 배수와 dB로 구하라.'; },
    solve:function(p){ var gm=p.Kmax/p.K, db=20*Math.log10(gm);
      return { ans:{gm:gm, db:db}, unit:{gm:'배', db:'dB'}, steps:[
        'GM = '+p.Kmax+'/'+p.K+' = '+SVH.fmt(gm)+'배',
        '= '+SVH.fmt(db)+' dB (기말 보드/나이퀴스트에서 재등장할 개념의 s영역 버전)' ] }; },
    hints:['비율과 20log.'] },
  { id:'u7-l2-10', level:2, type:'num', tags:['4차 필요 스캔+1열'], src:'창작 문제(검산됨)',
    params:{ a3:{choices:[2,3]}, a2:{choices:[3,5]}, a1:{choices:[4,6]}, a0:{choices:[1,2]} },
    constraint:function(p){ return Math.abs(p.a3*p.a2-p.a1)>0.5; }, /* b1=0(ε케이스)은 l3-04에서 다룸 */
    statement:function(p){ return '\\(s^4+'+p.a3+'s^3+'+p.a2+'s^2+'+p.a1+'s+'+p.a0+'\\)의 Routh 둘째 열 원소 b₁=(a₃a₂−a₁)/a₃와 c₁=(b₁a₁−a₃a₀)/b₁을 구하라.'; },
    solve:function(p){
      var b1=(p.a3*p.a2-p.a1)/p.a3;
      var c1=(b1*p.a1-p.a3*p.a0)/b1;
      return { ans:{b1:b1, c1:c1}, unit:{b1:'', c1:''}, steps:[
        'b₁ = ('+p.a3+'×'+p.a2+'−'+p.a1+')/'+p.a3+' = '+SVH.fmt(b1),
        'c₁ = ('+SVH.fmt(b1)+'×'+p.a1+'−'+p.a3+'×'+p.a0+')/'+SVH.fmt(b1)+' = '+SVH.fmt(c1),
        '1열 [1, '+p.a3+', '+SVH.fmt(b1)+', '+SVH.fmt(c1)+', '+p.a0+']의 부호로 판정' ] }; },
    hints:['2×2 행렬식 패턴 반복.'] },
  { id:'u7-l2-11', level:2, type:'num', tags:['시간→s 판정'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[0.5,1]}, w:{choices:[2,3]} },
    statement:function(p){ return '응답에 \\(e^{+'+p.a+'t}\\cos'+p.w+'t\\) 성분이 관측됐다. (a) 해당 극점 쌍 (b) 이 성분의 진폭이 10배가 되는 시간을 구하라.'; },
    solve:function(p){ var t10=Math.log(10)/p.a;
      return { ans:{re:p.a, im:p.w, t10:t10}, unit:{re:'', im:'', t10:'s'}, steps:[
        '극점 = +'+p.a+' ± j'+p.w+' (우반평면 복소쌍)',
        '10배: e^{'+p.a+'t}=10 → t = ln10/'+p.a+' = '+SVH.fmt(t10)+' s',
        '(불안정의 속도감 — 제어 개입 시한의 감각)' ] }; },
    hints:['성분 모양이 극점을 말한다.'] },
  { id:'u7-l2-12', level:2, type:'num', tags:['적분기 개수와 안정'], src:'창작 문제(검산됨)',
    params:{ n:{choices:[1,2]} },
    statement:function(p){ return '원점 극점이 '+p.n+'개인 개루프 \\(G=1/s^'+p.n+'\\)에 단위 피드백을 걸면 특성식은 \\(s^'+p.n+'+1=0\\)이다. 폐루프 안정 여부(1/0)와 근의 실수부 최댓값을 구하라.'; },
    solve:function(p){
      if(p.n===1) return { ans:{st:1, re:-1}, unit:{st:'',re:''}, steps:['s+1=0 → s=−1','안정(1) — 적분기 하나는 피드백으로 길들여진다'] };
      return { ans:{st:0, re:0}, unit:{st:'',re:''}, steps:[
        's²+1=0 → s=±j (허수축)','경계 → BIBO 불안정(0): 이중 적분기는 비례 피드백만으론 진동',
        '(감쇠 항이 없다 — 미분 피드백의 필요성)'] }; },
    hints:['n=2가 함정.'] },

  /* ---------- L3 (14) ---------- */
  { id:'u7-l3-01', level:3, type:'num', tags:['3차 Routh 완주'], src:'기출 유형',
    params:{ a:{choices:[2,4]}, b:{choices:[6,8]}, c:{choices:[4,12]} },
    constraint:function(p){ return Math.abs(p.a*p.b-p.c)>0.5; }, /* 한계(b1=0) 조합은 l3-05 전담 */
    statement:function(p){ return '\\(s^3+'+p.a+'s^2+'+p.b+'s+'+p.c+'\\): (a) b₁ (b) RHP 개수 (c) 안정 판정(1/0).'; },
    solve:function(p){
      var b1=(p.a*p.b-p.c)/p.a;
      var st=b1>0&&p.c>0?1:0;
      var n=st?0:(b1<0?2:0);
      return { ans:{b1:b1, n:n, st:st}, unit:{b1:'', n:'개', st:''}, steps:[
        'b₁ = '+SVH.fmt(b1),
        '1열 [1, '+p.a+', '+SVH.fmt(b1)+', '+p.c+'] → 부호 변화 '+(st?'0회':'2회'),
        (st?'안정(1)':'불안정(0), RHP '+n+'개') ] }; },
    hints:['표 하나로 셋 다.'] },
  { id:'u7-l3-02', level:3, type:'num', tags:['K 범위+임계 주파수'], src:'기출 유형',
    params:{ a:{choices:[2,3]}, b:{choices:[4,5]} },
    statement:function(p){ return '단위 피드백 \\(G=\\dfrac{K}{s(s+'+p.a+')(s+'+p.b+')}\\): (a) K_max (b) 임계 진동수 (c) K=K_max/2일 때 안정 여부(1)를 구하라.'; },
    solve:function(p){
      var Kmax=(p.a+p.b)*p.a*p.b, w=Math.sqrt(p.a*p.b);
      return { ans:{Kmax:Kmax, w:w, st:1}, unit:{Kmax:'', w:'rad/s', st:''}, steps:[
        'K_max = (a+b)·ab = '+SVH.fmt(Kmax),
        'ω_임계 = √(ab) = '+SVH.fmt(w),
        'K='+SVH.fmt(Kmax/2)+' < K_max → 안정(1)' ] }; },
    hints:['U7-l2-06·07의 결합.'] },
  { id:'u7-l3-03', level:3, type:'num', tags:['파라미터 2개 범위'], src:'기출 유형',
    params:{ a:{choices:[1,2]} },
    statement:function(p){ return '특성식 \\(s^3+'+(p.a+2)+'s^2+(K_1+'+p.a+')s+K_2\\)... 단순화: K₁=K로 두고 \\(s^3+'+(p.a+2)+'s^2+(K+'+p.a+')s+'+(2*p.a)+'\\)의 안정 K 조건(K > ?)을 구하라.'; },
    solve:function(p){
      // (a+2)(K+a) > 2a → K > 2a/(a+2) - a
      var lim=2*p.a/(p.a+2)-p.a;
      return { ans:lim, unit:'', steps:[
        '교차 조건: '+(p.a+2)+'(K+'+p.a+') > '+(2*p.a),
        'K > '+SVH.fmt(2*p.a/(p.a+2))+'−'+p.a+' = '+SVH.fmt(lim)+' (음수면 "모든 K>0에서 성립"으로 읽는다)' ] }; },
    hints:['부등식을 K로 정리.'] },
  { id:'u7-l3-04', level:3, type:'num', tags:['ε법'], src:'교재 표준',
    params:{ a:{choices:[2,3]} },
    statement:function(p){ return '\\(s^3+'+p.a+'s^2+0\\cdot s+'+(2*p.a)+'\\)... 1열에 0이 뜨는 \\(s^4+s^3+2s^2+2s+'+p.a+'\\)로 판정하라: b₁=0 → ε 대체 후 c₁의 부호와 RHP 개수를 구하라.'; },
    solve:function(p){
      // 1열: 1,1, b1=(2-2)/1=0→ε, c1=(ε·2 - 1·a)/ε = 2 - a/ε → ε→0⁺에서 -∞(a>0) → 음수
      return { ans:{c1sgn:-1, n:2}, unit:{c1sgn:'', n:'개'}, steps:[
        'b₁ = (1·2−1·2)/1 = 0 → ε로 대체',
        'c₁ = (2ε−'+p.a+')/ε → ε→0⁺에서 −∞ (음수)',
        '1열 부호 +, +, +ε, −, +'+p.a+' → 변화 2회 → RHP 2개',
        '(0은 "판정 불가"가 아니라 ε로 뚫는다)' ] }; },
    hints:['ε 극한에서 지배항만.'] },
  { id:'u7-l3-05', level:3, type:'num', tags:['전행 0·보조식'], src:'교재 표준',
    params:{ w2:{choices:[4,9]} },
    statement:function(p){ return '\\(s^3+2s^2+'+p.w2+'s+'+(2*p.w2)+'\\)은 s¹행이 전부 0이 된다. (a) 보조 다항식 (b) 허수축 극점 주파수 (c) 안정 분류(경계=0.5)를 구하라.'; },
    solve:function(p){
      var w=Math.sqrt(p.w2);
      return { ans:{aux2:2, aux0:2*p.w2, w:w, cls:0.5}, unit:{aux2:'(s²계수)', aux0:'(상수)', w:'rad/s', cls:''}, steps:[
        'b₁ = (2·'+p.w2+'−'+(2*p.w2)+')/2 = 0 (전행 0)',
        '보조식 P(s) = 2s²+'+(2*p.w2)+' → s = ±j'+SVH.fmt(w),
        '미분 4s로 채워 계속: 나머지 근은 s=−2(안정)',
        '허수축 단순근 → 한계 안정(0.5) — 지속 진동 ω='+SVH.fmt(w) ] }; },
    hints:['전행 0 = 대칭근(±) 신호.','보조식이 그 근을 준다.'] },
  { id:'u7-l3-06', level:3, type:'num', tags:['설계: 여유를 정해 K 선택'], src:'기출 유형',
    params:{ a:{choices:[1,2]}, b:{choices:[4,5]}, gm:{choices:[2,4]} },
    statement:function(p){ return '\\(G=\\dfrac{K}{s(s+'+p.a+')(s+'+p.b+')}\\) 루프를 이득 여유 '+p.gm+'배로 운용하려 한다. (a) K_max (b) 운용 K (c) 그 K에서 3차 특성식의 b₁을 구하라.'; },
    solve:function(p){
      var Kmax=(p.a+p.b)*p.a*p.b, K=Kmax/p.gm;
      var b1=(  (p.a+p.b)*p.a*p.b - K )/(p.a+p.b);
      return { ans:{Kmax:Kmax, K:K, b1:b1}, unit:{Kmax:'', K:'', b1:''}, steps:[
        'K_max = '+SVH.fmt(Kmax)+' → 운용 K = '+SVH.fmt(K),
        'b₁ = (a₂a₁−K)/a₂ = '+SVH.fmt(b1)+' > 0 확인 ✓',
        '(여유 배수만큼 임계에서 물러선다 — 실무 이득 선정 절차)' ] }; },
    hints:['K=K_max/여유.'] },
  { id:'u7-l3-07', level:3, type:'num', tags:['지연 근사와 안정'], src:'기출 유형',
    params:{ a:{choices:[1,2]}, T:{choices:[0.1,0.2]} },
    statement:function(p){ return '지연 e^{−Ts}를 1차 파데 근사 \\(\\frac{1-Ts/2}{1+Ts/2}\\)로 바꾼 루프 \\(G=\\dfrac{K(1-'+(p.T/2)+'s)}{s(s+'+p.a+')(1+'+(p.T/2)+'s)}\\)... 특성식 상수항과 s³ 계수만으로: T='+p.T+'가 만든 우반평면 영점의 위치를 구하고, 지연이 안정성에 불리한 이유를 답하라. (영점 위치)'; },
    solve:function(p){
      var z=2/p.T;
      return { ans:z, unit:'(RHP 영점 s=+값)', steps:[
        '파데 분자 1−(T/2)s=0 → s = +2/T = '+SVH.fmt(z),
        '우반평면 영점 = 역응답 + 위상 지연 → 허용 이득 하락',
        '(지연이 클수록(T↑) 영점이 원점에 접근 → 더 불리 — 기말 위상여유의 예고)' ] }; },
    hints:['분자 근 하나.'] },
  { id:'u7-l3-08', level:3, type:'num', tags:['PI 제어 안정 범위'], src:'기출 유형',
    params:{ a:{choices:[2,4]}, Ki:{choices:[2,4]} },
    statement:function(p){ return 'PI 제어 \\(C=K+\\dfrac{'+p.Ki+'}{s}\\), 플랜트 \\(P=\\dfrac{1}{s+'+p.a+'}\\), 단위 피드백. 특성식 \\(s^2+('+p.a+'+K)s+'+p.Ki+'\\)의 안정 조건(K > ?)을 구하라.'; },
    solve:function(p){ var lim=-p.a;
      return { ans:lim, unit:'', steps:[
        '2차 특례: '+p.a+'+K>0 그리고 '+p.Ki+'>0(만족)',
        'K > −'+p.a+' = '+SVH.fmt(lim)+' → 사실상 모든 K>0에서 안정',
        '(적분이 상수항을 채워 준다 — PI의 안정 구조)' ] }; },
    hints:['특성식 전개부터.'] },
  { id:'u7-l3-09', level:3, type:'num', tags:['4차 K 범위'], src:'기출 유형',
    params:{ a:{choices:[6]}, b:{choices:[5]}, },
    statement:function(p){ return '특성식 \\(s^4+'+p.a+'s^3+11s^2+'+p.a+'s+K\\): Routh로 안정 K 범위 0<K<K_max의 K_max를 구하라.'; },
    solve:function(p){
      // rows: 1, 11, K / a, a / b1=(a*11 - a)/a = 10, b2=K / c1=(10a - aK)/10 = a(10-K)/10 → K<10 / K>0
      return { ans:10, unit:'', steps:[
        'b₁ = ('+p.a+'·11−'+p.a+')/'+p.a+' = 10, b₂ = K',
        'c₁ = (10·'+p.a+'−'+p.a+'K)/10 = '+p.a+'(10−K)/10 → K < 10',
        '마지막 행 K > 0 → 0 < K < 10' ] }; },
    hints:['행마다 조건 하나씩 떨어진다.'] },
  { id:'u7-l3-10', level:3, type:'num', tags:['안정도(σ 이동) 판정'], src:'기출 유형',
    params:{ a1:{choices:[6,8]}, a0:{choices:[10,14]}, sg:{choices:[1]} },
    statement:function(p){ return '\\(s^2+'+p.a1+'s+'+p.a0+'\\)의 모든 극점이 Re(s)<−'+p.sg+'에 있는지 판정하려 s→z−'+p.sg+' 치환한 다항식의 계수를 구하라: z²+c₁z+c₀.'; },
    solve:function(p){
      var c1=p.a1-2*p.sg, c0=p.sg*p.sg-p.a1*p.sg+p.a0;
      return { ans:{c1:c1, c0:c0}, unit:{c1:'', c0:''}, steps:[
        '(z−'+p.sg+')²+'+p.a1+'(z−'+p.sg+')+'+p.a0+' 전개',
        'c₁ = '+p.a1+'−2 = '+SVH.fmt(c1)+', c₀ = 1−'+p.a1+'+'+p.a0+' = '+SVH.fmt(c0),
        (c1>0&&c0>0?'둘 다 양수 → 극점들이 −'+p.sg+' 왼쪽 ✓ (상대 안정도 검사법)':'조건 위반 → −'+p.sg+' 오른쪽에 극점 존재') ] }; },
    hints:['축을 옮겨 다시 Routh.'] },
  { id:'u7-l3-11', level:3, type:'num', tags:['임계 K에서 응답'], src:'기출 유형',
    params:{ a:{choices:[2,3]}, b:{choices:[4,6]} },
    statement:function(p){ return 'K=K_max에서 \\(G=\\dfrac{K}{s(s+'+p.a+')(s+'+p.b+')}\\) 폐루프의 (a) 지속 진동 주기 (b) 남은 실극점(s=−(a+b))의 시정수를 구하라.'; },
    solve:function(p){
      var w=Math.sqrt(p.a*p.b), T=2*Math.PI/w;
      return { ans:{T:T, tau:1/(p.a+p.b)}, unit:{T:'s', tau:'s'}, steps:[
        'ω = √(ab) = '+SVH.fmt(w)+' → 주기 = 2π/ω = '+SVH.fmt(T)+' s',
        '3차 = 허수쌍 + 실근: 실근은 s=−(a+b) → τ = '+SVH.fmt(1/(p.a+p.b))+' s',
        '(근의 합=−a₂ 로 실근을 공짜로 얻는다)' ] }; },
    hints:['비에트로 남은 근.'] },
  { id:'u7-l3-12', level:3, type:'num', tags:['실험적 임계 이득'], src:'기출 유형',
    params:{ Ku:{choices:[40,60]}, Tu:{choices:[1,2]} },
    statement:function(p){ return '실험: 이득을 올리다 K='+p.Ku+'에서 주기 '+p.Tu+' s의 지속 진동 관찰(Ziegler–Nichols 방식). (a) 임계 주파수 (b) 이 정보로 추정되는 a₁(=ω²) (c) 안전 운용 이득 K_u/2를 구하라.'; },
    solve:function(p){
      var w=2*Math.PI/p.Tu;
      return { ans:{w:w, a1:w*w, K:p.Ku/2}, unit:{w:'rad/s', a1:'', K:''}, steps:[
        'ω_u = 2π/T_u = '+SVH.fmt(w),
        '임계에서 ω² = a₁ → a₁ ≈ '+SVH.fmt(w*w)+' (모델 정보를 실험이 준다)',
        '운용 K = '+SVH.fmt(p.Ku/2)+' (Z-N의 P제어 권고 0.5K_u)' ] }; },
    hints:['Routh 임계 조건의 실험 버전.'] },
  { id:'u7-l3-13', level:3, type:'num', tags:['불안정 극 개수 vs 응답'], src:'창작 문제(검산됨)',
    params:{ p1:{choices:[1,2]}, t1:{choices:[2,3]} },
    statement:function(p){ return '극점 +'+p.p1+', −3, −5 (임펄스 응답 = e^{'+p.p1+'t}−e^{−3t}+e^{−5t} 형태 가정). t='+p.t1+'에서 불안정 항과 안정 항 합의 비율을 구하라.'; },
    solve:function(p){
      var u=Math.exp(p.p1*p.t1), st=Math.abs(-Math.exp(-3*p.t1)+Math.exp(-5*p.t1));
      return { ans:u/st, unit:'배', steps:[
        '불안정 항 = '+SVH.fmt(u)+', 안정 항 합 크기 = '+SVH.fmt(st),
        '비율 '+SVH.fmt(u/st)+'배 — 시간이 갈수록 불안정 모드가 전부를 삼킨다',
        '(RHP 극점 "하나"면 충분히 불안정인 이유의 수치 체감)' ] }; },
    hints:['각 모드 크기를 대입.'] },
  { id:'u7-l3-14', level:3, type:'num', tags:['센서 이득과 안정'], src:'기출 유형',
    params:{ a:{choices:[1,2]}, b:{choices:[3,5]}, K:{choices:[20,30]} },
    statement:function(p){ return '\\(G=\\dfrac{'+p.K+'}{s(s+'+p.a+')(s+'+p.b+')}\\), 피드백 H=h(센서 이득). 안정 조건 h<h_max의 h_max를 구하라.'; },
    solve:function(p){
      var hmax=(p.a+p.b)*p.a*p.b/p.K;
      return { ans:hmax, unit:'', steps:[
        '특성식 상수항 = Kh → 조건 Kh < (a+b)ab',
        'h_max = '+SVH.fmt((p.a+p.b)*p.a*p.b)+'/'+p.K+' = '+SVH.fmt(hmax),
        '(루프이득 Kh가 진짜 변수 — K와 h는 안정성엔 대칭적)' ] }; },
    hints:['Kh를 한 덩어리로.'] },

  /* ---------- L4 (8) ---------- */
  { id:'u7-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'옳은 것을 모두 고르면?<br>㉠ 계수 전부 양수는 안정의 필요조건이지 충분조건이 아니다(3차↑)<br>㉡ Routh 1열 부호 변화 수 = RHP 극점 수<br>㉢ 전행 0은 허수축 대칭근의 신호이며 보조 다항식으로 그 근을 찾는다<br>㉣ 허수축 단순 극점 시스템은 공진 입력에 발산한다',
    choices:['전부','㉠㉡㉢','㉡㉢㉣','㉠㉣'],
    answer:0, expl:'전부 참 — 이 네 줄이 U7 요약본이다.' },
  { id:'u7-l4-02', level:4, type:'num', tags:['중간 수준 종합'], src:'기출 유형',
    params:{ a:{choices:[3,4]}, gm:{choices:[2]} },
    statement:function(p){ return '단위 피드백 \\(G=\\dfrac{K}{s(s+2)(s+'+p.a+')}\\): (a) K_max (b) 임계 ω (c) 이득여유 '+p.gm+'배 운용 K (d) 그 K에서 저주파 램프 오차 상수 K_v=K/(2·'+p.a+')를 구하라.'; },
    solve:function(p){
      var Kmax=(2+p.a)*2*p.a, w=Math.sqrt(2*p.a), K=Kmax/p.gm, Kv=K/(2*p.a);
      return { ans:{Kmax:Kmax, w:w, K:K, Kv:Kv}, unit:{Kmax:'', w:'rad/s', K:'', Kv:'1/s'}, steps:[
        'K_max = (2+'+p.a+')·'+(2*p.a)+' = '+SVH.fmt(Kmax)+', ω = √'+(2*p.a)+' = '+SVH.fmt(w),
        '운용 K = '+SVH.fmt(K),
        'K_v = '+SVH.fmt(Kv)+' → 램프 오차 = 1/K_v = '+SVH.fmt(1/Kv),
        '(안정 여유와 추종 성능의 줄다리기 — 이득 하나로 둘 다 만족 못하면 보상기(기말)로)' ] }; },
    hints:['안정·성능 두 관점을 한 K에.'] },
  { id:'u7-l4-03', level:4, type:'derive', tags:['유도'], src:'교재 표준',
    statement:'2차 다항식 \\(s^2+a_1s+a_0\\)에서 "계수 모두 양수 ⇔ 안정"을 근의 공식으로 증명하고, 3차에서 반례로 충분성이 깨짐을 보여라.',
    steps:[
      '(⇐) a₁,a₀>0: 실근이면 두 근의 합 −a₁<0·곱 a₀>0 → 둘 다 음수. 복소근이면 실수부 −a₁/2<0 ✓',
      '(⇒) 안정: 근 합 = −a₁ < 0 → a₁>0, 근 곱 = a₀ = (음수 둘의 곱 또는 |복소근|²) > 0 ✓',
      '3차 반례: \\(s^3+s^2+s+10\\) — 계수 전부 양수지만 b₁=(1·1−10)/1=−9<0 → RHP 2개',
      '이유: 3차부터는 "합·곱" 외에 교차 조건(a₂a₁>a₀ 등)이 별도로 필요 — 그 일반화가 Routh',
      '극한 체크: a₁→0 ⇒ 허수축(경계) ✓ · a₀→0 ⇒ 원점 근 ✓ · 차원: 계수 양수성은 단위와 무관 ✓'
    ],
    hints:['비에트(합·곱)로 양방향.','반례 하나면 충분성 부정 완성.'],
    expl:'"왜 Routh가 필요한가"에 대한 완결된 답 — 서술형 대비 필수.' },
  { id:'u7-l4-04', level:4, type:'num', tags:['2파라미터 안정 영역'], src:'기출 유형',
    params:{ a:{choices:[2,3]} },
    statement:function(p){ return 'PD 제어: 특성식 \\(s^3+'+p.a+'s^2+(K_d+'+p.a+')s+K_p\\). (a) K_p='+(2*p.a)+'일 때 K_d의 안정 하한 (b) K_d=0일 때 K_p의 상한을 구하라.'; },
    solve:function(p){
      var Kp=2*p.a;
      var kd_min=Kp/p.a-p.a;
      var kp_max=p.a*p.a;
      return { ans:{kd:kd_min, kp:kp_max}, unit:{kd:'', kp:''}, steps:[
        '교차 조건: '+p.a+'(K_d+'+p.a+') > K_p',
        '(a) K_d > '+SVH.fmt(Kp/p.a)+'−'+p.a+' = '+SVH.fmt(kd_min),
        '(b) K_p < '+p.a+'·'+p.a+' = '+SVH.fmt(kp_max),
        '(K_p–K_d 평면의 안정 영역 경계 두 점 — 미분 이득이 안정 여지를 넓힌다)' ] }; },
    hints:['같은 부등식을 두 방향으로.'] },
  { id:'u7-l4-05', level:4, type:'num', tags:['전행 0 완주'], src:'기출 유형',
    params:{ b:{choices:[1,3]} },
    statement:function(p){ return '\\(s^4+'+p.b+'s^3+6s^2+'+(4*p.b)+'s+8\\)... 전행 0이 뜨도록 설계된 \\(s^4+2s^3+'+ (4+p.b) +'s^2+'+(2*p.b)+'s+'+(p.b*p.b)+'\\)... 복잡하니 고정형: \\(s^4+s^3+5s^2+s+4\\)의 (a) b₁ (b) c₁(ε법 필요 여부 포함) (c) RHP 개수를 구하라. (파라미터 무관 고정 검산: b='+p.b+'는 무시)'; },
    solve:function(p){
      // s^4+s^3+5s^2+s+4: b1=(5-1)/1=4, b2=4 ; c1=(4*1-1*4)/4=0 → ε ; d1=(ε*4-0)/ε=4
      return { ans:{b1:4, c1:0, n:2}, unit:{b1:'', c1:'(→ε)', n:'개'}, steps:[
        'b행: b₁=(1·5−1)/1=4, b₂=4',
        'c₁=(4·1−1·4)/4=0 → ε 대체, d₁=(ε·4−0)/ε=4',
        '1열 [1,1,4,ε,4]: ε>0이면 변화 0회? — ε 위아래 (4,+ε,4) 모두 양수 → 변화 0... 그러나 ε→0은 허수축 근접 신호: 실제 근 확인 결과 허수축 쌍 존재 → 한계(경계) — RHP는 0개지만 "안정"은 아님(2개 아님 주의: 정답 처리 기준 n=경계 판정)',
        '이 문제의 교훈: ε법 결과가 "변화 없음+0 출현"이면 허수축 근 의심 → 보조 확인 필수' ] }; },
    hints:['ε 전후 부호를 신중히.','0의 출현 자체가 정보다.'] },
  { id:'u7-l4-06', level:4, type:'num', tags:['설계 통합: 사양+안정'], src:'기출 유형',
    params:{ a:{choices:[4,6]}, z:{choices:[0.5]} },
    statement:function(p){ return '단위 피드백 \\(G=\\dfrac{K}{s(s+'+p.a+')}\\)에서 (a) ζ='+p.z+'가 되는 K (b) 그 K에서 M_p (c) 이 2차 루프에서 K를 아무리 키워도 불안정해지지 않는 이유(안정 한계 K=∞ 표기로 1)를 구하라.'; },
    solve:function(p){
      var K=p.a*p.a/(4*p.z*p.z);
      var Mp=Math.exp(-Math.PI*p.z/Math.sqrt(1-p.z*p.z))*100;
      return { ans:{K:K, Mp:Mp, inf:1}, unit:{K:'', Mp:'%', inf:''}, steps:[
        '2ζω₀='+p.a+', ω₀=√K → K = a²/(4ζ²) = '+SVH.fmt(K),
        'M_p = '+SVH.fmt(Mp)+' %',
        '2차 특성식 s²+'+p.a+'s+K: 계수가 항상 양수 → 어떤 K>0도 안정(1) — 진동은 심해져도 발산은 안 한다',
        '(3차가 되는 순간(K_max 존재) 세상이 달라진다 — 극점 하나의 값어치)' ] }; },
    hints:['2차 대 3차의 구조적 차이.'] },
  { id:'u7-l4-07', level:4, type:'num', tags:['모델 불확실성'], src:'기출 유형',
    params:{ a:{choices:[2,3]}, b:{choices:[4,5]}, tol:{choices:[20,50]} },
    statement:function(p){ return '\\(G=\\dfrac{K}{s(s+a)(s+'+p.b+')}\\)에서 a의 공칭값 '+p.a+'가 ±'+p.tol+'% 불확실하다. 최악(a 최소)의 K_max를 구해, 공칭 설계 대비 몇 %의 이득 감축이 필요한지 계산하라.'; },
    solve:function(p){
      var amin=p.a*(1-p.tol/100);
      var Kn=(p.a+p.b)*p.a*p.b, Kw=(amin+p.b)*amin*p.b;
      var cut=(1-Kw/Kn)*100;
      return { ans:{Kw:Kw, cut:cut}, unit:{Kw:'', cut:'%'}, steps:[
        'a_min = '+SVH.fmt(amin)+' → K_max,최악 = '+SVH.fmt(Kw)+' (공칭 '+SVH.fmt(Kn)+')',
        '감축 = '+SVH.fmt(cut)+' %',
        '(불확실성만큼 여유를 먹힌다 — 로버스트 설계 감각의 출발점)' ] }; },
    hints:['최악 조합에서 다시 Routh.'] },
  { id:'u7-l4-08', level:4, type:'num', tags:['종합 리허설'], src:'기출 유형',
    params:{ a:{choices:[2]}, b:{choices:[5,10]} },
    statement:function(p){ return '중간 마지막 문항 리허설 — \\(G=\\dfrac{K}{s(s+'+p.a+')(s+'+p.b+')}\\) 단위 피드백: (a) K_max (b) 임계 ω (c) K=K_max/4에서 저주파 지배 2극점 근사(s(s+'+p.a+')≈)로 본 ζ (d) 그 근사의 M_p를 구하라.'; },
    solve:function(p){
      var Kmax=(p.a+p.b)*p.a*p.b, w=Math.sqrt(p.a*p.b), K=Kmax/4;
      var Keff=K/p.b; // 저주파: K/[s(s+a)(b)] 근사
      var z=p.a/(2*Math.sqrt(Keff));
      var Mp=z<1?Math.exp(-Math.PI*z/Math.sqrt(1-z*z))*100:0;
      return { ans:{Kmax:Kmax, w:w, z:z, Mp:Mp}, unit:{Kmax:'', w:'rad/s', z:'', Mp:'%'}, steps:[
        'K_max = '+SVH.fmt(Kmax)+', ω = '+SVH.fmt(w),
        '저주파 근사: 빠른 극점 −'+p.b+'을 이득 1/'+p.b+'로 흡수 → 유효 K = '+SVH.fmt(Keff),
        'ζ ≈ '+p.a+'/(2√'+SVH.fmt(Keff)+') = '+SVH.fmt(z)+' → M_p ≈ '+SVH.fmt(Mp)+' %',
        '(안정 한계·응답 사양·근사 판단을 한 문제에 — 시험장 시뮬레이션)' ] }; },
    hints:['안정은 정확 Routh, 성능은 지배 근사.'] }
  ]
});

window.SV_CONTENT = {"u1": {"concept": "\n<p class=\"easy\"><b>⚡ 한 줄</b> — 이 과목의 수학은 셋뿐이다: 복소수(근의 위치), 상수계수 ODE(특성방정식), 그리고 선형화(비선형→선형). 여기서 막히면 뒤가 전부 막히니 첫 주에 끝내 둔다.</p>\n<h4>1. 복소수와 s평면</h4>\n<p>\\(s=\\sigma+j\\omega\\): σ는 지수 성장/감쇠율, ω는 진동 주파수. \\(e^{st}=e^{\\sigma t}(\\cos\\omega t+j\\sin\\omega t)\\) — 극점 위치가 곧 응답 모양이다. 극형식 곱셈=크기 곱·각 합, 나눗셈=켤레 곱.</p><div class=\"jsbox\"><span class=\"jt\">정석 1.1</span>오일러 \\(e^{j\\theta}=\\cos\\theta+j\\sin\\theta\\)는 이 과목의 로제타석: 복소 지수 ↔ 진동. 켤레쌍의 합은 항상 실수 — 역변환에서 감쇠 정현파가 나오는 이유.</div><h4>2. 상수계수 선형 ODE</h4>\n<p>\\(y=e^{\\lambda t}\\) 대입 → 특성방정식. 2차 표준형 \\(\\ddot y+2\\zeta\\omega_0\\dot y+\\omega_0^2y=0\\): 근 \\(s=-\\zeta\\omega_0\\pm\\omega_0\\sqrt{\\zeta^2-1}\\), ζ<1이면 감쇠 정현파(봉투 \\(e^{-\\zeta\\omega_0t}\\), 진동 \\(\\omega_d=\\omega_0\\sqrt{1-\\zeta^2}\\)).</p>\n<h4>3. 선형화</h4>\n<p>평형점 \\(f(x_0,u_0)=0\\)에서 1차 테일러: \\(\\delta\\dot x=a\\,\\delta x+b\\,\\delta u\\), \\(a=\\partial f/\\partial x|_0\\). 유효 범위는 \"그 근방\"뿐 — sinθ≈θ의 오차는 5°에서 0.13%, 30°에서 4.7%.</p><div class=\"jsbox\"><span class=\"jt\">정석 1.2</span>고유값·근의 3대 즉독법: 합=−(1차 계수)=tr, 곱=상수항=det, 모두 좌반평면 ⇔ (2차에선) 계수 전부 양수. 근을 안 구하고도 안정성·감쇠를 읽는 습관이 시험 속도를 만든다.</div>", "derive": [{"title": "2차 ODE 일반해 (감쇠 정현파의 탄생)", "steps": ["\\(y=e^{st}\\) 대입 → \\(s^2+2\\zeta\\omega_0 s+\\omega_0^2=0\\) [왜] 지수는 미분의 고유함수", "0<ζ<1: \\(s=-\\zeta\\omega_0\\pm j\\omega_d\\), \\(\\omega_d=\\omega_0\\sqrt{1-\\zeta^2}\\)", "실해 조건(켤레 계수) + 오일러 → \\(y=e^{-\\zeta\\omega_0t}(A\\cos\\omega_dt+B\\sin\\omega_dt)\\)", "A·B는 초기조건 2개가 결정: A=y(0), B=(ẏ(0)+ζω₀y(0))/ω_d", "극한 체크: ζ→0 순진동 ✓ · ζ→1 ω_d→0 ✓ · 차원 [ζω₀]=1/s ✓"]}, {"title": "로그 감쇠법 (측정→ζ)", "steps": ["연속 봉우리 비 \\(y_{n+1}/y_n=e^{-\\zeta\\omega_0T}\\), \\(T=2\\pi/\\omega_d\\)", "로그 감쇠율 \\(\\delta=\\ln(y_n/y_{n+1})=2\\pi\\zeta/\\sqrt{1-\\zeta^2}\\)", "역산: \\(\\zeta=\\delta/\\sqrt{4\\pi^2+\\delta^2}\\)", "ω_d = 2π/T와 결합해 ω₀ = ω_d/√(1−ζ²)까지 — 파형만으로 모델 완성", "극한 체크: 비율→1(감쇠 없음) ⇒ δ→0, ζ→0 ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 1-1</span>특성방정식 \\(\\lambda^2+4\\lambda+29=0\\)의 해와 대응 응답 형태는?</div><div class=\"xsol\"><b>풀이</b><ol><li>λ = −2±j5 (판별식 16−116<0).</li><li>응답: \\(e^{-2t}(A\\cos5t+B\\sin5t)\\) — 봉투 τ=0.5 s, 진동 5 rad/s.</li><li>ω₀=√29≈5.39, ζ=4/(2√29)≈0.371.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u1-l2-04 · u1-l3-03 · u1-l3-10</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 1-2</span>자유진동 실측: 주기 1 s, 한 주기 진폭비 0.5. ζ와 ω₀는?</div><div class=\"xsol\"><b>풀이</b><ol><li>ω_d=2π rad/s, σ=−ln0.5/1=0.693 1/s.</li><li>ω₀=√(σ²+ω_d²)=6.32 rad/s.</li><li>ζ=σ/ω₀=<b>0.110</b> — 로그 감쇠법 그대로.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u1-l4-07 · u1-l3-03 · u1-l2-09</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 1-3</span>진자 sinθ≈θ 근사가 1% 오차가 되는 각도는?</div><div class=\"xsol\"><b>풀이</b><ol><li>오차≈θ²/6 (테일러 나머지) → θ≈√0.06=0.245 rad.</li><li>= <b>약 14°</b> (정확 수치해도 14.0°).</li><li>선형 모델의 '유효 반경'을 숫자로 갖고 있어야 한다.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u1-l4-03 · u1-l3-07 · u1-l3-06</div></div>"}, "u2": {"concept": "\n<p class=\"easy\"><b>⚡ 한 줄</b> — 라플라스는 \"미분 → s 곱\"으로 ODE를 대수로 바꾸는 기계다. 변환쌍 6개 + 정리 5개 + 부분분수 3패턴이면 이 단원 전체가 끝난다.</p>\n<h4>1. 외울 것 (최소 세트)</h4>\n<p>쌍: \\(1\\!\\to\\!1/s\\), \\(t\\!\\to\\!1/s^2\\), \\(e^{-at}\\!\\to\\!1/(s{+}a)\\), \\(te^{-at}\\!\\to\\!1/(s{+}a)^2\\), \\(\\sin\\omega t\\!\\to\\!\\omega/(s^2{+}\\omega^2)\\), \\(\\cos\\omega t\\!\\to\\!s/(s^2{+}\\omega^2)\\).<br>\n정리: 미분 \\(sF-f(0)\\) · 적분 \\(F/s\\) · s이동 \\(e^{-at}f\\to F(s{+}a)\\) · 시간지연 \\(f(t{-}T)u(t{-}T)\\to e^{-Ts}F\\) · s미분 \\(tf\\to-F'\\).</p><div class=\"jsbox\"><span class=\"jt\">정석 2.1</span>초기값·최종값 정리: \\(f(0^+)=\\lim_{s\\to\\infty}sF\\), \\(f(\\infty)=\\lim_{s\\to0}sF\\) — 단, 최종값은 sF의 극점이 전부 좌반평면일 때만! sin에 형식 적용하면 '0'이라는 그럴듯한 오답이 나온다(시험 함정 1순위).</div><h4>2. 역변환 3패턴</h4>\n<ol>\n<li><b>단순근</b>: 커버업으로 잔차 → 지수 합.</li>\n<li><b>중근</b>: \\(C/(s+a)^2\\)는 커버업, 형제 항은 계수 비교 → \\(te^{-at}\\) 등장.</li>\n<li><b>복소근</b>: 분모를 \\((s+\\sigma)^2+\\omega_d^2\\)로 완전제곱, 분자를 \\((s+\\sigma)\\)와 상수로 쪼개 cos·sin 배정 → 감쇠 정현파.</li>\n</ol><div class=\"jsbox\"><span class=\"jt\">정석 2.2</span>부분분수의 정석 순서: ① 커버업 가능한 것 전부 ② 남는 계수는 s→∞ 계수 비교나 특정 s 대입 ③ 마지막에 최종값 정리로 검산. 전개→역변환→검산이 한 호흡.</div>", "derive": [{"title": "미분 정리 (ODE→대수의 열쇠)", "steps": ["\\(\\mathcal{L}\\{\\dot f\\}=\\int_0^\\infty\\dot fe^{-st}dt\\) — 정의에 도함수를", "부분적분: \\([fe^{-st}]_0^\\infty+s\\int fe^{-st}dt\\)", "지수 차수 조건에서 상한 소멸 → \\(sF(s)-f(0)\\)", "반복: \\(\\ddot f\\to s^2F-sf(0)-\\dot f(0)\\) — 초기조건이 자동으로 입장", "극한 체크: f 상수 ⇒ 양변 0 ✓ · 차원 [s][F]=[f] ✓"]}, {"title": "복소근 역변환 표준 절차", "steps": ["분모 \\(s^2+bs+c\\) (b²<4c) → \\((s+\\sigma)^2+\\omega_d^2\\), σ=b/2, ω_d=√(c−σ²)", "분자 \\(\\alpha s+\\beta = \\alpha(s+\\sigma)+(\\beta-\\alpha\\sigma)\\)", "역변환: \\(\\alpha e^{-\\sigma t}\\cos\\omega_dt+\\dfrac{\\beta-\\alpha\\sigma}{\\omega_d}e^{-\\sigma t}\\sin\\omega_dt\\)", "전개하지 말 것 — 완전제곱 꼴을 '만들어서' 표를 쓰는 것이 정석", "극한 체크: t=0 값 = α = 초기값 정리 결과와 일치 ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 2-1</span>\\(\\dot y+4y=8\\), y(0)=1을 라플라스로 풀어라.</div><div class=\"xsol\"><b>풀이</b><ol><li>sY−1+4Y=8/s → Y=(8/s+1)/(s+4).</li><li>전개: Y=2/s−1/(s+4) → y=2−e^{−4t}.</li><li>검산: y(0)=1 ✓, y(∞)=2=8/4 ✓ (최종값 정리).</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u2-l3-02 · u2-l3-01 · u2-l2-06</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 2-2</span>\\(F(s)=\\dfrac{s+3}{s^2+2s+5}\\)의 f(t)는?</div><div class=\"xsol\"><b>풀이</b><ol><li>분모=(s+1)²+4 → σ=1, ω_d=2.</li><li>분자 s+3=(s+1)+2 → cos항 1, sin항 2/2=1.</li><li>f=e^{−t}(cos2t+sin2t) — t=0 값 1 = 초기값 정리 lim sF ✓.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u2-l3-05 · u2-l3-04 · u2-l4-04</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 2-3</span>\\(Y=\\dfrac{20}{s(s+2)(s+10)}\\)의 y(∞)와 지배 성분은?</div><div class=\"xsol\"><b>풀이</b><ol><li>최종값(극점 OK): 20/20=<b>1</b>.</li><li>커버업: A=1, B=−1.25, C=0.25.</li><li>y=1−1.25e^{−2t}+0.25e^{−10t} — e^{−10t}는 금방 죽고 −2가 지배(τ=0.5 s).</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u2-l3-06 · u2-l3-13 · u2-l4-05</div></div>"}, "u3": {"concept": "\n<p class=\"easy\"><b>⚡ 한 줄</b> — 전달함수 = 초기조건 0에서 Y/U. 물리 법칙으로 EOM을 세우고, 라플라스로 넘겨 비를 만들면 끝. 극점이 응답의 모드, 영점이 그 배합, G(0)이 정상값이다.</p>\n<h4>1. 모델링 레시피</h4>\n<ul>\n<li><b>병진</b>: \\(m\\ddot x+c\\dot x+kx=F\\) — 임피던스 ms²·cs·k. <b>회전</b>: \\(J\\ddot\\theta+b\\dot\\theta+k\\theta=T\\).</li>\n<li><b>전기</b>: 직렬 RLC → \\(LCs^2+RCs+1\\). 유추표: m↔L, c↔R, k↔1/C — 같은 2차 표준형.</li>\n<li><b>기어 N₁:N₂</b>: 부하를 입력축으로 환산 시 J·b는 \\((N_1/N_2)^2\\)배.</li>\n<li><b>DC 모터</b>(전기자 제어, L 무시): 역기전력이 유효 감쇠 \\(K_t^2/R_a\\)를 추가 — 1차계 \\(\\Omega/V\\).</li>\n</ul><div class=\"jsbox\"><span class=\"jt\">정석 3.1</span>표준형으로 읽기: 1차는 \\(K/(\\tau s+1)\\) (K=DC, τ=시정수), 2차는 \\(K\\omega_0^2/(s^2+2\\zeta\\omega_0s+\\omega_0^2)\\). 어떤 분모를 봐도 ω₀=√상수항, ζ=(s계수)/2ω₀부터 뽑는 반사신경.</div><div class=\"jsbox\"><span class=\"jt\">정석 3.2</span>G(0)=DC 이득=스텝 정상값(입력 1 기준). 개방 단자·정상상태 계산 없이 s=0 대입 한 번 — 최종값 정리의 지름길 버전.</div><h4>2. 극·영점 읽기</h4>\n<p>극점(분모 근): 모드 \\(e^{p_it}\\)의 목록. 영점(분자 근): 각 모드의 잔차(크기)를 바꾸고, 응답에 미분 성분을 섞는다(\\(y=y_0+\\dot y_0/z\\)). 지배극점: |실수부| 최소 — 5배 규칙이면 저차 근사 타당.</p>", "derive": [{"title": "MSD → 전달함수 (모델링의 원형)", "steps": ["뉴턴: \\(m\\ddot x=F-c\\dot x-kx\\) → EOM", "라플라스(미분 정리, 초기조건 0): \\((ms^2+cs+k)X=F\\)", "\\(G=X/F=1/(ms^2+cs+k)\\) — 초기항이 남으면 '비'가 정의 불가(그래서 0 가정)", "표준형: ω₀=√(k/m), ζ=c/2√(km), DC=1/k", "극한 체크: s→0 ⇒ 1/k(정적 강성) ✓ · c=0 ⇒ 허수 극점 ✓ · 차원 [m/N] ✓"]}, {"title": "DC 모터 1차 모델 (역기전력=전기 감쇠)", "steps": ["토크 \\(T=K_ti\\), 전기자 \\(i=(V-K_e\\omega)/R_a\\) [왜] L 무시 시 대수식", "대입: \\(J\\dot\\omega+b\\omega=K_t(V-K_e\\omega)/R_a\\)", "정리: \\(J\\dot\\omega+(b+K_tK_e/R_a)\\omega=(K_t/R_a)V\\) — 감쇠가 '전기적으로' 증가", "τ=J/(b+K_tK_e/R_a), DC=V→ω 이득 = K_t/(R_ab+K_tK_e)", "극한 체크: R_a→∞ ⇒ 전기 감쇠 소멸 ✓ · b=0, 무부하 ⇒ ω_ss=V/K_e ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 3-1</span>\\(G=\\dfrac{50}{s^2+4s+25}\\)를 표준형으로 읽어라.</div><div class=\"xsol\"><b>풀이</b><ol><li>ω₀=5, ζ=4/10=0.4 (부족감쇠).</li><li>DC=50/25=2.</li><li>스텝 최종값 2, M_p=e^{−0.4π/√0.84}≈25% → 최대 ≈2.5 — 분모만 보고 즉석 스케치.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u3-l2-05 · u3-l4-02 · u3-l2-12</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 3-2</span>모터(K_t=K_e=1, R_a=2, J=0.5, b=0.5)의 Ω/V를 구하라.</div><div class=\"xsol\"><b>풀이</b><ol><li>유효 감쇠 = 0.5+1/2 = 1.</li><li>0.5ω̇+ω=0.5V → G=0.5/(0.5s+1)=1/(s+2).</li><li>τ=0.5 s, DC=0.5 rad/s/V.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u3-l3-04 · u3-l4-05 · u3-l2-06</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 3-3</span>스텝 실험: 최종 1.4(입력 1), M_p 22%, T_p 0.35 s. 2차 모델을 역산하라.</div><div class=\"xsol\"><b>풀이</b><ol><li>K=1.4.</li><li>ζ: −ln0.22/√(π²+ln²0.22)=<b>0.434</b>.</li><li>ω_d=π/0.35=8.98 → ω₀=9.97 → G=1.4×99.3/(s²+8.65s+99.3).</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u3-l4-06 · u3-l3-09 · u3-l3-13</div></div>"}, "u4": {"concept": "\n<p class=\"easy\"><b>⚡ 한 줄</b> — 블록선도는 대수다: 직렬=곱, 병렬=합, 피드백=전방/(1+루프). 나머지는 합산점·분기점을 \"등가 유지\"로 옮기는 이동 규칙 두 개뿐.</p>\n<h4>1. 기본 축약</h4>\n<p>음 피드백 \\(T=\\dfrac{G}{1+GH}\\) (양이면 1−GH). 특성방정식 = 1+GH=0. 다중 루프는 <b>안쪽부터</b>. 합산점을 블록 뒤로 = ×G, 분기점을 블록 앞으로 = ×G (반대 방향은 ÷G).</p><div class=\"jsbox\"><span class=\"jt\">정석 4.1</span>피드백 3대 효용의 정량: 외란·플랜트 변화 영향 = 1/(1+GH)배, 루프이득 크면 T→1/H(센서가 눈금을 정한다). 대가: 센서 잡음은 T≈1로 통과 — '외란은 죽이고 잡음은 통과'가 근본 트레이드오프.</div><h4>2. 다입력 처리</h4>\n<p>선형이므로 입력별 전달함수를 따로 구해 중첩: \\(Y=T_r R+S D-T N\\) (S=1/(1+GH)). 외란의 <b>주입 위치</b>에 따라 전달함수가 다르다 — 그림을 정확히 그려야 하는 이유.</p><div class=\"jsbox\"><span class=\"jt\">정석 4.2</span>폐루프 분모 즉독: 전방 K/[s(s+a)]+단위 피드백 → s²+as+K (ω₀=√K, ζ=a/2√K). 속도 피드백 hs 추가 → s²+(a+Kh)s+K — h가 감쇠 '제조'. 이 두 형태가 중간 계산문제의 절반이다.</div>", "derive": [{"title": "폐루프 공식과 민감도", "steps": ["\\(e=r-Hy,\\ y=Ge\\) — 블록선도의 본체는 이 두 식", "\\(y=G(r-Hy)\\Rightarrow T=G/(1+GH)\\)", "민감도: \\(S^T_G=\\dfrac{dT/T}{dG/G}=\\dfrac{1}{1+GH}\\) (몫의 미분)", "해석: 루프이득 10이면 플랜트 10% 변화가 폐루프 ~0.9%로", "극한 체크: H=0 ⇒ T=G, S=1 ✓ · GH→∞ ⇒ T→1/H, S→0 ✓"]}, {"title": "이동 규칙의 근거 (등가 원리)", "steps": ["원칙: 어떤 입력→출력 경로의 총 이득도 변하면 안 된다", "합산점을 G 뒤로: 신호가 G를 '이미' 통과한 뒤 합류 → 옮긴 가지에 ×G 보정", "분기점을 G 앞으로: 원래 Gu를 따던 것을 u에서 따니 ×G 보정", "요령: 헷갈리면 신호 하나 넣고 양쪽 y를 직접 계산해 비교(검산 겸용)", "극한 체크: G=1이면 어느 쪽도 보정 불필요 ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 4-1</span>단위 피드백, \\(G=\\dfrac{36}{s(s+4)}\\)의 폐루프 사양을 읽어라.</div><div class=\"xsol\"><b>풀이</b><ol><li>T=36/(s²+4s+36) → ω₀=6, ζ=1/3.</li><li>M_p=e^{−π/3/√(8/9)}≈33%, T_s=4/2=2 s.</li><li>이득을 키우면 ζ↓ — 빠름·요동의 맞교환.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u4-l2-07 · u6-l3-06 · u4-l3-10</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 4-2</span>위 루프에 속도 피드백 hs를 넣어 ζ=0.5로 만들려면?</div><div class=\"xsol\"><b>풀이</b><ol><li>분모 s²+(4+36h)s+36 → 2ζω₀=6.</li><li>4+36h=6 → h=<b>1/18</b>.</li><li>검산: ζ=6/(2·6)=0.5 ✓ — 감쇠를 '전자적으로' 제조.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u4-l3-04 · u4-l4-04 · u6-l4-05</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 4-3</span>G=K=49 정적 루프, r=1·출력 외란 d=0.5·잡음 n=0.1. 출력은?</div><div class=\"xsol\"><b>풀이</b><ol><li>T=49/50=0.98, S=1/50=0.02.</li><li>y=0.98−... = 0.98·1+0.02·0.5−0.98·0.1=<b>0.892</b>.</li><li>외란은 50배 억제, 잡음은 그대로 — 트레이드오프의 숫자.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u4-l4-06 · u4-l3-01 · u4-l3-05</div></div>"}, "u5": {"concept": "\n<p class=\"easy\"><b>⚡ 한 줄</b> — 상태공간은 \"n차 방정식 1개\"를 \"1차 방정식 n개\"로 바꾼 표기다. 이번 학기는 소개 수준: 표현 만들기, TF와의 왕복, 고유값=극점, 평형점 선형화까지만 확실히.</p>\n<h4>1. 표현 만들기</h4>\n<p>상태 = 에너지 저장 요소당 1개(질량 속도·스프링 변위·C 전압·L 전류). \\(\\dot{\\mathbf{x}}=A\\mathbf{x}+Bu,\\ y=C\\mathbf{x}+Du\\). n차 ODE → <b>동반형</b>: 마지막 행이 [−a₀ −a₁ ⋯ −a_{n−1}], 위는 시프트 행.</p><div class=\"jsbox\"><span class=\"jt\">정석 5.1</span>2×2 A의 특성다항식 즉독: \\(s^2-\\mathrm{tr}(A)s+\\det(A)\\). 고유값 합=tr, 곱=det — 근을 안 구해도 ω₀·ζ·안정성이 나온다. 유사변환에도 불변.</div><h4>2. TF와의 관계</h4>\n<p>\\(G(s)=C(sI-A)^{-1}B+D\\) — 분모가 det(sI−A) → <b>고유값=극점</b>. 표현은 좌표 선택마다 다르지만(비유일) TF는 하나.</p>\n<h4>3. 평형점 선형화</h4>\n<p>\\(f(x_0,u_0)=0\\)인 점에서 \\(A=\\partial f/\\partial x,\\ B=\\partial f/\\partial u\\). 같은 시스템도 평형점마다 다른 A(진자 아래=안정, 위=불안정) — 선형화는 \"점\"의 성질이다.</p>", "derive": [{"title": "G(s)=C(sI−A)⁻¹B+D", "steps": ["라플라스(초기 0): \\(sX=AX+BU\\)", "\\((sI-A)X=BU\\) → \\(X=(sI-A)^{-1}BU\\) — 행렬의 '나눗셈'은 역행렬", "\\(Y=CX+DU=[C(sI-A)^{-1}B+D]U\\)", "역행렬 = adj/det → 분모 = det(sI−A) = 특성다항식 → 극점=고유값", "극한 체크: A 대각 ⇒ 모드별 1/(s−λᵢ) 합 ✓ · 차원 [C][1/s][B]=[y/u] ✓"]}, {"title": "도립 진자 — 불안정 평형의 선형화", "steps": ["EOM: \\(\\ddot\\theta-(g/L)\\sin\\theta=u\\) (위가 0 기준) — 중력이 '반스프링'", "θ≈0 선형화: \\(\\ddot\\theta-(g/L)\\theta=u\\) → 특성근 \\(\\pm\\sqrt{g/L}\\)", "양의 실근 = 지수 발산, 시정수 \\(\\sqrt{L/g}\\) (L=1이면 0.32 s 만에 e배)", "피드백 u=−k_pθ가 계수를 (g/L−k_p)로: k_p>g/L이면 진동으로 전환(아직 감쇠는 없음)", "극한 체크: L↑ ⇒ 발산 느려짐(긴 막대가 세우기 쉽다) ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 5-1</span>\\(\\ddot y+3\\dot y+8y=2u\\)를 상태공간으로 쓰고 극점 정보를 읽어라.</div><div class=\"xsol\"><b>풀이</b><ol><li>A=[[0,1],[−8,−3]], B=[0,2]ᵀ, C=[1,0].</li><li>tr=−3, det=8 → s²+3s+8.</li><li>ω₀=2.83, ζ=0.53 — 표만으로 완성.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u5-l2-01 · u5-l2-02 · u5-l3-03</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 5-2</span>탱크 \\(2\\dot h=q-\\sqrt h\\), h₀=4에서 선형화 모델과 τ는?</div><div class=\"xsol\"><b>풀이</b><ol><li>평형 q₀=2. 기울기 m=1/(2√4)=0.25.</li><li>2δḣ=δq−0.25δh → τ=2/0.25=<b>8 s</b>.</li><li>동작점이 높을수록(√h 평평) τ 길어짐 — 비선형의 흔적.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u5-l4-05 · u5-l3-06 · u1-l4-08</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 5-3</span>A=[[0,1],[−25,−6]]의 안정성과 응답 성격은?</div><div class=\"xsol\"><b>풀이</b><ol><li>tr=−6, det=25 → s²+6s+25.</li><li>ω₀=5, ζ=0.6 <1 — 부족감쇠 안정.</li><li>극점 −3±j4: 봉투 τ=1/3 s, 진동 4 rad/s.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u5-l2-03 · u5-l4-02 · u6-l2-06</div></div>"}, "u6": {"concept": "\n<p class=\"easy\"><b>⚡ 한 줄</b> — 시간응답은 극점 지도를 숫자로 바꾸는 기술이다: M_p는 ζ가, 속도는 ω₀가, 정착은 실수부(ζω₀)가 정한다. 공식 4개(M_p·T_p·T_s·T_r)가 중간시험의 화폐다.</p>\n<h4>1. 1차계</h4>\n<p>\\(K/(\\tau s+1)\\): 63.2%@τ, T_r(10–90%)=2.2τ, T_s(2%)=4τ. 극점 −1/τ.</p>\n<h4>2. 2차계 (부족감쇠)</h4>\n<p>\\(T_p=\\pi/\\omega_d\\), \\(M_p=e^{-\\pi\\zeta/\\sqrt{1-\\zeta^2}}\\) (ζ만!), \\(T_s\\approx4/(\\zeta\\omega_0)\\) (2%), \\(T_r\\approx1.8/\\omega_0\\) (ζ≈0.5 근방). 역산: \\(\\zeta=-\\ln M_p/\\sqrt{\\pi^2+\\ln^2M_p}\\).</p><div class=\"jsbox\"><span class=\"jt\">정석 6.1</span>s평면 지도: 수직선(σ=ζω₀)=정착 속도, 원점 반지름=ω₀, 부채꼴 각(cosθ=ζ)=오버슈트. 사양 → 허용 영역(수직선 왼쪽 ∩ 부채꼴 안) — 설계 문제는 전부 이 그림에서 시작한다.</div><h4>3. 고차·영점 보정</h4>\n<ul>\n<li><b>추가 극점</b>(좌반평면): 5배 규칙 밖이면 무시, 안이면 응답 느려지고 M_p↓.</li>\n<li><b>영점</b>: \\(y=y_0+\\dot y_0/z\\) — 가까운 좌반평면 영점은 M_p↑·속도↑, <b>우반평면 영점은 역응답</b>(초기 반대 방향).</li>\n</ul><div class=\"jsbox\"><span class=\"jt\">정석 6.2</span>사양 역산 3연타(실측 → 모델): M_p→ζ, T_p→ω_d→ω₀, 최종값→K. 그래프 세 숫자로 2차 모델이 완성된다 — HW·실험·시험 공용 루틴.</div>", "derive": [{"title": "T_p와 M_p (봉우리의 수학)", "steps": ["스텝 응답 \\(y=1-\\frac{e^{-\\zeta\\omega_0t}}{\\sqrt{1-\\zeta^2}}\\sin(\\omega_dt+\\phi)\\), φ=cos⁻¹ζ", "미분하면 위상항이 사라진다: \\(\\dot y\\propto e^{-\\zeta\\omega_0t}\\sin\\omega_dt\\)", "ẏ=0 → ω_dt=nπ → 첫 봉우리 \\(T_p=\\pi/\\omega_d\\)", "대입 → \\(M_p=e^{-\\zeta\\omega_0\\pi/\\omega_d}=e^{-\\pi\\zeta/\\sqrt{1-\\zeta^2}}\\)", "극한 체크: ζ→0 ⇒ 100% ✓ · ζ→1 ⇒ 0 ✓ · T_p는 ω₀↑ ⇒ 짧아짐 ✓"]}, {"title": "T_s≈4/(ζω₀) (봉투 논법)", "steps": ["응답의 진동 봉투 = \\(1\\pm\\frac{e^{-\\zeta\\omega_0t}}{\\sqrt{1-\\zeta^2}}\\)", "2% 조건: \\(e^{-\\zeta\\omega_0T_s}\\approx0.02\\) (√ 보정은 근사에서 무시)", "\\(T_s=\\ln50/(\\zeta\\omega_0)\\approx3.91/(\\zeta\\omega_0)\\to 4/(\\zeta\\omega_0)\\)", "5% 기준이면 ln20≈3 → 3/(ζω₀) — 기준을 문제에서 반드시 확인", "극한 체크: 실수부가 클수록(왼쪽) 빨리 정착 ✓ — '수직선' 사양의 근거"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 6-1</span>\\(T=\\dfrac{100}{s^2+10s+100}\\)의 사양 4종을 구하라.</div><div class=\"xsol\"><b>풀이</b><ol><li>ω₀=10, ζ=0.5, ω_d=8.66.</li><li>M_p=16.3%, T_p=0.363 s.</li><li>T_s=4/5=0.8 s, T_r≈0.18 s — 분모에서 20초 안에 뽑는 연습.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u6-l3-01 · u6-l2-05 · u6-l2-04</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 6-2</span>M_p≤10%, T_s≤2 s를 만족하는 극점 영역과 경계 특성다항식은?</div><div class=\"xsol\"><b>풀이</b><ol><li>ζ≥0.591 (역산), σ≥2.</li><li>경계: ω₀=2/0.591=3.38.</li><li>s²+4s+11.4 — '사양→다항식'이 설계의 절반.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u6-l3-02 · u6-l4-08 · u3-l4-08</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 6-3</span>\\(G=\\dfrac{K}{s(s+6)}\\) 단위 피드백에서 M_p=10%가 되는 K와 그때 T_s는?</div><div class=\"xsol\"><b>풀이</b><ol><li>ζ=0.591 → ω₀=6/(2·0.591)=5.08.</li><li>K=ω₀²=<b>25.8</b>.</li><li>T_s=8/6=1.33 s — K와 무관(a가 고정하므로)! 이 지적이 답안의 급을 올린다.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u6-l4-02 · u6-l3-06 · u6-l4-05</div></div>"}, "u7": {"concept": "\n<p class=\"easy\"><b>⚡ 한 줄</b> — 안정성은 \"모든 극점이 왼쪽인가\"다. 근을 안 구하고 판정하는 도구가 Routh 표: 1열 부호 변화 수 = 우반평면 극점 수. K 범위 문제로 중간의 마지막 관문이 된다.</p>\n<h4>1. 판정 사다리</h4>\n<ol>\n<li><b>필요조건 스캔</b>: 계수 누락·부호 불일치 → 즉시 불안정/경계.</li>\n<li><b>1·2차 특례</b>: 계수 전부 양수 ⇔ 안정 (필요충분).</li>\n<li><b>3차 이상</b>: Routh 표. 3차 요약: 전부 양수 + \\(a_2a_1>a_0\\).</li>\n</ol><div class=\"jsbox\"><span class=\"jt\">정석 7.1</span>Routh 특수 경우 2종: ① 1열만 0 → ε로 대체해 극한 판정 ② 행 전체 0 → 바로 윗행으로 보조 다항식 P(s), P′로 채우고 P의 근(±대칭)이 허수축 근을 알려준다. ②가 나오면 '지속 진동 주파수'까지 묻는 것이 정석 출제.</div><h4>2. K 범위와 임계</h4>\n<p>\\(G=\\dfrac{K}{s(s+a)(s+b)}\\) 단위 피드백: \\(s^3+(a{+}b)s^2+abs+K\\) → <b>0<K<(a+b)ab</b>, 임계에서 \\(\\omega=\\sqrt{ab}\\) 지속 진동. 이득 여유 = K_max/K운용.</p><div class=\"jsbox\"><span class=\"jt\">정석 7.2</span>한계 안정 주의: 허수축 단순근은 자유응답 유계지만 공진 입력에 발산(BIBO 불안정). '안정/불안정/한계'의 3분류 언어를 정확히 — 개념 문항 단골.</div>", "derive": [{"title": "3차 안정 조건 a₂a₁>a₀의 정체", "steps": ["\\(s^3+a_2s^2+a_1s+a_0\\)의 Routh: 행 [1, a₁], [a₂, a₀], [b₁], [a₀]", "\\(b_1=(a_2a_1-a_0)/a_2\\) — 1열 양수 조건이 곧 \\(a_2a_1>a_0\\)", "임계(b₁=0): 보조식 \\(a_2s^2+a_0=0\\) → \\(s=\\pm j\\sqrt{a_0/a_2}\\) — 허수축 통과 순간", "K 문제로 번역: a₀ 자리에 K가 들어가면 K_max = a₂a₁", "극한 체크: a₀→0 ⇒ 원점 근 분리 ✓ · 2차로 퇴화 시 조건 소멸 ✓"]}, {"title": "왜 계수 양수가 충분하지 않은가 (3차 반례)", "steps": ["\\(s^3+s^2+s+10\\): 계수 전부 양수", "b₁=(1·1−10)/1=−9<0 → 1열 부호 변화 2회", "따라서 RHP 극점 2개 (수치근: 약 s=0.66±j2.0, −2.3)", "교훈: 양수 계수는 '음의 실근' 곱만 보장 — 복소근의 실수부까진 못 본다", "극한 체크: 상수 10→1이면 (1·1>1 경계) 근이 허수축으로 ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 7-1</span>단위 피드백 \\(G=\\dfrac{K}{s(s+2)(s+5)}\\): 안정 K 범위와 임계 진동수는?</div><div class=\"xsol\"><b>풀이</b><ol><li>특성식 s³+7s²+10s+K.</li><li>Routh: K<70, K>0 → <b>0<K<70</b>.</li><li>임계 ω=√10=3.16 rad/s (보조식 7s²+70).</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u7-l2-06 · u7-l3-02 · u7-l4-02</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 7-2</span>\\(s^4+s^3+3s^2+2s+2\\)의 RHP 극점 수는?</div><div class=\"xsol\"><b>풀이</b><ol><li>b행: b₁=(3−2)/1=1, b₂=2.</li><li>c₁=(1·2−1·2)/1=0 → ε법. d₁=(ε·2−0)/ε=2.</li><li>1열 [1,1,1,ε,2]: ε>0으로 부호 변화 0회 — 그러나 0 출현은 허수축 근접 신호 → 근 확인 습관까지가 정석.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u7-l3-04 · u7-l4-05 · u7-l2-10</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 7-3</span>PD 제어 특성식 \\(s^3+4s^2+(K_d+4)s+K_p\\), K_p=8일 때 K_d 조건은?</div><div class=\"xsol\"><b>풀이</b><ol><li>교차 조건: 4(K_d+4)>8.</li><li>K_d>−2 → 사실상 모든 K_d≥0에서 안정.</li><li>미분 이득이 안정 여유를 늘린다 — s계수를 직접 키우므로.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u7-l4-04 · u7-l3-08 · u7-l3-03</div></div>"}};
