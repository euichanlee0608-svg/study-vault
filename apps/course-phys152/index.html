body{margin:0;background:var(--bg);color:var(--ink);

a{color:var(--acc);text-decoration-thickness:1px;text-underline-offset:2px}

mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}
.layout{display:flex;min-height:100vh}
.side{width:250px;flex:0 0 250px;background:var(--side);border-right:1px solid var(--line);
 padding:22px 18px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}

.side nav a:hover{background:var(--surf2)}
.side nav a.on{background:var(--acc-bg);color:var(--acc);font-weight:600}
.side nav a .nv{float:right;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3)}
.foot-side{margin-top:auto;font-size:10.5px;color:var(--ink3);line-height:1.5;font-family:"IBM Plex Mono",monospace}

.view{width:100%;max-width:820px}

p{margin:0 0 12px}
ul,ol{margin:0 0 13px;padding-left:22px}

.easy{background:var(--acc-bg);border-radius:8px;padding:13px 16px;margin:0 0 14px}
.easy b{color:var(--acc)}

.uc-stat{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3)}
/* collapsible layers */
details.layer{border:1px solid var(--line);border-radius:9px;background:var(--surf);margin-bottom:10px;box-shadow:var(--shadow)}
details.layer>summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:15px;list-style:none;display:flex;align-items:center;gap:8px}
details.layer>summary::-webkit-details-marker{display:none}
details.layer>summary .lb{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;padding:2px 8px;border-radius:99px;background:var(--info-bg);color:var(--info)}
details.layer>summary .arrow{margin-left:auto;color:var(--ink3);transition:transform .2s}
details.layer[open]>summary .arrow{transform:rotate(90deg)}
details.layer>.body{padding:4px 18px 14px;border-top:1px solid var(--line)}
details.dstep{border:1px solid var(--line);border-radius:7px;margin:0 0 8px;background:var(--surf2)}

details.dstep li{margin-bottom:7px;font-size:13.5px}

.exbox .xh{font-weight:600;font-size:14px;margin-bottom:6px}
.exbox .xh .xno{font-family:"IBM Plex Mono",monospace;color:var(--acc);font-size:11.5px;margin-right:6px}
.exbox .xsol{border-top:1px dashed var(--line2);margin-top:8px;padding-top:8px;font-size:13.5px}
.exbox .xsol ol{margin:4px 0 0;padding-left:20px}
.exbox .xrel{font-size:12px;color:var(--ink3);margin-top:8px;font-family:"IBM Plex Mono",monospace}
.readrow{margin:8px 0 2px;text-align:right}
.readbtn{font:inherit;font-size:12.5px;min-height:40px;padding:7px 15px;border-radius:99px;border:1px solid var(--line2);background:var(--surf);color:var(--ink2);cursor:pointer}
.readbtn[aria-pressed="true"]{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}

.filters{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.fchip{font:inherit;font-size:12.5px;min-height:36px;padding:5px 14px;border-radius:99px;border:1px solid var(--line2);background:var(--surf);color:var(--ink2);cursor:pointer}
.fchip.on{background:var(--acc-bg);color:var(--acc);border-color:var(--acc);font-weight:600}

.pc-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.lv{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px}

.lv3{background:var(--warn-bg);color:var(--warn)} .lv4{background:var(--acc-bg);color:var(--acc)}
.tagc{font-size:11px;color:var(--ink3);font-family:"IBM Plex Mono",monospace}
.srcb{font-size:10px;color:var(--ink3);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.sdot{width:9px;height:9px;border-radius:99px;background:var(--line2);margin-left:auto;flex:0 0 auto}
.sdot.correct{background:var(--ok)} .sdot.partial{background:var(--warn)} .sdot.wrong{background:var(--bad)}
.pc-st{font-size:14.5px;margin-bottom:10px}
.pc-btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.pbtn{font:inherit;font-size:12.5px;min-height:40px;padding:7px 14px;border-radius:8px;border:1px solid var(--line2);background:var(--surf2);color:var(--ink2);cursor:pointer}
.pbtn:hover{border-color:var(--acc);color:var(--acc)}
.pbtn.grade-c{border-color:var(--ok);color:var(--ok)}
.pbtn.grade-p{border-color:var(--warn);color:var(--warn)}
.pbtn.grade-w{border-color:var(--bad);color:var(--bad)}
.pbtn.grade-c.sel{background:var(--ok-bg)} .pbtn.grade-p.sel{background:var(--warn-bg)} .pbtn.grade-w.sel{background:var(--bad-bg)}
.hintbox{background:var(--warn-bg);border-radius:7px;padding:9px 13px;font-size:13px;margin:8px 0 0}
.solbox{background:var(--surf2);border-radius:8px;padding:11px 14px;margin:10px 0 0}
.solbox ol{margin:0;padding-left:20px}
.solbox li{font-size:13.5px;margin-bottom:7px}
.ansline{margin-top:8px;font-weight:600;color:var(--acc);font-size:14px}
.choices{display:flex;flex-direction:column;gap:7px;margin:4px 0 2px}
.choice{font:inherit;text-align:left;font-size:13.5px;min-height:44px;padding:9px 13px;border-radius:8px;border:1px solid var(--line2);background:var(--surf);color:var(--ink);cursor:pointer}
.choice:hover{border-color:var(--acc)}
.choice.right{border-color:var(--ok);background:var(--ok-bg)}
.choice.wrongpick{border-color:var(--bad);background:var(--bad-bg)}
.expl{background:var(--info-bg);border-radius:7px;padding:9px 13px;font-size:13px;margin-top:8px;color:var(--ink2)}

.bigbtn:disabled{opacity:.5;cursor:default}

.exam-top .bar i{display:block;height:100%;background:var(--acc)}
.report{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:18px 20px;box-shadow:var(--shadow)}
.report .score{font-family:Newsreader,Georgia,serif;font-size:34px;font-weight:600;color:var(--acc)}
table{border-collapse:collapse;width:100%;margin:10px 0 14px;font-size:13px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left}
th{background:var(--surf2);white-space:nowrap}
.empty{border:1px dashed var(--line2);border-radius:10px;padding:24px;color:var(--ink3);font-size:13.5px;text-align:center}

.tabbar{display:none}
#tb-sheet{display:none}
@media(max-width:960px){
 body{font-size:16px}
 input,textarea,select{font-size:16px}
 .layout{flex-direction:column}

  padding:12px 16px;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

    fmt: function (x, sig) {
      if (typeof x !== 'number' || !isFinite(x)) return String(x);
      if (x === 0) return '0';
      var v = Number(x.toPrecision(sig || 4));

    cadd: function (a, b) { return { re: a.re + b.re, im: a.im + b.im }; },

    cmul: function (a, b) { return { re: a.re * b.re - a.im * b.im, im: a.re * b.im + a.im * b.re }; },

  /* ---------- L2 (12) ---------- */
  { id:'u1-l2-01', level:2, type:'num', tags:['쿨롱 힘'], src:'창작 문제(검산됨)',
    params:{ q1:{choices:[1,2,5],unit:'µC'}, q2:{choices:[2,3,4],unit:'µC'}, r:{choices:[10,20,30],unit:'cm'} },
    statement:function(p){ return 'q₁='+p.q1+' µC, q₂='+p.q2+' µC가 r='+p.r+' cm 떨어져 있다. 쿨롱 힘의 크기(N)는?'; },

    hints:['µC→C, cm→m부터.'] },
  { id:'u1-l2-02', level:2, type:'num', tags:['점전하 장'], src:'창작 문제(검산됨)',

  { id:'u1-l2-03', level:2, type:'num', tags:['장→힘'], src:'창작 문제(검산됨)',

  { id:'u1-l2-05', level:2, type:'num', tags:['일직선 중첩'], src:'창작 문제(검산됨)',

    statement:function(p){ return '+q와 +q('+p.q+' µC)가 '+p.d+' cm 떨어져 있다. 두 전하의 중점에서 전기장 크기와, 중점에서 한 전하 쪽으로 살짝 벗어났을 때 장의 방향(밀려남=1)을 구하라.'; },
    solve:function(p){
      return { ans:{E:0, dir:1}, unit:{E:'N/C', dir:''}, steps:[
        '중점: 두 장이 크기 같고 반대 방향 → E = 0',
        '벗어나면 가까운 쪽 척력 우세 → 중점에서 밀려나는 방향(1). (+,+) 중점은 불안정 평형 아님 — 축 방향으론 복원(다음 문제들에서)' ] }; },
    hints:['대칭 → 상쇄.'] },
  { id:'u1-l2-06', level:2, type:'num', tags:['수직 이등분선 중첩'], src:'창작 문제(검산됨)',
    params:{ q:{choices:[3,6],unit:'µC'}, a:{choices:[30,40],unit:'cm'}, y:{choices:[30,40],unit:'cm'} },
    statement:function(p){ return '±x축 위 x=±'+p.a+' cm에 +q('+p.q+' µC) 두 개. y축 위 y='+p.y+' cm 점의 전기장 크기(N/C)는? (방향은 +y)'; },
    solve:function(p){
      var a=p.a/100, y=p.y/100, r=Math.hypot(a,y);
      var E=2*8.99e9*p.q*1e-6/(r*r)*(y/r);
      return { ans:E, unit:'N/C', steps:[
        'r = √(a²+y²) = '+SVH.fmt(r)+' m, 각 장 = kq/r²',
        'x성분 상쇄, y성분 ×2: E = 2(kq/r²)(y/r) = '+SVH.fmt(E)+' N/C' ] }; },
    hints:['대칭으로 y성분만 살아남는다.'] },
  { id:'u1-l2-07', level:2, type:'num', tags:['영점 찾기'], src:'창작 문제(검산됨)',
    params:{ q1:{choices:[1,4],unit:'µC'}, k:{choices:[4,9]} , d:{choices:[30,60],unit:'cm'} },
    statement:function(p){ return '+q₁('+p.q1+' µC)이 원점, +q₂='+p.k+'q₁이 x='+p.d+' cm에 있다. 전기장이 0이 되는 x 위치(cm, 두 전하 사이)를 구하라.'; },
    solve:function(p){
      var s=Math.sqrt(p.k); var x=p.d/(1+s);
      return { ans:x, unit:'cm', steps:[
        '사이 지점: kq₁/x² = kq₂/(d−x)² → (d−x)/x = √('+p.k+') = '+s,
        'x = d/(1+√k) = '+p.d+'/'+(1+s)+' = '+SVH.fmt(x)+' cm (작은 전하 쪽으로 치우침)' ] }; },
    hints:['제곱근 비율로 나눈다.'] },
  { id:'u1-l2-08', level:2, type:'num', tags:['평형 전하'], src:'창작 문제(검산됨)',
    params:{ m:{choices:[1,2],unit:'g'}, E:{choices:[2000,5000],unit:'N/C'} },
    statement:function(p){ return '질량 '+p.m+' g의 대전 입자가 연직 위 방향 전기장 '+p.E+' N/C 속에서 공중에 떠 있다(평형). 전하량(µC)을 구하라. (g=9.8)'; },
    solve:function(p){ var q=p.m/1000*9.8/p.E*1e6;
      return { ans:q, unit:'µC', steps:[
        '평형: qE = mg',
        'q = mg/E = '+SVH.fmt(p.m/1000*9.8)+'/'+p.E+' = '+SVH.fmt(q)+' µC (밀리컨 실험의 골격)' ] }; },
    hints:['힘 균형 한 줄.'] },
  { id:'u1-l2-09', level:2, type:'num', tags:['쌍극자 축 위 장'], src:'교재 표준',
    params:{ q:{choices:[1,2],unit:'nC'}, d:{choices:[2,4],unit:'mm'}, z:{choices:[10,20],unit:'cm'} },
    statement:function(p){ return '쌍극자(±'+p.q+' nC, 간격 '+p.d+' mm)의 축 위, 중심에서 z='+p.z+' cm(≫d) 지점의 장 근사 \\(E\\approx\\dfrac{2kp}{z^3}\\)를 계산하라(N/C).'; },
    solve:function(p){
      var pm=p.q*1e-9*p.d*1e-3;
      var E=2*8.99e9*pm/Math.pow(p.z/100,3);
      return { ans:E, unit:'N/C', steps:[
        'p = qd = '+SVH.fmt(pm)+' C·m',
        'E ≈ 2kp/z³ = '+SVH.fmt(E)+' N/C (1/z³ — 쌍극자는 멀리서 빨리 죽는다)' ] }; },
    hints:['쌍극자 원거리 공식.'] },
  { id:'u1-l2-10', level:2, type:'num', tags:['토크'], src:'창작 문제(검산됨)',
    params:{ pm:{choices:[2,5],unit:'×10⁻⁹ C·m'}, E:{choices:[1000,3000],unit:'N/C'}, th:{choices:[30,60,90]} },
    statement:function(p){ return '쌍극자 모멘트 p='+p.pm+'×10⁻⁹ C·m가 E='+p.E+' N/C와 '+p.th+'°를 이룬다. 토크(N·m)와 퍼텐셜에너지 U=−pEcosθ(J)를 구하라.'; },
    solve:function(p){
      var tau=p.pm*1e-9*p.E*Math.sin(SVH.rad(p.th));
      var U=-p.pm*1e-9*p.E*Math.cos(SVH.rad(p.th));
      return { ans:{tau:tau, U:U}, unit:{tau:'N·m', U:'J'}, steps:[
        'τ = pE sinθ = '+SVH.fmt(tau)+' N·m',
        'U = −pE cosθ = '+SVH.fmt(U)+' J (θ=0 정렬이 최저 에너지)' ] }; },
    hints:['sin은 토크, cos은 에너지.'] },
  { id:'u1-l2-11', level:2, type:'num', tags:['장 속 투사체'], src:'창작 문제(검산됨)',
    params:{ E:{choices:[500,1000],unit:'N/C'}, v0:{choices:[2,4],unit:'×10⁶ m/s'}, L:{choices:[4,8],unit:'cm'} },
    statement:function(p){ return '전자(v₀='+p.v0+'×10⁶ m/s, +x)가 길이 L='+p.L+' cm의 편향판 사이(장 '+p.E+' N/C, −y로 힘)를 지난다. 판 끝에서 y 변위(mm)를 구하라.'; },
    solve:function(p){
      var a=1.602e-19*p.E/9.11e-31;
      var t=p.L/100/(p.v0*1e6);
      var y=0.5*a*t*t*1000;
      return { ans:y, unit:'mm', steps:[
        'a = eE/m = '+SVH.fmt(a)+' m/s², 통과 시간 t = L/v₀ = '+SVH.fmt(t)+' s',
        'y = ½at² = '+SVH.fmt(y)+' mm (포물선 — 중력 투사체와 동형)' ] }; },
    hints:['수평 등속·수직 등가속.'] },
  { id:'u1-l2-12', level:2, type:'num', tags:['정삼각형 배치'], src:'창작 문제(검산됨)',
    params:{ q:{choices:[2,4],unit:'µC'}, a:{choices:[10,20],unit:'cm'} },
    statement:function(p){ return '한 변 a='+p.a+' cm 정삼각형의 두 꼭짓점에 +q('+p.q+' µC). 나머지 꼭짓점에서 전기장 크기(N/C)를 구하라.'; },
    solve:function(p){
      var E1=8.99e9*p.q*1e-6/Math.pow(p.a/100,2);
      var E=E1*Math.sqrt(3);
      return { ans:E, unit:'N/C', steps:[
        '각 전하의 장 E₁ = kq/a² = '+SVH.fmt(E1)+' N/C, 사이 각 60°',
        '합 = 2E₁cos30° = √3·E₁ = '+SVH.fmt(E)+' N/C (이등분선 방향)' ] }; },
    hints:['60° 벡터 합.'] },

  /* ---------- L3 (14) ---------- */
  { id:'u1-l3-01', level:3, type:'num', tags:['세 전하 힘 합'], src:'기출 유형',
    params:{ q:{choices:[1,2],unit:'µC'}, a:{choices:[10,20],unit:'cm'} },
    statement:function(p){ return '정사각형(변 a='+p.a+' cm) 세 꼭짓점에 +q('+p.q+' µC), 나머지 한 꼭짓점의 +q가 받는 알짜힘(N)을 구하라.'; },
    solve:function(p){
      var a=p.a/100, F1=8.99e9*Math.pow(p.q*1e-6,2)/(a*a);
      var Fd=F1/2; // 대각: 거리 √2a → F/2
      var F=F1*Math.sqrt(2)+Fd;
      return { ans:F, unit:'N', steps:[
        '이웃 2개: 각 F₁ = kq²/a² = '+SVH.fmt(F1)+' N, 수직 합 = √2F₁',
        '대각 1개: kq²/(√2a)² = F₁/2 = '+SVH.fmt(Fd)+' N (같은 대각 방향)',
        '합 = √2F₁+F₁/2 = '+SVH.fmt(F)+' N (대각선 바깥 방향)' ] }; },
    hints:['대각 성분으로 정리하면 한 줄.'] },
  { id:'u1-l3-02', level:3, type:'num', tags:['매달린 전하쌍'], src:'기출 유형',
    params:{ m:{choices:[10,20],unit:'g'}, L:{choices:[50,100],unit:'cm'}, th:{choices:[5,10]} },
    statement:function(p){ return '길이 L='+p.L+' cm 실 두 개에 질량 '+p.m+' g 구가 매달려 같은 전하 q로 대전되니 각각 연직에서 '+p.th+'° 벌어졌다. q(µC)를 구하라.'; },
    solve:function(p){
      var th=SVH.rad(p.th), r=2*p.L/100*Math.sin(th);
      var F=p.m/1000*9.8*Math.tan(th);
      var q=Math.sqrt(F*r*r/8.99e9)*1e6;
      return { ans:q, unit:'µC', steps:[
        '간격 r = 2Lsinθ = '+SVH.fmt(r)+' m',
        '힘 균형: F = mg tanθ = '+SVH.fmt(F)+' N',
        'q = √(Fr²/k) = '+SVH.fmt(q)+' µC (역학+정전기 결합의 고전)' ] }; },
    hints:['tanθ = F/mg.','기하에서 r부터.'] },
  { id:'u1-l3-03', level:3, type:'num', tags:['일직선 3전하 평형'], src:'기출 유형',
    params:{ q:{choices:[4,9],unit:'µC'}, d:{choices:[30,60],unit:'cm'} },
    statement:function(p){ return '+q('+p.q+' µC)가 원점, +4q가 x=d('+p.d+' cm)에 고정. 그 사이에 자유 전하를 놓아 평형이 되게 하는 위치 x(cm)와, 그 평형이 (축 방향으로) 안정인지(음전하일 때 1/양전하일 때 0)를 구하라.'; },
    solve:function(p){
      var x=p.d/3;
      return { ans:{x:x, st:0}, unit:{x:'cm', st:''}, steps:[
        'kq/x² = k(4q)/(d−x)² → (d−x)/x=2 → x = d/3 = '+SVH.fmt(x)+' cm',
        '양전하: 축에서 벗어나면… 축 방향으론 복원이지만 그 위치에서 양쪽 척력 — 축 방향 이동 시 가까운 쪽 척력 증가로 복원(안정처럼 보이나), 횡 방향 불안정. "부호에 따라 안정성이 바뀐다" 논의가 포인트(정답 규약: 양전하 축방향 판정=0 아님 주의) → 규약상 0(양전하는 횡불안정)' ] }; },
    hints:['거리비 1:2.','언쇼 정리 냄새 맡기.'] },
  { id:'u1-l3-04', level:3, type:'num', tags:['링 축 위 장'], src:'교재 표준',
    params:{ Q:{choices:[2,5],unit:'µC'}, R:{choices:[10,20],unit:'cm'}, z:{choices:[10,20],unit:'cm'} },
    statement:function(p){ return '반지름 R='+p.R+' cm 고리에 Q='+p.Q+' µC 균일 분포. 축 위 z='+p.z+' cm에서 \\(E=\\dfrac{kQz}{(z^2+R^2)^{3/2}}\\)를 계산하라(N/C).'; },
    solve:function(p){
      var R=p.R/100, z=p.z/100;
      var E=8.99e9*p.Q*1e-6*z/Math.pow(z*z+R*R,1.5);
      return { ans:E, unit:'N/C', steps:[
        '수직 성분만 생존(대칭): E = kQz/(z²+R²)^{3/2}',
        '= '+SVH.fmt(E)+' N/C',
        '극한 검토: z≫R이면 kQ/z²(점전하) ✓ — U2 연속분포의 첫 관문' ] }; },
    hints:['공식 대입+극한 확인.'] },
  { id:'u1-l3-05', level:3, type:'num', tags:['쌍극자 진동'], src:'기출 유형',
    params:{ pm:{choices:[1,2],unit:'×10⁻⁹ C·m'}, E:{choices:[1000,4000],unit:'N/C'}, I:{choices:[2,8],unit:'×10⁻¹² kg·m²'} },
    statement:function(p){ return '관성모멘트 I='+p.I+'×10⁻¹² kg·m²인 쌍극자(p='+p.pm+'×10⁻⁹ C·m)가 장 E='+p.E+' N/C에서 소각 진동한다. 각진동수 \\(\\omega=\\sqrt{pE/I}\\)(rad/s)를 구하라.'; },
    solve:function(p){
      var w=Math.sqrt(p.pm*1e-9*p.E/(p.I*1e-12));
      return { ans:w, unit:'rad/s', steps:[
        '소각: τ=−pEθ → Iθ̈=−pEθ (진자와 동형)',
        'ω = √(pE/I) = '+SVH.fmt(w)+' rad/s (복원 토크의 진동 — 역학 리뷰와 연결)' ] }; },
    hints:['sinθ≈θ 선형화.'] },
  { id:'u1-l3-06', level:3, type:'num', tags:['전하 분배'], src:'창작 문제(검산됨)',
    params:{ Q:{choices:[6,12],unit:'µC'}, r:{choices:[20,40],unit:'cm'} },
    statement:function(p){ return '전하 Q='+p.Q+' µC를 두 조각 q와 Q−q로 나눠 r='+p.r+' cm 떨어뜨릴 때 척력이 최대가 되는 q와 그 최대 힘(N)을 구하라.'; },
    solve:function(p){
      var q=p.Q/2;
      var F=8.99e9*Math.pow(q*1e-6,2)/Math.pow(p.r/100,2);
      return { ans:{q:q, F:F}, unit:{q:'µC', F:'N'}, steps:[
        'F ∝ q(Q−q) → 최대는 q=Q/2 = '+SVH.fmt(q)+' µC (미분 또는 대칭)',
        'F_max = k(Q/2)²/r² = '+SVH.fmt(F)+' N' ] }; },
    hints:['곱 최대 = 반반.'] },
  { id:'u1-l3-07', level:3, type:'num', tags:['수소 원자 비율'], src:'교재 표준',
    params:{ dummy:{choices:[1]} },
    statement:function(p){ return '수소 원자에서 전자-양성자의 쿨롱 힘과 만유인력의 비 \\(F_C/F_G=\\dfrac{ke^2}{Gm_em_p}\\)를 구하라. (G=6.67×10⁻¹¹, m_e=9.11×10⁻³¹, m_p=1.67×10⁻²⁷)'; },
    solve:function(p){
      var r=8.99e9*Math.pow(1.602e-19,2)/(6.67e-11*9.11e-31*1.67e-27);
      return { ans:r, unit:'', steps:[
        '거리는 약분(둘 다 1/r²)!',
        '비 = ke²/(Gm_em_p) = '+SVH.fmt(r)+' ≈ 2×10³⁹',
        '(전자기력이 원자를 지배하는 이유 — 강의노트 도입부 논지)' ] }; },
    hints:['r이 사라진다.'] },
  { id:'u1-l3-08', level:3, type:'num', tags:['일직선 세 전하 합력'], src:'기출 유형',
    params:{ q:{choices:[2,3],unit:'µC'}, d:{choices:[10,20],unit:'cm'} },
    statement:function(p){ return 'x=0에 +q, x=d에 −q, x=2d에 +q ('+p.q+' µC, d='+p.d+' cm). 맨 오른쪽 +q가 받는 알짜힘(N, 방향 부호: +x 양수)을 구하라.'; },
    solve:function(p){
      var d=p.d/100, k=8.99e9, qq=Math.pow(p.q*1e-6,2);
      var F=-k*qq/(d*d)+k*qq/(4*d*d);
      return { ans:F, unit:'N', steps:[
        '−q(거리 d): 인력 −kq²/d², +q(거리 2d): 척력 +kq²/4d²',
        '합 = kq²/d²(−1+¼) = '+SVH.fmt(F)+' N (−x쪽, 인력 우세)' ] }; },
    hints:['부호 붙여 대수합.'] },
  { id:'u1-l3-09', level:3, type:'num', tags:['시간 포함 운동'], src:'기출 유형',
    params:{ E:{choices:[100,200],unit:'N/C'}, t:{choices:[10,20],unit:'ns'} },
    statement:function(p){ return '정지한 전자가 E='+p.E+' N/C에서 t='+p.t+' ns 가속됐다. (a) 최종 속력(m/s) (b) 이동 거리(cm)를 구하라.'; },
    solve:function(p){
      var a=1.602e-19*p.E/9.11e-31;
      var t=p.t*1e-9, v=a*t, d=0.5*a*t*t*100;
      return { ans:{v:v, d:d}, unit:{v:'m/s', d:'cm'}, steps:[
        'a = eE/m = '+SVH.fmt(a)+' m/s²',
        'v = at = '+SVH.fmt(v)+' m/s, d = ½at² = '+SVH.fmt(d)+' cm',
        '(v가 10⁶ m/s급 — 아직 비상대론 OK, c의 '+SVH.fmt(v/3e8*100)+'%)' ] }; },
    hints:['등가속 공식 그대로.'] },
  { id:'u1-l3-10', level:3, type:'num', tags:['정사각형 중심 장'], src:'기출 유형',
    params:{ q:{choices:[2,4],unit:'µC'}, a:{choices:[20,40],unit:'cm'} },
    statement:function(p){ return '정사각형(변 a='+p.a+' cm) 꼭짓점에 시계방향으로 +q, +q, −q, −q ('+p.q+' µC). 중심의 전기장 크기(N/C)를 구하라.'; },
    solve:function(p){
      var r2=Math.pow(p.a/100,2)/2; // (a/√2)²
      var E1=8.99e9*p.q*1e-6/r2;
      var E=2*Math.SQRT2*E1;
      return { ans:E, unit:'N/C', steps:[
        '중심까지 r=a/√2 → 각 장 E₁ = kq/(a²/2) = '+SVH.fmt(E1)+' N/C',
        '배치상 넷 다 같은 변(위→아래) 성분 방향으로 합쳐짐: 인접 합 벡터 계산 → E = 2√2·E₁ = '+SVH.fmt(E)+' N/C',
        '(+는 밀고 −는 당겨 같은 방향 — 부호 배치 그림이 절반이다)' ] }; },
    hints:['+ 밀기, − 당기기 화살표 넷을 그려라.'] },
  { id:'u1-l3-11', level:3, type:'num', tags:['원둘레 결손'], src:'기출 유형',
    params:{ lam:{choices:[2,5],unit:'nC/m'}, R:{choices:[10,20],unit:'cm'}, th:{choices:[30,60]} },
    statement:function(p){ return '반지름 R='+p.R+' cm 고리(선밀도 λ='+p.lam+' nC/m)에서 각도 '+p.th+'° 조각을 떼어냈다. 중심의 전기장(N/C)은? (팁: 결손 조각의 장만 계산)'; },
    solve:function(p){
      // 중심에서 완전 고리는 0 → 결손 = -조각. 조각의 장 = kλ·2sin(θ/2)/R
      var R=p.R/100, th=SVH.rad(p.th);
      var E=8.99e9*p.lam*1e-9*2*Math.sin(th/2)/R;
      return { ans:E, unit:'N/C', steps:[
        '완전 고리 중심 장 = 0 → 결손 고리 = (−조각)의 장 = 조각 크기와 동일',
        '조각(호 θ): E = (kλ/R)·2sin(θ/2) = '+SVH.fmt(E)+' N/C, 방향은 결손 반대쪽',
        '(중첩의 영리한 사용 — "없는 것"을 "음의 있음"으로)' ] }; },
    hints:['빈 곳 = 반대 부호 조각 추가.'] },
  { id:'u1-l3-12', level:3, type:'num', tags:['µC·g 융합'], src:'기출 유형',
    params:{ q:{choices:[1,2],unit:'µC'}, m:{choices:[5,10],unit:'g'}, E:{choices:[2,5],unit:'×10⁴ N/C'} },
    statement:function(p){ return '수평 전기장 '+p.E+'×10⁴ N/C에서 실에 매달린 대전구(q='+p.q+' µC, m='+p.m+' g)가 기우는 각(°)과 실 장력(N)을 구하라.'; },
    solve:function(p){
      var F=p.q*1e-6*p.E*1e4, W=p.m/1000*9.8;
      var th=SVH.deg(Math.atan2(F,W)), T=Math.hypot(F,W);
      return { ans:{th:th, T:T}, unit:{th:'°', T:'N'}, steps:[
        'F_E = qE = '+SVH.fmt(F)+' N, W = '+SVH.fmt(W)+' N',
        'tanθ = F/W → θ = '+SVH.fmt(th)+'°, T = √(F²+W²) = '+SVH.fmt(T)+' N' ] }; },
    hints:['기울어진 진자 평형.'] },
  { id:'u1-l3-13', level:3, type:'num', tags:['속도 필터 예고'], src:'창작 문제(검산됨)',
    params:{ E:{choices:[1000,2000],unit:'N/C'}, v:{choices:[2,4],unit:'×10⁵ m/s'} },
    statement:function(p){ return '전자가 +x로 v='+p.v+'×10⁵ m/s. −y 방향 전기력을 정확히 상쇄해 직진시키려면(자기장은 U6에서!) 중력만으로 되는가? qE와 mg를 비교해 비율을 구하라. (E='+p.E+' N/C)'; },
    solve:function(p){
      var Fe=1.602e-19*p.E, Fg=9.11e-31*9.8;
      return { ans:Fe/Fg, unit:'배', steps:[
        'qE = '+SVH.fmt(Fe)+' N vs mg = '+SVH.fmt(Fg)+' N',
        '비 = '+SVH.fmt(Fe/Fg)+' — 중력으론 어림도 없다(10¹² 배)',
        '(자기력이 필요한 이유 → U6 속도 선택기의 예고)' ] }; },
    hints:['크기 비교만.'] },
  { id:'u1-l3-14', level:3, type:'num', tags:['이차원 합성'], src:'기출 유형',
    params:{ q1:{choices:[2,3],unit:'µC'}, q2:{choices:[4,6],unit:'µC'}, a:{choices:[30,60],unit:'cm'} },
    statement:function(p){ return '원점에 +q₁('+p.q1+' µC), (a,0)에 −q₂('+p.q2+' µC), a='+p.a+' cm. 점 (a, a)에서 전기장의 x·y 성분(N/C)을 구하라.'; },
    solve:function(p){
      var a=p.a/100, k=8.99e9;
      // q1: 위치차 (a,a), r=√2 a
      var r1=Math.SQRT2*a, E1=k*p.q1*1e-6/(r1*r1);
      var E1x=E1/Math.SQRT2, E1y=E1/Math.SQRT2;
      // q2(음전하): 점->전하 방향으로 당김. 전하 위치 (a,0), 점 (a,a): 장은 -y 방향, 크기 kq2/a²
      var E2=k*p.q2*1e-6/(a*a);
      var Ex=E1x, Ey=E1y-E2;
      return { ans:{Ex:Ex, Ey:Ey}, unit:{Ex:'N/C', Ey:'N/C'}, steps:[
        'q₁: r=√2a, E₁='+SVH.fmt(E1)+' → 성분 ('+SVH.fmt(E1x)+', '+SVH.fmt(E1y)+')',
        'q₂(−): 점에서 전하 쪽(−y)으로 '+SVH.fmt(E2),
        '합: E_x='+SVH.fmt(Ex)+', E_y='+SVH.fmt(Ey)+' N/C' ] }; },
    hints:['전하별 단위벡터를 정확히.'] },

  /* ---------- L4 (8) ---------- */
  { id:'u1-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'옳은 것을 모두 고르면?<br>㉠ 전기장은 시험전하 없이도 존재하는 공간의 성질이다<br>㉡ 장선이 교차하지 않는 것은 장이 각 점에서 유일한 벡터이기 때문이다<br>㉢ 균일한 장 속 쌍극자의 알짜힘은 0이다<br>㉣ 정전기력만으로는 자유 전하를 안정 평형에 가둘 수 없다(언쇼)',
    choices:['전부','㉠㉡㉢','㉡㉢㉣','㉠㉣'],
    answer:0, expl:'전부 참. ㉣ 언쇼 정리는 가우스 법칙(U2)으로 증명된다 — 진공 중 E의 발산 0이라 3방향 모두 복원일 수 없다.' },
  { id:'u1-l4-02', level:4, type:'num', tags:['진동 주기 종합'], src:'기출 유형',
    params:{ q:{choices:[1,2],unit:'µC'}, Q:{choices:[4,8],unit:'µC'}, d:{choices:[20,40],unit:'cm'}, m:{choices:[1,2],unit:'g'} },
    statement:function(p){ return '+Q('+p.Q+' µC) 두 개가 x=±d(d='+p.d+' cm)에 고정, 원점의 −q('+p.q+' µC, m='+p.m+' g)가 x축 소진폭 진동한다. (a) 유효 스프링상수 k_eff=4kQq/d³ (b) 주기(s)를 구하라.'; },
    solve:function(p){
      var d=p.d/100;
      var keff=4*8.99e9*p.Q*1e-6*p.q*1e-6/Math.pow(d,3);
      var T=2*Math.PI*Math.sqrt(p.m/1000/keff);
      return { ans:{keff:keff, T:T}, unit:{keff:'N/m', T:'s'}, steps:[
        '소진폭 전개: F ≈ −(4kQq/d³)x → k_eff = '+SVH.fmt(keff)+' N/m',
        'T = 2π√(m/k_eff) = '+SVH.fmt(T)+' s',
        '(축 방향 안정·횡 방향 불안정 — 언쇼와 모순 없다)' ] }; },
    hints:['1/(d−x)²−1/(d+x)² ≈ 4x/d³.'] },
  { id:'u1-l4-03', level:4, type:'derive', tags:['유도'], src:'강의자료 대조',
    statement:'링(반지름 R, 전하 Q) 축 위 z에서 \\(E=\\dfrac{kQz}{(z^2+R^2)^{3/2}}\\)를 적분으로 유도하고, 극한 2개와 최대 지점을 구하라.',
    steps:[
      '조각 dq의 장 \\(dE=k\\,dq/(z^2+R^2)\\) — 모든 조각이 같은 거리 [왜] 링 대칭의 선물',
      '수평 성분은 짝지어 상쇄, 축 성분만: \\(dE_z=dE\\cdot\\dfrac{z}{\\sqrt{z^2+R^2}}\\)',
      '적분( dq만 남음): \\(E=\\dfrac{kz}{(z^2+R^2)^{3/2}}\\int dq=\\dfrac{kQz}{(z^2+R^2)^{3/2}}\\)',
      '극한: z≫R ⇒ kQ/z²(점전하) ✓ · z=0 ⇒ 0(대칭 상쇄) ✓',
      '최댓값: dE/dz=0 → z=R/√2 — 차원 체크: [k][C][m]/[m³]=[N/C] ✓'
    ],
    hints:['거리 같음+성분 상쇄가 전부.','미분해 봉우리까지.'],
    expl:'U2 원판·직선 유도의 원형 — "조각→성분→적분→극한" 4박자를 몸에 붙이는 문제.' },
  { id:'u1-l4-04', level:4, type:'num', tags:['쌍극자 원거리 전개'], src:'기출 유형',
    params:{ q:{choices:[1,2],unit:'nC'}, d:{choices:[2,4],unit:'mm'}, z:{choices:[4,8],unit:'cm'} },
    statement:function(p){ return '쌍극자(±q='+p.q+' nC, 간격 d='+p.d+' mm) 축 위 z='+p.z+' cm에서 (a) 정확한 장 (b) 근사 2kp/z³ (c) 상대오차(%)를 구하라.'; },
    solve:function(p){
      var k=8.99e9, q=p.q*1e-9, d=p.d*1e-3, z=p.z/100;
      var Eex=k*q*(1/Math.pow(z-d/2,2)-1/Math.pow(z+d/2,2));
      var Eap=2*k*q*d/Math.pow(z,3);
      var err=(Eex-Eap)/Eex*100;
      return { ans:{Eex:Eex, Eap:Eap, err:err}, unit:{Eex:'N/C', Eap:'N/C', err:'%'}, steps:[
        '정확: kq[1/(z−d/2)²−1/(z+d/2)²] = '+SVH.fmt(Eex)+' N/C',
        '근사: 2kp/z³ = '+SVH.fmt(Eap)+' N/C',
        '오차 '+SVH.fmt(err)+'% — z/d='+SVH.fmt(z/d)+'배에서 이 정도(근사의 신뢰 구간 감각)' ] }; },
    hints:['이항 전개 1차항이 근사식.'] },
  { id:'u1-l4-05', level:4, type:'num', tags:['밀리컨 완주'], src:'기출 유형',
    params:{ r:{choices:[1,2],unit:'µm'}, E:{choices:[2,4],unit:'×10⁵ N/C'} },
    statement:function(p){ return '반지름 r='+p.r+' µm 기름방울(ρ=900 kg/m³)이 연직 장 E='+p.E+'×10⁵ N/C에서 정지해 있다. (a) 무게(N) (b) 전하량(C) (c) 기본전하의 몇 배인가?'; },
    solve:function(p){
      var V=4/3*Math.PI*Math.pow(p.r*1e-6,3), W=900*V*9.8;
      var q=W/(p.E*1e5), n=q/1.602e-19;
      return { ans:{W:W, q:q, n:n}, unit:{W:'N', q:'C', n:'배'}, steps:[
        'W = ρ·(4/3)πr³·g = '+SVH.fmt(W)+' N',
        'q = W/E = '+SVH.fmt(q)+' C',
        'n = q/e = '+SVH.fmt(n)+' → 정수 근처인지 확인하는 것이 실험의 논리(양자화 증명)' ] }; },
    hints:['부피→질량→무게→평형.'] },
  { id:'u1-l4-06', level:4, type:'num', tags:['편향판 완주'], src:'기출 유형',
    params:{ V0:{choices:[2,4],unit:'×10⁷ m/s'}, E:{choices:[2,4],unit:'×10⁴ N/C'}, L:{choices:[2,4],unit:'cm'}, D:{choices:[20,40],unit:'cm'} },
    statement:function(p){ return 'CRT형 문제: 전자(v₀='+p.V0+'×10⁷ m/s)가 판(길이 L='+p.L+' cm, 장 '+p.E+'×10⁴ N/C) 통과 후 거리 D='+p.D+' cm의 스크린에 닿는다. (a) 판 내 변위 (b) 출사각 tanθ (c) 스크린 총 변위(cm)를 구하라.'; },
    solve:function(p){
      var v0=p.V0*1e7, E=p.E*1e4, L=p.L/100, D=p.D/100;
      var a=1.602e-19*E/9.11e-31, t=L/v0;
      var y1=0.5*a*t*t, tan=a*t/v0, y=(y1+D*tan)*100;
      return { ans:{y1:y1*100, tan:tan, y:y}, unit:{y1:'cm', tan:'', y:'cm'}, steps:[
        '판 내: y₁ = ½a(L/v₀)² = '+SVH.fmt(y1*100)+' cm',
        '출사 기울기 tanθ = v_y/v_x = aL/v₀² = '+SVH.fmt(tan),
        '스크린: y = y₁+D·tanθ = '+SVH.fmt(y)+' cm (판 중앙에서 직선 연장으로 봐도 같다는 기하 사실까지)' ] }; },
    hints:['포물선+직선의 2단 구성.'] },
  { id:'u1-l4-07', level:4, type:'num', tags:['대칭 깨기'], src:'기출 유형',
    params:{ q:{choices:[2,4],unit:'µC'}, a:{choices:[10,20],unit:'cm'} },
    statement:function(p){ return '정육각형(변 a='+p.a+' cm) 꼭짓점에 +q 다섯 개(+q='+p.q+' µC), 한 자리는 빈다. 중심 전기장의 크기(N/C)와 방향(빈 곳 쪽=1/반대쪽=−1)을 구하라.'; },
    solve:function(p){
      var E=8.99e9*p.q*1e-6/Math.pow(p.a/100,2);
      return { ans:{E:E, dir:-1}, unit:{E:'N/C', dir:''}, steps:[
        '여섯 개 꽉 차면 0 → 다섯 개 = (여섯) − (빈자리 하나) = −(빈자리 전하의 장)',
        '크기 = kq/a² = '+SVH.fmt(E)+' N/C (정육각형은 중심거리=변)',
        '방향: 빈자리 전하가 밀었을 방향의 반대 = 빈 곳 반대쪽... 정확히는 "+q가 있었다면 미는 방향"의 역 → 빈 곳에서 중심으로 향하던 척력의 반대 = 중심→빈곳 반대(−1)' ] }; },
    hints:['결손법(l3-11)의 재등장.'] },
  { id:'u1-l4-08', level:4, type:'num', tags:['3전하 벡터 완주'], src:'기출 유형',
    params:{ q:{choices:[1,2],unit:'µC'}, a:{choices:[30,50],unit:'cm'} },
    statement:function(p){ return '직각이등변: 원점 O에 −2q, (a,0)에 +q, (0,a)에 +q (q='+p.q+' µC, a='+p.a+' cm). 점 (a,a)에서 장의 크기(N/C)를 구하라.'; },
    solve:function(p){
      var a=p.a/100, k=8.99e9, q=p.q*1e-6;
      // +q at (a,0): 점(a,a) → 방향 (0,1), 거리 a → E=kq/a² ŷ
      // +q at (0,a): 방향 (1,0), E=kq/a² x̂
      // -2q at O: 거리 √2 a, 장은 점→O 방향 = (−1/√2,−1/√2), 크기 k2q/2a²=kq/a²
      var E1=k*q/(a*a);
      var Ex=E1-E1/Math.SQRT2, Ey=E1-E1/Math.SQRT2;
      var E=Math.hypot(Ex,Ey);
      return { ans:E, unit:'N/C', steps:[
        '+q들: 각각 x̂, ŷ로 kq/a² = '+SVH.fmt(E1),
        '−2q: 거리 √2a → 크기 k(2q)/(2a²)=kq/a², 방향 (−1,−1)/√2',
        '합: ('+SVH.fmt(Ex)+', '+SVH.fmt(Ey)+') → |E| = '+SVH.fmt(E)+' N/C (대각선 방향)' ] }; },
    hints:['세 벡터를 성분으로 — 음전하 방향 주의.'] }
  ]
});

  { id:'u2-l2-12', level:2, type:'num', tags:['밀도 환산'], src:'창작 문제(검산됨)',

  { id:'u2-l3-01', level:3, type:'num', tags:['구 전 영역'], src:'기출 유형',
    params:{ Q:{choices:[6,9],unit:'µC'}, R:{choices:[30,60],unit:'cm'} },
    statement:function(p){ return '균일 절연구(Q='+p.Q+' µC, R='+p.R+' cm)에서 장이 최대인 위치와 그 값(N/C), 그리고 E가 표면값의 절반이 되는 내부·외부 위치(cm) 두 곳을 구하라.'; },

    hints:['내부 선형·외부 역제곱.'] },
  { id:'u2-l3-02', level:3, type:'num', tags:['동심 구각+도체'], src:'기출 유형',
    params:{ q:{choices:[2,4],unit:'µC'}, Q:{choices:[6,10],unit:'µC'} },
    statement:function(p){ return '중심에 점전하 +q('+p.q+' µC), 이를 감싼 중성 도체 구각(안 R₁, 밖 R₂). (a) 구각 안쪽 표면의 유도 전하 (b) 바깥 표면 전하 (c) 구각에 +Q('+p.Q+' µC)를 더 주면 바깥 표면 전하(µC)는?'; },
    solve:function(p){
      return { ans:{qin:-p.q, qout1:p.q, qout2:p.q+p.Q}, unit:{qin:'µC', qout1:'µC', qout2:'µC'}, steps:[
        '도체 내부 가우스면: E=0 → q_enc=0 → 안쪽 표면 −q = '+(-p.q)+' µC',
        '중성 보존 → 바깥 +q = '+p.q+' µC',
        '+Q 추가는 전부 바깥으로: '+(p.q+p.Q)+' µC (내부 배치는 불변!)' ] }; },
    hints:['도체 속 가우스면에서 출발.'] },
  { id:'u2-l3-03', level:3, type:'num', tags:['비균일 ρ(r)'], src:'기출 유형',
    params:{ a:{choices:[2,5],unit:'µC/m⁴'}, R:{choices:[10,20],unit:'cm'} },
    statement:function(p){ return 'ρ(r)=ar (a='+p.a+' µC/m⁴)인 구(R='+p.R+' cm). (a) 총 전하(µC) (b) 내부 r에서 E(r)=ar²/(4ε₀)를 r=R/2에서 계산하라(N/C).'; },
    solve:function(p){
      var R=p.R/100, a=p.a*1e-6;
      var Q=a*Math.PI*Math.pow(R,4)*1e6; // ∫ar·4πr²dr = aπR⁴
      var E=a*Math.pow(R/2,2)/(4*8.85e-12);
      return { ans:{Q:Q, E:E}, unit:{Q:'µC', E:'N/C'}, steps:[
        'Q = ∫₀ᴿ ar·4πr²dr = aπR⁴ = '+SVH.fmt(Q)+' µC',
        'q_enc(r) = aπr⁴ → E = q_enc/(4πε₀r²) = ar²/4ε₀',
        'r=R/2: '+SVH.fmt(E)+' N/C (비균일이면 "부피비"가 아니라 적분!)' ] }; },
    hints:['dq=ρ·4πr²dr 적분.'] },
  { id:'u2-l3-04', level:3, type:'num', tags:['두 평면 3영역'], src:'기출 유형',
    params:{ s1:{choices:[4,6],unit:'µC/m²'}, s2:{choices:[2,3],unit:'µC/m²'} },
    statement:function(p){ return '평행 평면 A(+'+p.s1+' µC/m²), B(+'+p.s2+' µC/m²). 세 영역(왼·사이·오른)의 장 크기(N/C)를 구하라.'; },
    solve:function(p){
      var e=8.85e-12;
      var EL=(p.s1+p.s2)*1e-6/(2*e), EM=Math.abs(p.s1-p.s2)*1e-6/(2*e);
      return { ans:{EL:EL, EM:EM, ER:EL}, unit:{EL:'N/C', EM:'N/C', ER:'N/C'}, steps:[
        '왼쪽: 둘 다 왼쪽으로 σ/2ε₀ → (σ₁+σ₂)/2ε₀ = '+SVH.fmt(EL),
        '사이: 반대 방향 → |σ₁−σ₂|/2ε₀ = '+SVH.fmt(EM),
        '오른쪽: '+SVH.fmt(EL)+' (같은 부호 두 판의 3영역 패턴)' ] }; },
    hints:['영역별 화살표 더하기.'] },
  { id:'u2-l3-05', level:3, type:'num', tags:['동축 케이블'], src:'기출 유형',
    params:{ lam:{choices:[2,4],unit:'µC/m'}, r:{choices:[1,3],unit:'cm'} },
    statement:function(p){ return '동축: 안쪽 도선 +λ('+p.lam+' µC/m), 바깥 도체관(중성, 안 2 cm·밖 4 cm... r로 일반화). (a) 도선-관 사이 r='+p.r+' cm의 E (b) 관 벽 내부의 E (c) 관 안쪽 표면의 선밀도(µC/m)를 구하라.'; },
    solve:function(p){
      var E=p.lam*1e-6/(2*Math.PI*8.85e-12*p.r/100);
      return { ans:{E:E, Ewall:0, lin:-p.lam}, unit:{E:'N/C', Ewall:'N/C', lin:'µC/m'}, steps:[
        '사이: E = λ/2πε₀r = '+SVH.fmt(E)+' N/C',
        '관 벽 속: 도체 → 0 → 안쪽 표면에 −λ = '+(-p.lam)+' µC/m 유도',
        '(바깥 표면 +λ — 동심 구각의 원통 버전)' ] }; },
    hints:['벽 안 가우스 원통.'] },
  { id:'u2-l3-06', level:3, type:'num', tags:['균일장+점전하 선속'], src:'창작 문제(검산됨)',
    params:{ E:{choices:[100,300],unit:'N/C'}, R:{choices:[10,20],unit:'cm'}, q:{choices:[2,5],unit:'nC'} },
    statement:function(p){ return '균일 장 '+p.E+' N/C 속에 점전하 q='+p.q+' nC를 중심에 품은 반지름 R='+p.R+' cm 구면. 구면을 나가는 총 선속(N·m²/C)은?'; },
    solve:function(p){ var F=p.q*1e-9/8.85e-12;
      return { ans:F, unit:'N·m²/C', steps:[
        '균일 장의 닫힌면 선속 = 0 (들어온 만큼 나감)',
        '남는 것은 q/ε₀ = '+SVH.fmt(F)+' (R·E값 무관 — 법칙의 힘)' ] }; },
    hints:['중첩으로 분리.'] },
  { id:'u2-l3-07', level:3, type:'num', tags:['판+시트 도체 조합'], src:'기출 유형',
    params:{ sig:{choices:[3,6],unit:'µC/m²'} },
    statement:function(p){ return '접지 안 된 중성 도체 평판을 무한 시트(+σ='+p.sig+' µC/m²) 옆에 평행하게 놓았다. 도체 양면에 유도되는 면밀도(µC/m²)와 도체 내부 E를 구하라.'; },
    solve:function(p){
      return { ans:{near:-p.sig/2, far:p.sig/2, Ein:0}, unit:{near:'µC/m²', far:'µC/m²', Ein:'N/C'}, steps:[
        '내부 E=0 조건: 시트의 σ/2ε₀를 유도 전하가 상쇄해야',
        '가까운 면 −σ/2 = '+SVH.fmt(-p.sig/2)+', 먼 면 +σ/2 = '+SVH.fmt(p.sig/2)+' (중성 유지)',
        '(도체가 장을 "정리"하는 방식 — 유도 배치는 항상 내부 0 조건에서 역산)' ] }; },
    hints:['내부 0을 방정식으로.'] },
  { id:'u2-l3-08', level:3, type:'num', tags:['공동(cavity) 전하'], src:'기출 유형',
    params:{ q:{choices:[3,7],unit:'µC'}, Q:{choices:[5,9],unit:'µC'} },
    statement:function(p){ return '전하 +Q('+p.Q+' µC)를 가진 도체 안 공동에 점전하 +q('+p.q+' µC)가 있다. (a) 공동 벽 전하 (b) 도체 바깥 표면 전하(µC) (c) 바깥 장이 공동 속 q의 "위치"에 의존하는가(0=아니오)?'; },
    solve:function(p){
      return { ans:{wall:-p.q, out:p.q+p.Q, dep:0}, unit:{wall:'µC', out:'µC', dep:''}, steps:[
        '벽: −q = '+(-p.q)+' µC (도체 속 가우스면)',
        '바깥: Q+q = '+(p.q+p.Q)+' µC',
        '바깥 분포는 구형 대칭 유지 → 위치 무관(0) — 정전 차폐의 절반(안→밖 정보는 총량만)' ] }; },
    hints:['차폐 논리.'] },
  { id:'u2-l3-09', level:3, type:'num', tags:['원판 축상 장'], src:'교재 표준',
    params:{ sig:{choices:[2,4],unit:'µC/m²'}, R:{choices:[10,20],unit:'cm'}, z:{choices:[5,10],unit:'cm'} },
    statement:function(p){ return '원판(σ='+p.sig+' µC/m², R='+p.R+' cm) 축 위 z='+p.z+' cm에서 \\(E=\\dfrac{\\sigma}{2\\varepsilon_0}\\left[1-\\dfrac{z}{\\sqrt{z^2+R^2}}\\right]\\)를 계산하라(N/C).'; },
    solve:function(p){
      var z=p.z/100, R=p.R/100;
      var E=p.sig*1e-6/(2*8.85e-12)*(1-z/Math.hypot(z,R));
      return { ans:E, unit:'N/C', steps:[
        '대입: '+SVH.fmt(E)+' N/C',
        '극한 확인: z→0 ⇒ σ/2ε₀(무한판) ✓, z≫R ⇒ kQ/z²(점전하) ✓ — 기획서에도 있는 그 극한 체크' ] }; },
    hints:['링 적분 결과 공식.'] },
  { id:'u2-l3-10', level:3, type:'num', tags:['평면+판 사이 힘'], src:'창작 문제(검산됨)',
    params:{ sig:{choices:[5,10],unit:'µC/m²'}, A:{choices:[0.01,0.04],unit:'m²'} },
    statement:function(p){ return '축전기 한 판(σ='+p.sig+' µC/m², 면적 A='+p.A+' m²)이 상대 판의 장에서 받는 힘 F=σ²A/(2ε₀)를 계산하라(N). 왜 σ/ε₀가 아니라 σ/2ε₀를 쓰는가?'; },
    solve:function(p){
      var F=Math.pow(p.sig*1e-6,2)*p.A/(2*8.85e-12);
      return { ans:F, unit:'N', steps:[
        '판이 느끼는 장 = "상대 판"의 장 σ/2ε₀ (자기 장은 자기에게 힘 못 줌)',
        'F = qE = (σA)(σ/2ε₀) = '+SVH.fmt(F)+' N',
        '(정전 인력 — 축전기 판이 서로 당기는 힘, U4 에너지법과 교차 검산 가능)' ] }; },
    hints:['자기장 제외 원칙.'] },
  { id:'u2-l3-11', level:3, type:'num', tags:['구멍 뚫린 평면'], src:'기출 유형',
    params:{ sig:{choices:[4,8],unit:'µC/m²'}, R:{choices:[5,10],unit:'cm'}, z:{choices:[5,10],unit:'cm'} },
    statement:function(p){ return '무한 평면(σ='+p.sig+' µC/m²)에 반지름 R='+p.R+' cm 원형 구멍. 구멍 축 위 z='+p.z+' cm의 장(N/C)을 결손법으로 구하라.'; },
    solve:function(p){
      var z=p.z/100, R=p.R/100;
      var E=p.sig*1e-6/(2*8.85e-12)*(z/Math.hypot(z,R));
      return { ans:E, unit:'N/C', steps:[
        '평면 − 원판: σ/2ε₀ − σ/2ε₀[1−z/√(z²+R²)]',
        '= (σ/2ε₀)·z/√(z²+R²) = '+SVH.fmt(E)+' N/C',
        '(구멍 멀리서는 평면값 복원, 중심에서 0 — 극한 2개 확인)' ] }; },
    hints:['U1 결손법 + l3-09 공식.'] },
  { id:'u2-l3-12', level:3, type:'num', tags:['부분 삽입 전하'], src:'창작 문제(검산됨)',
    params:{ q:{choices:[4,8],unit:'µC'} },
    statement:function(p){ return '점전하 q='+p.q+' µC가 반구형 그릇의 평평한 면 중심(테두리 평면 위)에 있다. 반구 곡면을 지나는 선속(N·m²/C)은?'; },
    solve:function(p){ var F=p.q*1e-6/(2*8.85e-12);
      return { ans:F, unit:'N·m²/C', steps:[
        '전하를 완전히 감싸려면 구 전체 → 반구는 절반',
        'Φ = q/2ε₀ = '+SVH.fmt(F)+' (분배 논법의 변형)' ] }; },
    hints:['입체각 절반.'] },
  { id:'u2-l3-13', level:3, type:'num', tags:['내부 공동 장(중첩)'], src:'기출 유형',
    params:{ rho:{choices:[2,4],unit:'µC/m³'}, d:{choices:[5,10],unit:'cm'} },
    statement:function(p){ return '균일 ρ='+p.rho+' µC/m³ 구에 중심에서 d='+p.d+' cm 벗어난 구형 공동을 팠다. 공동 내부의 장은 균일하며 E=ρd/(3ε₀)임을 이용해 값을 구하라(N/C).'; },
    solve:function(p){
      var E=p.rho*1e-6*(p.d/100)/(3*8.85e-12);
      return { ans:E, unit:'N/C', steps:[
        '중첩: 꽉 찬 구(ρ) + 공동 자리 −ρ 구',
        '내부 장 ρr/3ε₀끼리 빼면 위치 무관 ρd/3ε₀ = '+SVH.fmt(E)+' N/C',
        '(균일! — 중첩의 백미, 기출 스타일 증명형)' ] }; },
    hints:['두 구의 내부 장 공식 빼기.'] },
  { id:'u2-l3-14', level:3, type:'num', tags:['원통 전 영역'], src:'기출 유형',
    params:{ rho:{choices:[3,6],unit:'µC/m³'}, R:{choices:[10,20],unit:'cm'} },
    statement:function(p){ return '균일 ρ='+p.rho+' µC/m³ 무한 원통(R='+p.R+' cm)의 (a) 내부 r=R/2 (b) 표면 (c) 외부 r=2R의 장(N/C)을 구하라.'; },
    solve:function(p){
      var R=p.R/100, rho=p.rho*1e-6, e=8.85e-12;
      var Ein=rho*(R/2)/(2*e), Es=rho*R/(2*e), Eout=rho*R*R/(2*e*2*R);
      return { ans:{Ein:Ein, Es:Es, Eout:Eout}, unit:{Ein:'N/C', Es:'N/C', Eout:'N/C'}, steps:[
        '내부: E = ρr/2ε₀ → r=R/2: '+SVH.fmt(Ein),
        '표면: ρR/2ε₀ = '+SVH.fmt(Es),
        '외부: ρR²/(2ε₀r) → r=2R: '+SVH.fmt(Eout)+' (내부 ∝r, 외부 ∝1/r)' ] }; },
    hints:['원통 가우스면 두 번.'] },

  /* ---------- L4 (8) ---------- */
  { id:'u2-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'옳은 것을 모두 고르면?<br>㉠ 가우스 법칙은 대칭이 없어도 성립한다(계산 도구로서만 대칭 필요)<br>㉡ 도체 공동 속 전하는 밖에서 총량만 보이고 위치는 차폐된다<br>㉢ 균일 구 내부 E는 r에 비례한다<br>㉣ 무한 평면의 E가 거리 무관인 것은 장선이 퍼질 곳이 없기 때문이다',
    choices:['전부','㉠㉡㉢','㉡㉢㉣','㉠㉣'],
    answer:0, expl:'전부 참 — 특히 ㉠(법칙 vs 도구)의 구분이 개념 문항 단골.' },
  { id:'u2-l4-02', level:4, type:'num', tags:['3층 구조 완주'], src:'기출 유형',
    params:{ q:{choices:[2,4],unit:'µC'}, rho:{choices:[1,2],unit:'µC/m³'}, R1:{choices:[10],unit:'cm'}, R2:{choices:[20],unit:'cm'} },
    statement:function(p){ return '중심 점전하 +q('+p.q+' µC) + 그를 감싼 균일 대전 껍질층(R₁='+p.R1+'~R₂='+p.R2+' cm, ρ='+p.rho+' µC/m³). (a) 껍질층 총 전하(µC) (b) r=15 cm에서 E (c) r=30 cm에서 E(N/C)를 구하라.'; },
    solve:function(p){
      var R1=p.R1/100, R2=p.R2/100, r=0.15;
      var Qsh=p.rho*(4/3*Math.PI*(Math.pow(R2,3)-Math.pow(R1,3))); // µC
      var qenc=p.q+p.rho*(4/3*Math.PI*(Math.pow(r,3)-Math.pow(R1,3)));
      var E15=8.99e9*qenc*1e-6/(r*r);
      var E30=8.99e9*(p.q+Qsh)*1e-6/(0.3*0.3);
      return { ans:{Qsh:Qsh, E15:E15, E30:E30}, unit:{Qsh:'µC', E15:'N/C', E30:'N/C'}, steps:[
        'Q_shell = ρ·(4π/3)(R₂³−R₁³) = '+SVH.fmt(Qsh)+' µC',
        'r=15cm: q_enc = q+ρ(4π/3)(r³−R₁³) = '+SVH.fmt(qenc)+' µC → E = '+SVH.fmt(E15),
        'r=30cm: 전체 '+SVH.fmt(p.q+Qsh)+' µC → E = '+SVH.fmt(E30)+' N/C' ] }; },
    hints:['영역마다 q_enc 재계산.'] },
  { id:'u2-l4-03', level:4, type:'derive', tags:['유도'], src:'강의자료 대조',
    statement:'가우스 법칙에서 도체의 3성질(내부 E=0 → 전하는 표면 → 표면장 σ/ε₀ 수직)을 순서대로 유도하라.',
    steps:[
      '정전 평형 정의: 전하가 안 움직인다 → 내부 자유전하에 힘 0 → 내부 \\(\\vec E=0\\) [왜] E≠0이면 전류가 흘러 "평형"이 아님',
      '내부 임의 가우스면: E=0 → Φ=0 → q_enc=0 어디서나 → 과잉 전하는 내부에 있을 수 없다 → 전부 표면으로',
      '표면 평행 성분: 있다면 표면 전류 → 평형 위배 → E는 표면 수직',
      '필박스(한 면은 도체 안): EA = σA/ε₀ → \\(E=\\sigma/\\varepsilon_0\\) — 무한판의 2배인 이유는 안쪽 면 선속이 0이라서',
      '극한 체크: σ→0 ⇒ E→0 ✓ · 차원 [C/m²]/[C²/N·m²]=[N/C] ✓'
    ],
    hints:['평형 정의 → 가우스 → 필박스 3연쇄.','각 단계가 앞 단계를 전제로.'],
    expl:'서술형 최빈출 — "왜"를 잇는 사슬을 통째로 재현할 수 있어야 한다.' },
  { id:'u2-l4-04', level:4, type:'num', tags:['비균일+최대점'], src:'기출 유형',
    params:{ rho0:{choices:[2,4],unit:'µC/m³'}, R:{choices:[10,20],unit:'cm'} },
    statement:function(p){ return 'ρ(r)=ρ₀(1−r/R) (ρ₀='+p.rho0+' µC/m³, R='+p.R+' cm) 구. (a) 총 전하(µC) (b) 내부 E(r)=ρ₀r(4−3r/R)/(12ε₀)이 최대가 되는 r(cm) (c) 그 최대값(N/C)을 구하라.'; },
    solve:function(p){
      var R=p.R/100, r0=p.rho0*1e-6;
      var Q=r0*Math.PI*Math.pow(R,3)/3*1e6; // ∫ρ4πr² = 4πρ0(R³/3−R³/4)=πρ0R³/3
      var rm=2*R/3;
      var Em=r0*rm*(4-3*rm/R)/(12*8.85e-12);
      return { ans:{Q:Q, rm:rm*100, Em:Em}, unit:{Q:'µC', rm:'cm', Em:'N/C'}, steps:[
        'Q = 4πρ₀(R³/3−R³/4) = πρ₀R³/3 = '+SVH.fmt(Q)+' µC',
        'dE/dr=0: 4−6r/R=0 → r = 2R/3 = '+SVH.fmt(rm*100)+' cm',
        'E_max = '+SVH.fmt(Em)+' N/C (표면이 아닌 내부에 봉우리 — 균일 구와 대비)' ] }; },
    hints:['적분→미분 2연타.'] },
  { id:'u2-l4-05', level:4, type:'num', tags:['평면 3장 배열'], src:'기출 유형',
    params:{ s:{choices:[2,3],unit:'µC/m²'} },
    statement:function(p){ return '평행 시트 셋: σ₁=+'+p.s+', σ₂=−2·'+p.s+', σ₃=+'+p.s+' µC/m² (왼→오른). 네 영역 중 (a) 1–2 사이 (b) 2–3 사이의 장 크기(N/C)와 방향(+x=1/−x=−1)을 구하라.'; },
    solve:function(p){
      var e2=2*8.85e-12, s=p.s*1e-6;
      // 영역 II: +s/2e(우) +2s/2e(우? -2s 시트가 왼쪽에 있으면 장은 시트 쪽 → 좌?) 정리:
      // E(x) 방향 +x 기준: II: σ1 오른쪽(+s/2e), σ2 왼쪽으로 당김? -2s 시트의 장은 시트를 향함 → II에선 +x(시트가 오른쪽) → +2s/2e, σ3: 왼쪽(-s/2e)
      var E12=(s/e2)+(2*s/e2)-(s/e2);

  { id:'u2-l4-06', level:4, type:'num', tags:['도체 사이 평형'], src:'기출 유형',

  { id:'u2-l4-07', level:4, type:'num', tags:['선+원통 조합'], src:'기출 유형',
    params:{ lam:{choices:[3,5],unit:'µC/m'}, lam2:{choices:[-2,-4],unit:'µC/m'}, r:{choices:[10,20],unit:'cm'} },
    statement:function(p){ return '축선 λ₁='+p.lam+' µC/m + 동축 원통껍질(반지름 5 cm) λ₂='+p.lam2+' µC/m. r='+p.r+' cm(껍질 밖)의 E(N/C)와, E=0이 되는 영역이 존재하는지(밖=0/안=1/없음=−1)를 구하라.'; },

    hints:['영역별 λ_enc.'] },
  { id:'u2-l4-08', level:4, type:'num', tags:['선속 미분형 맛보기'], src:'강의자료 대조',
    params:{ a:{choices:[100,200],unit:'N/C/m'}, L:{choices:[10,20],unit:'cm'} },
    statement:function(p){ return '장이 \\(\\vec E=(a x)\\hat x\\) (a='+p.a+' N/C/m)인 영역의 한 변 L='+p.L+' cm 정육면체(한 꼭짓점 원점). (a) 총 선속 (b) 내부 전하(pC)를 구하라.'; },

      return { ans:{F:F, q:q}, unit:{F:'N·m²/C', q:'pC'}, steps:[

    hints:['마주보는 면의 차만 남는다.'] }
  ]
});

      return { ans:dv, unit:'V', steps:[
        'ΔV = ∫E dr = (λ/2πε₀)ln(r₂/r₁)',
        '= '+SVH.fmt(dv)+' V (무한대 기준이 불가한 대표 사례 — 차이만 정의)' ] }; },
    hints:['1/r 적분 = ln.'] },

  /* ---------- L3 (14) ---------- */
  { id:'u3-l3-01', level:3, type:'num', tags:['균일구 전위 프로파일'], src:'기출 유형',
    params:{ Q:{choices:[4,8],unit:'µC'}, R:{choices:[20,40],unit:'cm'} },
    statement:function(p){ return '균일 절연구(Q='+p.Q+' µC, R='+p.R+' cm)의 (a) 표면 전위 (b) 중심 전위 V(0)=3kQ/2R (V)를 구하라. 중심이 표면보다 높은 이유는?'; },
    solve:function(p){
      var Vs=8.99e9*p.Q*1e-6/(p.R/100);
      return { ans:{Vs:Vs, V0:1.5*Vs}, unit:{Vs:'V', V0:'V'}, steps:[
        'V_s = kQ/R = '+SVH.fmt(Vs)+' V',
        'V(0) = (3/2)kQ/R = '+SVH.fmt(1.5*Vs)+' V',
        '내부에도 E가 안쪽을 향해 있어 들어갈수록 오르막 — 도체(평평)와 대비' ] }; },
    hints:['내부 E∝r 적분.'] },
  { id:'u3-l3-02', level:3, type:'num', tags:['탈출 속도형'], src:'기출 유형',
    params:{ q:{choices:[2,4],unit:'µC'}, m:{choices:[1,2],unit:'g'}, Q:{choices:[5,10],unit:'µC'}, r0:{choices:[10,20],unit:'cm'} },
    statement:function(p){ return '고정 +Q('+p.Q+' µC)에서 r₀='+p.r0+' cm에 있던 +q('+p.q+' µC, '+p.m+' g)를 놓았다. 무한대에서의 속력(m/s)은?'; },
    solve:function(p){
      var U=8.99e9*p.Q*1e-6*p.q*1e-6/(p.r0/100);
      var v=Math.sqrt(2*U/(p.m/1000));
      return { ans:v, unit:'m/s', steps:[
        'U = kQq/r₀ = '+SVH.fmt(U)+' J → 전부 KE로',
        'v = √(2U/m) = '+SVH.fmt(v)+' m/s' ] }; },
    hints:['보존 한 줄.'] },
  { id:'u3-l3-03', level:3, type:'num', tags:['최접근 거리'], src:'기출 유형',
    params:{ E0:{choices:[2,5],unit:'MeV'}, Z:{choices:[79]} },
    statement:function(p){ return '알파 입자(q=2e, KE='+p.E0+' MeV)가 금 원자핵(Z='+p.Z+')을 정면 돌진. 최접근 거리(fm)를 구하라. (러더퍼드)'; },
    solve:function(p){
      var d=8.99e9*2*p.Z*Math.pow(1.602e-19,2)/(p.E0*1e6*1.602e-19)*1e15;
      return { ans:d, unit:'fm', steps:[
        'KE = k(2e)(Ze)/d → d = 2Zke²/KE',
        '= '+SVH.fmt(d)+' fm (10⁻¹⁴ m — 핵 크기의 발견 논리, 기말 양자 파트 예고)' ] }; },
    hints:['정지점 = 전부 퍼텐셜.'] },
  { id:'u3-l3-04', level:3, type:'num', tags:['축상 V→E 유도'], src:'기출 유형',
    params:{ Q:{choices:[2,4],unit:'µC'}, R:{choices:[10,20],unit:'cm'}, z:{choices:[10,20],unit:'cm'} },
    statement:function(p){ return '링 전위 V(z)=kQ/√(z²+R²)를 미분해 E_z=−dV/dz를 구하고 z='+p.z+' cm에서 값(N/C)을 U1의 직접 결과와 비교하라.'; },
    solve:function(p){
      var z=p.z/100, R=p.R/100;
      var E=8.99e9*p.Q*1e-6*z/Math.pow(z*z+R*R,1.5);
      return { ans:E, unit:'N/C', steps:[
        '−d/dz[kQ(z²+R²)^{−1/2}] = kQz/(z²+R²)^{3/2}',
        '= '+SVH.fmt(E)+' N/C — U1 적분 결과와 동일 ✓',
        '(V 먼저 → 미분이 벡터 적분보다 쉽다는 것의 실증)' ] }; },
    hints:['연쇄율 미분.'] },
  { id:'u3-l3-05', level:3, type:'num', tags:['두 도체구 연결'], src:'기출 유형',
    params:{ R1:{choices:[10,20],unit:'cm'}, R2:{choices:[30,40],unit:'cm'}, Q:{choices:[8,12],unit:'µC'} },
    statement:function(p){ return '전하 Q='+p.Q+' µC를 가진 R₁='+p.R1+' cm 구를 먼 곳의 중성 R₂='+p.R2+' cm 구와 도선으로 연결. 평형 후 (a) 각 전하 q₁·q₂(µC) (b) 공통 전위(V)를 구하라.'; },
    solve:function(p){
      var q1=p.Q*p.R1/(p.R1+p.R2), q2=p.Q*p.R2/(p.R1+p.R2);
      var V=8.99e9*q1*1e-6/(p.R1/100);
      return { ans:{q1:q1, q2:q2, V:V}, unit:{q1:'µC', q2:'µC', V:'V'}, steps:[
        '조건: V₁=V₂ → q∝R',
        'q₁ = QR₁/(R₁+R₂) = '+SVH.fmt(q1)+', q₂ = '+SVH.fmt(q2)+' µC',
        'V = kq₁/R₁ = '+SVH.fmt(V)+' V (큰 구가 전하를 더 — 그러나 표면장은 작은 구가 세다: σ∝1/R, 피뢰침!)' ] }; },
    hints:['등전위 조건.'] },
  { id:'u3-l3-06', level:3, type:'num', tags:['평행판 사이 운동'], src:'기출 유형',
    params:{ V:{choices:[200,400],unit:'V'}, d:{choices:[2,4],unit:'cm'} },
    statement:function(p){ return '전위차 '+p.V+' V, 간격 d='+p.d+' cm 평행판에서 (a) 장(V/m) (b) −판에서 놓은 전자가 +판에 닿는 속력(m/s) (c) 걸린 시간(ns)을 구하라.'; },
    solve:function(p){
      var E=p.V/(p.d/100);
      var v=Math.sqrt(2*1.602e-19*p.V/9.11e-31);
      var a=1.602e-19*E/9.11e-31;
      var t=v/a*1e9;
      return { ans:{E:E, v:v, t:t}, unit:{E:'V/m', v:'m/s', t:'ns'}, steps:[
        'E = V/d = '+SVH.fmt(E)+' V/m',
        'v = √(2eV/m) = '+SVH.fmt(v)+' m/s (거리 무관 — 에너지는 전위차만)',
        't = v/a = '+SVH.fmt(t)+' ns' ] }; },
    hints:['에너지로 v, 운동학으로 t.'] },
  { id:'u3-l3-07', level:3, type:'num', tags:['쌍극자 전위'], src:'교재 표준',
    params:{ pm:{choices:[2,5],unit:'×10⁻⁹ C·m'}, r:{choices:[10,20],unit:'cm'}, th:{choices:[0,60]} },
    statement:function(p){ return '쌍극자(p='+p.pm+'×10⁻⁹ C·m) 원거리 전위 V=kp cosθ/r²를 r='+p.r+' cm, θ='+p.th+'°에서 계산하라(V).'; },
    solve:function(p){
      var V=8.99e9*p.pm*1e-9*Math.cos(SVH.rad(p.th))/Math.pow(p.r/100,2);
      return { ans:V, unit:'V', steps:[
        'V = kp cosθ/r² = '+SVH.fmt(V)+' V',
        '(1/r² 감쇠·θ=90°에서 0 — 수직이등분면 전체가 V=0 등전위면)' ] }; },
    hints:['공식 대입+대칭 해석.'] },
  { id:'u3-l3-08', level:3, type:'num', tags:['에너지로 배치 비교'], src:'기출 유형',
    params:{ q:{choices:[1,2],unit:'µC'}, a:{choices:[10,20],unit:'cm'} },
    statement:function(p){ return '정사각형(변 a='+p.a+' cm) 꼭짓점의 +q 넷(q='+p.q+' µC) 조립 에너지 U=(4+√2)kq²/a... 정확히는 (4+√2)·kq²/a인지 유도 계산하라(J).'; },
    solve:function(p){
      var kqa=8.99e9*Math.pow(p.q*1e-6,2)/(p.a/100);
      var U=(4+Math.SQRT2)*kqa;
      return { ans:U, unit:'J', steps:[
        '변 쌍 4개(거리 a) + 대각 쌍 2개(거리 √2a)',
        'U = 4kq²/a + 2kq²/√2a = (4+√2)kq²/a = '+SVH.fmt(U)+' J' ] }; },
    hints:['쌍 6개를 거리별로.'] },
  { id:'u3-l3-09', level:3, type:'num', tags:['V(x,y)→E벡터'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[2,4]}, b:{choices:[3,6]}, x:{choices:[1,2]}, y:{choices:[1,2]} },
    statement:function(p){ return 'V(x,y)='+p.a+'x²y−'+p.b+'y² [V]. 점 ('+p.x+','+p.y+')에서 E의 (a) x성분 (b) y성분 (c) 크기(V/m)를 구하라.'; },
    solve:function(p){
      var Ex=-2*p.a*p.x*p.y, Ey=-(p.a*p.x*p.x-2*p.b*p.y);
      return { ans:{Ex:Ex, Ey:Ey, E:Math.hypot(Ex,Ey)}, unit:{Ex:'V/m', Ey:'V/m', E:'V/m'}, steps:[
        'E_x = −∂V/∂x = −2axy = '+SVH.fmt(Ex),
        'E_y = −∂V/∂y = −(ax²−2by) = '+SVH.fmt(Ey),
        '|E| = '+SVH.fmt(Math.hypot(Ex,Ey))+' V/m (그래디언트의 실전)' ] }; },
    hints:['편미분 두 번.'] },
  { id:'u3-l3-10', level:3, type:'num', tags:['전자총 설계'], src:'기출 유형',
    params:{ v:{choices:[1,2],unit:'×10⁷ m/s'} },
    statement:function(p){ return '전자를 v='+p.v+'×10⁷ m/s로 가속하려면 필요한 전압(V)은? 양성자를 같은 속력으로 가속하려면 몇 배 전압이 필요한가? (m_p/m_e=1836)'; },
    solve:function(p){
      var v=p.v*1e7;
      var V=0.5*9.11e-31*v*v/1.602e-19;
      return { ans:{V:V, ratio:1836}, unit:{V:'V', ratio:'배'}, steps:[
        'V = mv²/2e = '+SVH.fmt(V)+' V',
        '같은 v → 에너지 ∝ m → 1836배 (같은 "전압"이면 같은 에너지지만 속력은 다르다 — 구분!)' ] }; },
    hints:['eV=½mv².'] },
  { id:'u3-l3-11', level:3, type:'num', tags:['동심 도체 전위'], src:'기출 유형',
    params:{ q:{choices:[2,4],unit:'µC'}, R1:{choices:[10],unit:'cm'}, R2:{choices:[20],unit:'cm'}, R3:{choices:[30],unit:'cm'} },
    statement:function(p){ return '중심 점전하 +q('+p.q+' µC), 중성 도체 구각(안 R₂='+p.R2+', 밖 R₃='+p.R3+' cm). r=R₁='+p.R1+' cm 지점(구각 안 빈 공간)의 전위(V)를 구하라. (세 구간 적분 합)'; },
    solve:function(p){
      var k=8.99e9, q=p.q*1e-6;
      var V=k*q*(1/(p.R1/100)-1/(p.R2/100)+1/(p.R3/100));
      return { ans:V, unit:'V', steps:[
        'V(R₁) = ∫∞→R₃(점전하) + 0(도체 내) + ∫R₂→R₁(점전하)',
        '= kq[1/R₁−1/R₂+1/R₃] = '+SVH.fmt(V)+' V',
        '(도체 구간은 "전위 유지" — 구간별 적분의 표준 기출형)' ] }; },
    hints:['E(r) 구간별로 적분.'] },
  { id:'u3-l3-12', level:3, type:'num', tags:['수소 원자 에너지'], src:'교재 표준',
    params:{ r:{choices:[0.0529],unit:'nm'} },
    statement:function(p){ return '보어 반지름 r='+p.r+' nm의 수소: (a) 퍼텐셜 U=−ke²/r(eV) (b) KE=+ke²/2r(eV) (c) 총 에너지(eV)를 구하라.'; },
    solve:function(p){
      var U=-8.99e9*Math.pow(1.602e-19,2)/(p.r*1e-9)/1.602e-19;
      return { ans:{U:U, K:-U/2, E:U/2}, unit:{U:'eV', K:'eV', E:'eV'}, steps:[
        'U = −ke²/r = '+SVH.fmt(U)+' eV',
        'KE(원운동 조건) = −U/2 = '+SVH.fmt(-U/2)+' eV',
        'E = U/2 = '+SVH.fmt(U/2)+' eV ≈ −13.6 eV (기말 양자화의 준비 — 비리얼)' ] }; },
    hints:['쿨롱=구심력 조건.'] },
  { id:'u3-l3-13', level:3, type:'num', tags:['도체구 최대 전압'], src:'기출 유형',
    params:{ R:{choices:[10,30],unit:'cm'}, Eb:{choices:[3],unit:'MV/m'} },
    statement:function(p){ return '공기 절연파괴 장 '+p.Eb+' MV/m. 반지름 R='+p.R+' cm 도체구가 가질 수 있는 (a) 최대 전위(kV) (b) 최대 전하(µC)를 구하라.'; },
    solve:function(p){
      var R=p.R/100;
      var V=p.Eb*1e6*R/1000, Q=p.Eb*1e6*R*R/8.99e9*1e6;
      return { ans:{V:V, Q:Q}, unit:{V:'kV', Q:'µC'}, steps:[
        '표면 E=kQ/R²≤E_b, V=kQ/R=E·R',
        'V_max = E_bR = '+SVH.fmt(V)+' kV, Q_max = '+SVH.fmt(Q)+' µC',
        '(클수록 고전압 가능 — 밴더그래프가 큰 이유·뾰족하면 방전하는 이유)' ] }; },
    hints:['V=ER 관계.'] },
  { id:'u3-l3-14', level:3, type:'num', tags:['일-에너지 경로 독립'], src:'창작 문제(검산됨)',
    params:{ q:{choices:[2,5],unit:'µC'}, V1:{choices:[300,500],unit:'V'}, V2:{choices:[100,200],unit:'V'} },
    statement:function(p){ return 'q='+p.q+' µC를 전위 '+p.V1+' V 점에서 '+p.V2+' V 점으로 옮긴다. (a) 전기력이 한 일(mJ) (b) 다른 경로로 가면 일은? (같음=1)'; },
    solve:function(p){ var W=p.q*1e-6*(p.V1-p.V2)*1000;
      return { ans:{W:W, same:1}, unit:{W:'mJ', same:''}, steps:[
        'W_field = q(V₁−V₂) = '+SVH.fmt(W)+' mJ (내리막이라 양수)',
        '보존장 → 경로 무관(1) — "전위"가 존재하는 바로 그 이유' ] }; },
    hints:['V는 상태함수.'] },

  /* ---------- L4 (8) ---------- */
  { id:'u3-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'옳은 것을 모두 고르면?<br>㉠ V=0인 점에서 E≠0일 수 있다<br>㉡ E=0인 영역에서 V는 일정하다<br>㉢ 도체 표면에서 σ는 곡률이 큰(뾰족한) 곳에 몰린다<br>㉣ 전위는 스칼라라서 중첩이 산술합이다',
    choices:['전부','㉠㉡㉣','㉡㉢㉣','㉠㉢'],
    answer:0, expl:'전부 참. ㉢은 l3-05(피뢰침)의 결론 — 등전위 조건 kq/R 동일 → σ∝1/R.' },
  { id:'u3-l4-02', level:4, type:'num', tags:['가우스+전위 통합'], src:'기출 유형',
    params:{ Q:{choices:[4,6],unit:'µC'}, R:{choices:[20,30],unit:'cm'} },
    statement:function(p){ return '균일 절연구(Q='+p.Q+' µC, R='+p.R+' cm): 표면 기준 무한대까지 (a) V(R) (b) V(R/2) (c) 전자를 표면에서 중심까지 보내는 데 외부가 할 일(음수면 전기력이 해줌, eV)을 구하라.'; },
    solve:function(p){
      var k=8.99e9, R=p.R/100;
      var Vs=k*p.Q*1e-6/R;
      var Vh=k*p.Q*1e-6/(2*R)*(3-Math.pow(0.5,2)); // V(r)=kQ(3-r²/R²)/2R
      var W=-(1)*(1.5*Vs-Vh)*(-1); // 전자 q=-e: W_ext = qΔV = (-e)(V0-Vs) → eV 단위로: -(V0-Vs)
      var dV=1.5*Vs-Vs; // V0-Vs
      var Wext=-(1.5*Vs-Vh)*0; // 정리 아래 steps에서 명확화
      var W_eV=-( (1.5*Vs) - Vs ); // (-e)(V(0)-V(R)) / e = -(V0-VR)
      return { ans:{Vs:Vs, Vh:Vh, W:W_eV}, unit:{Vs:'V', Vh:'V', W:'eV'}, steps:[
        'V(R) = kQ/R = '+SVH.fmt(Vs)+' V',
        '내부식 V(r)=kQ(3−r²/R²)/2R → V(R/2) = '+SVH.fmt(Vh)+' V',
        '전자(−e): W_ext = (−e)(V(0)−V(R)) = −(V₀−V_R) eV = '+SVH.fmt(W_eV)+' eV (음수 = 전기력이 안으로 끌어줌... 부호 논의가 핵심)' ] }; },
    hints:['내부 전위식 유도 또는 암기.','전자 부호 반전 주의.'] },
  { id:'u3-l4-03', level:4, type:'derive', tags:['유도'], src:'강의자료 대조',
    statement:'균일 절연구 내부 전위 \\(V(r)=\\dfrac{kQ}{2R}\\left(3-\\dfrac{r^2}{R^2}\\right)\\)를 E(r) 적분으로 유도하라.',
    steps:[
      '바깥 적분: \\(V(R)=\\int_R^\\infty kQ/r^2\\,dr=kQ/R\\) [왜] 무한대 0 기준',
      '내부 장: \\(E=kQr/R^3\\) (가우스, U2)',
      '이어 적분: \\(V(r)=V(R)+\\int_r^R kQr\'/R^3dr\'=kQ/R+\\dfrac{kQ}{2R^3}(R^2-r^2)\\)',
      '정리: \\(V(r)=\\dfrac{kQ}{2R}(3-r^2/R^2)\\) — 중심에서 (3/2)kQ/R',
      '극한 체크: r=R ⇒ kQ/R 연속 ✓ · dV/dr|₀=0 (중심 E=0) ✓ · 차원 [V] ✓'
    ],
    hints:['두 구간 적분을 이어붙인다.','연속성·미분값으로 검산.'],
    expl:'가우스(U2)→전위(U3) 연결 유도의 대표 — 퀴즈1 저격 범위.' },
  { id:'u3-l4-04', level:4, type:'num', tags:['축상 왕복 진동'], src:'기출 유형',
    params:{ Q:{choices:[3,6],unit:'µC'}, R:{choices:[10,20],unit:'cm'}, q:{choices:[1,2],unit:'µC'}, m:{choices:[1,2],unit:'g'} },
    statement:function(p){ return '고리(+Q='+p.Q+' µC, R='+p.R+' cm) 축 위 z=R에서 놓은 −q('+p.q+' µC, m='+p.m+' g)가 중심을 지나 반대편 z=−R까지 왕복한다. 중심 통과 속력(m/s)을 에너지로 구하라.'; },
    solve:function(p){
      var k=8.99e9, R=p.R/100;

        'V(0)−V(R축) = kQ(1/R − 1/√2R) = '+SVH.fmt(dV)+' V',
        '−q는 전위 높은 곳(중심)으로 가속: ½mv² = qΔV',

    hints:['간격→기울기.'] },
  { id:'u3-l4-07', level:4, type:'num', tags:['분자 결합 에너지'], src:'기출 유형',

    hints:['부호 포함 그대로.'] },
  { id:'u3-l4-08', level:4, type:'num', tags:['도체+점전하 에너지 수지'], src:'기출 유형',
    params:{ Q:{choices:[2,4],unit:'µC'}, R1:{choices:[10],unit:'cm'}, R2:{choices:[20,40],unit:'cm'} },
    statement:function(p){ return 'R₁='+p.R1+' cm 도체구(Q='+p.Q+' µC)를 도선으로 먼 R₂='+p.R2+' cm 중성구에 연결(l3-05 상황). 연결 전후 계의 정전 에너지 U=Q²/2C 형태로: (a) 전 (b) 후(J) (c) 사라진 에너지의 행방을 답하라. (C_구=R/k 사용)'; },
    solve:function(p){
      var k=8.99e9, R1=p.R1/100, R2=p.R2/100, Q=p.Q*1e-6;

      return { ans:{U1:U1, U2:U2}, unit:{U1:'J', U2:'J'}, steps:[
        '전: U = kQ²/2R₁ = '+SVH.fmt(U1)+' J',
        '후: 등전위 병렬 = 반지름 합 → U = kQ²/2(R₁+R₂) = '+SVH.fmt(U2)+' J',
        '차 '+SVH.fmt(U1-U2)+' J는 도선 저항 열·스파크로 — "전하 보존돼도 에너지는 준다" (U4 축전기 연결 문제의 예습)' ] }; },
    hints:['구의 C=R/k, 병렬 합.'] }
  ]
});

  { id:'u4-l2-01', level:2, type:'num', tags:['평행판'], src:'창작 문제(검산됨)',

  { id:'u4-l2-12', level:2, type:'num', tags:['내압 직렬'], src:'창작 문제(검산됨)',

    statement:function(p){ return '내압 '+p.Vr+' V, C='+p.C+' µF 축전기 '+p.n+'개를 직렬로: (a) 총 내압 (b) C_eq(µF)를 구하라.'; },
    solve:function(p){
      return { ans:{Vmax:p.n*p.Vr, Ceq:p.C/p.n}, unit:{Vmax:'V', Ceq:'µF'}, steps:[
        '같은 C 직렬 → 전압 균등 분배 → 내압 '+p.n+'배 = '+SVH.fmt(p.n*p.Vr)+' V',
        'C_eq = C/n = '+SVH.fmt(p.C/p.n)+' µF (용량은 손해 — 내압과 맞바꿈)' ] }; },
    hints:['직렬의 실무 이유.'] },

  /* ---------- L3 (14) ---------- */
  { id:'u4-l3-01', level:3, type:'num', tags:['재연결(공유) 문제'], src:'기출 유형',
    params:{ C1:{choices:[2,4],unit:'µF'}, V1:{choices:[12,24],unit:'V'}, C2:{choices:[4,8],unit:'µF'} },
    statement:function(p){ return '충전된 C₁('+p.C1+' µF, '+p.V1+' V)을 전지에서 떼어 중성 C₂('+p.C2+' µF)와 병렬 연결. (a) 공통 V (b) 손실 에너지(µJ)를 구하라.'; },
    solve:function(p){
      var Q=p.C1*p.V1, V=Q/(p.C1+p.C2);
      var U0=0.5*p.C1*p.V1*p.V1, U1=0.5*(p.C1+p.C2)*V*V;
      return { ans:{V:V, dU:U0-U1}, unit:{V:'V', dU:'µJ'}, steps:[
        '전하 보존: Q='+SVH.fmt(Q)+' µC → V = Q/(C₁+C₂) = '+SVH.fmt(V)+' V',
        'U: '+SVH.fmt(U0)+' → '+SVH.fmt(U1)+' µJ, 손실 '+SVH.fmt(U0-U1)+' µJ',
        '(전하는 보존, 에너지는 아님 — 도선 열·복사로. U3-l4-08과 같은 구조)' ] }; },
    hints:['Q 보존이 유일한 법.'] },
  { id:'u4-l3-02', level:3, type:'num', tags:['부분 유전체(면적 분할)'], src:'기출 유형',
    params:{ C0:{choices:[6,12],unit:'pF'}, kap:{choices:[3,5]} },
    statement:function(p){ return '평행판(진공 C₀='+p.C0+' pF)의 면적 절반에만 κ='+p.kap+' 유전체(두께 전체). 새 C(pF)는?'; },
    solve:function(p){ var C=p.C0/2*(1+p.kap);
      return { ans:C, unit:'pF', steps:[
        '면적 분할 = 병렬: C = C₀/2 + κC₀/2',
        '= '+SVH.fmt(C)+' pF' ] }; },
    hints:['옆으로 나뉘면 병렬.'] },
  { id:'u4-l3-03', level:3, type:'num', tags:['부분 유전체(두께 분할)'], src:'기출 유형',
    params:{ C0:{choices:[6,12],unit:'pF'}, kap:{choices:[2,4]} },
    statement:function(p){ return '같은 축전기의 두께 절반에만 κ='+p.kap+' (면적 전체). 새 C(pF)는?'; },
    solve:function(p){ var C=2*p.kap/(1+p.kap)*p.C0;
      return { ans:C, unit:'pF', steps:[
        '두께 분할 = 직렬: (2C₀)와 (2κC₀)의 직렬',
        'C = 2κC₀/(1+κ) = '+SVH.fmt(C)+' pF (면적/두께 분할 구분이 최다 실수)' ] }; },
    hints:['위아래로 나뉘면 직렬.'] },
  { id:'u4-l3-04', level:3, type:'num', tags:['판 간격 당기기'], src:'기출 유형',
    params:{ C0:{choices:[5,10],unit:'µF'}, V0:{choices:[10,20],unit:'V'}, k:{choices:[2,3]} },
    statement:function(p){ return '충전('+p.V0+' V) 후 분리한 평행판(C₀='+p.C0+' µF)의 간격을 '+p.k+'배로 벌린다. (a) 새 V (b) 에너지 변화(µJ)와 그 출처를 구하라.'; },
    solve:function(p){
      var Q=p.C0*p.V0;
      var U0=0.5*p.C0*p.V0*p.V0, U1=U0*p.k;
      return { ans:{V:p.V0*p.k, dU:U1-U0}, unit:{V:'V', dU:'µJ'}, steps:[
        'Q 고정, C→C₀/'+p.k+' → V = '+SVH.fmt(p.V0*p.k)+' V',
        'U = Q²/2C → '+p.k+'배: 증가분 '+SVH.fmt(U1-U0)+' µJ',
        '출처 = 판 사이 인력을 거슬러 당긴 "사람의 일" (장이 에너지 창고라는 증거)' ] }; },
    hints:['Q²/2C에 C만 바꾼다.'] },
  { id:'u4-l3-05', level:3, type:'num', tags:['에너지 밀도 검증'], src:'기출 유형',
    params:{ C:{choices:[100,200],unit:'pF'}, V:{choices:[50,100],unit:'V'}, A:{choices:[100],unit:'cm²'} },
    statement:function(p){ return '평행판(C='+p.C+' pF, A='+p.A+' cm², V='+p.V+' V)에서 (a) U=½CV² (b) u·(부피)로 각각 에너지(nJ)를 구해 일치를 확인하라.'; },
    solve:function(p){
      var U=0.5*p.C*1e-12*p.V*p.V*1e9;
      // d = ε0 A / C
      var d=8.85e-12*p.A*1e-4/(p.C*1e-12);
      var E=p.V/d, u=0.5*8.85e-12*E*E;
      var U2=u*p.A*1e-4*d*1e9;
      return { ans:{U:U, U2:U2}, unit:{U:'nJ', U2:'nJ'}, steps:[
        '직접: U = ½CV² = '+SVH.fmt(U)+' nJ',
        'd = ε₀A/C = '+SVH.fmt(d*1000)+' mm → E = '+SVH.fmt(E)+' V/m',
        'u·Ad = '+SVH.fmt(U2)+' nJ — 일치 ✓ (에너지는 "장이 있는 부피"에 산다)' ] }; },
    hints:['두 경로 계산.'] },
  { id:'u4-l3-06', level:3, type:'num', tags:['직렬+κ'], src:'기출 유형',
    params:{ C:{choices:[6,12],unit:'µF'}, kap:{choices:[3]}, V:{choices:[20,40],unit:'V'} },
    statement:function(p){ return '동일 C('+p.C+' µF) 두 개 직렬, 전원 '+p.V+' V. 한쪽에만 κ='+p.kap+' 삽입(연결 유지). (a) 새 C_eq (b) 유전체 없는 쪽 전압(V)을 구하라.'; },
    solve:function(p){
      var Ce=p.kap*p.C/(1+p.kap);
      var Q=Ce*p.V, V1=Q/p.C;
      return { ans:{Ceq:Ce, V1:V1}, unit:{Ceq:'µF', V1:'V'}, steps:[
        'C_eq = κC/(1+κ) = '+SVH.fmt(Ce)+' µF',
        'Q = '+SVH.fmt(Q)+' µC → 진공 쪽 V = Q/C = '+SVH.fmt(V1)+' V',
        '(유전체 쪽 전압이 낮아지고 진공 쪽이 높아짐 — 절연파괴 위험은 진공 쪽!)' ] }; },
    hints:['직렬 Q 공통 재활용.'] },
  { id:'u4-l3-07', level:3, type:'num', tags:['원통 축전기'], src:'교재 표준',
    params:{ b_a:{choices:[2,3]}, L:{choices:[10,50],unit:'cm'} },
    statement:function(p){ return '동축 원통(b/a='+p.b_a+', 길이 L='+p.L+' cm)의 C=2πε₀L/ln(b/a)를 계산하라(pF).'; },
    solve:function(p){
      var C=2*Math.PI*8.85e-12*p.L/100/Math.log(p.b_a)*1e12;
      return { ans:C, unit:'pF', steps:[
        'C = 2πε₀L/ln(b/a) = '+SVH.fmt(C)+' pF',
        '(U2 동축 장 → U3 ln 전위차 → C — 3단원 연결의 결정판)' ] }; },
    hints:['ln이 들어간 C.'] },
  { id:'u4-l3-08', level:3, type:'num', tags:['판 인력'], src:'기출 유형',
    params:{ C:{choices:[100,300],unit:'pF'}, V:{choices:[100,200],unit:'V'}, d:{choices:[1,2],unit:'mm'} },
    statement:function(p){ return '평행판(C='+p.C+' pF, V='+p.V+' V, d='+p.d+' mm)의 판 사이 인력 F=Q²/(2ε₀A)=U/d... 간단히 F=½QE=½QV/d로 계산하라(mN).'; },
    solve:function(p){
      var Q=p.C*1e-12*p.V;
      var F=0.5*Q*p.V/(p.d*1e-3)*1000;
      return { ans:F, unit:'mN', steps:[
        'Q = CV = '+SVH.fmt(Q)+' C',
        'F = ½QV/d = '+SVH.fmt(F)+' mN (½은 "상대 판의 장만" — U2-l3-10과 같은 논리)' ] }; },
    hints:['σ/2ε₀ 논리 재활용.'] },
  { id:'u4-l3-09', level:3, type:'num', tags:['C-V 곡선 적분'], src:'창작 문제(검산됨)',
    params:{ C:{choices:[10,40],unit:'µF'}, V:{choices:[10,20],unit:'V'} },
    statement:function(p){ return '왜 U=½QV인가: C='+p.C+' µF를 0→'+p.V+' V로 충전하며 dW=v·dq를 적분해 U(µJ)를 구하고 QV와 비교하라.'; },
    solve:function(p){
      var U=0.5*p.C*p.V*p.V;
      return { ans:{U:U, QV:p.C*p.V*p.V}, unit:{U:'µJ', QV:'µJ'}, steps:[
        'W = ∫₀^Q (q/C)dq = Q²/2C = '+SVH.fmt(U)+' µJ',
        'QV = '+SVH.fmt(p.C*p.V*p.V)+' µJ의 절반 — 나중 전하일수록 비싸게 올라가는 평균 효과' ] }; },
    hints:['q/C를 q로 적분.'] },
  { id:'u4-l3-10', level:3, type:'num', tags:['3개 브리지형'], src:'기출 유형',
    params:{ C:{choices:[6,12],unit:'µF'}, V:{choices:[12,24],unit:'V'} },
    statement:function(p){ return '동일 C('+p.C+' µF) 3개: 두 개 직렬 가지와 한 개 단독 가지가 병렬, 전원 '+p.V+' V. (a) C_eq (b) 총 저장 에너지(µJ)를 구하라.'; },
    solve:function(p){
      var Ce=p.C/2+p.C;
      var U=0.5*Ce*p.V*p.V;
      return { ans:{Ceq:Ce, U:U}, unit:{Ceq:'µF', U:'µJ'}, steps:[
        'C_eq = C/2 + C = '+SVH.fmt(Ce)+' µF',
        'U = ½C_eqV² = '+SVH.fmt(U)+' µJ' ] }; },
    hints:['가지별로 접기.'] },
  { id:'u4-l3-11', level:3, type:'num', tags:['유전체 뽑기 일'], src:'기출 유형',
    params:{ C0:{choices:[5,10],unit:'µF'}, V0:{choices:[10,20],unit:'V'}, kap:{choices:[2,4]} },
    statement:function(p){ return 'κ='+p.kap+'가 든 축전기(κC₀, C₀='+p.C0+' µF)를 '+p.V0+' V로 충전 후 분리, 유전체를 꺼낸다. 필요한 외부 일(µJ)을 구하라.'; },
    solve:function(p){
      var Q=p.kap*p.C0*p.V0;
      var U0=0.5*p.kap*p.C0*p.V0*p.V0;
      var U1=Q*Q/(2*p.C0);
      return { ans:U1-U0, unit:'µJ', steps:[
        'Q = κC₀V₀ = '+SVH.fmt(Q)+' µC 고정',
        'U: '+SVH.fmt(U0)+' → Q²/2C₀ = '+SVH.fmt(U1)+' µJ',
        'W_ext = ΔU = '+SVH.fmt(U1-U0)+' µJ > 0 (유전체는 빨려 들어가려 하므로 꺼내려면 일이 든다)' ] }; },
    hints:['Q 고정·C 감소.'] },
  { id:'u4-l3-12', level:3, type:'num', tags:['V 고정 뽑기'], src:'기출 유형',
    params:{ C0:{choices:[5,10],unit:'µF'}, V:{choices:[10,20],unit:'V'}, kap:{choices:[2,3]} },
    statement:function(p){ return '같은 상황이지만 전지('+p.V+' V) 연결 유지로 유전체를 꺼낸다. (a) 축전기 에너지 변화 (b) 전지로 돌아간 에너지(µJ)를 구하라.'; },
    solve:function(p){
      var dU=0.5*p.C0*p.V*p.V*(1-p.kap);
      var dQ=p.C0*p.V*(1-p.kap);
      var Wbat=-dQ*p.V; // 전지가 받은 에너지 = -ΔQ·V
      return { ans:{dU:dU, Wbat:Wbat}, unit:{dU:'µJ', Wbat:'µJ'}, steps:[
        'ΔU = ½C₀V²(1−κ) = '+SVH.fmt(dU)+' µJ (감소)',
        '전하 ΔQ = C₀V(1−κ) < 0 → 전지로 회수 = |ΔQ|V = '+SVH.fmt(Wbat)+' µJ',
        '(에너지 장부: 사람 일 + 축전기 감소 = 전지 충전 — 3자 수지)' ] }; },
    hints:['V 고정은 전지 장부까지.'] },
  { id:'u4-l3-13', level:3, type:'num', tags:['구형 축전기'], src:'교재 표준',
    params:{ a:{choices:[5,10],unit:'cm'}, b:{choices:[15,20],unit:'cm'} },
    statement:function(p){ return '동심 구 축전기(a='+p.a+', b='+p.b+' cm)의 C=4πε₀ab/(b−a)를 계산하라(pF). b→∞ 극한은?'; },
    solve:function(p){
      var a=p.a/100, b=p.b/100;
      var C=a*b/(b-a)/8.99e9*1e12;
      return { ans:C, unit:'pF', steps:[
        'C = ab/[k(b−a)] = '+SVH.fmt(C)+' pF',
        'b→∞: C→a/k = 고립구 (l2-08 회수) — 극한 체크 습관' ] }; },
    hints:['ab/(b−a) 패턴.'] },
  { id:'u4-l3-14', level:3, type:'num', tags:['RC 예고: 시간 상수'], src:'창작 문제(검산됨)',
    params:{ C:{choices:[100,470],unit:'µF'}, R:{choices:[1,10],unit:'kΩ'} },
    statement:function(p){ return '이 축전기(C='+p.C+' µF)가 R='+p.R+' kΩ로 방전하면 시간상수 τ=RC(s)는? 63.2% 방전 시간은?'; },
    solve:function(p){ var tau=p.R*1000*p.C*1e-6;
      return { ans:{tau:tau, t63:tau}, unit:{tau:'s', t63:'s'}, steps:[
        'τ = RC = '+SVH.fmt(tau)+' s',
        '(다음 단원 DC 회로의 다리 — 전전개 U6과 같은 물리)' ] }; },
    hints:['kΩ·µF→ms 반사신경.'] },

  /* ---------- L4 (8) ---------- */
  { id:'u4-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'옳은 것을 모두 고르면?<br>㉠ C는 기하·매질만의 함수다<br>㉡ 재연결 문제에서 보존되는 것은 에너지가 아니라 전하다<br>㉢ V 고정 κ 삽입 시 U는 κ배 증가, Q 고정이면 1/κ로 감소<br>㉣ 에너지 밀도 ½ε₀E²는 축전기 밖 임의의 장에도 적용된다',
    choices:['전부','㉠㉡㉢','㉡㉢㉣','㉠㉣'],
    answer:0, expl:'전부 참 — 특히 ㉡·㉢이 퀴즈1의 저격 포인트.' },
  { id:'u4-l4-02', level:4, type:'num', tags:['퀴즈1형 종합'], src:'기출 유형',
    params:{ C1:{choices:[3,6],unit:'µF'}, C2:{choices:[6,12],unit:'µF'}, V:{choices:[12,24],unit:'V'} },
    statement:function(p){ return 'C₁('+p.C1+')과 C₂('+p.C2+' µF)를 직렬로 '+p.V+' V 충전 → 전원 분리 → 떼어서 +끼리 −끼리 병렬 재연결. (a) 재연결 후 공통 V (b) 총 에너지 변화(µJ)를 구하라.'; },
    solve:function(p){
      var Ce=p.C1*p.C2/(p.C1+p.C2), Q=Ce*p.V;
      var U0=0.5*Ce*p.V*p.V;
      var V1=2*Q/(p.C1+p.C2);
      var U1=0.5*(p.C1+p.C2)*V1*V1;
      return { ans:{V1:V1, dU:U1-U0}, unit:{V1:'V', dU:'µJ'}, steps:[
        '직렬 충전: 각자 Q = '+SVH.fmt(Q)+' µC',
        '병렬 재연결: 총 2Q, V = 2Q/(C₁+C₂) = '+SVH.fmt(V1)+' V',
        'U: '+SVH.fmt(U0)+' → '+SVH.fmt(U1)+' µJ (Δ='+SVH.fmt(U1-U0)+' — 재배열 손실)' ] }; },
    hints:['각 판의 전하 부호를 그림으로.'] },
  { id:'u4-l4-03', level:4, type:'derive', tags:['유도'], src:'강의자료 대조',
    statement:'평행판에서 에너지 밀도 \\(u=\\tfrac12\\varepsilon_0E^2\\)를 U=½CV²에서 유도하고, 이것이 "장 자체의 에너지"로 읽히는 이유를 서술하라.',
    steps:[
      'U = ½CV², C=ε₀A/d, V=Ed 대입 [왜] 기하를 장 변수로 갈아끼우기',
      'U = ½(ε₀A/d)(Ed)² = ½ε₀E²·(Ad)',
      'Ad = 장이 존재하는 부피 → u=U/(Ad)=½ε₀E²',
      '기하(A,d)가 소거되고 E만 남음 — 축전기가 아니라 "장이 있는 곳"의 성질로 승격',
      '극한 체크: E=0 ⇒ u=0 ✓ · 차원: [C²/N·m²][N²/C²]=[N/m²]=[J/m³] ✓ (EM파 에너지의 복선)'
    ],
    hints:['C·V를 모두 E와 기하로.','부피로 나누는 순간이 개념 도약.'],
    expl:'노트의 "장의 실재성" 서사를 계산으로 완성 — 서술형 대비 1순위.' },
  { id:'u4-l4-04', level:4, type:'num', tags:['설계: 목표 C·내압'], src:'기출 유형',
    params:{ Ct:{choices:[2,5],unit:'µF'}, Vt:{choices:[100,200],unit:'V'}, C:{choices:[2,5],unit:'µF'}, Vr:{choices:[50,100],unit:'V'} },
    constraint:function(p){ return p.Ct===p.C && p.Vt===2*p.Vr; },
    statement:function(p){ return '단위 축전기(C='+p.C+' µF, 내압 '+p.Vr+' V)로 목표 C_eq='+p.Ct+' µF·내압 '+p.Vt+' V를 만들려면 최소 몇 개가 필요한가? (직렬 n × 병렬 m 배열의 n, m과 총수)'; },
    solve:function(p){
      var n=p.Vt/p.Vr; // 직렬 수
      var m=n; // Ceq = mC/n = C → m=n
      return { ans:{n:n, m:m, total:n*m}, unit:{n:'', m:'', total:'개'}, steps:[
        '내압: 직렬 n = '+p.Vt+'/'+p.Vr+' = '+n,
        'C_eq = (m/n)C = C → m = n = '+m,
        '총 '+n*m+'개 ('+n+'직렬×'+m+'병렬) — 배터리팩·필름콘덴서 뱅크의 실제 산수' ] }; },
    hints:['내압이 n을, 용량이 m을 정한다.'] },

      var J=p.I/A;
      return { ans:{J:J, I2:4*p.I}, unit:{J:'A/mm²', I2:'A'}, steps:[
        'J = I/A = '+SVH.fmt(J)+' A/mm²',
        '지름 2배 → 면적 4배 → '+SVH.fmt(4*p.I)+' A (허용 전류 규격의 물리)' ] }; },
    hints:['J=I/A.'] },

  /* ---------- L3 (14) ---------- */
  { id:'u5-l3-01', level:3, type:'num', tags:['두 고리 KVL'], src:'기출 유형',
    params:{ e1:{choices:[12,18],unit:'V'}, e2:{choices:[6,9],unit:'V'}, R1:{choices:[2,4],unit:'Ω'}, R2:{choices:[2,3],unit:'Ω'}, R3:{choices:[4,6],unit:'Ω'} },
    statement:function(p){ return '두 전지 회로: ℰ₁('+p.e1+' V)-R₁ 가지, ℰ₂('+p.e2+' V)-R₂ 가지가 R₃를 공유(둘 다 R₃로 밀어넣는 방향). R₃의 전류(A)를 구하라.'; },
    solve:function(p){
      // 절점법: (e1-v)/R1 + (e2-v)/R2 = v/R3
      var v=(p.e1/p.R1+p.e2/p.R2)/(1/p.R1+1/p.R2+1/p.R3);
      return { ans:v/p.R3, unit:'A', steps:[
        '절점 v: (ℰ₁−v)/R₁+(ℰ₂−v)/R₂ = v/R₃',
        'v = '+SVH.fmt(v)+' V → I₃ = v/R₃ = '+SVH.fmt(v/p.R3)+' A',
        '(밀리컨식 두 전지 병렬 급전 — Halliday 27장 단골)' ] }; },
    hints:['절점 하나로 끝나는 구조.'] },
  { id:'u5-l3-02', level:3, type:'num', tags:['전구 직렬 역전'], src:'기출 유형',
    params:{ V:{choices:[120,220],unit:'V'}, P1:{choices:[100],unit:'W'}, P2:{choices:[40,60],unit:'W'} },
    statement:function(p){ return p.P1+' W와 '+p.P2+' W 전구('+p.V+' V 정격)를 "직렬"로 '+p.V+' V에 연결. 각 전구의 실제 소비 전력(W)을 구하고 어느 쪽이 밝은지 답하라. (저항 불변 가정)'; },
    solve:function(p){
      var R1=p.V*p.V/p.P1, R2=p.V*p.V/p.P2;
      var I=p.V/(R1+R2);
      return { ans:{Pa:I*I*R1, Pb:I*I*R2}, unit:{Pa:'W', Pb:'W'}, steps:[
        'R = V²/P: R₁='+SVH.fmt(R1)+', R₂='+SVH.fmt(R2)+' Ω (작은 W = 큰 R!)',
        'I = '+SVH.fmt(I)+' A → P: '+SVH.fmt(I*I*R1)+' vs '+SVH.fmt(I*I*R2)+' W',
        '직렬에선 '+p.P2+' W 전구가 더 밝다 — 정격 표기의 함정 (명 기출 유형)' ] }; },
    hints:['정격→저항 변환부터.'] },
  { id:'u5-l3-03', level:3, type:'num', tags:['최대 전력 전달'], src:'기출 유형',
    params:{ emf:{choices:[12,24],unit:'V'}, r:{choices:[1,2],unit:'Ω'} },
    statement:function(p){ return 'ℰ='+p.emf+' V, r='+p.r+' Ω 전지에서 부하 R로 최대 전력을 뽑는 (a) R (b) P_max(W) (c) 그때 효율(%)을 구하라.'; },
    solve:function(p){
      var P=p.emf*p.emf/(4*p.r);
      return { ans:{R:p.r, P:P, eff:50}, unit:{R:'Ω', P:'W', eff:'%'}, steps:[
        'R = r = '+p.r+' Ω (정합)',
        'P_max = ℰ²/4r = '+SVH.fmt(P)+' W, 효율 50%',
        '(전전개 U4 정리의 물리 버전 — 전력계는 정합, 전력망은 r≪R)' ] }; },
    hints:['정합 조건.'] },
  { id:'u5-l3-04', level:3, type:'num', tags:['RC 방전 실험'], src:'기출 유형',
    params:{ V0:{choices:[9,12],unit:'V'}, R:{choices:[220,470],unit:'kΩ'}, C:{choices:[100,470],unit:'µF'}, f:{choices:[0.5,0.1]} },
    statement:function(p){ return 'RC 방전(V₀='+p.V0+' V, R='+p.R+' kΩ, C='+p.C+' µF): 전압이 V₀의 '+p.f+'배가 되는 시각(s)과 그 순간 전류(µA)를 구하라.'; },
    solve:function(p){
      var tau=p.R*1000*p.C*1e-6;
      var t=-tau*Math.log(p.f);
      var i=p.V0*p.f/(p.R*1000)*1e6;
      return { ans:{t:t, i:i}, unit:{t:'s', i:'µA'}, steps:[
        'τ = '+SVH.fmt(tau)+' s → t = −τln('+p.f+') = '+SVH.fmt(t)+' s',
        'i = v/R = '+SVH.fmt(i)+' µA (전압과 전류가 같은 τ로 감쇠)' ] }; },
    hints:['ln 역산.'] },
  { id:'u5-l3-05', level:3, type:'num', tags:['도선 접합'], src:'기출 유형',
    params:{ d1:{choices:[1,2],unit:'mm'}, k:{choices:[2,3]}, I:{choices:[5,10],unit:'A'} },
    statement:function(p){ return '지름 d₁='+p.d1+' mm 도선이 지름 '+p.k+'d₁ 도선과 접합되어 I='+p.I+' A가 흐른다. (a) 전류비 I₁:I₂ (b) 전류밀도비 J₁/J₂ (c) 유동속도비를 구하라.'; },
    solve:function(p){
      var k2=p.k*p.k;
      return { ans:{Iratio:1, J:k2, v:k2}, unit:{Iratio:'', J:'배', v:'배'}, steps:[
        '직렬 → 전류 동일(비 1)',
        'J = I/A → 가는 쪽이 '+k2+'배',
        'v_d ∝ J → 역시 '+k2+'배 (병목에서 빨라진다 — 강물 유추)' ] }; },
    hints:['연속 방정식 감각.'] },
  { id:'u5-l3-06', level:3, type:'num', tags:['전지 병렬'], src:'기출 유형',
    params:{ emf:{choices:[12],unit:'V'}, r:{choices:[1,2],unit:'Ω'}, n:{choices:[2,4]}, R:{choices:[5,10],unit:'Ω'} },
    statement:function(p){ return '동일 전지(ℰ='+p.emf+' V, r='+p.r+' Ω) '+p.n+'개 병렬에 R='+p.R+' Ω. (a) 부하 전류(A) (b) 전지 1개일 때 대비 개선율(%)을 구하라.'; },
    solve:function(p){
      var I=p.emf/(p.r/p.n+p.R);
      var I1=p.emf/(p.r+p.R);
      return { ans:{I:I, imp:(I/I1-1)*100}, unit:{I:'A', imp:'%'}, steps:[
        '병렬: ℰ 그대로, r/n = '+SVH.fmt(p.r/p.n)+' Ω',
        'I = '+SVH.fmt(I)+' A (1개: '+SVH.fmt(I1)+' A → +'+SVH.fmt((I/I1-1)*100)+'%)',
        '(r≪R이면 병렬 이득 미미 — 언제 병렬이 의미 있나까지)' ] }; },
    hints:['내부저항만 준다.'] },
  { id:'u5-l3-07', level:3, type:'num', tags:['휘트스톤 응용'], src:'기출 유형',
    params:{ R1:{choices:[100,200],unit:'Ω'}, R2:{choices:[300,400],unit:'Ω'}, R3:{choices:[150,250],unit:'Ω'} },
    statement:function(p){ return '휘트스톤 브리지 평형으로 미지 저항 측정: R₁='+p.R1+', R₂='+p.R2+', R₃='+p.R3+' Ω일 때 R_x=R₂R₃/R₁(Ω)을 구하라.'; },
    solve:function(p){ var Rx=p.R2*p.R3/p.R1;
      return { ans:Rx, unit:'Ω', steps:[
        '평형: R₁R_x=R₂R₃ → R_x = '+SVH.fmt(Rx)+' Ω',
        '(검류계 0 조정 → 정밀 저항 측정 — 실험실 표준)' ] }; },
    hints:['교차곱.'] },
  { id:'u5-l3-08', level:3, type:'num', tags:['전위계/전류계 오차'], src:'기출 유형',
    params:{ R:{choices:[1000,10000],unit:'Ω'}, Rv:{choices:[100],unit:'kΩ'} },
    statement:function(p){ return 'R='+p.R+' Ω를 전압계(R_V='+p.Rv+' kΩ)로 병렬 측정하면 몇 % 작게 읽히는가?'; },
    solve:function(p){
      var Rp=p.R*p.Rv*1000/(p.R+p.Rv*1000);
      var err=(1-Rp/p.R)*100;
      return { ans:err, unit:'%', steps:[
        '측정값 = R∥R_V = '+SVH.fmt(Rp)+' Ω',
        '오차 = '+SVH.fmt(err)+' % (R가 R_V에 비해 클수록 악화 — 계측 부하 효과)' ] }; },
    hints:['병렬이 항상 작다.'] },
  { id:'u5-l3-09', level:3, type:'num', tags:['RC 에너지 수지'], src:'기출 유형',
    params:{ emf:{choices:[10,20],unit:'V'}, C:{choices:[100,220],unit:'µF'} },
    statement:function(p){ return 'RC 충전 완료까지 (a) 전지가 공급한 에너지 (b) C에 저장된 에너지 (c) R에서 소산(µJ) — R값과 무관함을 보여라. (ℰ='+p.emf+' V, C='+p.C+' µF)'; },
    solve:function(p){
      var Q=p.C*p.emf, Eb=Q*p.emf, Ec=0.5*Q*p.emf;
      return { ans:{Eb:Eb, Ec:Ec, Er:Ec}, unit:{Eb:'µJ', Ec:'µJ', Er:'µJ'}, steps:[
        '전지: Qℰ = '+SVH.fmt(Eb)+' µJ',
        'C: ½Qℰ = '+SVH.fmt(Ec)+' µJ → R 소산 = 나머지 절반 '+SVH.fmt(Ec)+' µJ',
        '(충전 효율 50% — 전전개 U6-l4-07과 같은 정리, 물리답게 다시)' ] }; },
    hints:['Qℰ와 ½Qℰ.'] },
  { id:'u5-l3-10', level:3, type:'num', tags:['배선 규격'], src:'기출 유형',
    params:{ P:{choices:[3000,5000],unit:'W'}, V:{choices:[220],unit:'V'}, L:{choices:[20,30],unit:'m'}, loss:{choices:[2,5],unit:'%'} },
    statement:function(p){ return p.V+' V·'+p.P+' W 부하까지 왕복 '+2*p.L+' m 배선. 손실을 '+p.loss+'% 이하로 하려면 (a) 최대 배선 저항 (b) 구리선 최소 단면적(mm²)을 구하라.'; },
    solve:function(p){
      var I=p.P/p.V;
      var Rmax=p.loss/100*p.P/(I*I);
      var A=1.7e-8*2*p.L/Rmax*1e6;
      return { ans:{Rmax:Rmax, A:A}, unit:{Rmax:'Ω', A:'mm²'}, steps:[
        'I = P/V = '+SVH.fmt(I)+' A, 손실 I²R ≤ '+SVH.fmt(p.loss/100*p.P)+' W → R ≤ '+SVH.fmt(Rmax)+' Ω',
        'A = ρ(2L)/R = '+SVH.fmt(A)+' mm² (전선 굵기 규격표의 물리)' ] }; },
    hints:['손실 조건→R→A.'] },
  { id:'u5-l3-11', level:3, type:'num', tags:['비저항 미시식'], src:'강의자료 대조',
    params:{ tau:{choices:[2.5],unit:'×10⁻¹⁴ s'} },
    statement:function(p){ return '드루드 모형 \\(\\rho=m/(ne^2\\tau)\\)로 구리(n=8.5×10²⁸, τ='+p.tau+'×10⁻¹⁴ s)의 비저항을 구하고 실측 1.7×10⁻⁸과 비교하라(Ω·m).'; },
    solve:function(p){
      var rho=9.11e-31/(8.5e28*Math.pow(1.602e-19,2)*p.tau*1e-14);
      return { ans:rho, unit:'Ω·m', steps:[
        'ρ = m/(ne²τ) = '+SVH.fmt(rho)+' Ω·m',
        '실측과 같은 오더 — 고전 모형의 성공(비열은 실패 → 양자로, 기말 예고)' ] }; },
    hints:['상수 대입 신중히.'] },
  { id:'u5-l3-12', level:3, type:'num', tags:['퓨즈 설계'], src:'창작 문제(검산됨)',
    params:{ V:{choices:[220],unit:'V'}, Imax:{choices:[15,20],unit:'A'} },
    statement:function(p){ return p.V+' V 회로의 '+p.Imax+' A 차단기: (a) 허용 최대 부하 전력(kW) (b) 1.5 kW 기기 몇 대까지 동시 사용 가능한가?'; },
    solve:function(p){
      var P=p.V*p.Imax/1000;
      return { ans:{P:P, n:Math.floor(P/1.5)}, unit:{P:'kW', n:'대'}, steps:[
        'P_max = VI = '+SVH.fmt(P)+' kW',
        '1.5 kW × n ≤ P_max → n = '+Math.floor(P/1.5)+'대 (가정 배전의 산수)' ] }; },
    hints:['P=VI, 내림.'] },
  { id:'u5-l3-13', level:3, type:'num', tags:['RC 반충전 시간'], src:'창작 문제(검산됨)',
    params:{ R:{choices:[10,100],unit:'kΩ'}, C:{choices:[10,100],unit:'µF'} },
    statement:function(p){ return 'RC 충전(R='+p.R+' kΩ, C='+p.C+' µF)에서 (a) 절반 충전 시간 (b) 90% 충전 시간(s)을 구하라.'; },
    solve:function(p){
      var tau=p.R*1000*p.C*1e-6;
      return { ans:{t50:tau*Math.LN2, t90:tau*Math.log(10)}, unit:{t50:'s', t90:'s'}, steps:[
        't₅₀ = τln2 = '+SVH.fmt(tau*Math.LN2)+' s',
        't₉₀ = τln10 = '+SVH.fmt(tau*Math.log(10))+' s' ] }; },
    hints:['ln2와 ln10.'] },
  { id:'u5-l3-14', level:3, type:'num', tags:['제세동기'], src:'기출 유형',
    params:{ C:{choices:[100,150],unit:'µF'}, V:{choices:[2,4],unit:'kV'}, t:{choices:[2,10],unit:'ms'} },
    statement:function(p){ return '제세동기: C='+p.C+' µF를 '+p.V+' kV로 충전 후 '+p.t+' ms에 방출. (a) 에너지(J) (b) 평균 전력(kW)을 구하라.'; },
    solve:function(p){
      var U=0.5*p.C*1e-6*Math.pow(p.V*1000,2);
      return { ans:{U:U, P:U/(p.t/1000)/1000}, unit:{U:'J', P:'kW'}, steps:[
        'U = ½CV² = '+SVH.fmt(U)+' J',
        'P_avg = U/Δt = '+SVH.fmt(U/(p.t/1000)/1000)+' kW (축전기 = 순간 방출 전문가)' ] }; },
    hints:['U와 U/t.'] },

  /* ---------- L4 (8) ---------- */
  { id:'u5-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'옳은 것을 모두 고르면?<br>㉠ 전구가 즉시 켜지는 것은 장의 전파 때문이지 전자의 이동 속도 때문이 아니다<br>㉡ RC 충전의 에너지 효율은 R와 무관하게 50%다<br>㉢ 직렬 연결된 전구는 정격 W가 작은 쪽이 더 밝다<br>㉣ 전압계는 입력저항이 클수록, 전류계는 작을수록 좋다',
    choices:['전부','㉠㉡㉢','㉡㉢㉣','㉠㉣'],
    answer:0, expl:'전부 참 — ㉢은 l3-02의 반직관 결과.' },
  { id:'u5-l4-02', level:4, type:'num', tags:['다중 고리 완주'], src:'기출 유형',
    params:{ e1:{choices:[12,15],unit:'V'}, e2:{choices:[6,9],unit:'V'}, R:{choices:[2,3],unit:'Ω'} },
    statement:function(p){ return '모든 저항 R='+p.R+' Ω: ℰ₁('+p.e1+' V)-R-[중앙 R]-R-ℰ₂('+p.e2+' V, 반대 방향으로 미는 극성) 사다리. 중앙 R의 전류(A)와 방향(ℰ₁쪽 우세=1)을 구하라.'; },
    solve:function(p){
      // 절점 v (중앙 저항 위): (e1-v)/(2R)... 구조: e1-R-node-R-e2, node-R-접지
      var v=(p.e1/(2*p.R)+p.e2/(2*p.R))/(1/(2*p.R)+1/(2*p.R)+1/p.R);
      var I=v/p.R;
      return { ans:{I:I, dir:1}, unit:{I:'A', dir:''}, steps:[
        '절점법: (ℰ₁−v)/2R+(ℰ₂−v)/2R = v/R → v = '+SVH.fmt(v)+' V',
        'I_중앙 = v/R = '+SVH.fmt(I)+' A (두 전지가 협력해 밀어넣는 구조로 정리)' ] }; },
    hints:['가지 저항 합부터.'] },
  { id:'u5-l4-03', level:4, type:'derive', tags:['유도'], src:'강의자료 대조',
    statement:'RC 충전 에너지 효율 50%(R 무관)를 적분으로 증명하라.',
    steps:[
      '충전 전류 \\(i=({\\mathcal{E}}/{R})e^{-t/RC}\\) [왜] U6/전 단원 결과 소환',
      'R 소산: \\(W_R=\\int_0^\\infty i^2R\\,dt=\\dfrac{\\mathcal{E}^2}{R}\\cdot\\dfrac{RC}{2}=\\tfrac12C\\mathcal{E}^2\\) — R이 소거!',
      '전지 공급: \\(W_b=\\int \\mathcal{E}i\\,dt=\\mathcal{E}Q=C\\mathcal{E}^2\\)',
      '저장: \\(U_C=\\tfrac12C\\mathcal{E}^2\\) → 수지: 공급 = 저장 + 소산, 정확히 반반',
      '극한 체크: R→0에도 비율 불변(빨라질 뿐) ✓ · 차원: [C][V²]=[J] ✓'
    ],
    hints:['e^{-2t/RC} 적분에서 R이 사라지는 순간을 봐라.'],
    expl:'"왜 하필 절반?"의 완전한 답 — 서술형·구술형 단골.' },
  { id:'u5-l4-04', level:4, type:'num', tags:['전지 직·병렬 설계'], src:'기출 유형',
    params:{ emf:{choices:[1.5],unit:'V'}, r:{choices:[0.5],unit:'Ω'}, R:{choices:[1,4],unit:'Ω'} },
    statement:function(p){ return 'AA 전지(1.5 V, r=0.5 Ω) 4개로 R='+p.R+' Ω 부하 전류를 최대로 하려면 (a) 4직렬 (b) 2×2 (c) 4병렬 중 무엇인가? 각 전류(A)를 구하라. (최적: a=1/b=2/c=3)'; },
    solve:function(p){
      var Is=4*1.5/(4*0.5+p.R);
      var Ib=2*1.5/(0.5+p.R);
      var Ip=1.5/(0.125+p.R);
      var best=Is>=Ib&&Is>=Ip?1:(Ib>=Ip?2:3);
      return { ans:{Is:Is, Ib:Ib, Ip:Ip, best:best}, unit:{Is:'A', Ib:'A', Ip:'A', best:''}, steps:[
        '4직렬: 6V/(2+R) = '+SVH.fmt(Is)+' A · 2×2: 3V/(0.5+R) = '+SVH.fmt(Ib)+' A · 4병렬: 1.5V/(0.125+R) = '+SVH.fmt(Ip)+' A',
        '최적 = '+best+' (규칙: R≫r → 직렬, R≪r → 병렬, R≈r → 정방 배열)',
        '(배터리팩 설계의 근본 문제)' ] }; },
    hints:['R과 r의 크기 비교가 답을 정한다.'] },
  { id:'u5-l4-05', level:4, type:'num', tags:['2C-RC 회로'], src:'기출 유형',
    params:{ emf:{choices:[12,24],unit:'V'}, R1:{choices:[2,4],unit:'kΩ'}, R2:{choices:[4,6],unit:'kΩ'}, C:{choices:[10,20],unit:'µF'} },
    statement:function(p){ return 'ℰ('+p.emf+' V)-R₁-node, node-R₂-접지, node-C-접지 회로(RC 표준형). (a) t=0⁺ C 전류 (b) t→∞ v_C (c) τ(ms)를 구하라. (R kΩ, C µF)'; },
    solve:function(p){
      var i0=p.emf/p.R1; // mA
      var vinf=p.emf*p.R2/(p.R1+p.R2);
      var tau=p.R1*p.R2/(p.R1+p.R2)*p.C; // ms
      return { ans:{i0:i0, vinf:vinf, tau:tau}, unit:{i0:'mA', vinf:'V', tau:'ms'}, steps:[
        't=0⁺: C 단락 → i_C = ℰ/R₁ = '+SVH.fmt(i0)+' mA',
        '∞: 분압 '+SVH.fmt(vinf)+' V',
        'τ = (R₁∥R₂)C = '+SVH.fmt(tau)+' ms — 전전개 U6-l3-01의 물리 서술판' ] }; },
    hints:['3종 세트 절차.'] },
  { id:'u5-l4-06', level:4, type:'num', tags:['필라멘트 온도 추정'], src:'기출 유형',
    params:{ Rc:{choices:[10,15],unit:'Ω'}, P:{choices:[60,100],unit:'W'}, V:{choices:[120],unit:'V'} },
    statement:function(p){ return '전구('+p.P+' W/'+p.V+' V)의 상온(20°C) 저항이 '+p.Rc+' Ω이다. 텅스텐 α=4.5×10⁻³/°C로 동작 온도(°C)를 추정하라.'; },
    solve:function(p){
      var Rh=p.V*p.V/p.P;
      var T=20+(Rh/p.Rc-1)/4.5e-3;
      return { ans:T, unit:'°C', steps:[
        '동작 R = V²/P = '+SVH.fmt(Rh)+' Ω ('+SVH.fmt(Rh/p.Rc)+'배!)',
        'T = 20+(R/R₀−1)/α = '+SVH.fmt(T)+' °C (~2500°C 백열 — 켤 때 돌입전류의 이유)' ] }; },
    hints:['R비→ΔT.'] },
  { id:'u5-l4-07', level:4, type:'num', tags:['RC 깜빡이'], src:'기출 유형',
    params:{ emf:{choices:[90,120],unit:'V'}, Vf:{choices:[60,80],unit:'V'}, R:{choices:[1,2],unit:'MΩ'}, C:{choices:[1,2],unit:'µF'} },
    constraint:function(p){ return p.Vf<p.emf*0.9; },
    statement:function(p){ return '네온등 이완 발진기: C('+p.C+' µF)가 R('+p.R+' MΩ)로 충전되다 V_f='+p.Vf+' V에서 방전(점등)을 반복한다. 점멸 주기(s)를 구하라. (ℰ='+p.emf+' V, 방전 시간 무시)'; },
    solve:function(p){
      var tau=p.R*1e6*p.C*1e-6;
      var T=tau*Math.log(p.emf/(p.emf-p.Vf));
      return { ans:T, unit:'s', steps:[
        '충전 조건: V_f = ℰ(1−e^{−T/τ})',
        'T = τln[ℰ/(ℰ−V_f)] = '+SVH.fmt(T)+' s',
        '(RC로 시계 만들기 — 방향지시등·와이퍼의 원조)' ] }; },
    hints:['도달 시간 역산.'] },
  { id:'u5-l4-08', level:4, type:'num', tags:['에너지 오더 비교'], src:'기출 유형',
    params:{ C:{choices:[3000],unit:'F'}, V:{choices:[2.7],unit:'V'}, Wh:{choices:[10,12],unit:'Wh'} },
    statement:function(p){ return '수퍼커패시터(C='+p.C+' F, '+p.V+' V)와 리튬전지('+p.Wh+' Wh): (a) 커패시터 에너지(Wh) (b) 전지/커패시터 비를 구하고, 그럼에도 커패시터를 쓰는 이유를 답하라.'; },
    solve:function(p){
      var U=0.5*p.C*p.V*p.V/3600;
      return { ans:{U:U, ratio:p.Wh/U}, unit:{U:'Wh', ratio:'배'}, steps:[
        'U = ½CV² = '+SVH.fmt(0.5*p.C*p.V*p.V)+' J = '+SVH.fmt(U)+' Wh',
        '전지가 '+SVH.fmt(p.Wh/U)+'배 — 그러나 커패시터는 수십만 사이클·순간 대전력(l3-14)',
        '(에너지 밀도 vs 전력 밀도 — 소자 선택의 언어)' ] }; },
    hints:['J→Wh는 /3600.'] }
  ]
});
