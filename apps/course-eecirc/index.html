 body{font-size:16px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* 문제은행 공용 헬퍼 — 브라우저(런타임)와 node(검산 러너) 양쪽에서 동일 코드 실행 (이중 구현 금지) */
(function (g) {

    /* 유효숫자 정리 (부동소수 노이즈 제거). 표시용 — ans에는 절대 쓰지 말 것 */
    fmt: function (x, sig) {
      if (typeof x !== 'number' || !isFinite(x)) return String(x);
      if (x === 0) return '0';
      var v = Number(x.toPrecision(sig || 4));
      return String(v);
    },
    /* SI 접두 표기 (표시용) */
    si: function (x, unit, sig) {
      if (x === 0) return '0 ' + unit;
      var a = Math.abs(x);
      var P = [[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p']];
      for (var i = 0; i < P.length; i++) {
        if (a >= P[i][0] * 0.9999) return SVH.fmt(x / P[i][0], sig) + ' ' + P[i][1] + unit;
      }
      return SVH.fmt(x, sig) + ' ' + unit;
    },
    par: function (a, b) { return a * b / (a + b); },        // 병렬 저항
    par3: function (a, b, c) { return 1 / (1/a + 1/b + 1/c); },
    deg: function (rad) { return rad * 180 / Math.PI; },
    rad: function (d) { return d * Math.PI / 180; },

    cx: function (re, im) { return { re: re, im: im }; },
    cadd: function (a, b) { return { re: a.re + b.re, im: a.im + b.im }; },
    csub: function (a, b) { return { re: a.re - b.re, im: a.im - b.im }; },
    cmul: function (a, b) { return { re: a.re * b.re - a.im * b.im, im: a.re * b.im + a.im * b.re }; },
    cdiv: function (a, b) {
      var d = b.re * b.re + b.im * b.im;
      return { re: (a.re * b.re + a.im * b.im) / d, im: (a.im * b.re - a.re * b.im) / d };
    },
    cmag: function (a) { return Math.hypot(a.re, a.im); },
    cang: function (a) { return Math.atan2(a.im, a.re) * 180 / Math.PI; }, // deg
    cpar: function (a, b) { return SVH.cdiv(SVH.cmul(a, b), SVH.cadd(a, b)); },
    /* 2x2 / 3x3 실계수 선형계 풀이 (절점/망로 검산·풀이 공용) */
    solve2: function (a11, a12, b1, a21, a22, b2) {
      var D = a11 * a22 - a12 * a21;
      return [ (b1 * a22 - a12 * b2) / D, (a11 * b2 - b1 * a21) / D ];
    },
    solve3: function (A, b) { // A: 3x3 배열, b: [3]
      var d = SVH.det3(A);
      function rep(A, i, b) {
        var M = A.map(function (r) { return r.slice(); });
        for (var r = 0; r < 3; r++) M[r][i] = b[r];
        return M;
      }
      return [SVH.det3(rep(A,0,b))/d, SVH.det3(rep(A,1,b))/d, SVH.det3(rep(A,2,b))/d];
    },
    det3: function (A) {
      return A[0][0]*(A[1][1]*A[2][2]-A[1][2]*A[2][1])
           - A[0][1]*(A[1][0]*A[2][2]-A[1][2]*A[2][0])
           + A[0][2]*(A[1][0]*A[2][1]-A[1][1]*A[2][0]);
    }
  };
  g.SVH = SVH;
})(typeof window !== 'undefined' ? window : globalThis);

      return { ans:R, unit:'Ω', steps:[
        '선형 저항의 v–i 특성은 원점을 지나는 직선, 기울기 = R.',
        'R = '+p.V1+' / '+SVH.fmt(p.I1/1000)+' = '+SVH.fmt(R)+' Ω' ] }; },
    hints:['v–i 직선의 기울기가 저항이다.','단위 변환 주의(mA→A).'] },
  { id:'u1-l2-15', level:2, type:'num', tags:['전력 수지'], src:'창작 문제(검산됨)',
    params:{ P1:{min:5,max:40,step:5,unit:'W'}, P2:{min:5,max:40,step:5,unit:'W'} },
    statement:function(p){ return '회로에 소자가 셋뿐이다. 두 소자가 각각 '+p.P1+' W, '+p.P2+' W를 흡수한다면 셋째 소자가 공급하는 전력은?'; },
    solve:function(p){ var P=p.P1+p.P2;
      return { ans:P, unit:'W', steps:[
        '에너지 보존: 회로 전체 흡수 전력 합 = 0 (공급은 음의 흡수).',
        'p₃(공급) = '+p.P1+' + '+p.P2+' = '+SVH.fmt(P)+' W' ] }; },
    hints:['회로 전체에서 전력의 총합은 0이다.','흡수 합 = 공급 합'] },

  /* ---------- L3 응용·복합 (10) ---------- */
  { id:'u1-l3-01', level:3, type:'num', tags:['미분','전력'], src:'창작 문제(검산됨)',
    params:{ a:{min:2,max:6,step:1}, R:{min:2,max:20,step:2,unit:'Ω'}, t0:{min:1,max:3,step:1,unit:'s'} },
    statement:function(p){ return '전하 \\(q(t)='+p.a+'t^2\\) [C] 가 '+p.R+' Ω 저항을 통과한다. \\(t='+p.t0+'\\) s에서 저항이 소비하는 순시 전력은?'; },
    solve:function(p){ var I=2*p.a*p.t0, P=I*I*p.R;
      return { ans:P, unit:'W', steps:[
        '\\(i = dq/dt = 2\\cdot'+p.a+'t\\) → i('+p.t0+') = '+SVH.fmt(I)+' A',
        '\\(p = i^2R\\) = '+SVH.fmt(I)+'² × '+p.R+' = '+SVH.fmt(P)+' W' ] }; },
    hints:['먼저 전류를 미분으로 구한다.','p = i²R에 대입.'] },
  { id:'u1-l3-02', level:3, type:'num', tags:['KCL','KVL'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:10,max:30,step:2,unit:'V'}, R1:{min:2,max:10,step:1,unit:'Ω'}, R2:{min:2,max:10,step:1,unit:'Ω'} },
    statement:function(p){ return '전압원 '+p.Vs+' V에 R₁='+p.R1+' Ω, R₂='+p.R2+' Ω가 직렬로 연결된 단일 루프에서, R₂가 흡수하는 전력은?'; },
    solve:function(p){ var I=p.Vs/(p.R1+p.R2), P=I*I*p.R2;
      return { ans:P, unit:'W', steps:[
        'KVL: \\(V_s = I(R_1+R_2)\\) → I = '+p.Vs+'/'+(p.R1+p.R2)+' = '+SVH.fmt(I)+' A',
        '\\(p_{R2} = I^2R_2\\) = '+SVH.fmt(I)+'² × '+p.R2+' = '+SVH.fmt(P)+' W' ] }; },
    hints:['직렬 루프 전류부터 구한다.','그 전류로 i²R.'] },
  { id:'u1-l3-03', level:3, type:'num', tags:['종속전원'], src:'창작 문제(검산됨)',
    params:{ Is:{min:1,max:5,step:1,unit:'A'}, k:{min:2,max:4,step:1}, R:{min:2,max:8,step:2,unit:'Ω'} },
    statement:function(p){ return '전류원 '+p.Is+' A가 절점 A로 전류를 밀어넣고, 절점 A에서 저항 R='+p.R+' Ω와 종속 전류원(값 \\('+p.k+'i_R\\), 절점 A에서 나가는 방향)이 병렬로 접지에 연결되어 있다. \\(i_R\\)은 R로 흐르는 전류다. \\(i_R\\)은?'; },
    solve:function(p){ var iR=p.Is/(1+p.k);
      return { ans:iR, unit:'A', steps:[
        'KCL @A: \\(I_s = i_R + '+p.k+'i_R = (1+'+p.k+')i_R\\)',
        '\\(i_R = '+p.Is+'/'+(1+p.k)+' = '+SVH.fmt(iR)+'\\) A' ] }; },
    hints:['절점 A에서 KCL을 세운다.','종속 전원 값도 i_R로 표현된다.'] },
  { id:'u1-l3-04', level:3, type:'num', tags:['전력 수지','전원'], src:'창작 문제(검산됨)',
    params:{ V:{min:10,max:24,step:2,unit:'V'}, I:{min:2,max:6,step:1,unit:'A'}, R:{min:1,max:3,step:1,unit:'Ω'} },
    statement:function(p){ return '충전기가 배터리를 충전 중이다: 충전기 전압 '+p.V+' V, 전류 '+p.I+' A가 배터리 + 단자로 들어간다. 배터리 내부저항 '+p.R+' Ω에서 열로 새는 전력과 실제 저장되는 전력을 나눠 구하라. (배터리 = 내부 기전력 + 직렬 내부저항 모델, 단자 전압이 '+p.V+' V)'; },
    solve:function(p){ var Ploss=p.I*p.I*p.R, Pin=p.V*p.I, Pstore=Pin-Ploss;
      return { ans:{loss:Ploss, store:Pstore}, unit:{loss:'W', store:'W'}, steps:[
        '단자로 들어가는 총 전력: \\(p = VI\\) = '+p.V+'×'+p.I+' = '+SVH.fmt(Pin)+' W',
        '내부저항 손실: \\(I^2r\\) = '+p.I+'²×'+p.R+' = '+SVH.fmt(Ploss)+' W',
        '저장 전력 = '+SVH.fmt(Pin)+' − '+SVH.fmt(Ploss)+' = '+SVH.fmt(Pstore)+' W' ] }; },
    hints:['총 유입 전력에서 내부 손실을 뺀다.','손실은 I²r.'] },
  { id:'u1-l3-05', level:3, type:'num', tags:['적분','에너지'], src:'창작 문제(검산됨)',
    params:{ Im:{min:2,max:8,step:1,unit:'A'}, T:{min:2,max:6,step:2,unit:'s'} },
    statement:function(p){ return '전류가 t=0에서 '+p.Im+' A로 시작해 t='+p.T+' s에 0으로 선형 감소한다. 이 동안 단면을 통과한 총 전하는?'; },
    solve:function(p){ var Q=0.5*p.Im*p.T;
      return { ans:Q, unit:'C', steps:[
        '\\(q = \\int i\\,dt\\) = 전류–시간 그래프 아래 면적.',
        '삼각형 면적 = ½ × '+p.Im+' × '+p.T+' = '+SVH.fmt(Q)+' C' ] }; },
    hints:['전하는 전류의 적분(그래프 면적).','삼각형 면적 공식.'] },
  { id:'u1-l3-06', level:3, type:'num', tags:['KVL','종속전원'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:12,max:24,step:2,unit:'V'}, R1:{min:2,max:6,step:1,unit:'Ω'}, k:{min:1,max:3,step:1} },
    statement:function(p){ return '단일 루프: 전압원 '+p.Vs+' V → R₁='+p.R1+' Ω → 종속 전압원(값 \\('+p.k+'v_1\\), 전류 방향 기준 전압 강하, \\(v_1\\)은 R₁ 전압). 루프 전류는?'; },
    solve:function(p){ var I=p.Vs/(p.R1*(1+p.k));
      return { ans:I, unit:'A', steps:[
        'KVL: \\(V_s = v_1 + '+p.k+'v_1 = (1+'+p.k+')v_1\\), \\(v_1 = IR_1\\)',
        'I = '+p.Vs+'/('+(1+p.k)+'×'+p.R1+') = '+SVH.fmt(I)+' A' ] }; },
    hints:['v₁ = IR₁로 종속 전원 값을 치환.','KVL을 한 바퀴.'] },
  { id:'u1-l3-07', level:3, type:'num', tags:['실용','전력'], src:'창작 문제(검산됨)',
    params:{ P:{choices:[800,1200,1500,1800],unit:'W'}, V:{choices:[110,220],unit:'V'} },
    statement:function(p){ return '정격 '+p.P+' W / '+p.V+' V 전열기가 정격 전압에서 동작한다. 부하 전류와 등가 저항을 구하라.'; },
    solve:function(p){ var I=p.P/p.V, R=p.V*p.V/p.P;
      return { ans:{I:I, R:R}, unit:{I:'A', R:'Ω'}, steps:[
        '\\(I = P/V\\) = '+p.P+'/'+p.V+' = '+SVH.fmt(I)+' A',
        '\\(R = V^2/P\\) = '+p.V+'²/'+p.P+' = '+SVH.fmt(R)+' Ω' ] }; },
    hints:['정격 전력·전압에서 I = P/V.','R = V²/P.'] },
  { id:'u1-l3-08', level:3, type:'num', tags:['KCL','컨덕턴스'], src:'창작 문제(검산됨)',
    params:{ V:{min:6,max:24,step:2,unit:'V'}, G1:{min:1,max:5,step:1,unit:'mS'}, G2:{min:1,max:5,step:1,unit:'mS'} },
    statement:function(p){ return '전압 '+p.V+' V가 걸린 절점에서 접지로 컨덕턴스 G₁='+p.G1+' mS, G₂='+p.G2+' mS 두 소자가 병렬 연결되어 있다. 절점으로 유입되어야 하는 총 전류는 몇 mA인가?'; },
    solve:function(p){ var I=p.V*(p.G1+p.G2);
      return { ans:I, unit:'mA', steps:[
        '각 소자 전류 \\(i = Gv\\): i₁ = '+p.G1+'×'+p.V+' = '+SVH.fmt(p.G1*p.V)+' mA, i₂ = '+SVH.fmt(p.G2*p.V)+' mA',
        'KCL: 유입 = i₁+i₂ = '+SVH.fmt(I)+' mA (mS×V = mA)' ] }; },
    hints:['컨덕턴스에선 i = Gv가 편하다.','병렬이라 전압이 같다.'] },
  { id:'u1-l3-09', level:3, type:'num', tags:['효율'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:10,max:14,step:1,unit:'V'}, r:{choices:[0.5,1,1.5,2],unit:'Ω'}, I:{min:1,max:4,step:1,unit:'A'} },
    statement:function(p){ return '기전력 '+p.Vs+' V, 내부저항 '+p.r+' Ω인 전원이 부하에 '+p.I+' A를 공급한다. 부하 단자 전압과 전달 효율(부하전력/총공급전력)을 구하라.'; },
    solve:function(p){ var Vt=p.Vs-p.I*p.r, eff=Vt/p.Vs*100;
      return { ans:{Vt:Vt, eff:eff}, unit:{Vt:'V', eff:'%'}, steps:[
        '단자 전압: \\(V_t = V_s - I r\\) = '+p.Vs+' − '+p.I+'×'+p.r+' = '+SVH.fmt(Vt)+' V',
        '효율 = \\(V_t I / V_s I = V_t/V_s\\) = '+SVH.fmt(Vt)+'/'+p.Vs+' = '+SVH.fmt(eff)+' %' ] }; },
    hints:['내부저항 강하를 빼면 단자 전압.','효율에서 전류는 약분된다.'] },
  { id:'u1-l3-10', level:3, type:'num', tags:['비선형 소자'], src:'창작 문제(검산됨)',
    params:{ k:{choices:[0.5,1,2],unit:'mA/V²'}, V:{min:2,max:6,step:1,unit:'V'} },
    statement:function(p){ return '비선형 소자의 특성이 \\(i = '+p.k+'v^2\\) [mA, V] 이다. v = '+p.V+' V에서 (a) 전류, (b) 정적 저항 \\(R = v/i\\) 를 구하라. (kΩ)'; },
    solve:function(p){ var I=p.k*p.V*p.V, R=p.V/I;
      return { ans:{I:I, R:R}, unit:{I:'mA', R:'kΩ'}, steps:[
        'i = '+p.k+'×'+p.V+'² = '+SVH.fmt(I)+' mA',
        '정적 저항 R = v/i = '+p.V+'/'+SVH.fmt(I)+' = '+SVH.fmt(R)+' kΩ (V/mA = kΩ)',
        '(비선형이라 동작점마다 R이 다르다 — 옴 법칙이 "성립하지 않는" 것의 실제 의미)' ] }; },
    hints:['주어진 특성식에 대입.','정적 저항은 그 점에서의 v/i.'] },

  /* ---------- L4 시험급 (5) ---------- */
  { id:'u1-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'다음 진술 중 옳은 것을 모두 고른 조합은?<br>㉠ 중첩의 원리는 회로의 선형성에서 나온다<br>㉡ 테브난·노턴 등가는 비선형 회로에도 항상 적용된다<br>㉢ 이상 전류원 두 개를 서로 다른 값으로 직렬 연결하면 모순이다<br>㉣ 수동부호규약에서 p<0이면 소자가 전력을 공급한다',
    choices:['㉠㉢㉣','㉠㉡㉣','㉡㉢','㉠㉡㉢㉣'],
    answer:0, expl:'기출 1번(30점 다지선다) 유형. 테브난/노턴은 선형 회로에만 적용(㉡ 틀림). 중첩의 근거는 선형성이지 결합·교환법칙이 아니다.' },
  { id:'u1-l4-02', level:4, type:'num', tags:['전력 수지 종합'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:20,max:40,step:5,unit:'V'}, I1:{min:1,max:3,step:1,unit:'A'}, R1:{min:2,max:5,step:1,unit:'Ω'} },
    statement:function(p){ return '회로에 소자 4개: 전압원 '+p.Vs+' V(전류 '+p.I1+' A가 − 단자로 들어감 = 공급), 저항 R₁='+p.R1+' Ω(전류 '+p.I1+' A), 소자 X, 그리고 '+p.I1+' A가 흐르는 전류원(흡수 '+(p.Vs)+'×0.1 W). 전력 보존으로 소자 X의 흡수 전력을 구하라.'; },
    solve:function(p){ var Psup=p.Vs*p.I1, PR=p.I1*p.I1*p.R1, Pcs=p.Vs*0.1, PX=Psup-PR-Pcs;
      return { ans:PX, unit:'W', steps:[
        '공급 총량: \\(V_sI\\) = '+SVH.fmt(Psup)+' W',
        '저항 흡수: \\(I^2R_1\\) = '+SVH.fmt(PR)+' W, 전류원 흡수: '+SVH.fmt(Pcs)+' W',
        '보존: \\(p_X = '+SVH.fmt(Psup)+' − '+SVH.fmt(PR)+' − '+SVH.fmt(Pcs)+' = '+SVH.fmt(PX)+'\\) W',
        '검토: 모든 소자 흡수 합 = 공급 합 ✓' ] }; },
    hints:['회로 전체 전력 합 = 0.','각 소자의 흡수/공급 부호를 먼저 정리한다.'] },
  { id:'u1-l4-03', level:4, type:'num', tags:['종속전원','KCL·KVL 종합'], src:'창작 문제(검산됨)',
    params:{ Is:{min:2,max:6,step:1,unit:'A'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:3,max:9,step:3,unit:'Ω'}, k:{min:1,max:2,step:1} },
    statement:function(p){ return '절점 A: 전류원 '+p.Is+' A 유입. A에서 접지로 R₁='+p.R1+' Ω, 그리고 A→B로 R₂='+p.R2+' Ω. 절점 B에서 접지로 종속 전류원 \\('+p.k+'v_A\\) [A] (B에서 접지로, \\(v_A\\)는 A 전압)가 연결되고 B에는 다른 소자가 없다. \\(v_A\\)를 구하라.'; },
    solve:function(p){
      // KCL@B: (vA-vB)/R2 = k*vA  → vB = vA(1 - k R2)
      // KCL@A: Is = vA/R1 + (vA-vB)/R2 = vA/R1 + k vA
      var vA=p.Is/(1/p.R1+p.k);
      return { ans:vA, unit:'V', steps:[
        'KCL @B: R₂로 들어온 전류가 전부 종속 전원으로 → \\((v_A-v_B)/R_2 = '+p.k+'v_A\\)',
        'KCL @A: \\(I_s = v_A/R_1 + (v_A-v_B)/R_2 = v_A/R_1 + '+p.k+'v_A\\)',
        '\\(v_A = I_s/(1/R_1 + '+p.k+')\\) = '+p.Is+'/('+SVH.fmt(1/p.R1)+'+'+p.k+') = '+SVH.fmt(vA)+' V' ] }; },
    hints:['B에서 KCL을 먼저 세우면 (v_A−v_B)/R₂가 종속 전원 값과 같다.','그 결과를 A의 KCL에 대입.'] },
  { id:'u1-l4-04', level:4, type:'derive', tags:['유도'], src:'교재 표준',
    statement:'수동부호규약에서 전력 \\(p = vi\\)가 "흡수"를 뜻함을 전압·전류의 정의(\\(v=dw/dq\\), \\(i=dq/dt\\))에서 출발해 유도하고, 부호가 뒤집히는 두 경우를 정리하라.',
    steps:[
      '전압 정의: 단위 전하가 + 단자에서 − 단자로 이동하며 소자에 넘겨주는 에너지 \\(v = dw/dq\\). [무엇을] 에너지 관점 정의를 소환 [왜] 전력은 에너지의 시간율이므로',
      '전류 정의: \\(i = dq/dt\\) — 기준 방향을 + 단자로 들어가게 잡는다. [왜] 이 방향이면 전하가 에너지를 "놓고 가는" 쪽',
      '연쇄율: \\(p = \\dfrac{dw}{dt} = \\dfrac{dw}{dq}\\cdot\\dfrac{dq}{dt} = vi\\) — 이때 w는 소자가 받은 에너지이므로 p>0 = 흡수',
      '부호 반전 경우 ①: 실제 전류가 기준과 반대(i<0) → p<0 = 공급. ②: v<0(단자 극성 반대) → 역시 공급',
      '차원 체크: [V][A] = (J/C)(C/s) = J/s = W ✓ · 극한 체크: i=0 또는 v=0이면 p=0 (에너지 교환 없음) ✓'
    ],
    hints:['p = dw/dt에서 시작해 연쇄율로 분해한다.','기준 방향의 역할이 핵심이다.'],
    expl:'시험 서술형 대비: "왜 vi가 흡수인가"를 정의에서 유도할 수 있으면 부호 실수가 사라진다.' },
  { id:'u1-l4-05', level:4, type:'num', tags:['실험 연계','계측'], src:'기출 유형',
    params:{ Rm:{choices:[10000,50000,100000],unit:'Ω'}, R:{choices:[10000,20000,50000],unit:'Ω'}, Vs:{min:10,max:20,step:5,unit:'V'} },
    statement:function(p){ return '내부저항 '+SVH.si(p.Rm,'Ω')+'인 전압계로, '+p.Vs+' V 전원에 직렬 연결된 같은 값의 저항 R='+SVH.si(p.R,'Ω')+' 두 개 중 아래쪽 저항의 전압을 측정한다. (a) 참값 (b) 전압계가 읽는 값 (c) 오차율(%)을 구하라. (계측기의 부하 효과 — 실험 1 대비)'; },
    solve:function(p){
      var Vtrue=p.Vs/2;
      var Rpar=p.R*p.Rm/(p.R+p.Rm);
      var Vread=p.Vs*Rpar/(p.R+Rpar);
      var err=(Vtrue-Vread)/Vtrue*100;
      return { ans:{Vtrue:Vtrue, Vread:Vread, err:err}, unit:{Vtrue:'V', Vread:'V', err:'%'}, steps:[
        '참값: 같은 저항 분압 → \\(V = V_s/2\\) = '+SVH.fmt(Vtrue)+' V',
        '전압계 연결 시 아래 저항과 병렬: \\(R\\|R_m\\) = '+SVH.fmt(Rpar)+' Ω',
        '읽는 값: \\(V_s \\dfrac{R\\|R_m}{R + R\\|R_m}\\) = '+SVH.fmt(Vread)+' V',
        '오차율 = ('+SVH.fmt(Vtrue)+'−'+SVH.fmt(Vread)+')/'+SVH.fmt(Vtrue)+' × 100 = '+SVH.fmt(err)+' %',
        '(전압계 내부저항이 클수록 오차↓ — 이상 전압계는 R_m→∞)' ] }; },
    hints:['전압계는 측정 대상과 병렬로 붙는다.','병렬 등가를 만든 뒤 분압.'] },

  { id:'u1-l3-11', level:3, type:'num', tags:['정격·여유'], src:'창작 문제(검산됨)',
    params:{ R:{choices:[100,220,470],unit:'Ω'}, Pr:{choices:[0.25,0.5,1],unit:'W'}, m:{choices:[2,4]} },
    statement:function(p){ return p.Pr+' W 정격의 '+p.R+' Ω 저항을 정격의 1/'+p.m+'만 쓰는 보수 설계를 한다. (a) 허용 최대 전압 (b) 허용 최대 전류(mA)를 구하라.'; },
    solve:function(p){ var P=p.Pr/p.m, V=Math.sqrt(P*p.R), I=Math.sqrt(P/p.R)*1000;
      return { ans:{V:V, I:I}, unit:{V:'V', I:'mA'}, steps:[
        '사용 전력 한도 P = '+p.Pr+'/'+p.m+' = '+SVH.fmt(P)+' W',
        'V = √(PR) = '+SVH.fmt(V)+' V, I = √(P/R) = '+SVH.fmt(I)+' mA',
        '검토: VI = '+SVH.fmt(V*I/1000)+' W = P ✓' ] }; },
    hints:['여유율은 전력에 적용.','V·I 두 식이 같은 P에서 나온다.'] },
  { id:'u1-l3-12', level:3, type:'num', tags:['비선형 동작점'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:6,max:12,step:2,unit:'V'}, R:{choices:[1,2],unit:'kΩ'}, k:{choices:[0.5,1],unit:'mA/V²'} },
    statement:function(p){ return '전원 '+p.Vs+' V — R='+p.R+' kΩ — 비선형 소자(\\(i='+p.k+'v^2\\) [mA, V]) 직렬 회로의 동작점: 소자 전압 v를 구하라.'; },
    solve:function(p){
      // Vs = R·i + v = R·k·v² + v (R kΩ, k mA/V² → RK 곱은 V 단위 정합)
      var a=p.R*p.k, b=1, c=-p.Vs;
      var v=(-b+Math.sqrt(b*b-4*a*c))/(2*a);
      return { ans:v, unit:'V', steps:[
        'KVL: \\(V_s = R\\,i + v = '+SVH.fmt(a)+'v^2 + v\\) (kΩ×mA=V로 단위 정합)',
        '이차방정식 '+SVH.fmt(a)+'v²+v−'+p.Vs+'=0 → v = '+SVH.fmt(v)+' V (양의 근)',
        '검토: i = '+SVH.fmt(p.k*v*v)+' mA, R 강하 '+SVH.fmt(p.R*p.k*v*v)+' V, 합 = '+SVH.fmt(p.R*p.k*v*v+v)+' ≈ '+p.Vs+' ✓' ] }; },
    hints:['KVL에 소자 특성식을 대입하면 v의 이차방정식.','물리적 근(양수)을 고른다.'] },
  { id:'u1-l3-13', level:3, type:'num', tags:['적분 종합'], src:'창작 문제(검산됨)',
    params:{ I1:{min:2,max:6,step:2,unit:'A'}, t1:{choices:[2,4],unit:'s'}, t2:{choices:[6,8],unit:'s'} },
    statement:function(p){ return '전류 파형: 0→'+p.t1+' s 동안 0에서 '+p.I1+' A로 선형 증가, 이후 t='+p.t2+' s까지 '+p.I1+' A 유지. (a) 총 통과 전하 (b) 평균 전류를 구하라.'; },
    solve:function(p){
      var Q=0.5*p.I1*p.t1+p.I1*(p.t2-p.t1);
      var Iavg=Q/p.t2;
      return { ans:{Q:Q, Iavg:Iavg}, unit:{Q:'C', Iavg:'A'}, steps:[
        '면적: 삼각형 ½·'+p.I1+'·'+p.t1+' = '+SVH.fmt(0.5*p.I1*p.t1)+' + 직사각형 '+p.I1+'×'+(p.t2-p.t1)+' = '+SVH.fmt(p.I1*(p.t2-p.t1)),
        'Q = '+SVH.fmt(Q)+' C',
        '평균 전류 = Q/전체시간 = '+SVH.fmt(Iavg)+' A' ] }; },
    hints:['전하 = 그래프 면적을 조각으로.'] },
  { id:'u1-l3-14', level:3, type:'num', tags:['배터리 용량'], src:'창작 문제(검산됨)',
    params:{ Ah:{choices:[2,5,10],unit:'Ah'}, V:{choices:[3.7,12],unit:'V'}, P:{choices:[5,10,20],unit:'W'} },
    statement:function(p){ return p.V+' V, '+p.Ah+' Ah 배터리가 있다. (a) 저장 에너지(Wh) (b) '+p.P+' W 부하를 몇 시간 구동할 수 있는가? (이상 방전 가정)'; },
    solve:function(p){ var Wh=p.V*p.Ah, h=Wh/p.P;
      return { ans:{Wh:Wh, h:h}, unit:{Wh:'Wh', h:'h'}, steps:[
        '에너지 = V×Ah = '+SVH.fmt(Wh)+' Wh',
        '구동 시간 = '+SVH.fmt(Wh)+'/'+p.P+' = '+SVH.fmt(h)+' h',
        '(Ah는 전하 용량, Wh가 에너지 — 단위 구분이 채점 포인트)' ] }; },
    hints:['Ah×V=Wh.'] },
  { id:'u1-l4-06', level:4, type:'num', tags:['종속전원 전력 종합'], src:'기출 유형',
    params:{ Is:{min:2,max:4,step:1,unit:'A'}, R1:{min:2,max:6,step:2,unit:'Ω'}, k:{choices:[0.5,1.5]} },
    statement:function(p){ return '절점 v: 전류원 '+p.Is+' A 유입, R₁='+p.R1+' Ω로 접지, 종속 전류원 '+p.k+'v [A]가 절점에서 접지로. (a) v (b) 각 소자의 전력(공급 +/흡수 −로 부호 명시: 전류원, R₁, 종속 전원)을 구하고 합이 0임을 보여라.'; },
    solve:function(p){
      var v=p.Is/(1/p.R1+p.k);
      var Ps=v*p.Is;            // 전류원 공급
      var Pr=v*v/p.R1;          // R 흡수
      var Pd=v*(p.k*v);         // 종속 전원 흡수(전류가 +v에서 접지로)
      return { ans:{v:v, Ps:Ps, Pr:Pr, Pd:Pd}, unit:{v:'V', Ps:'W', Pr:'W', Pd:'W'}, steps:[
        'KCL: v = I_s/(1/R₁+'+p.k+') = '+SVH.fmt(v)+' V',
        '전류원 공급 = vI_s = '+SVH.fmt(Ps)+' W',
        'R₁ 흡수 = v²/R₁ = '+SVH.fmt(Pr)+' W, 종속 전원 흡수 = v·('+p.k+'v) = '+SVH.fmt(Pd)+' W',
        '수지: '+SVH.fmt(Ps)+' = '+SVH.fmt(Pr)+'+'+SVH.fmt(Pd)+' ✓ (종속 전원도 전력을 흡수/공급하는 실소자)' ] }; },
    hints:['종속 전원 전력도 p=vi로 그냥 계산.','합이 안 맞으면 부호 실수.'] },
  { id:'u1-l4-07', level:4, type:'num', tags:['허용오차 최악설계'], src:'기출 유형',
    params:{ Vs:{choices:[10,15],unit:'V'}, R:{choices:[100,220],unit:'Ω'}, tol:{choices:[5,10],unit:'%'} },
    statement:function(p){ return '±'+p.tol+'% 허용오차의 R='+p.R+' Ω 저항에 '+p.Vs+' V가 걸린다. 소비 전력의 (a) 최솟값 (b) 최댓값 (c) 공칭값 대비 최대 편차(%)를 구하라. (최악 상황 설계)'; },
    solve:function(p){
      var Rmin=p.R*(1-p.tol/100), Rmax=p.R*(1+p.tol/100);
      var Pmax=p.Vs*p.Vs/Rmin, Pmin=p.Vs*p.Vs/Rmax, P0=p.Vs*p.Vs/p.R;
      var dev=Math.max(Pmax-P0, P0-Pmin)/P0*100;
      return { ans:{Pmin:Pmin, Pmax:Pmax, dev:dev}, unit:{Pmin:'W', Pmax:'W', dev:'%'}, steps:[
        'P = V²/R → R 최소일 때 전력 최대: P_max = '+SVH.fmt(Pmax)+' W (R='+SVH.fmt(Rmin)+')',
        'P_min = '+SVH.fmt(Pmin)+' W',
        '최대 편차 = '+SVH.fmt(dev)+' % — 정격 선정 때 이 최악값 기준으로 (기출 1번 부품 진술의 실무 배경)' ] }; },
    hints:['반비례라 R 최소가 전력 최대.','편차는 양쪽을 다 보고 큰 쪽.'] },
  { id:'u1-l4-08', level:4, type:'derive', tags:['유도'], src:'교재 표준',
    statement:'키르히호프 전압 법칙(KVL)이 에너지 보존에서 나옴을 보이고, "전위"가 정의되기 위한 조건(보존장)과 연결해 서술하라.',
    steps:[
      '단위 전하를 폐경로로 한 바퀴 옮긴다고 하자. 각 소자에서 주고받는 에너지 = 그 소자의 전압(정의 v=dw/dq) [왜] 전압의 정의를 경로에 적용',
      '한 바퀴 돌아 제자리: 전하의 상태가 같으므로 순 에너지 변화 = 0 (에너지 보존)',
      '따라서 \\(\\sum_k v_k = 0\\) — 경로의 방향 규약(강하 +, 상승 −)만 일관되면 된다',
      '이것이 가능한 이유: 회로의 전기장이 보존장(∮E·dl=0)이라 "전위"라는 스칼라가 존재 — 절점전압법의 존재 근거',
      '극한 체크: 소자 하나뿐인 루프면 v=0(단락) ✓ · 시변 자기장이 루프를 관통하면 이 전제가 깨진다(유도 기전력)는 한계까지 알면 만점'
    ],
    hints:['단위 전하 사고실험.','전위가 왜 존재하는가까지 잇는다.'],
    expl:'기출 1번 개념 다지선다에서 "KVL의 근거"를 묻는 진술 판별의 근본.' },
  ]
});

</script>
<script>

SV_BANK.push({
  id: 'u2', no: 2, title: '저항 회로망', titleEn: 'Resistive Networks',
  scope: '직렬·병렬 등가 · 전압 분배 · 전류 분배 · 사다리 회로 · 브리지 균형 · 분압기의 부하 효과',
  problems: [

  /* ---------- L1 (10) ---------- */
  { id:'u2-l1-01', level:1, type:'tf', tags:['직렬'], src:'교재 표준',

  { id:'u2-l1-02', level:1, type:'tf', tags:['병렬'], src:'교재 표준',

    answer:true, expl:'병렬 = 같은 전압. \\(G_{eq}=\\sum G_i\\), 즉 \\(1/R_{eq}=\\sum 1/R_i\\).' },
  { id:'u2-l1-03', level:1, type:'mc', tags:['병렬 성질'], src:'교재 표준',
    statement:'서로 다른 두 저항을 병렬 연결한 등가저항에 대한 설명으로 옳은 것은?',

    answer:0, expl:'경로가 늘면 전류가 더 잘 흐른다 → 등가는 최솟값보다 작다. 같은 값 R 두 개면 R/2.' },
  { id:'u2-l1-04', level:1, type:'mc', tags:['단락·개방'], src:'교재 표준',
    statement:'저항 R에 단락(short)을 병렬로 붙이면 그 구간의 등가저항은?',
    choices:['0','R','∞','R/2'],
    answer:0, expl:'R ∥ 0 = 0. 반대로 개방(∞)을 병렬로 붙이면 R 그대로다. 회로 단순화의 기본 규칙.' },
  { id:'u2-l1-05', level:1, type:'tf', tags:['분압'], src:'교재 표준',
    statement:'전압 분배 법칙 \\(v_k = v_s R_k/\\sum R\\) 은 그 직렬 가지에 다른 부하가 병렬로 연결되어 있어도 그대로 성립한다.',
    answer:false, expl:'부하가 붙으면 해당 저항이 부하와 병렬로 바뀌어 분배비가 달라진다 — "분압기의 부하 효과" (기출 개념).' },
  { id:'u2-l1-06', level:1, type:'mc', tags:['분류'], src:'교재 표준',
    statement:'두 저항 병렬 분류(current divider)에서 \\(R_1\\)로 흐르는 전류는? (전체 전류 \\(i_s\\))',
    choices:['\\(i_s\\dfrac{R_2}{R_1+R_2}\\)','\\(i_s\\dfrac{R_1}{R_1+R_2}\\)','\\(i_s\\dfrac{R_1R_2}{R_1+R_2}\\)','\\(i_s/2\\)'],
    answer:0, expl:'전류는 "반대편 저항" 비율로 나뉜다 — 저항이 작은 쪽으로 더 많이 흐른다.' },
  { id:'u2-l1-07', level:1, type:'tf', tags:['전력'], src:'교재 표준',
    statement:'같은 전압원에 저항 두 개를 직렬로 걸 때보다 병렬로 걸 때 전원이 공급하는 총 전력이 크다.',
    answer:true, expl:'병렬 등가가 더 작아 전류가 많이 흐른다. \\(P=V^2/R_{eq}\\)에서 R_eq가 작을수록 P가 크다.' },
  { id:'u2-l1-08', level:1, type:'mc', tags:['브리지'], src:'교재 표준',
    statement:'휘트스톤 브리지가 평형(balanced)이 되는 조건은? (위쪽 \\(R_1,R_2\\), 아래쪽 \\(R_3,R_4\\), 검류계는 가운데)',
    choices:['\\(R_1R_4 = R_2R_3\\)','\\(R_1+R_4 = R_2+R_3\\)','\\(R_1R_2 = R_3R_4\\)','\\(R_1=R_4\\)'],
    answer:0, expl:'양쪽 분압비가 같으면 가운데 전압차 0 → 교차곱 조건. 평형이면 가운데 소자는 지워도 된다.' },
  { id:'u2-l1-09', level:1, type:'tf', tags:['가변저항'], src:'기출 유형',
    statement:'전위차계(potentiometer)는 3단자 가변 분압기로, 와이퍼 위치에 따라 출력 전압을 연속적으로 바꿀 수 있다.',
    answer:true, expl:'각도·위치 센서로 쓰는 이유(기출 6번 로봇팔 맥락). 다만 온도·마모로 저항값이 변할 수 있다는 한계도 기출 1번에 나왔다.' },
  { id:'u2-l1-10', level:1, type:'mc', tags:['등가 개념'], src:'교재 표준',
    statement:'"단자쌍에서 등가"라는 말의 정확한 의미는?',
    choices:['그 두 단자에서 본 v–i 관계가 같다','회로 내부 구조가 같다','소비 전력이 항상 같다','내부 각 소자의 전류가 같다'],
    answer:0, expl:'등가는 단자 관점의 개념. 내부 전력 분배까지 같을 필요는 없다 — 테브난 등가(U4)에서 중요해진다.' },

  /* ---------- L2 (15) ---------- */
  { id:'u2-l2-01', level:2, type:'num', tags:['직렬'], src:'창작 문제(검산됨)',
    params:{ R1:{min:100,max:900,step:100,unit:'Ω'}, R2:{min:100,max:900,step:100,unit:'Ω'}, R3:{min:100,max:900,step:100,unit:'Ω'} },
    statement:function(p){ return 'R₁='+p.R1+' Ω, R₂='+p.R2+' Ω, R₃='+p.R3+' Ω를 직렬 연결한 등가저항은?'; },
    solve:function(p){ var R=p.R1+p.R2+p.R3;
      return { ans:R, unit:'Ω', steps:['직렬은 같은 전류 → 전압 강하가 더해진다: \\(R_{eq}=R_1+R_2+R_3\\)','R_eq = '+p.R1+'+'+p.R2+'+'+p.R3+' = '+SVH.fmt(R)+' Ω'] }; },
    hints:['직렬은 그냥 더한다.'] },
  { id:'u2-l2-02', level:2, type:'num', tags:['병렬'], src:'창작 문제(검산됨)',
    params:{ R1:{min:10,max:100,step:10,unit:'Ω'}, R2:{min:10,max:100,step:10,unit:'Ω'} },
    statement:function(p){ return p.R1+' Ω ∥ '+p.R2+' Ω 병렬 등가저항은?'; },
    solve:function(p){ var R=SVH.par(p.R1,p.R2);
      return { ans:R, unit:'Ω', steps:['두 저항 병렬: \\(R_{eq}=\\dfrac{R_1R_2}{R_1+R_2}\\)','R_eq = '+p.R1+'×'+p.R2+'/'+(p.R1+p.R2)+' = '+SVH.fmt(R)+' Ω (최솟값보다 작은지 확인)'] }; },
    hints:['두 개 병렬은 곱/합.'] },
  { id:'u2-l2-03', level:2, type:'num', tags:['병렬'], src:'창작 문제(검산됨)',
    params:{ R:{min:60,max:600,step:60,unit:'Ω'}, n:{min:2,max:6,step:1} },
    statement:function(p){ return '같은 값 '+p.R+' Ω 저항 '+p.n+'개를 모두 병렬 연결하면 등가저항은?'; },
    solve:function(p){ var Re=p.R/p.n;
      return { ans:Re, unit:'Ω', steps:['같은 값 n개 병렬 → 컨덕턴스 n배: \\(R_{eq}=R/n\\)','R_eq = '+p.R+'/'+p.n+' = '+SVH.fmt(Re)+' Ω'] }; },
    hints:['컨덕턴스가 n배가 된다.'] },
  { id:'u2-l2-04', level:2, type:'num', tags:['혼합'], src:'창작 문제(검산됨)',
    params:{ R1:{min:100,max:500,step:100,unit:'Ω'}, R2:{min:100,max:500,step:100,unit:'Ω'}, R3:{min:100,max:500,step:100,unit:'Ω'} },
    statement:function(p){ return 'R₁='+p.R1+' Ω가 (R₂='+p.R2+' Ω ∥ R₃='+p.R3+' Ω)와 직렬이다. 전체 등가저항은?'; },
    solve:function(p){ var Rp=SVH.par(p.R2,p.R3), R=p.R1+Rp;
      return { ans:R, unit:'Ω', steps:[
        '병렬 먼저: R₂∥R₃ = '+SVH.fmt(Rp)+' Ω',
        '직렬 합: '+p.R1+' + '+SVH.fmt(Rp)+' = '+SVH.fmt(R)+' Ω' ] }; },
    hints:['안쪽 병렬부터 정리한다.'] },
  { id:'u2-l2-05', level:2, type:'num', tags:['분압'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:5,max:24,step:1,unit:'V'}, R1:{min:1,max:9,step:1,unit:'kΩ'}, R2:{min:1,max:9,step:1,unit:'kΩ'} },
    statement:function(p){ return p.Vs+' V 전원에 R₁='+p.R1+' kΩ, R₂='+p.R2+' kΩ가 직렬 연결. R₂ 양단 전압은?'; },
    solve:function(p){ var V=p.Vs*p.R2/(p.R1+p.R2);
      return { ans:V, unit:'V', steps:['분압 법칙: \\(V_2=V_s\\dfrac{R_2}{R_1+R_2}\\)','V₂ = '+p.Vs+'×'+p.R2+'/'+(p.R1+p.R2)+' = '+SVH.fmt(V)+' V'] }; },
    hints:['자기 저항/전체 합.'] },
  { id:'u2-l2-06', level:2, type:'num', tags:['분류'], src:'창작 문제(검산됨)',
    params:{ Is:{min:2,max:12,step:1,unit:'A'}, R1:{min:2,max:12,step:2,unit:'Ω'}, R2:{min:2,max:12,step:2,unit:'Ω'} },
    statement:function(p){ return '전체 전류 '+p.Is+' A가 R₁='+p.R1+' Ω, R₂='+p.R2+' Ω 병렬로 갈라진다. R₁의 전류는?'; },
    solve:function(p){ var I=p.Is*p.R2/(p.R1+p.R2);
      return { ans:I, unit:'A', steps:['분류 법칙(반대편 저항이 분자): \\(i_1=i_s\\dfrac{R_2}{R_1+R_2}\\)','i₁ = '+p.Is+'×'+p.R2+'/'+(p.R1+p.R2)+' = '+SVH.fmt(I)+' A'] }; },
    hints:['반대편 저항이 분자.'] },
  { id:'u2-l2-07', level:2, type:'num', tags:['분압·전력'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:9,max:24,step:3,unit:'V'}, R1:{min:100,max:400,step:100,unit:'Ω'}, R2:{min:100,max:400,step:100,unit:'Ω'} },
    statement:function(p){ return p.Vs+' V 전원 + R₁='+p.R1+' Ω + R₂='+p.R2+' Ω 직렬 회로에서 R₂의 소비 전력은?'; },
    solve:function(p){ var I=p.Vs/(p.R1+p.R2), P=I*I*p.R2;
      return { ans:P, unit:'W', steps:[
        'I = '+p.Vs+'/'+(p.R1+p.R2)+' = '+SVH.fmt(I)+' A',
        'P₂ = I²R₂ = '+SVH.fmt(P)+' W' ] }; },
    hints:['루프 전류부터.','P=i²R.'] },
  { id:'u2-l2-08', level:2, type:'num', tags:['3병렬'], src:'창작 문제(검산됨)',
    params:{ R1:{min:20,max:120,step:20,unit:'Ω'}, R2:{min:20,max:120,step:20,unit:'Ω'}, R3:{min:20,max:120,step:20,unit:'Ω'} },
    statement:function(p){ return p.R1+' Ω, '+p.R2+' Ω, '+p.R3+' Ω 세 저항의 병렬 등가저항은?'; },
    solve:function(p){ var R=SVH.par3(p.R1,p.R2,p.R3);
      return { ans:R, unit:'Ω', steps:[
        '\\(1/R_{eq} = 1/'+p.R1+'+1/'+p.R2+'+1/'+p.R3+'\\) = '+SVH.fmt(1/p.R1+1/p.R2+1/p.R3)+' S',
        'R_eq = '+SVH.fmt(R)+' Ω' ] }; },
    hints:['역수 합의 역수.'] },
  { id:'u2-l2-09', level:2, type:'num', tags:['설계'], src:'창작 문제(검산됨)',
    params:{ R1:{min:100,max:1000,step:100,unit:'Ω'}, Rt:{min:20,max:90,step:10,unit:'Ω'} },
    constraint:function(p){ return p.Rt < p.R1; },
    statement:function(p){ return 'R₁='+p.R1+' Ω에 어떤 저항 R₂를 병렬로 붙여 등가 '+p.Rt+' Ω를 만들려 한다. R₂는?'; },
    solve:function(p){ var R2=p.R1*p.Rt/(p.R1-p.Rt);
      return { ans:R2, unit:'Ω', steps:[
        '\\(1/R_2 = 1/R_t - 1/R_1\\)',
        'R₂ = R₁R_t/(R₁−R_t) = '+SVH.fmt(R2)+' Ω' ] }; },
    hints:['컨덕턴스로 빼면 한 줄.','목표 컨덕턴스에서 기존 것을 뺀다.'] },
  { id:'u2-l2-10', level:2, type:'num', tags:['사다리'], src:'창작 문제(검산됨)',
    params:{ R:{min:10,max:60,step:10,unit:'Ω'} },
    statement:function(p){ return '모두 '+p.R+' Ω인 저항으로: R 직렬 — (R ∥ (R 직렬 R)). 전체 등가저항은?'; },
    solve:function(p){ var Rp=SVH.par(p.R,2*p.R), R=p.R+Rp;
      return { ans:R, unit:'Ω', steps:[
        '안쪽: R+R = '+(2*p.R)+' Ω, 병렬: R∥2R = '+SVH.fmt(Rp)+' Ω',
        '직렬: '+p.R+' + '+SVH.fmt(Rp)+' = '+SVH.fmt(R)+' Ω' ] }; },
    hints:['가장 안쪽부터 접는다.'] },
  { id:'u2-l2-11', level:2, type:'num', tags:['분압 3단'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:10,max:30,step:5,unit:'V'}, R1:{min:1,max:5,step:1,unit:'kΩ'}, R2:{min:1,max:5,step:1,unit:'kΩ'}, R3:{min:1,max:5,step:1,unit:'kΩ'} },
    statement:function(p){ return p.Vs+' V에 R₁·R₂·R₃('+p.R1+'·'+p.R2+'·'+p.R3+' kΩ)가 직렬. R₂와 R₃에 걸리는 전압의 합은?'; },
    solve:function(p){ var V=p.Vs*(p.R2+p.R3)/(p.R1+p.R2+p.R3);
      return { ans:V, unit:'V', steps:['연속 구간 분압: \\(V=V_s\\dfrac{R_2+R_3}{R_1+R_2+R_3}\\)','V = '+p.Vs+'×'+(p.R2+p.R3)+'/'+(p.R1+p.R2+p.R3)+' = '+SVH.fmt(V)+' V'] }; },
    hints:['연속 구간의 분압은 그 구간 합/전체 합.'] },
  { id:'u2-l2-12', level:2, type:'num', tags:['전위차계'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:5,max:12,step:1,unit:'V'}, Rp:{choices:[1,5,10],unit:'kΩ'}, x:{min:10,max:90,step:10,unit:'%'} },
    statement:function(p){ return '총 '+p.Rp+' kΩ 전위차계에 '+p.Vs+' V를 걸었다. 와이퍼가 아래에서 '+p.x+'% 위치일 때 무부하 출력 전압은?'; },
    solve:function(p){ var V=p.Vs*p.x/100;
      return { ans:V, unit:'V', steps:['전위차계 = 위치비 분압기: \\(V_{out}=V_s\\dfrac{xR_p}{R_p}=V_s x\\)','V = '+p.Vs+'×'+(p.x/100)+' = '+SVH.fmt(V)+' V (무부하면 총 저항값과 무관!)'] }; },
    hints:['분압비 = 위치비.','무부하라는 조건이 핵심.'] },
  { id:'u2-l2-13', level:2, type:'num', tags:['등가·전류'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:12,max:36,step:4,unit:'V'}, R1:{min:100,max:300,step:50,unit:'Ω'}, R2:{min:100,max:300,step:50,unit:'Ω'} },
    statement:function(p){ return p.Vs+' V 전원에 R₁='+p.R1+' Ω ∥ R₂='+p.R2+' Ω가 연결되어 있다. 전원이 내보내는 총 전류는?'; },
    solve:function(p){ var Re=SVH.par(p.R1,p.R2), I=p.Vs/Re;
      return { ans:I, unit:'A', steps:[
        'R_eq = '+SVH.fmt(Re)+' Ω',
        'I = V/R_eq = '+SVH.fmt(I)+' A (또는 각 가지 전류 합)' ] }; },
    hints:['등가로 접거나, 가지별로 구해 더하거나 — 같아야 한다.'] },
  { id:'u2-l2-14', level:2, type:'num', tags:['혼합·전압'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:10,max:20,step:2,unit:'V'}, R1:{min:2,max:8,step:2,unit:'Ω'}, R2:{min:4,max:12,step:4,unit:'Ω'}, R3:{min:4,max:12,step:4,unit:'Ω'} },
    statement:function(p){ return p.Vs+' V 전원 → R₁='+p.R1+' Ω 직렬 → (R₂='+p.R2+' Ω ∥ R₃='+p.R3+' Ω). 병렬부 양단 전압은?'; },
    solve:function(p){ var Rp=SVH.par(p.R2,p.R3), V=p.Vs*Rp/(p.R1+Rp);
      return { ans:V, unit:'V', steps:[
        'R₂∥R₃ = '+SVH.fmt(Rp)+' Ω',
        '분압: V = '+p.Vs+' × '+SVH.fmt(Rp)+'/'+SVH.fmt(p.R1+Rp)+' = '+SVH.fmt(V)+' V' ] }; },
    hints:['병렬을 하나로 접은 뒤 분압.'] },
  { id:'u2-l2-15', level:2, type:'num', tags:['컨덕턴스 분류'], src:'창작 문제(검산됨)',
    params:{ Is:{min:6,max:18,step:2,unit:'mA'}, G1:{min:1,max:5,step:1,unit:'mS'}, G2:{min:1,max:5,step:1,unit:'mS'}, G3:{min:1,max:5,step:1,unit:'mS'} },
    statement:function(p){ return '전류 '+p.Is+' mA가 컨덕턴스 G₁·G₂·G₃('+p.G1+'·'+p.G2+'·'+p.G3+' mS) 병렬로 갈라진다. G₁의 전류는?'; },
    solve:function(p){ var I=p.Is*p.G1/(p.G1+p.G2+p.G3);
      return { ans:I, unit:'mA', steps:['컨덕턴스 분류(자기 것/합): \\(i_1=i_s\\dfrac{G_1}{G_1+G_2+G_3}\\)','i₁ = '+p.Is+'×'+p.G1+'/'+(p.G1+p.G2+p.G3)+' = '+SVH.fmt(I)+' mA'] }; },
    hints:['컨덕턴스에선 "자기 것/합" — 저항 분류와 반대 모양.'] },

  /* ---------- L3 (10) ---------- */
  { id:'u2-l3-01', level:3, type:'num', tags:['부하 효과'], src:'기출 유형',
    params:{ Vs:{min:10,max:20,step:2,unit:'V'}, R:{min:1,max:9,step:2,unit:'kΩ'}, RL:{min:1,max:9,step:2,unit:'kΩ'} },
    statement:function(p){ return '같은 값 R='+p.R+' kΩ 두 개로 만든 분압기(입력 '+p.Vs+' V)의 출력에 부하 R_L='+p.RL+' kΩ이 붙었다. (a) 무부하 출력 (b) 부하 시 출력을 구하라.'; },
    solve:function(p){ var V0=p.Vs/2, Rp=SVH.par(p.R,p.RL), VL=p.Vs*Rp/(p.R+Rp);
      return { ans:{V0:V0, VL:VL}, unit:{V0:'V', VL:'V'}, steps:[
        '무부하: 같은 저항 분압 = '+SVH.fmt(V0)+' V',
        '부하 시 아래쪽이 R∥R_L = '+SVH.fmt(Rp)+' kΩ로 변함',
        'V_L = '+p.Vs+'×'+SVH.fmt(Rp)+'/'+SVH.fmt(p.R+Rp)+' = '+SVH.fmt(VL)+' V (항상 무부하보다 낮다)' ] }; },
    hints:['부하는 아래 저항과 병렬이 된다.','기출 1번의 "부하 효과" 개념의 계산판.'] },
  { id:'u2-l3-02', level:3, type:'num', tags:['브리지 균형'], src:'창작 문제(검산됨)',
    params:{ R1:{min:100,max:900,step:100,unit:'Ω'}, R2:{min:100,max:900,step:100,unit:'Ω'}, R3:{min:100,max:900,step:100,unit:'Ω'} },
    statement:function(p){ return '휘트스톤 브리지 R₁='+p.R1+' Ω, R₂='+p.R2+' Ω, R₃='+p.R3+' Ω일 때 평형을 만드는 R₄(미지 저항)는? (R₁·R₄ = R₂·R₃ 배치)'; },
    solve:function(p){ var R4=p.R2*p.R3/p.R1;
      return { ans:R4, unit:'Ω', steps:['평형 조건(양쪽 분압비 동일): \\(R_1R_4=R_2R_3\\)','R₄ = R₂R₃/R₁ = '+p.R2+'×'+p.R3+'/'+p.R1+' = '+SVH.fmt(R4)+' Ω'] }; },
    hints:['교차곱이 같아야 한다.'] },
  { id:'u2-l3-03', level:3, type:'num', tags:['사다리 전체 해석'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:12,max:24,step:4,unit:'V'}, R:{min:2,max:10,step:2,unit:'Ω'} },
    statement:function(p){ return '모두 '+p.R+' Ω: 전원 '+p.Vs+' V → R(직렬) → 병렬 [R, (R 직렬 R)]. 마지막 저항(사다리 끝 R)에 걸리는 전압은?'; },
    solve:function(p){
      var Rp=SVH.par(p.R,2*p.R), Vp=p.Vs*Rp/(p.R+Rp), Vlast=Vp/2;
      return { ans:Vlast, unit:'V', steps:[
        '병렬부 등가 R∥2R = '+SVH.fmt(Rp)+' Ω → 병렬부 전압 = '+SVH.fmt(Vp)+' V',
        '오른쪽 가지(R–R 직렬) 내부 분압: 끝 R에는 절반 = '+SVH.fmt(Vlast)+' V' ] }; },
    hints:['접어서 병렬부 전압부터.','그 가지 안에서 다시 분압.'] },
  { id:'u2-l3-04', level:3, type:'num', tags:['전력 배분'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:12,max:24,step:6,unit:'V'}, R1:{min:4,max:12,step:4,unit:'Ω'}, R2:{min:4,max:12,step:4,unit:'Ω'} },
    statement:function(p){ return p.Vs+' V 전원에 R₁='+p.R1+' Ω ∥ R₂='+p.R2+' Ω. 각 저항의 소비 전력과 총 전력을 구하라.'; },
    solve:function(p){ var P1=p.Vs*p.Vs/p.R1, P2=p.Vs*p.Vs/p.R2, Pt=P1+P2;
      return { ans:{P1:P1,P2:P2,Pt:Pt}, unit:{P1:'W',P2:'W',Pt:'W'}, steps:[
        '병렬 = 같은 전압: P₁ = V²/R₁ = '+SVH.fmt(P1)+' W, P₂ = '+SVH.fmt(P2)+' W',
        '총합 '+SVH.fmt(Pt)+' W = V²/R_eq 로도 확인 가능 (작은 저항이 더 뜨겁다)' ] }; },
    hints:['병렬은 전압이 공통 → P=V²/R가 편하다.'] },
  { id:'u2-l3-05', level:3, type:'num', tags:['설계·정격'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:12,max:24,step:4,unit:'V'}, Vout:{min:3,max:9,step:1,unit:'V'}, Imax:{choices:[1,2,5],unit:'mA'} },
    constraint:function(p){ return p.Vout < p.Vs; },
    statement:function(p){ return p.Vs+' V에서 '+p.Vout+' V를 만드는 분압기를 설계한다. 분압기 자체에 흐르는 전류를 정확히 '+p.Imax+' mA로 하려면 R₁(위)과 R₂(아래)는?'; },
    solve:function(p){ var Rtot=p.Vs/(p.Imax/1000), R2=p.Vout/(p.Imax/1000), R1=Rtot-R2;
      return { ans:{R1:R1, R2:R2}, unit:{R1:'Ω', R2:'Ω'}, steps:[
        '총 저항: R₁+R₂ = V_s/I = '+SVH.fmt(Rtot)+' Ω',
        'R₂ = V_out/I = '+SVH.fmt(R2)+' Ω → R₁ = '+SVH.fmt(R1)+' Ω',
        '검토: 분압 '+p.Vs+'×'+SVH.fmt(R2)+'/'+SVH.fmt(Rtot)+' = '+SVH.fmt(p.Vs*R2/Rtot)+' V ✓' ] }; },
    hints:['전류 조건이 총 저항을 정한다.','출력 전압 조건이 R₂를 정한다.'] },
  { id:'u2-l3-06', level:3, type:'num', tags:['분류 3가지'], src:'창작 문제(검산됨)',
    params:{ Is:{min:6,max:24,step:6,unit:'A'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:3,max:12,step:3,unit:'Ω'}, R3:{min:4,max:12,step:4,unit:'Ω'} },
    statement:function(p){ return '전류원 '+p.Is+' A가 R₁·R₂·R₃('+p.R1+'·'+p.R2+'·'+p.R3+' Ω) 3병렬에 연결. R₂의 전류와 공통 전압을 구하라.'; },
    solve:function(p){ var Re=SVH.par3(p.R1,p.R2,p.R3), V=p.Is*Re, I2=V/p.R2;
      return { ans:{V:V, I2:I2}, unit:{V:'V', I2:'A'}, steps:[
        'R_eq = '+SVH.fmt(Re)+' Ω → 공통 전압 V = I·R_eq = '+SVH.fmt(V)+' V',
        'I₂ = V/R₂ = '+SVH.fmt(I2)+' A' ] }; },
    hints:['3가지 이상 분류는 "전압 먼저" 전략이 실수가 적다.'] },
  { id:'u2-l3-07', level:3, type:'num', tags:['개방·단락 분석'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:12,max:24,step:4,unit:'V'}, R1:{min:100,max:300,step:100,unit:'Ω'}, R2:{min:100,max:300,step:100,unit:'Ω'} },
    statement:function(p){ return p.Vs+' V → R₁='+p.R1+' Ω → R₂='+p.R2+' Ω 직렬 회로에서, R₂ 양단에 스위치가 병렬로 있다. (a) 스위치 열림 (b) 닫힘일 때 R₁의 전류를 각각 구하라.'; },
    solve:function(p){ var Iopen=p.Vs/(p.R1+p.R2), Iclosed=p.Vs/p.R1;
      return { ans:{Iopen:Iopen, Iclosed:Iclosed}, unit:{Iopen:'A', Iclosed:'A'}, steps:[
        '열림: I = V/(R₁+R₂) = '+SVH.fmt(Iopen)+' A',
        '닫힘: R₂가 단락되어 I = V/R₁ = '+SVH.fmt(Iclosed)+' A (전류 증가 — 과도 단원의 스위칭 회로 읽기 연습)' ] }; },
    hints:['닫힌 스위치 = 저항 0의 경로.','병렬의 0은 전체를 0으로.'] },
  { id:'u2-l3-08', level:3, type:'num', tags:['균형 브리지 등가'], src:'창작 문제(검산됨)',
    params:{ R:{min:60,max:240,step:60,unit:'Ω'} },
    statement:function(p){ return '다섯 저항이 모두 '+p.R+' Ω인 휘트스톤 브리지(가운데 포함)의 입력 단자 등가저항은?'; },
    solve:function(p){ var Re=p.R;
      return { ans:Re, unit:'Ω', steps:[
        '모두 같은 값 → 브리지 평형 → 가운데 저항엔 전류 0, 제거 가능',
        '남는 회로: (R+R) ∥ (R+R) = 2R∥2R = R = '+SVH.fmt(Re)+' Ω' ] }; },
    hints:['먼저 평형인지 확인한다.','평형이면 가운데는 없는 셈.'] },
  { id:'u2-l3-09', level:3, type:'num', tags:['실용 배선'], src:'창작 문제(검산됨)',
    params:{ Vs:{choices:[12,24],unit:'V'}, Rw:{choices:[0.5,1,1.5],unit:'Ω'}, RL:{min:5,max:20,step:5,unit:'Ω'} },
    statement:function(p){ return p.Vs+' V 전원에서 왕복 전선 저항 총 '+(2*p.Rw)+' Ω(편도 '+p.Rw+' Ω×2)을 거쳐 부하 '+p.RL+' Ω에 전력을 보낸다. 부하 전압과 전선 손실 전력을 구하라.'; },
    solve:function(p){ var Rw2=2*p.Rw, I=p.Vs/(Rw2+p.RL), VL=I*p.RL, Pw=I*I*Rw2;
      return { ans:{VL:VL, Pw:Pw}, unit:{VL:'V', Pw:'W'}, steps:[
        'I = '+p.Vs+'/'+SVH.fmt(Rw2+p.RL)+' = '+SVH.fmt(I)+' A',
        '부하 전압 = IR_L = '+SVH.fmt(VL)+' V, 전선 손실 = I²R_w = '+SVH.fmt(Pw)+' W' ] }; },
    hints:['전선도 직렬 저항이다.','왕복이므로 2배.'] },
  { id:'u2-l3-10', level:3, type:'num', tags:['등가저항 역산'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:10,max:30,step:5,unit:'V'}, I:{min:1,max:5,step:1,unit:'A'}, R1:{min:1,max:4,step:1,unit:'Ω'} },
    constraint:function(p){ return p.Vs/p.I - p.R1 > 0.5; },
    statement:function(p){ return p.Vs+' V 전원이 R₁='+p.R1+' Ω와 미지 저항 R₂의 직렬 회로에 '+p.I+' A를 흘린다. R₂와, R₂에서 소비되는 전력을 구하라.'; },
    solve:function(p){ var R2=p.Vs/p.I-p.R1, P2=p.I*p.I*R2;
      return { ans:{R2:R2, P2:P2}, unit:{R2:'Ω', P2:'W'}, steps:[
        'R_total = V/I = '+SVH.fmt(p.Vs/p.I)+' Ω → R₂ = '+SVH.fmt(R2)+' Ω',
        'P₂ = I²R₂ = '+SVH.fmt(P2)+' W' ] }; },
    hints:['전체 저항부터 역산.'] },

  /* ---------- L4 (5) ---------- */
  { id:'u2-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'옳은 진술을 모두 고른 것은?<br>㉠ 분압기 출력에 부하를 달면 출력 전압은 항상 낮아진다<br>㉡ 전류 분배에서 전류는 저항이 큰 가지로 더 많이 흐른다<br>㉢ 평형 브리지의 가운데 소자는 제거해도 나머지 회로에 영향이 없다<br>㉣ 같은 값 R 저항 n개 병렬의 등가는 R/n이다',
    choices:['㉠㉢㉣','㉠㉡㉣','㉢㉣','㉠㉡㉢'],
    answer:0, expl:'㉡이 반대다(작은 저항으로 더 많이). 부하 효과·평형 브리지·R/n은 모두 표준 결과.' },
  { id:'u2-l4-02', level:4, type:'num', tags:['사다리 종합'], src:'기출 유형',
    params:{ Vs:{min:12,max:36,step:6,unit:'V'}, R:{min:2,max:8,step:2,unit:'Ω'} },
    statement:function(p){ return '모두 '+p.R+' Ω인 2단 사다리: 전원 '+p.Vs+' V → R → [병렬: R, (R → [병렬: R, R])]. 맨 끝 저항의 전류를 구하라. (계산 순서를 명시할 것)'; },
    solve:function(p){
      var R=p.R;
      var s3=SVH.par(R,R);        // 끝단 병렬
      var s2=R+s3;                 // 직렬
      var s1=SVH.par(R,s2);        // 중간 병렬
      var Rt=R+s1;
      var It=p.Vs/Rt;
      var Vmid=It*s1;              // 중간 병렬부 전압
      var I2=Vmid/s2;              // 오른쪽 가지 전류
      var Vend=I2*s3;              // 끝 병렬부 전압
      var Iend=Vend/R;
      return { ans:Iend, unit:'A', steps:[
        '뒤에서 접기: R∥R='+SVH.fmt(s3)+', +R='+SVH.fmt(s2)+', ∥R='+SVH.fmt(s1)+', +R=총 '+SVH.fmt(Rt)+' Ω',
        '전원 전류 '+SVH.fmt(It)+' A → 중간 병렬부 전압 '+SVH.fmt(Vmid)+' V',
        '오른쪽 가지 전류 '+SVH.fmt(I2)+' A → 끝 병렬부 전압 '+SVH.fmt(Vend)+' V',
        '끝 저항 전류 = '+SVH.fmt(Iend)+' A' ] }; },
    hints:['뒤에서 앞으로 접고, 다시 앞에서 뒤로 전개.','각 단계 전압을 기록하며 간다.'] },
  { id:'u2-l4-03', level:4, type:'num', tags:['불평형 브리지'], src:'기출 유형',
    params:{ Vs:{min:10,max:20,step:5,unit:'V'}, R1:{min:100,max:300,step:100,unit:'Ω'}, R2:{min:100,max:300,step:100,unit:'Ω'}, R3:{min:100,max:300,step:100,unit:'Ω'}, R4:{min:100,max:300,step:100,unit:'Ω'} },
    statement:function(p){ return '브리지: '+p.Vs+' V 전원, 왼쪽 가지 위 R₁='+p.R1+' Ω·아래 R₃='+p.R3+' Ω, 오른쪽 가지 위 R₂='+p.R2+' Ω·아래 R₄='+p.R4+' Ω. 가운데는 (이상)전압계만 있다. 전압계가 읽는 값 \\(V_{AB}\\)(왼쪽 중점 − 오른쪽 중점)를 구하라.'; },
    solve:function(p){ var VA=p.Vs*p.R3/(p.R1+p.R3), VB=p.Vs*p.R4/(p.R2+p.R4), V=VA-VB;
      return { ans:V, unit:'V', steps:[
        '이상 전압계 = 전류 0 → 두 가지는 독립 분압기',
        'V_A = '+SVH.fmt(VA)+' V, V_B = '+SVH.fmt(VB)+' V',
        'V_AB = '+SVH.fmt(V)+' V (0이면 평형 — 교차곱 확인)' ] }; },
    hints:['이상 전압계는 개방과 같다.','각 가지를 따로 분압.'] },
  { id:'u2-l4-04', level:4, type:'num', tags:['감쇠기 설계'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:10,max:20,step:5,unit:'V'}, k:{choices:[2,4,5,10]}, Rtot:{choices:[10,20,50],unit:'kΩ'} },
    statement:function(p){ return '입력 '+p.Vs+' V를 정확히 1/'+p.k+'로 줄이는 분압기를, 총 저항 '+p.Rtot+' kΩ로 설계하라. R₁(위)·R₂(아래) 값과 출력 전압을 구하라.'; },
    solve:function(p){ var R2=p.Rtot/p.k, R1=p.Rtot-R2, Vo=p.Vs/p.k;
      return { ans:{R1:R1, R2:R2, Vo:Vo}, unit:{R1:'kΩ', R2:'kΩ', Vo:'V'}, steps:[
        '비율 조건: R₂/(R₁+R₂) = 1/'+p.k+' → R₂ = '+SVH.fmt(R2)+' kΩ',
        '총합 조건: R₁ = '+SVH.fmt(R1)+' kΩ',
        '출력 = '+SVH.fmt(Vo)+' V. 검토: 비율 '+SVH.fmt(R2/p.Rtot)+' = 1/'+p.k+' ✓' ] }; },
    hints:['두 조건(비율·총합)으로 2미지수.'] },
  { id:'u2-l4-05', level:4, type:'derive', tags:['유도'], src:'교재 표준',
    statement:'전압 분배 법칙 \\(v_2 = v_s\\dfrac{R_2}{R_1+R_2}\\) 를 KVL과 옴 법칙에서 유도하고, 극한으로 검증하라.',
    steps:[
      '직렬 루프이므로 두 저항에 같은 전류 i가 흐른다 [무엇을] KCL의 직렬 특수화 [왜] 갈라질 절점이 없으므로',
      'KVL: \\(v_s = iR_1 + iR_2 = i(R_1+R_2)\\) → \\(i = v_s/(R_1+R_2)\\)',
      '옴 법칙으로 \\(v_2 = iR_2 = v_s\\dfrac{R_2}{R_1+R_2}\\)',
      '극한 검증: \\(R_2\\to\\infty\\)(개방)이면 v₂→v_s ✓, \\(R_2\\to 0\\)(단락)이면 v₂→0 ✓, R₁=R₂이면 절반 ✓',
      '차원 체크: 저항비는 무차원이므로 [V] 유지 ✓ — 부하가 붙으면 이 유도의 첫 줄(같은 전류)이 깨진다는 것까지 말할 수 있어야 한다'
    ],
    hints:['직렬 = 같은 전류에서 출발.','극한 3개(개방·단락·동일)로 검증.'],
    expl:'유도 자체가 기출 1번 개념 문항들(부하 효과)의 뿌리다.' },

  { id:'u2-l3-11', level:3, type:'num', tags:['2단 분압 로딩'], src:'기출 유형',
    params:{ Vs:{choices:[12,24],unit:'V'}, R:{choices:[1,10],unit:'kΩ'} },
    statement:function(p){ return '모두 '+p.R+' kΩ인 분압기 2단을 버퍼 없이 직결: [R–R 분압] 출력에 다시 [R–R 분압]. 최종 출력 전압을 구하라. (이상적 ½×½='+SVH.fmt(p.Vs/4)+' V와 비교)'; },
    solve:function(p){
      var R=p.R;
      // v1 절점: (Vs-v1)/R = v1/R + (v1-v2)/R ; v2: (v1-v2)/R = v2/R
      var s=SVH.solve2(3/R,-1/R,p.Vs/R,-1/R,2/R,0);
      return { ans:s[1], unit:'V', steps:[
        '뒷단이 앞단의 아래 저항에 병렬로 걸린다 → 이상값(¼)보다 낮아진다',
        '절점 2개 연립: v₁='+SVH.fmt(s[0])+' V, v₂='+SVH.fmt(s[1])+' V',
        '이상 '+SVH.fmt(p.Vs/4)+' V 대비 '+SVH.fmt(s[1]/(p.Vs/4)*100)+'% — 버퍼가 필요한 이유의 정량화' ] }; },
    hints:['단순 곱(½×½)이 왜 틀리는지부터.','절점법 2미지수.'] },
  { id:'u2-l3-12', level:3, type:'num', tags:['4단 사다리'], src:'기출 유형',
    params:{ R:{min:2,max:8,step:2,unit:'Ω'} },
    statement:function(p){ return '모두 '+p.R+' Ω인 4단 사다리: 직렬R→병렬R→직렬R→병렬R (뒤가 개방). 입력 등가저항을 구하라.'; },
    solve:function(p){
      var R=p.R;
      var z=R;            // 마지막 병렬 R (개방 종단)
      z=R+z;              // 직렬
      z=SVH.par(R,z);     // 병렬
      z=R+z;              // 직렬
      return { ans:z, unit:'Ω', steps:[
        '뒤에서 접기: R(끝 병렬) → +R = '+SVH.fmt(2*R)+' → ∥R = '+SVH.fmt(SVH.par(R,2*R))+' → +R = '+SVH.fmt(z)+' Ω',
        '(단수가 늘수록 황금비 R(1+√5)/2 ≈ '+SVH.fmt(R*1.618)+' Ω로 수렴한다는 것도 알아두면 검산 감각)' ] }; },
    hints:['맨 끝부터 한 단씩.'] },
  { id:'u2-l3-13', level:3, type:'num', tags:['온도 드리프트'], src:'창작 문제(검산됨)',
    params:{ Vs:{choices:[10],unit:'V'}, R:{choices:[1000],unit:'Ω'}, alpha:{choices:[0.0039],unit:'1/°C'}, dT:{choices:[25,50],unit:'°C'} },
    statement:function(p){ return '같은 1 kΩ 저항 두 개의 분압기(출력=½V_s)에서 아래 저항만 구리 권선형이라 온도가 '+p.dT+' °C 오르면 R(1+αΔT), α='+p.alpha+'/°C로 변한다. (a) 새 출력 전압 (b) 출력 변화율(%)을 구하라.'; },
    solve:function(p){
      var R2=p.R*(1+p.alpha*p.dT);
      var v=p.Vs*R2/(p.R+R2), dv=(v-p.Vs/2)/(p.Vs/2)*100;
      return { ans:{v:v, dv:dv}, unit:{v:'V', dv:'%'}, steps:[
        'R₂ = 1000(1+'+p.alpha+'×'+p.dT+') = '+SVH.fmt(R2)+' Ω',
        'V = '+p.Vs+'×'+SVH.fmt(R2)+'/'+SVH.fmt(p.R+R2)+' = '+SVH.fmt(v)+' V',
        '변화율 = '+SVH.fmt(dv)+' % (기출 1번 "가변저항 온도 안정성" 진술의 정량판)' ] }; },
    hints:['한쪽만 변하면 분압비가 틀어진다.'] },
  { id:'u2-l3-14', level:3, type:'num', tags:['정격 한계 회로'], src:'기출 유형',
    params:{ R:{choices:[100,220],unit:'Ω'}, Pr:{choices:[0.25,0.5],unit:'W'} },
    statement:function(p){ return '같은 R='+p.R+' Ω('+p.Pr+' W 정격) 두 개를 (a) 직렬 (b) 병렬로 연결했을 때 전체에 걸 수 있는 최대 전압을 각각 구하라.'; },
    solve:function(p){
      var Vser=2*Math.sqrt(p.Pr*p.R); // 직렬: 각자에 절반 전압, 각자 P=Vh²/R ≤ Pr → Vh=√(PrR), 전체=2Vh
      var Vpar=Math.sqrt(p.Pr*p.R);   // 병렬: 각자에 전체 전압
      return { ans:{Vser:Vser, Vpar:Vpar}, unit:{Vser:'V', Vpar:'V'}, steps:[
        '직렬: 각 저항에 V/2 → (V/2)²/R ≤ P_r → V_max = 2√(P_rR) = '+SVH.fmt(Vser)+' V',
        '병렬: 각 저항에 V 전부 → V_max = √(P_rR) = '+SVH.fmt(Vpar)+' V',
        '(직렬이 전압 한계 2배 — 총 정격 전력은 두 경우 모두 2P_r로 같다는 점이 함정)' ] }; },
    hints:['한계는 "개별 저항"의 정격에서 나온다.'] },
  { id:'u2-l4-06', level:4, type:'num', tags:['분류 설계 2조건'], src:'기출 유형',
    params:{ Is:{choices:[10,20],unit:'mA'}, I1:{choices:[2,4],unit:'mA'}, R1:{choices:[6,12],unit:'kΩ'} },
    constraint:function(p){ return p.I1<p.Is/2; },
    statement:function(p){ return '전체 '+p.Is+' mA를 두 가지로 나눈다: R₁='+p.R1+' kΩ 가지에 정확히 '+p.I1+' mA가 흐르게 하는 (a) R₂ (b) 그때 공통 전압 (c) 각 저항의 소비 전력(mW)을 구하라.'; },
    solve:function(p){
      var V=p.I1*p.R1;                 // mA×kΩ=V
      var I2=p.Is-p.I1, R2=V/I2;
      var P1=V*p.I1, P2=V*I2;
      return { ans:{R2:R2, V:V, P1:P1, P2:P2}, unit:{R2:'kΩ', V:'V', P1:'mW', P2:'mW'}, steps:[
        '공통 전압 V = I₁R₁ = '+SVH.fmt(V)+' V',
        'I₂ = '+SVH.fmt(I2)+' mA → R₂ = V/I₂ = '+SVH.fmt(R2)+' kΩ',
        'P₁ = '+SVH.fmt(P1)+' mW, P₂ = '+SVH.fmt(P2)+' mW (전류 많이 가져간 쪽이 뜨겁다)' ] }; },
    hints:['병렬 = 공통 전압에서 출발하면 설계가 한 줄씩 풀린다.'] },
  { id:'u2-l4-07', level:4, type:'num', tags:['브리지 감도'], src:'기출 유형',
    params:{ Vs:{choices:[10],unit:'V'}, R:{choices:[100,350],unit:'Ω'}, dR:{choices:[0.5,1],unit:'Ω'} },
    statement:function(p){ return '스트레인게이지 브리지: 네 저항 모두 R='+p.R+' Ω로 평형, 한 저항만 R+ΔR(ΔR='+p.dR+' Ω)로 변했다. (a) 출력 전압(mV, 정확값) (b) 근사식 V_s·ΔR/4R와의 차이를 구하라.'; },
    solve:function(p){
      var Vex=p.Vs*( (p.R+p.dR)/(2*p.R+p.dR) - 0.5 )*1000;
      var Vap=p.Vs*p.dR/(4*p.R)*1000;
      return { ans:{Vex:Vex, Vap:Vap}, unit:{Vex:'mV', Vap:'mV'}, steps:[
        '정확: V = V_s[(R+ΔR)/(2R+ΔR) − ½] = '+SVH.fmt(Vex)+' mV',
        '근사: V ≈ V_sΔR/4R = '+SVH.fmt(Vap)+' mV',
        '차이 '+SVH.fmt(Math.abs(Vex-Vap))+' mV — ΔR≪R라 근사가 잘 맞는다(센서 공학의 표준 결과)' ] }; },
    hints:['변한 가지만 분압을 다시 쓴다.','ΔR 1차 근사와 비교.'] },

    hints:['전압원 전류는 마지막에 KCL로 회수한다.'] },
  { id:'u3-l2-10', level:2, type:'num', tags:['종속 전원(절점)'], src:'창작 문제(검산됨)',
    params:{ Is:{min:2,max:6,step:1,unit:'A'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'}, k:{min:1,max:3,step:1} },
    statement:function(p){ return '절점 v: 전류원 '+p.Is+' A 유입, v—접지 R₁='+p.R1+' Ω, v—접지로 전압제어 전류원 \\('+p.k+'v/'+p.R2+'\\) A(나가는 방향). v는?'; },
    solve:function(p){ var v=p.Is/(1/p.R1+p.k/p.R2);
      return { ans:v, unit:'V', steps:[
        'KCL: \\(I_s = v/R_1 + '+p.k+'v/'+p.R2+'\\)',
        'v = '+p.Is+'/('+SVH.fmt(1/p.R1)+'+'+SVH.fmt(p.k/p.R2)+') = '+SVH.fmt(v)+' V' ] }; },
    hints:['종속 전원 값이 이미 v로 표현되어 있다 — 그대로 KCL에.'] },
  { id:'u3-l2-11', level:2, type:'num', tags:['종속 전원(망로)'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:10,max:20,step:2,unit:'V'}, R1:{min:2,max:6,step:1,unit:'Ω'}, R2:{min:2,max:6,step:1,unit:'Ω'}, k:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return '단일 메시: '+p.Vs+' V → R₁='+p.R1+' Ω → R₂='+p.R2+' Ω → 전류제어 전압원 \\('+p.k+'i\\) V(전류 방향 기준 강하). 메시 전류 i는?'; },
    solve:function(p){ var i=p.Vs/(p.R1+p.R2+p.k);
      return { ans:i, unit:'A', steps:[
        'KVL: \\(V_s = iR_1 + iR_2 + '+p.k+'i\\)',
        'i = '+p.Vs+'/'+(p.R1+p.R2+p.k)+' = '+SVH.fmt(i)+' A (종속 전압원이 저항처럼 더해진 꼴)' ] }; },
    hints:['ki 항을 묶으면 등가 저항처럼 보인다.'] },
  { id:'u3-l2-12', level:2, type:'num', tags:['절점 2개+2전원'], src:'기출 유형',
    params:{ I1:{min:1,max:4,step:1,unit:'A'}, I2:{min:1,max:4,step:1,unit:'A'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'}, R3:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return '전류원 '+p.I1+' A → 절점1 유입, 전류원 '+p.I2+' A → 절점2 유입. 절점1—접지 R₁='+p.R1+' Ω, 절점1—절점2 R₂='+p.R2+' Ω, 절점2—접지 R₃='+p.R3+' Ω. v₁, v₂는?'; },
    solve:function(p){
      var s=SVH.solve2(1/p.R1+1/p.R2, -1/p.R2, p.I1, -1/p.R2, 1/p.R2+1/p.R3, p.I2);
      return { ans:{v1:s[0], v2:s[1]}, unit:{v1:'V', v2:'V'}, steps:[
        'KCL@1: \\((G_1+G_2)v_1 - G_2v_2 = I_1\\)',
        'KCL@2: \\(-G_2v_1 + (G_2+G_3)v_2 = I_2\\)',
        'v₁ = '+SVH.fmt(s[0])+' V, v₂ = '+SVH.fmt(s[1])+' V' ] }; },
    hints:['우변에 각 절점의 유입 전류원.'] },
  { id:'u3-l2-13', level:2, type:'num', tags:['망로 2개+2전원'], src:'창작 문제(검산됨)',
    params:{ V1:{min:6,max:18,step:3,unit:'V'}, V2:{min:3,max:12,step:3,unit:'V'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'}, R3:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return '메시1: 전원 '+p.V1+' V·R₁='+p.R1+' Ω, 공유 R₂='+p.R2+' Ω, 메시2: R₃='+p.R3+' Ω·전원 '+p.V2+' V(메시2 전류를 미는 방향). i₁, i₂(시계)는?'; },
    solve:function(p){
      var s=SVH.solve2(p.R1+p.R2, -p.R2, p.V1, -p.R2, p.R2+p.R3, p.V2);
      return { ans:{i1:s[0], i2:s[1]}, unit:{i1:'A', i2:'A'}, steps:[
        '메시1: \\((R_1+R_2)i_1 - R_2i_2 = '+p.V1+'\\)',
        '메시2: \\(-R_2i_1 + (R_2+R_3)i_2 = '+p.V2+'\\)',
        'i₁ = '+SVH.fmt(s[0])+' A, i₂ = '+SVH.fmt(s[1])+' A' ] }; },
    hints:['각 메시의 전원 부호를 방향 기준으로.'] },
  { id:'u3-l2-14', level:2, type:'num', tags:['가지 전압 회수'], src:'창작 문제(검산됨)',
    params:{ Is:{min:3,max:9,step:3,unit:'A'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'}, R3:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return 'u3-l2-02와 같은 회로('+p.Is+' A, R₁·R₂·R₃='+p.R1+'·'+p.R2+'·'+p.R3+' Ω)에서 R₂(절점1—절점2)에 걸리는 전압과 소비 전력을 구하라.'; },
    solve:function(p){
      var s=SVH.solve2(1/p.R1+1/p.R2, -1/p.R2, p.Is, -1/p.R2, 1/p.R2+1/p.R3, 0);
      var v=s[0]-s[1], P=v*v/p.R2;
      return { ans:{v:v, P:P}, unit:{v:'V', P:'W'}, steps:[
        'v₁='+SVH.fmt(s[0])+' V, v₂='+SVH.fmt(s[1])+' V',
        'R₂ 전압 = v₁−v₂ = '+SVH.fmt(v)+' V, 전력 = v²/R₂ = '+SVH.fmt(P)+' W' ] }; },
    hints:['가지 전압 = 두 절점전압의 차.'] },
  { id:'u3-l2-15', level:2, type:'num', tags:['식 세우기 검산'], src:'창작 문제(검산됨)',
    params:{ G1:{min:1,max:4,step:1,unit:'S'}, G2:{min:1,max:4,step:1,unit:'S'}, G3:{min:1,max:4,step:1,unit:'S'}, I:{min:2,max:10,step:2,unit:'A'} },
    statement:function(p){ return '컨덕턴스 행렬식이 \\(\\begin{bmatrix}'+(p.G1+p.G2)+' & -'+p.G2+'\\\\ -'+p.G2+' & '+(p.G2+p.G3)+'\\end{bmatrix}\\begin{bmatrix}v_1\\\\v_2\\end{bmatrix}=\\begin{bmatrix}'+p.I+'\\\\0\\end{bmatrix}\\) 일 때 v₂는? (G단위 S)'; },
    solve:function(p){
      var s=SVH.solve2(p.G1+p.G2, -p.G2, p.I, -p.G2, p.G2+p.G3, 0);
      return { ans:s[1], unit:'V', steps:[
        '크래머: \\(v_2 = \\dfrac{G_2 I}{(G_1+G_2)(G_2+G_3)-G_2^2}\\)',
        'v₂ = '+SVH.fmt(s[1])+' V' ] }; },
    hints:['2×2는 크래머가 빠르다.'] },

  /* ---------- L3 (10) ---------- */
  { id:'u3-l3-01', level:3, type:'num', tags:['절점 3개'], src:'창작 문제(검산됨)',
    params:{ Is:{min:2,max:6,step:2,unit:'A'}, R:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return '모든 저항 '+p.R+' Ω: 전류원 '+p.Is+' A → 절점1. 절점1—접지, 절점1—절점2, 절점2—접지, 절점2—절점3, 절점3—접지 각각 R. v₃를 구하라.'; },
    solve:function(p){
      var G=1/p.R;
      var s=SVH.solve3([[2*G,-G,0],[-G,3*G,-G],[0,-G,2*G]],[p.Is,0,0]);
      return { ans:s[2], unit:'V', steps:[
        '절점 3개 KCL (모두 G=1/R): 대각 [2G, 3G, 2G], 비대각 −G',
        '연립 해: v₁='+SVH.fmt(s[0])+', v₂='+SVH.fmt(s[1])+', v₃='+SVH.fmt(s[2])+' V' ] }; },
    hints:['3×3도 규칙은 같다: 대각=자기 합, 비대각=−공유.'] },
  { id:'u3-l3-02', level:3, type:'num', tags:['망로 3개'], src:'기출 유형',
    params:{ Vs:{min:6,max:12,step:3,unit:'V'}, R:{min:1,max:4,step:1,unit:'Ω'} },
    statement:function(p){ return '3메시 사다리(모든 저항 '+p.R+' Ω, 각 메시 사이 공유 저항도 '+p.R+' Ω): 메시1에만 전원 '+p.Vs+' V. 메시 저항행렬 대각 [2R,3R,2R], 비대각 −R일 때 i₃는?'; },
    solve:function(p){
      var s=SVH.solve3([[2*p.R,-p.R,0],[-p.R,3*p.R,-p.R],[0,-p.R,2*p.R]],[p.Vs,0,0]);
      return { ans:s[2], unit:'A', steps:[
        '행렬 그대로 연립: i₁='+SVH.fmt(s[0])+', i₂='+SVH.fmt(s[1])+', i₃='+SVH.fmt(s[2])+' A',
        '멀어질수록 전류가 줄어드는지(감쇠) 확인 — 사다리의 직관' ] }; },
    hints:['크래머 or 소거법.','기출 2(b)가 정확히 3메시 연립이다.'] },
  { id:'u3-l3-03', level:3, type:'num', tags:['초노드 종합'], src:'기출 유형',
    params:{ Vs:{min:2,max:6,step:1,unit:'V'}, Is:{min:2,max:6,step:2,unit:'A'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'}, R3:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return '절점1—절점2에 전압원 '+p.Vs+' V(+절점1). 절점1—접지 R₁='+p.R1+' Ω, 절점2—접지 R₂='+p.R2+' Ω와 R₃='+p.R3+' Ω(병렬), 전류원 '+p.Is+' A가 절점2로 유입. v₁·v₂와 전압원을 흐르는 전류(1→2 방향)를 구하라.'; },
    solve:function(p){
      var G2=1/p.R2+1/p.R3;
      var v2=(p.Is-p.Vs/p.R1)/(1/p.R1+G2), v1=v2+p.Vs;
      var i12=v2*G2-p.Is; // KCL@2: i(1→2) + Is = v2·G2
      return { ans:{v1:v1, v2:v2, i12:i12}, unit:{v1:'V', v2:'V', i12:'A'}, steps:[
        '초노드 KCL: \\(I_s = v_1/R_1 + v_2(1/R_2+1/R_3)\\), 구속 \\(v_1-v_2=V_s\\)',
        'v₂ = '+SVH.fmt(v2)+' V, v₁ = '+SVH.fmt(v1)+' V',
        '전압원 전류(1→2): 절점2 KCL로 회수 — \\(i_{12} + I_s = v_2(G_2+G_3)\\) → i₁₂ = '+SVH.fmt(i12)+' A' ] }; },
    hints:['다 푼 뒤 전압원 전류는 어느 한쪽 절점 KCL로.','부호(방향)를 명시하고 시작.'] },
  { id:'u3-l3-04', level:3, type:'num', tags:['초메시 종합'], src:'창작 문제(검산됨)',
    params:{ V1:{min:8,max:16,step:4,unit:'V'}, Is:{min:1,max:3,step:1,unit:'A'}, R1:{min:2,max:4,step:1,unit:'Ω'}, R2:{min:2,max:4,step:1,unit:'Ω'}, R3:{min:2,max:4,step:1,unit:'Ω'} },
    statement:function(p){ return '2메시: 메시1에 전원 '+p.V1+' V·R₁='+p.R1+' Ω·공유 저항 R₂='+p.R2+' Ω 아님 — 공유 가지에는 전류원 '+p.Is+' A(메시1 방향)와 직렬 저항 없음. 메시2에 R₂='+p.R2+' Ω·R₃='+p.R3+' Ω. i₁·i₂와 전류원 양단 전압(메시1 쪽 +)을 구하라.'; },
    solve:function(p){
      var i2=(p.V1-p.Is*p.R1)/(p.R1+p.R2+p.R3), i1=i2+p.Is;
      var vI=p.V1-i1*p.R1; // 메시1 KVL로 전류원 전압 회수
      return { ans:{i1:i1, i2:i2, vI:vI}, unit:{i1:'A', i2:'A', vI:'V'}, steps:[
        '구속: \\(i_1-i_2 = '+p.Is+'\\)',
        '초메시 KVL: \\(V_1 = i_1R_1 + i_2(R_2+R_3)\\) → i₂='+SVH.fmt(i2)+', i₁='+SVH.fmt(i1)+' A',
        '전류원 전압: 메시1 KVL 되짚기 \\(v_I = V_1 - i_1R_1\\) = '+SVH.fmt(vI)+' V' ] }; },
    hints:['전류원 전압은 마지막에 한 메시 KVL로 회수.'] },
  { id:'u3-l3-05', level:3, type:'num', tags:['종속+절점 2개'], src:'창작 문제(검산됨)',
    params:{ Is:{min:2,max:6,step:2,unit:'A'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'}, k:{min:1,max:2,step:1} },
    statement:function(p){ return '절점1: 전류원 '+p.Is+' A 유입, R₁='+p.R1+' Ω로 접지. 절점1—절점2 R₂='+p.R2+' Ω. 절점2—접지에 전류제어 전류원 \\('+p.k+'i_x\\)(아래로), \\(i_x\\)는 R₂의 1→2 전류. v₁, v₂는?'; },
    solve:function(p){
      // KCL@2: ix = k ix → ix(1-k)=0 ... 주의! 절점2에 다른 소자가 없으면 k=1일 때 부정.
      // 실제: KCL@2: (v1-v2)/R2 = k*(v1-v2)/R2 → (1-k)(v1-v2)=0 → k≠1이면 v1=v2 → ix=0
      // 그러면 KCL@1: Is = v1/R1 → v1=Is*R1
      var v1, v2;
      if (p.k !== 1) { v1 = p.Is*p.R1; v2 = v1; }
      return { ans:{v1:v1, v2:v2}, unit:{v1:'V', v2:'V'}, steps:[
        'KCL@2: \\(i_x = '+p.k+'i_x\\) → \\((1-'+p.k+')i_x = 0\\) → k≠1이므로 \\(i_x=0\\)',
        '즉 R₂에 전류가 없다 → v₁ = v₂',
        'KCL@1: \\(I_s = v_1/R_1\\) → v₁ = '+SVH.fmt(p.Is*p.R1)+' V = v₂',
        '(종속 전원 문제에서 "전류가 0이 강제되는" 특수 구조 — 방정식이 말해 주는 것을 믿어라)' ] };
    },
    constraint:function(p){ return p.k!==1; },
    hints:['절점2에 연결된 소자가 R₂와 종속 전원뿐이다.','KCL@2를 세우면 ix가 결정된다.'] },
  { id:'u3-l3-06', level:3, type:'num', tags:['종속+망로'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:10,max:20,step:5,unit:'V'}, R1:{min:2,max:4,step:1,unit:'Ω'}, R2:{min:2,max:4,step:1,unit:'Ω'}, R3:{min:2,max:4,step:1,unit:'Ω'}, k:{min:2,max:4,step:2,unit:'Ω'} },
    statement:function(p){ return '2메시: 메시1 전원 '+p.Vs+' V·R₁='+p.R1+' Ω, 공유 R₂='+p.R2+' Ω, 메시2 R₃='+p.R3+' Ω와 전류제어 전압원 \\('+p.k+'i_1\\) V(메시2 전류와 같은 방향으로 미는 극성). i₁, i₂는?'; },
    solve:function(p){
      // 메시1: (R1+R2)i1 - R2 i2 = Vs
      // 메시2: -R2 i1 + (R2+R3) i2 = k i1  →  -(R2+k) i1 + (R2+R3) i2 = 0
      var s=SVH.solve2(p.R1+p.R2, -p.R2, p.Vs, -(p.R2+p.k), p.R2+p.R3, 0);
      return { ans:{i1:s[0], i2:s[1]}, unit:{i1:'A', i2:'A'}, steps:[
        '메시1: \\((R_1+R_2)i_1 - R_2i_2 = V_s\\)',
        '메시2: \\(-R_2i_1 + (R_2+R_3)i_2 = '+p.k+'i_1\\) → 종속항을 좌변으로',
        'i₁ = '+SVH.fmt(s[0])+' A, i₂ = '+SVH.fmt(s[1])+' A' ] }; },
    hints:['종속 전원 값(k·i₁)을 미지수 쪽으로 넘겨 정리한다.'] },
  { id:'u3-l3-07', level:3, type:'num', tags:['혼합 전원 절점'], src:'기출 유형',
    params:{ Vs:{min:3,max:9,step:3,unit:'V'}, Is:{min:1,max:4,step:1,unit:'A'}, R1:{min:2,max:4,step:2,unit:'Ω'}, R2:{min:2,max:4,step:2,unit:'Ω'}, R3:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return '기출 2(a) 축소형: 전압원 '+p.Vs+' V(접지—절점1), 절점1—절점2 R₁='+p.R1+' Ω, 절점2—접지 R₂='+p.R2+' Ω, R₃='+p.R3+' Ω 병렬, 전류원 '+p.Is+' A 절점2 유입. 전압원을 흐르는 전류(전원에서 절점1로)를 구하라.'; },
    solve:function(p){
      var G2=1/p.R2+1/p.R3;
      // v1=Vs, KCL@2: (Vs-v2)/R1 + Is = v2*G2
      var v2=(p.Vs/p.R1+p.Is)/(1/p.R1+G2);
      var i=(p.Vs-v2)/p.R1; // 전압원 전류 = R1로 나가는 전류
      return { ans:i, unit:'A', steps:[
        'v₁ = '+p.Vs+' V (접지 연결 전압원)',
        'KCL@2: \\((v_1-v_2)/R_1 + I_s = v_2(1/R_2+1/R_3)\\) → v₂ = '+SVH.fmt(v2)+' V',
        '전압원 전류 = 절점1에서 나가는 유일한 경로 R₁의 전류 = (v₁−v₂)/R₁ = '+SVH.fmt(i)+' A' ] }; },
    hints:['절점1에 붙은 소자를 전부 나열하면 전압원 전류가 KCL로 나온다.'] },
  { id:'u3-l3-08', level:3, type:'num', tags:['브리지 망로'], src:'기출 유형',
    params:{ Is:{min:1,max:3,step:1,unit:'A'} },
    statement:function(p){ return '기출 4번 유형: 전류원 '+p.Is+' A가 브리지 회로(위 1 Ω·½ Ω, 가운데 ⅕ Ω, 아래 ¼ Ω·⅓ Ω)를 구동한다. 전류원이 메시1을 통째로 지나므로 \\(i_1='+p.Is+'\\) A로 고정된다. 가운데 가지(⅕ Ω)의 전류 \\(i_1-i_2... \\) 대신, 메시 2·3 연립을 풀어 \\(i=i_3-i_2\\)를 구하라. (메시2: 위 ½·가운데 ⅕ 공유·아래?? — 배열: 메시2 = [1, ½, ⅕], 메시3 = [¼, ⅓, ⅕])'; },
    solve:function(p){
      // 메시1 = 전류원 → i1 = Is. 저항(모두 Ω): 메시2: 1(i2-i1) + 1/2 i2 + 1/5 (i2-i3) = 0
      // 메시3: 1/4(i3-i1) + 1/5(i3-i2) + 1/3 i3 = 0
      var A=[[1+0.5+0.2, -0.2],[ -0.2, 0.25+0.2+1/3]];
      var b=[1*p.Is, 0.25*p.Is];
      var s=SVH.solve2(A[0][0],A[0][1],b[0],A[1][0],A[1][1],b[1]);
      var i=s[1]-s[0];
      return { ans:i, unit:'A', steps:[
        '전류원 메시: \\(i_1 = '+p.Is+'\\) A로 즉시 확정',
        '메시2: \\(1(i_2-i_1)+\\tfrac12 i_2+\\tfrac15(i_2-i_3)=0\\) → 1.7i₂ − 0.2i₃ = '+SVH.fmt(p.Is)+'',
        '메시3: \\(\\tfrac14(i_3-i_1)+\\tfrac15(i_3-i_2)+\\tfrac13 i_3=0\\) → −0.2i₂ + 0.7833i₃ = '+SVH.fmt(0.25*p.Is),
        'i₂='+SVH.fmt(s[0])+' A, i₃='+SVH.fmt(s[1])+' A → 가운데 가지 전류 i = i₃−i₂ = '+SVH.fmt(i)+' A' ] }; },
    hints:['전류원이 한 메시만 지나면 그 메시 전류는 공짜.','남은 2×2만 풀면 된다.'] },
  { id:'u3-l3-09', level:3, type:'num', tags:['해 검증'], src:'창작 문제(검산됨)',
    params:{ Is:{min:2,max:8,step:2,unit:'A'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'}, R3:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return 'u3-l2-02 회로('+p.Is+' A, R₁·R₂·R₃)에서 전원이 공급하는 전력과 세 저항이 소비하는 전력의 합을 각각 구해 일치함을 보여라.'; },
    solve:function(p){
      var s=SVH.solve2(1/p.R1+1/p.R2,-1/p.R2,p.Is,-1/p.R2,1/p.R2+1/p.R3,0);
      var v1=s[0], v2=s[1];
      var Psrc=v1*p.Is;
      var Pr=v1*v1/p.R1+(v1-v2)*(v1-v2)/p.R2+v2*v2/p.R3;
      return { ans:{Psrc:Psrc, Pr:Pr}, unit:{Psrc:'W', Pr:'W'}, steps:[
        'v₁='+SVH.fmt(v1)+' V, v₂='+SVH.fmt(v2)+' V',
        '전원 공급 = v₁·I_s = '+SVH.fmt(Psrc)+' W',
        '저항 합 = v₁²/R₁+(v₁−v₂)²/R₂+v₂²/R₃ = '+SVH.fmt(Pr)+' W → 일치 ✓ (전력 수지 검증법)' ] }; },
    hints:['전류원의 공급 전력은 그 양단 전압 × 전류.','일치하지 않으면 계산 실수.'] },
  { id:'u3-l3-10', level:3, type:'num', tags:['접지 이동'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:6,max:12,step:2,unit:'V'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return '전원 '+p.Vs+' V + R₁ + R₂ 직렬 루프에서, 기준(0 V)을 (a) 전원 − 단자 (b) R₁—R₂ 사이 절점으로 잡을 때 각각 전원 + 단자의 절점전압을 구하라. (R₁='+p.R1+', R₂='+p.R2+' Ω)'; },
    solve:function(p){
      var i=p.Vs/(p.R1+p.R2);
      var a=p.Vs;
      var b=i*p.R1;
      return { ans:{a:a, b:b}, unit:{a:'V', b:'V'}, steps:[
        '(a) − 단자가 0이면 + 단자는 그냥 V_s = '+SVH.fmt(a)+' V',
        '(b) 중간 절점이 0이면 + 단자 = R₁ 위쪽 = +iR₁ = '+SVH.fmt(b)+' V',
        '절점전압은 기준에 따라 바뀌지만 "가지 전압·전류"는 불변 — 접지는 좌표 원점일 뿐' ] }; },
    hints:['루프 전류는 기준과 무관하게 하나다.','기준에서 목표 절점까지 전압을 누적한다.'] },

  /* ---------- L4 (5) ---------- */
  { id:'u3-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'옳은 것을 모두 고르면?<br>㉠ 초노드 내부의 전압원 전류는 KCL 식에 나타나지 않는다<br>㉡ 망로 전류는 실제 가지 전류와 항상 같다<br>㉢ 종속 전원이 있어도 절점/망로법의 틀은 유지되고 보조식만 추가된다<br>㉣ 절점법 해는 임의 루프 KVL로 교차 검증할 수 있다',
    choices:['㉠㉢㉣','㉠㉡㉢','㉡㉣','전부'],
    answer:0, expl:'공유 가지에서는 가지 전류 = 메시 전류의 조합(차)이므로 ㉡이 틀렸다.' },
  { id:'u3-l4-02', level:4, type:'num', tags:['기출 2(a) 재현'], src:'기출 유형',
    params:{ V:{min:2,max:5,step:1,unit:'V'}, I:{min:1,max:3,step:1,unit:'A'}, R1:{min:1,max:3,step:1,unit:'Ω'}, R2:{min:1,max:3,step:1,unit:'Ω'}, R3:{min:2,max:4,step:1,unit:'Ω'}, R4:{min:2,max:4,step:1,unit:'Ω'} },
    statement:function(p){ return '절점 구조: 전류원 '+p.I+' A → 절점1 유입. 절점1—절점2 R₁='+p.R1+' Ω. 절점2—절점3에 전압원 '+p.V+' V(+가 절점3). 절점2—접지 R₃='+p.R3+' Ω, 절점3—접지 R₄='+p.R4+' Ω, 절점1—접지 R₂='+p.R2+' Ω. 절점전압을 모두 구하고 전압원을 흐르는 전류(2→3)를 구하라.'; },
    solve:function(p){
      // 초노드(2,3): v3 - v2 = V
      // KCL@1: I = v1/R2 + (v1-v2)/R1
      // KCL@(2+3): (v1-v2)/R1 = v2/R3 + v3/R4
      // 풀이: 미지수 v1, v2 (v3=v2+V)
      var a11=1/p.R2+1/p.R1, a12=-1/p.R1, b1=p.I;
      var a21=-1/p.R1, a22=1/p.R1+1/p.R3+1/p.R4, b2=-p.V/p.R4;
      var s=SVH.solve2(a11,a12,b1,a21,a22,b2);
      var v1=s[0], v2=s[1], v3=v2+p.V;
      var i23=v3/p.R4; // KCL@3: i(2→3, 전압원 통과) = R4로 나가는 전류
      return { ans:{v1:v1, v2:v2, v3:v3, i23:i23}, unit:{v1:'V', v2:'V', v3:'V', i23:'A'}, steps:[
        '구속: \\(v_3 = v_2 + '+p.V+'\\) (초노드)',
        'KCL@1: \\(I = v_1/R_2 + (v_1-v_2)/R_1\\)',
        '초노드 KCL: \\((v_1-v_2)/R_1 = v_2/R_3 + v_3/R_4\\) → v₃ 치환 후 2×2',
        'v₁='+SVH.fmt(v1)+', v₂='+SVH.fmt(v2)+', v₃='+SVH.fmt(v3)+' V',
        '전압원 전류(2→3) = 절점3 KCL: 전부 R₄로 → \\(i = v_3/R_4\\) = '+SVH.fmt(i23)+' A' ] }; },
    hints:['초노드 + 구속식 → 2미지수.','전압원 전류는 절점3 KCL이 제일 짧다.'] },
  { id:'u3-l4-03', level:4, type:'num', tags:['기출 2(b) 재현'], src:'기출 유형',
    params:{ Vs:{min:9,max:15,step:3,unit:'V'}, R1:{choices:[50],unit:'Ω'}, R2:{choices:[20],unit:'Ω'}, R3:{choices:[20],unit:'Ω'}, R4:{choices:[10],unit:'Ω'}, R5:{choices:[15],unit:'Ω'} },
    statement:function(p){ return '3메시 회로(기출 2(b) 구조): 메시1 [전원 '+p.Vs+' V, R₁='+p.R1+' Ω, 공유(1·2) R₂='+p.R2+' Ω], 메시2 [R₂, R₃='+p.R3+' Ω(공유 2·3), R₄='+p.R4+' Ω], 메시3 [R₃, R₅='+p.R5+' Ω]. R₄ 양단 전압(메시2 단독 소자)을 구하라. 모두 시계 방향.'; },
    solve:function(p){
      var A=[[p.R1+p.R2, -p.R2, 0],
             [-p.R2, p.R2+p.R3+p.R4, -p.R3],
             [0, -p.R3, p.R3+p.R5]];
      var s=SVH.solve3(A,[p.Vs,0,0]);
      var v=s[1]*p.R4;
      return { ans:v, unit:'V', steps:[
        '메시 행렬(대각=합, 비대각=−공유): [[ '+(p.R1+p.R2)+', −'+p.R2+', 0],[−'+p.R2+', '+(p.R2+p.R3+p.R4)+', −'+p.R3+'],[0, −'+p.R3+', '+(p.R3+p.R5)+']]',
        'i₁='+SVH.fmt(s[0])+', i₂='+SVH.fmt(s[1])+', i₃='+SVH.fmt(s[2])+' A',
        'R₄는 메시2에만 속함 → v = i₂R₄ = '+SVH.fmt(v)+' V' ] }; },
    hints:['3×3 연립 — 행렬 규칙으로 기계적으로.','단독 소자 전압 = 그 메시 전류 × R.'] },
  { id:'u3-l4-04', level:4, type:'num', tags:['종속 전원 종합'], src:'기출 유형',
    params:{ Is:{min:2,max:4,step:1,unit:'A'}, R1:{min:2,max:4,step:1,unit:'Ω'}, R2:{min:2,max:4,step:1,unit:'Ω'}, R3:{min:2,max:4,step:1,unit:'Ω'}, k:{min:1,max:2,step:1} },
    statement:function(p){ return '절점1: 전류원 '+p.Is+' A 유입, R₁='+p.R1+' Ω → 접지, R₂='+p.R2+' Ω → 절점2. 절점2: R₃='+p.R3+' Ω → 접지, 그리고 전압제어 전류원 \\('+p.k+'v_1\\) A가 절점2로 유입(v₁은 절점1 전압). v₁·v₂와, 종속 전원이 공급하는 전력을 구하라.'; },
    constraint:function(p){ /* 특이(해 없음) 조합 배제: 종속 이득이 임계점에 걸리면 회로가 불안정 */
      var det=(1/p.R1+1/p.R2)*(-(1/p.R2+1/p.R3))-(-1/p.R2)*(1/p.R2+p.k);
      return Math.abs(det)>0.05; },
    solve:function(p){
      // KCL@1: Is = v1/R1 + (v1-v2)/R2
      // KCL@2: (v1-v2)/R2 + k*v1 = v2/R3
      var a11=1/p.R1+1/p.R2, a12=-1/p.R2, b1=p.Is;
      var a21=1/p.R2+p.k, a22=-(1/p.R2+1/p.R3), b2=0;
      var s=SVH.solve2(a11,a12,b1,a21,a22,b2);
      var v1=s[0], v2=s[1];
      var Pdep=p.k*v1*v2; // 공급 전력 = 전류(k v1) × 양단 전압(v2), 유입 방향이므로 공급=I*V
      return { ans:{v1:v1, v2:v2, Pdep:Pdep}, unit:{v1:'V', v2:'V', Pdep:'W'}, steps:[
        'KCL@1: \\(I_s = v_1/R_1 + (v_1-v_2)/R_2\\)',
        'KCL@2: \\((v_1-v_2)/R_2 + '+p.k+'v_1 = v_2/R_3\\)',
        'v₁='+SVH.fmt(v1)+' V, v₂='+SVH.fmt(v2)+' V',
        '종속 전원 공급 전력 = ('+p.k+'v₁)·v₂ = '+SVH.fmt(Pdep)+' W (전류가 +전위 쪽으로 유입 → 공급)' ] }; },
    hints:['종속 전원도 KCL에선 그냥 전류다.','전력 부호는 방향·극성으로 판단.'] },
  { id:'u3-l4-05', level:4, type:'derive', tags:['유도'], src:'교재 표준',
    statement:'2절점 회로(각 절점—접지 컨덕턴스 \\(G_1, G_3\\), 절점 사이 \\(G_2\\), 절점1 유입 전류원 \\(I_s\\))의 절점 방정식을 행렬형 \\(\\mathbf{G}\\mathbf{v}=\\mathbf{i}\\) 로 유도하고, 행렬의 대칭성과 대각 우세가 왜 생기는지 설명하라.',
    steps:[
      'KCL@1: 나가는 전류 합 = 유입. \\(G_1v_1 + G_2(v_1-v_2) = I_s\\) [왜] 각 가지 전류를 절점전압으로 표현',
      'KCL@2: \\(G_3v_2 + G_2(v_2-v_1) = 0\\)',
      '정리: \\(\\begin{bmatrix}G_1+G_2 & -G_2\\\\ -G_2 & G_2+G_3\\end{bmatrix}\\begin{bmatrix}v_1\\\\v_2\\end{bmatrix}=\\begin{bmatrix}I_s\\\\0\\end{bmatrix}\\)',
      '대칭성: 비대각 원소는 둘 다 "−(공유 컨덕턴스)" — 같은 소자를 양쪽에서 본 것이므로 같다 (종속 전원이 끼면 깨진다)',
      '대각 우세: 대각 = 자기에게 붙은 모든 컨덕턴스 합 ≥ |비대각 합| — 물리적으로 "자기 전압을 올리면 나가는 전류가 는다"는 안정성',
      '차원 체크: [S][V]=[A] ✓ · 극한 체크: \\(G_2\\to 0\\)이면 두 절점이 분리되어 대각행렬(독립 두 회로) ✓'
    ],
    hints:['각 절점 KCL을 컨덕턴스로 쓰고 행렬로 재배열.','비대각이 왜 마이너스인지 말로 설명해 보라.'],
    expl:'행렬 규칙(대각=합, 비대각=−공유)을 "외우는 것"에서 "유도하는 것"으로 바꿔 준다 — 시험장에서 검산 도구가 된다.' },

  { id:'u3-l3-11', level:3, type:'num', tags:['종속 VCCS 절점'], src:'기출 유형',
    params:{ Is:{min:2,max:4,step:1,unit:'A'}, R1:{min:2,max:4,step:1,unit:'Ω'}, R2:{min:2,max:4,step:1,unit:'Ω'}, R3:{min:2,max:4,step:1,unit:'Ω'}, g:{choices:[0.25,0.5]} },
    statement:function(p){ return '절점1: 전류원 '+p.Is+' A 유입, R₁='+p.R1+' Ω→접지, R₂='+p.R2+' Ω→절점2. 절점2: R₃='+p.R3+' Ω→접지. 추가로 VCCS '+p.g+'·v₂ [A]가 절점1로 유입된다(v₂는 절점2 전압). v₁, v₂를 구하라.'; },
    solve:function(p){
      // @1: Is + g v2 = v1/R1 + (v1-v2)/R2
      // @2: (v1-v2)/R2 = v2/R3
      var a11=1/p.R1+1/p.R2, a12=-1/p.R2-p.g, b1=p.Is;
      var a21=-1/p.R2, a22=1/p.R2+1/p.R3, b2=0;
      var s=SVH.solve2(a11,a12,b1,a21,a22,b2);
      return { ans:{v1:s[0], v2:s[1]}, unit:{v1:'V', v2:'V'}, steps:[
        'KCL@1: \\(I_s + '+p.g+'v_2 = v_1/R_1+(v_1-v_2)/R_2\\) — 종속항을 좌변으로 옮기면 비대각이 비대칭이 된다',
        'KCL@2: \\((v_1-v_2)/R_2 = v_2/R_3\\)',
        'v₁ = '+SVH.fmt(s[0])+' V, v₂ = '+SVH.fmt(s[1])+' V (행렬 대칭이 깨지는 것이 종속 전원의 흔적)' ] }; },
    hints:['종속 전원 항을 미지수 쪽으로 정리.','대칭성 깨짐을 확인.'] },
  { id:'u3-l3-12', level:3, type:'num', tags:['초노드+전류원'], src:'기출 유형',
    params:{ Vs:{min:2,max:6,step:2,unit:'V'}, I1:{min:1,max:3,step:1,unit:'A'}, I2:{min:1,max:3,step:1,unit:'A'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return '절점1—절점2 사이 전압원 '+p.Vs+' V(+절점1). 전류원 '+p.I1+' A→절점1 유입, '+p.I2+' A→절점2 유입. R₁='+p.R1+' Ω(절점1—접지), R₂='+p.R2+' Ω(절점2—접지). v₁·v₂와 전압원 전류(1→2)를 구하라.'; },
    solve:function(p){
      var v2=(p.I1+p.I2-p.Vs/p.R1)/(1/p.R1+1/p.R2), v1=v2+p.Vs;
      var i12=v2/p.R2-p.I2; // KCL@2
      return { ans:{v1:v1, v2:v2, i12:i12}, unit:{v1:'V', v2:'V', i12:'A'}, steps:[
        '초노드 KCL: \\(I_1+I_2 = v_1/R_1+v_2/R_2\\), 구속 \\(v_1-v_2='+p.Vs+'\\)',
        'v₂ = '+SVH.fmt(v2)+' V, v₁ = '+SVH.fmt(v1)+' V',
        '전압원 전류: KCL@2 → \\(i_{12}+I_2 = v_2/R_2\\) → '+SVH.fmt(i12)+' A' ] }; },
    hints:['전류원 둘 다 초노드 우변에.','회수는 한쪽 절점에서.'] },
  { id:'u3-l3-13', level:3, type:'num', tags:['망로 3개 2전원'], src:'기출 유형',
    params:{ V1:{min:6,max:12,step:3,unit:'V'}, V3:{min:3,max:9,step:3,unit:'V'}, R:{min:1,max:3,step:1,unit:'Ω'} },
    statement:function(p){ return '3메시 사다리(모든 저항 '+p.R+' Ω, 행렬 대각 [2R,3R,2R], 비대각 −R): 메시1에 '+p.V1+' V, 메시3에 '+p.V3+' V(둘 다 자기 메시를 미는 방향). i₂를 구하라.'; },
    solve:function(p){
      var s=SVH.solve3([[2*p.R,-p.R,0],[-p.R,3*p.R,-p.R],[0,-p.R,2*p.R]],[p.V1,0,p.V3]);
      return { ans:s[1], unit:'A', steps:[
        '우변 [V₁, 0, V₃]로 3×3 연립',
        'i₁='+SVH.fmt(s[0])+', i₂='+SVH.fmt(s[1])+', i₃='+SVH.fmt(s[2])+' A',
        '(양끝에서 미는 전류가 가운데에 겹친다 — 중첩으로도 검산 가능)' ] }; },
    hints:['행렬 규칙 그대로, 우변만 두 곳.'] },
  { id:'u3-l3-14', level:3, type:'num', tags:['전류원 전압 회수'], src:'기출 유형',
    params:{ Is:{min:2,max:6,step:2,unit:'A'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'}, R3:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return '전류원 '+p.Is+' A가 절점1로: R₁='+p.R1+' Ω(→접지), R₂='+p.R2+' Ω(→절점2), R₃='+p.R3+' Ω(절점2→접지). (a) 전류원 양단 전압 (b) 전류원이 공급하는 전력을 구하라.'; },
    solve:function(p){
      var s=SVH.solve2(1/p.R1+1/p.R2,-1/p.R2,p.Is,-1/p.R2,1/p.R2+1/p.R3,0);
      var v1=s[0], P=v1*p.Is;
      return { ans:{v1:v1, P:P}, unit:{v1:'V', P:'W'}, steps:[
        '절점 연립 → v₁ = '+SVH.fmt(v1)+' V (전류원 양단 = 절점1—접지)',
        'P = v₁I_s = '+SVH.fmt(P)+' W',
        '(전류원의 전압은 "회로가 정해 준다" — 스스로는 전류만 고집)' ] }; },
    hints:['전류원 전압 = 그 절점전압.'] },
  { id:'u3-l4-06', level:4, type:'num', tags:['4절점 사다리 완주'], src:'기출 유형',
    params:{ Vs:{min:8,max:16,step:4,unit:'V'}, R:{min:2,max:4,step:1,unit:'Ω'} },
    statement:function(p){ return '전압원 '+p.Vs+' V(접지—절점1) 뒤로 모두 '+p.R+' Ω인 사다리: 절점1—2, 2—접지, 2—3, 3—접지, 3—4, 4—접지. v₄를 구하라. (절점법, v₁은 전원으로 확정)'; },
    solve:function(p){
      var R=p.R, G=1/R;
      var s=SVH.solve3([[3*G,-G,0],[-G,3*G,-G],[0,-G,2*G]],[p.Vs*G,0,0]);
      return { ans:s[2], unit:'V', steps:[
        'v₁='+p.Vs+' V 확정 → 미지수 v₂,v₃,v₄',
        '행렬 [[3G,−G,0],[−G,3G,−G],[0,−G,2G]]·v = [V_sG,0,0]',
        'v₂='+SVH.fmt(s[0])+', v₃='+SVH.fmt(s[1])+', v₄='+SVH.fmt(s[2])+' V (단마다 줄어드는 감쇠 사다리)' ] }; },
    hints:['접지 연결 전압원 = 미지수 하나 공짜.','3×3 기계 풀이.'] },
  { id:'u3-l4-07', level:4, type:'num', tags:['CCVS 망로'], src:'기출 유형',
    params:{ Vs:{min:10,max:20,step:5,unit:'V'}, R1:{min:2,max:4,step:1,unit:'Ω'}, R2:{min:2,max:4,step:1,unit:'Ω'}, R3:{min:2,max:4,step:1,unit:'Ω'}, r:{choices:[1,2],unit:'Ω'} },
    statement:function(p){ return '2메시: 메시1 [전원 '+p.Vs+' V, R₁='+p.R1+' Ω], 공유 R₂='+p.R2+' Ω, 메시2 [R₃='+p.R3+' Ω, CCVS '+p.r+'·i₁ V(메시2 전류를 미는 극성)]. (a) i₁·i₂ (b) CCVS가 공급하는 전력을 구하라.'; },
    solve:function(p){
      var s=SVH.solve2(p.R1+p.R2,-p.R2,p.Vs,-(p.R2+p.r),p.R2+p.R3,0);
      var Pd=p.r*s[0]*s[1];
      return { ans:{i1:s[0], i2:s[1], Pd:Pd}, unit:{i1:'A', i2:'A', Pd:'W'}, steps:[
        '메시2 KVL: \\('+p.r+'i_1 = (i_2-i_1)R_2 + i_2R_3\\) → 종속항 좌변 이항',
        'i₁ = '+SVH.fmt(s[0])+' A, i₂ = '+SVH.fmt(s[1])+' A',
        'CCVS 공급 = ('+p.r+'i₁)·i₂ = '+SVH.fmt(Pd)+' W (전압원의 전력 = 그 전압 × 지나는 전류)' ] }; },
    hints:['CCVS 값이 i₁에 걸려 있으니 이항만 조심.'] },
  { id:'u3-l4-08', level:4, type:'num', tags:['혼합 전원 완주'], src:'기출 유형',
    params:{ Vs:{min:3,max:6,step:1,unit:'V'}, Is:{min:1,max:3,step:1,unit:'A'}, R1:{min:2,max:4,step:1,unit:'Ω'}, R2:{min:2,max:4,step:1,unit:'Ω'}, R3:{min:2,max:4,step:1,unit:'Ω'} },
    statement:function(p){ return '기출 2(a) 완전형: 전압원 '+p.Vs+' V(접지—절점1), R₁='+p.R1+' Ω(절점1—절점2), R₂='+p.R2+' Ω(절점2—접지), R₃='+p.R3+' Ω(절점2—절점3), 전류원 '+p.Is+' A(절점3 유입), 절점3—접지는 개방. (a) v₂·v₃ (b) 전압원 전류 (c) 전체 전력 수지 확인값(공급 합)을 구하라.'; },
    solve:function(p){
      // 절점3: Is 유입, 나가는 길은 R3뿐 → (v3-v2)/R3 = Is... 방향: 전류원이 절점3에 넣으면 R3로 절점2로 흐른다
      // KCL@2: (v1-v2)/R1 + (v3-v2)/R3 = v2/R2, v1=Vs
      var v2=sv2(p), v3=v2+p.Is*p.R3;
      function sv2(p){
        var num=p.Vs/p.R1+p.Is;
        var den=1/p.R1+1/p.R2;
        return num/den;
      }
      var iV=(p.Vs-v2)/p.R1;
      var Psrc=p.Vs*iV+ p.Is*v3;
      return { ans:{v2:v2, v3:v3, iV:iV, Psrc:Psrc}, unit:{v2:'V', v3:'V', iV:'A', Psrc:'W'}, steps:[
        '절점3: 나가는 길이 R₃뿐 → R₃ 전류 = I_s (전부 절점2로) → v₃ = v₂ + I_sR₃',
        'KCL@2: \\((V_s-v_2)/R_1 + I_s = v_2/R_2\\) → v₂ = '+SVH.fmt(v2)+' V, v₃ = '+SVH.fmt(v3)+' V',
        '전압원 전류 = (V_s−v₂)/R₁ = '+SVH.fmt(iV)+' A'+(iV<0?' (음수 — 전원이 흡수 중!)':''),
        '공급 합 = V_s·i_V + I_s·v₃ = '+SVH.fmt(Psrc)+' W = 저항 소비 합(검산해 볼 것)' ] }; },
    hints:['막다른 절점의 전류원은 경로가 하나뿐이다.','전력 수지로 마무리 검산.'] },
  ]
});
