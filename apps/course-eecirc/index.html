  { id:'u4-l2-01', level:2, type:'num', tags:['전원 변환'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:6,max:24,step:2,unit:'V'}, R:{min:2,max:12,step:2,unit:'Ω'} },
    statement:function(p){ return '전압원 '+p.Vs+' V + 직렬 '+p.R+' Ω를 전류원+병렬 저항으로 변환하면?'; },
    solve:function(p){ var I=p.Vs/p.R;
      return { ans:{Is:I, R:p.R}, unit:{Is:'A', R:'Ω'}, steps:[
        '\\(I_s = V_s/R\\) = '+p.Vs+'/'+p.R+' = '+SVH.fmt(I)+' A',
        '저항은 같은 값 '+p.R+' Ω를 병렬로 (외부 v–i 특성 동일 확인: 개방 시 '+p.Vs+' V ✓)' ] }; },
    hints:['개방 전압·단락 전류가 같아야 한다.'] },
  { id:'u4-l2-02', level:2, type:'num', tags:['전원 변환 역'], src:'창작 문제(검산됨)',
    params:{ Is:{min:1,max:6,step:1,unit:'A'}, R:{min:3,max:15,step:3,unit:'Ω'} },
    statement:function(p){ return '전류원 '+p.Is+' A + 병렬 '+p.R+' Ω를 전압원+직렬 저항으로 변환하면?'; },
    solve:function(p){ var V=p.Is*p.R;
      return { ans:{Vs:V, R:p.R}, unit:{Vs:'V', R:'Ω'}, steps:[
        '\\(V_s = I_sR\\) = '+p.Is+'×'+p.R+' = '+SVH.fmt(V)+' V',
        '같은 R을 직렬로' ] }; },
    hints:['반대 방향 변환.'] },
  { id:'u4-l2-03', level:2, type:'num', tags:['테브난(분압기)'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:9,max:24,step:3,unit:'V'}, R1:{min:1,max:9,step:1,unit:'kΩ'}, R2:{min:1,max:9,step:1,unit:'kΩ'} },
    statement:function(p){ return p.Vs+' V 전원의 분압기(R₁='+p.R1+' kΩ 위, R₂='+p.R2+' kΩ 아래)의 출력 단자 테브난 등가(V_T, R_T)는?'; },
    solve:function(p){ var VT=p.Vs*p.R2/(p.R1+p.R2), RT=SVH.par(p.R1,p.R2);
      return { ans:{VT:VT, RT:RT}, unit:{VT:'V', RT:'kΩ'}, steps:[
        'V_T = 개방 전압 = 분압 '+SVH.fmt(VT)+' V',
        'R_T = 전원 끄고(단락) 위·아래가 병렬 = R₁∥R₂ = '+SVH.fmt(RT)+' kΩ',
        '(분압기 출력 임피던스가 R₁∥R₂라는 사실은 실무 단골)' ] }; },
    hints:['전원을 단락하면 R₁이 어디에 붙는지 그림으로.'] },
  { id:'u4-l2-04', level:2, type:'num', tags:['노턴'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:10,max:30,step:5,unit:'V'}, R1:{min:2,max:10,step:2,unit:'Ω'}, R2:{min:2,max:10,step:2,unit:'Ω'} },
    statement:function(p){ return '전압원 '+p.Vs+' V → 직렬 R₁='+p.R1+' Ω → 단자(단자 병렬로 R₂='+p.R2+' Ω). 이 단자의 노턴 등가(I_N, R_N)는?'; },
    solve:function(p){ var IN=p.Vs/p.R1, RN=SVH.par(p.R1,p.R2);
      return { ans:{IN:IN, RN:RN}, unit:{IN:'A', RN:'Ω'}, steps:[
        'I_N = 단자 단락 전류: 단락하면 R₂는 무시되고 I = V_s/R₁ = '+SVH.fmt(IN)+' A',
        'R_N = 전원 끄고 R₁∥R₂ = '+SVH.fmt(RN)+' Ω' ] }; },
    hints:['단락하면 병렬 저항엔 전류가 안 간다.'] },
  { id:'u4-l2-05', level:2, type:'num', tags:['Voc/Isc'], src:'기출 유형',
    params:{ Voc:{min:6,max:24,step:2,unit:'V'}, Isc:{min:1,max:8,step:1,unit:'A'} },
    statement:function(p){ return '어떤 선형 회로의 단자에서 개방 전압 '+p.Voc+' V, 단락 전류 '+p.Isc+' A를 측정했다. 테브난 저항과, 부하 정합 시 최대 전력을 구하라.'; },
    solve:function(p){ var RT=p.Voc/p.Isc, Pm=p.Voc*p.Voc/(4*RT);
      return { ans:{RT:RT, Pm:Pm}, unit:{RT:'Ω', Pm:'W'}, steps:[
        'R_T = V_oc/I_sc = '+SVH.fmt(RT)+' Ω',
        'P_max = V_oc²/(4R_T) = '+SVH.fmt(Pm)+' W (R_L=R_T일 때)' ] }; },
    hints:['측정 두 개면 등가가 나온다.'] },
  { id:'u4-l2-06', level:2, type:'num', tags:['부하 전류'], src:'창작 문제(검산됨)',
    params:{ VT:{min:6,max:24,step:2,unit:'V'}, RT:{min:2,max:10,step:2,unit:'Ω'}, RL:{min:2,max:20,step:2,unit:'Ω'} },
    statement:function(p){ return '테브난 등가 V_T='+p.VT+' V, R_T='+p.RT+' Ω에 부하 R_L='+p.RL+' Ω을 달았다. 부하 전류·전압·전력을 구하라.'; },
    solve:function(p){ var I=p.VT/(p.RT+p.RL), V=I*p.RL, P=I*I*p.RL;
      return { ans:{I:I, V:V, P:P}, unit:{I:'A', V:'V', P:'W'}, steps:[
        'I = V_T/(R_T+R_L) = '+SVH.fmt(I)+' A',
        'V = IR_L = '+SVH.fmt(V)+' V, P = I²R_L = '+SVH.fmt(P)+' W' ] }; },
    hints:['등가가 있으면 부하 계산은 한 루프.'] },
  { id:'u4-l2-07', level:2, type:'num', tags:['최대 전력'], src:'창작 문제(검산됨)',
    params:{ VT:{min:8,max:20,step:4,unit:'V'}, RT:{min:2,max:10,step:1,unit:'Ω'} },
    statement:function(p){ return 'V_T='+p.VT+' V, R_T='+p.RT+' Ω인 전원에서 (a) 최대 전력을 받는 R_L (b) 그때 부하 전력 (c) 그때 효율을 구하라.'; },
    solve:function(p){ var Pm=p.VT*p.VT/(4*p.RT);
      return { ans:{RL:p.RT, Pm:Pm, eff:50}, unit:{RL:'Ω', Pm:'W', eff:'%'}, steps:[
        '정합: R_L = R_T = '+p.RT+' Ω',
        'P_max = V_T²/4R_T = '+SVH.fmt(Pm)+' W',
        '이때 R_T에도 같은 전력이 떨어지므로 효율 = 50 %' ] }; },
    hints:['정합 조건과 그 대가(효율)를 같이 답한다.'] },
  { id:'u4-l2-08', level:2, type:'num', tags:['중첩 2전원'], src:'창작 문제(검산됨)',
    params:{ V1:{min:6,max:18,step:3,unit:'V'}, V2:{min:3,max:12,step:3,unit:'V'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return '전압원 V₁='+p.V1+' V — R₁='+p.R1+' Ω — (중간 절점) — R₂='+p.R2+' Ω — 전압원 V₂='+p.V2+' V(둘 다 +가 안쪽, 접지 공유). 중간 절점 전압을 중첩으로 구하라.'; },
    solve:function(p){
      var va=p.V1*p.R2/(p.R1+p.R2); // V2 끔
      var vb=p.V2*p.R1/(p.R1+p.R2); // V1 끔
      return { ans:{va:va, vb:vb, v:va+vb}, unit:{va:'V', vb:'V', v:'V'}, steps:[
        'V₂를 끄면(단락): 분압 v_a = V₁R₂/(R₁+R₂) = '+SVH.fmt(va)+' V',
        'V₁을 끄면: v_b = V₂R₁/(R₁+R₂) = '+SVH.fmt(vb)+' V',
        '합: v = '+SVH.fmt(va+vb)+' V (선형이므로 그냥 더한다)' ] }; },
    hints:['끈 전압원 자리는 전선(단락)이 된다.'] },
  { id:'u4-l2-09', level:2, type:'num', tags:['중첩 V+I'], src:'기출 유형',
    params:{ Vs:{min:6,max:18,step:6,unit:'V'}, Is:{min:1,max:4,step:1,unit:'A'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return '전압원 '+p.Vs+' V — R₁='+p.R1+' Ω — 절점 — R₂='+p.R2+' Ω — 접지, 그리고 전류원 '+p.Is+' A가 절점으로 유입. 절점 전압을 중첩으로 구하라.'; },
    solve:function(p){
      var va=p.Vs*p.R2/(p.R1+p.R2);
      var vb=p.Is*SVH.par(p.R1,p.R2);
      return { ans:{va:va, vb:vb, v:va+vb}, unit:{va:'V', vb:'V', v:'V'}, steps:[
        '전류원 끔(개방): 분압 v_a = '+SVH.fmt(va)+' V',
        '전압원 끔(단락): R₁∥R₂에 I_s → v_b = I_s(R₁∥R₂) = '+SVH.fmt(vb)+' V',
        'v = v_a + v_b = '+SVH.fmt(va+vb)+' V' ] }; },
    hints:['전원 종류별 끄는 방법이 다르다.'] },
  { id:'u4-l2-10', level:2, type:'num', tags:['R_T 접기'], src:'창작 문제(검산됨)',
    params:{ R1:{min:2,max:8,step:2,unit:'Ω'}, R2:{min:2,max:8,step:2,unit:'Ω'}, R3:{min:2,max:8,step:2,unit:'Ω'} },
    statement:function(p){ return '전압원(값 무관) — R₁='+p.R1+' Ω — 단자A, 단자A—접지에 R₂='+p.R2+' Ω, 직렬로 이어지는 R₃='+p.R3+' Ω가 단자 바깥에 있다. 단자(R₃ 끝—접지)에서 본 테브난 저항은?'; },
    solve:function(p){ var RT=p.R3+SVH.par(p.R1,p.R2);
      return { ans:RT, unit:'Ω', steps:[
        '전원 단락 → 안쪽은 R₁∥R₂ = '+SVH.fmt(SVH.par(p.R1,p.R2))+' Ω',
        '직렬 R₃ 더해 R_T = '+SVH.fmt(RT)+' Ω' ] }; },
    hints:['단자에서 "안으로" 보며 접는다.'] },
  { id:'u4-l2-11', level:2, type:'num', tags:['노턴→테브난'], src:'창작 문제(검산됨)',
    params:{ IN:{min:2,max:8,step:2,unit:'A'}, RN:{min:3,max:12,step:3,unit:'Ω'}, RL:{min:3,max:12,step:3,unit:'Ω'} },
    statement:function(p){ return '노턴 등가 I_N='+p.IN+' A, R_N='+p.RN+' Ω에 부하 R_L='+p.RL+' Ω. 부하 전류를 (a) 분류로 (b) 테브난 변환 후 직렬로 각각 구해 일치를 확인하라.'; },
    solve:function(p){
      var Ia=p.IN*p.RN/(p.RN+p.RL);
      var VT=p.IN*p.RN, Ib=VT/(p.RN+p.RL);
      return { ans:{Ia:Ia, Ib:Ib}, unit:{Ia:'A', Ib:'A'}, steps:[
        '(a) 분류: I_L = I_N·R_N/(R_N+R_L) = '+SVH.fmt(Ia)+' A',
        '(b) V_T = I_NR_N = '+SVH.fmt(VT)+' V → I_L = V_T/(R_N+R_L) = '+SVH.fmt(Ib)+' A',
        '일치 ✓ — 같은 물리의 두 표현' ] }; },
    hints:['등가끼리는 어떤 계산이든 같은 답.'] },
  { id:'u4-l2-12', level:2, type:'num', tags:['비례성'], src:'창작 문제(검산됨)',
    params:{ Vs1:{min:5,max:15,step:5,unit:'V'}, Io1:{min:1,max:3,step:1,unit:'A'}, Vs2:{min:20,max:40,step:10,unit:'V'} },
    statement:function(p){ return '선형 저항 회로에서 입력 '+p.Vs1+' V일 때 어떤 가지 전류가 '+p.Io1+' A였다. 입력을 '+p.Vs2+' V로 바꾸면 그 가지 전류는?'; },
    solve:function(p){ var I=p.Io1*p.Vs2/p.Vs1;
      return { ans:I, unit:'A', steps:[
        '선형성(비례성): 출력 ∝ 입력 (전원 1개)',
        'I = '+p.Io1+' × '+p.Vs2+'/'+p.Vs1+' = '+SVH.fmt(I)+' A' ] }; },
    hints:['전원이 하나면 스케일링이 전부다.'] },
  { id:'u4-l2-13', level:2, type:'num', tags:['등가 전압원 직렬'], src:'창작 문제(검산됨)',
    params:{ V1:{min:3,max:12,step:3,unit:'V'}, V2:{min:3,max:12,step:3,unit:'V'}, R1:{min:1,max:5,step:1,unit:'Ω'}, R2:{min:1,max:5,step:1,unit:'Ω'} },
    statement:function(p){ return '(V₁='+p.V1+' V, R₁='+p.R1+' Ω)과 (V₂='+p.V2+' V, R₂='+p.R2+' Ω) 두 실제 전압원(전지)이 같은 극성으로 직렬이다. 합성 테브난 등가는?'; },
    solve:function(p){ var VT=p.V1+p.V2, RT=p.R1+p.R2;
      return { ans:{VT:VT, RT:RT}, unit:{VT:'V', RT:'Ω'}, steps:[
        '직렬 전압원은 더해진다: V_T = '+p.V1+'+'+p.V2+' = '+SVH.fmt(VT)+' V',
        '내부저항도 직렬 합: R_T = '+p.R1+'+'+p.R2+' = '+SVH.fmt(RT)+' Ω' ] }; },
    hints:['전지 직렬의 모델화.'] },
  { id:'u4-l2-14', level:2, type:'num', tags:['등가 전류원 병렬'], src:'창작 문제(검산됨)',
    params:{ I1:{min:1,max:5,step:1,unit:'A'}, I2:{min:1,max:5,step:1,unit:'A'}, R1:{min:2,max:8,step:2,unit:'Ω'}, R2:{min:2,max:8,step:2,unit:'Ω'} },
    statement:function(p){ return '(I₁='+p.I1+' A, R₁='+p.R1+' Ω 병렬)과 (I₂='+p.I2+' A, R₂='+p.R2+' Ω 병렬) 두 노턴 전원이 같은 방향으로 병렬 결합. 합성 노턴 등가는?'; },
    solve:function(p){ var IN=p.I1+p.I2, RN=SVH.par(p.R1,p.R2);
      return { ans:{IN:IN, RN:RN}, unit:{IN:'A', RN:'Ω'}, steps:[
        '병렬 전류원은 더해진다: I_N = '+p.I1+'+'+p.I2+' = '+SVH.fmt(IN)+' A',
        '저항은 병렬 합성: R_N = R₁∥R₂ = '+SVH.fmt(RN)+' Ω' ] }; },
    hints:['노턴끼리 병렬은 그냥 더하기.'] },
  { id:'u4-l2-15', level:2, type:'num', tags:['개방 전압 vs 부하'], src:'기출 유형',
    params:{ VT:{min:10,max:20,step:2,unit:'V'}, RT:{choices:[100,500,1000],unit:'Ω'}, RL:{choices:[1000,10000],unit:'Ω'} },
    statement:function(p){ return '내부저항 '+p.RT+' Ω, 개방 전압 '+p.VT+' V인 신호원에 R_L='+SVH.si(p.RL,'Ω')+' 입력저항 계측기를 연결했다. 계측기가 읽는 전압과 개방 전압 대비 비율(%)은?'; },
    solve:function(p){ var V=p.VT*p.RL/(p.RT+p.RL), r=V/p.VT*100;
      return { ans:{V:V, r:r}, unit:{V:'V', r:'%'}, steps:[
        'V = V_T·R_L/(R_T+R_L) = '+SVH.fmt(V)+' V',
        '비율 = '+SVH.fmt(r)+' % → R_L ≫ R_T일수록 100%에 접근(기출 1(j)의 정량판)' ] }; },
    hints:['좋은 전압 측정 = 큰 입력저항.'] },

  /* ---------- L3 (10) ---------- */
  { id:'u4-l3-01', level:3, type:'num', tags:['테브난 종합'], src:'기출 유형',
    params:{ Vs:{min:12,max:24,step:4,unit:'V'}, R1:{min:2,max:8,step:2,unit:'Ω'}, R2:{min:2,max:8,step:2,unit:'Ω'}, R3:{min:1,max:5,step:1,unit:'Ω'} },
    statement:function(p){ return '전압원 '+p.Vs+' V — R₁='+p.R1+' Ω — 절점A(—접지 R₂='+p.R2+' Ω) — R₃='+p.R3+' Ω — 단자B. 단자 B—접지의 테브난 등가를 구하라.'; },
    solve:function(p){
      var VT=p.Vs*p.R2/(p.R1+p.R2); // 개방이라 R3 전류 0
      var RT=p.R3+SVH.par(p.R1,p.R2);
      return { ans:{VT:VT, RT:RT}, unit:{VT:'V', RT:'Ω'}, steps:[
        '개방 시 R₃ 전류 0 → V_oc = 절점A 전압 = 분압 '+SVH.fmt(VT)+' V (R₃ 강하 없음!)',
        'R_T = R₃ + R₁∥R₂ = '+SVH.fmt(RT)+' Ω' ] }; },
    hints:['개방 단자로는 전류가 못 흐른다 — R₃의 역할에 주의.'] },
  { id:'u4-l3-02', level:3, type:'num', tags:['2단 전원 변환'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:12,max:24,step:6,unit:'V'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'}, R3:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return '전압원 '+p.Vs+' V+직렬 R₁='+p.R1+' Ω → (절점—접지 R₂='+p.R2+' Ω) → 직렬 R₃='+p.R3+' Ω → 단자. 전원 변환을 반복해 단자 테브난 등가를 구하라.'; },
    solve:function(p){
      var I1=p.Vs/p.R1, Rp=SVH.par(p.R1,p.R2);
      var V2=I1*Rp, RT=Rp+p.R3;
      return { ans:{VT:V2, RT:RT}, unit:{VT:'V', RT:'Ω'}, steps:[
        '변환1: ('+p.Vs+' V, '+p.R1+' Ω 직렬) → ('+SVH.fmt(I1)+' A, '+p.R1+' Ω 병렬)',
        'R₁∥R₂ = '+SVH.fmt(Rp)+' Ω → 다시 전압원으로: V = I·R = '+SVH.fmt(V2)+' V',
        'R₃ 직렬 흡수 → V_T='+SVH.fmt(V2)+' V, R_T='+SVH.fmt(RT)+' Ω' ] }; },
    hints:['변환→병렬 합→역변환→직렬 합의 리듬.'] },
  { id:'u4-l3-03', level:3, type:'num', tags:['중첩 3전원'], src:'창작 문제(검산됨)',
    params:{ V1:{min:6,max:12,step:6,unit:'V'}, V2:{min:6,max:12,step:6,unit:'V'}, Is:{min:1,max:3,step:1,unit:'A'}, R1:{min:2,max:4,step:2,unit:'Ω'}, R2:{min:2,max:4,step:2,unit:'Ω'} },
    statement:function(p){ return 'u4-l2-08 회로(V₁, R₁, 절점, R₂, V₂)에 전류원 '+p.Is+' A가 절점으로 추가 유입된다. 절점 전압을 중첩 3항으로 구하라.'; },
    solve:function(p){
      var va=p.V1*p.R2/(p.R1+p.R2), vb=p.V2*p.R1/(p.R1+p.R2), vc=p.Is*SVH.par(p.R1,p.R2);
      return { ans:{va:va, vb:vb, vc:vc, v:va+vb+vc}, unit:{va:'V', vb:'V', vc:'V', v:'V'}, steps:[
        'V₁만: '+SVH.fmt(va)+' V · V₂만: '+SVH.fmt(vb)+' V · I_s만: '+SVH.fmt(vc)+' V',
        '합 = '+SVH.fmt(va+vb+vc)+' V — 절점법으로 한 번에 풀어 검산 가능' ] }; },
    hints:['전원 3개 = 항 3개.'] },
  { id:'u4-l3-04', level:3, type:'num', tags:['측정 기반 R_T'], src:'기출 유형',
    params:{ Voc:{min:10,max:20,step:2,unit:'V'}, RL:{choices:[10,20,50],unit:'Ω'}, frac:{choices:[0.5,0.6,0.8]} },
    statement:function(p){ var VL=p.Voc*p.frac; return '개방 전압이 '+p.Voc+' V인 회로에 R_L='+p.RL+' Ω을 달았더니 단자 전압이 '+SVH.fmt(VL)+' V가 되었다. 테브난 저항은? (단락이 위험해 V_oc/I_sc를 못 쓰는 상황)'; },
    solve:function(p){ var VL=p.Voc*p.frac, RT=p.RL*(p.Voc-VL)/VL;
      return { ans:RT, unit:'Ω', steps:[
        '분압 역산: \\(V_L = V_{oc}\\dfrac{R_L}{R_T+R_L}\\)',
        'R_T = R_L(V_oc−V_L)/V_L = '+SVH.fmt(RT)+' Ω',
        '(안전한 실측법 — 기출 1(g)의 실무 확장)' ] }; },
    hints:['분압식을 R_T에 대해 푼다.'] },
  { id:'u4-l3-05', level:3, type:'num', tags:['종속 전원 R_T'], src:'기출 유형',
    params:{ R1:{min:2,max:6,step:2,unit:'Ω'}, k:{choices:[0.5,2]} },
    statement:function(p){ return '단자에 시험 전압 \\(v_t\\)를 걸었더니 유입 전류가 \\(i_t = v_t/'+p.R1+' + '+p.k+'v_t\\) [A]로 측정되는 회로(내부에 종속 전원 존재). 테브난 저항은?'; },
    solve:function(p){ var RT=1/(1/p.R1+p.k);
      return { ans:RT, unit:'Ω', steps:[
        '종속 전원 회로의 R_T = 시험 전원법: \\(R_T = v_t/i_t\\)',
        'R_T = 1/(1/'+p.R1+'+'+p.k+') = '+SVH.fmt(RT)+' Ω',
        '(전원 끄고 접기가 불가능한 이유: 종속 전원은 끌 수 없다)' ] }; },
    hints:['R_T = v_t/i_t 정의로 돌아간다.'] },
  { id:'u4-l3-06', level:3, type:'num', tags:['최대 전력 설계'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:12,max:24,step:6,unit:'V'}, R1:{min:2,max:8,step:2,unit:'Ω'}, R2:{min:2,max:8,step:2,unit:'Ω'} },
    statement:function(p){ return '분압기 전원(V_s='+p.Vs+' V, 위 R₁='+p.R1+' Ω, 아래 R₂='+p.R2+' Ω)의 출력에 부하를 단다. (a) 최대 전력을 받는 R_L (b) 그때 부하 전력을 구하라.'; },
    solve:function(p){
      var VT=p.Vs*p.R2/(p.R1+p.R2), RT=SVH.par(p.R1,p.R2), Pm=VT*VT/(4*RT);
      return { ans:{RL:RT, Pm:Pm}, unit:{RL:'Ω', Pm:'W'}, steps:[
        '테브난 먼저: V_T='+SVH.fmt(VT)+' V, R_T=R₁∥R₂='+SVH.fmt(RT)+' Ω',
        'R_L = R_T = '+SVH.fmt(RT)+' Ω, P_max = V_T²/4R_T = '+SVH.fmt(Pm)+' W' ] }; },
    hints:['최대 전력 문제는 "테브난부터".'] },
  { id:'u4-l3-07', level:3, type:'num', tags:['효율 곡선'], src:'창작 문제(검산됨)',
    params:{ VT:{min:10,max:20,step:5,unit:'V'}, RT:{min:2,max:6,step:2,unit:'Ω'}, m:{choices:[2,3,4]} },
    statement:function(p){ return 'V_T='+p.VT+' V, R_T='+p.RT+' Ω 전원에 R_L='+p.m+'R_T를 달았다. 부하 전력과 효율을 구하고, 정합(R_L=R_T) 때와 비교하라.'; },
    solve:function(p){
      var RL=p.m*p.RT, I=p.VT/(p.RT+RL), P=I*I*RL, eff=RL/(p.RT+RL)*100, Pm=p.VT*p.VT/(4*p.RT);
      return { ans:{P:P, eff:eff}, unit:{P:'W', eff:'%'}, steps:[
        'I = '+SVH.fmt(I)+' A → P = I²R_L = '+SVH.fmt(P)+' W (정합 최대 '+SVH.fmt(Pm)+' W보다 작다)',
        '효율 = R_L/(R_T+R_L) = '+SVH.fmt(eff)+' % (정합 50%보다 높다)',
        '→ "최대 전력"과 "고효율"은 다른 목표라는 것이 결론' ] }; },
    hints:['전력은 정합에서 최대, 효율은 R_L이 클수록 상승.'] },
  { id:'u4-l3-08', level:3, type:'num', tags:['브리지 테브난'], src:'기출 유형',
    params:{ Vs:{min:10,max:20,step:5,unit:'V'}, R1:{min:100,max:300,step:100,unit:'Ω'}, R2:{min:100,max:300,step:100,unit:'Ω'}, R3:{min:100,max:300,step:100,unit:'Ω'}, R4:{min:100,max:300,step:100,unit:'Ω'} },
    statement:function(p){ return '브리지('+p.Vs+' V, 왼쪽 R₁ 위·R₃ 아래, 오른쪽 R₂ 위·R₄ 아래)의 가운데 두 중점 단자에서 본 테브난 등가(V_T, R_T)를 구하라. (검류계 달기 전 준비 계산)'; },
    solve:function(p){
      var VT=p.Vs*(p.R3/(p.R1+p.R3)-p.R4/(p.R2+p.R4));
      var RT=SVH.par(p.R1,p.R3)+SVH.par(p.R2,p.R4);
      return { ans:{VT:VT, RT:RT}, unit:{VT:'V', RT:'Ω'}, steps:[
        'V_T = 두 분압의 차 = '+SVH.fmt(VT)+' V',
        'R_T = 전원 단락 시 (R₁∥R₃)+(R₂∥R₄) = '+SVH.fmt(RT)+' Ω',
        '(가운데에 어떤 검류계(R_g)를 달아도 전류 = V_T/(R_T+R_g) 로 즉시 계산된다)' ] }; },
    hints:['전원을 단락하면 좌우 가지가 각각 병렬로 접힌다.'] },
  { id:'u4-l3-09', level:3, type:'num', tags:['노턴 실전'], src:'창작 문제(검산됨)',
    params:{ Is:{min:2,max:6,step:2,unit:'A'}, R1:{min:2,max:8,step:2,unit:'Ω'}, R2:{min:2,max:8,step:2,unit:'Ω'}, RL:{min:1,max:9,step:2,unit:'Ω'} },
    statement:function(p){ return '전류원 '+p.Is+' A ∥ R₁='+p.R1+' Ω 다음에 직렬 R₂='+p.R2+' Ω를 거쳐 단자. (a) 단자 노턴 등가 (b) R_L='+p.RL+' Ω 연결 시 부하 전류를 구하라.'; },
    solve:function(p){
      var RN=p.R1+p.R2;
      var IN=p.Is*p.R1/(p.R1+p.R2); // 단락 시 분류
      var IL=IN*RN/(RN+p.RL);
      return { ans:{IN:IN, RN:RN, IL:IL}, unit:{IN:'A', RN:'Ω', IL:'A'}, steps:[
        'R_N = 전원 개방 후 R₁+R₂ = '+SVH.fmt(RN)+' Ω',
        'I_N = 단자 단락 시 R₁·R₂ 분류 = I_s·R₁/(R₁+R₂) = '+SVH.fmt(IN)+' A',
        'I_L = I_N·R_N/(R_N+R_L) = '+SVH.fmt(IL)+' A' ] }; },
    hints:['I_sc 계산에서 단락이 어디로 이어지는지 그림.'] },
  { id:'u4-l3-10', level:3, type:'num', tags:['중첩 검산'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:6,max:18,step:6,unit:'V'}, Is:{min:1,max:3,step:1,unit:'A'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return 'u4-l2-09 회로를 절점법으로 한 번에 풀어 중첩 결과와 일치함을 보여라. (같은 파라미터: '+p.Vs+' V, '+p.Is+' A, R₁='+p.R1+', R₂='+p.R2+' Ω)'; },
    solve:function(p){
      var v=(p.Vs/p.R1+p.Is)/(1/p.R1+1/p.R2);
      var va=p.Vs*p.R2/(p.R1+p.R2), vb=p.Is*SVH.par(p.R1,p.R2);
      return { ans:{v:v, vsum:va+vb}, unit:{v:'V', vsum:'V'}, steps:[
        '절점법: \\((V_s-v)/R_1 + I_s = v/R_2\\) → v = '+SVH.fmt(v)+' V',
        '중첩 합 = '+SVH.fmt(va)+'+'+SVH.fmt(vb)+' = '+SVH.fmt(va+vb)+' V → 일치 ✓',
        '(시험장 전략: 중첩으로 풀고 절점법으로 검산, 또는 그 반대)' ] }; },
    hints:['두 방법이 다르면 어딘가 부호 실수다.'] },

  /* ---------- L4 (5) ---------- */
  { id:'u4-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'옳은 것을 모두 고르면?<br>㉠ 중첩의 근거는 결합법칙·교환법칙이다<br>㉡ 테브난 등가는 외부에서 본 v–i 관계만 보존하며, 내부 전력 분배까지 재현하지는 않는다<br>㉢ 최대 전력 전달 조건에서 전달 효율은 50%다<br>㉣ 종속 전원만 있는(독립 전원 없는) 회로의 V_oc는 0이다',
    choices:['㉡㉢㉣','㉠㉡㉢','㉠㉣','전부'],
    answer:0, expl:'㉠은 기출의 함정(근거는 선형성). ㉣: 독립 전원이 없으면 스스로 전압을 만들 수 없어 V_oc=0 (R_T만 남는다).' },
  { id:'u4-l4-02', level:4, type:'num', tags:['테브난 풀코스'], src:'기출 유형',
    params:{ Vs:{min:12,max:24,step:4,unit:'V'}, Is:{min:1,max:3,step:1,unit:'A'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'}, R3:{min:1,max:5,step:2,unit:'Ω'} },
    statement:function(p){ return '전압원 '+p.Vs+' V — R₁='+p.R1+' Ω — 절점A — R₃='+p.R3+' Ω — 단자B. 절점A—접지: R₂='+p.R2+' Ω와 전류원 '+p.Is+' A(절점A로 유입). (a) V_oc (b) R_T (c) 정합 부하 최대 전력을 구하라.'; },
    solve:function(p){
      var vA=(p.Vs/p.R1+p.Is)/(1/p.R1+1/p.R2);
      var RT=p.R3+SVH.par(p.R1,p.R2);
      var Pm=vA*vA/(4*RT);
      return { ans:{Voc:vA, RT:RT, Pm:Pm}, unit:{Voc:'V', RT:'Ω', Pm:'W'}, steps:[
        '개방 → R₃ 전류 0 → V_oc = v_A. 절점법: \\((V_s-v_A)/R_1+I_s = v_A/R_2\\) → v_A = '+SVH.fmt(vA)+' V',
        '전원 끄기(V단락·I개방): R_T = R₃+R₁∥R₂ = '+SVH.fmt(RT)+' Ω',
        'P_max = V_oc²/4R_T = '+SVH.fmt(Pm)+' W' ] }; },
    hints:['V_oc는 절점법, R_T는 끄고 접기 — 역할 분담.','R₃는 개방 전압에 안 나타난다.'] },
  { id:'u4-l4-03', level:4, type:'num', tags:['종속 전원 테브난'], src:'기출 유형',
    params:{ Is:{min:2,max:4,step:1,unit:'A'}, R1:{min:2,max:6,step:2,unit:'Ω'}, k:{choices:[0.25,0.5]} },
    statement:function(p){ return '단자 안쪽: 전류원 '+p.Is+' A가 절점으로 유입, 절점—접지 R₁='+p.R1+' Ω, 그리고 전압제어 전류원 \\('+p.k+'v\\) A(절점에서 접지로, v는 절점 전압). 절점이 곧 단자다. (a) V_oc (b) I_sc (c) R_T를 구하라.'; },
    solve:function(p){
      var Voc=p.Is/(1/p.R1+p.k);
      var Isc=p.Is; // 단락 시 v=0 → 종속 전원 0, R1도 0
      var RT=Voc/Isc;
      return { ans:{Voc:Voc, Isc:Isc, RT:RT}, unit:{Voc:'V', Isc:'A', RT:'Ω'}, steps:[
        'V_oc: KCL \\(I_s = v/R_1 + '+p.k+'v\\) → '+SVH.fmt(Voc)+' V',
        'I_sc: 단락하면 v=0 → 종속 전원·R₁ 전류 모두 0 → I_sc = I_s = '+SVH.fmt(Isc)+' A',
        'R_T = V_oc/I_sc = '+SVH.fmt(RT)+' Ω (전원 끄고 접기로는 못 구하는 값 — 종속 전원의 존재가 R_T를 바꿨다)' ] }; },
    hints:['종속 전원 회로의 3종 세트: V_oc, I_sc, 비율.','단락이 제어 변수 v를 0으로 만든다.'] },
  { id:'u4-l4-04', level:4, type:'num', tags:['설계 검증'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:20,max:40,step:10,unit:'V'}, RT:{min:4,max:10,step:2,unit:'Ω'}, Preq:{choices:[4,6,8],unit:'W'} },
    constraint:function(p){ return p.Vs*p.Vs/(4*p.RT) > p.Preq*1.05; },
    statement:function(p){ return 'V_T='+p.Vs+' V, R_T='+p.RT+' Ω 전원에서 부하가 정확히 '+p.Preq+' W를 받도록 R_L을 정하려 한다. 가능한 R_L 두 값을 구하라. (이차방정식 — 최대 가능 전력이 '+SVH.fmt(p.Vs*p.Vs/(4*p.RT))+' W임을 먼저 확인)'; },
    solve:function(p){
      // P = V² RL/(RT+RL)² → P RL² + (2 P RT − V²) RL + P RT² = 0
      var a=p.Preq, b=2*p.Preq*p.RT-p.Vs*p.Vs, c=p.Preq*p.RT*p.RT;
      var disc=Math.sqrt(b*b-4*a*c);
      var RL1=(-b+disc)/(2*a), RL2=(-b-disc)/(2*a);
      return { ans:{RL1:RL1, RL2:RL2}, unit:{RL1:'Ω', RL2:'Ω'}, steps:[
        '\\(P = \\dfrac{V^2R_L}{(R_T+R_L)^2}\\) → \\(PR_L^2+(2PR_T-V^2)R_L+PR_T^2=0\\)',
        '근의 공식: R_L = '+SVH.fmt(RL1)+' Ω 또는 '+SVH.fmt(RL2)+' Ω',
        '두 근의 곱 = R_T² (비에트) — 정합점 R_T를 사이에 둔 대칭쌍. 효율은 큰 쪽이 유리' ] }; },
    hints:['부하 전력식을 R_L의 이차방정식으로.','해가 둘인 이유를 정합점과 연결해 설명.'] },
  { id:'u4-l4-05', level:4, type:'derive', tags:['유도'], src:'교재 표준',
    statement:'최대 전력 전달 정리(\\(R_L=R_T\\)에서 \\(P_L\\) 최대, \\(P_{max}=V_T^2/4R_T\\))를 미분으로 유도하라.',
    steps:[
      '부하 전력: \\(P_L = i^2R_L = \\left(\\dfrac{V_T}{R_T+R_L}\\right)^2 R_L\\) [무엇을] 한 루프 전류로 표현 [왜] 변수 R_L 하나의 함수로 만들기 위해',
      '극값: \\(\\dfrac{dP_L}{dR_L} = V_T^2\\dfrac{(R_T+R_L)^2 - R_L\\cdot 2(R_T+R_L)}{(R_T+R_L)^4} = V_T^2\\dfrac{R_T-R_L}{(R_T+R_L)^3} = 0\\)',
      '\\(R_L = R_T\\)에서 유일한 극값. 부호 확인: R_L<R_T이면 도함수 +, R_L>R_T이면 − → 최대 ✓',
      '대입: \\(P_{max} = V_T^2 R_T/(2R_T)^2 = V_T^2/4R_T\\)',
      '극한 체크: R_L→0이면 P→0 (전압 없음), R_L→∞이면 P→0 (전류 없음) — 사이 어딘가 최대가 있어야 한다는 직관과 일치 · 차원 체크: [V²/Ω]=[W] ✓'
    ],
    hints:['P_L(R_L)을 쓰고 미분해 0.','끝점 두 극한이 모두 0임을 먼저 보이면 논리가 탄탄해진다.'],
    expl:'유도 과정 자체가 시험 단골. "몫의 미분에서 분자만 보면 된다"는 요령도 함께.' }
  ]
});

</script>

<script>
window.SV_CONTENT = {"u1": {"concept": "\n<p class=\"easy\"><b>⚡ 이 단원 한 줄</b> — 회로의 4대 변수(전하·전류·전압·전력)와 2대 법칙(KCL·KVL), 그리고 부호 규약 하나(수동부호규약)면 모든 회로 해석의 언어가 갖춰진다.</p>\n<h4>핵심 정의 <span class=\"src\">(전문용어 병기)</span></h4>\n<ul>\n<li><b>전류</b>(current) \\(i=dq/dt\\) [A=C/s] — 단면 통과 전하율. <b>시험 포인트:</b> q(t) 주고 미분시키거나, i–t 그래프 면적으로 전하 역산.</li>\n<li><b>전압</b>(voltage) \\(v=dw/dq\\) [V=J/C] — 두 점 사이 단위 전하의 에너지 차. 항상 \"어디 기준\"인지가 붙는다.</li>\n<li><b>전력</b>(power) \\(p=vi\\) [W] — <b>수동부호규약</b>(passive sign convention): 전류가 + 단자로 들어가게 기준을 잡으면 p&gt;0 = 흡수, p&lt;0 = 공급. 회로 전체 합은 항상 0.</li>\n<li><b>옴 법칙</b> \\(v=iR\\) — <u>선형 저항에만</u>. 컨덕턴스 \\(G=1/R\\) [S].</li>\n<li><b>전원</b>: 이상 전압원(내부저항 0)·이상 전류원(내부저항 ∞)·<b>종속 전원</b> 4종(VCVS·VCCS·CCVS·CCCS) — 트랜지스터/OP-amp의 모델.</li>\n<li><b>KCL</b>: 절점 유입 전류 합 = 유출 합 (전하 보존). <b>KVL</b>: 폐루프 전압 합 = 0 (에너지 보존).</li>\n</ul>\n<p class=\"note-line\">시험에 어떻게 나오나 — 기출 1번(30점)은 이런 정의·조건·한계의 진위 판별 다지선다. \"옴 법칙은 모든 소자에?\"(✗), \"중첩의 근거는 결합법칙?\"(✗, 선형성) 같은 함정이 반복된다.</p>", "derive": [{"title": "p = vi 가 '흡수'인 이유 (정의에서 전력까지)", "steps": ["전압 정의 \\(v=dw/dq\\): + → − 로 단위 전하가 이동하며 소자에 에너지를 넘긴다.", "전류 기준을 + 단자 유입으로: \\(i=dq/dt\\).", "연쇄율: \\(p=\\dfrac{dw}{dt}=\\dfrac{dw}{dq}\\cdot\\dfrac{dq}{dt}=vi\\) — w가 '소자가 받은' 에너지이므로 p>0 = 흡수.", "부호 반전 2경우: 실제 전류가 기준과 반대(i<0), 또는 극성 반대(v<0) → 공급.", "차원 체크: (J/C)(C/s)=J/s=W ✓ · 극한 체크: v=0 또는 i=0 → p=0 ✓"]}, {"title": "KCL·KVL은 어디서 오는가", "steps": ["KCL: 절점은 전하를 저장하지 못한다(이상 도체 접합) → \\(\\sum i_{in}=\\sum i_{out}\\).", "KVL: 폐루프를 한 바퀴 돈 단위 전하의 에너지 변화 = 0 (보존장) → \\(\\sum v = 0\\).", "따라서 KCL 식은 절점 수−1개, KVL 식은 독립 루프 수만큼만 독립 — U3 해석법의 뼈대.", "극한 체크: 가지 하나뿐인 절점이면 i=0 (막다른 길) ✓"]}], "worked": "\n<h4>예제 1 — 수동부호규약 판정</h4>\n<p>소자 양단 전압 12 V(+가 위), 전류 2 A가 <u>아래에서 위로</u>(− 단자로 유입) 흐른다. 흡수 전력은?</p>\n<ol><li>기준: 전류가 + 단자로 들어가야 p=vi가 흡수. 지금은 반대 → i = −2 A로 잡는다.</li>\n<li>p = vi = 12 × (−2) = <b>−24 W → 24 W 공급</b>.</li>\n<li>검산: 이 소자가 전원 역할(전류를 + 쪽으로 밀어 올림) — 방향 그림과 일치 ✓</li></ol>\n<h4>예제 2 — q(t)에서 전력까지</h4>\n<p>\\(q(t)=3t^2+2t\\) C가 5 Ω 저항을 지난다. t=2 s의 순시 전력은?</p>\n<ol><li>\\(i=dq/dt=6t+2\\) → i(2)=14 A</li>\n<li>\\(p=i^2R=14^2×5=\\) <b>980 W</b></li>\n<li>차원: [A²·Ω]=[W] ✓</li></ol>"}, "u2": {"concept": "\n<p class=\"easy\"><b>⚡ 이 단원 한 줄</b> — 직렬은 전류 공유(저항 합), 병렬은 전압 공유(컨덕턴스 합). 분압·분류 두 공식과 \"부하를 달면 분배가 깨진다\"는 감각까지가 시험 범위다.</p>\n<h4>핵심 공식</h4>\n<ul>\n<li><b>직렬</b>: \\(R_{eq}=\\sum R_i\\) · <b>분압</b>(voltage divider) \\(v_k=v_s\\dfrac{R_k}{\\sum R}\\)</li>\n<li><b>병렬</b>: \\(1/R_{eq}=\\sum 1/R_i\\) (2개면 곱/합) · <b>분류</b>(current divider) \\(i_1=i_s\\dfrac{R_2}{R_1+R_2}\\) — <u>반대편</u> 저항이 분자.</li>\n<li>같은 값 n개 병렬 = R/n. 병렬 등가는 항상 최솟값보다 작다.</li>\n<li><b>휘트스톤 브리지</b> 평형: \\(R_1R_4=R_2R_3\\) (교차곱) → 평형이면 가운데 소자 제거 가능.</li>\n<li><b>부하 효과</b>: 분압기 출력에 R_L이 붙으면 아래 저항이 \\(R_2\\|R_L\\)로 바뀌어 출력이 떨어진다 — 계측기의 입력저항 문제와 같은 뿌리(기출 1번 단골).</li>\n</ul>\n<p class=\"note-line\">시험에 어떻게 나오나 — 사다리 회로를 \"뒤에서 접고 앞으로 전개\"(기출 4번 스케일), 브리지 평형/불평형(전압계 읽기), 전위차계(로봇팔 각도 센서, 기출 6번 맥락).</p>", "derive": [{"title": "분압 법칙 유도와 3중 극한 검증", "steps": ["직렬 = 같은 전류: 갈라질 절점이 없다 (KCL).", "KVL: \\(v_s=i(R_1+R_2)\\) → \\(i=v_s/(R_1+R_2)\\).", "옴: \\(v_2=iR_2=v_s\\dfrac{R_2}{R_1+R_2}\\).", "극한: R₂→∞ ⇒ v₂→v_s ✓ · R₂→0 ⇒ 0 ✓ · R₁=R₂ ⇒ 절반 ✓", "부하가 붙으면 1행(같은 전류)이 깨진다 — 부하 효과의 정확한 원인. 차원: 무차원 비 × [V] ✓"]}, {"title": "분류 법칙 — 왜 '반대편'이 분자인가", "steps": ["병렬 = 같은 전압 v: \\(i_1=v/R_1,\\ i_2=v/R_2\\).", "KCL: \\(i_s=v(1/R_1+1/R_2)\\) → \\(v=i_s\\dfrac{R_1R_2}{R_1+R_2}\\).", "대입: \\(i_1=v/R_1=i_s\\dfrac{R_2}{R_1+R_2}\\) — 분자에 R₂가 남는다.", "직관: 전류는 쉬운 길(작은 저항)로 더 — R₁이 작을수록 i₁이 커지는 형태 ✓", "극한: R₂→∞이면 전부 R₁로(i₁=i_s) ✓ · 차원: 무차원 비 × [A] ✓"]}], "worked": "\n<h4>예제 1 — 혼합 회로망 접기</h4>\n<p>24 V 전원 → 6 Ω 직렬 → (12 Ω ∥ 4 Ω). 병렬부 전압은?</p>\n<ol><li>12∥4 = 48/16 = 3 Ω</li>\n<li>분압: \\(V = 24×\\dfrac{3}{6+3}\\) = <b>8 V</b></li>\n<li>검산: 전원 전류 24/9 = 2.67 A → 병렬부 8/3+8/12... 아니라 12 Ω에 0.67 A + 4 Ω에 2 A = 2.67 A ✓ (KCL 일치)</li></ol>\n<h4>예제 2 — 부하 효과 정량</h4>\n<p>10 kΩ–10 kΩ 분압기(입력 10 V) 출력에 10 kΩ 부하 연결. 출력 변화는?</p>\n<ol><li>무부하: 5 V</li>\n<li>부하 시 아래쪽 = 10∥10 = 5 kΩ → \\(V=10×\\dfrac{5}{10+5}\\) = <b>3.33 V</b> (33% 하락!)</li>\n<li>교훈: 부하 저항이 분압기 저항과 비슷하면 크게 무너진다 — R_L ≫ 출력임피던스(R₁∥R₂)가 원칙.</li></ol>"}, "u3": {"concept": "\n<p class=\"easy\"><b>⚡ 이 단원 한 줄</b> — 절점법 = 절점마다 KCL, 망로법 = 메시마다 KVL. 행렬 규칙(대각=자기 합, 비대각=−공유)까지 외우면 어떤 회로든 기계적으로 풀린다. 기출 2·4번이 통째로 이 단원이다.</p>\n<h4>표준 절차</h4>\n<ul>\n<li><b>절점전압법</b>: ① 기준 절점(연결 많은 곳) ② 미지수 = 절점 수−1 ③ 각 절점 KCL: \"나가는 전류 \\((v_{me}-v_{other})/R\\)의 합 = 유입 전류원\" ④ 연립.</li>\n<li><b>초노드</b>(supernode): 두 비기준 절점 사이 전압원 → 경계를 묶어 KCL 1개 + 구속식 \\(v_a-v_b=V_s\\).</li>\n<li><b>망로전류법</b>: 평면 회로의 각 \"창문\"에 시계방향 전류 → KVL. 행렬 규칙: 대각 = 그 메시 저항 합, 비대각 = −공유 저항, 우변 = 미는 전압원.</li>\n<li><b>초메시</b>(supermesh): 공유 가지 전류원 → 두 메시 합쳐 KVL + \\(i_a-i_b=I_s\\).</li>\n<li><b>종속 전원</b>: 틀은 유지, 제어 변수를 절점전압/메시전류로 표현하는 보조식 1개 추가.</li>\n<li><b>전압원 전류·전류원 전압</b>은 다 푼 뒤 KCL/KVL 되짚기로 회수(기출 2(a)).</li>\n</ul>\n<p class=\"note-line\">검증 습관 — 절점법으로 풀었으면 임의 루프 KVL로, 망로법이면 임의 절점 KCL로, 아니면 전력 수지(공급=흡수)로 교차 검산. 같은 방법 재계산은 같은 실수를 재현한다.</p>", "derive": [{"title": "절점 방정식의 행렬 구조 (대칭·대각우세)", "steps": ["2절점 예: KCL@1 \\(G_1v_1+G_2(v_1-v_2)=I_s\\), KCL@2 \\(G_3v_2+G_2(v_2-v_1)=0\\).", "행렬형: \\(\\begin{bmatrix}G_1+G_2&-G_2\\\\-G_2&G_2+G_3\\end{bmatrix}\\!\\begin{bmatrix}v_1\\\\v_2\\end{bmatrix}=\\begin{bmatrix}I_s\\\\0\\end{bmatrix}\\).", "대칭: 비대각 = −(공유 컨덕턴스), 같은 소자를 양쪽에서 본 것 → 종속 전원이 끼면 깨진다.", "대각 우세: 자기 행 대각 ≥ |비대각 합| — '내 전압을 올리면 나가는 전류가 는다'는 안정성.", "극한 체크: G₂→0 → 대각행렬(두 독립 회로) ✓ · 차원: [S][V]=[A] ✓"]}, {"title": "초노드가 필요한 이유", "steps": ["이상 전압원의 전류는 소자식이 없다(전류가 미지수) → 그 절점 KCL에 바로 못 쓴다.", "해결: 전압원을 포함하는 경계로 가우스면을 넓혀(두 절점 묶음) KCL을 세우면 전원 전류가 내부 변수로 사라진다.", "부족해진 식 1개는 전압원 자신이 준다: \\(v_a-v_b=V_s\\).", "쌍대: 공유 전류원 ↔ 초메시, \\(i_a-i_b=I_s\\).", "극한 체크: V_s=0이면 두 절점이 한 절점으로 합쳐지는 것과 동일 ✓"]}], "worked": "\n<h4>예제 1 — 기출 2(a)형: 전압원 전류</h4>\n<p>3 V 전압원(접지—절점1), 절점1—절점2에 2 Ω, 절점2—접지에 4 Ω, 전류원 2 A가 절점2로 유입. 전압원 전류는?</p>\n<ol><li>v₁ = 3 V (접지 연결 전압원 → 미지수 소거)</li>\n<li>KCL@2: \\((3-v_2)/2+2=v_2/4\\) → 6−2v₂+16 = v₂... 정리: v₂ = 22/3 ≈ 7.33 V</li>\n<li>전압원 전류 = 절점1에서 나가는 유일 경로 = (3−7.33)/2 = <b>−2.17 A</b> (음수: 실제로는 전원으로 역류 — 전류원이 밀어 넣고 있다)</li>\n<li>검산: 절점2 KCL 재확인 −2.17+2 = 7.33/4−... ✓</li></ol>\n<h4>예제 2 — 초메시</h4>\n<p>2메시, 공유 가지에 1 A 전류원, 메시1에 10 V·2 Ω, 메시2에 3 Ω.</p>\n<ol><li>구속: i₁−i₂ = 1</li>\n<li>초메시 KVL: 10 = 2i₁+3i₂ → 10 = 2(i₂+1)+3i₂ → i₂ = 1.6 A, i₁ = 2.6 A</li>\n<li>검산(전류원 전압 회수): v = 10−2×2.6 = 4.8 V → 메시2 KVL: 4.8 = 3×1.6 ✓</li></ol>"}, "u4": {"concept": "\n<p class=\"easy\"><b>⚡ 이 단원 한 줄</b> — 복잡한 선형 회로는 단자에서 보면 전압원 하나+저항 하나(테브난)다. 중첩·전원변환은 그 등가로 가는 도구, 최대 전력 전달(R_L=R_T, 효율 50%)은 그 대표 응용이다.</p>\n<h4>도구 상자</h4>\n<ul>\n<li><b>중첩</b>(superposition): 근거는 <u>선형성</u>(기출 함정: 결합·교환법칙 ✗). 독립 전원 하나씩 — 끈 전압원=단락, 끈 전류원=개방. <u>종속 전원은 끄지 않는다</u>.</li>\n<li><b>전원 변환</b>: \\(V_s\\)+직렬 R ↔ \\(I_s{=}V_s/R\\)+병렬 R. 반복하면 사다리가 한 루프로 줄어든다.</li>\n<li><b>테브난/노턴</b>: \\(V_T=V_{oc}\\), \\(I_N=I_{sc}\\), \\(R_T=V_{oc}/I_{sc}\\). 독립 전원만이면 \"끄고 접기\"로도 R_T. <u>종속 전원 있으면</u> V_oc/I_sc 또는 시험 전원법만 가능.</li>\n<li><b>최대 전력 전달</b>: \\(R_L=R_T\\)에서 \\(P_{max}=V_T^2/4R_T\\), 이때 효율 50% — 전력 최대와 고효율은 다른 목표.</li>\n<li><b>측정 관점</b>(기출 1(g)·(j)): V_oc와 I_sc를 재면 등가 완성. 단락이 위험하면 부하 걸고 분압 역산.</li>\n</ul>\n<p class=\"note-line\">적용 조건 주의 — 테브난·노턴·중첩 모두 \"내부가 선형\"일 때만. 비선형 소자는 부하로 밖에 두면 OK(로드라인 해석의 기반).</p>", "derive": [{"title": "최대 전력 전달 정리", "steps": ["\\(P_L=\\left(\\dfrac{V_T}{R_T+R_L}\\right)^2R_L\\) — 변수 R_L 하나의 함수로.", "\\(\\dfrac{dP_L}{dR_L}=V_T^2\\dfrac{R_T-R_L}{(R_T+R_L)^3}=0\\) → \\(R_L=R_T\\).", "부호: R_L<R_T에서 +, R_L>R_T에서 − → 최대 확정.", "\\(P_{max}=V_T^2/4R_T\\), 이때 R_T에도 같은 전력 → 효율 50%.", "극한 체크: R_L→0, R_L→∞ 모두 P→0 (사이에 최대가 있어야 함) ✓ · 차원 [V²/Ω]=[W] ✓"]}, {"title": "전원 변환이 성립하는 조건", "steps": ["테브난형 단자식: \\(v=V_s-iR\\).", "노턴형 단자식: \\(i=I_s-v/R\\) → \\(v=I_sR-iR\\).", "두 직선이 모든 (v,i)에서 일치할 조건: \\(V_s=I_sR\\), 기울기 −R 동일.", "즉 외부에서 본 v–i 특성의 절편(V_oc)과 기울기(R_T)만 같으면 내부는 무엇이든 등가.", "극한 체크: 개방(i=0)에서 v=V_s=I_sR ✓, 단락(v=0)에서 i=V_s/R=I_s ✓"]}], "worked": "\n<h4>예제 1 — 테브난 풀코스 (기출 5번의 전반부)</h4>\n<p>12 V 전원 — 4 Ω — 절점A(—접지 12 Ω), 절점A — 3 Ω — 단자B. 단자 테브난 등가와 정합 시 최대 전력은?</p>\n<ol><li>개방 시 3 Ω 전류 0 → V_oc = 절점A 분압 = 12×12/16 = <b>9 V</b> (3 Ω에는 강하 없음!)</li>\n<li>전원 단락 → R_T = 3 + (4∥12) = 3+3 = <b>6 Ω</b></li>\n<li>P_max = 81/24 = <b>3.375 W</b> (R_L=6 Ω일 때)</li></ol>\n<h4>예제 2 — 중첩 (V원+I원)</h4>\n<p>10 V — 2 Ω — 절점 — 3 Ω — 접지, 전류원 2 A가 절점 유입. 절점 전압?</p>\n<ol><li>I원 개방: 분압 10×3/5 = 6 V</li>\n<li>V원 단락: 2 A × (2∥3) = 2.4 V</li>\n<li>합 <b>8.4 V</b>. 검산(절점법): (10−v)/2+2 = v/3 → v = 8.4 ✓</li></ol>"}};
window.SV_BUILD = {"date": "2026-09-03", "units": 4, "problems": 160, "gate": "PASS 2026-09-03 (N=50/문제)"};

<script>
(function(){
'use strict';
var APP='course-eecirc', VP=Vault.progress(APP), VD=Vault.drill(APP), VM=Vault.meta(APP);
var UNITS=SV_BANK, BYID={}, ALL=[];
UNITS.forEach(function(u){ u.problems.forEach(function(p){ p._unit=u; BYID[p.id]=p; ALL.push(p); }); });
var LAYERS=['concept','derive','worked'], LAYER_KO={concept:'개념',derive:'수식·유도',worked:'풀이된 예제'};
var $=function(s,el){ return (el||document).querySelector(s); };
var esc=function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
function typeset(el){
  if(window.MathJax&&window.__mjready){ MathJax.typesetPromise([el]).catch(function(){}); }
  else { (window.__mjq=window.__mjq||[]).push(el); }
}

/* ---------- 파라미터 추출/리롤 (러너와 동일 규칙) ---------- */
function draw(spec){ 
  if(spec.choices) return spec.choices[Math.floor(Math.random()*spec.choices.length)];
  var steps=Math.round((spec.max-spec.min)/spec.step);
  return spec.min+spec.step*Math.floor(Math.random()*(steps+1));
}
function sample(prob){
  for(var t=0;t<500;t++){
    var p={}; for(var k in prob.params) p[k]=draw(prob.params[k]);
    if(!prob.constraint||prob.constraint(p)) return p;
  }
  return null;
}
var CUR={}; // 문제별 현재 파라미터
function statementOf(prob){
  if(!prob.params) return (typeof prob.statement==='function')?prob.statement({}):prob.statement;
  if(!CUR[prob.id]) CUR[prob.id]=sample(prob);
  return prob.statement(CUR[prob.id]);
}
function ansText(r){
  if(r==null) return '';
  var a=r.ans, u=r.unit;
  if(typeof a==='number') return SVH.fmt(a)+' '+(u||'');
  var parts=[]; for(var k in a){ parts.push(k+' = '+SVH.fmt(a[k])+' '+((u&&u[k])||'')); }
  return parts.join(' · ');
}

/* ---------- 진도 ---------- */
function readItems(){ var ids=[]; UNITS.forEach(function(u){ LAYERS.forEach(function(l){ ids.push(u.id+'-'+l); }); }); return ids; }
function refreshProg(){
  var ids=readItems(), n=0; ids.forEach(function(id){ if(VP.get(id)) n++; });
  $('#pbar').style.width=Math.round(n/ids.length*100)+'%';
  $('#ptxt').textContent='읽음 '+n+' / '+ids.length+' · 문제 '+VD.counts().total+'/'+ALL.length;
  document.querySelectorAll('.readbtn[data-read]').forEach(function(b){
    var on=VP.get(b.getAttribute('data-read'));
    b.setAttribute('aria-pressed',on?'true':'false');
    b.textContent=on?'✓ 읽음':'읽음으로 표시';
  });
  var wc=wrongList().length, badge=$('#nav-wrong .nv'); if(badge) badge.textContent=wc||'';
}
function wrongList(){
  var all=VD.all(), ids=[];
  for(var k in all){ if((all[k]==='wrong'||all[k]==='partial')&&BYID[k]) ids.push(k); }
  return ids;
}

/* ---------- 문제 카드 ---------- */
function grade(prob, status, card){
  VD.set(prob.id, status);
  card.querySelectorAll('.pbtn.sel').forEach(function(b){ b.classList.remove('sel'); });
  var btn=card.querySelector('.pbtn.grade-'+status[0]); if(btn) btn.classList.add('sel');
  var dot=card.querySelector('.sdot'); if(dot){ dot.className='sdot '+status; }
  refreshProg();
  if(EXAM.running) examAnswered(prob.id, status);
}
function renderProblem(prob){
  var card=document.createElement('article'); card.className='pcard'; card.setAttribute('data-pid',prob.id);
  var st=VD.get(prob.id);
  var srcb=prob.src?'<span class="srcb">'+esc(prob.src)+'</span>':'';
  card.innerHTML='<div class="pc-head"><span class="lv lv'+prob.level+'">L'+prob.level+'</span>'+
    '<span class="tagc">'+esc(prob.id)+' · '+esc((prob.tags||[]).join('·'))+'</span>'+srcb+
    '<span class="sdot'+(st?' '+st:'')+'"></span></div>'+
    '<div class="pc-st"></div><div class="pc-body"></div><div class="pc-btns"></div>';
  var stEl=$('.pc-st',card), body=$('.pc-body',card), btns=$('.pc-btns',card);
  stEl.innerHTML=statementOf(prob);

  function addBtn(label, cls, fn){
    var b=document.createElement('button'); b.type='button'; b.className='pbtn'+(cls?' '+cls:''); b.textContent=label;
    b.addEventListener('click',fn); btns.appendChild(b); return b;
  }
  function gradeBtns(){
    addBtn('맞음 ✓','grade-c',function(){ grade(prob,'correct',card); });
    addBtn('부분 △','grade-p',function(){ grade(prob,'partial',card); });
    addBtn('틀림 ✗','grade-w',function(){ grade(prob,'wrong',card); });
    if(st){ var b=card.querySelector('.pbtn.grade-'+st[0]); if(b) b.classList.add('sel'); }
  }

  if(prob.type==='mc'||prob.type==='tf'){
    var choices = prob.type==='tf' ? ['참 (O)','거짓 (X)'] : prob.choices;
    var correctIdx = prob.type==='tf' ? (prob.answer?0:1) : prob.answer;
    var wrap=document.createElement('div'); wrap.className='choices';
    choices.forEach(function(c,i){
      var b=document.createElement('button'); b.type='button'; b.className='choice'; b.innerHTML=c;
      b.addEventListener('click',function(){
        if(card.__done) return; card.__done=true;
        wrap.children[correctIdx].classList.add('right');
        if(i!==correctIdx) b.classList.add('wrongpick');
        var ex=document.createElement('div'); ex.className='expl'; ex.innerHTML='<b>해설</b> — '+prob.expl;
        body.appendChild(ex); typeset(ex);
        grade(prob, i===correctIdx?'correct':'wrong', card);
      });
      wrap.appendChild(b);
    });
    body.appendChild(wrap);
  } else {
    var hintIdx=0, hb=null;
    if(prob.hints&&prob.hints.length){
      addBtn('💡 힌트','',function(){
        if(hintIdx>=prob.hints.length) return;
        if(!hb){ hb=document.createElement('div'); hb.className='hintbox'; body.appendChild(hb); }
        var d=document.createElement('div'); d.innerHTML='힌트 '+(hintIdx+1)+'. '+prob.hints[hintIdx];
        hb.appendChild(d); typeset(d); hintIdx++;
        this.textContent = hintIdx>=prob.hints.length ? '힌트 끝' : '💡 힌트 '+(hintIdx+1);
      });
    }
    var solBtn=addBtn('풀이 보기','',function(){
      if(card.__sol){ card.__sol.hidden=!card.__sol.hidden; this.textContent=card.__sol.hidden?'풀이 보기':'풀이 닫기'; return; }
      var box=document.createElement('div'); box.className='solbox';
      var steps, aline='';
      if(prob.type==='derive'){ steps=prob.steps; }
      else{
        var r=prob.solve(prob.params?CUR[prob.id]:{});
        steps=r.steps; aline='<div class="ansline">답: '+esc(ansText(r))+'</div>';
      }
      box.innerHTML='<ol>'+steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol>'+aline+
        (prob.expl?'<div class="expl">'+prob.expl+'</div>':'');
      body.appendChild(box); typeset(box);
      card.__sol=box; this.textContent='풀이 닫기';
      if(!card.__graded){ card.__graded=true; gradeBtns(); }
    });
    if(prob.params){
      addBtn('🎲 새 숫자로','',function(){
        CUR[prob.id]=sample(prob);
        stEl.innerHTML=statementOf(prob); typeset(stEl);
        if(card.__sol){ card.__sol.remove(); card.__sol=null; solBtn.textContent='풀이 보기'; }
        if(hb){ hb.remove(); hb=null; hintIdx=0; }
      });
    }
    if(st&&!card.__graded){ card.__graded=true; gradeBtns(); }
  }
  return card;
}

/* ---------- 뷰 ---------- */
var view=$('#view');
function setView(html){ view.innerHTML=html; }
function renderHome(){
  var dc=VD.counts();
  var rate=dc.total?Math.round(dc.correct/dc.total*100):null;
  setView('<div class="eyebrow">Introduction to Electrical Engineering · 중간범위</div>'+
    '<h1>전전개 문제은행</h1>'+
    '<p class="lede">개념 → 유도 → 예제 → 4단계 문제(L1~L4). 전 문제가 검산 게이트(sympy 독립 재계산 대조)를 통과했고, 계산형 문제는 <b>🎲 새 숫자로</b>를 눌러 무한 반복할 수 있다.</p>'+
    '<p class="note-line">현황 — 풀어본 문제 '+dc.total+' / '+ALL.length+(rate!==null?(' · 정답률 '+rate+'%'):'')+
    ' · <a href="#wrong">오답노트 '+wrongList().length+'문제</a> · 빌드 '+SV_BUILD.date+' (게이트 '+SV_BUILD.gate+')</p>'+
    '<div class="ucards" id="ucards"></div>'+
    '<h3>모드</h3><div class="ucards">'+
    '<a class="ucard" href="#exam"><span class="uc-no">MOCK EXAM</span><span class="uc-ti">📝 모의고사</span><span class="uc-scope">범위·난이도·문항수를 골라 랜덤 출제 — 매번 새 수치, 종료 리포트 제공.</span></a>'+
    '<a class="ucard" href="#wrong"><span class="uc-no">RETRY QUEUE</span><span class="uc-ti">🔁 오답노트</span><span class="uc-scope">틀림·부분 문제만 모아 재도전. 맞음으로 바꾸면 큐에서 빠진다.</span></a></div>');
  var uc=$('#ucards');
  UNITS.forEach(function(u){
    var solved=0, ok=0;
    u.problems.forEach(function(p){ var s=VD.get(p.id); if(s){solved++; if(s==='correct')ok++;} });
    var reads=LAYERS.filter(function(l){return VP.get(u.id+'-'+l);}).length;
    var a=document.createElement('a'); a.className='ucard'; a.href='#'+u.id;
    a.innerHTML='<span class="uc-no">UNIT '+u.no+'</span><span class="uc-ti">'+esc(u.title)+'</span>'+
      '<span class="uc-scope">'+esc(u.scope)+'</span>'+
      '<span class="uc-stat">읽음 '+reads+'/3 · 문제 '+solved+'/'+u.problems.length+(solved?' · 정답 '+ok:'')+'</span>';
    uc.appendChild(a);
  });
  typeset(view);
}
function renderUnit(u){
  var c=SV_CONTENT[u.id]||{};
  setView('<div class="eyebrow">UNIT '+u.no+' / '+UNITS.length+'</div><h1>'+esc(u.title)+'</h1>'+
    '<p class="lede">'+esc(u.scope)+'</p><div id="layers"></div>'+
    '<h3>문제 세트 <span class="src">L1 개념확인 → L4 시험급 · '+u.problems.length+'문제</span></h3>'+
    '<div class="filters" id="filters"></div><div id="plist"></div>');
  var layers=$('#layers');
  LAYERS.forEach(function(l){
    var d=document.createElement('details'); d.className='layer'; if(l==='concept') d.open=true;
    var inner='';
    if(l==='derive'){
      (c.derive||[]).forEach(function(dv){
        inner+='<details class="dstep"><summary>'+esc(dv.title)+'</summary><ol>'+
          dv.steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol></details>';
      });
    } else inner=c[l]||'';
    d.innerHTML='<summary><span class="lb">'+(l.toUpperCase())+'</span>'+LAYER_KO[l]+'<span class="arrow">›</span></summary>'+
      '<div class="body">'+inner+'<div class="readrow"><button type="button" class="readbtn" data-read="'+u.id+'-'+l+'"></button></div></div>';
    layers.appendChild(d);
  });
  layers.addEventListener('click',function(e){
    var b=e.target.closest('.readbtn'); if(!b) return;
    VP.toggle(b.getAttribute('data-read')); refreshProg();
  });
  var lv=0, fl=$('#filters'), pl=$('#plist');
  function renderList(){
    pl.innerHTML='';
    u.problems.filter(function(p){ return !lv||p.level===lv; }).forEach(function(p){ pl.appendChild(renderProblem(p)); });
    typeset(pl);
  }
  [['전체',0],['L1 개념',1],['L2 기본',2],['L3 응용',3],['L4 시험급',4]].forEach(function(f){
    var b=document.createElement('button'); b.type='button'; b.className='fchip'+(f[1]===0?' on':''); b.textContent=f[0];
    b.addEventListener('click',function(){ lv=f[1]; fl.querySelectorAll('.fchip').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); renderList(); });
    fl.appendChild(b);
  });
  renderList(); typeset(layers);
}
function renderWrong(){
  var ids=wrongList();
  setView('<div class="eyebrow">RETRY QUEUE</div><h1>오답노트</h1>'+
    '<p class="lede">틀림·부분 표시 문제 '+ids.length+'개. 다시 풀어 <b>맞음</b>으로 바꾸면 큐에서 빠진다. 계산형은 자동으로 새 수치다.</p><div id="plist"></div>');
  var pl=$('#plist');
  if(!ids.length){ pl.innerHTML='<div class="empty">비어 있음 — 문제를 풀고 자가채점하면 틀림/부분이 여기 모인다.</div>'; return; }
  ids.forEach(function(id){ var p=BYID[id]; if(p&&p.params) CUR[id]=sample(p); pl.appendChild(renderProblem(BYID[id])); });
  typeset(pl);
}
/* ---------- 모의고사 ---------- */
var EXAM={running:false};
function renderExam(){
  if(EXAM.running){ renderExamRun(); return; }
  var uchecks=UNITS.map(function(u){ return '<label class="ck"><input type="checkbox" class="exu" value="'+u.id+'" checked> U'+u.no+' '+esc(u.title)+'</label>'; }).join('');
  setView('<div class="eyebrow">MOCK EXAM</div><h1>모의고사</h1>'+
    '<p class="lede">범위와 난이도를 고르면 랜덤 출제. 채점은 문제마다(객관식 자동 · 계산형 자가채점), 종료하면 리포트.</p>'+
    '<div class="exam-setup">'+
    '<div class="grp"><h4>범위</h4>'+uchecks+'</div>'+
    '<div class="grp"><h4>난이도</h4>'+[1,2,3,4].map(function(l){return '<label class="ck"><input type="checkbox" class="exl" value="'+l+'" '+(l>1?'checked':'')+'> L'+l+'</label>';}).join('')+'</div>'+
    '<div class="grp"><h4>문항 수</h4><select id="exn"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>'+
    '<button class="bigbtn" id="exgo">모의고사 시작 →</button></div>');
  $('#exgo').addEventListener('click',function(){
    var us={}, ls={};
    document.querySelectorAll('.exu:checked').forEach(function(c){us[c.value]=1;});
    document.querySelectorAll('.exl:checked').forEach(function(c){ls[+c.value]=1;});
    var pool=ALL.filter(function(p){ return us[p._unit.id]&&ls[p.level]; });
    var n=Math.min(+$('#exn').value, pool.length);
    if(!n){ alert('선택한 범위에 문제가 없습니다'); return; }
    for(var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
    EXAM={running:true, list:pool.slice(0,n), idx:0, res:{}};
    EXAM.list.forEach(function(p){ if(p.params) CUR[p.id]=sample(p); });
    renderExamRun();
  });
}
function examAnswered(pid, status){ if(EXAM.running&&EXAM.res) EXAM.res[pid]=status; }
function renderExamRun(){
  var i=EXAM.idx, p=EXAM.list[i];
  setView('<div class="eyebrow">MOCK EXAM · '+(i+1)+' / '+EXAM.list.length+'</div>'+
    '<div class="exam-top"><span>'+(i+1)+'/'+EXAM.list.length+'</span><div class="bar"><i style="width:'+Math.round(i/EXAM.list.length*100)+'%"></i></div>'+
    '<button class="pbtn" id="exquit">종료</button></div><div id="pslot"></div>'+
    '<div class="pc-btns" style="margin-top:14px"><button class="bigbtn" id="exnext">'+(i+1<EXAM.list.length?'다음 문제 →':'리포트 보기 →')+'</button></div>');
  $('#pslot').appendChild(renderProblem(p)); typeset($('#pslot'));
  $('#exnext').addEventListener('click',function(){
    if(EXAM.idx+1<EXAM.list.length){ EXAM.idx++; renderExamRun(); } else renderExamReport();
  });
  $('#exquit').addEventListener('click',renderExamReport);
}
function renderExamReport(){
  var res=EXAM.res, list=EXAM.list; EXAM.running=false;
  var c=0,pt=0,w=0,na=0;
  var perUnit={};
  list.forEach(function(p){
    var s=res[p.id];
    var u=perUnit[p._unit.id]=perUnit[p._unit.id]||{t:0,c:0,title:p._unit.title,no:p._unit.no};
    u.t++;
    if(s==='correct'){c++;u.c++;} else if(s==='partial'){pt++;} else if(s==='wrong'){w++;} else na++;
  });
  var score=Math.round((c+0.5*pt)/list.length*100);
  var rows=Object.keys(perUnit).sort().map(function(k){var u=perUnit[k];return '<tr><td>U'+u.no+' '+esc(u.title)+'</td><td>'+u.c+' / '+u.t+'</td></tr>';}).join('');
  setView('<div class="eyebrow">MOCK EXAM · REPORT</div><h1>결과 리포트</h1>'+
    '<div class="report"><div class="score">'+score+'점</div>'+
    '<p>맞음 '+c+' · 부분 '+pt+' · 틀림 '+w+(na?' · 무응답 '+na:'')+' (총 '+list.length+'문제)</p>'+
    '<table><thead><tr><th>단원</th><th>정답</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="pc-btns"><a class="pbtn" href="#wrong">🔁 오답노트로</a><a class="pbtn" href="#exam" onclick="">다시 설정</a><a class="pbtn" href="#home">홈</a></div></div>');
}

/* ---------- 내비 · 라우팅 ---------- */
function buildNav(){
  var nav=$('#sidenav'), sheet=$('#tb-sheet');
  var html='<div class="ng">학습</div><a href="#home" data-v="home">홈 · 현황</a>';
  UNITS.forEach(function(u){ html+='<a href="#'+u.id+'" data-v="'+u.id+'">U'+u.no+' '+esc(u.title)+'</a>'; });
  html+='<div class="ng">훈련</div><a href="#wrong" data-v="wrong" id="nav-wrong">오답노트<span class="nv"></span></a><a href="#exam" data-v="exam">모의고사</a>';
  nav.innerHTML=html;
  sheet.innerHTML=UNITS.map(function(u){ return '<a href="#'+u.id+'">U'+u.no+' '+esc(u.title)+'</a>'; }).join('');
}
function route(){
  var h=(location.hash||'#home').slice(1);
  var valid={home:1,wrong:1,exam:1}; UNITS.forEach(function(u){valid[u.id]=1;});
  if(!valid[h]) h='home';
  if(h!=='exam') EXAM.running=false;
  document.querySelectorAll('.side nav a').forEach(function(a){ a.classList.toggle('on',a.getAttribute('data-v')===h); });
  document.querySelectorAll('.tabbar [data-tv]').forEach(function(a){ a.classList.toggle('on',a.getAttribute('data-tv')===h); });
  var sh=$('#tb-sheet'); if(sh) sh.hidden=true;
  VM.touch(location.hash||'#home');
  if(h==='home') renderHome();
  else if(h==='wrong') renderWrong();
  else if(h==='exam') renderExam();
  else renderUnit(UNITS.filter(function(u){return u.id===h;})[0]);
  window.scrollTo(0,0);
  refreshProg();
}
var tbMore=$('#tb-more'), tbSheet=$('#tb-sheet');
if(tbMore){ tbMore.addEventListener('click',function(e){ e.stopPropagation(); tbSheet.hidden=!tbSheet.hidden; });
  document.addEventListener('click',function(e){ if(!tbSheet.hidden&&!tbSheet.contains(e.target)) tbSheet.hidden=true; }); }
window.addEventListener('hashchange',route);
buildNav(); route();
})();
</script>
