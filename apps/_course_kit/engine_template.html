<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[[APP_TITLE]]</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>
window.MathJax={tex:{inlineMath:[['\\(','\\)']]},svg:{fontCache:'global'},
 startup:{typeset:false, pageReady:function(){return MathJax.startup.defaultPageReady().then(function(){
   (window.__mjq||[]).forEach(function(el){MathJax.typesetPromise([el]).catch(function(){});});
   window.__mjready=true;});}}};
</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js"></script>
<style>
/* 공학 계산용지 — DESIGN_BRIEF.md (course-control) */
:root{
  --bg:#F5F6F1; --surf:#FBFBF8; --surf2:#ECEEE6; --side:#EFF1EA;
  --ink:#17201C; --ink2:#4A554F; --ink3:#7E8882;
  --line:#DADED3; --line2:#C3C9BC; --grid:rgba(60,110,80,.09);
  --acc:#1E4E8C; --acc-bg:#E3EAF3;
  --red:#B8402A; --red-bg:#F6E4DE;
  --ok:#2F6B45; --ok-bg:#E2EEE5;
  --warn:#8A6410; --warn-bg:#F5EDD8;
  --bad:#B8402A; --bad-bg:#F6E4DE;
  --code:#ECEEE6;
  --serif:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --sans:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]){
  --bg:#121715; --surf:#171D1A; --surf2:#1E2622; --side:#151B18;
  --ink:#E6EBE6; --ink2:#AEB8B1; --ink3:#7C8780;
  --line:#2A332E; --line2:#3A453F; --grid:rgba(150,200,170,.06);
  --acc:#8DB3E8; --acc-bg:#1B2737;
  --red:#E58C74; --red-bg:#33201B;
  --ok:#86C29A; --ok-bg:#18281E;
  --warn:#D9B061; --warn-bg:#2D2616;
  --bad:#E58C74; --bad-bg:#33201B;
  --code:#1E2622;
 }
}
:root[data-theme="dark"]{
  --bg:#121715; --surf:#171D1A; --surf2:#1E2622; --side:#151B18;
  --ink:#E6EBE6; --ink2:#AEB8B1; --ink3:#7C8780;
  --line:#2A332E; --line2:#3A453F; --grid:rgba(150,200,170,.06);
  --acc:#8DB3E8; --acc-bg:#1B2737;
  --red:#E58C74; --red-bg:#33201B;
  --ok:#86C29A; --ok-bg:#18281E;
  --warn:#D9B061; --warn-bg:#2D2616;
  --bad:#E58C74; --bad-bg:#33201B;
  --code:#1E2622;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
 line-height:1.72;font-size:15.5px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
 word-break:keep-all;overflow-wrap:break-word}
a{color:var(--acc);text-decoration-thickness:1px;text-underline-offset:3px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:2px}
mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}
.layout{display:flex;min-height:100vh}
/* 사이드 — 모눈 위 목차 */
.side{width:252px;flex:0 0 252px;background:var(--side);border-right:1px solid var(--line);
 padding:28px 20px 22px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.brand a{color:var(--ink);text-decoration:none;font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.brand b{color:var(--acc);font-weight:700}
.brand span{display:block;font-size:12.5px;color:var(--ink3);margin-top:4px}
.prog-bar{height:2px;background:none;margin:0 0 6px;position:relative}
.prog-bar i{display:block;height:2px;width:0;background:var(--acc);transition:width .5s ease-out}
.prog span{font-size:12.5px;color:var(--ink2)}
.side nav{display:flex;flex-direction:column}
.ng{font-size:12.5px;color:var(--ink3);margin:14px 0 4px;padding-left:12px}
.side nav a{display:block;position:relative;padding:7px 12px;color:var(--ink2);text-decoration:none;font-size:14px;line-height:1.45;border-left:2px solid transparent}
.side nav a:hover{color:var(--ink)}
.side nav a.on{color:var(--ink);font-weight:600;border-left-color:var(--acc)}
.side nav a .nv{float:right;font-size:12px;color:var(--red);font-weight:600}
.foot-side{margin-top:auto;font-size:12px;color:var(--ink3);line-height:1.6}
.foot-side a{color:var(--ink3)}
.main{flex:1;min-width:0;padding:clamp(24px,4.5vw,56px) clamp(16px,5vw,64px) 120px;display:flex;justify-content:center}
.view{width:100%;max-width:800px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(28px,4.4vw,40px);line-height:1.22;letter-spacing:-.025em;margin:4px 0 14px;text-wrap:balance}
h3{font-family:var(--serif);font-size:21px;font-weight:700;margin:44px 0 12px;letter-spacing:-.02em}
h4{font-size:15.5px;font-weight:700;margin:24px 0 8px}
p{margin:0 0 12px}
ul,ol{margin:0 0 13px;padding-left:22px}
li{margin-bottom:6px}
.eyebrow{font-size:14px;color:var(--ink2);font-weight:500}
.lede{font-size:16.5px;color:var(--ink2);max-width:640px}
.easy{background:var(--acc-bg);padding:13px 16px;margin:0 0 14px}
.easy b{color:var(--acc)}
.note-line{font-size:14px;color:var(--ink2);margin:0 0 12px}
.src{font-size:13px;color:var(--ink3);font-weight:400;font-family:var(--sans)}
/* 홈 히어로 — 과목 그림 */
.hero-fig{position:relative;margin:26px 0 8px;padding:18px 0 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px}
.hero-fig figcaption{font-size:13px;color:var(--ink3);margin:8px 0 6px}
.hero-fig svg{display:block;width:100%;height:auto;overflow:visible}
.hero-fig .row2{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:18px;align-items:end}
.hf-curve{fill:none;stroke:var(--acc);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:hfDraw 2.2s cubic-bezier(.25,.7,.25,1) .25s forwards}
.hf-axis{stroke:var(--ink2);stroke-width:1.2;fill:none}
.hf-ref{stroke:var(--ink3);stroke-width:1;stroke-dasharray:4 4;fill:none}
.hf-band{fill:var(--acc);opacity:.08}
.hf-mark{stroke:var(--red);stroke-width:1.4;fill:none}
.hf-t{font-family:var(--sans);font-size:15px;fill:var(--ink2)}
.hf-t.r{fill:var(--red);font-weight:600}
.hf-t.b{fill:var(--acc);font-weight:600}
.hf-pole{stroke:var(--red);stroke-width:2.6;fill:none;opacity:0;animation:hfIn .7s ease-out 2.3s forwards}
.hf-late{opacity:0;animation:hfIn .7s ease-out 2.5s forwards}
@keyframes hfDraw{to{stroke-dashoffset:0}}
@keyframes hfIn{to{opacity:1}}
.facts{display:flex;flex-wrap:wrap;gap:6px 28px;margin:18px 0 6px;font-size:14px;color:var(--ink2)}
.facts b{display:block;font-family:var(--serif);font-size:30px;line-height:1.15;color:var(--ink);font-weight:700;letter-spacing:-.02em}
/* 단원 목록 — 카드 대신 행 */
.ucards{margin:10px 0 0;border-top:1px solid var(--line2)}
.ucard{position:relative;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;
 padding:15px 10px 15px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;
 animation:rowIn .45s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,0ms);transition:background .15s}
.ucard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc);transition:width .18s ease-out}
.ucard:hover{background:var(--surf2)} .ucard:hover::before{width:3px}
.uc-no{font-family:var(--serif);font-size:15px;color:var(--acc);font-weight:700;grid-row:1/span 2}
.uc-ti{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:-.015em}
.uc-scope{grid-column:2;font-size:13.5px;color:var(--ink2);line-height:1.55}
.uc-stat{grid-column:3;grid-row:1;font-size:13px;color:var(--ink3);white-space:nowrap;text-align:right}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 접히는 층 — 박스 대신 머리선 */
details.layer{border-top:1px solid var(--line2);margin:0}
details.layer:last-of-type{border-bottom:1px solid var(--line2)}
details.layer>summary{cursor:pointer;padding:16px 2px;font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:-.015em;list-style:none;display:flex;align-items:center;gap:10px;min-height:44px}
details.layer>summary::-webkit-details-marker{display:none}
details.layer>summary .lb{display:none}
details.layer>summary .arrow{margin-left:auto;color:var(--ink3);font-family:var(--sans);font-weight:400;transition:transform .25s ease-out}
details.layer[open]>summary .arrow{transform:rotate(90deg)}
details.layer>.body{padding:0 2px 18px}
details.dstep{border-left:2px solid var(--line2);margin:0 0 10px;padding-left:12px}
details.dstep>summary{cursor:pointer;padding:6px 0;font-weight:600;font-size:14.5px}
details.dstep ol{margin:4px 0 10px;padding:0 4px 0 22px}
details.dstep li{margin-bottom:7px;font-size:14px}
/* 정석·예제·큰그림 — 여백선과 면으로 */
.jsbox{border-left:3px solid var(--acc);background:var(--acc-bg);padding:12px 16px;margin:14px 0;font-size:14.5px}
.jsbox .jt{display:block;font-weight:700;color:var(--acc);font-size:14px;margin-bottom:4px}
.exbox{border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:14px 2px;margin:16px 0}
.exbox .xh{font-weight:600;font-size:14.5px;margin-bottom:6px}
.exbox .xh .xno{color:var(--acc);font-weight:700;margin-right:8px}
.exbox .xsol{margin-top:8px;padding:10px 0 0 14px;border-left:2px solid var(--acc);font-size:14px}
.exbox .xsol ol{margin:4px 0 0;padding-left:20px}
.exbox .xrel{font-size:13px;color:var(--ink3);margin-top:8px}
.bigpic{border-left:3px solid var(--ink);padding:4px 0 4px 18px;margin:4px 0 20px;font-size:15px;line-height:1.85}
.bigpic .bt{display:block;font-family:var(--serif);font-size:15px;color:var(--ink);font-weight:700;margin-bottom:4px}
.mapline{font-size:14px;background:var(--surf2);padding:10px 14px;margin:12px 0;overflow-x:auto;line-height:1.7}
.en{color:var(--ink3);font-weight:400;font-size:.88em}
.tagx,.tagm,.tagc{display:inline-block;font-size:12.5px;font-weight:700;margin-left:8px;vertical-align:1px;white-space:nowrap;padding:0 0 1px;border-bottom:1.5px solid currentColor;line-height:1.3}
.tagx{color:var(--red)} .tagm{color:var(--acc)} .tagc{color:var(--ink3);border-bottom-style:dotted}
.whyq{border-left:2px solid var(--ink3);padding:2px 0 2px 14px;margin:14px 0;color:var(--ink2);font-size:14.5px}
.intuit{background:var(--surf2);padding:10px 14px;margin:12px 0;font-size:14.5px}
.exambox{border-left:3px solid var(--red);background:var(--red-bg);padding:11px 15px;margin:14px 0;font-size:14px}
.exambox .xt{display:block;font-weight:700;color:var(--red);font-size:14px;margin-bottom:3px}
.layer .body h4{margin:26px 0 8px;font-family:var(--serif);font-size:17px;letter-spacing:-.01em}
.layer .body h4:first-child{margin-top:2px}
.readrow{margin:12px 0 0;text-align:right}
.readbtn{font:inherit;font-size:13.5px;min-height:44px;padding:8px 16px;border-radius:4px;border:1px solid var(--line2);background:transparent;color:var(--ink2);cursor:pointer}
.readbtn[aria-pressed="true"]{color:var(--ok);border-color:var(--ok)}
/* 드릴 — 필터는 밑줄 탭 */
.filters{display:flex;flex-wrap:wrap;gap:2px 18px;margin:8px 0 6px;border-bottom:1px solid var(--line)}
.fchip{font:inherit;font-size:14px;min-height:44px;padding:8px 2px;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:var(--ink3);cursor:pointer}
.fchip:hover{color:var(--ink)}
.fchip.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.pcard{padding:22px 0 20px;border-bottom:1px solid var(--line)}
.pc-head{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin-bottom:8px;font-size:13px;color:var(--ink3)}
.lv{font-weight:700;font-size:13px}
.lv1{color:var(--ok)} .lv2{color:var(--acc)} .lv3{color:var(--warn)} .lv4{color:var(--red)}
.pmeta{color:var(--ink3)}
.srcb{color:var(--ink3)}
.srcb::before{content:"· "}
.sdot{margin-left:auto;font-size:13px;font-weight:700}
.sdot.correct{color:var(--ok)} .sdot.correct::after{content:"맞음"}
.sdot.partial{color:var(--warn)} .sdot.partial::after{content:"부분"}
.sdot.wrong{color:var(--red)} .sdot.wrong::after{content:"틀림"}
.pc-st{font-size:16px;line-height:1.8;margin-bottom:12px}
.pc-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pbtn{font:inherit;font-size:13.5px;min-height:44px;padding:8px 15px;border-radius:4px;border:1px solid var(--line2);background:transparent;color:var(--ink2);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.pbtn:hover{border-color:var(--ink2);color:var(--ink)}
.pbtn.grade-c{color:var(--ok)} .pbtn.grade-p{color:var(--warn)} .pbtn.grade-w{color:var(--red)}
.pbtn.grade-c.sel{background:var(--ok-bg);border-color:var(--ok)} .pbtn.grade-p.sel{background:var(--warn-bg);border-color:var(--warn)} .pbtn.grade-w.sel{background:var(--red-bg);border-color:var(--red)}
.hintbox{border-left:2px solid var(--warn);background:var(--warn-bg);padding:9px 14px;font-size:14px;margin:10px 0 0}
.solbox{border-left:2px solid var(--acc);padding:4px 0 4px 16px;margin:14px 0 4px}
.solbox ol{margin:0;padding-left:20px}
.solbox li{font-size:14.5px;margin-bottom:8px}
.ansline{margin-top:10px;font-weight:700;color:var(--acc);font-size:15px}
.choices{display:flex;flex-direction:column;gap:8px;margin:4px 0 4px;counter-reset:ch}
.choice{font:inherit;text-align:left;font-size:15px;min-height:46px;padding:10px 14px 10px 44px;border-radius:4px;border:1px solid var(--line2);background:var(--surf);color:var(--ink);cursor:pointer;position:relative;counter-increment:ch}
.choice::before{content:counter(ch);position:absolute;left:15px;top:10px;font-family:var(--serif);font-weight:700;color:var(--ink3)}
.choice:hover{border-color:var(--ink2)}
.choice.right{border-color:var(--ok);background:var(--ok-bg)} .choice.right::before{color:var(--ok)}
.choice.wrongpick{border-color:var(--red);background:var(--red-bg)} .choice.wrongpick::before{color:var(--red)}
.expl{border-left:2px solid var(--acc);padding:6px 0 6px 14px;font-size:14px;margin-top:12px;color:var(--ink2)}
/* 모의고사 */
.exam-setup .grp{padding:16px 0;border-top:1px solid var(--line)}
.exam-setup .grp h4{margin:0 0 8px;font-family:var(--serif);font-size:16px}
.exam-setup label.ck{display:inline-flex;align-items:center;gap:8px;margin:0 18px 4px 0;font-size:14.5px;min-height:44px;cursor:pointer}
.exam-setup input[type=checkbox]{accent-color:var(--acc);width:18px;height:18px}
.exam-setup select{font:inherit;font-size:16px;min-height:44px;padding:8px 12px;border:1px solid var(--line2);border-radius:4px;background:var(--surf);color:var(--ink)}
.bigbtn{font:inherit;font-size:15.5px;font-weight:600;min-height:50px;padding:12px 26px;border-radius:4px;border:none;background:var(--ink);color:var(--bg);cursor:pointer;margin-top:10px}
.bigbtn:hover{background:var(--acc)}
.bigbtn:disabled{opacity:.5;cursor:default}
.exam-top{display:flex;align-items:center;gap:16px;margin:0 0 6px}
.exam-top .cnt{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
.exam-top .cnt small{font-size:16px;color:var(--ink3);font-weight:500}
.ticks{flex:1;display:flex;gap:4px;align-items:flex-end;height:26px}
.ticks i{flex:1;height:12px;border-left:2px solid var(--line2)}
.ticks i.done{border-color:var(--ink2);height:16px} .ticks i.cur{height:26px;border-left:3px solid var(--acc)}
.report{padding:6px 0 0}
.report .score{font-family:var(--serif);font-size:64px;line-height:1.05;font-weight:700;color:var(--ink);letter-spacing:-.03em}
.report .score small{font-size:22px;color:var(--ink3);margin-left:4px}
.report{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 48px;align-items:start}
.marks td{padding:8px 12px 8px 0}
.marks .mkn{font-family:var(--serif);font-weight:700;color:var(--ink3);width:36px}
.marks .mk{font-size:22px;line-height:1;color:var(--red);font-weight:700;text-align:center;width:52px}
table{border-collapse:collapse;width:100%;margin:12px 0 16px;font-size:14px;display:block;overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:9px 12px 9px 0;text-align:left}
th{font-weight:600;color:var(--ink2);white-space:nowrap;border-bottom:1.5px solid var(--ink2)}
.empty{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:28px 4px;color:var(--ink3);font-size:14.5px}
code,.mono{font-family:"IBM Plex Mono",monospace;font-size:.92em}
/* 모바일 */
.tabbar{display:none}
#tb-sheet{display:none}
@media(max-width:960px){
 body{font-size:16px}
 input,textarea,select{font-size:16px}
 .layout{flex-direction:column}
 .side{width:100%;flex:none;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line);
  padding:14px 16px;flex-direction:row;align-items:center;gap:14px;flex-wrap:wrap}
 .brand a{font-size:18px}
 .side nav,.ng,.foot-side{display:none}
 .side .prog{flex:1;min-width:130px}
 .main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
 .hero-fig .row2{grid-template-columns:minmax(0,1fr)}
 .report{grid-template-columns:minmax(0,1fr)}
 .hero-fig .splane{max-width:260px}
 .ucard{grid-template-columns:40px minmax(0,1fr)}
 .uc-stat{grid-column:2;grid-row:auto;text-align:left}
 .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;background:var(--side);border-top:1px solid var(--line);
  padding:2px 4px calc(2px + env(safe-area-inset-bottom))}
 .tabbar a,.tabbar button{flex:1;min-height:52px;display:flex;align-items:center;justify-content:center;
  font:inherit;font-size:14px;line-height:1.2;background:none;border:none;border-top:2px solid transparent;color:var(--ink2);text-decoration:none;cursor:pointer;padding:4px 2px;white-space:nowrap}
 .tabbar a.on{color:var(--ink);font-weight:700;border-top-color:var(--acc)}
 #tb-sheet{position:fixed;right:10px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:51;background:var(--surf);
  border:1px solid var(--line2);border-radius:4px;padding:6px;display:flex;flex-direction:column;min-width:210px}
 #tb-sheet[hidden]{display:none!important}
 #tb-sheet a{display:flex;align-items:center;padding:11px 14px;min-height:44px;color:var(--ink2);text-decoration:none;font-size:15px}
 #tb-sheet a:active{background:var(--surf2)}
}
@media(max-width:640px){
 .facts b{font-size:26px}
 .report .score{font-size:52px}
}
@media print{
 .side,.tabbar,#tb-sheet{display:none!important}
 .main{padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}
 .hf-curve{stroke-dashoffset:0}.hf-pole,.hf-late{opacity:1}}
</style>
</head>
<body>
<div class="layout">
<aside class="side">
  <div class="brand"><a href="#home">[[APP_BRAND]]</a><span>[[APP_SUB]] · [[BUILD_DATE]]</span></div>

  <nav id="sidenav"></nav>

[[BANK_JS]]
<script src="../../shared/progress.js"></script>
<script>
window.SV_CONTENT = [[CONTENT_JSON]];
window.SV_BUILD = [[BUILD_INFO]];
</script>
<script>
(function(){
'use strict';
var APP='[[APP_ID]]', VP=Vault.progress(APP), VD=Vault.drill(APP), VM=Vault.meta(APP);
var UNITS=SV_BANK, BYID={}, ALL=[];
UNITS.forEach(function(u){ u.problems.forEach(function(p){ p._unit=u; BYID[p.id]=p; ALL.push(p); }); });
var LAYERS=['concept','derive','worked'], LAYER_KO={concept:'개념',derive:'수식·유도',worked:'풀이된 예제'};
var LVNAME={1:'개념',2:'기본',3:'응용',4:'시험급'};
/* 빈 레이어는 숨긴다 — 개념 과목(course-bio)은 derive·worked 가 없다 */
function hasLayer(c,l){ return l==='concept' || (l==='derive' ? (c.derive||[]).length>0 : !!c[l]); }
var $=function(s,el){ return (el||document).querySelector(s); };
var esc=function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
function typeset(el){
  if(window.MathJax&&window.__mjready){ MathJax.typesetPromise([el]).catch(function(){}); }
  else { (window.__mjq=window.__mjq||[]).push(el); }
}

/* ---------- 파라미터 추출/리롤 (러너와 동일 규칙) ---------- */
function draw(spec){ 
  if(spec.choices) return spec.choices[Math.floor(Math.random()*spec.choices.length)];
  var steps=Math.round((spec.max-spec.min)/spec.step);
  return spec.min+spec.step*Math.floor(Math.random()*(steps+1));
}
function sample(prob){
  for(var t=0;t<500;t++){
    var p={}; for(var k in prob.params) p[k]=draw(prob.params[k]);
    if(!prob.constraint||prob.constraint(p)) return p;
  }
  return null;
}
var CUR={}; // 문제별 현재 파라미터
function statementOf(prob){
  if(!prob.params) return (typeof prob.statement==='function')?prob.statement({}):prob.statement;
  if(!CUR[prob.id]) CUR[prob.id]=sample(prob);
  return prob.statement(CUR[prob.id]);
}
function ansText(r){
  if(r==null) return '';
  var a=r.ans, u=r.unit;
  if(typeof a==='number') return SVH.fmt(a)+' '+(u||'');
  var parts=[]; for(var k in a){ parts.push(k+' = '+SVH.fmt(a[k])+' '+((u&&u[k])||'')); }
  return parts.join(' · ');
}

/* ---------- 진도 ---------- */
function readItems(){ var ids=[]; UNITS.forEach(function(u){ LAYERS.filter(function(l){ return hasLayer(SV_CONTENT[u.id]||{},l); }).forEach(function(l){ ids.push(u.id+'-'+l); }); }); return ids; }
function refreshProg(){
  var ids=readItems(), n=0; ids.forEach(function(id){ if(VP.get(id)) n++; });
  $('#pbar').style.width=Math.round(n/ids.length*100)+'%';
  $('#ptxt').textContent='읽음 '+n+' / '+ids.length+' · 문제 '+VD.counts().total+'/'+ALL.length;
  document.querySelectorAll('.readbtn[data-read]').forEach(function(b){
    var on=VP.get(b.getAttribute('data-read'));
    b.setAttribute('aria-pressed',on?'true':'false');
    b.textContent=on?'✓ 읽음':'읽음으로 표시';
  });
  var wc=wrongList().length, badge=$('#nav-wrong .nv'); if(badge) badge.textContent=wc||'';
}
function wrongList(){
  var all=VD.all(), ids=[];
  for(var k in all){ if((all[k]==='wrong'||all[k]==='partial')&&BYID[k]) ids.push(k); }
  return ids;
}

/* ---------- 문제 카드 ---------- */
function grade(prob, status, card){
  VD.set(prob.id, status);
  card.querySelectorAll('.pbtn.sel').forEach(function(b){ b.classList.remove('sel'); });
  var btn=card.querySelector('.pbtn.grade-'+status[0]); if(btn) btn.classList.add('sel');
  var dot=card.querySelector('.sdot'); if(dot){ dot.className='sdot '+status; }
  refreshProg();
  if(EXAM.running) examAnswered(prob.id, status);
}
function renderProblem(prob){
  var card=document.createElement('article'); card.className='pcard'; card.setAttribute('data-pid',prob.id);
  var st=VD.get(prob.id);
  var srcb=prob.src?'<span class="srcb">'+esc(prob.src)+'</span>':'';
  if(prob.ref) srcb+='<span class="srcb">근거 '+esc(prob.ref)+'</span>';
  srcb+='<span class="srcb">'+esc(prob.id)+'</span>';
  card.innerHTML='<div class="pc-head"><span class="lv lv'+prob.level+'">L'+prob.level+' '+LVNAME[prob.level]+'</span>'+
    '<span class="pmeta">'+esc((prob.tags||[]).join(' · '))+'</span>'+srcb+
    '<span class="sdot'+(st?' '+st:'')+'"></span></div>'+
    '<div class="pc-st"></div><div class="pc-body"></div><div class="pc-btns"></div>';
  var stEl=$('.pc-st',card), body=$('.pc-body',card), btns=$('.pc-btns',card);
  stEl.innerHTML=statementOf(prob);

  function addBtn(label, cls, fn){
    var b=document.createElement('button'); b.type='button'; b.className='pbtn'+(cls?' '+cls:''); b.textContent=label;
    b.addEventListener('click',fn); btns.appendChild(b); return b;
  }
  function gradeBtns(){
    addBtn('맞음','grade-c',function(){ grade(prob,'correct',card); });
    addBtn('부분','grade-p',function(){ grade(prob,'partial',card); });
    addBtn('틀림','grade-w',function(){ grade(prob,'wrong',card); });
    if(st){ var b=card.querySelector('.pbtn.grade-'+st[0]); if(b) b.classList.add('sel'); }
  }

  if(prob.type==='mc'||prob.type==='tf'){
    var choices = prob.type==='tf' ? ['참 (O)','거짓 (X)'] : prob.choices;
    var correctIdx = prob.type==='tf' ? (prob.answer?0:1) : prob.answer;
    var wrap=document.createElement('div'); wrap.className='choices';
    choices.forEach(function(c,i){
      var b=document.createElement('button'); b.type='button'; b.className='choice'; b.innerHTML=c;
      b.addEventListener('click',function(){
        if(card.__done) return; card.__done=true;
        wrap.children[correctIdx].classList.add('right');
        if(i!==correctIdx) b.classList.add('wrongpick');
        var ex=document.createElement('div'); ex.className='expl'; ex.innerHTML='<b>해설</b> — '+prob.expl;
        body.appendChild(ex); typeset(ex);
        grade(prob, i===correctIdx?'correct':'wrong', card);
      });
      wrap.appendChild(b);
    });
    body.appendChild(wrap);
  } else {
    var hintIdx=0, hb=null;
    if(prob.hints&&prob.hints.length){
      addBtn('힌트','',function(){
        if(hintIdx>=prob.hints.length) return;
        if(!hb){ hb=document.createElement('div'); hb.className='hintbox'; body.appendChild(hb); }
        var d=document.createElement('div'); d.innerHTML='힌트 '+(hintIdx+1)+'. '+prob.hints[hintIdx];
        hb.appendChild(d); typeset(d); hintIdx++;
        this.textContent = hintIdx>=prob.hints.length ? '힌트 끝' : '힌트 '+(hintIdx+1);
      });
    }
    var solBtn=addBtn('풀이 보기','',function(){
      if(card.__sol){ card.__sol.hidden=!card.__sol.hidden; this.textContent=card.__sol.hidden?'풀이 보기':'풀이 닫기'; return; }
      var box=document.createElement('div'); box.className='solbox';
      var steps, aline='';
      if(prob.type==='derive'){ steps=prob.steps; }
      else{
        var r=prob.solve(prob.params?CUR[prob.id]:{});
        steps=r.steps; aline='<div class="ansline">답: '+esc(ansText(r))+'</div>';
      }
      box.innerHTML='<ol>'+steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol>'+aline+
        (prob.expl?'<div class="expl">'+prob.expl+'</div>':'');
      body.appendChild(box); typeset(box);
      card.__sol=box; this.textContent='풀이 닫기';
      if(!card.__graded){ card.__graded=true; gradeBtns(); }
    });
    if(prob.params){
      addBtn('새 숫자로 다시','',function(){
        CUR[prob.id]=sample(prob);
        stEl.innerHTML=statementOf(prob); typeset(stEl);
        if(card.__sol){ card.__sol.remove(); card.__sol=null; solBtn.textContent='풀이 보기'; }
        if(hb){ hb.remove(); hb=null; hintIdx=0; }
      });
    }
    if(st&&!card.__graded){ card.__graded=true; gradeBtns(); }
  }
  return card;
}

/* ---------- 뷰 ---------- */
var view=$('#view');
function setView(html){ view.innerHTML=html; }
function renderHome(){
  var dc=VD.counts();
  var rate=dc.total?Math.round(dc.correct/dc.total*100):null;

  setView('<div class="eyebrow">[[APP_EYEBROW]]</div>'+
    '<h1>[[APP_TITLE]]</h1>'+
    '<p class="lede">개념, 유도, 예제를 읽고 L1부터 L4까지 네 단계 문제로 굳힌다. 모든 계산형 문제는 독립 재계산과 대조해 통과한 것만 실었고, 숫자를 바꿔 몇 번이든 다시 풀 수 있다.</p>'+
    (C.hero?'<figure class="hero-fig">'+C.hero+'</figure>':'')+
    '<div class="facts"><span><b>'+ALL.length+'</b>문제</span><span><b>'+UNITS.length+'</b>단원</span><span><b>'+nParam+'</b>문제는 숫자가 매번 바뀜</span>'+
    '<span><b>'+dc.total+'</b>문제 풀어 봄'+(rate!==null?(' · 정답률 '+rate+'%'):'')+'</span></div>'+
    '<p class="note-line"><a href="#wrong">오답노트 '+wrongList().length+'문제</a> · 빌드 '+SV_BUILD.date+' · 검산 게이트 '+SV_BUILD.gate+'</p>'+
    '<h3>단원</h3><div class="ucards" id="ucards"></div>'+
    '<h3>훈련</h3><div class="ucards">'+
    '<a class="ucard" href="#exam"><span class="uc-no">시험</span><span class="uc-ti">모의고사</span><span class="uc-scope">범위·난이도·문항 수를 골라 무작위로 출제한다. 계산 문제는 매번 새 수치이고, 끝나면 단원별 리포트가 나온다.</span></a>'+
    '<a class="ucard" href="#wrong"><span class="uc-no">복습</span><span class="uc-ti">오답노트</span><span class="uc-scope">틀림·부분으로 채점한 문제만 모아 새 수치로 다시 낸다. 맞음으로 바꾸면 빠진다.</span><span class="uc-stat">'+wrongList().length+'문제 대기</span></a></div>'+
    (C.bigpicture?'<h3>과목 큰그림</h3><details class="layer" open><summary>한 문장으로 보는 중간범위<span class="arrow">›</span></summary><div class="body">'+C.bigpicture+'</div></details>':''));
  var uc=$('#ucards');
  UNITS.forEach(function(u,i){
    var solved=0, ok=0;
    u.problems.forEach(function(p){ var s=VD.get(p.id); if(s){solved++; if(s==='correct')ok++;} });
    var avail=LAYERS.filter(function(l){return hasLayer(SV_CONTENT[u.id]||{},l);});
    var reads=avail.filter(function(l){return VP.get(u.id+'-'+l);}).length;
    var a=document.createElement('a'); a.className='ucard'; a.href='#'+u.id; a.style.setProperty('--d',(i*45)+'ms');
    a.innerHTML='<span class="uc-no">U'+u.no+'</span><span class="uc-ti">'+esc(u.title)+'</span>'+
      '<span class="uc-stat">'+u.problems.length+'문제 · 푼 '+solved+(solved?' · 정답 '+ok:'')+' · 읽음 '+reads+'/'+avail.length+'</span>'+
      '<span class="uc-scope">'+esc(u.scope)+'</span>';
    uc.appendChild(a);
  });
  typeset(view);
}
function renderUnit(u){
  var c=SV_CONTENT[u.id]||{};
  setView('<div class="eyebrow">단원 '+u.no+' / '+UNITS.length+'</div><h1>'+esc(u.title)+'</h1>'+
    '<p class="lede">'+esc(u.scope)+'</p><div id="layers"></div>'+
    '<h3>문제 '+u.problems.length+'개 <span class="src">L1 개념 확인에서 L4 시험급까지</span></h3>'+
    '<div class="filters" id="filters"></div><div id="plist"></div>');
  var layers=$('#layers');
  LAYERS.filter(function(l){ return hasLayer(c,l); }).forEach(function(l){
    var d=document.createElement('details'); d.className='layer'; if(l==='concept') d.open=true;
    var inner='';
    if(l==='derive'){
      (c.derive||[]).forEach(function(dv){
        inner+='<details class="dstep"><summary>'+esc(dv.title)+'</summary><ol>'+
          dv.steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol></details>';
      });
    } else inner=c[l]||'';
    d.innerHTML='<summary>'+LAYER_KO[l]+'<span class="arrow">›</span></summary>'+
      '<div class="body">'+inner+'<div class="readrow"><button type="button" class="readbtn" data-read="'+u.id+'-'+l+'"></button></div></div>';
    layers.appendChild(d);
  });
  layers.addEventListener('click',function(e){
    var b=e.target.closest('.readbtn'); if(!b) return;
    VP.toggle(b.getAttribute('data-read')); refreshProg();
  });
  var lv=0, fl=$('#filters'), pl=$('#plist');
  function renderList(){
    pl.innerHTML='';
    u.problems.filter(function(p){ return !lv||p.level===lv; }).forEach(function(p){ pl.appendChild(renderProblem(p)); });
    typeset(pl);
  }
  [['전체',0],['L1 개념',1],['L2 기본',2],['L3 응용',3],['L4 시험급',4]].forEach(function(f){
    var b=document.createElement('button'); b.type='button'; b.className='fchip'+(f[1]===0?' on':''); b.textContent=f[0];
    b.addEventListener('click',function(){ lv=f[1]; fl.querySelectorAll('.fchip').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); renderList(); });
    fl.appendChild(b);
  });
  renderList(); typeset(layers);
}
function renderWrong(){
  var ids=wrongList();
  setView('<div class="eyebrow">복습</div><h1>오답노트</h1>'+
    '<p class="lede">틀림·부분으로 채점한 문제 '+ids.length+'개. 계산형은 열 때마다 새 수치로 바뀌니 답을 외워서는 넘길 수 없다. 다시 풀어 <b>맞음</b>으로 바꾸면 여기서 빠진다.</p><div id="plist"></div>');
  var pl=$('#plist');
  if(!ids.length){ pl.innerHTML='<div class="empty">아직 비어 있다. 문제를 풀고 틀림이나 부분으로 채점하면 여기 모인다.</div>'; return; }
  ids.forEach(function(id){ var p=BYID[id]; if(p&&p.params) CUR[id]=sample(p); pl.appendChild(renderProblem(BYID[id])); });
  typeset(pl);
}
/* ---------- 모의고사 ---------- */
var EXAM={running:false};
function renderExam(){
  if(EXAM.running){ renderExamRun(); return; }
  var uchecks=UNITS.map(function(u){ return '<label class="ck"><input type="checkbox" class="exu" value="'+u.id+'" checked> U'+u.no+' '+esc(u.title)+'</label>'; }).join('');
  setView('<div class="eyebrow">시험</div><h1>모의고사</h1>'+
    '<p class="lede">범위와 난이도를 고르면 무작위로 출제한다. 객관식은 바로 채점되고, 계산형은 풀이를 펼쳐 스스로 채점한다. 끝나면 단원별 리포트가 나온다.</p>'+
    '<div class="exam-setup">'+
    '<div class="grp"><h4>범위</h4>'+uchecks+'</div>'+
    '<div class="grp"><h4>난이도</h4>'+[1,2,3,4].map(function(l){return '<label class="ck"><input type="checkbox" class="exl" value="'+l+'" '+(l>1?'checked':'')+'> L'+l+'</label>';}).join('')+'</div>'+
    '<div class="grp"><h4>문항 수</h4><select id="exn"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>'+
    '<button class="bigbtn" id="exgo">모의고사 시작</button><p class="note-line" id="exmsg" role="status" hidden></p></div>');
  $('#exgo').addEventListener('click',function(){
    var us={}, ls={};
    document.querySelectorAll('.exu:checked').forEach(function(c){us[c.value]=1;});
    document.querySelectorAll('.exl:checked').forEach(function(c){ls[+c.value]=1;});
    var pool=ALL.filter(function(p){ return us[p._unit.id]&&ls[p.level]; });
    var n=Math.min(+$('#exn').value, pool.length);
    if(!n){ var m=$('#exmsg'); m.hidden=false; m.textContent='고른 범위·난이도에 해당하는 문제가 없다. 단원이나 난이도를 하나 이상 더 골라 보자.'; return; }
    for(var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
    var uk=Object.keys(us).map(function(id){ return 'U'+UNITS.filter(function(u){return u.id===id;})[0].no; });
    var lk=Object.keys(ls).sort().map(function(l){return 'L'+l;});
    EXAM={running:true, list:pool.slice(0,n), idx:0, res:{}, label:(uk.length===UNITS.length?'전 단원':uk.join('·'))+' · '+lk.join('·')};
    EXAM.list.forEach(function(p){ if(p.params) CUR[p.id]=sample(p); });
    renderExamRun();
  });
}
function examAnswered(pid, status){ if(EXAM.running&&EXAM.res) EXAM.res[pid]=status; }
function renderExamRun(){
  var i=EXAM.idx, p=EXAM.list[i];
  var ticks=EXAM.list.map(function(q,k){ return '<i class="'+(k<i?'done':(k===i?'cur':''))+'"></i>'; }).join('');
  setView('<div class="eyebrow">모의고사 · '+esc(EXAM.label||'')+'</div>'+
    '<div class="exam-top"><span class="cnt">'+(i+1)+'<small> / '+EXAM.list.length+'</small></span><div class="ticks" aria-hidden="true">'+ticks+'</div>'+
    '<button class="pbtn" id="exquit">종료</button></div><div id="pslot"></div>'+
    '<div class="pc-btns" style="margin-top:14px"><button class="bigbtn" id="exnext">'+(i+1<EXAM.list.length?'다음 문제 →':'리포트 보기 →')+'</button></div>');
  $('#pslot').appendChild(renderProblem(p)); typeset($('#pslot'));
  $('#exnext').addEventListener('click',function(){
    if(EXAM.idx+1<EXAM.list.length){ EXAM.idx++; renderExamRun(); } else renderExamReport();
  });
  $('#exquit').addEventListener('click',renderExamReport);
}
function renderExamReport(){
  var res=EXAM.res, list=EXAM.list; EXAM.running=false;
  var c=0,pt=0,w=0,na=0;
  var perUnit={};
  list.forEach(function(p){
    var s=res[p.id];
    var u=perUnit[p._unit.id]=perUnit[p._unit.id]||{t:0,c:0,title:p._unit.title,no:p._unit.no};
    u.t++;
    if(s==='correct'){c++;u.c++;} else if(s==='partial'){pt++;} else if(s==='wrong'){w++;} else na++;
  });
  var score=Math.round((c+0.5*pt)/list.length*100);
  var rows=Object.keys(perUnit).sort().map(function(k){var u=perUnit[k];return '<tr><td>U'+u.no+' '+esc(u.title)+'</td><td>'+u.c+' / '+u.t+'</td></tr>';}).join('');
  var MK={correct:'○',partial:'△',wrong:'✕'};
  var marks=list.map(function(p,k){ var s=res[p.id];
    return '<tr><td class="mkn">'+(k+1)+'</td><td>U'+p._unit.no+' '+esc((p.tags||[]).join(' · '))+' <span class="src">L'+p.level+'</span></td><td class="mk">'+(MK[s]||'–')+'</td></tr>'; }).join('');
  setView('<div class="eyebrow">모의고사 · '+esc(EXAM.label||'')+'</div><h1>결과 리포트</h1>'+
    '<div class="report"><div class="rep-l"><div class="score">'+score+'<small>점</small></div>'+
    '<p>맞음 '+c+' · 부분 '+pt+' · 틀림 '+w+(na?' · 무응답 '+na:'')+' (총 '+list.length+'문제, 부분은 절반으로 계산)</p>'+
    '<table><thead><tr><th>단원</th><th>정답</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="rep-r"><table class="marks"><thead><tr><th>번호</th><th>문제</th><th>채점</th></tr></thead><tbody>'+marks+'</tbody></table></div></div>'+
    '<p class="note-line">틀림과 부분으로 채점한 문제는 오답노트에 자동으로 들어갔다.</p>'+
    '<div class="pc-btns"><a class="pbtn" href="#wrong">오답노트로</a><a class="pbtn" href="#exam">다시 설정</a><a class="pbtn" href="#home">홈</a></div>');
}

/* ---------- 내비 · 라우팅 ---------- */
function buildNav(){
  var nav=$('#sidenav'), sheet=$('#tb-sheet');
  var html='<div class="ng">학습</div><a href="#home" data-v="home">홈 · 현황</a>';
  UNITS.forEach(function(u){ html+='<a href="#'+u.id+'" data-v="'+u.id+'">U'+u.no+' '+esc(u.title)+'</a>'; });
  html+='<div class="ng">훈련</div><a href="#wrong" data-v="wrong" id="nav-wrong">오답노트<span class="nv"></span></a><a href="#exam" data-v="exam">모의고사</a>';
  nav.innerHTML=html;
  sheet.innerHTML=UNITS.map(function(u){ return '<a href="#'+u.id+'">U'+u.no+' '+esc(u.title)+'</a>'; }).join('');
}
function route(){
  var h=(location.hash||'#home').slice(1);
  var valid={home:1,wrong:1,exam:1}; UNITS.forEach(function(u){valid[u.id]=1;});
  if(!valid[h]) h='home';
  if(h!=='exam') EXAM.running=false;
  document.querySelectorAll('.side nav a').forEach(function(a){ a.classList.toggle('on',a.getAttribute('data-v')===h); });
  document.querySelectorAll('.tabbar [data-tv]').forEach(function(a){ a.classList.toggle('on',a.getAttribute('data-tv')===h); });
  var sh=$('#tb-sheet'); if(sh) sh.hidden=true;
  VM.touch(location.hash||'#home');
  if(h==='home') renderHome();
  else if(h==='wrong') renderWrong();
  else if(h==='exam') renderExam();
  else renderUnit(UNITS.filter(function(u){return u.id===h;})[0]);
  window.scrollTo(0,0);
  refreshProg();
}
var tbMore=$('#tb-more'), tbSheet=$('#tb-sheet');
if(tbMore){ tbMore.addEventListener('click',function(e){ e.stopPropagation(); tbSheet.hidden=!tbSheet.hidden; });
  document.addEventListener('click',function(e){ if(!tbSheet.hidden&&!tbSheet.contains(e.target)) tbSheet.hidden=true; }); }
window.addEventListener('hashchange',route);
buildNav(); route();
})();
</script>
</body>
</html>
