<script>
/* U6 자기장과 자기력 — 로런츠 힘, 원운동, 속도선택기, 질량분석, 홀, 도선 힘·토크 (W6) */
SV_BANK.push({
  id: 'u6', no: 6, title: '자기장과 자기력', titleEn: 'Magnetic Fields & Forces',
  scope: '로런츠 힘 F=qv×B · 원운동·사이클로트론 · 속도 선택기 · 질량분석기 · 홀 효과 · 전류 도선의 힘 F=IL×B · 자기 쌍극자 토크',
  problems: [

  /* ---------- L1 (6) ---------- */
  { id:'u6-l1-01', level:1, type:'mc', tags:['로런츠 힘'], src:'교재 표준',
    statement:'자기력 \\(\\vec F=q\\vec v\\times\\vec B\\)의 성질로 옳지 않은 것은?',
    choices:['속력을 바꿔 운동에너지를 증가시킨다','v와 B 모두에 수직이다','정지 전하에는 작용하지 않는다','v∥B이면 0이다'],
    answer:0, expl:'F⊥v → 일을 못 한다 → 속력 불변·방향만 변경. "자기력은 일을 안 한다"가 최중요 명제.' },
  { id:'u6-l1-02', level:1, type:'tf', tags:['단위'], src:'교재 표준',
    statement:'자기장 단위 테슬라는 1 T = 1 N/(A·m) = 10⁴ G이며, 지구 자기장은 ~0.5 G(5×10⁻⁵ T) 수준이다.',
    answer:true, expl:'1 T는 큰 장(MRI 1.5~3 T). 오더 감각: 냉장고 자석 ~10⁻² T.' },
  { id:'u6-l1-03', level:1, type:'mc', tags:['원운동'], src:'교재 표준',
    statement:'균일 B에 수직 입사한 대전입자의 원운동 반지름과 주기는?',
    choices:['r=mv/qB, T=2πm/qB (T는 속력 무관!)','r=qB/mv','T가 빠를수록 길다','r는 B에 비례'],
    answer:0, expl:'주기의 속력 무관성 = 사이클로트론의 존재 이유. f=qB/2πm.' },
  { id:'u6-l1-04', level:1, type:'mc', tags:['속도 선택기'], src:'교재 표준',
    statement:'E와 B가 수직으로 겹친 속도 선택기를 직진 통과하는 조건은?',
    choices:['v=E/B (전하량·부호 무관)','v=B/E','양전하만 통과','무거울수록 통과'],
    answer:0, expl:'qE=qvB에서 q 소거 — 모든 종에 같은 v. 그 뒤 B만 있는 영역에서 질량 분리(질량분석).' },
  { id:'u6-l1-05', level:1, type:'tf', tags:['도선 힘'], src:'교재 표준',
    statement:'전류 도선이 받는 힘은 \\(\\vec F=I\\vec L\\times\\vec B\\)이고, 닫힌 회로가 균일 장에서 받는 알짜힘은 0이다(토크는 가능).',
    answer:true, expl:'ΣL=0이므로. 알짜힘이 필요하면 비균일 장 — 토크는 균일 장에서도(모터!).' },
  { id:'u6-l1-06', level:1, type:'mc', tags:['자기 쌍극자'], src:'교재 표준',
    statement:'전류 고리의 자기 모멘트 \\(\\vec\\mu=NI\\vec A\\)가 균일 B에서 받는 토크와 에너지는?',
    choices:['\\(\\tau=\\mu B\\sin\\theta,\\ U=-\\mu B\\cos\\theta\\)','τ=µBcosθ','U=+µBcosθ가 최소는 θ=180°','토크 항상 0'],
    answer:0, expl:'전기 쌍극자(p, E)와 완전 평행 구조 — U1과 짝으로 암기.' },

  /* ---------- L2 (12) ---------- */
  { id:'u6-l2-01', level:2, type:'num', tags:['힘 크기'], src:'창작 문제(검산됨)',
    params:{ v:{choices:[2,5],unit:'×10⁶ m/s'}, B:{choices:[0.5,1.2],unit:'T'}, th:{choices:[30,90]} },
    statement:function(p){ return '양성자(v='+p.v+'×10⁶ m/s)가 B='+p.B+' T와 '+p.th+'° 각도로 입사. 힘(N)과 가속도(m/s²)를 구하라. (m_p=1.67×10⁻²⁷)'; },
    solve:function(p){
      var F=1.602e-19*p.v*1e6*p.B*Math.sin(SVH.rad(p.th));
      return { ans:{F:F, a:F/1.67e-27}, unit:{F:'N', a:'m/s²'}, steps:[
        'F = qvBsinθ = '+SVH.fmt(F)+' N',
        'a = F/m = '+SVH.fmt(F/1.67e-27)+' m/s²' ] }; },
    hints:['sinθ 포함.'] },
  { id:'u6-l2-02', level:2, type:'num', tags:['원 반지름'], src:'창작 문제(검산됨)',
    params:{ V:{choices:[500,2000],unit:'V'}, B:{choices:[0.1,0.5],unit:'T'} },
    statement:function(p){ return p.V+' V로 가속된 전자가 B='+p.B+' T에 수직 입사. (a) 속력(m/s) (b) 반지름(mm)을 구하라.'; },
    solve:function(p){
      var v=Math.sqrt(2*1.602e-19*p.V/9.11e-31);
      var r=9.11e-31*v/(1.602e-19*p.B)*1000;
      return { ans:{v:v, r:r}, unit:{v:'m/s', r:'mm'}, steps:[
        'v = √(2eV/m) = '+SVH.fmt(v)+' m/s',
        'r = mv/eB = '+SVH.fmt(r)+' mm (U3 가속 + U6 회전의 결합)' ] }; },
    hints:['두 단원 공식 연결.'] },
  { id:'u6-l2-03', level:2, type:'num', tags:['사이클로트론 주파수'], src:'창작 문제(검산됨)',
    params:{ B:{choices:[0.5,1,1.5],unit:'T'} },
    statement:function(p){ return 'B='+p.B+' T에서 (a) 양성자 (b) 전자의 사이클로트론 주파수(MHz)를 구하라.'; },
    solve:function(p){
      var fp=1.602e-19*p.B/(2*Math.PI*1.67e-27)/1e6;
      var fe=1.602e-19*p.B/(2*Math.PI*9.11e-31)/1e6;
      return { ans:{fp:fp, fe:fe}, unit:{fp:'MHz', fe:'MHz'}, steps:[
        'f = qB/2πm: 양성자 '+SVH.fmt(fp)+' MHz',
        '전자 '+SVH.fmt(fe)+' MHz (m 반비례 — 1836배 빠르다)' ] }; },
    hints:['속력 무관.'] },
  { id:'u6-l2-04', level:2, type:'num', tags:['속도 선택'], src:'창작 문제(검산됨)',
    params:{ E:{choices:[1,3],unit:'×10⁵ V/m'}, B:{choices:[0.2,0.5],unit:'T'} },
    statement:function(p){ return 'E='+p.E+'×10⁵ V/m, B='+p.B+' T 속도 선택기의 통과 속력(m/s)은? 더 빠른 입자는 어느 쪽으로 휘나(자기력 우세=1)?'; },
    solve:function(p){
      var v=p.E*1e5/p.B;
      return { ans:{v:v, fast:1}, unit:{v:'m/s', fast:''}, steps:[
        'v = E/B = '+SVH.fmt(v)+' m/s',
        'v↑ → qvB↑ 자기력 우세(1) 쪽으로 휨 (선별의 원리)' ] }; },
    hints:['힘 균형.'] },
  { id:'u6-l2-05', level:2, type:'num', tags:['도선 힘'], src:'창작 문제(검산됨)',
    params:{ I:{choices:[5,10],unit:'A'}, L:{choices:[0.5,1],unit:'m'}, B:{choices:[0.2,0.5],unit:'T'}, th:{choices:[90,60]} },
    statement:function(p){ return 'I='+p.I+' A, L='+p.L+' m 직선 도선이 B='+p.B+' T와 '+p.th+'°. 힘(N)은?'; },
    solve:function(p){ var F=p.I*p.L*p.B*Math.sin(SVH.rad(p.th));
      return { ans:F, unit:'N', steps:[
        '도선 힘: \\(F=IL B\\sin\\theta\\) (qv→IL 치환)',
        'F = '+p.I+'×'+p.L+'×'+p.B+'×sin'+p.th+'° = '+SVH.fmt(F)+' N' ] }; },
    hints:['qv→IL 치환.'] },
  { id:'u6-l2-06', level:2, type:'num', tags:['부양 전류'], src:'기출 유형',
    params:{ lam:{choices:[10,40],unit:'g/m'}, B:{choices:[0.5,1],unit:'T'} },
    statement:function(p){ return '선밀도 '+p.lam+' g/m 도선을 수평 B='+p.B+' T(수평, 도선과 수직)에서 자기력으로 띄우려면 전류(A)는?'; },
    solve:function(p){ var I=p.lam/1000*9.8/p.B;
      return { ans:I, unit:'A', steps:[
        '단위길이: BI = λg → I = λg/B',
        '= '+SVH.fmt(I)+' A (자기 부상의 최소 모형)' ] }; },
    hints:['단위길이 균형.'] },
  { id:'u6-l2-07', level:2, type:'num', tags:['코일 토크'], src:'창작 문제(검산됨)',
    params:{ N:{choices:[50,100]}, I:{choices:[1,2],unit:'A'}, A:{choices:[20,50],unit:'cm²'}, B:{choices:[0.3,0.6],unit:'T'} },
    statement:function(p){ return 'N='+p.N+'회, I='+p.I+' A, A='+p.A+' cm² 코일이 B='+p.B+' T에서 면이 장과 평행(µ⊥B)할 때 토크(N·m)는?'; },
    solve:function(p){ var tau=p.N*p.I*p.A*1e-4*p.B;
      return { ans:tau, unit:'N·m', steps:[
        'µ = NIA = '+SVH.fmt(p.N*p.I*p.A*1e-4)+' A·m²',
        'τ = µBsin90° = '+SVH.fmt(tau)+' N·m (전동기·검류계의 심장)' ] }; },
    hints:['sinθ의 θ는 µ와 B 사이.'] },
  { id:'u6-l2-08', level:2, type:'num', tags:['홀 전압'], src:'교재 표준',
    params:{ I:{choices:[1,5],unit:'A'}, B:{choices:[1,2],unit:'T'}, t:{choices:[0.1,0.5],unit:'mm'} },
    statement:function(p){ return '구리 리본(두께 t='+p.t+' mm, n=8.5×10²⁸)에 I='+p.I+' A, B='+p.B+' T 수직. 홀 전압(µV)은?'; },
    solve:function(p){
      var V=p.I*p.B/(8.5e28*1.602e-19*p.t*1e-3)*1e6;
      return { ans:V, unit:'µV', steps:[
        'V_H = IB/(net) = '+SVH.fmt(V)+' µV',
        '(µV 수준 — 반도체(n 작음)로 만들면 mV: 홀 센서의 재료 선택)' ] }; },
    hints:['식 하나, 지수 조심.'] },
  { id:'u6-l2-09', level:2, type:'num', tags:['원운동 주기'], src:'창작 문제(검산됨)',
    params:{ B:{choices:[0.01,0.1],unit:'T'} },
    statement:function(p){ return 'B='+p.B+' T 속 전자의 원운동 주기(ns)는? 속력이 2배가 되면 주기는?'; },
    solve:function(p){
      var T=2*Math.PI*9.11e-31/(1.602e-19*p.B)*1e9;
      return { ans:{T:T, T2:T}, unit:{T:'ns', T2:'ns'}, steps:[
        'T = 2πm/eB = '+SVH.fmt(T)+' ns',
        '속력 2배 → 반지름 2배·주기 그대로 '+SVH.fmt(T)+' ns' ] }; },
    hints:['등시성.'] },
  { id:'u6-l2-10', level:2, type:'num', tags:['나선 운동'], src:'교재 표준',
    params:{ v:{choices:[2,4],unit:'×10⁶ m/s'}, th:{choices:[30,60]}, B:{choices:[0.2,0.4],unit:'T'} },
    statement:function(p){ return '양성자가 B와 '+p.th+'° 각도, v='+p.v+'×10⁶ m/s로 입사해 나선 운동한다. (a) 반지름(mm) (b) 피치(한 바퀴 전진 거리, mm)를 구하라.'; },
    solve:function(p){
      var v=p.v*1e6, th=SVH.rad(p.th);
      var r=1.67e-27*v*Math.sin(th)/(1.602e-19*p.B)*1000;
      var T=2*Math.PI*1.67e-27/(1.602e-19*p.B);
      var pitch=v*Math.cos(th)*T*1000;
      return { ans:{r:r, pitch:pitch}, unit:{r:'mm', pitch:'mm'}, steps:[
        'r = mv⊥/qB = '+SVH.fmt(r)+' mm (수직 성분만)',
        '피치 = v∥T = '+SVH.fmt(pitch)+' mm (오로라·자기병의 기하)' ] }; },
    hints:['성분 분해.'] },
  { id:'u6-l2-11', level:2, type:'num', tags:['운동 기전력 맛보기'], src:'창작 문제(검산됨)',
    params:{ L:{choices:[0.5,1],unit:'m'}, v:{choices:[5,10],unit:'m/s'}, B:{choices:[0.5,1],unit:'T'} },
    statement:function(p){ return '길이 L='+p.L+' m 막대가 v='+p.v+' m/s로 B='+p.B+' T를 가로지른다. 양단 전위차(V)는? (qE=qvB 평형)'; },
    solve:function(p){ var V=p.B*p.L*p.v;
      return { ans:V, unit:'V', steps:[
        '내부 전하 평형: E=vB → V = BLv = '+SVH.fmt(V)+' V',
        '(발전기의 씨앗 — 기말 유도 단원의 예고편)' ] }; },
    hints:['vB가 유효 장.'] },
  { id:'u6-l2-12', level:2, type:'num', tags:['일-무일 확인'], src:'창작 문제(검산됨)',
    params:{ B:{choices:[1,2],unit:'T'}, v:{choices:[3,6],unit:'×10⁶ m/s'}, n:{choices:[100,1000]} },
    statement:function(p){ return '전자가 B='+p.B+' T에서 원운동 '+p.n+'바퀴를 돌았다. 자기력이 한 일(J)과 최종 속력(초기 '+p.v+'×10⁶ 대비 배율)을 구하라.'; },
    solve:function(p){
      return { ans:{W:0, ratio:1}, unit:{W:'J', ratio:'배'}, steps:[
        'F⊥v 항상 → W = 0 J, 속력 1배(불변)',
        '(몇 바퀴든 무관 — 에너지를 바꾸려면 E장이 필요: 사이클로트론이 E를 "동기화"해 넣는 이유)' ] }; },
    hints:['정의에서 즉답.'] },

  /* ---------- L3 (14) ---------- */
  { id:'u6-l3-01', level:3, type:'num', tags:['질량분석기'], src:'기출 유형',
    params:{ V:{choices:[2,5],unit:'kV'}, B:{choices:[0.2,0.5],unit:'T'}, A:{choices:[12,14]} },
    statement:function(p){ return '탄소 이온(질량수 '+p.A+', q=+e)을 '+p.V+' kV로 가속 후 B='+p.B+' T에 수직 입사. (a) 반지름(cm) (b) ¹²C와 ¹⁴C의 반지름비 √(12/14)... 값으로 r₁₄/r₁₂를 구하라. (u=1.66×10⁻²⁷)'; },
    solve:function(p){
      var m=p.A*1.66e-27;
      var v=Math.sqrt(2*1.602e-19*p.V*1000/m);
      var r=m*v/(1.602e-19*p.B)*100;
      return { ans:{r:r, ratio:Math.sqrt(14/12)}, unit:{r:'cm', ratio:''}, steps:[
        'v = √(2qV/m) = '+SVH.fmt(v)+' m/s',
        'r = mv/qB = √(2mV/q)/B = '+SVH.fmt(r)+' cm',
        'r∝√m → r₁₄/r₁₂ = '+SVH.fmt(Math.sqrt(14/12))+' (동위원소 분리 — 방사성탄소연대의 하드웨어)' ] }; },
    hints:['r∝√m 정리.'] },
  { id:'u6-l3-02', level:3, type:'num', tags:['J.J.톰슨 e/m'], src:'기출 유형',
    params:{ E:{choices:[1,2],unit:'×10⁴ V/m'}, B:{choices:[0.001,0.002],unit:'T'} },
    statement:function(p){ return '톰슨 실험: 속도선택 E='+p.E+'×10⁴ V/m, B='+p.B+' T → 이후 같은 B로 반지름 r을 측정하면 e/m=E/(rB²). r=5 cm일 때 e/m(C/kg)을 구하고 참값과 비교하라.'; },
    solve:function(p){
      var em=p.E*1e4/(0.05*p.B*p.B);
      return { ans:em, unit:'C/kg', steps:[
        'v = E/B → e/m = v/(rB) = E/(rB²)',
        '= '+SVH.fmt(em)+' C/kg (참값 1.76×10¹¹ 근처인지 — 전자 발견 1897의 재현)' ] }; },
    hints:['두 단계 합성.'] },
  { id:'u6-l3-03', level:3, type:'num', tags:['반원 사출'], src:'기출 유형',
    params:{ B:{choices:[0.1,0.3],unit:'T'}, v:{choices:[1,3],unit:'×10⁶ m/s'} },
    statement:function(p){ return '전자가 장 영역(B='+p.B+' T, 지면 안쪽)에 수직으로 들어가 반원을 그리고 나온다. (a) 반지름(mm) (b) 머문 시간(ns) (c) 들어온 지점과 나간 지점의 거리(mm)를 구하라. (v='+p.v+'×10⁶)'; },
    solve:function(p){
      var v=p.v*1e6;
      var r=9.11e-31*v/(1.602e-19*p.B)*1000;
      var t=Math.PI*9.11e-31/(1.602e-19*p.B)*1e9;
      return { ans:{r:r, t:t, d:2*r}, unit:{r:'mm', t:'ns', d:'mm'}, steps:[
        'r = mv/eB = '+SVH.fmt(r)+' mm',
        '반원 시간 = T/2 = πm/eB = '+SVH.fmt(t)+' ns (속력 무관)',
        '출입 간격 = 지름 2r = '+SVH.fmt(2*r)+' mm' ] }; },
    hints:['반원 기하.'] },
  { id:'u6-l3-04', level:3, type:'num', tags:['ㄷ자 도선 힘'], src:'기출 유형',
    params:{ I:{choices:[5,10],unit:'A'}, L:{choices:[10,20],unit:'cm'}, B:{choices:[0.4,0.8],unit:'T'} },
    statement:function(p){ return '균일 B('+p.B+' T, 지면 안쪽) 영역에 ㄷ자 도선(폭 L='+p.L+' cm)이 일부 담겨 I='+p.I+' A. 알짜힘(N)은 어느 부분이 만들고 크기는?'; },
    solve:function(p){ var F=p.I*p.L/100*p.B;
      return { ans:F, unit:'N', steps:[
        '옆 두 변의 힘은 상쇄, 바닥 변만 알짜',
        'F = ILB = '+SVH.fmt(F)+' N (전류천칭 실험의 원리)' ] }; },
    hints:['대칭 상쇄부터.'] },
  { id:'u6-l3-05', level:3, type:'num', tags:['검류계 설계'], src:'기출 유형',
    params:{ N:{choices:[100,200]}, A:{choices:[2,4],unit:'cm²'}, B:{choices:[0.2,0.5],unit:'T'}, kappa:{choices:[1,4],unit:'×10⁻⁸ N·m/°'} },
    statement:function(p){ return '검류계(N='+p.N+', A='+p.A+' cm², B='+p.B+' T, 비틀림 상수 κ='+p.kappa+'×10⁻⁸ N·m/°): 1°를 돌리는 전류(µA)는? (radial field로 sinθ=1 유지)'; },
    solve:function(p){
      var I=p.kappa*1e-8/(p.N*p.A*1e-4*p.B)*1e6;
      return { ans:I, unit:'µA', steps:[
        '평형: NIAB = κθ → I(1°) = κ/(NAB)',
        '= '+SVH.fmt(I)+' µA (감도의 공식 — N·A·B를 키우면 민감)' ] }; },
    hints:['토크 균형.'] },
  { id:'u6-l3-06', level:3, type:'num', tags:['사이클로트론 에너지'], src:'기출 유형',
    params:{ B:{choices:[1,1.5],unit:'T'}, R:{choices:[0.5,1],unit:'m'} },
    statement:function(p){ return '사이클로트론(B='+p.B+' T, 최대 반지름 R='+p.R+' m)의 양성자 (a) 최대 속력(m/s) (b) 최대 에너지(MeV)를 구하라.'; },
    solve:function(p){
      var v=1.602e-19*p.B*p.R/1.67e-27;
      var E=0.5*1.67e-27*v*v/1.602e-19/1e6;
      return { ans:{v:v, E:E}, unit:{v:'m/s', E:'MeV'}, steps:[
        'v = qBR/m = '+SVH.fmt(v)+' m/s',
        'KE = ½mv² = q²B²R²/2m = '+SVH.fmt(E)+' MeV',
        '(에너지 ∝ B²R² — 가속기가 커지는 이유)' ] }; },
    hints:['r=R에서 한계.'] },
  { id:'u6-l3-07', level:3, type:'num', tags:['평행판+B 복합'], src:'기출 유형',
    params:{ V:{choices:[200,400],unit:'V'}, d:{choices:[2,4],unit:'cm'}, B:{choices:[0.05,0.1],unit:'T'} },
    statement:function(p){ return '평행판(V='+p.V+' V, d='+p.d+' cm) 사이에 B('+p.B+' T)를 판과 평행하게 걸었다. 전자가 힘 균형으로 직진하는 속력(m/s)과, 이보다 "느린" 전자가 휘는 쪽(E쪽=1/B힘쪽... 전기력 우세=1)을 구하라.'; },
    solve:function(p){
      var E=p.V/(p.d/100), v=E/p.B;
      return { ans:{v:v, slow:1}, unit:{v:'m/s', slow:''}, steps:[
        'E = V/d = '+SVH.fmt(E)+' V/m → v = E/B = '+SVH.fmt(v)+' m/s',
        '느리면 qvB↓ → 전기력 우세(1)',
        '(속도 선택기를 평행판으로 직접 구성한 판)' ] }; },
    hints:['E부터 계산.'] },
  { id:'u6-l3-08', level:3, type:'num', tags:['경사 도선'], src:'기출 유형',
    params:{ m:{choices:[50,100],unit:'g'}, L:{choices:[0.5,1],unit:'m'}, th:{choices:[15,30]}, B:{choices:[0.5,1],unit:'T'} },
    statement:function(p){ return '경사각 '+p.th+'° 마찰 없는 레일 위 도선(m='+p.m+' g, L='+p.L+' m), 연직 위 B='+p.B+' T. 미끄러지지 않게 하는 전류(A)는? (수평 힘 BIL)'; },
    solve:function(p){
      var I=p.m/1000*9.8*Math.tan(SVH.rad(p.th))/(p.B*p.L);
      return { ans:I, unit:'A', steps:[
        '경사면 평형: BILcosθ = mgsinθ',
        'I = mg tanθ/(BL) = '+SVH.fmt(I)+' A (연직 B → 수평 힘의 기하)' ] }; },
    hints:['경사면 성분 분해.'] },
  { id:'u6-l3-09', level:3, type:'num', tags:['홀 캐리어 판별'], src:'기출 유형',
    params:{ I:{choices:[2,5],unit:'mA'}, B:{choices:[0.5,1],unit:'T'}, VH:{choices:[5,10],unit:'mV'}, t:{choices:[0.2,0.5],unit:'mm'} },
    statement:function(p){ return '반도체 시편(t='+p.t+' mm)에서 I='+p.I+' mA·B='+p.B+' T에 V_H='+p.VH+' mV. (a) 캐리어 밀도 n(/m³) (b) 부호가 +로 측정되면 캐리어는? (전자=−1/양공=1)'; },
    solve:function(p){
      var n=p.I*1e-3*p.B/(1.602e-19*p.t*1e-3*p.VH*1e-3);
      return { ans:{n:n, carrier:1}, unit:{n:'/m³', carrier:''}, steps:[
        'n = IB/(etV_H) = '+SVH.fmt(n)+' /m³ (구리보다 ~10⁶ 작음)',
        '+ 부호 → 양공(1) — 홀이 반도체 물리의 문을 연 방식' ] }; },
    hints:['홀 식 역산.'] },
  { id:'u6-l3-10', level:3, type:'num', tags:['자기병 개념'], src:'창작 문제(검산됨)',
    params:{ th:{choices:[30,45]}, k:{choices:[4,9]} },
    constraint:function(p){ return Math.abs(Math.pow(Math.sin(SVH.rad(p.th)),2)-1/p.k)>0.01; }, /* 경계각 정확 일치 배제 */
    statement:function(p){ return '자기 거울: 피치각 '+p.th+'°로 들어간 입자가 장이 '+p.k+'배로 세지는 지점에서 반사되는가? sin²θ_m = B₀/B_max 기준으로 판정하라(반사=1/통과=0). 반사 한계각(°)도 구하라.'; },
    solve:function(p){
      var thm=SVH.deg(Math.asin(Math.sqrt(1/p.k)));
      var refl=p.th>thm?1:0;
      return { ans:{thm:thm, refl:refl}, unit:{thm:'°', refl:''}, steps:[
        '한계각: sinθ_m = 1/√'+p.k+' → θ_m = '+SVH.fmt(thm)+'°',
        'θ='+p.th+'° '+(refl?'>':'≤')+' θ_m → '+(refl?'반사(1)':'통과(0) — 손실 원뿔'),
        '(밴앨런대·핵융합 가둠의 원리, µ 불변량)' ] }; },
    hints:['각도 비교.'] },
  { id:'u6-l3-11', level:3, type:'num', tags:['두 입자 분리'], src:'기출 유형',
    params:{ B:{choices:[0.2,0.4],unit:'T'}, V:{choices:[1,2],unit:'kV'} },
    statement:function(p){ return '같은 '+p.V+' kV로 가속된 양성자와 알파(q=2e, m=4u)가 B='+p.B+' T에 입사. 반지름비 r_α/r_p = √(m_αq_p/m_pq_α)... 값을 구하라.'; },
    solve:function(p){
      var ratio=Math.sqrt(4*1.66e-27/(1.67e-27)*1/2);
      return { ans:ratio, unit:'', steps:[
        'r = √(2mV/q)/B → r_α/r_p = √[(m_α/m_p)(q_p/q_α)] = √(4×½)',
        '≈ '+SVH.fmt(ratio)+' (√2 — 같은 전압도 종마다 다른 원)' ] }; },
    hints:['비율로 소거.'] },
  { id:'u6-l3-12', level:3, type:'num', tags:['정사각 코일 안정성'], src:'창작 문제(검산됨)',
    params:{ I:{choices:[2,4],unit:'A'}, a:{choices:[5,10],unit:'cm'}, B:{choices:[0.3,0.6],unit:'T'}, th:{choices:[10,20]} },
    statement:function(p){ return '정사각 코일(변 a='+p.a+' cm, I='+p.I+' A)이 B='+p.B+' T에서 평형(µ∥B)으로부터 '+p.th+'° 틀어졌다. (a) 복원 토크(N·m) (b) 퍼텐셜에너지 증가(mJ)를 구하라.'; },
    solve:function(p){
      var mu=p.I*Math.pow(p.a/100,2);
      var tau=mu*p.B*Math.sin(SVH.rad(p.th));
      var dU=mu*p.B*(1-Math.cos(SVH.rad(p.th)))*1000;
      return { ans:{tau:tau, dU:dU}, unit:{tau:'N·m', dU:'mJ'}, steps:[
        'µ = Ia² = '+SVH.fmt(mu)+' A·m²',
        'τ = µBsinθ = '+SVH.fmt(tau)+' N·m (평형 복원 방향)',
        'ΔU = µB(1−cosθ) = '+SVH.fmt(dU)+' mJ' ] }; },
    hints:['U 기준점 θ=0.'] },
  { id:'u6-l3-13', level:3, type:'num', tags:['전자빔 지구자기 편향'], src:'기출 유형',
    params:{ V:{choices:[10,20],unit:'kV'}, L:{choices:[0.3,0.5],unit:'m'} },
    statement:function(p){ return 'CRT 전자('+p.V+' kV 가속)가 L='+p.L+' m 비행하는 동안 지구 자기장(5×10⁻⁵ T, 수직 성분)에 의해 휘는 변위(µm)를 근사(y≈L²/2r)로 구하라.'; },
    solve:function(p){
      var v=Math.sqrt(2*1.602e-19*p.V*1000/9.11e-31);
      var r=9.11e-31*v/(1.602e-19*5e-5);
      var y=p.L*p.L/(2*r)*1e6;
      return { ans:y, unit:'µm', steps:[
        'v = '+SVH.fmt(v)+' m/s → r = mv/eB = '+SVH.fmt(r)+' m (거대한 원)',
        'y ≈ L²/2r = '+SVH.fmt(y)+' µm',
        '(구형 TV가 방위에 민감했던 이유 — 오더 추정 문제)' ] }; },
    hints:['활꼴 근사.'] },
  { id:'u6-l3-14', level:3, type:'num', tags:['전류 천칭'], src:'기출 유형',
    params:{ L:{choices:[10,20],unit:'cm'}, m:{choices:[2,5],unit:'g'}, I:{choices:[10,20],unit:'A'} },
    statement:function(p){ return '전류 천칭: 수평 도선(L='+p.L+' cm, I='+p.I+' A)의 자기력이 질량 '+p.m+' g 추와 평형. (a) 필요한 B(T) (b) 전류 방향을 뒤집으면?'; },
    solve:function(p){
      var B=p.m/1000*9.8/(p.I*p.L/100);
      return { ans:{B:B, flip:-1}, unit:{B:'T', flip:'(힘 반전=−1)'}, steps:[
        'BIL = mg → B = mg/IL = '+SVH.fmt(B)+' T',
        '방향 반전 → 힘도 반전(−1): 천칭이 반대로 기움 (B 측정 실험의 원리)' ] }; },
    hints:['균형식 하나.'] },

  /* ---------- L4 (8) ---------- */
  { id:'u6-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'옳은 것을 모두 고르면?<br>㉠ 자기력은 운동에너지를 바꾸지 못한다<br>㉡ 사이클로트론 주기는 속력과 무관하다(비상대론)<br>㉢ 속도 선택기는 전하의 부호·크기와 무관하게 v=E/B를 선별한다<br>㉣ 균일 장 속 닫힌 전류 고리의 알짜힘은 0이지만 토크는 0이 아닐 수 있다',
    choices:['전부','㉠㉡㉢','㉡㉢㉣','㉠㉣'],
    answer:0, expl:'전부 참 — 네 명제가 U6 뼈대.' },
  { id:'u6-l4-02', level:4, type:'num', tags:['질량분석 완주'], src:'기출 유형',
    params:{ V:{choices:[1,3],unit:'kV'}, B:{choices:[0.3,0.6],unit:'T'}, dm:{choices:[1,2],unit:'u'} },
    statement:function(p){ return '질량분석기('+p.V+' kV, B='+p.B+' T)에서 질량 m=20u와 m+Δm(Δm='+p.dm+'u)의 이온(+e)이 검출판에 닿는 위치(=2r) 차이(mm)를 구하라.'; },
    solve:function(p){
      function r(mu){ var m=mu*1.66e-27;
        return Math.sqrt(2*m*1.602e-19*p.V*1000)/(1.602e-19*p.B); }
      var d=2*(r(20+p.dm)-r(20))*1000;
      return { ans:d, unit:'mm', steps:[
        'r = √(2mqV)/qB: r₂₀='+SVH.fmt(r(20)*1000)+' mm, r₂₀₊='+SVH.fmt(r(20+p.dm)*1000)+' mm',
        '위치차 = 2Δr = '+SVH.fmt(d)+' mm',
        '(mm 분해능이면 동위원소가 갈라진다 — 장비 사양 감각)' ] }; },
    hints:['2r 간격.'] },
  { id:'u6-l4-03', level:4, type:'derive', tags:['유도'], src:'강의자료 대조',
    statement:'홀 전압 \\(V_H=\\dfrac{IB}{nqt}\\)를 힘 평형에서 유도하고, 캐리어 부호 판별 논리를 서술하라.',
    steps:[
      '캐리어 유동: I = nqAv_d, A=wt [왜] 미시상과 연결',
      '자기력 qv_dB가 옆으로 밀어 전하 축적 → 횡전기장 E_H 생성',
      '평형: qE_H = qv_dB → V_H = E_Hw = v_dBw',
      'v_d = I/(nqwt) 대입 → \\(V_H = IB/(nqt)\\) — 폭 w 소거!',
      '부호: 같은 I 방향이라도 +캐리어와 −캐리어는 "같은 쪽"으로 밀린다(v 반대×q 반대) → 축적 부호가 반대 → V_H 부호로 판별. 극한 체크: n↑ ⇒ V_H↓ ✓ · 차원 [A][T]/([m⁻³][C][m]) = V ✓'
    ],
    hints:['횡 방향 평형이 핵심.','w가 사라지는 것 확인.'],
    expl:'유도+판별 논리 세트 — 서술형으로 딱 좋은 크기.' },
  { id:'u6-l4-04', level:4, type:'num', tags:['사이클로트론 설계'], src:'기출 유형',
    params:{ E:{choices:[10,20],unit:'MeV'}, B:{choices:[1.5,2],unit:'T'} },
    statement:function(p){ return '양성자를 '+p.E+' MeV까지 가속하는 사이클로트론(B='+p.B+' T): (a) 필요한 반지름(m) (b) RF 주파수(MHz) (c) 회전 횟수(디 간극 전압 50 kV, 1회전당 2회 가속)를 구하라.'; },
    solve:function(p){
      var KE=p.E*1e6*1.602e-19;
      var v=Math.sqrt(2*KE/1.67e-27);
      var R=1.67e-27*v/(1.602e-19*p.B);
      var f=1.602e-19*p.B/(2*Math.PI*1.67e-27)/1e6;
      var n=p.E*1e6/(2*50e3);
      return { ans:{R:R, f:f, n:n}, unit:{R:'m', f:'MHz', n:'회'}, steps:[
        'v = '+SVH.fmt(v)+' m/s → R = mv/qB = '+SVH.fmt(R)+' m',

  { id:'u6-l4-07', level:4, type:'num', tags:['임계 데이터 역산'], src:'기출 유형',

  { id:'u6-l4-08', level:4, type:'num', tags:['벨트 위 도선 종합'], src:'기출 유형',

});

      var B1=2e-7*p.I1/(p.r/100)*1e6, B2=2e-7*p.I2/(p.r/100)*1e6;
      return { ans:Math.hypot(B1,B2), unit:'µT', steps:[
        'B₁='+SVH.fmt(B1)+', B₂='+SVH.fmt(B2)+' µT (수직)',
        '합 = √(B₁²+B₂²) = '+SVH.fmt(Math.hypot(B1,B2))+' µT' ] }; },
    hints:['피타고라스.'] },

  /* ---------- L3 (14) ---------- */
  { id:'u7-l3-01', level:3, type:'num', tags:['세 도선 힘'], src:'기출 유형',
    params:{ I:{choices:[10,20],unit:'A'}, d:{choices:[10,20],unit:'cm'} },
    statement:function(p){ return '같은 방향 I('+p.I+' A) 도선 셋이 간격 d='+p.d+' cm로 일렬. 가운데 도선이 받는 힘과, 왼쪽 끝 도선의 단위길이당 힘(mN/m)을 구하라.'; },
    solve:function(p){
      var F1=2e-7*p.I*p.I/(p.d/100)*1000;
      var Fend=F1+F1/2;
      return { ans:{Fmid:0, Fend:Fend}, unit:{Fmid:'mN/m', Fend:'mN/m'}, steps:[
        '가운데: 양쪽 인력 상쇄 → 0',
        '끝: 이웃(d)+먼 것(2d) = F+F/2 = '+SVH.fmt(Fend)+' mN/m (안쪽으로)' ] }; },
    hints:['거리별 합.'] },
  { id:'u7-l3-02', level:3, type:'num', tags:['B=0 지점'], src:'기출 유형',
    params:{ I1:{choices:[3,6],unit:'A'}, k:{choices:[2,3]}, d:{choices:[12,24],unit:'cm'} },
    statement:function(p){ return '반대 방향 I₁='+p.I1+' A와 I₂='+p.k+'I₁(간격 d='+p.d+' cm). B=0 지점은 어느 쪽 바깥, I₁에서 몇 cm인가?'; },
    solve:function(p){
      var x=p.d/(p.k-1);
      return { ans:x, unit:'cm', steps:[
        '반대 전류 → 사이에선 보강, 바깥(약한 I₁ 쪽)에서 상쇄 가능',
        'µ₀I₁/2πx = µ₀I₂/2π(x+d) → x = d/(k−1) = '+SVH.fmt(x)+' cm (I₁ 바깥쪽)' ] }; },
    hints:['방향 지도 먼저.'] },
  { id:'u7-l3-03', level:3, type:'num', tags:['정사각 중심'], src:'기출 유형',
    params:{ I:{choices:[5,10],unit:'A'}, a:{choices:[10,20],unit:'cm'} },
    statement:function(p){ return '한 변 a='+p.a+' cm 정사각 고리(I='+p.I+' A)의 중심 B=2√2µ₀I/πa(µT)를 구하라.'; },
    solve:function(p){
      var B=2*Math.SQRT2*4e-7*Math.PI*p.I/(Math.PI*p.a/100)*1e6;
      return { ans:B, unit:'µT', steps:[
        '유한 직선 4개(각 45°~135° 기여) 합 = 2√2µ₀I/πa',
        '= '+SVH.fmt(B)+' µT (같은 둘레 원보다 '+SVH.fmt(B/(4e-7*Math.PI*p.I/(2*(2*p.a/100/Math.PI))*1e6))+'배)' ] }; },
    hints:['유한 도선 공식×4.'] },
  { id:'u7-l3-04', level:3, type:'num', tags:['동축 케이블 전역'], src:'기출 유형',
    params:{ I:{choices:[5,10],unit:'A'}, a:{choices:[1],unit:'mm'}, b:{choices:[3],unit:'mm'}, c:{choices:[4],unit:'mm'} },
    statement:function(p){ return '동축(심 a='+p.a+' mm, 외피 안 b='+p.b+'·밖 c='+p.c+' mm, 왕복 I='+p.I+' A): (a) 사이 r=2 mm의 B(mT) (b) 바깥(r>c)의 B를 구하라.'; },
    solve:function(p){
      var B=2e-7*p.I/(2e-3)*1000;
      return { ans:{B:B, Bout:0}, unit:{B:'mT', Bout:'mT'}, steps:[
        '사이: 심 전류만 감김 → B = µ₀I/2πr = '+SVH.fmt(B)+' mT',
        '밖: I_enc = I−I = 0 → B=0 (동축이 EMI를 가두는 이유)' ] }; },
    hints:['I_enc 부호 합.'] },
  { id:'u7-l3-05', level:3, type:'num', tags:['헬름홀츠'], src:'교재 표준',
    params:{ N:{choices:[100,200]}, I:{choices:[1,2],unit:'A'}, R:{choices:[10,20],unit:'cm'} },
    statement:function(p){ return '헬름홀츠 코일(N='+p.N+', R='+p.R+' cm, 간격=R, I='+p.I+' A) 중앙의 \\(B=(4/5)^{3/2}\\mu_0NI/R\\)(mT)를 구하라.'; },
    solve:function(p){
      var B=Math.pow(0.8,1.5)*4e-7*Math.PI*p.N*p.I/(p.R/100)*1000;
      return { ans:B, unit:'mT', steps:[
        'B = 0.7155·µ₀NI/R = '+SVH.fmt(B)+' mT',
        '(간격=R에서 B″=0 → 중앙이 판판하게 균일 — 실험실 표준 장치)' ] }; },
    hints:['(4/5)^{3/2}≈0.716.'] },
  { id:'u7-l3-06', level:3, type:'num', tags:['직사각 고리-도선 힘'], src:'기출 유형',
    params:{ I1:{choices:[10,20],unit:'A'}, I2:{choices:[2,5],unit:'A'}, a:{choices:[2,4],unit:'cm'}, b:{choices:[6,10],unit:'cm'}, L:{choices:[10,20],unit:'cm'} },
    statement:function(p){ return '무한 도선(I₁='+p.I1+' A) 옆 a='+p.a+' cm에 평행 변(길이 L='+p.L+' cm)이 오는 직사각 고리(I₂='+p.I2+' A, 먼 변까지 b='+p.b+' cm). 알짜힘(µN)과 방향(도선 쪽=1)을 구하라. (가까운 변 전류가 I₁과 같은 방향)'; },
    solve:function(p){
      var F=2e-7*p.I1*p.I2*p.L/100*(1/(p.a/100)-1/(p.b/100))*1e6;
      return { ans:{F:F, dir:1}, unit:{F:'µN', dir:''}, steps:[
        '가까운 변 인력 − 먼 변 척력: F = (µ₀I₁I₂L/2π)(1/a−1/b)',
        '= '+SVH.fmt(F)+' µN, 도선 쪽(1) (수직 변의 힘은 상쇄)',
        '(비균일 장 → 알짜힘 — 균일 장 0과 대비)' ] }; },
    hints:['두 평행 변만 살아남는다.'] },
  { id:'u7-l3-07', level:3, type:'num', tags:['자기장 안 자기장'], src:'기출 유형',
    params:{ n:{choices:[1000,2000],unit:'회/m'}, I:{choices:[2,4],unit:'A'}, v:{choices:[1,2],unit:'×10⁶ m/s'} },
    statement:function(p){ return '솔레노이드(n='+p.n+', I='+p.I+' A) 안에서 전자가 축에 수직 v='+p.v+'×10⁶ m/s로 움직인다. 원운동 반지름(mm)은?'; },
    solve:function(p){
      var B=4e-7*Math.PI*p.n*p.I;
      var r=9.11e-31*p.v*1e6/(1.602e-19*B)*1000;
      return { ans:r, unit:'mm', steps:[
        'B = µ₀nI = '+SVH.fmt(B*1000)+' mT',
        'r = mv/eB = '+SVH.fmt(r)+' mm (U6×U7 결합 — 장을 만들고 그 안에서 돌리기)' ] }; },
    hints:['두 단원 직결.'] },
  { id:'u7-l3-08', level:3, type:'num', tags:['지자기 상쇄'], src:'기출 유형',
    params:{ Be:{choices:[30,50],unit:'µT'}, R:{choices:[20,40],unit:'cm'}, N:{choices:[10,20]} },
    statement:function(p){ return '수평 지자기 '+p.Be+' µT를 중심에서 상쇄하려는 코일(N='+p.N+', R='+p.R+' cm)의 전류(A)와 코일 면의 방향(자기북 향함=1)을 구하라.'; },
    solve:function(p){
      var I=p.Be*1e-6*2*(p.R/100)/(4e-7*Math.PI*p.N);
      return { ans:{I:I, dir:1}, unit:{I:'A', dir:''}, steps:[
        'µ₀NI/2R = B_e → I = 2RB_e/µ₀N = '+SVH.fmt(I)+' A',
        '코일 축이 지자기와 반평행 장을 만들도록(면은 북향, 1)',
        '(자기 실험의 영점 잡기 — 실측 보정 감각)' ] }; },
    hints:['고리 중심 공식 역산.'] },
  { id:'u7-l3-09', level:3, type:'num', tags:['시트 전류'], src:'교재 표준',
    params:{ K:{choices:[100,500],unit:'A/m'} },
    statement:function(p){ return '무한 전류 시트(면전류밀도 K='+p.K+' A/m)의 양쪽 B=µ₀K/2(µT)를 구하라. 전기의 무엇과 대응하는가?'; },
    solve:function(p){ var B=4e-7*Math.PI*p.K/2*1e6;
      return { ans:B, unit:'µT', steps:[
        '앙페르 직사각 고리: 2BL = µ₀KL → B = µ₀K/2 = '+SVH.fmt(B)+' µT',
        '(σ/2ε₀의 자기 판 — 거리 무관, 방향은 시트에 평행)' ] }; },
    hints:['필박스 대신 직사각.'] },
  { id:'u7-l3-10', level:3, type:'num', tags:['원운동 전류의 B'], src:'기출 유형',
    params:{ v:{choices:[2.19],unit:'×10⁶ m/s'}, r:{choices:[0.0529],unit:'nm'} },
    statement:function(p){ return '보어 수소: 전자(v='+p.v+'×10⁶ m/s, r='+p.r+' nm)의 궤도 운동이 핵 위치에 만드는 (a) 등가 전류(mA) (b) B(T)를 구하라.'; },
    solve:function(p){
      var T=2*Math.PI*p.r*1e-9/(p.v*1e6);
      var I=1.602e-19/T*1000;
      var B=4e-7*Math.PI*I/1000/(2*p.r*1e-9);
      return { ans:{I:I, B:B}, unit:{I:'mA', B:'T'}, steps:[
        'I = e/T = ev/2πr = '+SVH.fmt(I)+' mA (원자 하나가 mA!)',
        'B = µ₀I/2r = '+SVH.fmt(B)+' T (~12 T — 원자 내부는 강자장 세계)' ] }; },
    hints:['주기→전류.'] },
  { id:'u7-l3-11', level:3, type:'num', tags:['유한 직선'], src:'교재 표준',
    params:{ I:{choices:[10,20],unit:'A'}, L:{choices:[20,40],unit:'cm'}, d:{choices:[5,10],unit:'cm'} },
    statement:function(p){ return '길이 L='+p.L+' cm 유한 직선(I='+p.I+' A)의 수직이등분선 위 d='+p.d+' cm에서 \\(B=\\dfrac{\\mu_0I}{2\\pi d}\\cdot\\dfrac{L}{\\sqrt{L^2+4d^2}}\\)(µT)를 구하라.'; },
    solve:function(p){
      var L=p.L/100, d=p.d/100;
      var B=2e-7*p.I/d*L/Math.sqrt(L*L+4*d*d)*1e6;
      return { ans:B, unit:'µT', steps:[
        '비오-사바르 적분 결과 대입 = '+SVH.fmt(B)+' µT',
        '극한: L→∞ ⇒ µ₀I/2πd ✓ (무한 공식 회수)' ] }; },
    hints:['각도인자 = sinθ.'] },
  { id:'u7-l3-12', level:3, type:'num', tags:['속 빈 도체 내강'], src:'기출 유형',
    params:{ I:{choices:[20,40],unit:'A'}, R:{choices:[5],unit:'mm'}, r:{choices:[2],unit:'mm'} },
    statement:function(p){ return '균일 전류 원통(R='+p.R+' mm, I='+p.I+' A)에 축과 나란한 원통 구멍(반지름 '+p.r+' mm, 중심 간 거리 2.5 mm)이 있다. 구멍 내부의 B가 균일함을 이용해 크기(mT)를 구하라: B=µ₀Jd/2 (J=전류밀도, d=축간 거리).'; },
    solve:function(p){
      var A=Math.PI*(Math.pow(p.R*1e-3,2)-Math.pow(p.r*1e-3,2));
      var J=p.I/A;
      var B=4e-7*Math.PI*J*2.5e-3/2*1000;
      return { ans:B, unit:'mT', steps:[
        'J = I/(πR²−πr²) = '+SVH.fmt(J)+' A/m²',
        '중첩(꽉 참 + 역방향 작은 원통): 구멍 안 B = µ₀Jd/2 = '+SVH.fmt(B)+' mT (균일!)',
        '(U2-l3-13 공동 전기장의 자기 판 — 같은 수학)' ] }; },
    hints:['결손 중첩 재등장.'] },
  { id:'u7-l3-13', level:3, type:'num', tags:['MRI 오더'], src:'창작 문제(검산됨)',
    params:{ B:{choices:[1.5,3],unit:'T'}, R:{choices:[30],unit:'cm'}, n:{choices:[2000],unit:'회/m'} },
    statement:function(p){ return 'MRI급 B='+p.B+' T를 n='+p.n+' 회/m 솔레노이드로: (a) 필요한 전류(A) (b) 구리 코일이면 왜 곤란한가(전류 크기로 답). 초전도의 필요성을 논하라.'; },
    solve:function(p){
      var I=p.B/(4e-7*Math.PI*p.n);
      return { ans:I, unit:'A', steps:[
        'I = B/µ₀n = '+SVH.fmt(I)+' A',
        '수백 A를 상시 → 구리면 I²R 열로 녹는다 → 초전도(R=0) 채택',
        '(장비 스펙을 물리로 읽기)' ] }; },
    hints:['µ₀n으로 나누기.'] },
  { id:'u7-l3-14', level:3, type:'num', tags:['레일건 힘'], src:'기출 유형',
    params:{ I:{choices:[1000,5000],unit:'A'}, d:{choices:[2,5],unit:'cm'} },
    statement:function(p){ return '레일 간격 d='+p.d+' cm, 전류 I='+p.I+' A인 레일건에서 발사체가 받는 힘 근사 F≈(µ₀I²/2π)ln(정수)... 간단 모형 F=BId (B=레일 사이 유효장 µ₀I/2πd×2 근사)로 크기(N)를 구하라.'; },
    solve:function(p){
      var B=2*2e-7*p.I/(p.d/100);
      var F=B*p.I*(p.d/100);
      return { ans:F, unit:'N', steps:[
        'B_유효 ≈ 2·µ₀I/2πd = '+SVH.fmt(B*1000)+' mT',
        'F = BId = µ₀I²/π = '+SVH.fmt(F)+' N (모형 의존이지만 I² 스케일이 요점)',
        '(I²에 비례 — 대전류의 세계)' ] }; },
    hints:['I² 스케일 확인.'] },

  /* ---------- L4 (8) ---------- */
  { id:'u7-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'옳은 것을 모두 고르면?<br>㉠ 앙페르 법칙의 I_enc는 고리를 "경계로 하는 임의 면"을 지나는 전류다<br>㉡ 솔레노이드 내부 B는 위치·굵기와 거의 무관하게 µ₀nI다<br>㉢ 같은 방향 평행 전류는 당긴다<br>㉣ ∮B·dA=0은 자기 홀극 부재를 뜻한다',
    choices:['전부','㉠㉡㉢','㉡㉢㉣','㉠㉣'],
    answer:0, expl:'전부 참. ㉠의 "임의 면"이 기말 변위전류 논쟁(축전기 사이 면)의 복선이다.' },
  { id:'u7-l4-02', level:4, type:'num', tags:['자기 저울 완주'], src:'기출 유형',
    params:{ I1:{choices:[50,100],unit:'A'}, lam:{choices:[5,10],unit:'g/m'}, d0:{choices:[1,2],unit:'cm'} },
    statement:function(p){ return '고정 도선(I₁='+p.I1+' A) 위 d='+p.d0+' cm에 같은 방향 전류의 가벼운 도선(λ='+p.lam+' g/m)이 자기 인력...아니 척력으로 떠 있으려면 위 도선 전류가 반대 방향이어야 한다. (a) 필요한 I₂(A) (b) 평형의 안정성(수직 방향 안정=1)을 구하라.'; },
    solve:function(p){
      var I2=p.lam/1000*9.8*2*Math.PI*(p.d0/100)/(4e-7*Math.PI*p.I1);
      return { ans:{I2:I2, st:1}, unit:{I2:'A', st:''}, steps:[
        'µ₀I₁I₂/2πd = λg → I₂ = '+SVH.fmt(I2)+' A (반대 방향, 척력 부양)',
        '수직: 가까워지면 척력↑ → 복원 → 안정(1) (수평은 불안정 — 가이드 필요)',
        '(자기 부상의 평형 분석)' ] }; },
    hints:['힘 균형+미소 변위.'] },
  { id:'u7-l4-03', level:4, type:'derive', tags:['유도'], src:'강의자료 대조',
    statement:'앙페르 법칙으로 이상 솔레노이드 내부 \\(B=\\mu_0nI\\)를 유도하라(외부 B≈0 논증 포함).',
    steps:[
      '대칭: 내부 B는 축에 평행·균일 후보, 외부는 "먼 곳에서 0"이어야 함 [왜] 무한 솔레노이드의 병진 대칭',
      '직사각 앙페르 고리(한 변 내부 L, 한 변 외부): \\(\\oint\\vec B\\cdot d\\vec l=B_{in}L-B_{out}L\\) (수직 변 기여 0)',
      '감긴 전류: I_enc = nLI',
      '외부 변을 아무리 멀리 놓아도 식이 같아야 → B_out은 위치 무관 → 0일 수밖에. 따라서 \\(B_{in}=\\mu_0nI\\)',
      '극한 체크: n↑, I↑ 비례 ✓ · 유한 솔레노이드 끝단은 절반(µ₀nI/2) — 실물 보정. 차원: [T·m/A][1/m][A]=[T] ✓'
    ],
    hints:['수직 변이 죽고 평행 변만 남는 고리.','외부 0의 논증이 점수 포인트.'],
    expl:'가우스의 "필박스"에 대응하는 앙페르의 "직사각" — 시험 유도 1순위.' },
  { id:'u7-l4-04', level:4, type:'num', tags:['3도선 정삼각'], src:'기출 유형',
    params:{ I:{choices:[10,20],unit:'A'}, a:{choices:[10,20],unit:'cm'} },
    statement:function(p){ return '정삼각형 꼭짓점의 평행 도선 3개(모두 같은 방향 I='+p.I+' A, 변 a='+p.a+' cm): 한 도선이 받는 단위길이당 합력(mN/m)과 방향(중심 향함=1)을 구하라.'; },
    solve:function(p){
      var F1=2e-7*p.I*p.I/(p.a/100)*1000;
      var F=F1*Math.sqrt(3);
      return { ans:{F:F, dir:1}, unit:{F:'mN/m', dir:''}, steps:[
        '이웃 두 인력, 각 '+SVH.fmt(F1)+' mN/m, 사이각 60°',

    hints:['벡터합 60°.'] },
  { id:'u7-l4-05', level:4, type:'num', tags:['비균일 J 앙페르'], src:'기출 유형',
    params:{ J0:{choices:[100,200],unit:'A/m²'}, R:{choices:[2,4],unit:'cm'} },
    statement:function(p){ return 'J(r)=J₀(r/R) (J₀='+p.J0+' A/m², R='+p.R+' cm)인 도선: (a) 총 전류(mA) (b) 표면에서 B(µT) (c) 내부 B(r)∝r² 확인 — r=R/2의 B(µT)를 구하라.'; },
    solve:function(p){
      var R=p.R/100;
      var I=2*Math.PI*p.J0*R*R/3;
      var Bs=2e-7*I/R*1e6;
      var Bh=Bs/4; // I_enc ∝ r³ → B ∝ r² → (1/2)²
      return { ans:{I:I*1000, Bs:Bs, Bh:Bh}, unit:{I:'mA', Bs:'µT', Bh:'µT'}, steps:[
        'I = ∫J·2πr dr = 2πJ₀R²/3 = '+SVH.fmt(I*1000)+' mA',
        '표면: B = µ₀I/2πR = '+SVH.fmt(Bs)+' µT',
        'I_enc∝r³ → B = µ₀I r²/2πR³ → r=R/2: '+SVH.fmt(Bh)+' µT (∝r² 확인)' ] }; },
    hints:['적분→앙페르 2회.'] },
  { id:'u7-l4-06', level:4, type:'num', tags:['헬름홀츠+입자'], src:'기출 유형',
    params:{ N:{choices:[100],unit:''}, R:{choices:[15,20],unit:'cm'}, V:{choices:[100,200],unit:'V'}, rbeam:{choices:[5,8],unit:'cm'} },
    statement:function(p){ return 'e/m 실험: 헬름홀츠(N='+p.N+', R='+p.R+' cm)로 '+p.V+' V 가속 전자를 r='+p.rbeam+' cm 원으로 만들려면 코일 전류(A)는?'; },
    solve:function(p){
      var v=Math.sqrt(2*1.602e-19*p.V/9.11e-31);
      var B=9.11e-31*v/(1.602e-19*p.rbeam/100);
      var I=B*(p.R/100)/(Math.pow(0.8,1.5)*4e-7*Math.PI*p.N);
      return { ans:I, unit:'A', steps:[
        'v = '+SVH.fmt(v)+' m/s → 필요 B = mv/er = '+SVH.fmt(B*1000)+' mT',

        '(학부 e/m 실험 장치의 설계 계산 전체)' ] }; },

  { id:'u7-l4-07', level:4, type:'num', tags:['지구 자기 모멘트'], src:'창작 문제(검산됨)',
    params:{ B:{choices:[30,60],unit:'µT'} },

<script>
window.SV_CONTENT = {"u1": {"concept": "\n<p class=\"easy\"><b>⚡ 한 줄</b> — 쿨롱 법칙(힘)에서 전기장(공간의 성질)으로 관점을 옮기는 단원. \\(\\vec E=\\vec F/q_0\\) 하나로 \"원격 작용\"이 \"국소 작용\"이 된다 — 이 과목 부제의 첫걸음.</p>\n<h4>1. 전하</h4>\n<p>보존·양자화(e=1.602×10⁻¹⁹ C)·두 부호. 쿨롱 법칙 \\(F=k|q_1q_2|/r^2\\), k=8.99×10⁹ N·m²/C² = 1/(4πε₀). 중력과 같은 역제곱이지만 10³⁹배 강하다(수소 원자 계산으로 체감).</p><div class=\"jsbox\"><span class=\"jt\">정석 1.1</span>계산 문제의 사망 원인 1위는 물리학이 아니라 단위다: µC=10⁻⁶, nC=10⁻⁹, cm→m. 대입 전에 SI로 통일하는 한 줄을 반드시 쓴다.</div><h4>2. 전기장</h4>\n<p>점전하 \\(E=kq/r^2\\) (방향: +에서 밖으로). <b>중첩 = 벡터 합</b> — 대칭으로 상쇄되는 성분을 먼저 지우는 것이 기술의 전부다. 장선: +에서 −로, 교차 금지, 밀도=세기.</p><div class=\"jsbox\"><span class=\"jt\">정석 1.2</span>연속·다전하 배치의 정석 4박자: ① 조각(전하)의 dE 방향 화살표 ② 대칭 상쇄 성분 삭제 ③ 남는 성분만 합/적분 ④ 극한(멀리서 점전하?)으로 검산. 링·결손 문제 전부 이 틀이다.</div><h4>3. 쌍극자와 장 속 운동</h4>\n<ul>\n<li>쌍극자 \\(\\vec p=q\\vec d\\)(−→+): 균일 장에서 힘 0·토크 \\(\\vec p\\times\\vec E\\), 에너지 \\(-\\vec p\\cdot\\vec E\\). 축상 원거리 \\(E\\approx2kp/z^3\\).</li>\n<li>장 속 전하: \\(a=qE/m\\) 등가속 — 투사체 운동과 동형(편향판·밀리컨·CRT).</li>\n</ul>", "derive": [{"title": "링 축상 전기장 (연속 분포의 원형)", "steps": ["조각 dq의 장 \\(dE=k\\,dq/(z^2+R^2)\\) — 모든 조각이 같은 거리 [왜] 링 대칭의 선물", "수평 성분 짝 상쇄 → 축 성분만: \\(dE_z=dE\\cdot z/\\sqrt{z^2+R^2}\\)", "\\(E=kQz/(z^2+R^2)^{3/2}\\) — 적분은 ∫dq=Q뿐", "최대점: dE/dz=0 → z=R/√2", "극한 체크: z≫R ⇒ kQ/z² ✓ · z=0 ⇒ 0 ✓ · 차원 [N/C] ✓"]}, {"title": "쌍극자 원거리 1/z³ (이항 전개)", "steps": ["축상: \\(E=kq[(z-d/2)^{-2}-(z+d/2)^{-2}]\\)", "이항 전개: \\((1\\mp d/2z)^{-2}\\approx1\\pm d/z\\)", "차: \\(E\\approx kq\\cdot2d/z^3=2kp/z^3\\) — 단극(1/r²)보다 빨리 죽는다", "일반각 공식 \\(V=kp\\cos\\theta/r^2\\)의 미분으로도 동일(U3)", "극한 체크: d→0(p 고정) ⇒ 유한 ✓ · 차원 [C·m]/[m³] ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 1-1</span>정삼각형(변 10 cm) 두 꼭짓점에 +2 µC. 나머지 꼭짓점의 장은?</div><div class=\"xsol\"><b>풀이</b><ol><li>각 장 E₁=kq/a²=1.8×10⁶ N/C, 사이각 60°.</li><li>합 = 2E₁cos30° = √3E₁ = <b>3.1×10⁶ N/C</b> (이등분선 방향).</li><li>대칭 성분 삭제가 계산을 반으로 줄인다.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u1-l2-12 · u1-l3-01 · u1-l4-08</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 1-2</span>실 2개에 매달린 10 g 대전구 쌍이 각각 5° 벌어졌다(실 50 cm). q는?</div><div class=\"xsol\"><b>풀이</b><ol><li>r=2Lsin5°=8.7 cm.</li><li>F=mg tan5°=8.6×10⁻³ N.</li><li>q=√(Fr²/k)=<b>85 nC</b> — 역학 평형+쿨롱 결합의 표준.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u1-l3-02 · u1-l2-08 · u1-l3-12</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 1-3</span>전자가 1000 N/C 편향판(길이 4 cm)을 2×10⁶ m/s로 통과. 출구 변위는?</div><div class=\"xsol\"><b>풀이</b><ol><li>a=eE/m=1.76×10¹⁴ m/s².</li><li>t=L/v=2×10⁻⁸ s.</li><li>y=½at²=<b>3.5 cm</b> — 투사체와 완전 동형.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u1-l2-11 · u1-l4-06 · u1-l3-09</div></div>"}, "u2": {"concept": "\n<p class=\"easy\"><b>⚡ 한 줄</b> — 가우스 법칙 \\(\\oint\\vec E\\cdot d\\vec A=q_{enc}/\\varepsilon_0\\)은 항상 참이지만, \"계산 도구\"가 되는 것은 대칭이 있을 때다. 대칭 3종(구·원통·평면)과 도체 성질이 이 단원의 전부.</p>\n<h4>1. 선속과 법칙</h4>\n<p>Φ=EAcosθ(\"장선 세기\"). 닫힌 면: 밖의 전하는 무기여(들어온 만큼 나감). 분배 논법: 중심 전하는 면당 1/6, 꼭짓점 전하는 1/8 — 적분 없이 대칭으로.</p><div class=\"jsbox\"><span class=\"jt\">정석 2.1</span>대칭-가우스면 짝: 구대칭→동심구면(E·4πr²) · 선대칭→동축원통(E·2πrL) · 면대칭→필박스(E·2A 또는 도체는 E·A). 면 위에서 E가 일정·수직이 되게 — 그래야 적분이 곱셈이 된다.</div><h4>2. 표준 결과 (암기 대상)</h4>\n<ul>\n<li>점/구 밖: kq/r² · 균일 구 안: kQr/R³ (∝r) · 구각 안: 0</li>\n<li>무한 선: λ/2πε₀r (∝1/r) · 무한 면: σ/2ε₀ (거리 무관) · 도체 표면: σ/ε₀</li>\n<li>평행판 사이: σ/ε₀, 밖: 0</li>\n</ul>\n<h4>3. 도체의 3성질</h4>\n<p>내부 E=0 → 전하는 표면 → 표면장 σ/ε₀ 수직. 공동 속 전하 q는 벽에 −q 유도·밖에 +q — 밖에서는 총량만 보인다(차폐).</p><div class=\"jsbox\"><span class=\"jt\">정석 2.2</span>결손법: 구멍·공동은 \"음의 전하 분포를 겹친 것\"으로. 구멍 뚫린 평면 = 평면 − 원판, 편심 공동 = 큰 구 − 작은 구(내부 균일장 ρd/3ε₀). 중첩이 적분을 대체한다.</div>", "derive": [{"title": "균일 구 내부/외부 장", "steps": ["밖(r>R): 동심구면, q_enc=Q → \\(E\\cdot4\\pi r^2=Q/\\varepsilon_0\\) → kQ/r²", "안(r<R): q_enc=Q(r/R)³ [왜] 균일 밀도의 부피비", "→ \\(E=kQr/R^3\\) — 중심 0, 표면 최대", "표면에서 두 식 연속 ✓ (전하 밀도 유한이면 E 연속)", "극한 체크: R→0 ⇒ 점전하 ✓ · 차원 ✓ — 그래프(∝r → ∝1/r²)를 그릴 수 있어야"]}, {"title": "도체 3성질의 연쇄 유도", "steps": ["평형 정의: 내부 자유전하 정지 → 내부 E=0 [왜] E≠0이면 전류=비평형", "내부 임의 가우스면: Φ=0 → q_enc=0 → 과잉 전하는 전부 표면", "표면 평행 E 성분 → 표면 전류 → 모순 → E는 수직", "필박스(한 면이 도체 안): EA=σA/ε₀ → E=σ/ε₀ (무한판의 2배인 이유: 안쪽 면 선속 0)", "극한 체크: σ→0 ⇒ E→0 ✓ — 서술형 최빈출 사슬"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 2-1</span>중심 +q=2 µC, 중성 도체 구각. 구각 안팎 표면 전하와 밖 r=30 cm의 E는?</div><div class=\"xsol\"><b>풀이</b><ol><li>안쪽 −2 µC(도체 내 가우스면), 바깥 +2 µC(중성).</li><li>밖: 전체 q_enc=2 µC → E=kq/r²=<b>2.0×10⁵ N/C</b>.</li><li>구각에 +Q를 더 주면 전부 바깥 표면으로.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u2-l3-02 · u2-l3-08 · u2-l4-02</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 2-2</span>무한 평면 σ=4 µC/m²에 반지름 5 cm 구멍. 축상 5 cm의 E는?</div><div class=\"xsol\"><b>풀이</b><ol><li>평면 − 원판(결손법).</li><li>E=(σ/2ε₀)·z/√(z²+R²)=2.26×10⁵×0.707=<b>1.6×10⁵ N/C</b>.</li><li>극한: 구멍 멀리 → 평면값, 중심 → 0 ✓.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u2-l3-11 · u2-l3-09 · u1-l3-11</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 2-3</span>ρ(r)=ar(a=2 µC/m⁴)인 구(R=10 cm)의 총 전하와 내부 장은?</div><div class=\"xsol\"><b>풀이</b><ol><li>Q=∫ar·4πr²dr=aπR⁴=<b>6.3×10⁻¹⁰ C</b>.</li><li>내부 E=ar²/4ε₀ — 부피비가 아니라 적분!</li><li>균일이 아니면 q_enc(r)를 매번 적분하는 것이 정석.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u2-l3-03 · u2-l4-04 · u2-l3-14</div></div>"}, "u3": {"concept": "\n<p class=\"easy\"><b>⚡ 한 줄</b> — 전위는 \"단위 전하의 에너지 지형도\"다. 스칼라라서 중첩이 산술합 — 그래서 복잡한 배치는 V부터 구하고 \\(E=-\\nabla V\\)로 내려가는 것이 왕도.</p>\n<h4>1. 정의와 계산</h4>\n<p>\\(V_b-V_a=-\\int_a^b\\vec E\\cdot d\\vec l\\) (장 방향=내리막). 점전하 V=kq/r(1/r!), 링 축상 kQ/√(z²+R²), 균일 구 내부 \\(kQ(3-r^2/R^2)/2R\\). 기준: 보통 무한대 0 (무한 분포는 불가 — 차이만).</p><div class=\"jsbox\"><span class=\"jt\">정석 3.1</span>V=0 ≠ E=0: 쌍극자 이등분면(V=0, E≠0), 두 +전하 중점(E=0, V≠0). 도체는 \"E=0 → V 일정(0 아님!)\" — 세 반례가 개념 문항의 단골 삼총사.</div><h4>2. 에너지</h4>\n<p>W=qΔV, 쌍 에너지 U=kq₁q₂/r, 조립 에너지=모든 쌍의 합. 전자볼트: 1 eV=1.602×10⁻¹⁹ J. 가속: eV=½mv². 도체구 연결 → 등전위 재분배(q∝R, σ∝1/R — 피뢰침).</p><div class=\"jsbox\"><span class=\"jt\">정석 3.2</span>에너지 보존이 최단 경로다: \"속력?\"이 보이면 힘·가속도 대신 qΔV=ΔKE 한 줄. 경로 무관(보존장)이 그 근거 — 최접근 거리·탈출 속도·가속 전자 전부 이 틀.</div><h4>3. E↔V 왕복</h4>\n<p>\\(E_x=-\\partial V/\\partial x\\): V(x,y) 주면 편미분, E 주면 선적분. 등전위면⊥장선, 간격 좁을수록 |E| 크다(지형도 독법).</p>", "derive": [{"title": "균일 구 내부 전위 (적분 잇기)", "steps": ["\\(V(R)=\\int_R^\\infty kQ/r^2dr=kQ/R\\)", "내부 장 E=kQr/R³ (U2) 이어 적분: \\(V(r)=kQ/R+\\int_r^R kQr'/R^3dr'\\)", "\\(V(r)=\\dfrac{kQ}{2R}(3-r^2/R^2)\\) — 중심 (3/2)kQ/R", "연속(r=R)·중심 기울기 0(E=0) 검산", "극한 체크: r=R ⇒ kQ/R ✓ · 차원 ✓ — 퀴즈1 저격 유도"]}, {"title": "V→E 미분 (링으로 검증)", "steps": ["링 V(z)=kQ(z²+R²)^{-1/2}", "\\(E_z=-dV/dz=kQz(z^2+R^2)^{-3/2}\\)", "U1의 벡터 적분 결과와 동일 — 스칼라 먼저가 이득인 증거", "일반화: E는 V가 가장 가파르게 감소하는 방향(-그래디언트)", "극한 체크: z=0 ⇒ 0 ✓ (V의 극대점=평평)"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 3-1</span>+3 µC와 −3 µC가 60 cm 떨어짐. 중점의 V와 E는?</div><div class=\"xsol\"><b>풀이</b><ol><li>V = kq/r − kq/r = <b>0</b>.</li><li>E = 2kq/(0.3)² = <b>6.0×10⁵ N/C</b> (+→− 방향).</li><li>V=0인데 E≠0 — 반례의 실물.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u3-l2-05 · u3-l1-03 · u3-l2-06</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 3-2</span>500 V로 가속된 전자의 속력은?</div><div class=\"xsol\"><b>풀이</b><ol><li>eV=½mv².</li><li>v=√(2eV/m)=<b>1.33×10⁷ m/s</b>.</li><li>c의 4% — kV대부터 상대론 보정 필요(기말 예고).</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u3-l2-03 · u3-l3-10 · u3-l3-06</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 3-3</span>5 MeV 알파 입자가 금핵(Z=79)에 정면 돌진. 최접근 거리는?</div><div class=\"xsol\"><b>풀이</b><ol><li>KE 전부 → 퍼텐셜: KE=k(2e)(79e)/d.</li><li>d=<b>45 fm</b>.</li><li>러더퍼드가 핵 크기를 잰 논리 그대로 — 에너지 보존 한 줄.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u3-l3-03 · u3-l3-02 · u3-l4-04</div></div>"}, "u4": {"concept": "\n<p class=\"easy\"><b>⚡ 한 줄</b> — C=Q/V는 기하만의 함수. 문제의 90%는 \"무엇이 고정인가(Q? V?)\"를 판정하는 데서 갈린다 — 전지 연결=V 고정, 분리=Q 고정.</p>\n<h4>1. 용량과 조합</h4>\n<p>평행판 ε₀A/d · 구 R/k · 원통 2πε₀L/ln(b/a). <b>병렬=합(V 공통), 직렬=역수합(Q 공통)</b> — 저항과 반대. 직렬에서 작은 C에 큰 V(내압 주의).</p><div class=\"jsbox\"><span class=\"jt\">정석 4.1</span>연결·재연결 문제의 헌법: 고립계에서 보존되는 것은 '전하'다(에너지 아님!). 재연결 → Q 보존으로 새 V → 에너지 차는 열·스파크. 반대로 전지 연결 유지면 V가 헌법이고 전지가 장부에 참여한다.</div><h4>2. 에너지</h4>\n<p>\\(U=Q^2/2C=\\tfrac12CV^2=\\tfrac12QV\\) — 고정된 변수로 골라 쓴다. 에너지 밀도 \\(u=\\tfrac12\\varepsilon_0E^2\\): 장 자체가 에너지 창고(EM파의 복선). 판 인력 F=½QE=Q²/2ε₀A(\"자기 장 제외\" ½).</p>\n<h4>3. 유전체</h4>\n<p>C→κC. V 고정: Q·U 모두 κ배↑(전지가 일). Q 고정: V·U 모두 1/κ↓(감소분=유전체를 당긴 일). 면적 분할=병렬, 두께 분할=직렬. 절연파괴장이 최소 두께를 정한다.</p>", "derive": [{"title": "에너지 밀도 u=½ε₀E²", "steps": ["U=½CV², C=ε₀A/d, V=Ed 대입", "U=½ε₀E²·(Ad) — 기하가 소거되고 '부피'가 남는다", "u=U/부피=½ε₀E² — 축전기가 아닌 '장'의 성질로 승격", "유전체 속: ½κε₀E²", "극한 체크: E=0⇒0 ✓ · 차원 [J/m³] ✓ — 장의 실재성 서사의 완성"]}, {"title": "충전 일 U=Q²/2C (왜 ½인가)", "steps": ["이미 q가 있을 때 dq를 나르는 일 dW=(q/C)dq [왜] 그 순간 전위가 q/C", "\\(W=\\int_0^Q q/C\\,dq=Q^2/2C\\)", "QV가 아니라 절반 — 처음 전하는 공짜, 마지막 전하가 제값", "전지 공급 QV와의 차 ½QV는 R 소산(U5에서 적분 증명)", "극한 체크: Q 2배 ⇒ U 4배 ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 4-1</span>C₁=3 µF(12 V 충전)를 떼어 중성 C₂=6 µF와 병렬. 공통 V와 손실은?</div><div class=\"xsol\"><b>풀이</b><ol><li>Q=36 µC 보존 → V=36/9=<b>4 V</b>.</li><li>U: 216 → 72 µJ, 손실 <b>144 µJ</b>(2/3!).</li><li>어디로? 도선 저항 열·전자기 복사 — R값 무관 총량.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u4-l3-01 · u4-l4-02 · u3-l4-08</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 4-2</span>전지(12 V) 연결 유지, C₀=4 µF에 κ=3 삽입. 장부를 완성하라.</div><div class=\"xsol\"><b>풀이</b><ol><li>Q: 48→144 µC(전지가 96 µC 공급).</li><li>전지 일=ΔQ·V=1152 µJ, ΔU=½ΔC·V²=576 µJ.</li><li>나머지 576 µJ = 유전체를 빨아들인 역학적 일 — 3자 수지.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u4-l2-09 · u4-l4-05 · u4-l3-12</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 4-3</span>두께 절반에만 κ=2를 채운 C₀=6 pF의 새 C는?</div><div class=\"xsol\"><b>풀이</b><ol><li>두께 분할=직렬: 2C₀와 2κC₀의 직렬.</li><li>C=2κC₀/(1+κ)=<b>8 pF</b>.</li><li>면적 절반이면 병렬로 (1+κ)C₀/2=9 pF — 두 경우를 반드시 구분.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u4-l3-03 · u4-l3-02 · u4-l4-06</div></div>"}, "u5": {"concept": "\n<p class=\"easy\"><b>⚡ 한 줄</b> — 전류의 미시상(느린 유동, 빠른 장)과 회로의 거시 법칙(옴·키르히호프·RC)을 잇는 단원. 전전개와 겹치지만 물리는 \"왜\"를 묻는다.</p>\n<h4>1. 미시상</h4>\n<p>\\(I=nqAv_d\\): v_d ~ 0.1 mm/s인데 전구는 즉시 — 장이 ~c로 전파. \\(R=\\rho L/A\\), 금속 ρ(T)=ρ₀[1+αΔT]. 드루드: ρ=m/(ne²τ).</p><div class=\"jsbox\"><span class=\"jt\">정석 5.1</span>정격의 함정: 전구 \"100 W/120 V\"는 그 전압일 때 이야기. R=V²/P → 작은 W=큰 R. 직렬로 이으면 I 공통 → P=I²R → 작은 W 전구가 더 밝다(역전!). 병렬이면 정격대로.</div><h4>2. 회로</h4>\n<p>단자 전압 V=ℰ−Ir(방전)/ℰ+Ir(충전). 정합(R=r)에서 P 최대·효율 50%. 전지 조합: R≫r 직렬, R≪r 병렬. 계측: 전압계 큰 R_V 병렬, 전류계 작은 R_A 직렬 — 부하 효과 정량까지.</p>\n<h4>3. RC</h4>\n<p>τ=RC. 충전 v=ℰ(1−e^{−t/τ}), i=(ℰ/R)e^{−t/τ}. <b>충전 효율은 R와 무관하게 50%</b>(적분 증명). 0⁺=단락, ∞=개방.</p><div class=\"jsbox\"><span class=\"jt\">정석 5.2</span>에너지 장부 반사신경: 전지 Qℰ = 저장 ½Qℰ + 소산 ½Qℰ. 재연결·유전체·RC — 4단원 연속으로 나온 \"절반의 법칙\"들은 전부 같은 적분 구조다.</div>", "derive": [{"title": "RC 충전 효율 50% (R 소거의 마법)", "steps": ["i=(ℰ/R)e^{−t/RC}", "\\(W_R=\\int_0^\\infty i^2R\\,dt=\\dfrac{\\mathcal{E}^2}{R}\\cdot\\dfrac{RC}{2}=\\tfrac12C\\mathcal{E}^2\\) — R 소거!", "전지: W=ℰQ=Cℰ² → 정확히 절반이 저장", "R는 '속도'만 정하고 '몫'은 못 바꾼다", "극한 체크: R→0 도 비율 불변 ✓ · 차원 ✓"]}, {"title": "유동속도의 오더 (미시-거시 연결)", "steps": ["I=nqAv_d에서 v_d=I/(nqA)", "구리 n=8.5×10²⁸/m³, 1 mm² 도선에 10 A: v_d≈0.7 mm/s", "신호는 장의 전파(~c) — 파이프에 이미 가득한 물의 비유", "n이 작은 반도체는 v_d 큼 → 홀 전압 큼(U6 복선)", "극한 체크: A↑ ⇒ v_d↓ ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 5-1</span>ℰ=12 V, r=1 Ω 전지에 R=5 Ω. 3종 세트를 구하라.</div><div class=\"xsol\"><b>풀이</b><ol><li>I=2 A.</li><li>V=12−2=<b>10 V</b>.</li><li>효율 = 10/12 = 83% (R에서 20 W, r에서 4 W).</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u5-l2-05 · u5-l3-03 · u5-l3-06</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 5-2</span>100 W와 40 W 전구(120 V 정격)를 직렬로 120 V에. 누가 밝은가?</div><div class=\"xsol\"><b>풀이</b><ol><li>R₁₀₀=144 Ω, R₄₀=360 Ω.</li><li>I=0.238 A → P₁₀₀=8.2 W, P₄₀=<b>20.4 W</b>.</li><li>40 W 승리 — 정격은 조건부라는 교훈.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u5-l3-02 · u5-l2-08 · u5-l4-06</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 5-3</span>RC 회로: ℰ-R₁-node, node에 R₂와 C. 3종 세트(0⁺·∞·τ)는?</div><div class=\"xsol\"><b>풀이</b><ol><li>0⁺: C 단락 → i_C=ℰ/R₁.</li><li>∞: C 개방 → v_C=분압.</li><li>τ=(R₁∥R₂)C — 전원 죽인 테브난 저항. 전전개 U6과 완전 동일 절차.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u5-l4-05 · u5-l2-10 · u5-l4-07</div></div>"}, "u6": {"concept": "\n<p class=\"easy\"><b>⚡ 한 줄</b> — \\(\\vec F=q\\vec v\\times\\vec B\\): 수직이라 일을 못 한다(속력 불변), 그래서 원을 그린다. 원운동 3종(r, T, f)과 응용 4종(선택기·질량분석·홀·모터)이 전부다.</p>\n<h4>1. 입자 운동</h4>\n<p>r=mv/qB, T=2πm/qB(속력 무관! — 사이클로트론), 비스듬하면 나선(피치=v∥T). 속도 선택기 v=E/B(부호·질량 무관), 질량분석 r∝√m(같은 가속 전압).</p><div class=\"jsbox\"><span class=\"jt\">정석 6.1</span>오른손 좌표 반사신경: v×B에서 +전하 기준, −전하는 반대. \"어느 쪽으로 휘나\"를 그림 없이 답하는 연습이 시험 시간을 벌어 준다. 지면 안(×)·밖(·) 기호 포함.</div><h4>2. 전류와 자기</h4>\n<p>도선 F=IL×B(균일 장 폐회로 알짜힘 0), 고리 토크 τ=µ×B, µ=NIA, U=−µ·B — 전기 쌍극자와 완전 평행. 홀 효과 V_H=IB/nqt: 캐리어 밀도·부호 측정기.</p><div class=\"jsbox\"><span class=\"jt\">정석 6.2</span>전기·자기 쌍둥이표를 만들라: p=qd↔µ=NIA, τ=p×E↔µ×B, U=−p·E↔−µ·B, 2kp/z³↔µ₀µ/2πz³. 한 쪽을 외우면 다른 쪽이 공짜다.</div>", "derive": [{"title": "원운동 반지름·주기 (등시성)", "steps": ["qvB = mv²/r [왜] 자기력이 구심력", "r = mv/qB — 빠를수록 큰 원", "T = 2πr/v = 2πm/qB — v 소거! 등시성", "f = qB/2πm: 사이클로트론이 고정 주파수 RF로 계속 가속하는 근거", "극한 체크: B↑ ⇒ 작은 원·빠른 회전 ✓ · 상대론에선 m↑로 깨짐(싱크로트론) — 한계까지"]}, {"title": "홀 전압 (폭이 사라지는 유도)", "steps": ["유동 캐리어에 qv_dB 횡력 → 가장자리 축적 → 횡장 E_H", "평형: qE_H=qv_dB → V_H=E_Hw=v_dBw", "v_d=I/nqwt 대입 → \\(V_H=IB/nqt\\) — w 소거", "부호: ±캐리어가 같은 쪽으로 밀림 → 축적 부호 반대 → 판별 가능", "극한 체크: n↑⇒V_H↓ ✓ (금속 µV, 반도체 mV)"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 6-1</span>2 kV로 가속된 전자가 B=0.5 T에 수직 입사. 반지름은?</div><div class=\"xsol\"><b>풀이</b><ol><li>v=√(2eV/m)=2.65×10⁷ m/s.</li><li>r=mv/eB=<b>0.30 mm</b>.</li><li>가속(U3)+회전(U6) 결합 — 최빈출 연결.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u6-l2-02 · u6-l3-01 · u6-l4-07</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 6-2</span>E=2×10⁵ V/m, B=0.4 T 속도 선택기 → 이후 B만 있는 영역에서 r 측정. e/m은?</div><div class=\"xsol\"><b>풀이</b><ol><li>v=E/B=5×10⁵ m/s.</li><li>e/m=v/(rB)=E/(rB²) — 톰슨 1897.</li><li>측정 3개(E, B, r)로 입자의 정체를 밝힌다.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u6-l3-02 · u6-l2-04 · u6-l3-11</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 6-3</span>코일(N=100, A=20 cm², I=1 A)이 B=0.5 T에서 받는 최대 토크는?</div><div class=\"xsol\"><b>풀이</b><ol><li>µ=NIA=0.2 A·m².</li><li>τ_max=µB=<b>0.1 N·m</b> (µ⊥B일 때).</li><li>정류자가 이 토크의 부호를 유지시키면 모터가 된다.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u6-l2-07 · u6-l4-05 · u6-l3-05</div></div>"}, "u7": {"concept": "\n<p class=\"easy\"><b>⚡ 한 줄</b> — 이제 전류가 장의 \"원인\"이 된다: 비오-사바르(일반)와 앙페르(대칭 지름길). 직선 1/r·고리 중심·솔레노이드 µ₀nI 세 결과 + 평행 도선 힘이면 중간범위 완성.</p>\n<h4>1. 표준 결과</h4>\n<ul>\n<li>무한 직선: \\(B=\\mu_0I/2\\pi r\\) (동심원, 오른손)</li>\n<li>고리 중심: µ₀NI/2R · 축상: µ₀IR²/2(z²+R²)^{3/2} · 원거리: 쌍극자 µ₀µ/2πz³</li>\n<li>솔레노이드 안: µ₀nI(균일)·밖 ≈0 · 토로이드: µ₀NI/2πr</li>\n<li>도선 내부(균일 J): ∝r · 시트: µ₀K/2</li>\n</ul><div class=\"jsbox\"><span class=\"jt\">정석 7.1</span>전기 대응표 2탄: λ/2πε₀r ↔ µ₀I/2πr, σ/2ε₀ ↔ µ₀K/2, 균일 구 내부 ∝r ↔ 도선 내부 ∝r. 가우스의 필박스 ↔ 앙페르의 직사각 고리. 구조가 같으니 유도도 병렬로 익힌다.</div><h4>2. 도선 사이 힘</h4>\n<p>\\(F/L=\\mu_0I_1I_2/2\\pi d\\) — 같은 방향 인력. \"장 만들기(한 도선) → 힘 받기(다른 도선)\" 2단 구성이 모든 상호작용 문제의 틀.</p><div class=\"jsbox\"><span class=\"jt\">정석 7.2</span>비오-사바르 즉살 판정: dl∥r̂이면 기여 0(직선 연장선), 원호는 중심에서 µ₀Iθ/4πR. 반원+직선 문제는 \"직선 0 + 반원 µ₀I/4R\"로 10초에 끝난다.</div><h4>3. 두 가우스 법칙</h4>\n<p>∮B·dA=0(홀극 없음 — 장선은 폐곡선) vs ∮E·dA=q/ε₀. 앙페르 I_enc의 \"임의 면\" 조건은 기말 변위전류의 복선.</p>", "derive": [{"title": "앙페르로 솔레노이드 µ₀nI", "steps": ["직사각 고리(내부 변 L, 외부 변): 수직 변 기여 0", "∮B·dl = B_in L − B_out L = µ₀(nL)I", "외부 변 위치를 옮겨도 같아야 → B_out 상수 → 무한 원방 0 → B_out=0", "B_in = µ₀nI — 내부 위치 무관(균일)", "극한 체크: 끝단은 절반 µ₀nI/2 · 차원 ✓ — 필박스 유도의 자기 판"]}, {"title": "평행 도선 힘 (2단 구성)", "steps": ["도선 1이 거리 d에 만드는 장: B=µ₀I₁/2πd", "그 속의 도선 2: F=I₂LB", "\\(F/L=\\mu_0I_1I_2/2\\pi d\\), 방향은 IL×B → 같은 방향 전류 인력", "1 A의 옛 정의(2×10⁻⁷ N/m)가 바로 이 식", "극한 체크: 반대 방향 ⇒ 척력 ✓ · d↑ ⇒ 약화 ✓"]}], "worked": "<div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 7-1</span>반대 방향 20 A 두 도선(간격 10 cm) 정중앙의 B는?</div><div class=\"xsol\"><b>풀이</b><ol><li>반대 전류 → 중앙에서 두 장이 같은 방향(보강).</li><li>B=2×(µ₀I/2π·0.05)=<b>160 µT</b>.</li><li>같은 방향이었다면 0 — 방향 지도가 먼저다.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u7-l2-05 · u7-l4-08 · u7-l3-02</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 7-2</span>반원(R=5 cm)+양쪽 직선 연장 도선에 8 A. 중심 B는?</div><div class=\"xsol\"><b>풀이</b><ol><li>직선 연장: dl∥r̂ → 기여 0.</li><li>반원 = 고리 절반: B=µ₀I/4R=<b>50 µT</b>.</li><li>외적 0 판정이 계산을 지운다.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u7-l2-11 · u7-l3-03 · u7-l3-11</div></div><div class=\"exbox\"><div class=\"xh\"><span class=\"xno\">필수예제 7-3</span>솔레노이드(n=2000/m, I=2 A) 안 전자가 축에 수직 10⁶ m/s. 반지름은?</div><div class=\"xsol\"><b>풀이</b><ol><li>B=µ₀nI=5.03 mT.</li><li>r=mv/eB=<b>1.1 mm</b>.</li><li>장 만들기(U7)→입자 돌리기(U6) — 중간 종합형의 정석.</li></ol></div><div class=\"xrel\">유제(리롤 가능) → u7-l3-07 · u7-l4-06 · u6-l2-02</div></div>"}};

<script>
(function(){
'use strict';
var APP='course-phys152', VP=Vault.progress(APP), VD=Vault.drill(APP), VM=Vault.meta(APP);
var UNITS=SV_BANK, BYID={}, ALL=[];
UNITS.forEach(function(u){ u.problems.forEach(function(p){ p._unit=u; BYID[p.id]=p; ALL.push(p); }); });
var LAYERS=['concept','derive','worked'], LAYER_KO={concept:'개념',derive:'수식·유도',worked:'풀이된 예제'};
var $=function(s,el){ return (el||document).querySelector(s); };
var esc=function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
function typeset(el){
  if(window.MathJax&&window.__mjready){ MathJax.typesetPromise([el]).catch(function(){}); }
  else { (window.__mjq=window.__mjq||[]).push(el); }
}

/* ---------- 파라미터 추출/리롤 (러너와 동일 규칙) ---------- */
function draw(spec){ 
  if(spec.choices) return spec.choices[Math.floor(Math.random()*spec.choices.length)];
  var steps=Math.round((spec.max-spec.min)/spec.step);
  return spec.min+spec.step*Math.floor(Math.random()*(steps+1));
}
function sample(prob){
  for(var t=0;t<500;t++){
    var p={}; for(var k in prob.params) p[k]=draw(prob.params[k]);
    if(!prob.constraint||prob.constraint(p)) return p;
  }
  return null;
}
var CUR={}; // 문제별 현재 파라미터
function statementOf(prob){
  if(!prob.params) return (typeof prob.statement==='function')?prob.statement({}):prob.statement;
  if(!CUR[prob.id]) CUR[prob.id]=sample(prob);
  return prob.statement(CUR[prob.id]);
}
function ansText(r){
  if(r==null) return '';
  var a=r.ans, u=r.unit;
  if(typeof a==='number') return SVH.fmt(a)+' '+(u||'');
  var parts=[]; for(var k in a){ parts.push(k+' = '+SVH.fmt(a[k])+' '+((u&&u[k])||'')); }
  return parts.join(' · ');
}

/* ---------- 진도 ---------- */
function readItems(){ var ids=[]; UNITS.forEach(function(u){ LAYERS.forEach(function(l){ ids.push(u.id+'-'+l); }); }); return ids; }
function refreshProg(){
  var ids=readItems(), n=0; ids.forEach(function(id){ if(VP.get(id)) n++; });
  $('#pbar').style.width=Math.round(n/ids.length*100)+'%';
  $('#ptxt').textContent='읽음 '+n+' / '+ids.length+' · 문제 '+VD.counts().total+'/'+ALL.length;
  document.querySelectorAll('.readbtn[data-read]').forEach(function(b){
    var on=VP.get(b.getAttribute('data-read'));
    b.setAttribute('aria-pressed',on?'true':'false');
    b.textContent=on?'✓ 읽음':'읽음으로 표시';
  });
  var wc=wrongList().length, badge=$('#nav-wrong .nv'); if(badge) badge.textContent=wc||'';
}
function wrongList(){
  var all=VD.all(), ids=[];
  for(var k in all){ if((all[k]==='wrong'||all[k]==='partial')&&BYID[k]) ids.push(k); }
  return ids;
}

/* ---------- 문제 카드 ---------- */
function grade(prob, status, card){
  VD.set(prob.id, status);
  card.querySelectorAll('.pbtn.sel').forEach(function(b){ b.classList.remove('sel'); });
  var btn=card.querySelector('.pbtn.grade-'+status[0]); if(btn) btn.classList.add('sel');
  var dot=card.querySelector('.sdot'); if(dot){ dot.className='sdot '+status; }
  refreshProg();
  if(EXAM.running) examAnswered(prob.id, status);
}
function renderProblem(prob){
  var card=document.createElement('article'); card.className='pcard'; card.setAttribute('data-pid',prob.id);
  var st=VD.get(prob.id);
  var srcb=prob.src?'<span class="srcb">'+esc(prob.src)+'</span>':'';
  card.innerHTML='<div class="pc-head"><span class="lv lv'+prob.level+'">L'+prob.level+'</span>'+
    '<span class="tagc">'+esc(prob.id)+' · '+esc((prob.tags||[]).join('·'))+'</span>'+srcb+
    '<span class="sdot'+(st?' '+st:'')+'"></span></div>'+
    '<div class="pc-st"></div><div class="pc-body"></div><div class="pc-btns"></div>';
  var stEl=$('.pc-st',card), body=$('.pc-body',card), btns=$('.pc-btns',card);
  stEl.innerHTML=statementOf(prob);

  function addBtn(label, cls, fn){
    var b=document.createElement('button'); b.type='button'; b.className='pbtn'+(cls?' '+cls:''); b.textContent=label;
    b.addEventListener('click',fn); btns.appendChild(b); return b;
  }
  function gradeBtns(){
    addBtn('맞음 ✓','grade-c',function(){ grade(prob,'correct',card); });
    addBtn('부분 △','grade-p',function(){ grade(prob,'partial',card); });
    addBtn('틀림 ✗','grade-w',function(){ grade(prob,'wrong',card); });
    if(st){ var b=card.querySelector('.pbtn.grade-'+st[0]); if(b) b.classList.add('sel'); }
  }

  if(prob.type==='mc'||prob.type==='tf'){
    var choices = prob.type==='tf' ? ['참 (O)','거짓 (X)'] : prob.choices;
    var correctIdx = prob.type==='tf' ? (prob.answer?0:1) : prob.answer;
    var wrap=document.createElement('div'); wrap.className='choices';
    choices.forEach(function(c,i){
      var b=document.createElement('button'); b.type='button'; b.className='choice'; b.innerHTML=c;
      b.addEventListener('click',function(){
        if(card.__done) return; card.__done=true;
        wrap.children[correctIdx].classList.add('right');
        if(i!==correctIdx) b.classList.add('wrongpick');
        var ex=document.createElement('div'); ex.className='expl'; ex.innerHTML='<b>해설</b> — '+prob.expl;
        body.appendChild(ex); typeset(ex);
        grade(prob, i===correctIdx?'correct':'wrong', card);
      });
      wrap.appendChild(b);
    });
    body.appendChild(wrap);
  } else {
    var hintIdx=0, hb=null;
    if(prob.hints&&prob.hints.length){
      addBtn('💡 힌트','',function(){
        if(hintIdx>=prob.hints.length) return;
        if(!hb){ hb=document.createElement('div'); hb.className='hintbox'; body.appendChild(hb); }
        var d=document.createElement('div'); d.innerHTML='힌트 '+(hintIdx+1)+'. '+prob.hints[hintIdx];
        hb.appendChild(d); typeset(d); hintIdx++;
        this.textContent = hintIdx>=prob.hints.length ? '힌트 끝' : '💡 힌트 '+(hintIdx+1);
      });
    }
    var solBtn=addBtn('풀이 보기','',function(){
      if(card.__sol){ card.__sol.hidden=!card.__sol.hidden; this.textContent=card.__sol.hidden?'풀이 보기':'풀이 닫기'; return; }
      var box=document.createElement('div'); box.className='solbox';
      var steps, aline='';
      if(prob.type==='derive'){ steps=prob.steps; }
      else{
        var r=prob.solve(prob.params?CUR[prob.id]:{});
        steps=r.steps; aline='<div class="ansline">답: '+esc(ansText(r))+'</div>';
      }
      box.innerHTML='<ol>'+steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol>'+aline+
        (prob.expl?'<div class="expl">'+prob.expl+'</div>':'');
      body.appendChild(box); typeset(box);
      card.__sol=box; this.textContent='풀이 닫기';
      if(!card.__graded){ card.__graded=true; gradeBtns(); }
    });
    if(prob.params){
      addBtn('🎲 새 숫자로','',function(){
        CUR[prob.id]=sample(prob);
        stEl.innerHTML=statementOf(prob); typeset(stEl);
        if(card.__sol){ card.__sol.remove(); card.__sol=null; solBtn.textContent='풀이 보기'; }
        if(hb){ hb.remove(); hb=null; hintIdx=0; }
      });
    }
    if(st&&!card.__graded){ card.__graded=true; gradeBtns(); }
  }
  return card;
}

/* ---------- 뷰 ---------- */
var view=$('#view');
function setView(html){ view.innerHTML=html; }
function renderHome(){

  var rate=dc.total?Math.round(dc.correct/dc.total*100):null;

    '<h1>일반물리II 문제은행</h1>'+
    '<p class="lede">개념 → 유도 → 예제 → 4단계 문제(L1~L4). 전 문제가 검산 게이트(sympy 독립 재계산 대조)를 통과했고, 계산형 문제는 <b>🎲 새 숫자로</b>를 눌러 무한 반복할 수 있다.</p>'+
    '<p class="note-line">현황 — 풀어본 문제 '+dc.total+' / '+ALL.length+(rate!==null?(' · 정답률 '+rate+'%'):'')+
    ' · <a href="#wrong">오답노트 '+wrongList().length+'문제</a> · 빌드 '+SV_BUILD.date+' (게이트 '+SV_BUILD.gate+')</p>'+
    '<div class="ucards" id="ucards"></div>'+
    '<h3>모드</h3><div class="ucards">'+
    '<a class="ucard" href="#exam"><span class="uc-no">MOCK EXAM</span><span class="uc-ti">📝 모의고사</span><span class="uc-scope">범위·난이도·문항수를 골라 랜덤 출제 — 매번 새 수치, 종료 리포트 제공.</span></a>'+
    '<a class="ucard" href="#wrong"><span class="uc-no">RETRY QUEUE</span><span class="uc-ti">🔁 오답노트</span><span class="uc-scope">틀림·부분 문제만 모아 재도전. 맞음으로 바꾸면 큐에서 빠진다.</span></a></div>');
  var uc=$('#ucards');
  UNITS.forEach(function(u){
    var solved=0, ok=0;
    u.problems.forEach(function(p){ var s=VD.get(p.id); if(s){solved++; if(s==='correct')ok++;} });
    var reads=LAYERS.filter(function(l){return VP.get(u.id+'-'+l);}).length;
    var a=document.createElement('a'); a.className='ucard'; a.href='#'+u.id;
    a.innerHTML='<span class="uc-no">UNIT '+u.no+'</span><span class="uc-ti">'+esc(u.title)+'</span>'+
      '<span class="uc-scope">'+esc(u.scope)+'</span>'+
      '<span class="uc-stat">읽음 '+reads+'/3 · 문제 '+solved+'/'+u.problems.length+(solved?' · 정답 '+ok:'')+'</span>';
    uc.appendChild(a);
  });
  typeset(view);
}
function renderUnit(u){
  var c=SV_CONTENT[u.id]||{};
  setView('<div class="eyebrow">UNIT '+u.no+' / '+UNITS.length+'</div><h1>'+esc(u.title)+'</h1>'+
    '<p class="lede">'+esc(u.scope)+'</p><div id="layers"></div>'+
    '<h3>문제 세트 <span class="src">L1 개념확인 → L4 시험급 · '+u.problems.length+'문제</span></h3>'+
    '<div class="filters" id="filters"></div><div id="plist"></div>');
  var layers=$('#layers');
  LAYERS.forEach(function(l){
    var d=document.createElement('details'); d.className='layer'; if(l==='concept') d.open=true;
    var inner='';
    if(l==='derive'){
      (c.derive||[]).forEach(function(dv){
        inner+='<details class="dstep"><summary>'+esc(dv.title)+'</summary><ol>'+
          dv.steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol></details>';
      });
    } else inner=c[l]||'';
    d.innerHTML='<summary><span class="lb">'+(l.toUpperCase())+'</span>'+LAYER_KO[l]+'<span class="arrow">›</span></summary>'+
      '<div class="body">'+inner+'<div class="readrow"><button type="button" class="readbtn" data-read="'+u.id+'-'+l+'"></button></div></div>';
    layers.appendChild(d);
  });
  layers.addEventListener('click',function(e){
    var b=e.target.closest('.readbtn'); if(!b) return;
    VP.toggle(b.getAttribute('data-read')); refreshProg();
  });
  var lv=0, fl=$('#filters'), pl=$('#plist');
  function renderList(){
    pl.innerHTML='';
    u.problems.filter(function(p){ return !lv||p.level===lv; }).forEach(function(p){ pl.appendChild(renderProblem(p)); });
    typeset(pl);
  }
  [['전체',0],['L1 개념',1],['L2 기본',2],['L3 응용',3],['L4 시험급',4]].forEach(function(f){
    var b=document.createElement('button'); b.type='button'; b.className='fchip'+(f[1]===0?' on':''); b.textContent=f[0];
    b.addEventListener('click',function(){ lv=f[1]; fl.querySelectorAll('.fchip').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); renderList(); });
    fl.appendChild(b);
  });
  renderList(); typeset(layers);
}
function renderWrong(){
  var ids=wrongList();
  setView('<div class="eyebrow">RETRY QUEUE</div><h1>오답노트</h1>'+
    '<p class="lede">틀림·부분 표시 문제 '+ids.length+'개. 다시 풀어 <b>맞음</b>으로 바꾸면 큐에서 빠진다. 계산형은 자동으로 새 수치다.</p><div id="plist"></div>');
  var pl=$('#plist');
  if(!ids.length){ pl.innerHTML='<div class="empty">비어 있음 — 문제를 풀고 자가채점하면 틀림/부분이 여기 모인다.</div>'; return; }
  ids.forEach(function(id){ var p=BYID[id]; if(p&&p.params) CUR[id]=sample(p); pl.appendChild(renderProblem(BYID[id])); });
  typeset(pl);
}
/* ---------- 모의고사 ---------- */
var EXAM={running:false};
function renderExam(){
  if(EXAM.running){ renderExamRun(); return; }
  var uchecks=UNITS.map(function(u){ return '<label class="ck"><input type="checkbox" class="exu" value="'+u.id+'" checked> U'+u.no+' '+esc(u.title)+'</label>'; }).join('');
  setView('<div class="eyebrow">MOCK EXAM</div><h1>모의고사</h1>'+
    '<p class="lede">범위와 난이도를 고르면 랜덤 출제. 채점은 문제마다(객관식 자동 · 계산형 자가채점), 종료하면 리포트.</p>'+
    '<div class="exam-setup">'+
    '<div class="grp"><h4>범위</h4>'+uchecks+'</div>'+
    '<div class="grp"><h4>난이도</h4>'+[1,2,3,4].map(function(l){return '<label class="ck"><input type="checkbox" class="exl" value="'+l+'" '+(l>1?'checked':'')+'> L'+l+'</label>';}).join('')+'</div>'+
    '<div class="grp"><h4>문항 수</h4><select id="exn"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>'+
    '<button class="bigbtn" id="exgo">모의고사 시작 →</button></div>');
  $('#exgo').addEventListener('click',function(){
    var us={}, ls={};
    document.querySelectorAll('.exu:checked').forEach(function(c){us[c.value]=1;});
    document.querySelectorAll('.exl:checked').forEach(function(c){ls[+c.value]=1;});
    var pool=ALL.filter(function(p){ return us[p._unit.id]&&ls[p.level]; });
    var n=Math.min(+$('#exn').value, pool.length);
    if(!n){ alert('선택한 범위에 문제가 없습니다'); return; }
    for(var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
    EXAM={running:true, list:pool.slice(0,n), idx:0, res:{}};
    EXAM.list.forEach(function(p){ if(p.params) CUR[p.id]=sample(p); });
    renderExamRun();
  });
}
function examAnswered(pid, status){ if(EXAM.running&&EXAM.res) EXAM.res[pid]=status; }
function renderExamRun(){
  var i=EXAM.idx, p=EXAM.list[i];
  setView('<div class="eyebrow">MOCK EXAM · '+(i+1)+' / '+EXAM.list.length+'</div>'+
    '<div class="exam-top"><span>'+(i+1)+'/'+EXAM.list.length+'</span><div class="bar"><i style="width:'+Math.round(i/EXAM.list.length*100)+'%"></i></div>'+
    '<button class="pbtn" id="exquit">종료</button></div><div id="pslot"></div>'+
    '<div class="pc-btns" style="margin-top:14px"><button class="bigbtn" id="exnext">'+(i+1<EXAM.list.length?'다음 문제 →':'리포트 보기 →')+'</button></div>');
  $('#pslot').appendChild(renderProblem(p)); typeset($('#pslot'));
  $('#exnext').addEventListener('click',function(){
    if(EXAM.idx+1<EXAM.list.length){ EXAM.idx++; renderExamRun(); } else renderExamReport();
  });
  $('#exquit').addEventListener('click',renderExamReport);
}
function renderExamReport(){
  var res=EXAM.res, list=EXAM.list; EXAM.running=false;
  var c=0,pt=0,w=0,na=0;
  var perUnit={};
  list.forEach(function(p){
    var s=res[p.id];
    var u=perUnit[p._unit.id]=perUnit[p._unit.id]||{t:0,c:0,title:p._unit.title,no:p._unit.no};
    u.t++;
    if(s==='correct'){c++;u.c++;} else if(s==='partial'){pt++;} else if(s==='wrong'){w++;} else na++;
  });
  var score=Math.round((c+0.5*pt)/list.length*100);
  var rows=Object.keys(perUnit).sort().map(function(k){var u=perUnit[k];return '<tr><td>U'+u.no+' '+esc(u.title)+'</td><td>'+u.c+' / '+u.t+'</td></tr>';}).join('');
  setView('<div class="eyebrow">MOCK EXAM · REPORT</div><h1>결과 리포트</h1>'+
    '<div class="report"><div class="score">'+score+'점</div>'+
    '<p>맞음 '+c+' · 부분 '+pt+' · 틀림 '+w+(na?' · 무응답 '+na:'')+' (총 '+list.length+'문제)</p>'+
    '<table><thead><tr><th>단원</th><th>정답</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="pc-btns"><a class="pbtn" href="#wrong">🔁 오답노트로</a><a class="pbtn" href="#exam" onclick="">다시 설정</a><a class="pbtn" href="#home">홈</a></div></div>');
}

/* ---------- 내비 · 라우팅 ---------- */
function buildNav(){
  var nav=$('#sidenav'), sheet=$('#tb-sheet');
  var html='<div class="ng">학습</div><a href="#home" data-v="home">홈 · 현황</a>';
  UNITS.forEach(function(u){ html+='<a href="#'+u.id+'" data-v="'+u.id+'">U'+u.no+' '+esc(u.title)+'</a>'; });
  html+='<div class="ng">훈련</div><a href="#wrong" data-v="wrong" id="nav-wrong">오답노트<span class="nv"></span></a><a href="#exam" data-v="exam">모의고사</a>';
  nav.innerHTML=html;
  sheet.innerHTML=UNITS.map(function(u){ return '<a href="#'+u.id+'">U'+u.no+' '+esc(u.title)+'</a>'; }).join('');
}
function route(){
  var h=(location.hash||'#home').slice(1);
  var valid={home:1,wrong:1,exam:1}; UNITS.forEach(function(u){valid[u.id]=1;});
  if(!valid[h]) h='home';
  if(h!=='exam') EXAM.running=false;
  document.querySelectorAll('.side nav a').forEach(function(a){ a.classList.toggle('on',a.getAttribute('data-v')===h); });
  document.querySelectorAll('.tabbar [data-tv]').forEach(function(a){ a.classList.toggle('on',a.getAttribute('data-tv')===h); });
  var sh=$('#tb-sheet'); if(sh) sh.hidden=true;
  VM.touch(location.hash||'#home');
  if(h==='home') renderHome();
  else if(h==='wrong') renderWrong();
  else if(h==='exam') renderExam();
  else renderUnit(UNITS.filter(function(u){return u.id===h;})[0]);
  window.scrollTo(0,0);
  refreshProg();
}
var tbMore=$('#tb-more'), tbSheet=$('#tb-sheet');
if(tbMore){ tbMore.addEventListener('click',function(e){ e.stopPropagation(); tbSheet.hidden=!tbSheet.hidden; });
  document.addEventListener('click',function(e){ if(!tbSheet.hidden&&!tbSheet.contains(e.target)) tbSheet.hidden=true; }); }
window.addEventListener('hashchange',route);
buildNav(); route();
})();
