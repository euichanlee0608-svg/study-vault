:root[data-theme="dark"]{

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
 line-height:1.68;font-size:15px;-webkit-font-smoothing:antialiased;
 word-break:keep-all;overflow-wrap:break-word}
a{color:var(--acc);text-decoration-thickness:1px;text-underline-offset:2px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:3px}
mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}
.layout{display:flex;min-height:100vh}
.side{width:250px;flex:0 0 250px;background:var(--side);border-right:1px solid var(--line);
 padding:22px 18px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.brand a{color:var(--ink);text-decoration:none;font-family:Newsreader,Georgia,serif;font-size:19px;letter-spacing:-.01em}

.brand span{display:block;font-size:10.5px;color:var(--ink3);font-family:"IBM Plex Mono",monospace;margin-top:2px}
.prog-bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:4px}
.prog-bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:99px;transition:width .3s}
.prog span{font-size:10.5px;color:var(--ink3);font-family:"IBM Plex Mono",monospace}
.side nav{display:flex;flex-direction:column;gap:2px}
.ng{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-family:"IBM Plex Mono",monospace;margin:10px 0 4px;padding-left:10px}
.side nav a{display:block;padding:7px 10px;border-radius:6px;color:var(--ink2);text-decoration:none;font-size:13.5px}
.side nav a:hover{background:var(--surf2)}
.side nav a.on{background:var(--acc-bg);color:var(--acc);font-weight:600}
.side nav a .nv{float:right;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3)}
.foot-side{margin-top:auto;font-size:10.5px;color:var(--ink3);line-height:1.5;font-family:"IBM Plex Mono",monospace}
.foot-side a{color:var(--ink3)}
.main{flex:1;min-width:0;padding:clamp(22px,4vw,48px) clamp(16px,4.5vw,56px) 120px;display:flex;justify-content:center}
.view{width:100%;max-width:820px}
h1{font-family:Newsreader,"Gowun Batang",Georgia,serif;font-weight:600;font-size:clamp(25px,4vw,34px);line-height:1.16;letter-spacing:-.015em;margin:6px 0 12px;text-wrap:balance}
h3{font-family:Newsreader,Georgia,serif;font-size:20px;font-weight:600;margin:30px 0 10px;letter-spacing:-.01em}
h4{font-size:15.5px;font-weight:600;margin:22px 0 8px}
p{margin:0 0 12px}
ul,ol{margin:0 0 13px;padding-left:22px}
li{margin-bottom:6px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--acc);font-weight:500}
.lede{font-size:15.5px;color:var(--ink2)}
.easy{background:var(--acc-bg);border-radius:8px;padding:13px 16px;margin:0 0 14px}
.easy b{color:var(--acc)}
.note-line{font-size:13.5px;color:var(--ink2);background:var(--surf2);border-radius:6px;padding:10px 14px;margin:0 0 12px}
.src{font-size:12px;color:var(--ink3);font-weight:400}
/* unit cards on home */
.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin:16px 0}
.ucard{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:16px 17px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px;color:var(--ink);text-decoration:none}
.ucard:hover{border-color:var(--acc)}
.uc-no{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--acc);font-weight:600}
.uc-ti{font-family:Newsreader,Georgia,serif;font-size:18px;font-weight:600}
.uc-scope{font-size:12.5px;color:var(--ink2);line-height:1.55}
.uc-stat{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3)}
/* collapsible layers */
details.layer{border:1px solid var(--line);border-radius:9px;background:var(--surf);margin-bottom:10px;box-shadow:var(--shadow)}
details.layer>summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:15px;list-style:none;display:flex;align-items:center;gap:8px}
details.layer>summary::-webkit-details-marker{display:none}
details.layer>summary .lb{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;padding:2px 8px;border-radius:99px;background:var(--info-bg);color:var(--info)}
details.layer>summary .arrow{margin-left:auto;color:var(--ink3);transition:transform .2s}
details.layer[open]>summary .arrow{transform:rotate(90deg)}
details.layer>.body{padding:4px 18px 14px;border-top:1px solid var(--line)}
details.dstep{border:1px solid var(--line);border-radius:7px;margin:0 0 8px;background:var(--surf2)}
details.dstep>summary{cursor:pointer;padding:9px 13px;font-weight:500;font-size:13.5px}
details.dstep ol{margin:4px 0 10px;padding:0 14px 0 34px}
details.dstep li{margin-bottom:7px;font-size:13.5px}

.jsbox{border:1.5px solid var(--acc);border-radius:9px;background:var(--acc-bg);padding:11px 15px;margin:12px 0;font-size:14px}
.jsbox .jt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;color:var(--acc);font-weight:600;display:block;margin-bottom:3px}
.exbox{border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:8px;background:var(--surf);padding:12px 15px;margin:12px 0}
.exbox .xh{font-weight:600;font-size:14px;margin-bottom:6px}
.exbox .xh .xno{font-family:"IBM Plex Mono",monospace;color:var(--acc);font-size:11.5px;margin-right:6px}
.exbox .xsol{border-top:1px dashed var(--line2);margin-top:8px;padding-top:8px;font-size:13.5px}
.exbox .xsol ol{margin:4px 0 0;padding-left:20px}
.exbox .xrel{font-size:12px;color:var(--ink3);margin-top:8px;font-family:"IBM Plex Mono",monospace}
.readrow{margin:8px 0 2px;text-align:right}
.readbtn{font:inherit;font-size:12.5px;min-height:40px;padding:7px 15px;border-radius:99px;border:1px solid var(--line2);background:var(--surf);color:var(--ink2);cursor:pointer}
.readbtn[aria-pressed="true"]{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
/* drill */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.fchip{font:inherit;font-size:12.5px;min-height:36px;padding:5px 14px;border-radius:99px;border:1px solid var(--line2);background:var(--surf);color:var(--ink2);cursor:pointer}
.fchip.on{background:var(--acc-bg);color:var(--acc);border-color:var(--acc);font-weight:600}
.pcard{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:15px 17px;margin-bottom:12px;box-shadow:var(--shadow)}
.pc-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.lv{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px}
.lv1{background:var(--ok-bg);color:var(--ok)} .lv2{background:var(--info-bg);color:var(--info)}
.lv3{background:var(--warn-bg);color:var(--warn)} .lv4{background:var(--acc-bg);color:var(--acc)}
.tagc{font-size:11px;color:var(--ink3);font-family:"IBM Plex Mono",monospace}
.srcb{font-size:10px;color:var(--ink3);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.sdot{width:9px;height:9px;border-radius:99px;background:var(--line2);margin-left:auto;flex:0 0 auto}
.sdot.correct{background:var(--ok)} .sdot.partial{background:var(--warn)} .sdot.wrong{background:var(--bad)}
.pc-st{font-size:14.5px;margin-bottom:10px}
.pc-btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.pbtn{font:inherit;font-size:12.5px;min-height:40px;padding:7px 14px;border-radius:8px;border:1px solid var(--line2);background:var(--surf2);color:var(--ink2);cursor:pointer}
.pbtn:hover{border-color:var(--acc);color:var(--acc)}
.pbtn.grade-c{border-color:var(--ok);color:var(--ok)}
.pbtn.grade-p{border-color:var(--warn);color:var(--warn)}
.pbtn.grade-w{border-color:var(--bad);color:var(--bad)}
.pbtn.grade-c.sel{background:var(--ok-bg)} .pbtn.grade-p.sel{background:var(--warn-bg)} .pbtn.grade-w.sel{background:var(--bad-bg)}
.hintbox{background:var(--warn-bg);border-radius:7px;padding:9px 13px;font-size:13px;margin:8px 0 0}
.solbox{background:var(--surf2);border-radius:8px;padding:11px 14px;margin:10px 0 0}
.solbox ol{margin:0;padding-left:20px}
.solbox li{font-size:13.5px;margin-bottom:7px}
.ansline{margin-top:8px;font-weight:600;color:var(--acc);font-size:14px}
.choices{display:flex;flex-direction:column;gap:7px;margin:4px 0 2px}
.choice{font:inherit;text-align:left;font-size:13.5px;min-height:44px;padding:9px 13px;border-radius:8px;border:1px solid var(--line2);background:var(--surf);color:var(--ink);cursor:pointer}
.choice:hover{border-color:var(--acc)}
.choice.right{border-color:var(--ok);background:var(--ok-bg)}
.choice.wrongpick{border-color:var(--bad);background:var(--bad-bg)}
.expl{background:var(--info-bg);border-radius:7px;padding:9px 13px;font-size:13px;margin-top:8px;color:var(--ink2)}
/* exam */
.exam-setup .grp{margin-bottom:14px}
.exam-setup label.ck{display:inline-flex;align-items:center;gap:6px;margin:0 12px 6px 0;font-size:13.5px;min-height:36px}
.exam-setup input[type=checkbox]{accent-color:var(--acc);width:17px;height:17px}
.exam-setup select{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--surf);color:var(--ink)}
.bigbtn{font:inherit;font-size:14.5px;font-weight:600;min-height:46px;padding:10px 22px;border-radius:99px;border:none;background:var(--acc);color:#fff;cursor:pointer}
.bigbtn:disabled{opacity:.5;cursor:default}
.exam-top{display:flex;align-items:center;gap:10px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink3);margin-bottom:12px}
.exam-top .bar{flex:1;height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.exam-top .bar i{display:block;height:100%;background:var(--acc)}
.report{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:18px 20px;box-shadow:var(--shadow)}
.report .score{font-family:Newsreader,Georgia,serif;font-size:34px;font-weight:600;color:var(--acc)}
table{border-collapse:collapse;width:100%;margin:10px 0 14px;font-size:13px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left}
th{background:var(--surf2);white-space:nowrap}
.empty{border:1px dashed var(--line2);border-radius:10px;padding:24px;color:var(--ink3);font-size:13.5px;text-align:center}
/* mobile */
.tabbar{display:none}
#tb-sheet{display:none}
@media(max-width:960px){
 body{font-size:16px}
 input,textarea,select{font-size:16px}
 .layout{flex-direction:column}
 .side{width:100%;flex:none;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line);
  padding:12px 16px;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap}
 .side nav,.ng,.foot-side{display:none}
 .side .prog{flex:1;min-width:110px}
 .main{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
 .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;background:var(--side);border-top:1px solid var(--line);
  padding:4px 4px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.06)}
 .tabbar a,.tabbar button{flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font:inherit;font-size:16px;line-height:1;background:none;border:none;border-radius:8px;color:var(--ink2);text-decoration:none;cursor:pointer;padding:5px 2px}
 .tabbar a span,.tabbar button span{font-size:10.5px;font-family:"IBM Plex Mono",monospace}
 .tabbar a.on{color:var(--acc);background:var(--acc-bg)}

  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;min-width:190px}

 #tb-sheet a:active{background:var(--surf2)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

    fmt: function (x, sig) {
      if (typeof x !== 'number' || !isFinite(x)) return String(x);
      if (x === 0) return '0';
      var v = Number(x.toPrecision(sig || 4));

    cmul: function (a, b) { return { re: a.re * b.re - a.im * b.im, im: a.re * b.im + a.im * b.re }; },

  /* ---------- L2 (12) ---------- */
  { id:'u1-l2-01', level:2, type:'num', tags:['복소수 크기·각'], src:'창작 문제(검산됨)',
    params:{ a:{min:1,max:6,step:1}, b:{min:1,max:6,step:1} },
    statement:function(p){ return '복소수 \\(z='+p.a+'+j'+p.b+'\\)의 크기와 각(°)을 구하라.'; },

  { id:'u1-l2-02', level:2, type:'num', tags:['복소수 곱'], src:'창작 문제(검산됨)',

  { id:'u1-l2-03', level:2, type:'num', tags:['복소수 나눗셈'], src:'창작 문제(검산됨)',
    params:{ a:{min:1,max:4,step:1}, b:{min:1,max:4,step:1}, c:{min:1,max:3,step:1}, d:{min:1,max:3,step:1} },
    statement:function(p){ return '\\(\\dfrac{'+p.a+'+j'+p.b+'}{'+p.c+'+j'+p.d+'}\\)의 실수부와 허수부를 구하라.'; },
    solve:function(p){ var den=p.c*p.c+p.d*p.d;
      var re=(p.a*p.c+p.b*p.d)/den, im=(p.b*p.c-p.a*p.d)/den;
      return { ans:{re:re, im:im}, unit:{re:'', im:''}, steps:[
        '분모 켤레 곱: 분모 = '+p.c+'²+'+p.d+'² = '+den,
        '분자 = ('+p.a+'+j'+p.b+')('+p.c+'−j'+p.d+') = '+SVH.fmt(p.a*p.c+p.b*p.d)+'+j('+SVH.fmt(p.b*p.c-p.a*p.d)+')',
        're = '+SVH.fmt(re)+', im = '+SVH.fmt(im) ] }; },
    hints:['켤레를 곱해 분모를 실수로.'] },
  { id:'u1-l2-04', level:2, type:'num', tags:['특성근'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[3,5,7]}, b:{choices:[2,4,6,10]} },
    statement:function(p){ return '특성방정식 \\(\\lambda^2+'+p.a+'\\lambda+'+p.b+'=0\\)의 두 근을 구하라(실근이면 λ₁>λ₂, 복소면 실수부·허수부).'; },
    solve:function(p){
      var D=p.a*p.a-4*p.b;
      if(D>=0){ var r1=(-p.a+Math.sqrt(D))/2, r2=(-p.a-Math.sqrt(D))/2;
        return { ans:{x1:r1, x2:r2}, unit:{x1:'', x2:''}, steps:[
          '판별식 D = '+p.a+'²−4·'+p.b+' = '+SVH.fmt(D)+' ≥ 0 → 실근',
          'λ = (−'+p.a+'±√'+SVH.fmt(D)+')/2 → '+SVH.fmt(r1)+', '+SVH.fmt(r2) ] }; }
      var re=-p.a/2, im=Math.sqrt(-D)/2;
      return { ans:{x1:re, x2:im}, unit:{x1:'(실수부)', x2:'(허수부)'}, steps:[
        'D = '+SVH.fmt(D)+' < 0 → 복소근',
        'λ = '+SVH.fmt(re)+' ± j'+SVH.fmt(im) ] }; },
    hints:['근의 공식, 판별식부터.'] },
  { id:'u1-l2-05', level:2, type:'num', tags:['1차 ODE'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[2,4,5]}, y0:{min:2,max:8,step:2}, t1:{choices:[0.2,0.5]} },
    statement:function(p){ return '\\(\\dot y = -'+p.a+'y\\), y(0)='+p.y0+'의 해를 구하고 t='+p.t1+'에서 값을 구하라.'; },

    hints:['지수 감쇠 — 시정수 1/a.'] },
  { id:'u1-l2-06', level:2, type:'num', tags:['적분'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[1,2,3]}, T:{choices:[1,2]} },
    statement:function(p){ return '\\(\\int_0^{'+p.T+'} e^{-'+p.a+'t}\\,dt\\)를 구하라.'; },
    solve:function(p){ var v=(1-Math.exp(-p.a*p.T))/p.a;

  { id:'u1-l2-07', level:2, type:'num', tags:['행렬식·역행렬'], src:'창작 문제(검산됨)',

        'A⁻¹ = (1/det)[[d,−b],[−c,a]] → (1,1) = '+p.d+'/'+SVH.fmt(det)+' = '+SVH.fmt(p.d/det) ] }; },
    hints:['2×2 역행렬 공식(대각 교환, 부대각 부호).'] },
  { id:'u1-l2-08', level:2, type:'num', tags:['고유값'], src:'창작 문제(검산됨)',

    statement:function(p){ return '\\(A=\\begin{bmatrix}'+p.a+'&'+p.b+'\\\\0&'+p.d+'\\end{bmatrix}\\)의 고유값 두 개를 구하라. (큰 값을 λ₁로)'; },

        '상삼각 행렬 → 고유값 = 대각 성분',
        'λ = '+SVH.fmt(l1)+', '+SVH.fmt(l2)+' (둘 다 음수면 안정 — U5·U7 예고)' ] }; },

  { id:'u1-l2-09', level:2, type:'num', tags:['정현파 항등식'], src:'창작 문제(검산됨)',
    params:{ A:{min:3,max:6,step:1}, B:{min:4,max:8,step:4} },
    statement:function(p){ return '\\('+p.A+'\\cos\\omega t+'+p.B+'\\sin\\omega t = R\\cos(\\omega t-\\phi)\\)의 R와 φ(°)를 구하라.'; },
    solve:function(p){ var R=Math.hypot(p.A,p.B), ph=SVH.deg(Math.atan2(p.B,p.A));
      return { ans:{R:R, ph:ph}, unit:{R:'', ph:'°'}, steps:[
        'R = √(A²+B²) = '+SVH.fmt(R),
        'φ = tan⁻¹(B/A) = '+SVH.fmt(ph)+'° (2차계 부족감쇠 응답 정리에 반복 등장)' ] }; },
    hints:['전개해 계수 비교하거나 페이저로.'] },
  { id:'u1-l2-10', level:2, type:'num', tags:['미분'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[2,3]}, w:{choices:[4,5]}, t1:{choices:[0,0.1]} },
    statement:function(p){ return '\\(y=e^{-'+p.a+'t}\\cos('+p.w+'t)\\)의 \\(\\dot y\\)를 t='+p.t1+'에서 구하라.'; },
    solve:function(p){
      var v=-p.a*Math.exp(-p.a*p.t1)*Math.cos(p.w*p.t1)-p.w*Math.exp(-p.a*p.t1)*Math.sin(p.w*p.t1);
      return { ans:v, unit:'', steps:[
        '곱미분: \\(\\dot y = -'+p.a+'e^{-'+p.a+'t}\\cos'+p.w+'t - '+p.w+'e^{-'+p.a+'t}\\sin'+p.w+'t\\)',
        't='+p.t1+' 대입 → '+SVH.fmt(v)+' (감쇠 정현파 미분은 앞으로 수없이 나온다)' ] }; },
    hints:['곱의 미분 + 연쇄율.'] },
  { id:'u1-l2-11', level:2, type:'num', tags:['부분분수 기초'], src:'창작 문제(검산됨)',
    params:{ p1:{choices:[1,2]}, p2:{choices:[3,4,5]} },
    statement:function(p){ return '\\(\\dfrac{1}{(s+'+p.p1+')(s+'+p.p2+')} = \\dfrac{A}{s+'+p.p1+'}+\\dfrac{B}{s+'+p.p2+'}\\)의 A·B를 구하라.'; },
    solve:function(p){ var A=1/(p.p2-p.p1), B=-A;
      return { ans:{A:A, B:B}, unit:{A:'', B:''}, steps:[
        '커버업: A = 1/(s+'+p.p2+')|_{s=−'+p.p1+'} = 1/('+p.p2+'−'+p.p1+') = '+SVH.fmt(A),
        'B = 1/(s+'+p.p1+')|_{s=−'+p.p2+'} = '+SVH.fmt(B)+' (합=0 확인)' ] }; },
    hints:['커버업(Heaviside) 방법이 제일 빠르다.'] },
  { id:'u1-l2-12', level:2, type:'num', tags:['지수·로그'], src:'창작 문제(검산됨)',
    params:{ r:{choices:[0.5,0.1,0.05]}, a:{choices:[2,4]} },
    statement:function(p){ return '\\(e^{-'+p.a+'t}='+p.r+'\\)이 되는 t를 구하라.'; },
    solve:function(p){ var t=-Math.log(p.r)/p.a;
      return { ans:t, unit:'s', steps:[
        't = −ln('+p.r+')/'+p.a,
        '= '+SVH.fmt(t)+' s (정착시간 공식 ln의 출처)' ] }; },
    hints:['양변 ln.'] },

  /* ---------- L3 (14) ---------- */
  { id:'u1-l3-01', level:3, type:'num', tags:['1차 ODE+입력'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[2,4]}, K:{choices:[6,8,10]}, t1:{choices:[0.5,1]} },
    statement:function(p){ return '\\(\\dot y + '+p.a+'y = '+p.K+'\\), y(0)=0의 해를 구하고 t='+p.t1+'에서 값을 구하라.'; },
    solve:function(p){ var yss=p.K/p.a, y=yss*(1-Math.exp(-p.a*p.t1));
      return { ans:{yss:yss, y:y}, unit:{yss:'', y:''}, steps:[
        '정상해 y_ss = K/a = '+SVH.fmt(yss)+', 동차해 Ce^{−at}',
        'y(0)=0 → y = '+SVH.fmt(yss)+'(1−e^{−'+p.a+'t})',
        't='+p.t1+': '+SVH.fmt(y)+' (1차계 스텝 응답의 원형)' ] }; },
    hints:['특수해+동차해, 초기조건으로 C.'] },
  { id:'u1-l3-02', level:3, type:'num', tags:['2차 ODE 분류'], src:'창작 문제(검산됨)',
    params:{ c:{choices:[2,4,8,10]}, k:{choices:[4,16,25]} },
    statement:function(p){ return '\\(\\ddot y+'+p.c+'\\dot y+'+p.k+'y=0\\): (a) ω₀ (b) ζ (c) 감쇠 유형(부족=−1/임계=0/과=1)을 구하라.'; },
    solve:function(p){
      var w0=Math.sqrt(p.k), z=p.c/(2*w0);
      var t=z<0.999?-1:(z>1.001?1:0);
      return { ans:{w0:w0, z:z, t:t}, unit:{w0:'rad/s', z:'', t:''}, steps:[
        '표준형 \\(\\ddot y+2\\zeta\\omega_0\\dot y+\\omega_0^2y=0\\)과 비교',
        'ω₀ = √'+p.k+' = '+SVH.fmt(w0)+', ζ = '+p.c+'/(2ω₀) = '+SVH.fmt(z),
        (t<0?'ζ<1 부족감쇠(진동)':(t>0?'ζ>1 과감쇠':'임계감쇠')) ] }; },
    hints:['계수 비교로 ω₀·ζ.'] },
  { id:'u1-l3-03', level:3, type:'num', tags:['감쇠 정현파 해'], src:'창작 문제(검산됨)',
    params:{ z:{choices:[0.5,0.6]}, w0:{choices:[5,10]} },
    statement:function(p){ return 'ζ='+p.z+', ω₀='+p.w0+'인 2차계의 근 \\(s=-\\sigma\\pm j\\omega_d\\): σ와 ω_d를 구하라.'; },
    solve:function(p){ var sg=p.z*p.w0, wd=p.w0*Math.sqrt(1-p.z*p.z);
      return { ans:{sg:sg, wd:wd}, unit:{sg:'1/s', wd:'rad/s'}, steps:[
        'σ = ζω₀ = '+SVH.fmt(sg)+' (봉투 감쇠율)',
        'ω_d = ω₀√(1−ζ²) = '+SVH.fmt(wd)+' (실제 진동 주파수)',
        '해 형태: \\(e^{-\\sigma t}(A\\cos\\omega_dt+B\\sin\\omega_dt)\\)' ] }; },
    hints:['근의 공식에서 실·허 분리.'] },
  { id:'u1-l3-04', level:3, type:'num', tags:['부분분수 중근'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[1,2,3]} },
    statement:function(p){ return '\\(\\dfrac{1}{s(s+'+p.a+')^2}=\\dfrac{A}{s}+\\dfrac{B}{s+'+p.a+'}+\\dfrac{C}{(s+'+p.a+')^2}\\)의 A·B·C를 구하라.'; },
    solve:function(p){ var A=1/(p.a*p.a), C=-1/p.a, B=-A;
      return { ans:{A:A, B:B, C:C}, unit:{A:'',B:'',C:''}, steps:[
        'A = 1/(s+'+p.a+')²|₀ = '+SVH.fmt(A),
        'C = 1/s|_{−'+p.a+'} = '+SVH.fmt(C),
        'B: 양변 s→∞ 계수 비교(1/s 차수) 0 = A+B → B = '+SVH.fmt(B) ] }; },
    hints:['중근은 C 먼저(커버업), B는 계수 비교.'] },
  { id:'u1-l3-05', level:3, type:'num', tags:['연립 ODE→행렬'], src:'창작 문제(검산됨)',
    params:{ k:{choices:[2,4]}, c:{choices:[1,3]} },
    statement:function(p){ return '\\(\\ddot x + '+p.c+'\\dot x + '+p.k+'x = 0\\)을 상태변수 \\(x_1=x, x_2=\\dot x\\)로 1차 연립 \\(\\dot{\\mathbf{x}}=A\\mathbf{x}\\)로 바꿀 때 A의 (2,1)·(2,2) 성분을 구하라.'; },
    solve:function(p){
      return { ans:{a21:-p.k, a22:-p.c}, unit:{a21:'', a22:''}, steps:[
        '\\(\\dot x_1 = x_2\\) → 1행 [0, 1]',
        '\\(\\dot x_2 = \\ddot x = -'+p.k+'x_1 -'+p.c+'x_2\\) → 2행 ['+(-p.k)+', '+(-p.c)+']',
        '(동반형(companion form) — U5 상태공간의 표준 절차)' ] }; },
    hints:['최고차 미분을 홀로 남기고 나머지를 넘긴다.'] },
  { id:'u1-l3-06', level:3, type:'num', tags:['테일러 선형화'], src:'창작 문제(검산됨)',
    params:{ x0:{choices:[1,2]}, n:{choices:[2,3]} },
    statement:function(p){ return '\\(f(x)=x^{'+p.n+'}\\)을 동작점 x₀='+p.x0+'에서 선형화하라: \\(f\\approx f(x_0)+m\\,\\delta x\\)의 f(x₀)와 기울기 m을 구하라.'; },
    solve:function(p){ var f0=Math.pow(p.x0,p.n), m=p.n*Math.pow(p.x0,p.n-1);
      return { ans:{f0:f0, m:m}, unit:{f0:'', m:''}, steps:[
        'f(x₀) = '+SVH.fmt(f0),
        'm = f′(x₀) = '+p.n+'x₀^{'+(p.n-1)+'} = '+SVH.fmt(m),
        '선형 모델: δf ≈ '+SVH.fmt(m)+'·δx (작은 편차에서만 유효)' ] }; },
    hints:['1차 테일러 전개.'] },
  { id:'u1-l3-07', level:3, type:'num', tags:['진자 선형화'], src:'교재 표준',
    params:{ L:{choices:[0.5,1,2],unit:'m'}, th:{choices:[10,20,30],unit:'°'} },
    statement:function(p){ return '진자 \\(\\ddot\\theta+(g/L)\\sin\\theta=0\\) (L='+p.L+' m, g=9.8)을 θ=0에서 선형화했을 때 (a) 고유진동수 ω₀ (b) θ='+p.th+'°에서 sinθ≈θ 근사의 상대오차(%)를 구하라.'; },
    solve:function(p){
      var w0=Math.sqrt(9.8/p.L);
      var th=SVH.rad(p.th), err=(th-Math.sin(th))/Math.sin(th)*100;
      return { ans:{w0:w0, err:err}, unit:{w0:'rad/s', err:'%'}, steps:[
        '선형화: sinθ≈θ → \\(\\ddot\\theta+(g/L)\\theta=0\\) → ω₀ = √(g/L) = '+SVH.fmt(w0),
        'θ='+p.th+'° = '+SVH.fmt(th)+' rad: 오차 = (θ−sinθ)/sinθ = '+SVH.fmt(err)+' %',
        '(선형화의 유효 범위를 수치로 확인 — Lec 계획의 Linearization 항목)' ] }; },
    hints:['라디안으로 바꿔 비교.'] },
  { id:'u1-l3-08', level:3, type:'num', tags:['스프링-질량 EOM'], src:'교재 표준',
    params:{ m:{choices:[1,2,4],unit:'kg'}, k:{choices:[16,36,64],unit:'N/m'} },
    statement:function(p){ return '질량 m='+p.m+' kg, 스프링 k='+p.k+' N/m (감쇠 없음). (a) EOM의 표준형 계수 ω₀ (b) 주기 T를 구하라.'; },
    solve:function(p){ var w0=Math.sqrt(p.k/p.m), T=2*Math.PI/w0;
      return { ans:{w0:w0, T:T}, unit:{w0:'rad/s', T:'s'}, steps:[
        '\\(m\\ddot x+kx=0\\) → ω₀ = √(k/m) = '+SVH.fmt(w0),
        'T = 2π/ω₀ = '+SVH.fmt(T)+' s' ] }; },
    hints:['뉴턴 2법칙 → 표준형.'] },
  { id:'u1-l3-09', level:3, type:'num', tags:['2×2 연립'], src:'창작 문제(검산됨)',
    params:{ a:{min:2,max:4,step:1}, b:{min:1,max:2,step:1}, c:{min:1,max:2,step:1}, d:{min:3,max:5,step:1}, e:{min:4,max:10,step:2}, f:{min:2,max:8,step:2} },
    constraint:function(p){ return p.a*p.d-p.b*p.c!==0; },
    statement:function(p){ return '연립 \\('+p.a+'x+'+p.b+'y='+p.e+',\\ '+p.c+'x+'+p.d+'y='+p.f+'\\)를 크래머로 풀어라.'; },
    solve:function(p){ var s=SVH.solve2(p.a,p.b,p.e,p.c,p.d,p.f);
      return { ans:{x:s[0], y:s[1]}, unit:{x:'', y:''}, steps:[
        'D = '+SVH.fmt(p.a*p.d-p.b*p.c),
        'x = '+SVH.fmt(s[0])+', y = '+SVH.fmt(s[1])+' (블록선도 연립·부분분수 계수에 반복 사용)' ] }; },
    hints:['크래머 공식.'] },
  { id:'u1-l3-10', level:3, type:'num', tags:['복소근→시간응답'], src:'창작 문제(검산됨)',
    params:{ sg:{choices:[1,2]}, wd:{choices:[3,4]}, t1:{choices:[0.5,1]} },
    statement:function(p){ return '특성근이 \\(s=-'+p.sg+'\\pm j'+p.wd+'\\)이고 \\(y(0)=1,\\dot y(0)=0\\)일 때 해 \\(y=e^{-\\sigma t}(\\cos\\omega_dt+\\frac{\\sigma}{\\omega_d}\\sin\\omega_dt)\\)의 t='+p.t1+' 값을 구하라.'; },
    solve:function(p){
      var y=Math.exp(-p.sg*p.t1)*(Math.cos(p.wd*p.t1)+p.sg/p.wd*Math.sin(p.wd*p.t1));
      return { ans:y, unit:'', steps:[
        '주어진 해에 대입: e^{−'+SVH.fmt(p.sg*p.t1)+'}(cos'+SVH.fmt(p.wd*p.t1)+'+'+SVH.fmt(p.sg/p.wd)+'sin'+SVH.fmt(p.wd*p.t1)+')',
        '= '+SVH.fmt(y)+' (근 위치 → 응답 수치의 직통 연결)' ] }; },
    hints:['그냥 대입 — 라디안 주의.'] },
  { id:'u1-l3-11', level:3, type:'num', tags:['오일러 활용'], src:'창작 문제(검산됨)',
    params:{ th:{choices:[30,45,60]} },
    statement:function(p){ return '오일러 공식으로 \\(\\cos'+p.th+'° = \\frac{e^{j\\theta}+e^{-j\\theta}}{2}\\)를 수치 확인하라: 우변을 계산해 cos'+p.th+'°와 비교하라. (값으로 답)'; },
    solve:function(p){ var v=Math.cos(SVH.rad(p.th));
      return { ans:v, unit:'', steps:[
        '\\(e^{j\\theta}+e^{-j\\theta} = 2\\cos\\theta\\) (허수부 상쇄)',
        '= '+SVH.fmt(v)+' — 역변환에서 복소 켤레쌍이 실수 정현파가 되는 이유' ] }; },
    hints:['켤레쌍 합은 실수.'] },
  { id:'u1-l3-12', level:3, type:'num', tags:['RLC-기계 유추'], src:'교재 표준',
    params:{ m:{choices:[2,4],unit:'kg'}, c:{choices:[8,12],unit:'N·s/m'}, k:{choices:[50,100],unit:'N/m'} },
    statement:function(p){ return '기계계 \\(m\\ddot x+c\\dot x+kx=F\\) (m='+p.m+', c='+p.c+', k='+p.k+')의 ζ를 구하고, 전기 유추(L↔m, R↔c, 1/C↔k)에서 대응하는 직렬 RLC의 ζ 식이 같음을 확인하라. (ζ 값으로)'; },
    solve:function(p){ var z=p.c/(2*Math.sqrt(p.k*p.m));
      return { ans:z, unit:'', steps:[
        'ζ = c/(2√(km)) = '+p.c+'/(2√'+SVH.fmt(p.k*p.m)+') = '+SVH.fmt(z),
        '전기: ζ = R/(2√(L/C))... = (R/2)√(C/L) — 유추로 같은 구조 (Nise Ch2 electric analogs)' ] }; },
    hints:['2차 표준형 계수 비교는 어느 물리계든 같다.'] },
  { id:'u1-l3-13', level:3, type:'num', tags:['로그 스케일'], src:'창작 문제(검산됨)',
    params:{ g:{choices:[0.5,2,10,100]} },
    statement:function(p){ return '이득 '+p.g+'을 dB로, 그리고 dB 20·log의 역으로 그 dB에서 이득을 복원해 일치를 확인하라. (dB 값으로 답)'; },
    solve:function(p){ var db=20*Math.log10(p.g);
      return { ans:db, unit:'dB', steps:[
        'dB = 20log₁₀('+p.g+') = '+SVH.fmt(db),
        '복원: 10^{'+SVH.fmt(db)+'/20} = '+SVH.fmt(Math.pow(10,db/20))+' ✓ (기말 보드선도의 산수)' ] }; },
    hints:['20log — 전압/이득 비.'] },
  { id:'u1-l3-14', level:3, type:'num', tags:['차원 검사'], src:'창작 문제(검산됨)',
    params:{ m:{choices:[1,2],unit:'kg'}, k:{choices:[9,25],unit:'N/m'} },
    statement:function(p){ return '\\(\\omega_0=\\sqrt{k/m}\\)의 단위가 rad/s임을 차원 분석으로 보이고, m='+p.m+' kg·k='+p.k+' N/m로 값을 구하라.'; },
    solve:function(p){ var w0=Math.sqrt(p.k/p.m);
      return { ans:w0, unit:'rad/s', steps:[
        '[k/m] = (N/m)/kg = (kg/s²)/kg = 1/s² → √ = 1/s ✓',
        'ω₀ = √('+p.k+'/'+p.m+') = '+SVH.fmt(w0)+' rad/s',
        '(모든 유도의 마지막에 차원 체크 — 이 과목의 습관)' ] }; },
    hints:['N = kg·m/s².'] },

  /* ---------- L4 (8) ---------- */
  { id:'u1-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'옳은 것을 모두 고르면?<br>㉠ 특성근의 실수부가 모두 음수면 자유응답은 0으로 수렴한다<br>㉡ 선형화는 동작점 근방에서만 유효하다<br>㉢ 복소 특성근은 항상 켤레쌍으로 나타난다(실계수 ODE)<br>㉣ 2×2 행렬의 고유값 합은 대각합(trace)과 같다',
    choices:['전부','㉠㉡㉢','㉠㉢㉣','㉡㉣'],
    answer:0, expl:'모두 참. ㉣: λ₁+λ₂=tr(A), λ₁λ₂=det(A) — 특성방정식 계수와 근의 관계.' },
  { id:'u1-l4-02', level:4, type:'num', tags:['MSD 완전 해석'], src:'기출 유형',
    params:{ m:{choices:[1,2],unit:'kg'}, c:{choices:[4,6],unit:'N·s/m'}, k:{choices:[20,40],unit:'N/m'} },
    statement:function(p){ return '질량-감쇠-스프링계(m='+p.m+', c='+p.c+', k='+p.k+')의 자유진동: (a) ω₀ (b) ζ (c) ω_d (d) 진폭이 1/e로 줄어드는 시간을 구하라.'; },
    solve:function(p){
      var w0=Math.sqrt(p.k/p.m), z=p.c/(2*Math.sqrt(p.k*p.m));
      var wd=w0*Math.sqrt(1-z*z), te=1/(z*w0);
      return { ans:{w0:w0, z:z, wd:wd, te:te}, unit:{w0:'rad/s', z:'', wd:'rad/s', te:'s'}, steps:[
        'ω₀ = √(k/m) = '+SVH.fmt(w0)+', ζ = c/(2√(km)) = '+SVH.fmt(z),
        'ω_d = ω₀√(1−ζ²) = '+SVH.fmt(wd),
        '봉투 e^{−ζω₀t} → 1/e 시간 = 1/(ζω₀) = '+SVH.fmt(te)+' s' ] }; },
    hints:['표준형 3종(ω₀·ζ·ω_d) + 봉투 시정수.'] },
  { id:'u1-l4-03', level:4, type:'num', tags:['선형화 유효범위'], src:'기출 유형',
    params:{ pct:{choices:[1,5]} },
    statement:function(p){ return 'sinθ≈θ 근사의 상대오차가 '+p.pct+'%가 되는 각도(°)를 구하라. (θ−sinθ)/sinθ = '+p.pct+'/100 을 수치로 풀어라.'; },
    solve:function(p){
      // 이분법으로 수치 풀이 (solver도 러너도 같은 코드)
      var target=p.pct/100, lo=0.01, hi=1.5;
      for(var i=0;i<60;i++){ var mid=(lo+hi)/2, e=(mid-Math.sin(mid))/Math.sin(mid); if(e<target) lo=mid; else hi=mid; }
      var th=SVH.deg((lo+hi)/2);
      return { ans:th, unit:'°', steps:[
        '오차식 (θ−sinθ)/sinθ는 θ와 함께 단조 증가 → 수치 풀이',
        'θ ≈ '+SVH.fmt(th)+'° ('+p.pct+'% 기준)',
        '(근사 θ³/6/θ = θ²/6 로도 추정 가능: θ≈√(6×'+target+') rad = '+SVH.fmt(SVH.deg(Math.sqrt(6*target)))+'° — 근접 확인)' ] }; },
    hints:['테일러 나머지 θ³/6로 초기 추정.'] },
  { id:'u1-l4-04', level:4, type:'derive', tags:['유도'], src:'교재 표준',
    statement:'2차 ODE \\(\\ddot y+2\\zeta\\omega_0\\dot y+\\omega_0^2y=0\\) (0<ζ<1)의 일반해가 감쇠 정현파임을 특성방정식에서 유도하라.',
    steps:[
      '\\(y=e^{st}\\) 대입 → \\(s^2+2\\zeta\\omega_0 s+\\omega_0^2=0\\) [왜] 지수는 미분해도 자기 자신 — 선형 상수계수의 열쇠',
      '근: \\(s=-\\zeta\\omega_0\\pm\\omega_0\\sqrt{\\zeta^2-1}\\) — 0<ζ<1이면 근호 안이 음수 → \\(s=-\\zeta\\omega_0\\pm j\\omega_d\\), \\(\\omega_d=\\omega_0\\sqrt{1-\\zeta^2}\\)',
      '일반해: \\(y=e^{-\\zeta\\omega_0t}(C_1e^{j\\omega_dt}+C_2e^{-j\\omega_dt})\\) — 실해이려면 C₂=C₁* (켤레)',
      '오일러로 정리: \\(y=e^{-\\zeta\\omega_0t}(A\\cos\\omega_dt+B\\sin\\omega_dt)\\) — 봉투 × 진동',
      '극한 체크: ζ→0 ⇒ 순수 진동 ✓ · ζ→1 ⇒ ω_d→0 (임계) ✓ · 차원: [ζω₀]=1/s ✓'
    ],
    hints:['e^{st} 대입 → 복소근 → 오일러.','실수 해 조건이 켤레쌍을 강제한다.'],
    expl:'U6 시간응답·U7 안정성의 수학적 기초 — 이 유도가 몸에 있으면 절반은 끝.' },
  { id:'u1-l4-05', level:4, type:'num', tags:['부분분수 복소근'], src:'기출 유형',
    params:{ a:{choices:[2,4]}, w:{choices:[3,5]} },
    statement:function(p){ return '\\(F(s)=\\dfrac{'+(p.a*p.a+p.w*p.w)+'}{s[(s+'+p.a+')^2+'+(p.w*p.w)+']}\\)를 \\(\\frac{A}{s}+\\frac{Bs+C}{(s+'+p.a+')^2+'+(p.w*p.w)+'}\\)로 전개할 때 A·B·C를 구하라. (분자 = ω₀² = '+(p.a*p.a+p.w*p.w)+')'; },
    solve:function(p){
      var w02=p.a*p.a+p.w*p.w;
      var A=1;            // w02 / w02
      var B=-1, C=-2*p.a; // 표준 결과: 1/s - (s+2a)/((s+a)²+w²)
      return { ans:{A:A, B:B, C:C}, unit:{A:'',B:'',C:''}, steps:[
        'A = F(s)·s|₀ = '+w02+'/'+w02+' = 1',
        '통분 비교: 분자 '+w02+' = A[(s+'+p.a+')²+'+(p.w*p.w)+'] + (Bs+C)s',
        's² 계수: 0=A+B → B=−1 · s¹ 계수: 0=2aA+C → C=−'+(2*p.a),
        '(이 꼴이 2차계 스텝 응답 역변환의 표준 전개 — U6에서 재등장)' ] }; },
    hints:['A는 커버업, 나머지는 계수 비교.'] },
  { id:'u1-l4-06', level:4, type:'num', tags:['고유값 안정성'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[1,2]}, b:{choices:[3,5]} },
    statement:function(p){ return '\\(A=\\begin{bmatrix}0&1\\\\-'+p.b+'&-'+p.a+'\\end{bmatrix}\\)의 (a) 특성방정식 계수 (b) 고유값 실수부 (c) 안정 여부(안정=1/불안정=0)를 구하라.'; },
    solve:function(p){
      var D=p.a*p.a-4*p.b;
      var re = D>=0 ? (-p.a+Math.sqrt(D))/2 : -p.a/2; // 최대 실수부
      return { ans:{tr:-p.a, det:p.b, re:re, stable:re<0?1:0}, unit:{tr:'(합)', det:'(곱)', re:'', stable:''}, steps:[
        'det(λI−A) = λ²+'+p.a+'λ+'+p.b+' (동반형이라 계수가 바로 보인다)',
        '근의 합 = −'+p.a+', 곱 = '+p.b+' → 최대 실수부 = '+SVH.fmt(re),
        '실수부 전부 음수 → 안정(1) — Routh(U7)의 2차 특례: 모든 계수 양수 ⇔ 안정' ] }; },
    hints:['동반형의 특성다항식은 마지막 행에서 읽는다.'] },
  { id:'u1-l4-07', level:4, type:'num', tags:['측정→모델'], src:'기출 유형',
    params:{ T:{choices:[0.5,1],unit:'s'}, r:{choices:[0.3,0.5]} },
    statement:function(p){ return '자유진동 실측: 주기 '+p.T+' s, 한 주기마다 진폭이 '+p.r+'배. (a) ω_d (b) ζω₀(=σ) (c) ζ (d) ω₀를 구하라. (로그 감쇠법 — MSD 파라미터 역추정)'; },
    solve:function(p){
      var wd=2*Math.PI/p.T, sg=-Math.log(p.r)/p.T;
      var w0=Math.hypot(sg,wd), z=sg/w0;
      return { ans:{wd:wd, sg:sg, z:z, w0:w0}, unit:{wd:'rad/s', sg:'1/s', z:'', w0:'rad/s'}, steps:[
        'ω_d = 2π/T = '+SVH.fmt(wd),
        'σ = −ln('+p.r+')/T = '+SVH.fmt(sg),
        'ω₀ = √(σ²+ω_d²) = '+SVH.fmt(w0)+', ζ = σ/ω₀ = '+SVH.fmt(z),
        '(실험 데이터→모델 파라미터 — HW·기말 실전 기술)' ] }; },
    hints:['주기와 감쇠비 두 측정이면 2차계는 완전 결정.'] },
  { id:'u1-l4-08', level:4, type:'num', tags:['비선형 탱크 선형화'], src:'기출 유형',
    params:{ A:{choices:[1,2],unit:'m²'}, k:{choices:[0.5,1]}, h0:{choices:[1,4],unit:'m'} },
    statement:function(p){ return '탱크 모델 \\(A\\dot h = q_{in} - k\\sqrt{h}\\) (A='+p.A+', k='+p.k+'). 동작점 h₀='+p.h0+' m에서 (a) 평형 유입량 q₀ (b) 선형화 계수 \\(\\partial(k\\sqrt h)/\\partial h|_{h_0}\\) (c) 선형화된 시정수 τ=A/그 계수를 구하라.'; },
    solve:function(p){
      var q0=p.k*Math.sqrt(p.h0);
      var m=p.k/(2*Math.sqrt(p.h0));
      var tau=p.A/m;
      return { ans:{q0:q0, m:m, tau:tau}, unit:{q0:'m³/s', m:'', tau:'s'}, steps:[
        '평형: q₀ = k√h₀ = '+SVH.fmt(q0),
        '기울기 = k/(2√h₀) = '+SVH.fmt(m),
        '선형 모델 \\(A\\,\\delta\\dot h = \\delta q - '+SVH.fmt(m)+'\\delta h\\) → τ = A/'+SVH.fmt(m)+' = '+SVH.fmt(tau)+' s',
        '(비선형→선형→1차계 시정수: Lec 계획 Linearization의 종착지)' ] }; },
    hints:['√h의 미분 = 1/(2√h).','시정수는 계수비.'] }
  ]
});

  /* ---------- L2 (12) ---------- */
  { id:'u2-l2-01', level:2, type:'num', tags:['변환 계산'], src:'창작 문제(검산됨)',

  { id:'u2-l2-02', level:2, type:'num', tags:['sin 변환'], src:'창작 문제(검산됨)',

  { id:'u2-l2-03', level:2, type:'num', tags:['감쇠 정현파 변환'], src:'창작 문제(검산됨)',

  { id:'u2-l2-04', level:2, type:'num', tags:['미분 정리 적용'], src:'창작 문제(검산됨)',

    statement:function(p){ return '\\(\\dot y+'+p.a+'y=0,\\ y(0)='+p.y0+'\\)을 라플라스로 풀어 Y(s)의 s=0에서 값 y(0⁺) 검증용으로 \\(\\lim_{s\\to\\infty}sY(s)\\)를 구하라.'; },

  { id:'u2-l2-05', level:2, type:'num', tags:['부분분수 역변환'], src:'창작 문제(검산됨)',

    statement:function(p){ return '\\(F(s)=\\dfrac{'+(p.p2-p.p1)+'}{(s+'+p.p1+')(s+'+p.p2+')}\\)의 f(t)를 구하고 t='+p.t1+'에서 값을 구하라.'; },

  { id:'u2-l2-07', level:2, type:'num', tags:['시간 지연'], src:'창작 문제(검산됨)',

  { id:'u2-l2-08', level:2, type:'num', tags:['램프 응답 성분'], src:'창작 문제(검산됨)',

  { id:'u2-l2-09', level:2, type:'num', tags:['적분 정리'], src:'창작 문제(검산됨)',

  { id:'u2-l2-10', level:2, type:'num', tags:['t·지수'], src:'창작 문제(검산됨)',

    statement:function(p){ return '\\(F(s)=\\dfrac{1}{(s+'+p.a+')^2}\\)의 f(t)와 t='+p.t1+' 값, 그리고 f가 최대가 되는 시각을 구하라.'; },

  { id:'u2-l2-11', level:2, type:'num', tags:['초기값 정리'], src:'창작 문제(검산됨)',

  { id:'u2-l2-12', level:2, type:'num', tags:['cos 변환'], src:'창작 문제(검산됨)',

  /* ---------- L3 (14) ---------- */
  { id:'u2-l3-01', level:3, type:'num', tags:['ODE 완주'], src:'기출 유형',
    params:{ a:{choices:[3,5]}, K:{choices:[6,10]}, t1:{choices:[0.5,1]} },
    statement:function(p){ return '\\(\\dot y+'+p.a+'y='+p.K+'u(t)\\), y(0)=0을 라플라스로 풀어 y(t)와 t='+p.t1+' 값을 구하라.'; },

  { id:'u2-l3-02', level:3, type:'num', tags:['초기조건 있는 ODE'], src:'기출 유형',

    hints:['초기조건이 분자에 들어온다.'] },
  { id:'u2-l3-03', level:3, type:'num', tags:['2차 ODE 스텝'], src:'기출 유형',
    params:{ w:{choices:[2,3]}, t1:{choices:[1,2]} },
    statement:function(p){ return '\\(\\ddot y+'+(p.w*p.w)+'y='+(p.w*p.w)+'u(t)\\), 초기 0의 y(t)와 t='+p.t1+' 값을 구하라. (무감쇠 스텝 응답)'; },

        't='+p.t1+': '+SVH.fmt(v) ] }; },

  { id:'u2-l3-04', level:3, type:'num', tags:['복소근 역변환'], src:'기출 유형',

    solve:function(p){ var v=Math.exp(-p.a*p.t1)*Math.sin(p.w*p.t1);

        't='+p.t1+': '+SVH.fmt(v)+' (전개하지 말고 꼴을 맞추는 것이 요령)' ] }; },
    hints:['(s+a)²+ω² 꼴을 보면 감쇠 sin/cos.'] },
  { id:'u2-l3-05', level:3, type:'num', tags:['복소근+완전제곱 변형'], src:'기출 유형',
    params:{ b:{choices:[2,4]}, c:{choices:[13,20,29]}, t1:{choices:[0.5]} },
    constraint:function(p){ return p.c>p.b*p.b/4; },
    statement:function(p){ return '\\(F(s)=\\dfrac{s+'+p.b+'}{s^2+'+p.b+'s+'+p.c+'}\\)를 완전제곱으로 정리해 f(t)를 구하고 t='+p.t1+' 값을 구하라.'; },
    solve:function(p){
      var a=p.b/2, w=Math.sqrt(p.c-a*a);
      var v=Math.exp(-a*p.t1)*(Math.cos(w*p.t1)+(a/w)*Math.sin(w*p.t1));
      return { ans:v, unit:'', steps:[
        '분모 = (s+'+SVH.fmt(a)+')²+'+SVH.fmt(w*w)+' → σ='+SVH.fmt(a)+', ω_d='+SVH.fmt(w),
        '분자 s+'+p.b+' = (s+'+SVH.fmt(a)+')+'+SVH.fmt(a)+' → cos항 + (σ/ω_d)sin항',
        'f = e^{−'+SVH.fmt(a)+'t}[cos'+SVH.fmt(w)+'t+'+SVH.fmt(a/w)+'sin'+SVH.fmt(w)+'t], t='+p.t1+': '+SVH.fmt(v) ] }; },
    hints:['분자를 (s+a)와 상수로 쪼갠다.'] },
  { id:'u2-l3-06', level:3, type:'num', tags:['3극점 전개'], src:'기출 유형',
    params:{ K:{choices:[24,30]}, t1:{choices:[0.5]} },
    statement:function(p){ return '\\(Y(s)=\\dfrac{'+p.K+'}{s(s+2)(s+3)}\\)의 y(t)를 구하고 (a) y(∞) (b) t='+p.t1+' 값을 구하라.'; },
    solve:function(p){
      var A=p.K/6, B=-p.K/2, C=p.K/3;
      var yinf=A;
      var v=A+B*Math.exp(-2*p.t1)+C*Math.exp(-3*p.t1);
      return { ans:{yinf:yinf, v:v}, unit:{yinf:'', v:''}, steps:[
        '커버업: A='+p.K+'/6='+SVH.fmt(A)+', B='+p.K+'/(−2·1)='+SVH.fmt(B)+', C='+p.K+'/(−3·−1)='+SVH.fmt(C),
        'y = '+SVH.fmt(A)+' '+(B<0?'−':'+')+' '+SVH.fmt(Math.abs(B))+'e^{−2t} + '+SVH.fmt(C)+'e^{−3t}',
        'y(∞)='+SVH.fmt(yinf)+' (최종값 정리 일치), t='+p.t1+': '+SVH.fmt(v) ] }; },
    hints:['세 극점 커버업 세 번.'] },
  { id:'u2-l3-07', level:3, type:'num', tags:['미분방정식 2차 완주'], src:'기출 유형',
    params:{ a:{choices:[5,7]}, b6:{choices:[6,12]}, t1:{choices:[0.5,1]} },
    constraint:function(p){ return p.a*p.a>4*p.b6; },
    statement:function(p){ return '\\(\\ddot y+'+p.a+'\\dot y+'+p.b6+'y=0\\), y(0)=1, \\(\\dot y(0)=0\\)의 y(t)와 t='+p.t1+' 값을 구하라. (과감쇠)'; },
    solve:function(p){
      var D=Math.sqrt(p.a*p.a-4*p.b6);
      var r1=(-p.a+D)/2, r2=(-p.a-D)/2;
      var A=-r2/(r1-r2), B=r1/(r1-r2);
      var v=A*Math.exp(r1*p.t1)+B*Math.exp(r2*p.t1);
      return { ans:v, unit:'', steps:[
        '근: '+SVH.fmt(r1)+', '+SVH.fmt(r2)+' (실근 2개)',
        'Y = (s+'+p.a+')/[(s−λ₁)(s−λ₂)] → A='+SVH.fmt(A)+', B='+SVH.fmt(B),
        'y = '+SVH.fmt(A)+'e^{'+SVH.fmt(r1)+'t}+'+SVH.fmt(B)+'e^{'+SVH.fmt(r2)+'t}, t='+p.t1+': '+SVH.fmt(v) ] }; },
    hints:['초기조건 반영: 분자 = s+a (y0=1, ẏ0=0일 때).'] },
  { id:'u2-l3-08', level:3, type:'num', tags:['tf에서 응답까지'], src:'기출 유형',
    params:{ K:{choices:[4,8]}, a:{choices:[2,4]} },
    statement:function(p){ return '시스템 \\(G(s)=\\dfrac{'+p.K+'}{s+'+p.a+'}\\)에 임펄스 입력. (a) 출력 y(t) (b) 출력의 총 적분 \\(\\int_0^\\infty y\\,dt\\)를 구하라.'; },
    solve:function(p){
      var I=p.K/p.a;
      return { ans:{y0:p.K, I:I}, unit:{y0:'(t=0값)', I:''}, steps:[
        '임펄스 응답 = 역변환 그 자체: y = '+p.K+'e^{−'+p.a+'t} → y(0⁺)='+p.K,
        '∫y dt = Y(0) = G(0) = '+SVH.fmt(I)+' (s=0 대입 = 적분값 — DC 이득의 의미)' ] }; },
    hints:['G(0)=DC 이득=총 적분.'] },
  { id:'u2-l3-09', level:3, type:'num', tags:['주기 신호 조합'], src:'창작 문제(검산됨)',
    params:{ A:{choices:[2,3]}, w:{choices:[2,4]}, a:{choices:[1,2]} },
    statement:function(p){ return '\\(f(t)='+p.A+'(1-e^{-'+p.a+'t})+\\sin'+p.w+'t\\)의 F(s)를 구하고 s=1에서 값을 구하라.'; },
    solve:function(p){
      var v=p.A*(1/1-1/(1+p.a))+p.w/(1+p.w*p.w);
      return { ans:v, unit:'', steps:[
        'F = '+p.A+'[1/s − 1/(s+'+p.a+')] + '+p.w+'/(s²+'+(p.w*p.w)+')',
        's=1: '+p.A+'(1−'+SVH.fmt(1/(1+p.a))+')+'+SVH.fmt(p.w/(1+p.w*p.w))+' = '+SVH.fmt(v) ] }; },
    hints:['선형성으로 항별 변환.'] },
  { id:'u2-l3-10', level:3, type:'num', tags:['최종값 정리 함정'], src:'기출 유형',
    params:{ w:{choices:[2,3]} },
    statement:function(p){ return '\\(F(s)=\\dfrac{'+p.w+'}{s^2+'+(p.w*p.w)+'}\\) (sin'+p.w+'t)에 최종값 정리를 형식 적용한 값과, 실제 극한의 존재 여부(존재=1/부재=0)를 답하라.'; },
    solve:function(p){
      return { ans:{formal:0, exists:0}, unit:{formal:'', exists:''}, steps:[
        '형식 적용: lim s·F = 0 — 그러나!',
        'sF의 극점 ±j'+p.w+'가 허수축 → 적용 조건 위반. sin은 진동해 극한 부재(0)',
        '(조건 확인 없이 쓰면 "0으로 수렴"이라는 오답 — 시험 함정 단골)' ] }; },
    hints:['정리의 전제(극점 위치)부터.'] },
  { id:'u2-l3-11', level:3, type:'num', tags:['지연 응답'], src:'창작 문제(검산됨)',
    params:{ T:{choices:[1,2]}, a:{choices:[2,3]}, t1:{choices:[2.5,3]} },
    constraint:function(p){ return p.t1>p.T; },
    statement:function(p){ return '\\(Y(s)=\\dfrac{e^{-'+p.T+'s}}{s(s+'+p.a+')}\\)·'+p.a+'의 y(t)를 구하고 t='+p.t1+' 값을 구하라.'; },
    solve:function(p){
      var v=1-Math.exp(-p.a*(p.t1-p.T));
      return { ans:v, unit:'', steps:[
        '지연 없는 부분: '+p.a+'/[s(s+'+p.a+')] → 1−e^{−'+p.a+'t}',
        '지연 정리: y = [1−e^{−'+p.a+'(t−'+p.T+')}]u(t−'+p.T+')',
        't='+p.t1+': '+SVH.fmt(v)+' (수송 지연이 있는 공정 모델의 원형)' ] }; },
    hints:['먼저 지연 없이 역변환, 마지막에 t→t−T.'] },
  { id:'u2-l3-12', level:3, type:'num', tags:['s영역 대수'], src:'기출 유형',
    params:{ a:{choices:[2,3]}, b:{choices:[4,6]} },
    statement:function(p){ return '\\(\\dot y+'+p.a+'y=\\dot u+'+p.b+'u\\)에서 (초기 0) 전달함수 G(s)=Y/U를 구하고, u=단위 스텝일 때 y(0⁺)와 y(∞)를 구하라.'; },
    solve:function(p){
      return { ans:{y0:1, yinf:p.b/p.a}, unit:{y0:'', yinf:''}, steps:[
        'G = (s+'+p.b+')/(s+'+p.a+')',
        'y(0⁺) = lim_{s→∞} s·G/s = 1 (분자 s의 즉시 전달 — 영점 효과)',
        'y(∞) = G(0) = '+p.b+'/'+p.a+' = '+SVH.fmt(p.b/p.a)+' (점프 후 정착 — U6 영점 있는 응답의 예고)' ] }; },
    hints:['초기값·최종값 정리를 G에 바로.'] },
  { id:'u2-l3-13', level:3, type:'num', tags:['부분분수 4항'], src:'기출 유형',
    params:{ a:{choices:[1,2]} },
    statement:function(p){ return '\\(F(s)=\\dfrac{1}{s^2(s+'+p.a+')}\\)를 전개해 f(t)를 구하고 t=1에서 값을 구하라.'; },
    solve:function(p){
      var v=1/p.a*1-1/(p.a*p.a)+Math.exp(-p.a)/(p.a*p.a);
      return { ans:v, unit:'', steps:[
        '전개: 1/[s²(s+'+p.a+')] = (1/'+p.a+')/s² − (1/'+(p.a*p.a)+')/s + (1/'+(p.a*p.a)+')/(s+'+p.a+')',
        'f = t/'+p.a+' − 1/'+(p.a*p.a)+' + e^{−'+p.a+'t}/'+(p.a*p.a),
        't=1: '+SVH.fmt(v)+' (램프 추종 오차 구조)' ] }; },
    hints:['s² 커버업 → s 계수 비교 → 극점 커버업.'] },
  { id:'u2-l3-14', level:3, type:'num', tags:['에너지·적분 응용'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[2,4]}, A:{choices:[3,5]} },
    statement:function(p){ return '\\(f(t)='+p.A+'e^{-'+p.a+'t}\\)에 대해 \\(\\int_0^\\infty f(t)dt\\)를 (a) 직접 적분 (b) F(0)으로 각각 구해 일치를 확인하라. (값)'; },
    solve:function(p){ var v=p.A/p.a;
      return { ans:v, unit:'', steps:[
        '직접: '+p.A+'/'+p.a+' = '+SVH.fmt(v),
        'F(s)='+p.A+'/(s+'+p.a+') → F(0)='+SVH.fmt(v)+' ✓ (같은 값 — s=0 대입=총 적분의 일반 원리)' ] }; },
    hints:['두 경로 모두 한 줄씩.'] },

  /* ---------- L4 (8) ---------- */
  { id:'u2-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'옳은 것을 모두 고르면?<br>㉠ 최종값 정리는 sF(s)의 극점이 모두 좌반평면일 때만 유효하다<br>㉡ \\(\\mathcal{L}\\{t f(t)\\}=-dF/ds\\)<br>㉢ 시간 지연 T는 s영역에서 \\(e^{-Ts}\\) 곱이다<br>㉣ 부분분수의 복소 켤레 극점쌍은 실수 감쇠 정현파 하나로 합쳐진다',
    choices:['전부','㉠㉢','㉠㉡㉢','㉡㉣'],
    answer:0, expl:'전부 참. ㉡은 s미분 정리 — t·e^{-at} 쌍(중근)의 출처이기도 하다.' },
  { id:'u2-l4-02', level:4, type:'num', tags:['2차 스텝 완주(부족감쇠)'], src:'기출 유형',
    params:{ z:{choices:[0.5,0.6]}, w0:{choices:[2,4]}, t1:{choices:[1]} },
    statement:function(p){ return '\\(G(s)=\\dfrac{\\omega_0^2}{s^2+2\\zeta\\omega_0 s+\\omega_0^2}\\) (ζ='+p.z+', ω₀='+p.w0+')의 단위 스텝 응답 \\(y(t)=1-\\dfrac{e^{-\\zeta\\omega_0t}}{\\sqrt{1-\\zeta^2}}\\sin(\\omega_dt+\\phi)\\), \\(\\phi=\\cos^{-1}\\zeta\\)를 이용해 t='+p.t1+'에서 y를 구하라.'; },
    solve:function(p){
      var wd=p.w0*Math.sqrt(1-p.z*p.z), ph=Math.acos(p.z);
      var v=1-Math.exp(-p.z*p.w0*p.t1)/Math.sqrt(1-p.z*p.z)*Math.sin(wd*p.t1+ph);
      return { ans:v, unit:'', steps:[
        'ω_d = '+SVH.fmt(wd)+', φ = cos⁻¹'+p.z+' = '+SVH.fmt(ph)+' rad',
        'y(1) = 1 − e^{−'+SVH.fmt(p.z*p.w0)+'}/'+SVH.fmt(Math.sqrt(1-p.z*p.z))+'·sin('+SVH.fmt(wd)+'+'+SVH.fmt(ph)+')',
        '= '+SVH.fmt(v)+' (U6 표준 공식의 수치 체감 — 유도는 부분분수 복소근 전개)' ] }; },
    hints:['공식에 정확 대입 — 라디안.'] },
  { id:'u2-l4-03', level:4, type:'derive', tags:['유도'], src:'교재 표준',
    statement:'미분 정리 \\(\\mathcal{L}\\{\\dot f\\}=sF(s)-f(0)\\)을 정의에서 부분적분으로 유도하고, 이것이 "ODE→대수"의 열쇠임을 설명하라.',
    steps:[
      '정의: \\(\\mathcal{L}\\{\\dot f\\}=\\int_0^\\infty \\dot f e^{-st}dt\\) [무엇을] 도함수를 정의에 [왜] 성질은 전부 정의에서 나온다',
      '부분적분(u=e^{-st}, dv=ḟdt): \\(=[fe^{-st}]_0^\\infty + s\\int_0^\\infty fe^{-st}dt\\)',
      '수렴 조건(f가 지수 차수)에서 상한 소멸: \\(=-f(0)+sF(s)\\)',
      '반복 적용: \\(\\mathcal{L}\\{\\ddot f\\}=s^2F-sf(0)-\\dot f(0)\\) — 미분마다 s 곱 + 초기항',
      '의의: n차 ODE가 s의 n차 대수식으로 → 풀고 역변환. 극한 체크: f 상수면 ḟ=0 ↔ sF−f(0)=0 ✓ · 차원: [s][F]=[f] ✓'
    ],
    hints:['부분적분 한 번.','경계항이 초기조건이 된다.'],
    expl:'전달함수(U3)의 "초기조건 0" 가정이 어디서 오는지도 이 유도가 답한다.' },
  { id:'u2-l4-04', level:4, type:'num', tags:['임의 초기조건 2차'], src:'기출 유형',
    params:{ y0:{choices:[1,2]}, v0:{choices:[0,2]}, t1:{choices:[0.5]} },
    statement:function(p){ return '\\(\\ddot y+2\\dot y+5y=0\\), y(0)='+p.y0+', \\(\\dot y(0)='+p.v0+'\\)을 라플라스로 풀어 t='+p.t1+'의 y를 구하라.'; },
    solve:function(p){
      // Y = [y0 s + (v0+2y0)]/(s²+2s+5), 분모=(s+1)²+4
      var A=p.y0, B=(p.v0+2*p.y0-p.y0)/2; // cos계수 A, sin계수: (v0+ y0)/2? 정리:
      // y = e^{-t}[y0 cos2t + ((v0+y0)/2) sin2t]
      var c2=(p.v0+p.y0)/2;
      var v=Math.exp(-p.t1)*(p.y0*Math.cos(2*p.t1)+c2*Math.sin(2*p.t1));
      return { ans:v, unit:'', steps:[
        'Y = ['+p.y0+'s+'+(p.v0+2*p.y0)+']/[(s+1)²+4]',
        '분자 재배열: '+p.y0+'(s+1)+'+SVH.fmt(p.v0+p.y0)+' → cos항 '+p.y0+', sin항 '+SVH.fmt(c2),
        'y = e^{−t}['+p.y0+'cos2t+'+SVH.fmt(c2)+'sin2t], t='+p.t1+': '+SVH.fmt(v) ] }; },
    hints:['분자를 (s+1)과 상수로 나눠 cos·sin 배정.'] },
  { id:'u2-l4-05', level:4, type:'num', tags:['정리 종합 검산'], src:'기출 유형',
    params:{ K:{choices:[10,20]}, a:{choices:[2,5]}, b:{choices:[4,10]} },
    statement:function(p){ return '\\(Y(s)=\\dfrac{'+p.K+'(s+'+p.b+')}{s(s+'+p.a+')^2}\\): (a) y(0⁺) (b) y(∞) (c) 전개 후 e^{−'+p.a+'t} 항의 계수(단독 지수항)를 구하라.'; },
    solve:function(p){
      var y0=0;                       // lim s·Y, s→∞: 차수 차 2 → 0
      var yinf=p.K*p.b/(p.a*p.a);
      // Y = A/s + B/(s+a) + C/(s+a)^2 ; A=K b/a², C = K(b-a)/(-a)?? 커버업: C = K(s+b)/s |_{s=-a} = K(b-a)/(-a)
      var A=yinf, C=p.K*(p.b-p.a)/(-p.a), B=-A;
      return { ans:{y0:y0, yinf:yinf, B:B}, unit:{y0:'', yinf:'', B:''}, steps:[
        '초기값: 분모 3차·분자 1차 → y(0⁺)=0',
        '최종값(조건 OK): '+p.K+'·'+p.b+'/'+(p.a*p.a)+' = '+SVH.fmt(yinf),
        '커버업 A='+SVH.fmt(A)+', C='+SVH.fmt(C)+' → s→∞ 계수합 0=A+B → B='+SVH.fmt(B) ] }; },
    hints:['세 정리·기법(초기·최종·커버업)을 한 문제에.'] },
  { id:'u2-l4-06', level:4, type:'num', tags:['s미분 정리'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[2,3]}, t1:{choices:[1]} },
    statement:function(p){ return 's미분 정리로 \\(\\mathcal{L}\\{t e^{-'+p.a+'t}\\}\\)를 유도해 쓰고, t·e^{−at}의 최댓값이 1/(ae)임을 확인하라. (최댓값으로 답)'; },
    solve:function(p){
      var v=1/(p.a*Math.E);
      return { ans:v, unit:'', steps:[
        '−d/ds[1/(s+'+p.a+')] = 1/(s+'+p.a+')² ✓ (중근 쌍 재확인)',
        '최대: t=1/'+p.a+'에서 (1/'+p.a+')e^{−1} = '+SVH.fmt(v),
        '(중근 응답의 봉우리 높이 — 임계감쇠 응답 스케치에 쓰인다)' ] }; },
    hints:['F(s) 미분에 −부호.','극대는 미분=0.'] },
  { id:'u2-l4-07', level:4, type:'num', tags:['역산: f(t)→F(s) 판독'], src:'기출 유형',
    params:{ a:{choices:[1,2]}, w:{choices:[2,3]}, y0:{choices:[3,5]} },
    statement:function(p){ return '측정된 응답이 \\(y(t)='+p.y0+'e^{-'+p.a+'t}\\cos('+p.w+'t)\\)이다. (a) Y(s) (b) 이 신호를 만든 2차 시스템 특성다항식의 계수(s² + c₁s + c₀)를 구하라.'; },
    solve:function(p){
      var c1=2*p.a, c0=p.a*p.a+p.w*p.w;
      return { ans:{c1:c1, c0:c0}, unit:{c1:'', c0:''}, steps:[

  { id:'u2-l4-08', level:4, type:'num', tags:['설계형: 원하는 응답'], src:'기출 유형',
    params:{ ts:{choices:[1,2],unit:'s'}, wd:{choices:[4,6],unit:'rad/s'} },
    statement:function(p){ return '원하는 응답: 봉투 시정수 1/σ = '+p.ts+'/4 s(2% 정착 '+p.ts+' s 목표), 진동 주파수 ω_d='+p.wd+' rad/s. (a) 필요한 극점 s=−σ±jω_d의 σ (b) 특성다항식 s²+c₁s+c₀ (c) 해당 ζ를 구하라.'; },

        'ζ = σ/ω₀ = σ/√c₀ = '+SVH.fmt(z)+' (사양→극점→다항식: 제어 설계의 기본 문형)' ] }; },
    hints:['성능 사양이 극점 위치를 정한다.'] }
  ]
});

  { id:'u3-l2-12', level:2, type:'num', tags:['영점 읽기'], src:'창작 문제(검산됨)',

  /* ---------- L3 (14) ---------- */
  { id:'u3-l3-01', level:3, type:'num', tags:['2자유도→TF'], src:'기출 유형',

    solve:function(p){
      var z=-p.k/p.c, K=1, zeta=p.c/(2*Math.sqrt(p.k*p.m));
      return { ans:{z:z, K:K, zeta:zeta}, unit:{z:'',K:'',zeta:''}, steps:[
        'G = ('+p.c+'s+'+p.k+')/('+p.m+'s²+'+p.c+'s+'+p.k+')',
        '영점 = −k/c = '+SVH.fmt(z)+', DC = k/k = 1 (저주파에서 바닥을 그대로 따라감)',
        'ζ = c/(2√(km)) = '+SVH.fmt(zeta)+' (차량 서스펜션의 원형)' ] }; },
    hints:['우변에도 미분이 있으면 분자가 생긴다.'] },
  { id:'u3-l3-02', level:3, type:'num', tags:['RLC TF'], src:'기출 유형',
    params:{ R:{choices:[2,4],unit:'Ω'}, L:{choices:[1],unit:'H'}, C:{choices:[0.05,0.1],unit:'F'} },
    statement:function(p){ return '직렬 RLC(입력 전압→C 전압) G=1/(LCs²+RCs+1) (R='+p.R+', L='+p.L+', C='+p.C+')의 (a) ω₀ (b) ζ (c) 스텝 최종값을 구하라.'; },
    solve:function(p){
      var w0=1/Math.sqrt(p.L*p.C), z=p.R/2*Math.sqrt(p.C/p.L);
      return { ans:{w0:w0, z:z, yss:1}, unit:{w0:'rad/s', z:'', yss:''}, steps:[
        'ω₀ = 1/√(LC) = '+SVH.fmt(w0)+', ζ = (R/2)√(C/L) = '+SVH.fmt(z),
        '최종값 = G(0) = 1 (C가 최종적으로 입력 전압을 그대로) — 전전개 U7과 완전 동일 물리' ] }; },
    hints:['계수 비교 두 개.'] },
  { id:'u3-l3-03', level:3, type:'num', tags:['질량 2개 연성'], src:'기출 유형',
    params:{ m:{choices:[1,2]}, k:{choices:[4,9]} },
    statement:function(p){ return '두 질량 m(='+p.m+')이 스프링 k(='+p.k+')로 연결되고 벽은 없다(자유-자유). 특성방정식 \\(m^2s^4+2mks^2=0\\)의 0 아닌 진동 모드 주파수 ω를 구하라.'; },
    solve:function(p){ var w=Math.sqrt(2*p.k/p.m);
      return { ans:w, unit:'rad/s', steps:[
        's²(ms²+2k)=0 → s=0(강체 이동 모드) 또는 s²=−2k/m',
        'ω = √(2k/m) = '+SVH.fmt(w)+' (서로 반대로 진동하는 모드)' ] }; },
    hints:['s² 인수 = 강체 모드.'] },
  { id:'u3-l3-04', level:3, type:'num', tags:['모터+관성 TF'], src:'교재 표준',
    params:{ J:{choices:[0.1,0.2]}, b:{choices:[0.5,1]}, Kt:{choices:[1,2]}, Ra:{choices:[2,4]} },
    statement:function(p){ return '전기자 제어 DC 모터(인덕턴스 무시): \\(J\\dot\\omega+b\\omega = K_t i,\\ i=(V-K_t\\omega)/R_a\\). Ω(s)/V(s)의 (a) DC 이득 (b) 시정수를 구하라. (K_e=K_t='+p.Kt+', J='+p.J+', b='+p.b+', R_a='+p.Ra+')'; },
    solve:function(p){
      var beff=p.b+p.Kt*p.Kt/p.Ra;
      var K=(p.Kt/p.Ra)/beff, tau=p.J/beff;
      return { ans:{K:K, tau:tau}, unit:{K:'rad/s/V', tau:'s'}, steps:[
        '전류 소거: \\(J\\dot\\omega+(b+K_t^2/R_a)\\omega=(K_t/R_a)V\\)',
        '유효 감쇠 b_eff = '+SVH.fmt(beff)+' (역기전력이 전기적 감쇠로!)',
        'DC = '+SVH.fmt(K)+', τ = J/b_eff = '+SVH.fmt(tau)+' s' ] }; },
    hints:['i를 대입해 1차계로.','역기전력 항이 감쇠에 더해진다.'] },
  { id:'u3-l3-05', level:3, type:'num', tags:['극점→응답 예측'], src:'기출 유형',
    params:{ p1:{choices:[1,2]}, p2:{choices:[8,10]} },
    statement:function(p){ return '극점이 s=−'+p.p1+', −'+p.p2+'인 2차계에서 (a) 지배 극점 (b) 두 모드의 시정수 비 (c) 5τ 기준으로 빠른 모드가 사실상 사라진 뒤 남는 모드의 시정수를 구하라.'; },
    solve:function(p){
      return { ans:{dom:-p.p1, ratio:p.p2/p.p1, tau:1/p.p1}, unit:{dom:'',ratio:'배',tau:'s'}, steps:[
        '지배 극점 = 원점에 가까운 −'+p.p1+' (느린 모드가 오래 남는다)',
        'τ 비 = '+SVH.fmt(p.p2/p.p1)+'배 → '+(p.p2/p.p1>=5?'1차계 근사 타당':'근사 주의'),
        '남는 τ = 1/'+p.p1+' = '+SVH.fmt(1/p.p1)+' s (U6 지배극점 근사의 근거)' ] }; },
    hints:['|실수부| 작은 쪽이 지배.'] },
  { id:'u3-l3-06', level:3, type:'num', tags:['비선형 모델 선형화→TF'], src:'기출 유형',
    params:{ A:{choices:[1,2]}, k:{choices:[0.5,1]}, h0:{choices:[1,4]} },
    statement:function(p){ return 'U1의 탱크 \\(A\\dot h=q-k\\sqrt h\\)를 h₀='+p.h0+'에서 선형화한 편차 모델의 (a) 전달함수 δH/δQ의 DC 이득 (b) 극점을 구하라. (A='+p.A+', k='+p.k+')'; },
    solve:function(p){
      var m=p.k/(2*Math.sqrt(p.h0));
      var K=1/m, pole=-m/p.A;
      return { ans:{K:K, pole:pole}, unit:{K:'', pole:'1/s'}, steps:[
        '선형 모델: Aδḣ = δq − '+SVH.fmt(m)+'δh → G = (1/A)/(s+'+SVH.fmt(m)+'/A)',
        'DC = 1/'+SVH.fmt(m)+' = '+SVH.fmt(K)+', 극점 = −'+SVH.fmt(m)+'/'+p.A+' = '+SVH.fmt(pole),
        '(동작점이 다르면 TF도 달라진다 — 선형화 모델의 국소성)' ] }; },
    hints:['U1-l4-08의 후속 — 편차 방정식을 라플라스.'] },
  { id:'u3-l3-07', level:3, type:'num', tags:['TF→ODE 역변환'], src:'창작 문제(검산됨)',
    params:{ b0:{choices:[5,10]}, a1:{choices:[3,6]}, a0:{choices:[9,18]} },
    statement:function(p){ return '\\(G(s)=\\dfrac{'+p.b0+'}{s^2+'+p.a1+'s+'+p.a0+'}\\)에 대응하는 ODE의 계수와, 입력 u=1(스텝) 정상상태에서 \\(\\ddot y=\\dot y=0\\)을 이용한 y_ss를 구하라.'; },
    solve:function(p){ var yss=p.b0/p.a0;
      return { ans:yss, unit:'', steps:[
        'ODE: \\(\\ddot y+'+p.a1+'\\dot y+'+p.a0+'y='+p.b0+'u\\)',
        '정상: '+p.a0+'y_ss='+p.b0+' → y_ss = '+SVH.fmt(yss)+' (G(0)과 동일 — 두 관점 일치)' ] }; },
    hints:['TF↔ODE는 계수 그대로.'] },
  { id:'u3-l3-08', level:3, type:'num', tags:['팬듈럼 TF'], src:'기출 유형',
    params:{ L:{choices:[0.5,1]}, m:{choices:[1,2]} },
    statement:function(p){ return '길이 L='+p.L+' m, 질량 m='+p.m+' kg 진자(감쇠 무시)를 하단 토크 T로 구동: 선형화 EOM \\(mL^2\\ddot\\theta+mgL\\theta=T\\). (a) Θ/T의 DC 이득 (b) 고유진동수를 구하라. (g=9.8)'; },
    solve:function(p){
      var K=1/(p.m*9.8*p.L), w0=Math.sqrt(9.8/p.L);
      return { ans:{K:K, w0:w0}, unit:{K:'rad/N·m', w0:'rad/s'}, steps:[
        'G = 1/(mL²s²+mgL)',
        'DC = 1/(mgL) = '+SVH.fmt(K)+' (정적 처짐각/토크)',
        'ω₀ = √(g/L) = '+SVH.fmt(w0)+' (L만의 함수 — 질량 무관!)' ] }; },
    hints:['mL²로 묶어 표준형.'] },
  { id:'u3-l3-09', level:3, type:'num', tags:['시정수 실험 식별'], src:'기출 유형',
    params:{ yss:{choices:[4,8]}, t63:{choices:[0.5,2],unit:'s'}, U:{choices:[2]} },
    statement:function(p){ return '스텝 크기 '+p.U+'를 넣었더니 출력이 최종값 '+p.yss+'에 접근하며 63.2% 도달에 '+p.t63+' s 걸렸다. 1차 모델 K/(τs+1)의 K·τ를 구하라.'; },
    solve:function(p){ var K=p.yss/p.U;
      return { ans:{K:K, tau:p.t63}, unit:{K:'', tau:'s'}, steps:[
        'K = y_ss/입력 = '+p.yss+'/'+p.U+' = '+SVH.fmt(K),
        'τ = 63.2% 도달 시간 = '+p.t63+' s (정의 그대로)',
        '(스텝 실험 2측정 → 1차 모델 완성: 공정 식별의 최소형)' ] }; },
    hints:['K는 크기 비, τ는 63.2%.'] },
  { id:'u3-l3-10', level:3, type:'num', tags:['기어 系 TF'], src:'교재 표준',
    params:{ N:{choices:[2,4]}, Jm:{choices:[0.5,1]}, JL:{choices:[8,16]}, b:{choices:[1,2]} },
    statement:function(p){ return '모터(J_m='+p.Jm+') → 기어 '+p.N+':1 → 부하(J_L='+p.JL+', 감쇠 b='+p.b+'는 부하축). 모터축 기준 (a) 총 관성 (b) 등가 감쇠 (c) Ω_m/T_m 1차계의 시정수를 구하라.'; },
    solve:function(p){
      var J=p.Jm+p.JL/(p.N*p.N), be=p.b/(p.N*p.N), tau=J/be;
      return { ans:{J:J, be:be, tau:tau}, unit:{J:'kg·m²', be:'N·m·s', tau:'s'}, steps:[
        'J_eq = J_m+J_L/N² = '+SVH.fmt(J),
        'b_eq = b/N² = '+SVH.fmt(be),
        'τ = J_eq/b_eq = '+SVH.fmt(tau)+' s (환산 후엔 1축 문제)' ] }; },
    hints:['부하 쪽 전부 N²로 나눠 끌어온다.'] },
  { id:'u3-l3-11', level:3, type:'num', tags:['병렬 경로'], src:'창작 문제(검산됨)',
    params:{ K1:{choices:[2,3]}, K2:{choices:[4,6]}, a:{choices:[2,5]} },
    statement:function(p){ return '입력이 두 경로 \\(G_1='+p.K1+'\\)(직결)과 \\(G_2=\\dfrac{'+p.K2+'}{s+'+p.a+'}\\)로 갈라져 합산 출력된다. (a) 전체 TF의 영점 (b) DC 이득을 구하라.'; },
    solve:function(p){
      // G = K1 + K2/(s+a) = (K1 s + K1 a + K2)/(s+a)
      var z=-(p.K1*p.a+p.K2)/p.K1, K=p.K1+p.K2/p.a;
      return { ans:{z:z, K:K}, unit:{z:'', K:''}, steps:[
        '병렬 = 합: G = ('+p.K1+'s+'+(p.K1*p.a+p.K2)+')/(s+'+p.a+')',
        '영점 = '+SVH.fmt(z)+', DC = '+SVH.fmt(K),
        '(합쳤더니 영점이 "생겼다" — 영점은 경로 간 간섭의 산물)' ] }; },
    hints:['통분하면 분자가 1차식.'] },
  { id:'u3-l3-12', level:3, type:'num', tags:['정규화·무차원화'], src:'창작 문제(검산됨)',
    params:{ K:{choices:[10,20]}, tau:{choices:[0.2,0.5]} },
    statement:function(p){ return '\\(G=\\dfrac{'+p.K+'}{'+p.tau+'s+1}\\)에서 시간축을 \\(t\'=t/'+p.tau+'\\)로 무차원화하면 TF는 K/(s\'+1)이 된다. 원래 시스템에서 t='+p.tau+' s일 때 스텝 응답값을 구하라. (입력 1)'; },
    solve:function(p){ var v=p.K*(1-Math.exp(-1));
      return { ans:v, unit:'', steps:[
        't=τ ⇔ t\'=1 → y = K(1−e^{−1})',
        '= '+SVH.fmt(v)+' (정규화 곡선 하나로 모든 1차계를 읽는 기술)' ] }; },
    hints:['63.2%×K.'] },
  { id:'u3-l3-13', level:3, type:'num', tags:['물리 파라미터 역산'], src:'기출 유형',
    params:{ w0:{choices:[3,5]}, z:{choices:[0.25,0.5]}, m:{choices:[2,4]} },
    statement:function(p){ return '측정: ω₀='+p.w0+' rad/s, ζ='+p.z+'. 질량 m='+p.m+' kg인 MSD의 (a) k (b) c를 역산하라.'; },
    solve:function(p){ var k=p.m*p.w0*p.w0, c=2*p.z*p.w0*p.m;
      return { ans:{k:k, c:c}, unit:{k:'N/m', c:'N·s/m'}, steps:[
        'k = mω₀² = '+SVH.fmt(k),
        'c = 2ζω₀m = '+SVH.fmt(c),
        '(사양→물리 부품값: 설계 방향의 계산)' ] }; },
    hints:['표준형 계수 비교의 역방향.'] },
  { id:'u3-l3-14', level:3, type:'num', tags:['적분기 플랜트'], src:'교재 표준',
    params:{ K:{choices:[2,5]}, t1:{choices:[2,3]} },
    statement:function(p){ return '적분기 플랜트 \\(G='+p.K+'/s\\)(예: 밸브 열림→수위 속도)의 단위 스텝 응답과 t='+p.t1+'에서 값을 구하라. 이 시스템의 스텝 정상값이 존재하는가? (존재=1/무한=0)'; },
    solve:function(p){ var v=p.K*p.t1;
      return { ans:{v:v, fin:0}, unit:{v:'', fin:''}, steps:[
        'Y = '+p.K+'/s² → y = '+p.K+'t (램프!)',
        't='+p.t1+': '+SVH.fmt(v)+' · 정상값 없음(0) — 원점 극점 = 적분 동작',
        '(피드백을 걸어야 안정한 위치 제어가 된다는 동기 부여)' ] }; },
    hints:['1/s² 역변환.'] },

  /* ---------- L4 (8) ---------- */
  { id:'u3-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'옳은 것을 모두 고르면?<br>㉠ 전달함수는 선형 시불변 시스템에서만 정의된다<br>㉡ 극점은 분모, 영점은 분자의 근이다<br>㉢ 임펄스 응답과 전달함수는 라플라스 쌍이다<br>㉣ 기어로 부하를 환산하면 관성은 속도비의 제곱으로 변한다',
    choices:['전부','㉠㉡㉢','㉡㉢㉣','㉠㉣'],
    answer:0, expl:'전부 참 — 네 명제가 이 단원의 뼈대 요약이다.' },
  { id:'u3-l4-02', level:4, type:'num', tags:['MSD 풀코스'], src:'기출 유형',
    params:{ m:{choices:[2]}, c:{choices:[4,8]}, k:{choices:[50,100]}, F0:{choices:[10,20]} },
    statement:function(p){ return 'MSD(m='+p.m+', c='+p.c+', k='+p.k+')에 스텝 힘 F₀='+p.F0+' N. (a) 정상 변위 (b) ω₀·ζ (c) 오버슈트 % (d) 첫 봉우리 시각 T_p를 구하라.'; },
    solve:function(p){
      var xss=p.F0/p.k, w0=Math.sqrt(p.k/p.m), z=p.c/(2*Math.sqrt(p.k*p.m));
      var wd=w0*Math.sqrt(1-z*z);
      var Mp=Math.exp(-Math.PI*z/Math.sqrt(1-z*z))*100, Tp=Math.PI/wd;
      return { ans:{xss:xss, w0:w0, z:z, Mp:Mp, Tp:Tp}, unit:{xss:'m', w0:'rad/s', z:'', Mp:'%', Tp:'s'}, steps:[
        'x_ss = F₀/k = '+SVH.fmt(xss)+' m',
        'ω₀='+SVH.fmt(w0)+', ζ='+SVH.fmt(z)+' (부족감쇠 확인)',
        'M_p = e^{−πζ/√(1−ζ²)} = '+SVH.fmt(Mp)+' %, T_p = π/ω_d = '+SVH.fmt(Tp)+' s',
        '(모델링→사양 계산의 전체 흐름 — U6에서 공식들이 유도된다)' ] }; },
    hints:['정상값은 k만, 동특성은 ω₀·ζ가.'] },
  { id:'u3-l4-03', level:4, type:'derive', tags:['유도'], src:'교재 표준',
    statement:'MSD \\(m\\ddot x+c\\dot x+kx=F\\)에서 전달함수 \\(X/F=1/(ms^2+cs+k)\\)를 유도하고, "초기조건 0" 가정의 역할과 표준형(ω₀·ζ) 변환까지 서술하라.',
    steps:[
      '뉴턴 2법칙에서 EOM 확정 [왜] 모델링의 출발은 언제나 물리 법칙',
      '라플라스(미분 정리): \\(m[s^2X-sx(0)-\\dot x(0)]+c[sX-x(0)]+kX=F(s)\\)',
      '초기조건 0 → \\((ms^2+cs+k)X=F\\) → \\(G=1/(ms^2+cs+k)\\) — 초기항이 남으면 입력 외 항이 생겨 "비"가 정의되지 않는다',
      '표준형: 분모÷m → \\(s^2+2\\zeta\\omega_0s+\\omega_0^2\\), \\(\\omega_0=\\sqrt{k/m}\\), \\(\\zeta=c/2\\sqrt{km}\\)',
      '극한 체크: s→0 ⇒ G→1/k(정적 강성의 역수) ✓ · c=0 ⇒ 허수 극점(무감쇠) ✓ · 차원: 1/[N/m]=[m/N] ✓'
    ],
    hints:['미분 정리의 초기항을 명시하고 지워라.','마지막에 표준형 계수 비교.'],
    expl:'HW·중간의 "모델링→TF" 문항 서술 틀 그대로.' },
  { id:'u3-l4-04', level:4, type:'num', tags:['영점 효과 정량'], src:'기출 유형',
    params:{ a:{choices:[1,2]}, z:{choices:[0.5,4]} },
    statement:function(p){ return '\\(G_1=\\dfrac{2}{(s+1)(s+2)}\\)에 영점을 넣은 \\(G_2=\\dfrac{2(s/'+p.z+'+1)}{(s+1)(s+2)}\\)... 두 시스템의 (a) DC 이득 비교값(같으면 1) (b) G₂ 스텝 응답의 초기 기울기 \\(\\dot y(0^+)=\\lim s^2G_2/s\\)를 구하라.'; },
    solve:function(p){
      var slope=2/p.z; // lim s·[sG2/s] = lim s G2 = 2*(s/z)/(s²)*s → 2/z
      return { ans:{same:1, slope:slope}, unit:{same:'', slope:''}, steps:[
        'DC: G₂(0)=2×1/2=1=G₁(0) → 같음(1) — 영점은 DC를 안 바꾼다(s/z+1 형태)',
        '초기 기울기 = lim_{s→∞} s²·G₂·(1/s) = 2/'+p.z+' = '+SVH.fmt(slope),
        '(가까운 영점(z 작음) → 초기 반응 급함·오버슈트 증가: U6 영점 효과의 수치 근거)' ] }; },
    hints:['초기 기울기는 s²Y의 s→∞ 극한.'] },
  { id:'u3-l4-05', level:4, type:'num', tags:['모터-부하 종합'], src:'기출 유형',
    params:{ Kt:{choices:[1]}, Ra:{choices:[2]}, Jm:{choices:[0.5]}, JL:{choices:[8,18]}, N:{choices:[2,3]} },

  { id:'u3-l4-08', level:4, type:'num', tags:['설계: 극점 배치 준비'], src:'기출 유형',

  { id:'u4-l2-12', level:2, type:'num', tags:['루프이득 읽기'], src:'창작 문제(검산됨)',
    params:{ K:{choices:[2,5]}, a:{choices:[1,2]}, h:{choices:[3,4]} },
    statement:function(p){ return '전방 \\(G=\\dfrac{'+p.K+'}{s+'+p.a+'}\\), 피드백 H='+p.h+'인 루프의 (a) 루프이득 L(0) (b) 폐루프 극점을 구하라.'; },
    solve:function(p){ var L0=p.K*p.h/p.a, pol=-(p.a+p.K*p.h);
      return { ans:{L0:L0, pol:pol}, unit:{L0:'', pol:''}, steps:[
        'L(s)=GH → L(0) = '+SVH.fmt(L0),
        '폐루프 분모: s+'+p.a+'+'+SVH.fmt(p.K*p.h)+' → 극점 '+SVH.fmt(pol) ] }; },
    hints:['분모 = 1+GH의 분자.'] },

  /* ---------- L3 (14) ---------- */
  { id:'u4-l3-01', level:3, type:'num', tags:['외란 억제 정량'], src:'기출 유형',
    params:{ K:{choices:[9,19,49]}, d:{choices:[1,2]} },
    statement:function(p){ return '단위 피드백 정적 루프(G=K='+p.K+'), 출력단 외란 d='+p.d+'. (a) 개루프(피드백 없음)일 때 y의 외란 성분 (b) 폐루프일 때 외란 성분을 구하라.'; },
    solve:function(p){ var yol=p.d, ycl=p.d/(1+p.K);
      return { ans:{yol:yol, ycl:ycl}, unit:{yol:'', ycl:''}, steps:[
        '개루프: 외란이 그대로 '+SVH.fmt(yol),
        '폐루프: Y/D = 1/(1+G) → '+SVH.fmt(ycl)+' ('+SVH.fmt(1+p.K)+'배 억제)',
        '(피드백 효용의 정량 1번 — Lec1 서사의 계산판)' ] }; },
    hints:['외란 전달함수 1/(1+G).'] },
  { id:'u4-l3-02', level:3, type:'num', tags:['민감도'], src:'기출 유형',
    params:{ K:{choices:[9,19]}, dK:{choices:[10,20]} },
    statement:function(p){ return 'G=K='+p.K+' 단위 피드백에서 K가 '+p.dK+'% 증가할 때 (a) 개루프 이득 변화율 (b) 폐루프 이득 변화율(%)을 구하라.'; },
    solve:function(p){
      var K2=p.K*(1+p.dK/100);
      var T1=p.K/(1+p.K), T2=K2/(1+K2);
      var dT=(T2-T1)/T1*100;
      return { ans:{ol:p.dK, cl:dT}, unit:{ol:'%', cl:'%'}, steps:[
        '개루프: '+p.dK+'% 그대로',
        '폐루프: '+SVH.fmt(T1)+'→'+SVH.fmt(T2)+' → '+SVH.fmt(dT)+'%',
        '(민감도 S≈1/(1+K) = '+SVH.fmt(1/(1+p.K))+'배 — 근사와 정확값 비교)' ] }; },
    hints:['새 K로 다시 계산해 비율.'] },
  { id:'u4-l3-03', level:3, type:'num', tags:['다중 루프 축약'], src:'기출 유형',
    params:{ K:{choices:[10,20]}, a:{choices:[2,4]}, h2:{choices:[1,2]} },
    statement:function(p){ return '전방 \\(\\dfrac{'+p.K+'}{s(s+'+p.a+')}\\), 내부 속도 피드백 h₂s(= '+p.h2+'s), 외부 단위 피드백. 폐루프 분모 s²+c₁s+c₀의 c₁·c₀를 구하라.'; },
    solve:function(p){
      var c1=p.a+p.K*p.h2, c0=p.K;
      return { ans:{c1:c1, c0:c0}, unit:{c1:'', c0:''}, steps:[
        '내부 루프: '+p.K+'/[s(s+'+p.a+')+'+p.K+'·'+p.h2+'s] = '+p.K+'/[s(s+'+SVH.fmt(c1)+')]',
        '외부 단위 피드백: 분모 s²+'+SVH.fmt(c1)+'s+'+p.K,
        '(속도 피드백이 감쇠(c₁)를 키운다 — 서보 설계의 고전 수법)' ] }; },
    hints:['안쪽(hs)부터, 그 다음 바깥.'] },
  { id:'u4-l3-04', level:3, type:'num', tags:['원하는 ζ 설계'], src:'기출 유형',
    params:{ K:{choices:[16,25,36]}, zt:{choices:[0.5,0.7]} },
    statement:function(p){ return '위 구조(전방 K/[s(s+2)], 속도 피드백 hs, 외부 단위 피드백, K='+p.K+')에서 폐루프 ζ='+p.zt+'가 되도록 h를 정하라.'; },
    solve:function(p){
      var w0=Math.sqrt(p.K);
      var h=(2*p.zt*w0-2)/p.K;
      return { ans:h, unit:'', steps:[
        '분모: s²+(2+Kh)s+K → ω₀=√K='+SVH.fmt(w0),
        '2ζω₀ = 2+Kh → h = (2ζω₀−2)/K = '+SVH.fmt(h),
        '검산: c₁ = '+SVH.fmt(2+p.K*h)+' = 2×'+p.zt+'×'+SVH.fmt(w0)+' ✓' ] }; },
    hints:['계수 비교로 h를 역산.'] },
  { id:'u4-l3-05', level:3, type:'num', tags:['2입력 중첩'], src:'기출 유형',
    params:{ K:{choices:[4,9]}, r:{choices:[1,2]}, d:{choices:[1,3]} },
    statement:function(p){ return '단위 피드백 정적 G='+p.K+', 기준 r='+p.r+'과 출력단 외란 d='+p.d+'가 동시에 작용. 출력 y를 중첩으로 구하라.'; },
    solve:function(p){
      var y=p.K/(1+p.K)*p.r+p.d/(1+p.K);
      return { ans:y, unit:'', steps:[
        'Y = [G/(1+G)]r + [1/(1+G)]d',
        '= '+SVH.fmt(p.K/(1+p.K)*p.r)+' + '+SVH.fmt(p.d/(1+p.K))+' = '+SVH.fmt(y),
        '(두 입력 → 두 전달함수 — 선형이라 그냥 더한다)' ] }; },
    hints:['r·d 각각의 전달함수.'] },
  { id:'u4-l3-06', level:3, type:'num', tags:['블록 재배치'], src:'기출 유형',
    params:{ G1:{choices:[2,3]}, G2:{choices:[4,5]}, H:{choices:[0.5,1]} },
    statement:function(p){ return '전방 G₁→G₂ 직렬, 피드백 H가 G₁·G₂ 사이에서 분기해 입력 합산점으로. (a) 등가 피드백 H_eq(분기점을 출력으로 옮긴 후) (b) 폐루프 DC 이득을 구하라. (전부 정적 이득)'; },
    solve:function(p){
      var Heq=p.H/p.G2;
      var T=p.G1*p.G2/(1+p.G1*p.G2*Heq);
      return { ans:{Heq:Heq, T:T}, unit:{Heq:'', T:''}, steps:[
        '분기점을 G₂ 뒤로: 가지에 1/G₂ → H_eq = H/G₂ = '+SVH.fmt(Heq),
        'T = G₁G₂/(1+G₁G₂H_eq) = '+SVH.fmt(T),
        '검산(직접): 루프이득 = G₁H = '+SVH.fmt(p.G1*p.H)+' → T = '+SVH.fmt(p.G1*p.G2/(1+p.G1*p.H))+' ✓' ] }; },
    hints:['이동 규칙 적용 후 표준형.','직접 신호 추적으로 검산.'] },
  { id:'u4-l3-07', level:3, type:'num', tags:['속도+위치 이중 루프'], src:'기출 유형',
    params:{ Kv:{choices:[5,10]}, Kp:{choices:[2,4]} },
    statement:function(p){ return '모터 1/s(적분) 플랜트. 내부: 속도 피드백으로 1차계 \\(\\dfrac{K_v}{s+K_v}\\) 완성(K_v='+p.Kv+'). 외부: 위치 이득 K_p='+p.Kp+'와 단위 피드백. 폐루프 (a) ω₀ (b) ζ를 구하라.'; },
    solve:function(p){
      // T = Kp*Kv/[s(s+Kv)+Kp Kv] → s²+Kv s+KpKv
      var w0=Math.sqrt(p.Kp*p.Kv), z=p.Kv/(2*w0);
      return { ans:{w0:w0, z:z}, unit:{w0:'rad/s', z:''}, steps:[
        '외부 전방 = K_p·K_v/[s(s+K_v)] → 분모 s²+'+p.Kv+'s+'+SVH.fmt(p.Kp*p.Kv),
        'ω₀ = √(K_pK_v) = '+SVH.fmt(w0)+', ζ = K_v/(2ω₀) = '+SVH.fmt(z),
        '(캐스케이드 서보의 정석 구조 — 실무 위치 제어기 그 자체)' ] }; },
    hints:['안쪽 1차계 완성 후 바깥 적분과 결합.'] },
  { id:'u4-l3-08', level:3, type:'num', tags:['등가 단위 피드백화'], src:'기출 유형',
    params:{ K:{choices:[8,12]}, h:{choices:[2,4]} },
    statement:function(p){ return 'H='+p.h+'(정적) 피드백 루프(전방 G=K/s, K='+p.K+')를 "단위 피드백 + 전치 이득" 형태로 바꿔라: (a) 등가 전방 G′=GH의 계수 (b) 전치 이득 1/H (c) 폐루프 DC에서 y/r을 구하라.'; },
    solve:function(p){
      return { ans:{Kp:p.K*p.h, pre:1/p.h, dc:1/p.h}, unit:{Kp:'', pre:'', dc:''}, steps:[
        'T = G/(1+GH) = (1/H)·GH/(1+GH) → 전치 1/'+p.h+', 등가 전방 GH = '+SVH.fmt(p.K*p.h)+'/s',
        '적분기 루프의 DC: GH/(1+GH)→1 → y/r → 1/H = '+SVH.fmt(1/p.h),
        '(센서 이득이 최종 눈금을 정한다 — 계측 관점과 연결)' ] }; },
    hints:['T를 (1/H)·[GH/(1+GH)]로 항등 변형.'] },
  { id:'u4-l3-09', level:3, type:'num', tags:['외란 입력점의 중요성'], src:'기출 유형',
    params:{ K:{choices:[10,50]}, G2:{choices:[2,5]} },
    statement:function(p){ return '전방 = 제어기 K='+p.K+' → 플랜트 G₂='+p.G2+', 단위 피드백. 외란 d=1이 (a) 플랜트 입력단 (b) 플랜트 출력단에 들어올 때 각각 출력의 외란 성분을 구하라.'; },
    solve:function(p){
      var L=p.K*p.G2;
      var yin=p.G2/(1+L), yout=1/(1+L);
      return { ans:{yin:yin, yout:yout}, unit:{yin:'', yout:''}, steps:[
        '입력단: Y/D = G₂/(1+KG₂) = '+SVH.fmt(yin),
        '출력단: Y/D = 1/(1+KG₂) = '+SVH.fmt(yout),
        '(같은 외란도 들어오는 위치에 따라 '+SVH.fmt(p.G2)+'배 차이 — 블록선도를 정확히 그려야 하는 이유)' ] }; },
    hints:['외란 위치별로 전방 경로가 다르다.'] },
  { id:'u4-l3-10', level:3, type:'num', tags:['s영역 폐루프 극점'], src:'기출 유형',
    params:{ K:{choices:[6,10]}, a:{choices:[2,3]}, b:{choices:[4,5]} },
    statement:function(p){ return '단위 피드백, \\(G=\\dfrac{'+p.K+'}{(s+'+p.a+')(s+'+p.b+')}\\). 폐루프 특성방정식 s²+c₁s+c₀의 계수와 ζ를 구하라.'; },
    solve:function(p){
      var c1=p.a+p.b, c0=p.a*p.b+p.K;
      var z=c1/(2*Math.sqrt(c0));
      return { ans:{c1:c1, c0:c0, z:z}, unit:{c1:'', c0:'', z:''}, steps:[
        '1+G=0 → (s+'+p.a+')(s+'+p.b+')+'+p.K+' = 0',
        's²+'+SVH.fmt(c1)+'s+'+SVH.fmt(c0),
        'ζ = c₁/(2√c₀) = '+SVH.fmt(z)+' (K↑ → c₀↑ → ζ↓: 이득이 진동성을 키움)' ] }; },
    hints:['특성방정식 = 1+GH=0.'] },
  { id:'u4-l3-11', level:3, type:'num', tags:['정적 3루프'], src:'창작 문제(검산됨)',
    params:{ K1:{choices:[2,3]}, K2:{choices:[2,4]}, h1:{choices:[0.5,1]}, h2:{choices:[0.25,0.5]} },
    statement:function(p){ return '이중 루프(전부 정적): 안쪽 [전방 K₂='+p.K2+', 피드백 h₂='+p.h2+'], 그 앞 K₁='+p.K1+', 바깥 피드백 h₁='+p.h1+'. 전체 이득을 구하라.'; },
    solve:function(p){
      var inner=p.K2/(1+p.K2*p.h2);
      var T=p.K1*inner/(1+p.K1*inner*p.h1);
      return { ans:T, unit:'', steps:[
        '안: '+SVH.fmt(inner)+' → 전방 = '+SVH.fmt(p.K1*inner),
        '바깥: /(1+전방×'+p.h1+') = '+SVH.fmt(T),
        '(축약 2회면 어떤 이중 루프도 끝)' ] }; },
    hints:['같은 공식을 두 번.'] },
  { id:'u4-l3-12', level:3, type:'num', tags:['이득 여유 개념 준비'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[2,4]} },
    statement:function(p){ return '단위 피드백, \\(G=\\dfrac{K}{s(s+'+p.a+')^2}\\)... 대신 정적 등가 판단: 특성방정식 \\(s(s+'+p.a+')^2+K=0\\)에서 s=jω 대입 시 허수부=0이 되는 ω(≠0)와 그때 K(임계 이득)를 구하라.'; },
    solve:function(p){
      // s(s+a)^2 = s^3+2as^2+a^2 s ; jω: -jω³ -2aω² + ja²ω + K = 0
      // 실부: K-2aω²=0, 허부: ω(a²-ω²)=0 → ω=a
      var w=p.a, Kc=2*p.a*p.a*p.a;
      return { ans:{w:w, Kc:Kc}, unit:{w:'rad/s', Kc:''}, steps:[
        's=jω 대입, 허수부: ω(a²−ω²)=0 → ω = '+p.a,
        '실수부: K = 2aω² = 2·'+p.a+'³ = '+SVH.fmt(Kc),
        '(허수축 통과 = 안정 경계 — U7 Routh의 보조행 사건과 같은 지점)' ] }; },
    hints:['jω 대입해 실·허 분리.'] },
  { id:'u4-l3-13', level:3, type:'num', tags:['속도 상수 미리보기'], src:'기출 유형',
    params:{ K:{choices:[10,20]}, a:{choices:[2,5]} },
    statement:function(p){ return '단위 피드백, \\(G=\\dfrac{'+p.K+'}{s(s+'+p.a+')}\\)에 램프 입력 r=t. 정상 추종 오차 \\(e_{ss}=1/K_v\\), \\(K_v=\\lim sG\\)를 구하라.'; },
    solve:function(p){ var Kv=p.K/p.a, e=1/Kv;
      return { ans:{Kv:Kv, e:e}, unit:{Kv:'1/s', e:''}, steps:[
        'K_v = lim_{s→0} sG = '+p.K+'/'+p.a+' = '+SVH.fmt(Kv),
        'e_ss = 1/K_v = '+SVH.fmt(e)+' (타입 1 시스템의 램프 오차 — 기말 범위의 예고편이지만 HW 단골)' ] }; },
    hints:['sG의 s→0 극한.'] },
  { id:'u4-l3-14', level:3, type:'num', tags:['비단위 피드백 오차'], src:'기출 유형',
    params:{ K:{choices:[9,24]}, h:{choices:[0.5,2]} },
    statement:function(p){ return '전방 G=K='+p.K+', 피드백 H='+p.h+'. 스텝 r=1에서 (a) 출력 y (b) "실측 오차" r−y를 구하라. (r−y는 0으로 안 간다 — 왜인지 포함)'; },
    solve:function(p){
      var y=p.K/(1+p.K*p.h);
      return { ans:{y:y, e:1-y}, unit:{y:'', e:''}, steps:[
        'y = K/(1+KH) = '+SVH.fmt(y),
        'r−y = '+SVH.fmt(1-y)+' — 루프가 0으로 만드는 것은 r−Hy(비교기 신호)지 r−y가 아니다',
        '(H≠1이면 "무엇을 0으로 만드는 루프인가"를 물어야 한다 — 개념 함정 단골)' ] }; },
    hints:['비교기에 들어가는 신호가 무엇인지.'] },

  /* ---------- L4 (8) ---------- */
  { id:'u4-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'옳은 것을 모두 고르면?<br>㉠ 폐루프 특성방정식은 1+GH=0이다<br>㉡ 피드백은 외란·파라미터 변화 영향을 (1+루프이득)배로 줄인다<br>㉢ 분기점을 블록 뒤로 옮기면 가지에 그 블록의 역수를 곱한다<br>㉣ 루프이득이 충분히 크면 폐루프 이득은 1/H로 수렴한다',
    choices:['전부','㉠㉡㉣','㉠㉢','㉡㉢㉣'],
    answer:0, expl:'전부 참. ㉢: 뒤로 옮기면 원 신호(u)를 만들기 위해 1/G — 방향별 규칙을 표로 정리해 둘 것.' },
  { id:'u4-l4-02', level:4, type:'num', tags:['종합 축약'], src:'기출 유형',
    params:{ K:{choices:[20,40]}, a:{choices:[4,5]}, h:{choices:[0.1,0.2]} },
    statement:function(p){ return '구조: 전방 \\(\\dfrac{'+p.K+'}{s(s+'+p.a+')}\\), 내부 속도 피드백 '+p.h+'s, 외부 단위 피드백, 외란 d가 플랜트 입력단. (a) 폐루프 분모 계수 c₁·c₀ (b) 폐루프 ζ (c) 스텝 외란의 정상 출력 성분을 구하라.'; },
    solve:function(p){
      var c1=p.a+p.K*p.h, c0=p.K;
      var z=c1/(2*Math.sqrt(c0));
      // 외란: Y/D = G/(1+G(hs+1))... 정적 극한: G(0)=∞(적분기) → Y/D(0)=  1/(hs+1)|0? 정확히:
      // Y/D = [K/(s(s+a))]/[1+K/(s(s+a))·(hs+1)] = K/[s(s+a)+K(hs+1)] → s→0: K/K = 1?? 
      // 주의: 외부 단위 피드백 포함 시 피드백 신호 = y·(hs+1)? 구조: 내부 hs + 외부 1 → 합성 H=1+hs

      return { ans:{c1:c1, c0:c0, z:z, yd:1}, unit:{c1:'',c0:'',z:'',yd:''}, steps:[

  { id:'u4-l4-03', level:4, type:'derive', tags:['유도'], src:'교재 표준',
    statement:'음의 피드백 공식 \\(T=\\dfrac{G}{1+GH}\\)를 신호 방정식에서 유도하고, 민감도 \\(S^T_G=\\dfrac{dT/T}{dG/G}=\\dfrac{1}{1+GH}\\)까지 유도하라.',
