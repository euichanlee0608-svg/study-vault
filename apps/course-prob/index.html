<script>
/* 문제은행 공용 헬퍼 — 브라우저(런타임)와 node(검산 러너) 양쪽에서 동일 코드 실행 (이중 구현 금지) */
(function (g) {
  'use strict';
  g.SV_BANK = g.SV_BANK || [];
  var SVH = {
    /* 유효숫자 정리 (부동소수 노이즈 제거). 표시용 — ans에는 절대 쓰지 말 것 */
    fmt: function (x, sig) {
      if (typeof x !== 'number' || !isFinite(x)) return String(x);
      if (x === 0) return '0';
      var v = Number(x.toPrecision(sig || 4));
      return String(v);
    },
    /* SI 접두 표기 (표시용) */
    si: function (x, unit, sig) {
      if (x === 0) return '0 ' + unit;
      var a = Math.abs(x);
      var P = [[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p']];
      for (var i = 0; i < P.length; i++) {
        if (a >= P[i][0] * 0.9999) return SVH.fmt(x / P[i][0], sig) + ' ' + P[i][1] + unit;
      }
      return SVH.fmt(x, sig) + ' ' + unit;
    },
    par: function (a, b) { return a * b / (a + b); },        // 병렬 저항
    par3: function (a, b, c) { return 1 / (1/a + 1/b + 1/c); },
    deg: function (rad) { return rad * 180 / Math.PI; },
    rad: function (d) { return d * Math.PI / 180; },
    /* 복소수 최소 연산 (페이저용) */
    cx: function (re, im) { return { re: re, im: im }; },
    cadd: function (a, b) { return { re: a.re + b.re, im: a.im + b.im }; },
    csub: function (a, b) { return { re: a.re - b.re, im: a.im - b.im }; },
    cmul: function (a, b) { return { re: a.re * b.re - a.im * b.im, im: a.re * b.im + a.im * b.re }; },
    cdiv: function (a, b) {
      var d = b.re * b.re + b.im * b.im;
      return { re: (a.re * b.re + a.im * b.im) / d, im: (a.im * b.re - a.re * b.im) / d };
    },
    cmag: function (a) { return Math.hypot(a.re, a.im); },
    cang: function (a) { return Math.atan2(a.im, a.re) * 180 / Math.PI; }, // deg
    cpar: function (a, b) { return SVH.cdiv(SVH.cmul(a, b), SVH.cadd(a, b)); },
    /* 2x2 / 3x3 실계수 선형계 풀이 (절점/망로 검산·풀이 공용) */
    solve2: function (a11, a12, b1, a21, a22, b2) {
      var D = a11 * a22 - a12 * a21;
      return [ (b1 * a22 - a12 * b2) / D, (a11 * b2 - b1 * a21) / D ];
    },
    solve3: function (A, b) { // A: 3x3 배열, b: [3]
      var d = SVH.det3(A);
      function rep(A, i, b) {
        var M = A.map(function (r) { return r.slice(); });
        for (var r = 0; r < 3; r++) M[r][i] = b[r];
        return M;
      }
      return [SVH.det3(rep(A,0,b))/d, SVH.det3(rep(A,1,b))/d, SVH.det3(rep(A,2,b))/d];
    },
    det3: function (A) {
      return A[0][0]*(A[1][1]*A[2][2]-A[1][2]*A[2][1])
           - A[0][1]*(A[1][0]*A[2][2]-A[1][2]*A[2][0])
           + A[0][2]*(A[1][0]*A[2][1]-A[1][1]*A[2][0]);
    }
  };
  g.SVH = SVH;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>

SV_BANK.push({
  id: 'u1', no: 1, title: '확률 리뷰·확률과정 입문', titleEn: 'Probability Review & Intro to Stochastic Processes',
  scope: '확률 공리 · 조건부확률 · 전확률·베이즈 · 기댓값·분산·공분산 · 이항·기하·포아송·균등·지수 · 확률과정 {X(t)} 정의 · 상태공간×시간지표 2×2 구분 · 표본경로',
  problems: [

  /* ---------- L1 (6) ---------- */
  { id:'u1-l1-01', level:1, type:'mc', tags:['확률과정 정의'], src:'강의자료 대조',
    statement:'확률과정 \\(\\{X(t),\\ t\\in T\\}\\)의 올바른 정의는?',
    choices:['시간 지표 t로 매개된 확률변수들의 족(family) — 각 t마다 X(t)가 확률변수','하나의 확률변수','시간의 결정적 함수','확률이 시간에 따라 변하지 않는 상수'],
    answer:0, expl:'"시간 축 위에 늘어선 확률변수들". 실험을 한 번 하면 시간 함수 하나(표본경로)가 뽑힌다 — 확률변수의 값이 숫자였다면, 확률과정의 값은 함수다.' },
  { id:'u1-l1-02', level:1, type:'mc', tags:['2×2 구분'], src:'강의자료 대조',
    statement:'상태공간(이산/연속)×시간지표(이산/연속) 2×2 구분에서 짝이 옳은 것은?',
    choices:['매 슬롯 도착 패킷 수=이산상태·이산시간, 시각 t의 대기 인원=이산상태·연속시간','시각 t의 온도=이산상태·이산시간','매일 주가 종가=연속시간','대기 인원=연속상태'],
    answer:0, expl:'구분 기준 두 개를 독립으로 묻는다: 값이 셀 수 있나(상태), 관측 시점이 셀 수 있나(시간). 포아송과정은 이산상태·연속시간의 대표.' },
  { id:'u1-l1-03', level:1, type:'tf', tags:['표본경로'], src:'교재 표준',
    statement:'확률과정에서 실험을 한 번 수행해 얻는 결과는 숫자 하나가 아니라 시간의 함수 하나(표본경로, sample path)다.',
    answer:true, expl:'주사위(확률변수)는 한 번 던지면 숫자, 확률과정은 한 번 "돌리면" 궤적. 같은 과정을 다시 돌리면 다른 경로가 나온다.' },
  { id:'u1-l1-04', level:1, type:'mc', tags:['조건부확률'], src:'교재 표준',
    statement:'조건부확률의 정의로 옳은 것은? (P(B)>0)',
    choices:['\\(P(A\\mid B)=\\dfrac{P(A\\cap B)}{P(B)}\\)','P(A)+P(B)','P(A∩B)·P(B)','P(A)/P(B)'],
    answer:0, expl:'"B가 일어난 세계로 우주를 줄이고 그 안에서 A의 비중을 재라". 마르코프 연쇄(U6)의 전이확률이 전부 이 정의 위에 선다.' },
  { id:'u1-l1-05', level:1, type:'tf', tags:['독립'], src:'교재 표준',
    statement:'두 사건이 독립이면 \\(P(A\\cap B)=P(A)P(B)\\)이고, 이때 \\(P(A\\mid B)=P(A)\\)다.',
    answer:true, expl:'"B를 알아도 A에 대한 정보가 갱신되지 않는다"의 수식 번역. 포아송과정의 독립 증분(U3)이 이 성질의 과정 버전이다.' },
  { id:'u1-l1-06', level:1, type:'mc', tags:['분산 성질'], src:'교재 표준',
    statement:'\\(\\mathrm{Var}(aX+b)\\)는?',
    choices:['\\(a^2\\,\\mathrm{Var}(X)\\)','a·Var(X)','a²Var(X)+b','Var(X)+b'],
    answer:0, expl:'평행이동 b는 퍼짐을 못 바꾸고, 배율 a는 제곱으로 들어간다(분산은 제곱 스케일). 표준편차로는 |a|배.' },

  /* ---------- L2 (12) ---------- */
  { id:'u1-l2-01', level:2, type:'num', tags:['합사건'], src:'창작 문제(검산됨)',
    params:{ pA:{choices:[0.3,0.4,0.5],unit:''}, pB:{choices:[0.2,0.3],unit:''}, pAB:{choices:[0.05,0.1],unit:''} },
    statement:function(p){ return 'P(A)='+p.pA+', P(B)='+p.pB+', P(A∩B)='+p.pAB+'일 때 P(A∪B)는?'; },
    solve:function(p){ var v=p.pA+p.pB-p.pAB;
      return { ans:v, unit:'', steps:[
        '포함–배제: P(A∪B) = P(A)+P(B)−P(A∩B) (겹친 부분을 한 번 빼준다)',
        '= '+p.pA+'+'+p.pB+'−'+p.pAB+' = '+SVH.fmt(v) ] }; },
    hints:['겹침을 두 번 세지 않기.'] },
  { id:'u1-l2-02', level:2, type:'num', tags:['조건부'], src:'창작 문제(검산됨)',
    params:{ pAB:{choices:[0.06,0.12,0.2],unit:''}, pB:{choices:[0.3,0.4],unit:''} },
    statement:function(p){ return 'P(A∩B)='+p.pAB+', P(B)='+p.pB+'일 때 P(A|B)는?'; },
    solve:function(p){ var v=p.pAB/p.pB;
      return { ans:v, unit:'', steps:[
        'P(A|B) = P(A∩B)/P(B)',
        '= '+p.pAB+'/'+p.pB+' = '+SVH.fmt(v)+' — 우주를 B로 줄인 뒤의 비중' ] }; },
    hints:['정의 그대로.'] },
  { id:'u1-l2-03', level:2, type:'num', tags:['전확률'], src:'창작 문제(검산됨)',
    params:{ w:{choices:[0.2,0.3,0.5],unit:''}, a:{choices:[0.8,0.9],unit:''}, b:{choices:[0.1,0.2,0.3],unit:''} },
    statement:function(p){ return '공장 1(비중 '+p.w+', 양품률 '+p.a+')과 공장 2(비중 '+(1-p.w).toFixed(1)+', 양품률 '+p.b+'). 임의 제품이 양품일 확률은?'; },
    solve:function(p){ var v=p.w*p.a+(1-p.w)*p.b;
      return { ans:v, unit:'', steps:[
        '전확률: P(양품) = P(공장1)P(양품|1)+P(공장2)P(양품|2)',
        '= '+p.w+'×'+p.a+'+'+SVH.fmt(1-p.w)+'×'+p.b+' = '+SVH.fmt(v)+' — 시나리오별 가중평균' ] }; },
    hints:['분할 × 조건부 → 합.'] },
  { id:'u1-l2-04', level:2, type:'num', tags:['베이즈'], src:'창작 문제(검산됨)',
    params:{ w:{choices:[0.2,0.3,0.5],unit:''}, a:{choices:[0.8,0.9],unit:''}, b:{choices:[0.1,0.2,0.3],unit:''} },
    statement:function(p){ return '위와 같은 두 공장. 양품이 관측됐을 때 그것이 공장 1 제품일 확률(사후확률)은?'; },
    solve:function(p){ var v=p.w*p.a/(p.w*p.a+(1-p.w)*p.b);
      return { ans:v, unit:'', steps:[
        '베이즈: P(1|양품) = P(1)P(양품|1) / P(양품)',
        '= '+SVH.fmt(p.w*p.a)+'/'+SVH.fmt(p.w*p.a+(1-p.w)*p.b)+' = '+SVH.fmt(v)+' — 관측이 사전확률 '+p.w+'을 갱신했다' ] }; },
    hints:['분모는 전확률(앞 문제).'] },
  { id:'u1-l2-05', level:2, type:'num', tags:['기댓값'], src:'창작 문제(검산됨)',
    params:{ x1:{choices:[0,1],unit:''}, x2:{choices:[2,3],unit:''}, x3:{choices:[5,10],unit:''}, p1:{choices:[0.2,0.5],unit:''}, p2:{choices:[0.3,0.4],unit:''} },
    constraint:function(p){ return p.p1+p.p2 < 0.95; },
    statement:function(p){ return 'X가 '+p.x1+'('+p.p1+'), '+p.x2+'('+p.p2+'), '+p.x3+'('+SVH.fmt(1-p.p1-p.p2)+')의 분포를 가진다. E[X]는?'; },
    solve:function(p){ var p3=1-p.p1-p.p2, v=p.x1*p.p1+p.x2*p.p2+p.x3*p3;
      return { ans:v, unit:'', steps:[
        'E[X] = Σx·p(x) = '+p.x1+'×'+p.p1+'+'+p.x2+'×'+p.p2+'+'+p.x3+'×'+SVH.fmt(p3),
        '= '+SVH.fmt(v)+' — 확률 가중 무게중심' ] }; },
    hints:['세 번째 확률은 1−나머지.'] },
  { id:'u1-l2-06', level:2, type:'num', tags:['분산'], src:'창작 문제(검산됨)',
    params:{ x1:{choices:[0,1],unit:''}, x2:{choices:[2,4],unit:''}, p1:{choices:[0.3,0.5,0.7],unit:''} },
    statement:function(p){ return 'X가 '+p.x1+'(확률 '+p.p1+'), '+p.x2+'(확률 '+SVH.fmt(1-p.p1)+') 두 값을 가진다. E[X]와 Var(X)를 구하라.'; },
    solve:function(p){ var q=1-p.p1, E=p.x1*p.p1+p.x2*q, E2=p.x1*p.x1*p.p1+p.x2*p.x2*q, V=E2-E*E;
      return { ans:{EX:E, VX:V}, unit:{EX:'', VX:''}, steps:[
        'E[X] = '+SVH.fmt(E)+', E[X²] = '+SVH.fmt(E2),
        'Var = E[X²]−(E[X])² = '+SVH.fmt(E2)+'−'+SVH.fmt(E*E)+' = '+SVH.fmt(V)+' — 계산은 언제나 이 지름길로' ] }; },
    hints:['정의식보다 E[X²]−E[X]²이 빠르다.'] },
  { id:'u1-l2-07', level:2, type:'num', tags:['이항분포'], src:'창작 문제(검산됨)',
    params:{ n:{choices:[4,5,6],unit:''}, k:{choices:[1,2,3],unit:''}, pr:{choices:[0.2,0.3,0.5],unit:''} },
    constraint:function(p){ return p.k <= p.n; },
    statement:function(p){ return '성공률 p='+p.pr+'인 시행 n='+p.n+'회에서 정확히 k='+p.k+'회 성공할 확률 \\(\\binom{n}{k}p^k(1-p)^{n-k}\\)은?'; },
    solve:function(p){ var C=1,i; for(i=0;i<p.k;i++){ C=C*(p.n-i)/(i+1); }
      var v=C*Math.pow(p.pr,p.k)*Math.pow(1-p.pr,p.n-p.k);
      return { ans:v, unit:'', steps:[
        'C('+p.n+','+p.k+') = '+SVH.fmt(C)+' — 성공 위치 고르는 경우의 수',
        '× p^k(1−p)^{n−k} = '+SVH.fmt(v) ] }; },
    hints:['조합 × 한 배치의 확률.'] },
  { id:'u1-l2-08', level:2, type:'num', tags:['기하분포'], src:'창작 문제(검산됨)',
    params:{ pr:{choices:[0.1,0.25,0.5],unit:''}, k:{choices:[2,3,4],unit:''} },
    statement:function(p){ return '성공률 p='+p.pr+'. 첫 성공이 k='+p.k+'번째 시행에서 나올 확률과 E[X]=1/p를 구하라.'; },
    solve:function(p){ var v=Math.pow(1-p.pr,p.k-1)*p.pr;
      return { ans:{pk:v, EX:1/p.pr}, unit:{pk:'', EX:'회'}, steps:[
        'P(X='+p.k+') = (1−p)^{k−1}p = '+SVH.fmt(v)+' — 실패 '+(p.k-1)+'번 뒤 성공',
        'E[X] = 1/p = '+SVH.fmt(1/p.pr)+'회 — 지수분포의 이산 쌍둥이(무기억성도 공유)' ] }; },
    hints:['실패^(k−1)×성공.'] },
  { id:'u1-l2-09', level:2, type:'num', tags:['포아송분포'], src:'창작 문제(검산됨)',
    params:{ mu:{choices:[1,2,3.5],unit:''}, k:{choices:[0,1,2,3],unit:''} },
    statement:function(p){ return '평균 μ='+p.mu+'인 포아송분포에서 \\(P(X=k)=e^{-\\mu}\\mu^k/k!\\), k='+p.k+'의 값은?'; },
    solve:function(p){ var f=1,i; for(i=2;i<=p.k;i++) f*=i;
      var v=Math.exp(-p.mu)*Math.pow(p.mu,p.k)/f;
      return { ans:v, unit:'', steps:[
        'k! = '+f+', μ^k = '+SVH.fmt(Math.pow(p.mu,p.k)),
        'P = e^{−'+p.mu+'}×'+SVH.fmt(Math.pow(p.mu,p.k))+'/'+f+' = '+SVH.fmt(v)+' — U3 포아송과정의 심장 공식' ] }; },
    hints:['e^{−μ}부터 계산.'] },
  { id:'u1-l2-10', level:2, type:'num', tags:['균등분포'], src:'창작 문제(검산됨)',
    params:{ b:{choices:[4,10,20],unit:''}, c:{choices:[1,2,3],unit:''} },
    constraint:function(p){ return p.c < p.b; },
    statement:function(p){ return 'X~U(0,'+p.b+')일 때 P(X>'+p.c+')와 E[X]를 구하라.'; },
    solve:function(p){ var v=(p.b-p.c)/p.b;
      return { ans:{pv:v, EX:p.b/2}, unit:{pv:'', EX:''}, steps:[
        'P(X>c) = (b−c)/b = '+SVH.fmt(v)+' — 길이의 비',
        'E[X] = b/2 = '+SVH.fmt(p.b/2)+' — U3 조건부 균등성에서 재등장할 분포' ] }; },
    hints:['균등은 길이가 곧 확률.'] },
  { id:'u1-l2-11', level:2, type:'num', tags:['지수 미리보기'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[0.5,1,2],unit:'/시간'}, t:{choices:[1,2,3],unit:'시간'} },
    statement:function(p){ return 'X~Exp(λ='+p.lam+'/시간)일 때 생존확률 \\(P(X>t)=e^{-\\lambda t}\\), t='+p.t+'시간의 값은?'; },
    solve:function(p){ var v=Math.exp(-p.lam*p.t);
      return { ans:v, unit:'', steps:[
        'P(X>'+p.t+') = e^{−'+p.lam+'×'+p.t+'} = e^{−'+SVH.fmt(p.lam*p.t)+'}',
        '= '+SVH.fmt(v)+' — U2 전체가 이 꼬리 하나에서 나온다' ] }; },
    hints:['지수 생존함수.'] },
  { id:'u1-l2-12', level:2, type:'num', tags:['표준화'], src:'창작 문제(검산됨)',
    params:{ mu:{choices:[50,100],unit:''}, sig:{choices:[5,10],unit:''}, x:{choices:[60,110,115],unit:''} },
    statement:function(p){ return '평균 μ='+p.mu+', 표준편차 σ='+p.sig+'인 분포에서 관측값 x='+p.x+'의 표준화 점수 z=(x−μ)/σ는?'; },
    solve:function(p){ var v=(p.x-p.mu)/p.sig;
      return { ans:v, unit:'', steps:[
        'z = ('+p.x+'−'+p.mu+')/'+p.sig,
        '= '+SVH.fmt(v)+' — "평균에서 몇 σ 떨어졌나"의 무차원화(U5 재생 CLT에서 사용)' ] }; },
    hints:['단위를 σ로 바꾸는 것.'] },

  /* ---------- L3 (14) ---------- */
  { id:'u1-l3-01', level:3, type:'num', tags:['베이즈 진단'], src:'기출 유형',
    params:{ pi:{choices:[0.001,0.01,0.1],unit:''}, se:{choices:[0.95,0.99],unit:''}, sp:{choices:[0.9,0.95],unit:''} },
    statement:function(p){ return '유병률 π='+p.pi+', 민감도 '+p.se+', 특이도 '+p.sp+'인 검사에서 양성이 나왔다. 실제 병일 확률(PPV)은?'; },
    solve:function(p){ var v=p.pi*p.se/(p.pi*p.se+(1-p.pi)*(1-p.sp));
      return { ans:v, unit:'', steps:[
        'PPV = πse/(πse+(1−π)(1−sp)) = '+SVH.fmt(p.pi*p.se)+'/'+SVH.fmt(p.pi*p.se+(1-p.pi)*(1-p.sp)),
        '= '+SVH.fmt(v)+' — 희귀병이면 양성이어도 오탐이 다수: 사전확률이 지배한다' ] }; },
    hints:['분모 = 진짜양성+가짜양성.'] },
  { id:'u1-l3-02', level:3, type:'num', tags:['여사건'], src:'창작 문제(검산됨)',
    params:{ pr:{choices:[0.05,0.1,0.2],unit:''}, n:{choices:[3,5,10],unit:''} },
    statement:function(p){ return '각 시행 성공률 p='+p.pr+'인 독립 시행 n='+p.n+'회에서 적어도 1회 성공할 확률은?'; },
    solve:function(p){ var v=1-Math.pow(1-p.pr,p.n);
      return { ans:v, unit:'', steps:[
        'P(≥1) = 1−P(전부 실패) = 1−(1−p)^n',
        '= 1−'+SVH.fmt(Math.pow(1-p.pr,p.n))+' = '+SVH.fmt(v)+' — "적어도"는 여사건이 정석' ] }; },
    hints:['전부 실패의 반대.'] },
  { id:'u1-l3-03', level:3, type:'num', tags:['선형성'], src:'창작 문제(검산됨)',
    params:{ EX:{choices:[2,3],unit:''}, EY:{choices:[1,5],unit:''}, a:{choices:[2,3],unit:''}, b:{choices:[1,4],unit:''} },
    statement:function(p){ return 'E[X]='+p.EX+', E[Y]='+p.EY+'일 때 E['+p.a+'X+'+p.b+'Y]는? (독립 여부와 무관함에 주목)'; },
    solve:function(p){ var v=p.a*p.EX+p.b*p.EY;
      return { ans:v, unit:'', steps:[
        '기댓값 선형성: E[aX+bY] = aE[X]+bE[Y] — 독립이 아니어도 항상 성립',
        '= '+p.a+'×'+p.EX+'+'+p.b+'×'+p.EY+' = '+SVH.fmt(v) ] }; },
    hints:['선형성엔 조건이 없다(분산과 대비).'] },
  { id:'u1-l3-04', level:3, type:'num', tags:['독립 합'], src:'창작 문제(검산됨)',
    params:{ EX:{choices:[2,4],unit:''}, VX:{choices:[1,3],unit:''}, EY:{choices:[1,3],unit:''}, VY:{choices:[2,4],unit:''} },
    statement:function(p){ return '독립인 X(E='+p.EX+', Var='+p.VX+'), Y(E='+p.EY+', Var='+p.VY+')에 대해 S=X+Y의 평균과 분산은?'; },
    solve:function(p){ return { ans:{ES:p.EX+p.EY, VS:p.VX+p.VY}, unit:{ES:'', VS:''}, steps:[
        'E[S] = '+p.EX+'+'+p.EY+' = '+(p.EX+p.EY)+' (항상)',
        'Var(S) = '+p.VX+'+'+p.VY+' = '+(p.VX+p.VY)+' — 분산의 합은 독립(무상관)일 때만' ] }; },
    hints:['평균은 공짜, 분산은 독립 필요.'] },
  { id:'u1-l3-05', level:3, type:'num', tags:['조건부 기댓값'], src:'기출 유형',
    params:{ w:{choices:[0.3,0.4,0.6],unit:''}, m1:{choices:[10,20],unit:''}, m2:{choices:[40,60],unit:''} },
    statement:function(p){ return '요청이 확률 '+p.w+'로 캐시 적중(평균 처리 '+p.m1+'µs), 아니면 미스(평균 '+p.m2+'µs). 전체 평균 처리시간 E[T]=E[E[T|적중여부]]는?'; },
    solve:function(p){ var v=p.w*p.m1+(1-p.w)*p.m2;
      return { ans:v, unit:'µs', steps:[
        '반복 기댓값(타워): E[T] = P(적중)E[T|적중]+P(미스)E[T|미스]',
        '= '+p.w+'×'+p.m1+'+'+SVH.fmt(1-p.w)+'×'+p.m2+' = '+SVH.fmt(v)+' µs — 시나리오 평균의 평균' ] }; },
    hints:['전확률의 기댓값 버전.'] },
  { id:'u1-l3-06', level:3, type:'num', tags:['포아송 꼬리'], src:'창작 문제(검산됨)',
    params:{ mu:{choices:[0.5,1,2],unit:''} },
    statement:function(p){ return '평균 μ='+p.mu+' 포아송에서 P(X≥1)=1−e^{−μ}는?'; },
    solve:function(p){ var v=1-Math.exp(-p.mu);
      return { ans:v, unit:'', steps:[
        'P(X≥1) = 1−P(X=0) = 1−e^{−μ}',
        '= '+SVH.fmt(v)+' — U3에서 "t 동안 도착 있음"으로 매일 쓴다' ] }; },
    hints:['0건의 여사건.'] },
  { id:'u1-l3-07', level:3, type:'num', tags:['포아송 근사'], src:'창작 문제(검산됨)',
    params:{ n:{choices:[50,100],unit:''}, pr:{choices:[0.02,0.05],unit:''}, k:{choices:[1,2],unit:''} },
    statement:function(p){ return '희귀 사건: n='+p.n+', p='+p.pr+' 이항의 P(X='+p.k+')를 정확값과 포아송 근사(μ=np)로 각각 구하라.'; },
    solve:function(p){ var C=1,i; for(i=0;i<p.k;i++){ C=C*(p.n-i)/(i+1); }
      var pb=C*Math.pow(p.pr,p.k)*Math.pow(1-p.pr,p.n-p.k);
      var mu=p.n*p.pr, f=1; for(i=2;i<=p.k;i++) f*=i;
      var pp=Math.exp(-mu)*Math.pow(mu,p.k)/f;
      return { ans:{binom:pb, pois:pp}, unit:{binom:'', pois:''}, steps:[
        '정확(이항): '+SVH.fmt(pb)+' · 근사(포아송 μ=np='+SVH.fmt(mu)+'): '+SVH.fmt(pp),
        '거의 일치 — "많은 시행 × 작은 확률 = 포아송"이 포아송과정 공리(U3)의 밑그림' ] }; },
    hints:['μ=np 하나로 요약된다.'] },
  { id:'u1-l3-08', level:3, type:'num', tags:['최댓값 분포'], src:'창작 문제(검산됨)',
    params:{ n:{choices:[2,3,5],unit:''}, x:{choices:[0.5,0.8,0.9],unit:''} },
    statement:function(p){ return '독립 U(0,1) 확률변수 '+p.n+'개의 최댓값 M에 대해 P(M≤'+p.x+')=x^n은?'; },
    solve:function(p){ var v=Math.pow(p.x,p.n);
      return { ans:v, unit:'', steps:[
        '최댓값이 x 이하 ⇔ 전부 x 이하: 독립이라 곱 → x^n',
        '= '+p.x+'^'+p.n+' = '+SVH.fmt(v)+' — min/max는 "전부/하나라도"로 번역(U2 min 지수의 예습)' ] }; },
    hints:['max≤x ⇔ 모두 ≤x.'] },
  { id:'u1-l3-09', level:3, type:'num', tags:['기하 무기억'], src:'창작 문제(검산됨)',
    params:{ pr:{choices:[0.2,0.3,0.5],unit:''}, n:{choices:[2,3],unit:''} },
    statement:function(p){ return '기하분포(성공률 p='+p.pr+')에서 P(X>m+n | X>m)=P(X>n)=(1−p)^n을 n='+p.n+'으로 확인하라.'; },
    solve:function(p){ var v=Math.pow(1-p.pr,p.n);
      return { ans:v, unit:'', steps:[
        'P(X>n) = (1−p)^n = '+SVH.fmt(v),
        '이미 m번 실패했어도 남은 기다림의 분포는 처음과 동일 — 무기억성. 연속판이 지수분포(U2)' ] }; },
    hints:['조건부가 원래 꼬리와 같다.'] },
  { id:'u1-l3-10', level:3, type:'num', tags:['계수과정 감각'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[2,4,6],unit:'/시간'}, t:{choices:[0.5,2,3],unit:'시간'} },
    statement:function(p){ return '시간당 평균 λ='+p.lam+'건 도착하는 계수과정 N(t). t='+p.t+'시간 동안의 기대 도착 수와 분산(포아송 가정)은?'; },
    solve:function(p){ var m=p.lam*p.t;
      return { ans:{E:m, V:m}, unit:{E:'건', V:''}, steps:[
        'E[N(t)] = λt = '+SVH.fmt(m)+'건',
        'Var[N(t)] = λt = '+SVH.fmt(m)+' — 평균=분산이 포아송의 지문(U3 본론)' ] }; },
    hints:['둘 다 λt.'] },
  { id:'u1-l3-11', level:3, type:'num', tags:['pdf 적분'], src:'창작 문제(검산됨)',
    params:{ a:{choices:[0.2,0.3],unit:''}, b:{choices:[0.6,0.8,1],unit:''} },
    constraint:function(p){ return p.a < p.b; },
    statement:function(p){ return '밀도 f(x)=2x (0≤x≤1)인 X에 대해 P('+p.a+'<X<'+p.b+')=b²−a²은?'; },
    solve:function(p){ var v=p.b*p.b-p.a*p.a;
      return { ans:v, unit:'', steps:[
        'P = ∫ 2x dx = [x²] = '+p.b+'²−'+p.a+'²',
        '= '+SVH.fmt(v)+' — 연속 확률은 밀도의 적분(넓이)' ] }; },
    hints:['원시함수 x².'] },
  { id:'u1-l3-12', level:3, type:'num', tags:['공분산'], src:'창작 문제(검산됨)',
    params:{ EXY:{choices:[7,10],unit:''}, EX:{choices:[2,3],unit:''}, EY:{choices:[2,3],unit:''} },
    statement:function(p){ return 'E[XY]='+p.EXY+', E[X]='+p.EX+', E[Y]='+p.EY+'일 때 Cov(X,Y)는?'; },
    solve:function(p){ var v=p.EXY-p.EX*p.EY;
      return { ans:v, unit:'', steps:[
        'Cov = E[XY]−E[X]E[Y] = '+p.EXY+'−'+(p.EX*p.EY),
        '= '+SVH.fmt(v)+(p.EXY-p.EX*p.EY>0?' > 0: 같이 움직이는 경향':' — 부호가 방향, 크기는 스케일 의존') ] }; },
    hints:['분산 지름길의 2변수판.'] },
  { id:'u1-l3-13', level:3, type:'num', tags:['상관계수'], src:'창작 문제(검산됨)',
    params:{ cov:{choices:[2,3,6],unit:''}, sx:{choices:[2,3],unit:''}, sy:{choices:[2,4],unit:''} },
    constraint:function(p){ return p.cov <= p.sx*p.sy; },
    statement:function(p){ return 'Cov(X,Y)='+p.cov+', σ_X='+p.sx+', σ_Y='+p.sy+'일 때 상관계수 ρ는?'; },
    solve:function(p){ var v=p.cov/(p.sx*p.sy);
      return { ans:v, unit:'', steps:[
        'ρ = Cov/(σ_Xσ_Y) = '+p.cov+'/'+(p.sx*p.sy),
        '= '+SVH.fmt(v)+' — 스케일을 지운 −1~1 표준화: 1이면 완전 선형' ] }; },
    hints:['공분산의 무차원화.'] },
  { id:'u1-l3-14', level:3, type:'num', tags:['마르코프 부등식'], src:'교재 표준',
    params:{ EX:{choices:[2,5,10],unit:''}, a:{choices:[20,50],unit:''} },
    statement:function(p){ return '음이 아닌 X, E[X]='+p.EX+'일 때 마르코프 부등식이 주는 P(X≥'+p.a+')의 상한 E[X]/a는?'; },
    solve:function(p){ var v=p.EX/p.a;
      return { ans:v, unit:'', steps:[
        'P(X≥a) ≤ E[X]/a = '+p.EX+'/'+p.a+' = '+SVH.fmt(v),
        '분포를 몰라도 평균만으로 꼬리를 누르는 만능(그러나 느슨한) 도구' ] }; },
    hints:['평균/문턱.'] },

  /* ---------- L4 (8) ---------- */
  { id:'u1-l4-01', level:4, type:'derive', tags:['전확률·베이즈'], src:'교재 표준',
    statement:'분할 \\(\\{B_i\\}\\)에 대한 전확률 공식과 베이즈 정리를 곱셈규칙에서 유도하라.',
    steps:[
      '분할: B_i들이 서로소이고 합집합이 전체 [왜] A를 조각내는 칸막이가 필요하다',
      'A = ∪(A∩B_i) (서로소 합) ⇒ P(A) = ΣP(A∩B_i)',
      '곱셈규칙 P(A∩B_i)=P(B_i)P(A|B_i) 대입 ⇒ 전확률 P(A)=ΣP(B_i)P(A|B_i)',
      '베이즈: P(B_j|A) = P(A∩B_j)/P(A) = P(B_j)P(A|B_j) / ΣP(B_i)P(A|B_i) — 사전→사후 갱신 공식',
      '극한 체크: 어떤 B_j가 확실(P=1)이면 사후도 그대로 ✓ · ΣP(B_j|A)=1 (정규화) ✓'
    ],
    hints:['칸막이(분할)+곱셈규칙 두 개면 끝.','베이즈 분모는 언제나 전확률.'],
    expl:'U6 마르코프 연쇄의 n스텝 분해(C-K 방정식)가 정확히 이 전확률 논법의 반복이다.' },
  { id:'u1-l4-02', level:4, type:'num', tags:['몬티홀 일반화'], src:'교재 표준',
    params:{ n:{choices:[3,4,5],unit:''} },
    statement:function(p){ return '문 '+p.n+'개 몬티홀: 하나 고른 뒤 사회자가 염소 문 1개를 연다. 바꿨을 때 당첨 확률 (n−1)/(n(n−2))은? (안 바꾸면 1/n)'; },
    solve:function(p){ var v=(p.n-1)/(p.n*(p.n-2));
      return { ans:v, unit:'', steps:[
        '처음 오답(확률 (n−1)/n)이었다면, 남은 n−2개 중 정답 1개 → 조건부 1/(n−2)',
        'P(바꿔서 당첨) = (n−1)/n × 1/(n−2) = '+SVH.fmt(v)+' > 1/n='+SVH.fmt(1/p.n)+' — 사회자의 행동이 정보다(베이즈 갱신)' ] }; },
    hints:['처음이 틀렸을 때만 바꾸기가 이긴다.'] },
  { id:'u1-l4-03', level:4, type:'num', tags:['쿠폰 수집'], src:'교재 표준',
    params:{ n:{choices:[3,4,5,6],unit:''} },
    statement:function(p){ return '종류 n='+p.n+'개 쿠폰을 전부 모으는 기대 구매 수 E=n(1+1/2+…+1/n)은?'; },
    solve:function(p){ var H=0,i; for(i=1;i<=p.n;i++) H+=1/i;
      var v=p.n*H;
      return { ans:v, unit:'개', steps:[
        '새 종류 j번째를 얻는 데 성공률 (n−j+1)/n인 기하 대기 → 기대 n/(n−j+1)',
        '합하면 nH_n = '+p.n+'×'+SVH.fmt(H)+' = '+SVH.fmt(v)+'개 — 기하 대기의 선형 결합(U2 병렬 수명에서 재등장)' ] }; },
    hints:['단계별 기하분포로 쪼갠다.'] },
  { id:'u1-l4-04', level:4, type:'derive', tags:['기하 기댓값'], src:'교재 표준',
    statement:'기하분포 E[X]=1/p를 재귀(1단계 조건화)로 유도하라.',
    steps:[
      '첫 시행에서 조건화: 성공(확률 p)이면 X=1, 실패(1−p)면 이미 1회 쓰고 처음부터 다시 [왜] 무기억성 — 실패해도 게임은 리셋',
      'E[X] = p·1 + (1−p)(1+E[X])',
      '정리: E[X] = 1+(1−p)E[X] ⇒ pE[X] = 1',
      '∴ E[X] = 1/p — 급수 미분 없이 한 줄',
      '극한 체크: p→1 ⇒ E→1(첫 방 성공) ✓ · p→0 ⇒ E→∞ ✓'
    ],
    hints:['"실패하면 리셋"을 식으로.','같은 기법이 U6 기대 흡수시간의 원형.'],
    expl:'1단계 조건화(first-step analysis)는 이 과목 최강 무기 — U5 재생, U6 흡수시간이 전부 이 틀이다.' },
  { id:'u1-l4-05', level:4, type:'num', tags:['교란순열'], src:'교재 표준',
    params:{ n:{choices:[4,5,6],unit:''} },
    statement:function(p){ return 'n='+p.n+'명이 모자를 무작위로 나눠 가질 때 아무도 자기 모자를 못 받을 확률 \\(\\sum_{k=0}^{n}(-1)^k/k!\\)은?'; },
    solve:function(p){ var s=0,f=1,k; for(k=0;k<=p.n;k++){ if(k>0) f*=k; s+=Math.pow(-1,k)/f; }
      return { ans:s, unit:'', steps:[
        '포함–배제로 "적어도 한 명 일치"를 걷어내면 D_n/n! = Σ(−1)^k/k!',
        '= '+SVH.fmt(s)+' → n이 커지면 e^{−1}≈0.3679로 수렴 — 포함–배제의 대표 응용' ] }; },
    hints:['e^{−1} 근처가 나와야 정상.'] },
  { id:'u1-l4-06', level:4, type:'num', tags:['랜덤워크'], src:'창작 문제(검산됨)',
    params:{ n:{choices:[2,4,6],unit:''} },
    statement:function(p){ return '공정한 ±1 랜덤워크 \\(S_n=\\sum X_i\\). Var(S_'+p.n+')와 P(S_'+p.n+'=0)을 구하라.'; },
    solve:function(p){ var C=1,i,h=p.n/2; for(i=0;i<h;i++){ C=C*(p.n-i)/(i+1); }
      var v=C/Math.pow(2,p.n);
      return { ans:{V:p.n, p0:v}, unit:{V:'', p0:''}, steps:[
        'E[X_i]=0, Var=1 → Var(S_n)=n='+p.n+' (독립 합) — 퍼짐은 √n으로 자란다',
        'P(S_n=0) = C(n,n/2)/2^n = '+SVH.fmt(v)+' — 가장 단순한 확률과정의 표본경로 통계' ] }; },
    hints:['원점 복귀 = +1과 −1이 반반.'] },
  { id:'u1-l4-07', level:4, type:'num', tags:['조건부 분산'], src:'기출 유형',
    params:{ w:{choices:[0.3,0.5],unit:''}, m1:{choices:[10,20],unit:''}, m2:{choices:[40,60],unit:''}, v1:{choices:[4,9],unit:''}, v2:{choices:[16,25],unit:''} },
    statement:function(p){ return '혼합: 확률 '+p.w+'로 그룹1(평균 '+p.m1+', 분산 '+p.v1+'), 아니면 그룹2(평균 '+p.m2+', 분산 '+p.v2+'). 전체 평균과 분산(Var=E[Var|G]+Var(E[·|G]))을 구하라.'; },
    solve:function(p){ var q=1-p.w, E=p.w*p.m1+q*p.m2, within=p.w*p.v1+q*p.v2, between=p.w*Math.pow(p.m1-E,2)+q*Math.pow(p.m2-E,2);
      return { ans:{E:E, V:within+between}, unit:{E:'', V:''}, steps:[
        'E = '+SVH.fmt(E)+' · 그룹 내 분산 평균 = '+SVH.fmt(within)+', 그룹 간(평균 차) 분산 = '+SVH.fmt(between),
        'Var = within+between = '+SVH.fmt(within+between)+' — 전분산 공식: U4 복합 포아송 분산의 뼈대' ] }; },
    hints:['안쪽 흩어짐+바깥쪽 흩어짐.'] },
  { id:'u1-l4-08', level:4, type:'derive', tags:['확률과정 지도'], src:'강의자료 대조',

    statement:function(p){ return '두 부품(λ₁='+p.l1+', λ₂='+p.l2+') 직렬 시스템이 t='+p.t+'시간 무고장일 확률 P(min>t)는?'; },
    solve:function(p){ var v=Math.exp(-(p.l1+p.l2)*p.t);
      return { ans:v, unit:'', steps:[
        'P(min>t) = P(X₁>t)P(X₂>t) = e^{−(λ₁+λ₂)t}',
        '= e^{−'+SVH.fmt((p.l1+p.l2)*p.t)+'} = '+SVH.fmt(v)+' — 직렬 신뢰도는 곱 = rate는 합' ] }; },
    hints:['둘 다 살아야 min>t.'] },
  { id:'u2-l3-04', level:3, type:'num', tags:['Erlang-2 꼬리'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[1,2],unit:'/시간'}, t:{choices:[1,2],unit:'시간'} },
    statement:function(p){ return '지수 수명 부품+예비품 1개(핫스왑): 총 수명 S₂=X₁+X₂. P(S₂>t)=e^{−λt}(1+λt)는? (λ='+p.lam+', t='+p.t+')'; },
    solve:function(p){ var m=p.lam*p.t, v=Math.exp(-m)*(1+m);
      return { ans:v, unit:'', steps:[
        'S₂>t ⇔ t까지 고장이 1건 이하(포아송 다리): e^{−λt}(1+λt)',
        '= '+SVH.fmt(v)+' — 지수 합(Erlang)의 꼬리는 포아송 부분합: U3의 핵심 항등식 예고' ] }; },
    hints:['고장 횟수로 번역하면 쉽다.'] },
  { id:'u2-l3-05', level:3, type:'num', tags:['Erlang 모멘트'], src:'창작 문제(검산됨)',
    params:{ k:{choices:[2,3,5],unit:''}, lam:{choices:[1,2],unit:'/시간'} },
    statement:function(p){ return 'Erlang(k='+p.k+', λ='+p.lam+') = 지수 '+p.k+'개의 합. 평균과 분산은?'; },
    solve:function(p){ return { ans:{E:p.k/p.lam, V:p.k/(p.lam*p.lam)}, unit:{E:'시간', V:''}, steps:[
        'E = k/λ = '+SVH.fmt(p.k/p.lam)+' · Var = k/λ² = '+SVH.fmt(p.k/(p.lam*p.lam))+' (독립 합)',
        'CV = 1/√k < 1: 겹칠수록 규칙적 — 지수(CV=1)와 결정적(CV=0) 사이의 다리' ] }; },
    hints:['합이니 평균·분산 다 k배.'] },
  { id:'u2-l3-06', level:3, type:'num', tags:['3자 경쟁'], src:'창작 문제(검산됨)',
    params:{ l1:{choices:[0.2,0.5],unit:'/년'}, l2:{choices:[0.3,0.6],unit:'/년'}, l3:{choices:[0.5,1],unit:'/년'} },
    statement:function(p){ return '세 원인(λ='+p.l1+', '+p.l2+', '+p.l3+'/년)이 경쟁하는 시스템. 첫 고장까지 기대 시간과 원인이 3번일 확률을 구하라.'; },
    solve:function(p){ var s=p.l1+p.l2+p.l3;
      return { ans:{Emin:1/s, p3:p.l3/s}, unit:{Emin:'년', p3:''}, steps:[
        'E[min] = 1/Σλ = '+SVH.fmt(1/s)+'년',
        'P(원인=3) = λ₃/Σλ = '+SVH.fmt(p.l3/s)+' — 경쟁 위험(competing risks)의 기본 산수' ] }; },
    hints:['합 rate + rate 비.'] },
  { id:'u2-l3-07', level:3, type:'num', tags:['잔여수명'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[0.1,0.25],unit:'/년'}, s:{choices:[2,5],unit:'년'} },
    statement:function(p){ return 'λ='+p.lam+'/년 지수 수명 부품이 이미 s='+p.s+'년 사용됐다. 기대 잔여수명과 기대 총수명(현시점 기준)을 구하라.'; },
    solve:function(p){ return { ans:{Er:1/p.lam, Et:p.s+1/p.lam}, unit:{Er:'년', Et:'년'}, steps:[
        '무기억성 → 잔여 ~ Exp(λ): E[잔여] = 1/λ = '+SVH.fmt(1/p.lam)+'년 (새것과 동일!)',
        'E[총수명|생존] = s+1/λ = '+SVH.fmt(p.s+1/p.lam)+'년 — 오래 산 개체의 총수명 기대는 계속 늘어난다' ] }; },
    hints:['중고 보정이 없다.'] },
  { id:'u2-l3-08', level:3, type:'num', tags:['조건부 생존'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[0.2,0.5],unit:'/년'}, t:{choices:[1,2],unit:'년'}, u:{choices:[1,3],unit:'년'} },
    statement:function(p){ return 'λ='+p.lam+'/년 장비가 보증기간 t='+p.t+'년을 넘겼다. 추가로 u='+p.u+'년 더 무고장일 확률은?'; },
    solve:function(p){ var v=Math.exp(-p.lam*p.u);
      return { ans:v, unit:'', steps:[
        '무기억성: P = e^{−λu} = e^{−'+SVH.fmt(p.lam*p.u)+'}',
        '= '+SVH.fmt(v)+' — 보증 통과 이력은 프리미엄이 아니다(지수 가정 하에서)' ] }; },
    hints:['u만 남는다.'] },
  { id:'u2-l3-09', level:3, type:'num', tags:['분포 비교'], src:'창작 문제(검산됨)',
    params:{ c:{choices:[1.5,1.8],unit:''} },
    statement:function(p){ return '평균 m이 같은 두 수명 모형이 m의 '+p.c+'배를 넘길 확률: 지수 e^{−c}와 균등 U(0,2m)의 (2−c)/2를 비교하라.'; },
    solve:function(p){ return { ans:{pe:Math.exp(-p.c), pu:(2-p.c)/2}, unit:{pe:'', pu:''}, steps:[
        '지수: e^{−'+p.c+'} = '+SVH.fmt(Math.exp(-p.c))+' · 균등: (2−'+p.c+')/2 = '+SVH.fmt((2-p.c)/2),
        '평균이 같아도 꼬리가 다르면 위험 평가가 다르다 — 분포 가정이 곧 모델링 결정' ] }; },
    hints:['균등은 2m에서 꼬리가 끊긴다.'] },
  { id:'u2-l3-10', level:3, type:'num', tags:['max 재출발'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[0.5,1,2],unit:'/시간'} },
    statement:function(p){ return '같은 λ='+p.lam+'인 두 지수 수명의 E[max]를 "min 후 재출발"로 구하라: E[max]=1/(2λ)+1/λ.'; },
    solve:function(p){ var v=1/(2*p.lam)+1/p.lam;
      return { ans:v, unit:'시간', steps:[
        '첫 고장까지 Exp(2λ): 1/(2λ). 남은 하나는 무기억으로 리셋 → 추가 1/λ',
        'E[max] = '+SVH.fmt(1/(2*p.lam))+'+'+SVH.fmt(1/p.lam)+' = '+SVH.fmt(v)+'시간 — 재출발 논법은 U5 재생 아이디어의 씨앗' ] }; },
    hints:['단계별로 시계를 리셋.'] },
  { id:'u2-l3-11', level:3, type:'num', tags:['가용도 목표'], src:'창작 문제(검산됨)',
    params:{ r:{choices:[0.95,0.99],unit:''}, T:{choices:[100,1000],unit:'시간'} },
    statement:function(p){ return 'T='+p.T+'시간 임무에서 신뢰도 '+p.r+' 이상이 되려면 고장률 λ가 얼마 이하여야 하는가? (λ_max=−ln r/T)'; },
    solve:function(p){ var v=-Math.log(p.r)/p.T;
      return { ans:v, unit:'/시간', steps:[
        'e^{−λT} ≥ r → λ ≤ −ln(r)/T = '+SVH.fmt(-Math.log(p.r))+'/'+p.T,
        '= '+SVH.fmt(v)+'/시간 — 요구 신뢰도가 부품 사양(λ)으로 번역된다' ] }; },
    hints:['u2-l2-11의 역방향.'] },
  { id:'u2-l3-12', level:3, type:'num', tags:['누적 위험'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[0.002,0.01],unit:'/시간'}, t:{choices:[100,500],unit:'시간'} },
    statement:function(p){ return '고장률 λ='+p.lam+'/시간, 운용 t='+p.t+'시간의 누적 위험 H=λt와 신뢰도 R=e^{−H}를 구하라.'; },
    solve:function(p){ var Hh=p.lam*p.t;
      return { ans:{H:Hh, R:Math.exp(-Hh)}, unit:{H:'', R:''}, steps:[
        'H = λt = '+SVH.fmt(Hh)+' (무차원 누적 위험)',
        'R = e^{−H} = '+SVH.fmt(Math.exp(-Hh))+' — H가 0.1이면 R≈90%: H≈1−R 근사(작을 때)도 확인' ] }; },
    hints:['H 하나로 신뢰도가 결정.'] },
  { id:'u2-l3-13', level:3, type:'num', tags:['콜센터'], src:'기출 유형',
    params:{ lam:{choices:[2,3,5],unit:'/분'}, t:{choices:[0.5,1],unit:'분'} },
    statement:function(p){ return '문의 전화가 λ='+p.lam+'/분 지수 간격으로 도착. 다음 전화가 t='+p.t+'분 안에 올 확률과 평균 대기시간을 구하라.'; },
    solve:function(p){ var v=1-Math.exp(-p.lam*p.t);
      return { ans:{P:v, E:1/p.lam}, unit:{P:'', E:'분'}, steps:[
        'P(T≤t) = 1−e^{−λt} = '+SVH.fmt(v),
        'E[T] = 1/λ = '+SVH.fmt(1/p.lam)+'분 — 이 도착 간격 그림이 그대로 U3 포아송과정이 된다' ] }; },
    hints:['도착간격=지수.'] },
  { id:'u2-l3-14', level:3, type:'num', tags:['부품 혼합'], src:'창작 문제(검산됨)',
    params:{ w:{choices:[0.3,0.5],unit:''}, l1:{choices:[0.5,1],unit:'/년'}, l2:{choices:[2,4],unit:'/년'} },
    statement:function(p){ return '로트에 A형(비중 '+p.w+', λ='+p.l1+')과 B형('+SVH.fmt(1-p.w)+', λ='+p.l2+')이 섞여 있다. 임의 부품의 t=1년 생존확률(전확률)은?'; },
    solve:function(p){ var v=p.w*Math.exp(-p.l1)+(1-p.w)*Math.exp(-p.l2);
      return { ans:v, unit:'', steps:[
        'P(X>1) = w·e^{−λ₁}+(1−w)e^{−λ₂} = '+p.w+'×'+SVH.fmt(Math.exp(-p.l1))+'+'+SVH.fmt(1-p.w)+'×'+SVH.fmt(Math.exp(-p.l2)),
        '= '+SVH.fmt(v)+' — 혼합의 실패율은 상수가 아니게 된다(생존자는 A형 쏠림): 무기억성 상실!' ] }; },
    hints:['U1 전확률 + 지수 꼬리.'] },

  /* ---------- L4 (8) ---------- */
  { id:'u2-l4-01', level:4, type:'derive', tags:['무기억성'], src:'강의자료 대조',
    statement:'지수분포의 무기억성을 유도하고, 역으로 무기억성이 지수분포를 유일하게 결정함을 논증하라.',
    steps:[
      '유도: P(X>s+t|X>s) = P(X>s+t)/P(X>s) = e^{−λ(s+t)}/e^{−λs} = e^{−λt} = P(X>t) [왜] 지수 꼬리의 곱 구조',
      '역방향: 무기억성 ⇔ 생존함수 G(t)=P(X>t)가 G(s+t)=G(s)G(t)를 만족',
      '코시 함수방정식: 단조 함수 중 해는 G(t)=e^{−λt} 꼴뿐 (G(1/n)=G(1)^{1/n}에서 유리수→연속 확장)',
      '∴ 연속분포에서 무기억성 = 지수분포 (이산에선 기하분포) — "무기억이라 가정"과 "지수라 가정"은 같은 말',
      '극한 체크: λt≪1 ⇒ P(X≤t)≈λt (짧은 구간 발생확률≈rate×시간 — U3 포아송 공리의 씨앗) ✓'
    ],
    hints:['꼬리의 지수법칙이 전부.','함수방정식 G(s+t)=G(s)G(t)를 기억.'],
    expl:'포아송과정(U3)·연속시간 마르코프(후반부)의 존립 근거 — "미래가 현재 상태만 본다"의 분포론적 뿌리.' },
  { id:'u2-l4-02', level:4, type:'num', tags:['Erlang-3 꼬리'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[1,2],unit:'/시간'}, t:{choices:[1,2],unit:'시간'} },
    statement:function(p){ return '예비품 2개(총 3개 순차 사용, 각 Exp(λ='+p.lam+')): P(S₃>t)=e^{−λt}(1+λt+(λt)²/2)를 t='+p.t+'에서 구하라.'; },
    solve:function(p){ var m=p.lam*p.t, v=Math.exp(-m)*(1+m+m*m/2);
      return { ans:v, unit:'', steps:[
        'S₃>t ⇔ [0,t] 고장 ≤2건: 포아송 부분합 e^{−λt}Σ_{k≤2}(λt)^k/k!',
        '= '+SVH.fmt(v)+' — Erlang 꼬리=포아송 cdf: 적분 없이 급수로 끝난다' ] }; },
    hints:['고장 수 ≤ k−1로 번역.'] },
  { id:'u2-l4-03', level:4, type:'derive', tags:['min·경쟁 유도'], src:'강의자료 대조',
    statement:'독립 지수들의 ① min~Exp(Σλ) ② P(X₁<X₂)=λ₁/(λ₁+λ₂)를 유도하라.',
    steps:[
      '① P(min>t) = P(모두>t) = Πe^{−λᵢt} = e^{−(Σλᵢ)t} [왜] 독립이라 생존의 곱 — min은 rate가 더해진 지수',
      '② P(X₁<X₂) = ∫₀^∞ P(X₂>t)·f₁(t)dt = ∫₀^∞ e^{−λ₂t}λ₁e^{−λ₁t}dt',
      '= λ₁∫₀^∞ e^{−(λ₁+λ₂)t}dt = λ₁/(λ₁+λ₂) — 적분 한 번',
      '보너스: min의 값과 "누가 이겼나"는 독립 — 무기억성의 숨은 선물(U4 분해 독립성의 원형)',
      '극한 체크: λ₂→0(2번이 불멸) ⇒ P(X₁<X₂)→1 ✓ · λ₁=λ₂ ⇒ 1/2 (대칭) ✓'
    ],
    hints:['min은 "전부 생존"의 곱.','경쟁은 조건부 적분 한 줄.'],
    expl:'이 두 결과가 U4 중첩(rate 합)·분해(타입 확률)의 수학적 몸통이다.' },
  { id:'u2-l4-04', level:4, type:'num', tags:['직렬·병렬 설계'], src:'기출 유형',
    params:{ l1:{choices:[0.1,0.2],unit:'/년'}, l2:{choices:[0.2,0.3],unit:'/년'}, t:{choices:[1,2],unit:'년'} },
    statement:function(p){ return '부품 A(λ='+p.l1+'), B(λ='+p.l2+'), t='+p.t+'년 기준: 직렬 신뢰도 R_s=e^{−(λ₁+λ₂)t}와 병렬 신뢰도 R_p=1−(1−e^{−λ₁t})(1−e^{−λ₂t})를 구하라.'; },
    solve:function(p){ var r1=Math.exp(-p.l1*p.t), r2=Math.exp(-p.l2*p.t);
      return { ans:{Rs:r1*r2, Rp:1-(1-r1)*(1-r2)}, unit:{Rs:'', Rp:''}, steps:[
        '직렬(둘 다 필요): R_s = R₁R₂ = '+SVH.fmt(r1*r2),
        '병렬(하나면 충분): R_p = 1−(1−R₁)(1−R₂) = '+SVH.fmt(1-(1-r1)*(1-r2))+' — 구조가 확률 연산(곱 vs 여곱)을 정한다' ] }; },
    hints:['직렬=AND, 병렬=OR.'] },
  { id:'u2-l4-05', level:4, type:'num', tags:['잔여수명 비교'], src:'기출 유형',
    params:{ m:{choices:[10,20],unit:'분'} },
    statement:function(p){ return '평균 '+p.m+'분 간격 버스. ① 간격이 Exp이면 임의 도착 승객의 기대 대기 = m ② 간격이 U(0,2m)이면 = 2m/3. 두 값을 구하라. (직관 m/2가 왜 틀리는지는 U5 검사역설)'; },
    solve:function(p){ return { ans:{Re:p.m, Ru:2*p.m/3}, unit:{Re:'분', Ru:'분'}, steps:[
        '지수: 무기억 → 잔여 ~ Exp, E = m = '+p.m+'분 (평균 간격만큼 통째로 기다린다!)',
        '균등: E[X²]/(2E[X]) = (4m²/3)/(2m) = 2m/3 = '+SVH.fmt(2*p.m/3)+'분 — 긴 간격에 걸릴 확률이 커서 m/2보다 크다' ] }; },
    hints:['내가 도착한 간격은 평범한 간격이 아니다.'] },
  { id:'u2-l4-06', level:4, type:'num', tags:['병렬 n개'], src:'창작 문제(검산됨)',
    params:{ n:{choices:[2,3,4],unit:''}, lam:{choices:[0.5,1],unit:'/년'} },
    statement:function(p){ return '같은 λ='+p.lam+'인 부품 '+p.n+'개 병렬 시스템의 평균 수명 E[max]=(1/λ)(1+1/2+…+1/n)은?'; },
    solve:function(p){ var H=0,i; for(i=1;i<=p.n;i++) H+=1/i;
      var v=H/p.lam;
      return { ans:v, unit:'년', steps:[
        '재출발 사다리: Exp(nλ)→Exp((n−1)λ)→… 각 단계 1/(kλ)',
        '합 = H_n/λ = '+SVH.fmt(H)+'/'+p.lam+' = '+SVH.fmt(v)+'년 — 쿠폰 수집(U1)과 같은 조화수! n배가 아니라 ln n배' ] }; },
    hints:['이중화의 한계효용 체감.'] },
  { id:'u2-l4-07', level:4, type:'num', tags:['분위수 설계'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[0.1,0.5],unit:'/시간'}, q:{choices:[0.9,0.95,0.99],unit:''} },
    statement:function(p){ return 'λ='+p.lam+'/시간 지수 대기시간의 '+p.q+' 분위수 t_q=−ln(1−q)/λ는? (SLA: 이 시간 안에 '+SVH.fmt(p.q*100)+'% 처리)'; },
    solve:function(p){ var v=-Math.log(1-p.q)/p.lam;
      return { ans:v, unit:'시간', steps:[

      '극한 체크: λt≪1에서 P(N=1)≈λt, P(N≥2)=o(t) — 미소구간 공리와 정합 ✓'
    ],
    hints:['{N≥k}⇔{S_k≤t} 다리가 전부.','양방향이라 어느 쪽을 정의로 삼아도 좋다.'],
    expl:'U3의 입구 — 포아송과정의 세 정의(공리·pmf·지수 간격)가 하나라는 선언.' }

]});

    choices:['S_k~Erlang(k,λ)이고 {N(t)≥k}⇔{S_k≤t}','S_k~Exp(kλ)','S_k~Poisson','S_k는 t와 무관'],
    answer:0, expl:'"k번째 도착이 t 이전" = "t까지 k건 이상". 이 다리로 Erlang 꼬리를 포아송 부분합으로 계산한다(적분 불필요).' },

  /* ---------- L2 (12) ---------- */
  { id:'u3-l2-01', level:2, type:'num', tags:['pmf'], src:'창작 문제(검산됨)',

    statement:function(p){ return 'λ='+p.lam+'/시간 포아송 도착. t='+p.t+'시간 동안 정확히 k='+p.k+'건 도착할 확률은?'; },
    solve:function(p){ var m=p.lam*p.t, f=1,i; for(i=2;i<=p.k;i++) f*=i;

      return { ans:v, unit:'', steps:[
        'μ = λt = '+SVH.fmt(m)+' (기대 건수부터!)',
        'P = e^{−μ}μ^k/k! = '+SVH.fmt(v) ] }; },
    hints:['μ=λt 계산이 1단계.'] },
  { id:'u3-l2-02', level:2, type:'num', tags:['무도착'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[0.5,2,6],unit:'/시간'}, t:{choices:[0.5,1],unit:'시간'} },
    statement:function(p){ return 'λ='+p.lam+'/시간일 때 t='+p.t+'시간 동안 도착이 전혀 없을 확률은?'; },
    solve:function(p){ var v=Math.exp(-p.lam*p.t);

        'P(N(t)=0) = e^{−λt} = e^{−'+SVH.fmt(p.lam*p.t)+'} = '+SVH.fmt(v),
        '= P(첫 간격 > t): 같은 사건의 두 얼굴(계수 ↔ 간격)' ] }; },
    hints:['k=0 항만 남는다.'] },
  { id:'u3-l2-03', level:2, type:'num', tags:['평균·분산'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[3,5,10],unit:'/시간'}, t:{choices:[2,8],unit:'시간'} },
    statement:function(p){ return 'λ='+p.lam+'/시간, t='+p.t+'시간 관측. E[N(t)], Var[N(t)]와 표준편차를 구하라. (SD는 √λt)'; },
    solve:function(p){ var m=p.lam*p.t;
      return { ans:{E:m, SD:Math.sqrt(m)}, unit:{E:'건', SD:'건'}, steps:[
        'E = Var = λt = '+SVH.fmt(m),
        'SD = √(λt) = '+SVH.fmt(Math.sqrt(m))+' — 상대 요동 SD/E=1/√μ: 건수가 쌓일수록 매끈해진다' ] }; },
    hints:['포아송은 평균=분산.'] },
  { id:'u3-l2-04', level:2, type:'num', tags:['꼬리'], src:'창작 문제(검산됨)',
    params:{ mu:{choices:[1,2,3],unit:''} },
    statement:function(p){ return '기대 건수 μ=λt='+p.mu+'일 때 2건 이상 도착할 확률 P(N≥2)=1−e^{−μ}(1+μ)는?'; },
    solve:function(p){ var v=1-Math.exp(-p.mu)*(1+p.mu);
      return { ans:v, unit:'', steps:[
        'P(N≥2) = 1−P(0)−P(1) = 1−e^{−μ}(1+μ)',
        '= '+SVH.fmt(v)+' — "이상/이하"는 부분합으로' ] }; },
    hints:['여사건 두 항.'] },
  { id:'u3-l2-05', level:2, type:'num', tags:['정상 증분'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[2,4],unit:'/시간'}, s:{choices:[3,10],unit:'시'}, w:{choices:[0.5,1],unit:'시간'}, k:{choices:[1,2],unit:''} },
    statement:function(p){ return 'λ='+p.lam+'/시간. '+p.s+'시부터 '+p.w+'시간 동안 정확히 k='+p.k+'건 도착할 확률은? (시작 시각과 무관함에 주목)'; },
    solve:function(p){ var m=p.lam*p.w, f=1,i; for(i=2;i<=p.k;i++) f*=i;
      var v=Math.exp(-m)*Math.pow(m,p.k)/f;
      return { ans:v, unit:'', steps:[
        '정상성: 분포는 구간 길이 '+p.w+'에만 의존 → μ = '+SVH.fmt(m),
        'P = e^{−μ}μ^'+p.k+'/'+p.k+'! = '+SVH.fmt(v)+' — 시작점 '+p.s+'시는 미끼' ] }; },
    hints:['길이만 본다.'] },
  { id:'u3-l2-06', level:2, type:'num', tags:['독립 증분 곱'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[1,2],unit:'/시간'}, a:{choices:[0,1],unit:''}, b:{choices:[1,2],unit:''} },
    statement:function(p){ return 'λ='+p.lam+'/시간. 1시간째까지 '+p.a+'건, 그다음 1시간에 '+p.b+'건 도착할 결합확률은?'; },
    solve:function(p){ var f1=1,f2=1,i; for(i=2;i<=p.a;i++) f1*=i; for(i=2;i<=p.b;i++) f2*=i;

        '독립 증분: P = P(N(1)='+p.a+')×P(증분='+p.b+') = '+SVH.fmt(pa)+'×'+SVH.fmt(pb),

    hints:['구간 두 개 = 포아송 두 개의 곱.'] },
  { id:'u3-l2-07', level:2, type:'num', tags:['k번째 도착'], src:'창작 문제(검산됨)',

    solve:function(p){ return { ans:{E:p.k/p.lam, V:p.k/(p.lam*p.lam)}, unit:{E:'시간', V:''}, steps:[
        'S_k = 간격 k개의 합(Erlang) → E = k/λ = '+SVH.fmt(p.k/p.lam)+'시간',
        'Var = k/λ² = '+SVH.fmt(p.k/(p.lam*p.lam))+' — U2 Erlang 모멘트의 재사용' ] }; },
    hints:['지수 k개의 합.'] },
  { id:'u3-l2-08', level:2, type:'num', tags:['조건부 이항'], src:'강의자료 대조',
    params:{ k:{choices:[3,4,5],unit:''}, j:{choices:[1,2],unit:''}, st:{choices:[0.25,0.5],unit:''} },
    constraint:function(p){ return p.j <= p.k; },
    statement:function(p){ return 'N(t)='+p.k+'건이 관측됐다. 앞부분 [0, '+p.st+'t]에 정확히 j='+p.j+'건이 있을 확률은? (조건부는 Binomial(k, s/t))'; },
    solve:function(p){ var C=1,i; for(i=0;i<p.j;i++){ C=C*(p.k-i)/(i+1); }
      var v=C*Math.pow(p.st,p.j)*Math.pow(1-p.st,p.k-p.j);
      return { ans:v, unit:'', steps:[
        '조건부 균등성: k건 각각이 독립적으로 확률 s/t='+p.st+'로 앞 구간에 떨어진다',
        'P = C('+p.k+','+p.j+')(s/t)^j(1−s/t)^{k−j} = '+SVH.fmt(v)+' — 포아송이 이항으로 바뀌는 마법' ] }; },
    hints:['각 도착이 동전던지기가 된다.'] },
  { id:'u3-l2-09', level:2, type:'num', tags:['간격 꼬리'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[3,6],unit:'/시간'}, x:{choices:[0.5,1],unit:'시간'} },
    statement:function(p){ return 'λ='+p.lam+'/시간 도착에서 한 간격이 x='+p.x+'시간을 넘길 확률 P(T>x)는?'; },
    solve:function(p){ var v=Math.exp(-p.lam*p.x);
      return { ans:v, unit:'', steps:[
        'T ~ Exp(λ) → P(T>x) = e^{−'+SVH.fmt(p.lam*p.x)+'}',
        '= '+SVH.fmt(v)+' — 계수 관점(N=0)과 같은 답: 관점 전환 연습' ] }; },
    hints:['간격=지수.'] },
  { id:'u3-l2-10', level:2, type:'num', tags:['율 추정'], src:'창작 문제(검산됨)',
    params:{ n:{choices:[36,60,120],unit:'건'}, T:{choices:[12,24],unit:'시간'}, u:{choices:[2,3],unit:'시간'} },
    statement:function(p){ return 'T='+p.T+'시간 동안 '+p.n+'건이 관측됐다. 율 추정치 λ̂=n/T와, 향후 u='+p.u+'시간의 기대 건수를 구하라.'; },
    solve:function(p){ var lam=p.n/p.T;
      return { ans:{lam:lam, E:lam*p.u}, unit:{lam:'/시간', E:'건'}, steps:[
        'λ̂ = n/T = '+SVH.fmt(lam)+'/시간',
        'E[N(u)] = λ̂u = '+SVH.fmt(lam*p.u)+'건 — 실무에서 λ는 이렇게 잰다' ] }; },
    hints:['율=건수/시간.'] },
  { id:'u3-l2-11', level:2, type:'num', tags:['상대 요동'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[4,100],unit:'/시간'}, t:{choices:[1,25],unit:'시간'} },
    statement:function(p){ return 'λ='+p.lam+'/시간, t='+p.t+'시간의 변동계수 CV=SD/E=1/√(λt)는?'; },
    solve:function(p){ var v=1/Math.sqrt(p.lam*p.t);
      return { ans:v, unit:'', steps:[
        'CV = √(λt)/(λt) = 1/√(λt) = 1/√'+SVH.fmt(p.lam*p.t),
        '= '+SVH.fmt(v)+' — 표본이 커질수록 √ 법칙으로 안정(U1 1/√N과 같은 뿌리)' ] }; },
    hints:['1/√μ.'] },
  { id:'u3-l2-12', level:2, type:'num', tags:['인접비'], src:'창작 문제(검산됨)',
    params:{ mu:{choices:[2,4,8],unit:''}, k:{choices:[1,3,5],unit:''} },
    statement:function(p){ return 'μ='+p.mu+' 포아송에서 인접 확률비 P(N=k+1)/P(N=k)=μ/(k+1)을 k='+p.k+'에서 구하라.'; },
    solve:function(p){ var v=p.mu/(p.k+1);
      return { ans:v, unit:'', steps:[
        'P(k+1)/P(k) = μ/(k+1) = '+p.mu+'/'+(p.k+1)+' = '+SVH.fmt(v),

    hints:['pmf 비에서 e^{−μ}가 소거.'] },

  /* ---------- L3 (14) ---------- */
  { id:'u3-l3-01', level:3, type:'num', tags:['조건부 균등'], src:'강의자료 대조',
    params:{ t:{choices:[10,20],unit:'분'}, s:{choices:[2,5],unit:'분'} },
    constraint:function(p){ return p.s < p.t; },
    statement:function(p){ return '[0,'+p.t+'분]에 도착이 정확히 1건 있었다. 그 도착이 처음 '+p.s+'분 안에 있었을 확률은?'; },
    solve:function(p){ var v=p.s/p.t;
      return { ans:v, unit:'', steps:[
        '조건부 균등성: N(t)=1이면 도착 시각 ~ U(0,t)',
        'P = s/t = '+p.s+'/'+p.t+' = '+SVH.fmt(v)+' — λ가 답에서 사라진다!' ] }; },
    hints:['균등이라 길이 비.'] },
  { id:'u3-l3-02', level:3, type:'num', tags:['결합 분해'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[2,3],unit:'/시간'}, j:{choices:[1,2],unit:''}, k:{choices:[3,4],unit:''} },
    constraint:function(p){ return p.j <= p.k; },
    statement:function(p){ return 'λ='+p.lam+'/시간. P(N(1)='+p.j+' 그리고 N(2)='+p.k+')를 독립 증분으로 구하라.'; },
    solve:function(p){ var f1=1,f2=1,i,d=p.k-p.j; for(i=2;i<=p.j;i++) f1*=i; for(i=2;i<=d;i++) f2*=i;
      var v=Math.exp(-p.lam)*Math.pow(p.lam,p.j)/f1 * Math.exp(-p.lam)*Math.pow(p.lam,d)/f2;
      return { ans:v, unit:'', steps:[
        'N(2)='+p.k+' ⇔ 증분 N(2)−N(1)='+d+': P = P(N(1)='+p.j+')·P(증분='+d+')',
        '= '+SVH.fmt(v)+' — 결합은 언제나 "겹치지 않는 조각의 곱"으로 재작성' ] }; },
    hints:['N(2)를 증분으로 번역부터.'] },
  { id:'u3-l3-03', level:3, type:'num', tags:['S₂ 분포'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[2,4],unit:'/시간'}, t:{choices:[0.5,1],unit:'시간'} },
    statement:function(p){ return 'λ='+p.lam+'/시간에서 두 번째 도착이 t='+p.t+'시간 안에 일어날 확률 P(S₂≤t)=1−e^{−λt}(1+λt)는?'; },
    solve:function(p){ var m=p.lam*p.t, v=1-Math.exp(-m)*(1+m);
      return { ans:v, unit:'', steps:[
        '{S₂≤t} ⇔ {N(t)≥2}: 다리 항등식',
        '= 1−e^{−μ}(1+μ) = '+SVH.fmt(v)+' — U2 Erlang 꼬리의 재등장(적분 0회)' ] }; },
    hints:['계수로 번역하면 부분합.'] },
  { id:'u3-l3-04', level:3, type:'num', tags:['둘째 간격'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[1,3],unit:'/시간'}, x:{choices:[0.5,1],unit:'시간'} },
    statement:function(p){ return '첫 도착이 이미 있었다. 이후 x='+p.x+'시간 동안 추가 도착이 없을 확률은? (λ='+p.lam+')'; },
    solve:function(p){ var v=Math.exp(-p.lam*p.x);
      return { ans:v, unit:'', steps:[
        '간격 독립+무기억: 다음 간격 ~ Exp(λ) 새로 시작',
        'P(T₂>x) = e^{−'+SVH.fmt(p.lam*p.x)+'} = '+SVH.fmt(v)+' — 과거 도착 이력은 아무 정보가 없다' ] }; },
    hints:['리셋.'] },
  { id:'u3-l3-05', level:3, type:'num', tags:['건수 구간'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[30,50],unit:'/시간'}, t:{choices:[4,8],unit:'시간'} },
    statement:function(p){ return '콜센터 λ='+p.lam+'/시간, 근무 t='+p.t+'시간. 기대 건수 μ와 "μ±1σ" 구간(μ−√μ, μ+√μ)을 구하라.'; },
    solve:function(p){ var m=p.lam*p.t, s=Math.sqrt(m);
      return { ans:{lo:m-s, hi:m+s}, unit:{lo:'건', hi:'건'}, steps:[
        'μ = '+SVH.fmt(m)+', σ = √μ = '+SVH.fmt(s),
        '구간 ('+SVH.fmt(m-s)+', '+SVH.fmt(m+s)+') — 인력 계획의 1차 감각(μ가 크면 정규 근사)' ] }; },
    hints:['σ=√μ.'] },
  { id:'u3-l3-06', level:3, type:'num', tags:['도착시각 합'], src:'창작 문제(검산됨)',
    params:{ k:{choices:[3,4,6],unit:''}, t:{choices:[10,12],unit:'분'} },
    statement:function(p){ return 'N(t)='+p.k+'건(t='+p.t+'분)이 주어졌을 때 도착 시각 합의 기댓값 E[ΣSᵢ|N=k]=kt/2는?'; },
    solve:function(p){ var v=p.k*p.t/2;
      return { ans:v, unit:'분', steps:[
        '조건부 균등: 각 도착 ~ U(0,t), 기대 t/2',
        '합 = k·t/2 = '+SVH.fmt(v)+'분 — 균등성 덕에 순서 무시하고 더한다' ] }; },
    hints:['균등 k개의 합.'] },
  { id:'u3-l3-07', level:3, type:'num', tags:['현재 관점'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[2,5],unit:'/시간'}, u:{choices:[0.5,2],unit:'시간'} },
    statement:function(p){ return '지금 시각 τ에 서서: 다음 도착까지 기대 시간과, 앞으로 u='+p.u+'시간 동안의 기대 도착 수를 구하라. (λ='+p.lam+')'; },
    solve:function(p){ return { ans:{E1:1/p.lam, E2:p.lam*p.u}, unit:{E1:'시간', E2:'건'}, steps:[
        '무기억: E[다음까지] = 1/λ = '+SVH.fmt(1/p.lam)+'시간 (τ가 언제든)',
        'E[N(τ,τ+u)] = λu = '+SVH.fmt(p.lam*p.u)+'건 — 정상성: 미래 창의 길이만 중요' ] }; },
    hints:['둘 다 τ 무관.'] },
  { id:'u3-l3-08', level:3, type:'num', tags:['홀수 도착'], src:'교재 표준',
    params:{ mu:{choices:[0.5,1,2],unit:''} },
    statement:function(p){ return 'μ='+p.mu+' 포아송에서 도착 수가 홀수일 확률 P(홀수)=(1−e^{−2μ})/2는?'; },
    solve:function(p){ var v=(1-Math.exp(-2*p.mu))/2;
      return { ans:v, unit:'', steps:[
        'Σ홀수 항 = (e^{μ}−e^{−μ})e^{−μ}/2 = (1−e^{−2μ})/2',
        '= '+SVH.fmt(v)+' — e^{±μ} 급수의 합·차 트릭: 짝수는 (1+e^{−2μ})/2' ] }; },
    hints:['sinh 급수.'] },
  { id:'u3-l3-09', level:3, type:'num', tags:['공분산'], src:'교재 표준',
    params:{ lam:{choices:[2,3],unit:'/시간'}, s:{choices:[1,2],unit:'시간'}, t:{choices:[3,5],unit:'시간'} },
    statement:function(p){ return 'λ='+p.lam+'일 때 Cov(N(s), N(t)) = λ·min(s,t)를 s='+p.s+', t='+p.t+'에서 구하라.'; },
    solve:function(p){ var v=p.lam*Math.min(p.s,p.t);
      return { ans:v, unit:'', steps:[
        'N(t)=N(s)+증분(독립) → Cov = Var(N(s)) = λs',
        '= '+SVH.fmt(v)+' — 겹치는 구간 [0,s]만 상관을 만든다' ] }; },
    hints:['공통 부분의 분산.'] },
  { id:'u3-l3-10', level:3, type:'num', tags:['간격 전부'], src:'창작 문제(검산됨)',
    params:{ k:{choices:[2,3],unit:''}, lam:{choices:[2,4],unit:'/시간'}, x:{choices:[0.3,0.5],unit:'시간'} },
    statement:function(p){ return '처음 k='+p.k+'개 간격이 모두 x='+p.x+'시간을 넘길 확률 P=e^{−kλx}는? (λ='+p.lam+')'; },
    solve:function(p){ var v=Math.exp(-p.k*p.lam*p.x);
      return { ans:v, unit:'', steps:[
        '간격은 iid Exp(λ): P = (e^{−λx})^k = e^{−'+SVH.fmt(p.k*p.lam*p.x)+'}',
        '= '+SVH.fmt(v)+' — "여유 있는 스케줄"의 확률은 지수적으로 희귀하다' ] }; },
    hints:['독립의 곱.'] },
  { id:'u3-l3-11', level:3, type:'num', tags:['단위 환산'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[0.5,1.5],unit:'/분'}, T:{choices:[2,5],unit:'분'} },
    statement:function(p){ return '요청이 분당 λ='+p.lam+'건 포아송 도착. T='+p.T+'분 무요청일 확률과 시간당 율(λ×60)을 구하라.'; },
    solve:function(p){ return { ans:{P:Math.exp(-p.lam*p.T), lamH:p.lam*60}, unit:{P:'', lamH:'/시간'}, steps:[
        'P(N=0) = e^{−'+SVH.fmt(p.lam*p.T)+'} = '+SVH.fmt(Math.exp(-p.lam*p.T)),
        'λ = '+SVH.fmt(p.lam*60)+'/시간 — λt는 단위가 맞아야 무차원: 단위 실수가 최다 오답원' ] }; },
    hints:['λ와 t의 단위 통일.'] },
  { id:'u3-l3-12', level:3, type:'num', tags:['조건부 기대'], src:'창작 문제(검산됨)',
    params:{ k:{choices:[6,9,12],unit:''}, st:{choices:[0.25,0.5],unit:''} },
    statement:function(p){ return 'N(t)='+p.k+'일 때 앞 구간 [0, '+p.st+'t]의 조건부 기대 건수 E[N(s)|N(t)=k]=k·(s/t)는?'; },
    solve:function(p){ var v=p.k*p.st;
      return { ans:v, unit:'건', steps:[
        '조건부 이항 Binomial(k, s/t)의 평균 = k(s/t)',
        '= '+p.k+'×'+p.st+' = '+SVH.fmt(v)+' — 총량이 정해지면 비율대로 나눠 갖는다' ] }; },
    hints:['이항 평균 np.'] },
  { id:'u3-l3-13', level:3, type:'num', tags:['합 과정'], src:'창작 문제(검산됨)',
    params:{ m1:{choices:[1,2],unit:''}, m2:{choices:[1.5,3],unit:''}, k:{choices:[2,3,4],unit:''} },
    statement:function(p){ return '독립 관측창 두 개에서 기대 건수 μ₁='+p.m1+', μ₂='+p.m2+'. 총 건수가 k='+p.k+'일 확률은? (합은 Poisson(μ₁+μ₂))'; },
    solve:function(p){ var m=p.m1+p.m2, f=1,i; for(i=2;i<=p.k;i++) f*=i;
      var v=Math.exp(-m)*Math.pow(m,p.k)/f;
      return { ans:v, unit:'', steps:[
        '포아송 합 = Poisson(μ₁+μ₂='+SVH.fmt(m)+') — 재생산성',
        'P = '+SVH.fmt(v)+' — U4 중첩 정리의 분포 버전' ] }; },
    hints:['μ를 더한 뒤 한 번에.'] },
  { id:'u3-l3-14', level:3, type:'num', tags:['다리 항등식'], src:'강의자료 대조',
    params:{ k:{choices:[2,3],unit:''}, mu:{choices:[1.5,2.5],unit:''} },
    statement:function(p){ return 'μ=λt='+p.mu+'에서 P(S_'+p.k+'>t)=P(N(t)≤'+(p.k-1)+')=Σ_{j<k}e^{−μ}μ^j/j!을 구하라. (Erlang 꼬리=포아송 cdf)'; },
    solve:function(p){ var s=0,f=1,j; for(j=0;j<p.k;j++){ if(j>0) f*=j; s+=Math.pow(p.mu,j)/f; }
      var v=Math.exp(-p.mu)*s;
      return { ans:v, unit:'', steps:[
        '{S_k>t} ⇔ {N(t)<k}: k번째가 아직 안 왔다 = 건수가 k 미만',
        '= e^{−μ}Σ_{j=0}^{'+(p.k-1)+'}μ^j/j! = '+SVH.fmt(v)+' — 이 다리 하나로 Erlang 적분이 전부 급수가 된다' ] }; },
    hints:['사건 번역이 계산을 대체.'] },

  /* ---------- L4 (8) ---------- */
  { id:'u3-l4-01', level:4, type:'derive', tags:['pmf 유도'], src:'교재 표준',
    statement:'미소구간 공리(P(1건)=λh+o(h), P(≥2건)=o(h), 독립 증분)에서 \\(P_k(t)=e^{-\\lambda t}(\\lambda t)^k/k!\\)를 유도하라.',
    steps:[
      'P₀(t+h) = P₀(t)(1−λh)+o(h) [왜] t까지 0건 그리고 (t,t+h]에도 0건 — 독립 증분으로 곱',
      '(P₀(t+h)−P₀(t))/h → P₀\'=−λP₀, P₀(0)=1 ⇒ P₀(t)=e^{−λt}',
      '일반항: P_k\' = −λP_k+λP_{k−1} (k건 유지 vs k−1건에서 한 건 도착)',
      '귀납으로 풀면 P_k(t)=e^{−λt}(λt)^k/k! — 예: P₁=λte^{−λt} 확인',
      '극한 체크: Σ_kP_k=e^{−λt}e^{λt}=1 ✓ · t→0 ⇒ P₀→1 ✓ · E=Σk·P_k=λt ✓'
    ],
    hints:['미분방정식 사다리.','P₀부터 위로 올라간다.'],
    expl:'"율 λ의 순수 우연"이라는 물리적 가정 3줄이 pmf를 강제한다 — 포아송이 어디서나 나타나는 이유.' },
  { id:'u3-l4-02', level:4, type:'num', tags:['조건부 종합'], src:'기출 유형',
    params:{ k:{choices:[8,10],unit:''}, st:{choices:[0.25,0.4],unit:''} },
    statement:function(p){ return '하루(t) 동안 k='+p.k+'건 접수됐다. 오전 비중 s/t='+p.st+'일 때 오전 건수의 조건부 평균과 분산을 구하라.'; },
    solve:function(p){ var m=p.k*p.st, v=p.k*p.st*(1-p.st);
      return { ans:{E:m, V:v}, unit:{E:'건', V:''}, steps:[
        '조건부 Binomial(k='+p.k+', p='+p.st+'): E = kp = '+SVH.fmt(m),
        'Var = kp(1−p) = '+SVH.fmt(v)+' — 총량 고정 조건이 분산을 포아송(=평균)보다 줄인다' ] }; },
    hints:['이항 평균·분산.'] },
  { id:'u3-l4-03', level:4, type:'derive', tags:['Erlang 유도'], src:'강의자료 대조',
    statement:'다리 항등식 {N(t)≥k}⇔{S_k≤t}로 S_k의 밀도 \\(f_{S_k}(t)=\\lambda e^{-\\lambda t}\\dfrac{(\\lambda t)^{k-1}}{(k-1)!}\\) (Erlang)을 유도하라.',
    steps:[
      'P(S_k≤t) = P(N(t)≥k) = 1−Σ_{j=0}^{k−1}e^{−λt}(λt)^j/j! [왜] 사건 번역이 cdf를 공짜로 준다',
      '미분: 합의 항별 미분에서 인접 항이 연쇄 상쇄(telescoping)',
      '남는 항 = λe^{−λt}(λt)^{k−1}/(k−1)! — Erlang(k,λ) 밀도',
      '해석: "마지막 순간 t에 k번째 도착(λ), 그 전까지 k−1건(포아송)" — 밀도의 확률적 독해',
      '극한 체크: k=1 ⇒ λe^{−λt}(지수) ✓ · E=k/λ, k↑ ⇒ CLT로 정규 접근 ✓'
    ],
    hints:['cdf를 번역으로 얻고 미분만.','상쇄가 일어나는 걸 직접 확인.'],
    expl:'U5 재생과정에서 일반 분포 간격으로 확장할 때 이 다리({N≥k}⇔{S_k≤t})만은 그대로 살아남는다 — 구조의 핵심.' },
  { id:'u3-l4-04', level:4, type:'num', tags:['모멘트 트릭'], src:'교재 표준',
    params:{ mu:{choices:[0.5,1,2],unit:''} },
    statement:function(p){ return 'μ='+p.mu+' 포아송 N에 대해 E[(−1)^N]=e^{−2μ}를 구하라. (짝수−홀수 확률차)'; },
    solve:function(p){ var v=Math.exp(-2*p.mu);
      return { ans:v, unit:'', steps:[
        'E[z^N]=e^{μ(z−1)} (확률생성함수)에 z=−1 대입: e^{−2μ}',
        '= '+SVH.fmt(v)+' — P(짝수)−P(홀수)=e^{−2μ}: u3-l3-08과 한 몸' ] }; },
    hints:['생성함수 한 방.'] },
  { id:'u3-l4-05', level:4, type:'num', tags:['SLA 설계'], src:'기출 유형',
    params:{ T:{choices:[1,2],unit:'년'}, r:{choices:[0.95,0.99],unit:''} },
    statement:function(p){ return '서버 장애가 포아송 도착. T='+p.T+'년 무장애 확률을 '+p.r+' 이상으로 만들려면 장애율 λ 상한 −ln(r)/T (/년)은?'; },
    solve:function(p){ var v=-Math.log(p.r)/p.T;
      return { ans:v, unit:'/년', steps:[
        'P(N(T)=0)=e^{−λT} ≥ r → λ ≤ −ln(r)/T',
        '= '+SVH.fmt(v)+'/년 — 가용성 목표가 허용 장애율로 번역된다(U2 신뢰도 문제의 계수 버전)' ] }; },
    hints:['0건 확률로 세팅.'] },
  { id:'u3-l4-06', level:4, type:'num', tags:['결합 조건'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[2,3],unit:'/시간'}, a:{choices:[1,2],unit:'시간'}, b:{choices:[1,2],unit:'시간'}, j:{choices:[1,2],unit:''}, k:{choices:[3,4],unit:''} },
    constraint:function(p){ return p.j <= p.k; },
    statement:function(p){ return 'λ='+p.lam+'/시간. 창1(길이 '+p.a+')에 '+p.j+'건, 이어지는 창2(길이 '+p.b+')까지 누적 '+p.k+'건일 확률 P(N(a)='+p.j+', N(a+b)='+p.k+')는?'; },
    solve:function(p){ var d=p.k-p.j, m1=p.lam*p.a, m2=p.lam*p.b, f1=1,f2=1,i;
      for(i=2;i<=p.j;i++) f1*=i; for(i=2;i<=d;i++) f2*=i;
      var v=Math.exp(-m1)*Math.pow(m1,p.j)/f1*Math.exp(-m2)*Math.pow(m2,d)/f2;
      return { ans:v, unit:'', steps:[
        '증분 번역: 창2 단독 '+d+'건. 독립 곱:',
        'P = Pois(μ₁='+SVH.fmt(m1)+')['+p.j+'] × Pois(μ₂='+SVH.fmt(m2)+')['+d+'] = '+SVH.fmt(v) ] }; },
    hints:['누적을 증분으로 쪼개기.'] },
  { id:'u3-l4-07', level:4, type:'num', tags:['샷 노이즈'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[1e4,1e6],unit:'/s'}, t:{choices:[0.001,0.01],unit:'s'} },
    statement:function(p){ return '광검출기에 광자가 λ='+SVH.fmt(p.lam)+'/s 포아송 도착. 적분시간 t='+p.t+'s의 기대 광자 수 μ와 SNR=μ/σ=√μ를 구하라.'; },
    solve:function(p){ var m=p.lam*p.t;
      return { ans:{mu:m, SNR:Math.sqrt(m)}, unit:{mu:'개', SNR:''}, steps:[
        'μ = λt = '+SVH.fmt(m),
        'SNR = μ/√μ = √μ = '+SVH.fmt(Math.sqrt(m))+' — 샷 노이즈: 신호를 2배 모으면 SNR은 √2배 (계측의 근본 한계)' ] }; },
    hints:['포아송 잡음 σ=√μ.'] },
  { id:'u3-l4-08', level:4, type:'derive', tags:['조건부 균등성'], src:'교재 표준',
    statement:'N(t)=1일 때 도착 시각이 U(0,t)임을 유도하고, 일반 k건의 "순서통계량" 서술로 확장하라.',
    steps:[
      'P(S₁≤s | N(t)=1) = P(N(s)=1, N(t)−N(s)=0)/P(N(t)=1) [왜] 결합을 증분 곱으로',
      '= [λse^{−λs}·e^{−λ(t−s)}] / [λte^{−λt}] = s/t — λ가 완전 소거',
      'cdf가 s/t ⇒ U(0,t): 도착은 구간 어디든 평등하게',

  { id:'u4-l2-09', level:2, type:'num', tags:['복합 분산'], src:'창작 문제(검산됨)',

  /* ---------- L3 (14) ---------- */
  { id:'u4-l3-01', level:3, type:'num', tags:['긴급 무발생'], src:'기출 유형',

  { id:'u4-l3-02', level:3, type:'num', tags:['출처 이항'], src:'강의자료 대조',

    hints:['중첩 총량 주어지면 이항.'] },
  { id:'u4-l3-03', level:3, type:'num', tags:['비균질 구간'], src:'창작 문제(검산됨)',
    params:{ c:{choices:[2,3],unit:''}, t1:{choices:[1,2],unit:'시간'}, t2:{choices:[3,4],unit:'시간'} },
    constraint:function(p){ return p.t1 < p.t2; },
    statement:function(p){ return 'λ(s)='+p.c+'s (선형 증가). 구간 ['+p.t1+', '+p.t2+']의 기대 건수 m=c(t₂²−t₁²)/2는?'; },
    solve:function(p){ var v=p.c*(p.t2*p.t2-p.t1*p.t1)/2;
      return { ans:v, unit:'건', steps:[
        'm = ∫cs ds = c(t₂²−t₁²)/2 = '+p.c+'×('+(p.t2*p.t2)+'−'+(p.t1*p.t1)+')/2',
        '= '+SVH.fmt(v)+'건 — 늦은 구간일수록 무겁다(정상성 상실)' ] }; },
    hints:['적분 구간만 조심.'] },
  { id:'u4-l3-04', level:3, type:'num', tags:['보험 총액'], src:'기출 유형',
    params:{ lam:{choices:[2,5],unit:'/월'}, t:{choices:[12,24],unit:'월'}, EY:{choices:[100,300],unit:'만원'}, sY:{choices:[50,100],unit:'만원'} },
    statement:function(p){ return '청구가 λ='+p.lam+'/월, 건당 평균 '+p.EY+'·표준편차 '+p.sY+'만원. t='+p.t+'개월 총청구액의 평균과 표준편차를 구하라.'; },
    solve:function(p){ var m=p.lam*p.t, EY2=p.sY*p.sY+p.EY*p.EY, V=m*EY2;
      return { ans:{E:m*p.EY, SD:Math.sqrt(V)}, unit:{E:'만원', SD:'만원'}, steps:[
        'E = λtE[Y] = '+SVH.fmt(m*p.EY)+'만원',
        'Var = λtE[Y²] = '+SVH.fmt(m)+'×'+SVH.fmt(EY2)+' → SD = '+SVH.fmt(Math.sqrt(V))+'만원 — 준비금 산정의 뼈대' ] }; },
    hints:['E[Y²]=σ²+μ².'] },
  { id:'u4-l3-05', level:3, type:'num', tags:['두 기간 결합'], src:'창작 문제(검산됨)',
    params:{ l1:{choices:[2,4],unit:'/시간'}, T1:{choices:[2,3],unit:'시간'}, l2:{choices:[6,8],unit:'/시간'}, T2:{choices:[1,2],unit:'시간'}, k:{choices:[8,12],unit:''} },
    statement:function(p){ return '한산 시간대(λ='+p.l1+', '+p.T1+'시간)+피크(λ='+p.l2+', '+p.T2+'시간)의 총 도착이 k='+p.k+'건일 확률은? (합은 Poisson(λ₁T₁+λ₂T₂))'; },
    solve:function(p){ var m=p.l1*p.T1+p.l2*p.T2, f=1,i; for(i=2;i<=p.k;i++) f*=i;
      var v=Math.exp(-m)*Math.pow(m,p.k)/f;
      return { ans:v, unit:'', steps:[
        'm = '+p.l1+'×'+p.T1+'+'+p.l2+'×'+p.T2+' = '+SVH.fmt(m)+' (구간별 기대의 합)',
        'P = '+SVH.fmt(v)+' — 조각별 균질 = 비균질의 실무형' ] }; },
    hints:['독립 구간 합은 μ 합.'] },
  { id:'u4-l3-06', level:3, type:'num', tags:['검출률 설계'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[8,16],unit:'/시간'}, t:{choices:[1,2],unit:'시간'}, r:{choices:[0.9,0.95],unit:''} },
    statement:function(p){ return '결함이 λ='+p.lam+'/시간 발생. t='+p.t+'시간 동안 미검출 결함이 0건일 확률을 '+p.r+' 이상으로 하려면 검출률 p의 하한 1+ln(r)/(λt)는?'; },
    solve:function(p){ var v=1+Math.log(p.r)/(p.lam*p.t);
      return { ans:v, unit:'', steps:[
        '미검출 흐름 = (1−p)λ → e^{−(1−p)λt} ≥ r → (1−p) ≤ −ln(r)/(λt)',
        'p ≥ 1+ln(r)/(λt) = '+SVH.fmt(v)+' — 품질 목표가 검출률 사양으로 번역' ] }; },
    hints:['(1−p)λ 흐름에 0건 조건.'] },
  { id:'u4-l3-07', level:3, type:'num', tags:['이중 분해'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[20,40],unit:'/시간'}, p1:{choices:[0.5,0.6],unit:''}, p2:{choices:[0.2,0.3],unit:''}, t:{choices:[1,2],unit:'시간'} },
    statement:function(p){ return '방문 λ='+p.lam+'/시간 → 가입률 '+p.p1+' → 유료전환율 '+p.p2+'. 유료 고객 흐름의 율과 t='+p.t+'시간 기대 수를 구하라.'; },
    solve:function(p){ var l=p.lam*p.p1*p.p2;
      return { ans:{lam:l, E:l*p.t}, unit:{lam:'/시간', E:'명'}, steps:[
        '두 번 걸러도 포아송: λp₁p₂ = '+SVH.fmt(l)+'/시간',
        'E = '+SVH.fmt(l*p.t)+'명 — 퍼널의 각 단이 thinning' ] }; },
    hints:['p들을 연달아 곱.'] },
  { id:'u4-l3-08', level:3, type:'num', tags:['표시 성공'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[3,6],unit:'/일'}, t:{choices:[5,10],unit:'일'}, q:{choices:[0.3,0.5],unit:''}, j:{choices:[2,4],unit:''} },
    statement:function(p){ return '시도가 λ='+p.lam+'/일 포아송, 각 시도 성공률 q='+p.q+'. t='+p.t+'일간 성공이 정확히 j='+p.j+'건일 확률은?'; },
    solve:function(p){ var m=p.lam*p.t*p.q, f=1,i; for(i=2;i<=p.j;i++) f*=i;
      var v=Math.exp(-m)*Math.pow(m,p.j)/f;
      return { ans:v, unit:'', steps:[
        '성공 흐름 ~ Poisson(λtq='+SVH.fmt(m)+') — 포아송 건수+베르누이 표시=포아송(thinning)',
        'P = '+SVH.fmt(v) ] }; },
    hints:['이항 조건화 대신 thinning 한 방.'] },
  { id:'u4-l3-09', level:3, type:'num', tags:['차이 과정'], src:'창작 문제(검산됨)',
    params:{ l1:{choices:[5,8],unit:'/시간'}, l2:{choices:[3,6],unit:'/시간'}, t:{choices:[2,4],unit:'시간'} },
    statement:function(p){ return '유입(λ₁='+p.l1+')·유출(λ₂='+p.l2+') 독립 포아송. t='+p.t+'시간 순증 D=N₁−N₂의 평균과 분산을 구하라.'; },
    solve:function(p){ return { ans:{E:(p.l1-p.l2)*p.t, V:(p.l1+p.l2)*p.t}, unit:{E:'건', V:''}, steps:[
        'E[D] = (λ₁−λ₂)t = '+SVH.fmt((p.l1-p.l2)*p.t),
        'Var(D) = (λ₁+λ₂)t = '+SVH.fmt((p.l1+p.l2)*p.t)+' — 차이의 분산은 더해진다(독립)' ] }; },
    hints:['분산엔 뺄셈이 없다.'] },
  { id:'u4-l3-10', level:3, type:'num', tags:['조건부 타입 기대'], src:'창작 문제(검산됨)',
    params:{ l1:{choices:[3,5],unit:''}, l2:{choices:[5,7],unit:''}, n:{choices:[10,20],unit:''} },
    statement:function(p){ return '중첩(λ₁='+p.l1+', λ₂='+p.l2+') 흐름에서 오늘 총 n='+p.n+'건이 왔다. 타입1 건수의 조건부 기대는?'; },
    solve:function(p){ var v=p.n*p.l1/(p.l1+p.l2);
      return { ans:v, unit:'건', steps:[
        '조건부 Binomial(n, λ₁/Σ) → E = nλ₁/Σ',
        '= '+p.n+'×'+SVH.fmt(p.l1/(p.l1+p.l2))+' = '+SVH.fmt(v)+'건' ] }; },
    hints:['이항 평균.'] },
  { id:'u4-l3-11', level:3, type:'num', tags:['워밍업 율'], src:'창작 문제(검산됨)',
    params:{ lm:{choices:[10,20],unit:'/시간'}, tau:{choices:[1,2],unit:'시간'}, t:{choices:[2,4],unit:'시간'} },
    statement:function(p){ return '오픈 직후 율이 λ(s)=λ_max(1−e^{−s/τ})로 상승(λ_max='+p.lm+', τ='+p.tau+'). m(t)=λ_max[t−τ(1−e^{−t/τ})]를 t='+p.t+'에서 구하라.'; },
    solve:function(p){ var v=p.lm*(p.t-p.tau*(1-Math.exp(-p.t/p.tau)));
      return { ans:v, unit:'건', steps:[
        'm(t) = λ_max∫(1−e^{−s/τ})ds = λ_max[t−τ(1−e^{−t/τ})]',
        '= '+SVH.fmt(v)+'건 — 정상 상태(λ_max t='+SVH.fmt(p.lm*p.t)+')보다 워밍업 손실만큼 작다' ] }; },
    hints:['지수항 적분은 −τe^{−s/τ}.'] },
  { id:'u4-l3-12', level:3, type:'num', tags:['복합-지수'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[4,8],unit:'/일'}, t:{choices:[10,30],unit:'일'}, mY:{choices:[5,10],unit:'만원'} },
    statement:function(p){ return '건수 λ='+p.lam+'/일, 건당 손해액 Y~Exp(평균 '+p.mY+'만원). t='+p.t+'일 총손해의 평균과 분산 Var=λt·2m²을 구하라.'; },
    solve:function(p){ var m=p.lam*p.t;
      return { ans:{E:m*p.mY, V:m*2*p.mY*p.mY}, unit:{E:'만원', V:''}, steps:[
        'E = λt·m = '+SVH.fmt(m*p.mY)+'만원',
        '지수는 E[Y²]=2m² → Var = '+SVH.fmt(m*2*p.mY*p.mY)+' — 분포 지식(2m²)이 그대로 답이 되는 유형' ] }; },
    hints:['지수의 2차 모멘트=2m².'] },
  { id:'u4-l3-13', level:3, type:'num', tags:['3분할'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[10,20],unit:'/시간'}, p1:{choices:[0.2,0.3],unit:''}, p2:{choices:[0.3,0.5],unit:''}, t:{choices:[1,2],unit:'시간'} },
    constraint:function(p){ return p.p1+p.p2 < 0.95; },
    statement:function(p){ return '도착 λ='+p.lam+'/시간이 소·중·대(비율 '+p.p1+', '+p.p2+', '+SVH.fmt(1-p.p1-p.p2)+')로 갈라진다. t='+p.t+'시간의 각 기대 건수를 구하라. (대형은 E3)'; },
    solve:function(p){ var b=p.lam*p.t;
      return { ans:{E1:b*p.p1, E2:b*p.p2, E3:b*(1-p.p1-p.p2)}, unit:{E1:'건', E2:'건', E3:'건'}, steps:[
        '3-way thinning: 각각 독립 Poisson(λpᵢt)',
        '= '+SVH.fmt(b*p.p1)+' · '+SVH.fmt(b*p.p2)+' · '+SVH.fmt(b*(1-p.p1-p.p2))+'건 — 다항 분해도 같은 정리' ] }; },
    hints:['비율×λt 셋.'] },
  { id:'u4-l3-14', level:3, type:'num', tags:['두 노선 대기'], src:'기출 유형',
    params:{ l1:{choices:[4,6],unit:'/시간'}, l2:{choices:[2,3],unit:'/시간'} },
    statement:function(p){ return '집에 가는 버스 두 노선(λ₁='+p.l1+', λ₂='+p.l2+'/시간, 독립). 아무거나 타면 되는 승객의 기대 대기시간과, 온 것이 1번 노선일 확률을 구하라.'; },
    solve:function(p){ var s=p.l1+p.l2;
      return { ans:{E:1/s, p1:p.l1/s}, unit:{E:'시간', p1:''}, steps:[
        '중첩 흐름 Exp(Σλ) 간격 → E[대기] = 1/'+s+' = '+SVH.fmt(1/s)+'시간',
        'P(1번) = '+SVH.fmt(p.l1/s)+' — 중첩(언제)+경쟁(무엇)의 종합 세트' ] }; },
    hints:['합 rate와 rate 비.'] },

  /* ---------- L4 (8) ---------- */
  { id:'u4-l4-01', level:4, type:'derive', tags:['thinning 유도'], src:'강의자료 대조',
    statement:'포아송(λ)을 확률 p로 표시(thinning)한 흐름이 Poisson(pλ)이고 나머지와 독립임을 유도하라.',
    steps:[
      '결합 계산: P(N₁(t)=j, N₂(t)=k) = P(총 j+k건)·P(그중 j건이 표시) [왜] 총량 조건화+독립 표시',
      '= e^{−λt}(λt)^{j+k}/(j+k)! × C(j+k,j)p^j(1−p)^k',
      '정리(팩토리얼 소거): = [e^{−pλt}(pλt)^j/j!]·[e^{−(1−p)λt}((1−p)λt)^k/k!]',
      '곱으로 완전 분리 → 각각 Poisson(pλt), Poisson((1−p)λt)이며 서로 독립 — 반직관의 정체는 "총량도 랜덤"이라는 사실',
      '극한 체크: p=1 ⇒ 원 과정 복원 ✓ · 주변합: Σ_k로 더하면 N₁~Poisson(pλt) 단독 확인 ✓'
    ],
    hints:['조건화→이항→지수 재조립.','e^{−λt}=e^{−pλt}e^{−(1−p)λt} 분해가 열쇠.'],
    expl:'강의 개요의 "포아송과정의 중첩 및 분해" 후반부 — 결합이 곱으로 갈라지는 계산을 직접 봐야 독립성이 믿어진다.' },
  { id:'u4-l4-02', level:4, type:'num', tags:['비균질 종합'], src:'기출 유형',
    params:{ a:{choices:[2,3],unit:''}, b:{choices:[1,2],unit:''}, T:{choices:[2,4],unit:'시간'} },
    statement:function(p){ return 'λ(s)='+p.a+'+'+p.b+'s, 운영 T='+p.T+'시간: ① m(T) ② 무도착 확률 ③ 같은 총량의 등가 균질율 λ̄=m/T를 구하라.'; },
    solve:function(p){ var m=p.a*p.T+p.b*p.T*p.T/2;
      return { ans:{m:m, p0:Math.exp(-m), lbar:m/p.T}, unit:{m:'건', p0:'', lbar:'/시간'}, steps:[
        'm = aT+bT²/2 = '+SVH.fmt(m)+' → P(N=0) = e^{−m} = '+SVH.fmt(Math.exp(-m)),
        'λ̄ = m/T = '+SVH.fmt(m/p.T)+'/시간 — 건수 통계만 필요하면 평균율로 대체 가능(도착 위치 분포는 다름!)' ] }; },
    hints:['셋 다 m(T) 하나에서.'] },
  { id:'u4-l4-03', level:4, type:'derive', tags:['복합 모멘트'], src:'교재 표준',
    statement:'복합 포아송 \\(S=\\sum_{i=1}^{N}Y_i\\)의 E[S]=λtE[Y], Var(S)=λtE[Y²]을 조건화로 유도하라.',
    steps:[
      '조건부: E[S|N=n]=nE[Y], Var(S|N=n)=nVar(Y) [왜] 고정 n이면 iid 합',
      '타워: E[S]=E[N]E[Y]=λtE[Y]',
      '전분산(U1): Var(S)=E[Var(S|N)]+Var(E[S|N]) = E[N]Var(Y)+Var(N)E[Y]²',
      '포아송은 E[N]=Var(N)=λt → Var(S)=λt(Var(Y)+E[Y]²)=λtE[Y]² 아님 주의 → =λtE[Y²]',
      '극한 체크: Y≡1(상수) ⇒ S=N, Var=λt ✓ · 차원: [λt][Y²]=[S²] ✓'
    ],
    hints:['전분산 공식이 몸통.','마지막 줄에서 Var+E²=E[Y²]로 합쳐진다.'],
    expl:'U1 l4-07 전분산 공식의 대표 응용 — "건수 요동과 크기 요동이 모두 분산에 들어간다"가 결론.' },
  { id:'u4-l4-04', level:4, type:'num', tags:['신호+암계수'], src:'창작 문제(검산됨)',
    params:{ ls:{choices:[100,400],unit:'/s'}, ld:{choices:[25,100],unit:'/s'}, t:{choices:[1,4],unit:'s'} },
    statement:function(p){ return '검출기: 신호 λ_s='+p.ls+'/s + 암계수 λ_d='+p.ld+'/s (독립 중첩). 적분 t='+p.t+'s에서 SNR=λ_st/√((λ_s+λ_d)t)를 구하라.'; },
    solve:function(p){ var v=p.ls*p.t/Math.sqrt((p.ls+p.ld)*p.t);
      return { ans:v, unit:'', steps:[
        '신호 = λ_st, 잡음 = 총 계수의 SD = √((λ_s+λ_d)t) (중첩!)',
        'SNR = '+SVH.fmt(v)+' — 암계수가 분모에 얹히는 구조: 중첩 정리의 계측 응용' ] }; },
    hints:['잡음은 총 흐름에서 나온다.'] },
  { id:'u4-l4-05', level:4, type:'num', tags:['구간별 결합'], src:'창작 문제(검산됨)',
    params:{ l1:{choices:[2,3],unit:'/시간'}, l2:{choices:[5,8],unit:'/시간'}, T1:{choices:[2,3],unit:'시간'}, T2:{choices:[1,2],unit:'시간'}, k:{choices:[0,1],unit:''} },
    statement:function(p){ return '한산(λ='+p.l1+', '+p.T1+'h)→피크(λ='+p.l2+', '+p.T2+'h). 한산에 k='+p.k+'건이고 피크에 무도착일 확률은?'; },
    solve:function(p){ var m1=p.l1*p.T1, f=1,i; for(i=2;i<=p.k;i++) f*=i;
      var v=Math.exp(-m1)*Math.pow(m1,p.k)/f*Math.exp(-p.l2*p.T2);
      return { ans:v, unit:'', steps:[
        '독립 증분: Pois('+SVH.fmt(m1)+')['+p.k+'] × e^{−'+SVH.fmt(p.l2*p.T2)+'}',
        '= '+SVH.fmt(v)+' — 조각별 균질 모델의 결합 계산' ] }; },
    hints:['구간 곱.'] },
  { id:'u4-l4-06', level:4, type:'num', tags:['3자 경쟁 종합'], src:'창작 문제(검산됨)',
    params:{ l1:{choices:[1,2],unit:'/분'}, l2:{choices:[2,3],unit:'/분'}, l3:{choices:[1,4],unit:'/분'} },

    statement:function(p){ return '평균 '+p.m+'분 간격 버스: ① 지수 간격 ② 정확히 '+p.m+'분 결정적 간격. 각각 임의 도착 승객의 평균 대기를 구하라.'; },
    solve:function(p){ return { ans:{We:p.m, Wd:p.m/2}, unit:{We:'분', Wd:'분'}, steps:[
        '지수: E[X²]/(2E[X]) = m = '+p.m+'분 (검사역설 최대급)',
        '결정적: m/2 = '+SVH.fmt(p.m/2)+'분 (역설 없음) — 같은 "평균 간격"이라도 대기는 2배 차이: 분산이 서비스 품질' ] }; },
    hints:['CV 1 vs 0.'] },
  { id:'u5-l3-03', level:3, type:'num', tags:['가동률 심화'], src:'창작 문제(검산됨)',
    params:{ up:{choices:[45,95],unit:'일'}, dn:{choices:[5,10],unit:'일'}, t:{choices:[365],unit:'일'} },
    statement:function(p){ return '가동 평균 '+p.up+'일↔수리 '+p.dn+'일. 연간(t='+p.t+'일) 기대 가동일수와 기대 고장 횟수를 구하라.'; },
    solve:function(p){ var A=p.up/(p.up+p.dn);
      return { ans:{days:A*p.t, n:p.t/(p.up+p.dn)}, unit:{days:'일', n:'회'}, steps:[
        '가용도 A = '+SVH.fmt(A)+' → 가동일 = '+SVH.fmt(A*p.t)+'일',
        '고장 횟수 ≈ t/사이클 = '+p.t+'/'+(p.up+p.dn)+' = '+SVH.fmt(p.t/(p.up+p.dn))+'회 — 두 지표가 한 사이클에서' ] }; },
    hints:['사이클 길이=up+down.'] },
  { id:'u5-l3-04', level:3, type:'num', tags:['정책 비용 비교'], src:'창작 문제(검산됨)',
    params:{ mu:{choices:[4,6],unit:'년'}, cf:{choices:[100,200],unit:'만원'}, cp:{choices:[30,50],unit:'만원'}, T:{choices:[2,3],unit:'년'} },
    statement:function(p){ return 'A안: 고장 시 교체(평균 μ='+p.mu+'년, 건당 '+p.cf+'만원). B안: 매 T='+p.T+'년 계획 교체(건당 '+p.cp+'만원, 고장 없다고 가정). 두 비용률(만원/년)을 구하라.'; },
    solve:function(p){ return { ans:{rA:p.cf/p.mu, rB:p.cp/p.T}, unit:{rA:'만원/년', rB:'만원/년'}, steps:[
        'A = '+p.cf+'/'+p.mu+' = '+SVH.fmt(p.cf/p.mu)+' · B = '+p.cp+'/'+p.T+' = '+SVH.fmt(p.cp/p.T),
        '재생보상률 비교가 정책 결정 — 실제 문제는 두 효과가 섞인 min(X,T) 사이클(l4-02)' ] }; },
    hints:['각 정책=각 재생과정.'] },
  { id:'u5-l3-05', level:3, type:'num', tags:['나이 분포'], src:'교재 표준',
    params:{ lam:{choices:[0.5,1],unit:'/시간'}, x:{choices:[1,2],unit:'시간'} },
    statement:function(p){ return '지수 간격(λ='+p.lam+') 재생과정에서 장기 나이 분포 P(A>x)=e^{−λx}를 x='+p.x+'에서 구하라. (극한 나이분포 밀도 = (1−F(x))/μ)'; },
    solve:function(p){ var v=Math.exp(-p.lam*p.x);
      return { ans:v, unit:'', steps:[
        '극한 밀도 f_A(x) = (1−F(x))/μ = λe^{−λx} → P(A>x) = e^{−λx}',
        '= '+SVH.fmt(v)+' — 지수는 나이도 지수(무기억의 또 다른 얼굴)' ] }; },
    hints:['(1−F)/μ 적분.'] },
  { id:'u5-l3-06', level:3, type:'num', tags:['length-biased'], src:'교재 표준',
    params:{ b:{choices:[10,20],unit:'분'}, x:{choices:[4,8],unit:'분'} },
    constraint:function(p){ return p.x < p.b; },
    statement:function(p){ return '간격 U(0,'+p.b+')에서 임의 시점이 걸친 간격이 x='+p.x+'분보다 길 확률 P(X_I>x)=1−x²/b²는?'; },
    solve:function(p){ var v=1-p.x*p.x/(p.b*p.b);
      return { ans:v, unit:'', steps:[
        'length-biased 밀도 g(u)=u·f(u)/μ = 2u/b² → P(X_I>x) = 1−x²/b²',
        '= '+SVH.fmt(v)+' > 원래 확률 1−x/b='+SVH.fmt(1-p.x/p.b)+' — 긴 간격 쪽으로 휘어 있다' ] }; },
    hints:['길이 가중 밀도 u·f(u)/μ.'] },
  { id:'u5-l3-07', level:3, type:'num', tags:['보상=비례'], src:'창작 문제(검산됨)',
    params:{ mu:{choices:[5,8],unit:'분'}, cv:{choices:[0.5,1],unit:''}, al:{choices:[2,4],unit:'만원/분²'} },
    statement:function(p){ return '사이클 길이 X(평균 '+p.mu+'분, CV='+p.cv+')마다 보상 R=α·X² (α='+p.al+'만원/분²). 장기 보상률 αE[X²]/E[X]=αμ(1+CV²)은?'; },
    solve:function(p){ var v=p.al*p.mu*(1+p.cv*p.cv);
      return { ans:v, unit:'만원/분', steps:[
        'rate = αE[X²]/E[X] = α·μ(1+CV²) = '+p.al+'×'+p.mu+'×'+SVH.fmt(1+p.cv*p.cv),
        '= '+SVH.fmt(v)+' — 보상이 길이의 비선형 함수면 분산이 수익률에 들어온다' ] }; },
    hints:['E[X²]=μ²(1+CV²) ÷ μ.'] },
  { id:'u5-l3-08', level:3, type:'num', tags:['검사역설 일반'], src:'강의자료 대조',
    params:{ mu:{choices:[10,20],unit:'분'}, cv:{choices:[0,0.5,1],unit:''} },
    statement:function(p){ return '간격 평균 μ='+p.mu+'분, CV='+p.cv+'. 관측 간격 평균과 평균 잔여 대기를 구하라.'; },
    solve:function(p){ var EI=p.mu*(1+p.cv*p.cv);
      return { ans:{EI:EI, ER:EI/2}, unit:{EI:'분', ER:'분'}, steps:[
        'E[X_I] = μ(1+CV²) = '+SVH.fmt(EI)+'분',
        'E[대기] = E[X_I]/2 = '+SVH.fmt(EI/2)+'분 — CV=0이면 μ/2, CV=1(지수)이면 μ: 한 공식으로 전 스펙트럼' ] }; },
    hints:['잔여=관측/2 (대칭).'] },
  { id:'u5-l3-09', level:3, type:'num', tags:['수리공 수입'], src:'창작 문제(검산됨)',
    params:{ up:{choices:[20,40],unit:'일'}, dn:{choices:[2,4],unit:'일'}, w:{choices:[30,50],unit:'만원/일'} },
    statement:function(p){ return '기계: 가동 평균 '+p.up+'일↔수리 '+p.dn+'일. 수리 중에만 일당 '+p.w+'만원을 버는 수리공의 장기 수입률(만원/일)은?'; },
    solve:function(p){ var v=p.w*p.dn/(p.up+p.dn);
      return { ans:v, unit:'만원/일', steps:[
        '사이클당 수입 = w·μ_dn = '+(p.w*p.dn)+'만원, 사이클 = '+(p.up+p.dn)+'일',
        'rate = '+SVH.fmt(v)+'만원/일 = w×(수리 비율) — 보상률=비율×단가의 구조' ] }; },
    hints:['수리 비율부터.'] },
  { id:'u5-l3-10', level:3, type:'num', tags:['포아송 특례'], src:'창작 문제(검산됨)',
    params:{ lam:{choices:[0.2,0.5],unit:'/분'} },
    statement:function(p){ return '지수 간격(λ='+p.lam+'/분) 재생과정에서 ① 장기율 ② 관측 간격 평균 ③ 평균 잔여를 구하라.'; },
    solve:function(p){ var m=1/p.lam;
      return { ans:{rate:p.lam, EI:2*m, ER:m}, unit:{rate:'/분', EI:'분', ER:'분'}, steps:[
        '율 = λ = '+p.lam+'/분 · E[X_I] = 2/λ = '+SVH.fmt(2*m)+'분 (2배!)',
        'E[잔여] = 1/λ = '+SVH.fmt(m)+'분 — 포아송은 재생 이론의 깔끔한 특례로 재조명된다' ] }; },
    hints:['셋 다 앞 공식 대입.'] },
  { id:'u5-l3-11', level:3, type:'num', tags:['타이어 검사'], src:'기출 유형',
    params:{ b:{choices:[6,8],unit:'만km'} },
    statement:function(p){ return '타이어 수명 U(0,'+p.b+'만km)(즉시 교체). 무작위 시점 검사에서 ① 장착 중 타이어의 기대 총수명 ② 기대 잔여수명을 구하라.'; },
    solve:function(p){ return { ans:{EI:2*p.b/3, ER:p.b/3}, unit:{EI:'만km', ER:'만km'}, steps:[
        '검사가 잡은 타이어는 length-biased: E = 2b/3 = '+SVH.fmt(2*p.b/3)+'만km (> 평균 b/2)',
        '잔여 = b/3 = '+SVH.fmt(p.b/3)+'만km — 검사 데이터로 평균 수명을 추정하면 과대평가되는 이유' ] }; },
    hints:['모집단 평균≠표본(검사) 평균.'] },
  { id:'u5-l3-12', level:3, type:'num', tags:['통행 보상'], src:'창작 문제(검산됨)',
    params:{ mu:{choices:[3,5],unit:'분'}, fee:{choices:[2,4],unit:'천원'}, t:{choices:[600,1200],unit:'분'} },
    statement:function(p){ return '차량이 평균 '+p.mu+'분 간격(재생)으로 통과, 대당 요금 '+p.fee+'천원. t='+p.t+'분 동안 기대 수입(천원)은?'; },
    solve:function(p){ var v=p.fee*p.t/p.mu;
      return { ans:v, unit:'천원', steps:[
        '수입률 = fee/μ = '+SVH.fmt(p.fee/p.mu)+'천원/분',
        '× t = '+SVH.fmt(v)+'천원 — 재생보상 → 총량은 rate×시간' ] }; },
    hints:['율 계산 후 스케일.'] },
  { id:'u5-l3-13', level:3, type:'num', tags:['횟수 신뢰구간'], src:'창작 문제(검산됨)',
    params:{ mu:{choices:[2,4],unit:'분'}, sd:{choices:[1,2],unit:'분'}, t:{choices:[400,800],unit:'분'} },
    statement:function(p){ return '간격(μ='+p.mu+', σ='+p.sd+'분), t='+p.t+'분. N(t)의 근사 평균과 ±1σ 구간의 하한(t/μ−√(tσ²/μ³))을 구하라.'; },
    solve:function(p){ var m=p.t/p.mu, s=Math.sqrt(p.t*p.sd*p.sd/Math.pow(p.mu,3));
      return { ans:{E:m, lo:m-s}, unit:{E:'회', lo:'회'}, steps:[
        'E ≈ t/μ = '+SVH.fmt(m)+'회, SD ≈ '+SVH.fmt(s)+'회',
        '하한 ≈ '+SVH.fmt(m-s)+'회 — 처리량 보장 설계의 1차 감각(재생 CLT)' ] }; },
    hints:['l2-12 재사용.'] },
  { id:'u5-l3-14', level:3, type:'num', tags:['부분 가동 보상'], src:'창작 문제(검산됨)',
    params:{ up:{choices:[18,28],unit:'일'}, dn:{choices:[2,4],unit:'일'}, g:{choices:[100,200],unit:'만원/일'}, c:{choices:[50,80],unit:'만원/일'} },
    statement:function(p){ return '가동 중 '+p.g+'만원/일 수익, 수리 중 '+p.c+'만원/일 비용(가동 '+p.up+'일↔수리 '+p.dn+'일). 장기 순수익률(만원/일)은?'; },
    solve:function(p){ var v=(p.g*p.up-p.c*p.dn)/(p.up+p.dn);
      return { ans:v, unit:'만원/일', steps:[
        '사이클 순수익 = '+p.g+'×'+p.up+'−'+p.c+'×'+p.dn+' = '+(p.g*p.up-p.c*p.dn)+'만원',
        '÷ 사이클 '+(p.up+p.dn)+'일 = '+SVH.fmt(v)+'만원/일 — 이익·비용을 한 사이클에 다 싣고 나누면 끝' ] }; },
    hints:['사이클 단위 회계.'] },

  /* ---------- L4 (8) ---------- */
  { id:'u5-l4-01', level:4, type:'derive', tags:['장기율 유도'], src:'교재 표준',
    statement:'재생과정에서 \\(N(t)/t\\to1/\\mu\\)를 대수법칙+끼워넣기(squeeze)로 유도하라.',
    steps:[
      '샌드위치: S_{N(t)} ≤ t < S_{N(t)+1} [왜] N(t)번째 재생은 t 이전, 다음 재생은 t 이후 — 정의 그대로',
      'N(t)로 나눔: S_{N(t)}/N(t) ≤ t/N(t) < S_{N(t)+1}/N(t)',
      '대수법칙: S_n/n → μ (iid 평균), 그리고 t→∞면 N(t)→∞',
      '양끝이 μ로 수렴 → t/N(t)→μ, 뒤집으면 N(t)/t → 1/μ (확률 1)',
      '극한 체크: 지수 간격이면 1/μ=λ (포아송과 정합) ✓ · μ=∞(무거운 꼬리)면 율 0 ✓'
    ],
    hints:['정의 부등식 한 줄이 전부.','역수 취하기 전 샌드위치.'],
    expl:'"평균만 알면 장기율이 나온다" — 분포 자유(distribution-free)라는 점이 재생 이론의 상품성이다.' },
  { id:'u5-l4-02', level:4, type:'num', tags:['계획교체 정책'], src:'기출 유형',
    params:{ lam:{choices:[0.1,0.2],unit:'/월'}, T:{choices:[3,6],unit:'월'}, cp:{choices:[10,20],unit:'만원'}, cf:{choices:[100,150],unit:'만원'} },
    statement:function(p){ return '수명 Exp(λ='+p.lam+'/월), T='+p.T+'월마다 계획교체('+p.cp+'만원), 그 전 고장 시 긴급교체('+p.cf+'만원). 사이클 평균 길이 E=(1−e^{−λT})/λ와 비용률 [c_p e^{−λT}+c_f(1−e^{−λT})]/E를 구하라.'; },
    solve:function(p){ var q=Math.exp(-p.lam*p.T), EL=(1-q)/p.lam, cost=p.cp*q+p.cf*(1-q);
      return { ans:{EL:EL, rate:cost/EL}, unit:{EL:'월', rate:'만원/월'}, steps:[
        '사이클=min(X,T): E[min] = ∫₀ᵀe^{−λt}dt = (1−e^{−λT})/λ = '+SVH.fmt(EL)+'월',
        '기대 비용 = '+SVH.fmt(cost)+' → rate = '+SVH.fmt(cost/EL)+'만원/월 — 지수 수명이면 T를 어떻게 잡아도 λc_f보다 못 내려간다(무기억: 예방교체 무익)' ] }; },
    hints:['P(계획)=e^{−λT}.','E[min(X,T)]는 생존함수 적분.'] },
  { id:'u5-l4-03', level:4, type:'derive', tags:['재생보상 유도'], src:'강의자료 대조',
    statement:'재생보상정리 \\(\\dfrac{R(t)}{t}\\to\\dfrac{E[R]}{E[X]}\\)를 장기율 정리로부터 유도하라.',
    steps:[
      '누적 보상 분해: R(t) ≈ Σ_{i=1}^{N(t)} R_i (완결 사이클 합 + 진행 중 조각은 유계) [왜] 사이클마다 보상이 쌓인다',
      'R(t)/t = [Σ R_i/N(t)] × [N(t)/t]',
      '첫 인자 → E[R] (iid 대수법칙), 둘째 인자 → 1/μ (u5-l4-01)',
      '∴ R(t)/t → E[R]/E[X] — 곱의 극한. R과 X가 사이클 안에서 종속이어도 성립하는 것이 강력',
      '극한 체크: R_i=X_i(보상=시간)면 rate=1 ✓ · R_i=1(횟수 세기)면 1/μ로 장기율 복원 ✓'
    ],
    hints:['"사이클 평균 × 사이클 빈도"로 쪼갠다.','마지막 미완 사이클은 t로 나누면 죽는다.'],
    expl:'강의 개요의 "재생보상정리의 뜻과 응용" 그 자체 — 가용도·비용률·평균 이득이 전부 이 곱 분해다.' },
  { id:'u5-l4-04', level:4, type:'num', tags:['3분포 역설 비교'], src:'기출 유형',
    params:{ mu:{choices:[10,20],unit:'분'} },
    statement:function(p){ return '평균 μ='+p.mu+'분이 같은 세 간격 분포 — 결정적, U(0,2μ), Exp — 의 평균 잔여 대기를 각각 구하라.'; },
    solve:function(p){ return { ans:{det:p.mu/2, unif:2*p.mu/3, exp:p.mu}, unit:{det:'분', unif:'분', exp:'분'}, steps:[
        '공식 E[R]=μ(1+CV²)/2: CV=0 → μ/2='+SVH.fmt(p.mu/2)+' · CV²=1/3 → 2μ/3='+SVH.fmt(2*p.mu/3)+' · CV=1 → μ='+p.mu,
        '규칙적일수록 대기가 짧다 — "배차 간격 평균"만으론 서비스가 정해지지 않는다' ] }; },
    hints:['E[R]=μ(1+CV²)/2 하나로 셋.'] },
  { id:'u5-l4-05', level:4, type:'num', tags:['SLA 역산'], src:'창작 문제(검산됨)',
    params:{ A:{choices:[0.95,0.99],unit:''}, dn:{choices:[2,5],unit:'시간'} },
    statement:function(p){ return '수리 평균이 '+p.dn+'시간으로 고정일 때 가용도 '+p.A+' 이상을 위해 필요한 평균 무고장시간(MTTF) 하한 μ_up=A·μ_dn/(1−A)을 구하라.'; },
    solve:function(p){ var v=p.A*p.dn/(1-p.A);
      return { ans:v, unit:'시간', steps:[
        'A=μ_up/(μ_up+μ_dn)을 μ_up에 대해 풀면 μ_up = A·μ_dn/(1−A)',

    hints:['가용도 식 역산.'] },
