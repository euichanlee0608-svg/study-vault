    params:{ Voc:{min:6,max:24,step:2,unit:'V'}, Isc:{min:1,max:8,step:1,unit:'A'} },
    statement:function(p){ return '어떤 선형 회로의 단자에서 개방 전압 '+p.Voc+' V, 단락 전류 '+p.Isc+' A를 측정했다. 테브난 저항과, 부하 정합 시 최대 전력을 구하라.'; },
    solve:function(p){ var RT=p.Voc/p.Isc, Pm=p.Voc*p.Voc/(4*RT);
      return { ans:{RT:RT, Pm:Pm}, unit:{RT:'Ω', Pm:'W'}, steps:[
        'R_T = V_oc/I_sc = '+SVH.fmt(RT)+' Ω',
        'P_max = V_oc²/(4R_T) = '+SVH.fmt(Pm)+' W (R_L=R_T일 때)' ] }; },
    hints:['측정 두 개면 등가가 나온다.'] },
  { id:'u4-l2-06', level:2, type:'num', tags:['부하 전류'], src:'창작 문제(검산됨)',
    params:{ VT:{min:6,max:24,step:2,unit:'V'}, RT:{min:2,max:10,step:2,unit:'Ω'}, RL:{min:2,max:20,step:2,unit:'Ω'} },
    statement:function(p){ return '테브난 등가 V_T='+p.VT+' V, R_T='+p.RT+' Ω에 부하 R_L='+p.RL+' Ω을 달았다. 부하 전류·전압·전력을 구하라.'; },
    solve:function(p){ var I=p.VT/(p.RT+p.RL), V=I*p.RL, P=I*I*p.RL;
      return { ans:{I:I, V:V, P:P}, unit:{I:'A', V:'V', P:'W'}, steps:[
        'I = V_T/(R_T+R_L) = '+SVH.fmt(I)+' A',
        'V = IR_L = '+SVH.fmt(V)+' V, P = I²R_L = '+SVH.fmt(P)+' W' ] }; },
    hints:['등가가 있으면 부하 계산은 한 루프.'] },
  { id:'u4-l2-07', level:2, type:'num', tags:['최대 전력'], src:'창작 문제(검산됨)',
    params:{ VT:{min:8,max:20,step:4,unit:'V'}, RT:{min:2,max:10,step:1,unit:'Ω'} },
    statement:function(p){ return 'V_T='+p.VT+' V, R_T='+p.RT+' Ω인 전원에서 (a) 최대 전력을 받는 R_L (b) 그때 부하 전력 (c) 그때 효율을 구하라.'; },
    solve:function(p){ var Pm=p.VT*p.VT/(4*p.RT);
      return { ans:{RL:p.RT, Pm:Pm, eff:50}, unit:{RL:'Ω', Pm:'W', eff:'%'}, steps:[
        '정합: R_L = R_T = '+p.RT+' Ω',
        'P_max = V_T²/4R_T = '+SVH.fmt(Pm)+' W',
        '이때 R_T에도 같은 전력이 떨어지므로 효율 = 50 %' ] }; },
    hints:['정합 조건과 그 대가(효율)를 같이 답한다.'] },
  { id:'u4-l2-08', level:2, type:'num', tags:['중첩 2전원'], src:'창작 문제(검산됨)',
    params:{ V1:{min:6,max:18,step:3,unit:'V'}, V2:{min:3,max:12,step:3,unit:'V'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return '전압원 V₁='+p.V1+' V — R₁='+p.R1+' Ω — (중간 절점) — R₂='+p.R2+' Ω — 전압원 V₂='+p.V2+' V(둘 다 +가 안쪽, 접지 공유). 중간 절점 전압을 중첩으로 구하라.'; },
    solve:function(p){
      var va=p.V1*p.R2/(p.R1+p.R2); // V2 끔
      var vb=p.V2*p.R1/(p.R1+p.R2); // V1 끔
      return { ans:{va:va, vb:vb, v:va+vb}, unit:{va:'V', vb:'V', v:'V'}, steps:[
        'V₂를 끄면(단락): 분압 v_a = V₁R₂/(R₁+R₂) = '+SVH.fmt(va)+' V',
        'V₁을 끄면: v_b = V₂R₁/(R₁+R₂) = '+SVH.fmt(vb)+' V',
        '합: v = '+SVH.fmt(va+vb)+' V (선형이므로 그냥 더한다)' ] }; },
    hints:['끈 전압원 자리는 전선(단락)이 된다.'] },
  { id:'u4-l2-09', level:2, type:'num', tags:['중첩 V+I'], src:'기출 유형',
    params:{ Vs:{min:6,max:18,step:6,unit:'V'}, Is:{min:1,max:4,step:1,unit:'A'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return '전압원 '+p.Vs+' V — R₁='+p.R1+' Ω — 절점 — R₂='+p.R2+' Ω — 접지, 그리고 전류원 '+p.Is+' A가 절점으로 유입. 절점 전압을 중첩으로 구하라.'; },
    solve:function(p){
      var va=p.Vs*p.R2/(p.R1+p.R2);
      var vb=p.Is*SVH.par(p.R1,p.R2);
      return { ans:{va:va, vb:vb, v:va+vb}, unit:{va:'V', vb:'V', v:'V'}, steps:[
        '전류원 끔(개방): 분압 v_a = '+SVH.fmt(va)+' V',
        '전압원 끔(단락): R₁∥R₂에 I_s → v_b = I_s(R₁∥R₂) = '+SVH.fmt(vb)+' V',
        'v = v_a + v_b = '+SVH.fmt(va+vb)+' V' ] }; },
    hints:['전원 종류별 끄는 방법이 다르다.'] },
  { id:'u4-l2-10', level:2, type:'num', tags:['R_T 접기'], src:'창작 문제(검산됨)',
    params:{ R1:{min:2,max:8,step:2,unit:'Ω'}, R2:{min:2,max:8,step:2,unit:'Ω'}, R3:{min:2,max:8,step:2,unit:'Ω'} },
    statement:function(p){ return '전압원(값 무관) — R₁='+p.R1+' Ω — 단자A, 단자A—접지에 R₂='+p.R2+' Ω, 직렬로 이어지는 R₃='+p.R3+' Ω가 단자 바깥에 있다. 단자(R₃ 끝—접지)에서 본 테브난 저항은?'; },
    solve:function(p){ var RT=p.R3+SVH.par(p.R1,p.R2);
      return { ans:RT, unit:'Ω', steps:[
        '전원 단락 → 안쪽은 R₁∥R₂ = '+SVH.fmt(SVH.par(p.R1,p.R2))+' Ω',
        '직렬 R₃ 더해 R_T = '+SVH.fmt(RT)+' Ω' ] }; },
    hints:['단자에서 "안으로" 보며 접는다.'] },
  { id:'u4-l2-11', level:2, type:'num', tags:['노턴→테브난'], src:'창작 문제(검산됨)',
    params:{ IN:{min:2,max:8,step:2,unit:'A'}, RN:{min:3,max:12,step:3,unit:'Ω'}, RL:{min:3,max:12,step:3,unit:'Ω'} },
    statement:function(p){ return '노턴 등가 I_N='+p.IN+' A, R_N='+p.RN+' Ω에 부하 R_L='+p.RL+' Ω. 부하 전류를 (a) 분류로 (b) 테브난 변환 후 직렬로 각각 구해 일치를 확인하라.'; },
    solve:function(p){
      var Ia=p.IN*p.RN/(p.RN+p.RL);
      var VT=p.IN*p.RN, Ib=VT/(p.RN+p.RL);
      return { ans:{Ia:Ia, Ib:Ib}, unit:{Ia:'A', Ib:'A'}, steps:[
        '(a) 분류: I_L = I_N·R_N/(R_N+R_L) = '+SVH.fmt(Ia)+' A',
        '(b) V_T = I_NR_N = '+SVH.fmt(VT)+' V → I_L = V_T/(R_N+R_L) = '+SVH.fmt(Ib)+' A',
        '일치 ✓ — 같은 물리의 두 표현' ] }; },
    hints:['등가끼리는 어떤 계산이든 같은 답.'] },
  { id:'u4-l2-12', level:2, type:'num', tags:['비례성'], src:'창작 문제(검산됨)',
    params:{ Vs1:{min:5,max:15,step:5,unit:'V'}, Io1:{min:1,max:3,step:1,unit:'A'}, Vs2:{min:20,max:40,step:10,unit:'V'} },
    statement:function(p){ return '선형 저항 회로에서 입력 '+p.Vs1+' V일 때 어떤 가지 전류가 '+p.Io1+' A였다. 입력을 '+p.Vs2+' V로 바꾸면 그 가지 전류는?'; },
    solve:function(p){ var I=p.Io1*p.Vs2/p.Vs1;
      return { ans:I, unit:'A', steps:[
        '선형성(비례성): 출력 ∝ 입력 (전원 1개)',
        'I = '+p.Io1+' × '+p.Vs2+'/'+p.Vs1+' = '+SVH.fmt(I)+' A' ] }; },
    hints:['전원이 하나면 스케일링이 전부다.'] },
  { id:'u4-l2-13', level:2, type:'num', tags:['등가 전압원 직렬'], src:'창작 문제(검산됨)',
    params:{ V1:{min:3,max:12,step:3,unit:'V'}, V2:{min:3,max:12,step:3,unit:'V'}, R1:{min:1,max:5,step:1,unit:'Ω'}, R2:{min:1,max:5,step:1,unit:'Ω'} },
    statement:function(p){ return '(V₁='+p.V1+' V, R₁='+p.R1+' Ω)과 (V₂='+p.V2+' V, R₂='+p.R2+' Ω) 두 실제 전압원(전지)이 같은 극성으로 직렬이다. 합성 테브난 등가는?'; },
    solve:function(p){ var VT=p.V1+p.V2, RT=p.R1+p.R2;
      return { ans:{VT:VT, RT:RT}, unit:{VT:'V', RT:'Ω'}, steps:[
        '직렬 전압원은 더해진다: V_T = '+p.V1+'+'+p.V2+' = '+SVH.fmt(VT)+' V',
        '내부저항도 직렬 합: R_T = '+p.R1+'+'+p.R2+' = '+SVH.fmt(RT)+' Ω' ] }; },
    hints:['전지 직렬의 모델화.'] },
  { id:'u4-l2-14', level:2, type:'num', tags:['등가 전류원 병렬'], src:'창작 문제(검산됨)',
    params:{ I1:{min:1,max:5,step:1,unit:'A'}, I2:{min:1,max:5,step:1,unit:'A'}, R1:{min:2,max:8,step:2,unit:'Ω'}, R2:{min:2,max:8,step:2,unit:'Ω'} },
    statement:function(p){ return '(I₁='+p.I1+' A, R₁='+p.R1+' Ω 병렬)과 (I₂='+p.I2+' A, R₂='+p.R2+' Ω 병렬) 두 노턴 전원이 같은 방향으로 병렬 결합. 합성 노턴 등가는?'; },
    solve:function(p){ var IN=p.I1+p.I2, RN=SVH.par(p.R1,p.R2);
      return { ans:{IN:IN, RN:RN}, unit:{IN:'A', RN:'Ω'}, steps:[
        '병렬 전류원은 더해진다: I_N = '+p.I1+'+'+p.I2+' = '+SVH.fmt(IN)+' A',
        '저항은 병렬 합성: R_N = R₁∥R₂ = '+SVH.fmt(RN)+' Ω' ] }; },
    hints:['노턴끼리 병렬은 그냥 더하기.'] },
  { id:'u4-l2-15', level:2, type:'num', tags:['개방 전압 vs 부하'], src:'기출 유형',
    params:{ VT:{min:10,max:20,step:2,unit:'V'}, RT:{choices:[100,500,1000],unit:'Ω'}, RL:{choices:[1000,10000],unit:'Ω'} },
    statement:function(p){ return '내부저항 '+p.RT+' Ω, 개방 전압 '+p.VT+' V인 신호원에 R_L='+SVH.si(p.RL,'Ω')+' 입력저항 계측기를 연결했다. 계측기가 읽는 전압과 개방 전압 대비 비율(%)은?'; },
    solve:function(p){ var V=p.VT*p.RL/(p.RT+p.RL), r=V/p.VT*100;
      return { ans:{V:V, r:r}, unit:{V:'V', r:'%'}, steps:[
        'V = V_T·R_L/(R_T+R_L) = '+SVH.fmt(V)+' V',
        '비율 = '+SVH.fmt(r)+' % → R_L ≫ R_T일수록 100%에 접근(기출 1(j)의 정량판)' ] }; },
    hints:['좋은 전압 측정 = 큰 입력저항.'] },

  /* ---------- L3 (10) ---------- */
  { id:'u4-l3-01', level:3, type:'num', tags:['테브난 종합'], src:'기출 유형',
    params:{ Vs:{min:12,max:24,step:4,unit:'V'}, R1:{min:2,max:8,step:2,unit:'Ω'}, R2:{min:2,max:8,step:2,unit:'Ω'}, R3:{min:1,max:5,step:1,unit:'Ω'} },
    statement:function(p){ return '전압원 '+p.Vs+' V — R₁='+p.R1+' Ω — 절점A(—접지 R₂='+p.R2+' Ω) — R₃='+p.R3+' Ω — 단자B. 단자 B—접지의 테브난 등가를 구하라.'; },
    solve:function(p){
      var VT=p.Vs*p.R2/(p.R1+p.R2); // 개방이라 R3 전류 0
      var RT=p.R3+SVH.par(p.R1,p.R2);
      return { ans:{VT:VT, RT:RT}, unit:{VT:'V', RT:'Ω'}, steps:[
        '개방 시 R₃ 전류 0 → V_oc = 절점A 전압 = 분압 '+SVH.fmt(VT)+' V (R₃ 강하 없음!)',
        'R_T = R₃ + R₁∥R₂ = '+SVH.fmt(RT)+' Ω' ] }; },
    hints:['개방 단자로는 전류가 못 흐른다 — R₃의 역할에 주의.'] },
  { id:'u4-l3-02', level:3, type:'num', tags:['2단 전원 변환'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:12,max:24,step:6,unit:'V'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'}, R3:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return '전압원 '+p.Vs+' V+직렬 R₁='+p.R1+' Ω → (절점—접지 R₂='+p.R2+' Ω) → 직렬 R₃='+p.R3+' Ω → 단자. 전원 변환을 반복해 단자 테브난 등가를 구하라.'; },
    solve:function(p){
      var I1=p.Vs/p.R1, Rp=SVH.par(p.R1,p.R2);
      var V2=I1*Rp, RT=Rp+p.R3;
      return { ans:{VT:V2, RT:RT}, unit:{VT:'V', RT:'Ω'}, steps:[
        '변환1: ('+p.Vs+' V, '+p.R1+' Ω 직렬) → ('+SVH.fmt(I1)+' A, '+p.R1+' Ω 병렬)',
        'R₁∥R₂ = '+SVH.fmt(Rp)+' Ω → 다시 전압원으로: V = I·R = '+SVH.fmt(V2)+' V',
        'R₃ 직렬 흡수 → V_T='+SVH.fmt(V2)+' V, R_T='+SVH.fmt(RT)+' Ω' ] }; },
    hints:['변환→병렬 합→역변환→직렬 합의 리듬.'] },
  { id:'u4-l3-03', level:3, type:'num', tags:['중첩 3전원'], src:'창작 문제(검산됨)',
    params:{ V1:{min:6,max:12,step:6,unit:'V'}, V2:{min:6,max:12,step:6,unit:'V'}, Is:{min:1,max:3,step:1,unit:'A'}, R1:{min:2,max:4,step:2,unit:'Ω'}, R2:{min:2,max:4,step:2,unit:'Ω'} },
    statement:function(p){ return 'u4-l2-08 회로(V₁, R₁, 절점, R₂, V₂)에 전류원 '+p.Is+' A가 절점으로 추가 유입된다. 절점 전압을 중첩 3항으로 구하라.'; },
    solve:function(p){
      var va=p.V1*p.R2/(p.R1+p.R2), vb=p.V2*p.R1/(p.R1+p.R2), vc=p.Is*SVH.par(p.R1,p.R2);
      return { ans:{va:va, vb:vb, vc:vc, v:va+vb+vc}, unit:{va:'V', vb:'V', vc:'V', v:'V'}, steps:[
        'V₁만: '+SVH.fmt(va)+' V · V₂만: '+SVH.fmt(vb)+' V · I_s만: '+SVH.fmt(vc)+' V',
        '합 = '+SVH.fmt(va+vb+vc)+' V — 절점법으로 한 번에 풀어 검산 가능' ] }; },
    hints:['전원 3개 = 항 3개.'] },
  { id:'u4-l3-04', level:3, type:'num', tags:['측정 기반 R_T'], src:'기출 유형',
    params:{ Voc:{min:10,max:20,step:2,unit:'V'}, RL:{choices:[10,20,50],unit:'Ω'}, frac:{choices:[0.5,0.6,0.8]} },
    statement:function(p){ var VL=p.Voc*p.frac; return '개방 전압이 '+p.Voc+' V인 회로에 R_L='+p.RL+' Ω을 달았더니 단자 전압이 '+SVH.fmt(VL)+' V가 되었다. 테브난 저항은? (단락이 위험해 V_oc/I_sc를 못 쓰는 상황)'; },
    solve:function(p){ var VL=p.Voc*p.frac, RT=p.RL*(p.Voc-VL)/VL;
      return { ans:RT, unit:'Ω', steps:[
        '분압 역산: \\(V_L = V_{oc}\\dfrac{R_L}{R_T+R_L}\\)',
        'R_T = R_L(V_oc−V_L)/V_L = '+SVH.fmt(RT)+' Ω',
        '(안전한 실측법 — 기출 1(g)의 실무 확장)' ] }; },
    hints:['분압식을 R_T에 대해 푼다.'] },
  { id:'u4-l3-05', level:3, type:'num', tags:['종속 전원 R_T'], src:'기출 유형',
    params:{ R1:{min:2,max:6,step:2,unit:'Ω'}, k:{choices:[0.5,2]} },
    statement:function(p){ return '단자에 시험 전압 \\(v_t\\)를 걸었더니 유입 전류가 \\(i_t = v_t/'+p.R1+' + '+p.k+'v_t\\) [A]로 측정되는 회로(내부에 종속 전원 존재). 테브난 저항은?'; },
    solve:function(p){ var RT=1/(1/p.R1+p.k);
      return { ans:RT, unit:'Ω', steps:[
        '종속 전원 회로의 R_T = 시험 전원법: \\(R_T = v_t/i_t\\)',
        'R_T = 1/(1/'+p.R1+'+'+p.k+') = '+SVH.fmt(RT)+' Ω',
        '(전원 끄고 접기가 불가능한 이유: 종속 전원은 끌 수 없다)' ] }; },
    hints:['R_T = v_t/i_t 정의로 돌아간다.'] },
  { id:'u4-l3-06', level:3, type:'num', tags:['최대 전력 설계'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:12,max:24,step:6,unit:'V'}, R1:{min:2,max:8,step:2,unit:'Ω'}, R2:{min:2,max:8,step:2,unit:'Ω'} },
    statement:function(p){ return '분압기 전원(V_s='+p.Vs+' V, 위 R₁='+p.R1+' Ω, 아래 R₂='+p.R2+' Ω)의 출력에 부하를 단다. (a) 최대 전력을 받는 R_L (b) 그때 부하 전력을 구하라.'; },
    solve:function(p){
      var VT=p.Vs*p.R2/(p.R1+p.R2), RT=SVH.par(p.R1,p.R2), Pm=VT*VT/(4*RT);
      return { ans:{RL:RT, Pm:Pm}, unit:{RL:'Ω', Pm:'W'}, steps:[
        '테브난 먼저: V_T='+SVH.fmt(VT)+' V, R_T=R₁∥R₂='+SVH.fmt(RT)+' Ω',
        'R_L = R_T = '+SVH.fmt(RT)+' Ω, P_max = V_T²/4R_T = '+SVH.fmt(Pm)+' W' ] }; },
    hints:['최대 전력 문제는 "테브난부터".'] },
  { id:'u4-l3-07', level:3, type:'num', tags:['효율 곡선'], src:'창작 문제(검산됨)',
    params:{ VT:{min:10,max:20,step:5,unit:'V'}, RT:{min:2,max:6,step:2,unit:'Ω'}, m:{choices:[2,3,4]} },
    statement:function(p){ return 'V_T='+p.VT+' V, R_T='+p.RT+' Ω 전원에 R_L='+p.m+'R_T를 달았다. 부하 전력과 효율을 구하고, 정합(R_L=R_T) 때와 비교하라.'; },
    solve:function(p){
      var RL=p.m*p.RT, I=p.VT/(p.RT+RL), P=I*I*RL, eff=RL/(p.RT+RL)*100, Pm=p.VT*p.VT/(4*p.RT);
      return { ans:{P:P, eff:eff}, unit:{P:'W', eff:'%'}, steps:[
        'I = '+SVH.fmt(I)+' A → P = I²R_L = '+SVH.fmt(P)+' W (정합 최대 '+SVH.fmt(Pm)+' W보다 작다)',
        '효율 = R_L/(R_T+R_L) = '+SVH.fmt(eff)+' % (정합 50%보다 높다)',
        '→ "최대 전력"과 "고효율"은 다른 목표라는 것이 결론' ] }; },
    hints:['전력은 정합에서 최대, 효율은 R_L이 클수록 상승.'] },
  { id:'u4-l3-08', level:3, type:'num', tags:['브리지 테브난'], src:'기출 유형',
    params:{ Vs:{min:10,max:20,step:5,unit:'V'}, R1:{min:100,max:300,step:100,unit:'Ω'}, R2:{min:100,max:300,step:100,unit:'Ω'}, R3:{min:100,max:300,step:100,unit:'Ω'}, R4:{min:100,max:300,step:100,unit:'Ω'} },
    statement:function(p){ return '브리지('+p.Vs+' V, 왼쪽 R₁ 위·R₃ 아래, 오른쪽 R₂ 위·R₄ 아래)의 가운데 두 중점 단자에서 본 테브난 등가(V_T, R_T)를 구하라. (검류계 달기 전 준비 계산)'; },
    solve:function(p){
      var VT=p.Vs*(p.R3/(p.R1+p.R3)-p.R4/(p.R2+p.R4));
      var RT=SVH.par(p.R1,p.R3)+SVH.par(p.R2,p.R4);
      return { ans:{VT:VT, RT:RT}, unit:{VT:'V', RT:'Ω'}, steps:[
        'V_T = 두 분압의 차 = '+SVH.fmt(VT)+' V',
        'R_T = 전원 단락 시 (R₁∥R₃)+(R₂∥R₄) = '+SVH.fmt(RT)+' Ω',
        '(가운데에 어떤 검류계(R_g)를 달아도 전류 = V_T/(R_T+R_g) 로 즉시 계산된다)' ] }; },
    hints:['전원을 단락하면 좌우 가지가 각각 병렬로 접힌다.'] },
  { id:'u4-l3-09', level:3, type:'num', tags:['노턴 실전'], src:'창작 문제(검산됨)',
    params:{ Is:{min:2,max:6,step:2,unit:'A'}, R1:{min:2,max:8,step:2,unit:'Ω'}, R2:{min:2,max:8,step:2,unit:'Ω'}, RL:{min:1,max:9,step:2,unit:'Ω'} },
    statement:function(p){ return '전류원 '+p.Is+' A ∥ R₁='+p.R1+' Ω 다음에 직렬 R₂='+p.R2+' Ω를 거쳐 단자. (a) 단자 노턴 등가 (b) R_L='+p.RL+' Ω 연결 시 부하 전류를 구하라.'; },
    solve:function(p){
      var RN=p.R1+p.R2;
      var IN=p.Is*p.R1/(p.R1+p.R2); // 단락 시 분류
      var IL=IN*RN/(RN+p.RL);
      return { ans:{IN:IN, RN:RN, IL:IL}, unit:{IN:'A', RN:'Ω', IL:'A'}, steps:[
        'R_N = 전원 개방 후 R₁+R₂ = '+SVH.fmt(RN)+' Ω',
        'I_N = 단자 단락 시 R₁·R₂ 분류 = I_s·R₁/(R₁+R₂) = '+SVH.fmt(IN)+' A',
        'I_L = I_N·R_N/(R_N+R_L) = '+SVH.fmt(IL)+' A' ] }; },
    hints:['I_sc 계산에서 단락이 어디로 이어지는지 그림.'] },
  { id:'u4-l3-10', level:3, type:'num', tags:['중첩 검산'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:6,max:18,step:6,unit:'V'}, Is:{min:1,max:3,step:1,unit:'A'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return 'u4-l2-09 회로를 절점법으로 한 번에 풀어 중첩 결과와 일치함을 보여라. (같은 파라미터: '+p.Vs+' V, '+p.Is+' A, R₁='+p.R1+', R₂='+p.R2+' Ω)'; },
    solve:function(p){
      var v=(p.Vs/p.R1+p.Is)/(1/p.R1+1/p.R2);
      var va=p.Vs*p.R2/(p.R1+p.R2), vb=p.Is*SVH.par(p.R1,p.R2);
      return { ans:{v:v, vsum:va+vb}, unit:{v:'V', vsum:'V'}, steps:[
        '절점법: \\((V_s-v)/R_1 + I_s = v/R_2\\) → v = '+SVH.fmt(v)+' V',
        '중첩 합 = '+SVH.fmt(va)+'+'+SVH.fmt(vb)+' = '+SVH.fmt(va+vb)+' V → 일치 ✓',
        '(시험장 전략: 중첩으로 풀고 절점법으로 검산, 또는 그 반대)' ] }; },
    hints:['두 방법이 다르면 어딘가 부호 실수다.'] },

  /* ---------- L4 (5) ---------- */
  { id:'u4-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'옳은 것을 모두 고르면?<br>㉠ 중첩의 근거는 결합법칙·교환법칙이다<br>㉡ 테브난 등가는 외부에서 본 v–i 관계만 보존하며, 내부 전력 분배까지 재현하지는 않는다<br>㉢ 최대 전력 전달 조건에서 전달 효율은 50%다<br>㉣ 종속 전원만 있는(독립 전원 없는) 회로의 V_oc는 0이다',
    choices:['㉡㉢㉣','㉠㉡㉢','㉠㉣','전부'],
    answer:0, expl:'㉠은 기출의 함정(근거는 선형성). ㉣: 독립 전원이 없으면 스스로 전압을 만들 수 없어 V_oc=0 (R_T만 남는다).' },
  { id:'u4-l4-02', level:4, type:'num', tags:['테브난 풀코스'], src:'기출 유형',
    params:{ Vs:{min:12,max:24,step:4,unit:'V'}, Is:{min:1,max:3,step:1,unit:'A'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'}, R3:{min:1,max:5,step:2,unit:'Ω'} },
    statement:function(p){ return '전압원 '+p.Vs+' V — R₁='+p.R1+' Ω — 절점A — R₃='+p.R3+' Ω — 단자B. 절점A—접지: R₂='+p.R2+' Ω와 전류원 '+p.Is+' A(절점A로 유입). (a) V_oc (b) R_T (c) 정합 부하 최대 전력을 구하라.'; },
    solve:function(p){
      var vA=(p.Vs/p.R1+p.Is)/(1/p.R1+1/p.R2);
      var RT=p.R3+SVH.par(p.R1,p.R2);
      var Pm=vA*vA/(4*RT);
      return { ans:{Voc:vA, RT:RT, Pm:Pm}, unit:{Voc:'V', RT:'Ω', Pm:'W'}, steps:[
        '개방 → R₃ 전류 0 → V_oc = v_A. 절점법: \\((V_s-v_A)/R_1+I_s = v_A/R_2\\) → v_A = '+SVH.fmt(vA)+' V',
        '전원 끄기(V단락·I개방): R_T = R₃+R₁∥R₂ = '+SVH.fmt(RT)+' Ω',
        'P_max = V_oc²/4R_T = '+SVH.fmt(Pm)+' W' ] }; },
    hints:['V_oc는 절점법, R_T는 끄고 접기 — 역할 분담.','R₃는 개방 전압에 안 나타난다.'] },
  { id:'u4-l4-03', level:4, type:'num', tags:['종속 전원 테브난'], src:'기출 유형',
    params:{ Is:{min:2,max:4,step:1,unit:'A'}, R1:{min:2,max:6,step:2,unit:'Ω'}, k:{choices:[0.25,0.5]} },
    statement:function(p){ return '단자 안쪽: 전류원 '+p.Is+' A가 절점으로 유입, 절점—접지 R₁='+p.R1+' Ω, 그리고 전압제어 전류원 \\('+p.k+'v\\) A(절점에서 접지로, v는 절점 전압). 절점이 곧 단자다. (a) V_oc (b) I_sc (c) R_T를 구하라.'; },
    solve:function(p){
      var Voc=p.Is/(1/p.R1+p.k);
      var Isc=p.Is; // 단락 시 v=0 → 종속 전원 0, R1도 0
      var RT=Voc/Isc;
      return { ans:{Voc:Voc, Isc:Isc, RT:RT}, unit:{Voc:'V', Isc:'A', RT:'Ω'}, steps:[
        'V_oc: KCL \\(I_s = v/R_1 + '+p.k+'v\\) → '+SVH.fmt(Voc)+' V',
        'I_sc: 단락하면 v=0 → 종속 전원·R₁ 전류 모두 0 → I_sc = I_s = '+SVH.fmt(Isc)+' A',
        'R_T = V_oc/I_sc = '+SVH.fmt(RT)+' Ω (전원 끄고 접기로는 못 구하는 값 — 종속 전원의 존재가 R_T를 바꿨다)' ] }; },
    hints:['종속 전원 회로의 3종 세트: V_oc, I_sc, 비율.','단락이 제어 변수 v를 0으로 만든다.'] },
  { id:'u4-l4-04', level:4, type:'num', tags:['설계 검증'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:20,max:40,step:10,unit:'V'}, RT:{min:4,max:10,step:2,unit:'Ω'}, Preq:{choices:[4,6,8],unit:'W'} },
    constraint:function(p){ return p.Vs*p.Vs/(4*p.RT) > p.Preq*1.05; },
    statement:function(p){ return 'V_T='+p.Vs+' V, R_T='+p.RT+' Ω 전원에서 부하가 정확히 '+p.Preq+' W를 받도록 R_L을 정하려 한다. 가능한 R_L 두 값을 구하라. (이차방정식 — 최대 가능 전력이 '+SVH.fmt(p.Vs*p.Vs/(4*p.RT))+' W임을 먼저 확인)'; },
    solve:function(p){
      // P = V² RL/(RT+RL)² → P RL² + (2 P RT − V²) RL + P RT² = 0
      var a=p.Preq, b=2*p.Preq*p.RT-p.Vs*p.Vs, c=p.Preq*p.RT*p.RT;
      var disc=Math.sqrt(b*b-4*a*c);
      var RL1=(-b+disc)/(2*a), RL2=(-b-disc)/(2*a);
      return { ans:{RL1:RL1, RL2:RL2}, unit:{RL1:'Ω', RL2:'Ω'}, steps:[
        '\\(P = \\dfrac{V^2R_L}{(R_T+R_L)^2}\\) → \\(PR_L^2+(2PR_T-V^2)R_L+PR_T^2=0\\)',
        '근의 공식: R_L = '+SVH.fmt(RL1)+' Ω 또는 '+SVH.fmt(RL2)+' Ω',
        '두 근의 곱 = R_T² (비에트) — 정합점 R_T를 사이에 둔 대칭쌍. 효율은 큰 쪽이 유리' ] }; },
    hints:['부하 전력식을 R_L의 이차방정식으로.','해가 둘인 이유를 정합점과 연결해 설명.'] },
  { id:'u4-l4-05', level:4, type:'derive', tags:['유도'], src:'교재 표준',
    statement:'최대 전력 전달 정리(\\(R_L=R_T\\)에서 \\(P_L\\) 최대, \\(P_{max}=V_T^2/4R_T\\))를 미분으로 유도하라.',
    steps:[
      '부하 전력: \\(P_L = i^2R_L = \\left(\\dfrac{V_T}{R_T+R_L}\\right)^2 R_L\\) [무엇을] 한 루프 전류로 표현 [왜] 변수 R_L 하나의 함수로 만들기 위해',
      '극값: \\(\\dfrac{dP_L}{dR_L} = V_T^2\\dfrac{(R_T+R_L)^2 - R_L\\cdot 2(R_T+R_L)}{(R_T+R_L)^4} = V_T^2\\dfrac{R_T-R_L}{(R_T+R_L)^3} = 0\\)',
      '\\(R_L = R_T\\)에서 유일한 극값. 부호 확인: R_L<R_T이면 도함수 +, R_L>R_T이면 − → 최대 ✓',
      '대입: \\(P_{max} = V_T^2 R_T/(2R_T)^2 = V_T^2/4R_T\\)',
      '극한 체크: R_L→0이면 P→0 (전압 없음), R_L→∞이면 P→0 (전류 없음) — 사이 어딘가 최대가 있어야 한다는 직관과 일치 · 차원 체크: [V²/Ω]=[W] ✓'
    ],
    hints:['P_L(R_L)을 쓰고 미분해 0.','끝점 두 극한이 모두 0임을 먼저 보이면 논리가 탄탄해진다.'],
    expl:'유도 과정 자체가 시험 단골. "몫의 미분에서 분자만 보면 된다"는 요령도 함께.' },

  { id:'u4-l3-11', level:3, type:'num', tags:['3단 전원 변환'], src:'기출 유형',
    params:{ Is:{min:2,max:4,step:1,unit:'A'}, R1:{min:2,max:4,step:1,unit:'Ω'}, R2:{min:2,max:4,step:1,unit:'Ω'}, R3:{min:2,max:6,step:2,unit:'Ω'}, RL:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return '전류원 '+p.Is+' A ∥ R₁='+p.R1+' Ω → 직렬 R₂='+p.R2+' Ω → 병렬 R₃='+p.R3+' Ω → 부하 R_L='+p.RL+' Ω. 전원 변환을 반복해 부하 전류를 구하라.'; },
    solve:function(p){
      var V1=p.Is*p.R1;                    // 테브난 (V1, R1)
      var Rs=p.R1+p.R2;                    // 직렬 흡수
      var I2=V1/Rs, Rp=SVH.par(Rs,p.R3);   // 노턴 변환 후 R3 병합
      var V2=I2*Rp;                        // 다시 테브난
      var IL=V2/(Rp+p.RL);
      return { ans:IL, unit:'A', steps:[
        '노턴→테브난: ('+SVH.fmt(V1)+' V, '+p.R1+' Ω) → R₂ 흡수 → ('+SVH.fmt(V1)+' V, '+SVH.fmt(Rs)+' Ω)',
        '테브난→노턴: ('+SVH.fmt(I2)+' A, '+SVH.fmt(Rs)+' Ω) → R₃ 병합 → R = '+SVH.fmt(Rp)+' Ω',
        '다시 테브난 ('+SVH.fmt(V2)+' V, '+SVH.fmt(Rp)+' Ω) → I_L = '+SVH.fmt(IL)+' A' ] }; },
    hints:['변환↔병합의 리듬을 몸에 붙이는 문제.'] },
  { id:'u4-l3-12', level:3, type:'num', tags:['중첩과 전력'], src:'기출 유형',
    params:{ V1:{choices:[6,12],unit:'V'}, V2:{choices:[6,12],unit:'V'}, R1:{min:2,max:4,step:2,unit:'Ω'}, R2:{min:2,max:4,step:2,unit:'Ω'}, RL:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return '두 전압원이 각각 R₁·R₂를 거쳐 부하 R_L='+p.RL+' Ω에 연결(별 모양, 접지 공유). 중첩으로 부하 전류 성분 i′·i″을 구하고, "전력은 (i′)²R+(i″)²R의 합이 아님"을 실제 수치로 보여라. (a) i′ (b) i″ (c) 참 전력 (d) 잘못 더한 값.'; },
    solve:function(p){
      var i1=p.V1*1/(p.R1+SVH.par(p.R2,p.RL))*(SVH.par(p.R2,p.RL)/p.RL);
      // V1만: 전류 분배까지 정확히
      var Rp1=SVH.par(p.R2,p.RL), it1=p.V1/(p.R1+Rp1), ip1=it1*p.R2/(p.R2+p.RL);
      var Rp2=SVH.par(p.R1,p.RL), it2=p.V2/(p.R2+Rp2), ip2=it2*p.R1/(p.R1+p.RL);
      var i=ip1+ip2, P=i*i*p.RL, Pwrong=ip1*ip1*p.RL+ip2*ip2*p.RL;
      return { ans:{i1:ip1, i2:ip2, P:P, Pw:Pwrong}, unit:{i1:'A', i2:'A', P:'W', Pw:'W'}, steps:[
        'V₁만: i′ = '+SVH.fmt(ip1)+' A · V₂만: i″ = '+SVH.fmt(ip2)+' A',
        '참 전력 = (i′+i″)²R_L = '+SVH.fmt(P)+' W',
        '(i′)²R+(i″)²R = '+SVH.fmt(Pwrong)+' W ≠ 참값 — 교차항 2i′i″R_L이 빠졌기 때문',
        '결론: 전류·전압은 중첩 가능, 전력은 불가(비선형) — 기출 개념 문항 단골' ] }; },
    hints:['전력은 제곱이라 교차항이 생긴다.'] },
  { id:'u4-l3-13', level:3, type:'num', tags:['비선형 부하+테브난'], src:'창작 문제(검산됨)',
    params:{ VT:{choices:[6,9],unit:'V'}, RT:{choices:[1,2],unit:'kΩ'}, k:{choices:[0.5,1],unit:'mA/V²'} },
    statement:function(p){ return '테브난 등가(V_T='+p.VT+' V, R_T='+p.RT+' kΩ)에 비선형 소자 \\(i='+p.k+'v^2\\) [mA, V]가 연결됐다. 소자 전압(동작점)을 구하라.'; },
    solve:function(p){
      var a=p.RT*p.k, b=1, c=-p.VT;
      var v=(-b+Math.sqrt(b*b-4*a*c))/(2*a);
      return { ans:v, unit:'V', steps:[
        '부하선: \\(V_T = R_T i + v = '+SVH.fmt(a)+'v^2+v\\)',
        '양의 근: v = '+SVH.fmt(v)+' V (i = '+SVH.fmt(p.k*v*v)+' mA)',
        '(테브난의 진짜 위력: 비선형 부하도 "직선 하나 vs 특성곡선"으로 단순화된다)' ] }; },
    hints:['테브난 후 KVL = 이차방정식.'] },
  { id:'u4-l3-14', level:3, type:'num', tags:['전달 전력표'], src:'창작 문제(검산됨)',
    params:{ VT:{choices:[12,20],unit:'V'}, RT:{choices:[4,6],unit:'Ω'} },
    statement:function(p){ return 'V_T='+p.VT+' V, R_T='+p.RT+' Ω에서 R_L = R_T/2, R_T, 2R_T 세 경우의 부하 전력을 구해 정합이 최대임을 확인하라.'; },
    solve:function(p){
      function P(RL){ var i=p.VT/(p.RT+RL); return i*i*RL; }

  { id:'u4-l4-06', level:4, type:'num', tags:['2부하 측정 테브난'], src:'기출 유형',

    hints:['1 A를 넣고 단자 전압을 계산.','음수가 나와도 당황하지 말 것 — 해석이 있다.'] },
  { id:'u4-l4-08', level:4, type:'num', tags:['전압 변동률 설계'], src:'기출 유형',
    params:{ VT:{choices:[12,24],unit:'V'}, RT:{choices:[0.5,1],unit:'Ω'}, RLmin:{choices:[5,10],unit:'Ω'} },

    hints:['변동률 정의식 그대로.','좋은 전원 = 작은 R_T.'] },
  ]
});

      return { ans:w0, unit:'rad/s', steps:[
        'ω₀ = 1/√(LC) = 1/√('+SVH.fmt(p.L/1000)+'×'+SVH.fmt(p.C*1e-6)+')',
        '= '+SVH.fmt(w0)+' rad/s (이때 X_L=X_C — U7 필터의 기준점)' ] }; },
    hints:['단위 변환부터 (mH·µF).'] },
  { id:'u5-l2-12', level:2, type:'num', tags:['DC 정상상태'], src:'기출 유형',
    params:{ Vs:{min:10,max:20,step:5,unit:'V'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:4,max:12,step:4,unit:'Ω'} },
    statement:function(p){ return 'DC '+p.Vs+' V 전원 → R₁='+p.R1+' Ω → (C ∥ R₂='+p.R2+' Ω) 회로가 정상상태다. (a) C의 전압 (b) C의 전류를 구하라.'; },
    solve:function(p){ var v=p.Vs*p.R2/(p.R1+p.R2);
      return { ans:{vC:v, iC:0}, unit:{vC:'V', iC:'A'}, steps:[
        '정상상태 C = 개방 → R₁·R₂ 분압만 남는다',
        'v_C = '+p.Vs+'×'+p.R2+'/'+(p.R1+p.R2)+' = '+SVH.fmt(v)+' V, i_C = 0 A',
        '(과도 단원에서 t<0 초기값 구하기가 정확히 이 계산)' ] }; },
    hints:['C를 지우고(개방) 그려 본다.'] },

  /* ---------- L3 (14) ---------- */
  { id:'u5-l3-01', level:3, type:'num', tags:['RL 직렬 완전 해석'], src:'기출 유형',
    params:{ Vm:{min:10,max:30,step:10,unit:'V'}, R:{min:3,max:9,step:3,unit:'Ω'}, L:{choices:[1,2,3],unit:'H'}, w:{choices:[2,3,4],unit:'rad/s'} },
    statement:function(p){ return '\\(v_s='+p.Vm+'\\cos('+p.w+'t)\\) V가 R='+p.R+' Ω, L='+p.L+' H 직렬에 걸린다. 전류의 진폭과 위상(°)을 구하라.'; },
    solve:function(p){ var X=p.w*p.L, m=p.Vm/Math.hypot(p.R,X), a=-SVH.deg(Math.atan2(X,p.R));
      return { ans:{Im:m, ph:a}, unit:{Im:'A', ph:'°'}, steps:[
        'X_L = ωL = '+SVH.fmt(X)+' Ω → Z = '+p.R+'+j'+SVH.fmt(X)+' Ω',
        '|I| = '+p.Vm+'/√('+p.R+'²+'+SVH.fmt(X)+'²) = '+SVH.fmt(m)+' A',
        '위상 = −tan⁻¹(X/R) = '+SVH.fmt(a)+'° → \\(i(t)='+SVH.fmt(m)+'\\cos('+p.w+'t'+(a>=0?'+':'−')+SVH.fmt(Math.abs(a))+'°)\\) A' ] }; },
    hints:['임피던스부터.','전류 위상은 −∠Z.'] },
  { id:'u5-l3-02', level:3, type:'num', tags:['RC 직렬 완전 해석'], src:'기출 유형',
    params:{ Vm:{min:10,max:30,step:10,unit:'V'}, R:{min:4,max:12,step:4,unit:'Ω'}, Xc:{min:3,max:9,step:3,unit:'Ω'} },
    statement:function(p){ return '전압 '+p.Vm+'∠0° V, R='+p.R+' Ω와 용량성 리액턴스 X_C='+p.Xc+' Ω 직렬 회로에서 축전기 양단 전압 페이저(크기·각)를 구하라.'; },
    solve:function(p){
      var Z=Math.hypot(p.R,p.Xc), Im=p.Vm/Z, phI=SVH.deg(Math.atan2(p.Xc,p.R));
      var Vc=Im*p.Xc, phVc=phI-90;
      return { ans:{Vc:Vc, ph:phVc}, unit:{Vc:'V', ph:'°'}, steps:[
        'Z = '+p.R+'−j'+p.Xc+' → |Z|='+SVH.fmt(Z)+' Ω, ∠Z=−'+SVH.fmt(phI)+'°',
        'I = '+SVH.fmt(Im)+'∠'+SVH.fmt(phI)+'° A (전류 앞섬)',
        'V_C = I·(−jX_C) = '+SVH.fmt(Vc)+'∠'+SVH.fmt(phVc)+'° V (전류보다 90° 뒤)' ] }; },
    hints:['V_C = I × Z_C — 크기 곱, 각 −90°.'] },
  { id:'u5-l3-03', level:3, type:'num', tags:['페이저 분압'], src:'기출 유형',
    params:{ Vm:{choices:[20,25,30],unit:'V'}, R:{min:6,max:12,step:3,unit:'Ω'}, X:{min:6,max:12,step:3,unit:'Ω'} },
    statement:function(p){ return '기출 3번 축소형: '+p.Vm+'∠0° V → R='+p.R+' Ω 직렬 → L(X_L='+p.X+' Ω). 인덕터 전압 페이저(크기·각)를 분압으로 구하라.'; },
    solve:function(p){
      var Zm=Math.hypot(p.R,p.X), phZ=SVH.deg(Math.atan2(p.X,p.R));
      var Vl=p.Vm*p.X/Zm, ph=90-phZ;
      return { ans:{VL:Vl, ph:ph}, unit:{VL:'V', ph:'°'}, steps:[
        '분압(페이저): \\(\\mathbf{V}_L=\\mathbf{V}\\dfrac{jX_L}{R+jX_L}\\)',
        '크기 = '+p.Vm+'×'+p.X+'/'+SVH.fmt(Zm)+' = '+SVH.fmt(Vl)+' V',
        '각 = 90° − '+SVH.fmt(phZ)+'° = '+SVH.fmt(ph)+'°' ] }; },
    hints:['분압 공식은 페이저에서도 그대로 — 복소수로만.'] },
  { id:'u5-l3-04', level:3, type:'num', tags:['병렬 어드미턴스'], src:'창작 문제(검산됨)',
    params:{ R:{min:4,max:10,step:2,unit:'Ω'}, X:{min:4,max:10,step:2,unit:'Ω'}, Vm:{min:12,max:24,step:6,unit:'V'} },
    statement:function(p){ return '전압원 '+p.Vm+'∠0° V에 R='+p.R+' Ω와 L(X_L='+p.X+' Ω)이 병렬이다. 전원 전류의 크기와 각을 구하라.'; },
    solve:function(p){
      var Ir=p.Vm/p.R, Il=p.Vm/p.X; // Il은 -90°
      var m=Math.hypot(Ir,Il), a=-SVH.deg(Math.atan2(Il,Ir));
      return { ans:{mag:m, ang:a}, unit:{mag:'A', ang:'°'}, steps:[
        '가지별: I_R = '+SVH.fmt(Ir)+'∠0°, I_L = '+SVH.fmt(Il)+'∠−90°',
        '합(직각): |I| = √('+SVH.fmt(Ir)+'²+'+SVH.fmt(Il)+'²) = '+SVH.fmt(m)+' A',
        '각 = −tan⁻¹('+SVH.fmt(Il)+'/'+SVH.fmt(Ir)+') = '+SVH.fmt(a)+'°' ] }; },
    hints:['병렬은 가지 전류를 페이저로 더한다.'] },
  { id:'u5-l3-05', level:3, type:'num', tags:['정현파 합성'], src:'창작 문제(검산됨)',
    params:{ A:{min:3,max:9,step:3}, B:{min:4,max:12,step:4} },
    statement:function(p){ return '\\(v(t)='+p.A+'\\cos\\omega t + '+p.B+'\\sin\\omega t\\) 를 \\(V_m\\cos(\\omega t-\\phi)\\) 꼴로 바꿔 \\(V_m\\)과 \\(\\phi\\)(°)를 구하라.'; },
    solve:function(p){ var m=Math.hypot(p.A,p.B), ph=SVH.deg(Math.atan2(p.B,p.A));
      return { ans:{Vm:m, ph:ph}, unit:{Vm:'', ph:'°'}, steps:[
        'sin = −90° cos → 페이저: '+p.A+'∠0° + '+p.B+'∠−90° = '+p.A+' − j'+p.B,
        'V_m = √('+p.A+'²+'+p.B+'²) = '+SVH.fmt(m)+', φ = tan⁻¹('+p.B+'/'+p.A+') = '+SVH.fmt(ph)+'°',
        '검토: t=0 값 '+p.A+' = V_m cos(−φ) = '+SVH.fmt(m*Math.cos(SVH.rad(-ph)))+' ✓' ] }; },
    hints:['sinωt = cos(ωt−90°).','페이저 덧셈으로.'] },
  { id:'u5-l3-06', level:3, type:'num', tags:['RLC 직렬'], src:'기출 유형',
    params:{ R:{min:3,max:9,step:3,unit:'Ω'}, XL:{min:5,max:15,step:5,unit:'Ω'}, XC:{min:2,max:12,step:2,unit:'Ω'}, Vm:{min:10,max:30,step:10,unit:'V'} },
    constraint:function(p){ return p.XL!==p.XC; },
    statement:function(p){ return 'R='+p.R+' Ω, X_L='+p.XL+' Ω, X_C='+p.XC+' Ω 직렬에 '+p.Vm+'∠0° V. (a) 합성 임피던스 크기·각 (b) 회로가 유도성인지 용량성인지 판정하라. (유도성=1, 용량성=−1로 답)'; },
    solve:function(p){
      var X=p.XL-p.XC, m=Math.hypot(p.R,X), a=SVH.deg(Math.atan2(X,p.R));
      return { ans:{mag:m, ang:a, type:X>0?1:-1}, unit:{mag:'Ω', ang:'°', type:''}, steps:[
        '순 리액턴스 X = X_L − X_C = '+SVH.fmt(X)+' Ω',
        '|Z| = √(R²+X²) = '+SVH.fmt(m)+' Ω, ∠Z = '+SVH.fmt(a)+'°',
        (X>0?'X>0 → 유도성(전류 뒤짐)':'X<0 → 용량성(전류 앞섬)') ] }; },
    hints:['리액턴스는 부호를 갖고 합쳐진다.'] },
  { id:'u5-l3-07', level:3, type:'num', tags:['에너지 시간함수'], src:'창작 문제(검산됨)',
    params:{ L:{choices:[0.5,1,2],unit:'H'}, Im:{min:2,max:6,step:2,unit:'A'}, w:{choices:[2,4],unit:'rad/s'} },
    statement:function(p){ return 'L='+p.L+' H에 \\(i(t)='+p.Im+'\\cos('+p.w+'t)\\) A가 흐른다. (a) 최대 저장 에너지 (b) 에너지가 최대→0으로 가는 데 걸리는 시간을 구하라.'; },
    solve:function(p){
      var Emax=0.5*p.L*p.Im*p.Im, T4=(Math.PI/2)/p.w;
      return { ans:{Emax:Emax, t:T4}, unit:{Emax:'J', t:'s'}, steps:[
        'w(t)=½Li² — 최대는 |i|=I_m일 때: '+SVH.fmt(Emax)+' J',
        'i가 최대→0: cos이 1→0, 즉 ¼주기 = (π/2)/ω = '+SVH.fmt(T4)+' s',
        '(에너지는 전원↔인덕터를 주기의 절반마다 왕복한다)' ] }; },
    hints:['에너지는 i²을 따라간다.','cos 1→0은 ωt=π/2.'] },
  { id:'u5-l3-08', level:3, type:'num', tags:['C 충전 전하'], src:'창작 문제(검산됨)',
    params:{ C1:{choices:[20,40,60],unit:'µF'}, C2:{choices:[20,40,60],unit:'µF'}, Vs:{min:10,max:30,step:10,unit:'V'} },
    statement:function(p){ return 'C₁='+p.C1+' µF와 C₂='+p.C2+' µF가 직렬로 '+p.Vs+' V 전원에 연결되어 정상상태다. (a) 공통 전하 q (b) 각 축전기 전압을 구하라.'; },
    solve:function(p){
      var Ceq=p.C1*p.C2/(p.C1+p.C2), q=Ceq*1e-6*p.Vs*1e6; // µC
      var v1=q/p.C1, v2=q/p.C2;
      return { ans:{q:q, v1:v1, v2:v2}, unit:{q:'µC', v1:'V', v2:'V'}, steps:[
        '직렬 = 같은 전하: C_eq = '+SVH.fmt(Ceq)+' µF → q = C_eqV = '+SVH.fmt(q)+' µC',
        'v₁ = q/C₁ = '+SVH.fmt(v1)+' V, v₂ = q/C₂ = '+SVH.fmt(v2)+' V',
        '검토: v₁+v₂ = '+SVH.fmt(v1+v2)+' = V_s ✓ (작은 C에 큰 전압!)' ] }; },
    hints:['직렬 C는 전하가 공통.','전압은 C에 반비례 분배.'] },
  { id:'u5-l3-09', level:3, type:'num', tags:['L 합성·전류 분배'], src:'창작 문제(검산됨)',
    params:{ L1:{choices:[20,40,60],unit:'mH'}, L2:{choices:[30,60,120],unit:'mH'} },
    statement:function(p){ return 'L₁='+p.L1+' mH ∥ L₂='+p.L2+' mH의 (a) 합성 인덕턴스 (b) 총 전류의 몇 %가 L₁로 흐르는가? (자속 결합 없음, AC 정상상태)'; },
    solve:function(p){
      var Leq=p.L1*p.L2/(p.L1+p.L2), pct=p.L2/(p.L1+p.L2)*100;
      return { ans:{Leq:Leq, pct:pct}, unit:{Leq:'mH', pct:'%'}, steps:[
        'L 병렬은 R과 같은 규칙: L_eq = '+SVH.fmt(Leq)+' mH',
        '전류 분배도 저항처럼(리액턴스 ∝ L): L₁ 몫 = L₂/(L₁+L₂) = '+SVH.fmt(pct)+' %' ] }; },
    hints:['L은 R과 같은 합성 규칙(C만 반대).'] },
  { id:'u5-l3-10', level:3, type:'num', tags:['주파수에 따른 거동'], src:'창작 문제(검산됨)',
    params:{ R:{min:10,max:50,step:10,unit:'Ω'}, C:{choices:[100,200,500],unit:'µF'}, k:{choices:[0.5,2,5]} },
    statement:function(p){ return 'R='+p.R+' Ω, C='+p.C+' µF 직렬 회로에서 ω = '+p.k+'/(RC)일 때 |Z|를 R의 배수로 구하라. (|Z|/R)'; },
    solve:function(p){
      var ratio=Math.sqrt(1+1/(p.k*p.k));
      return { ans:ratio, unit:'', steps:[
        'X_C = 1/(ωC) = RC/(kC)·(1/R)⁻¹... 정리하면 X_C = R/k',
        '|Z|/R = √(1+(X_C/R)²) = √(1+1/'+p.k+'²) = '+SVH.fmt(ratio),
        '(ω가 커질수록(k↑) C가 투명해져 |Z|→R — U7 고역통과의 물리)' ] }; },
    hints:['ω=k/RC를 X_C에 대입해 R로 정규화.'] },
  { id:'u5-l3-11', level:3, type:'num', tags:['페이저 KCL'], src:'창작 문제(검산됨)',
    params:{ I1:{min:2,max:6,step:2,unit:'A'}, I2:{min:2,max:6,step:2,unit:'A'} },
    statement:function(p){ return '절점에 \\(i_1='+p.I1+'\\cos\\omega t\\) A가 들어오고 \\(i_2='+p.I2+'\\sin\\omega t\\) A가 나간다. 세 번째 가지로 나가는 전류의 진폭과 위상(°)을 구하라.'; },
    solve:function(p){
      var m=Math.hypot(p.I1,p.I2), a=SVH.deg(Math.atan2(-(-p.I2),p.I1)); // I3 = I1 - I2∠-90 = I1 + jI2
      return { ans:{Im:m, ph:a}, unit:{Im:'A', ph:'°'}, steps:[
        '페이저: I₁ = '+p.I1+'∠0°, I₂ = '+p.I2+'∠−90°',
        'KCL: I₃ = I₁ − I₂ = '+p.I1+' + j'+p.I2,
        '|I₃| = '+SVH.fmt(m)+' A, ∠ = '+SVH.fmt(a)+'° → \\(i_3='+SVH.fmt(m)+'\\cos(\\omega t+'+SVH.fmt(a)+'°)\\)' ] }; },
    hints:['KCL은 페이저에서도 성립.','−(∠−90°) = +j.'] },
  { id:'u5-l3-12', level:3, type:'num', tags:['C 그래프 해석'], src:'창작 문제(검산됨)',
    params:{ C:{choices:[2,5,10],unit:'µF'}, V1:{min:4,max:10,step:2,unit:'V'}, t1:{choices:[2,4],unit:'ms'} },
    statement:function(p){ return p.C+' µF 축전기 전압이 0에서 '+p.V1+' V까지 '+p.t1+' ms 동안 선형 증가 후 일정하다. (a) 증가 구간 전류 (b) 일정 구간 전류 (c) 최종 저장 에너지를 구하라.'; },
    solve:function(p){
      var i=p.C*1e-6*p.V1/(p.t1/1000)*1000, E=0.5*p.C*1e-6*p.V1*p.V1*1e6;
      return { ans:{i:i, i2:0, E:E}, unit:{i:'mA', i2:'mA', E:'µJ'}, steps:[
        '증가 구간: i = C·dv/dt = '+p.C+'µ × '+SVH.fmt(p.V1/(p.t1/1000))+' V/s = '+SVH.fmt(i)+' mA',
        '일정 구간: dv/dt=0 → i = 0',
        'E = ½CV² = '+SVH.fmt(E)+' µJ' ] }; },
    hints:['구간별 기울기만 보면 된다.'] },
  { id:'u5-l3-13', level:3, type:'num', tags:['위상차 측정'], src:'창작 문제(검산됨)',
    params:{ f:{choices:[50,100,200],unit:'Hz'}, dt:{choices:[0.5,1,2],unit:'ms'} },
    constraint:function(p){ return p.dt/1000 < 1/(2*p.f); },
    statement:function(p){ return '오실로스코프에서 '+p.f+' Hz 정현파 두 개의 마루가 '+p.dt+' ms 어긋나 있다. 위상차는 몇 °인가?'; },
    solve:function(p){ var ph=360*p.f*p.dt/1000;
      return { ans:ph, unit:'°', steps:[
        '한 주기 T = '+SVH.fmt(1000/p.f)+' ms = 360°',
        'Δφ = 360°×Δt/T = 360×'+p.f+'×'+SVH.fmt(p.dt/1000)+' = '+SVH.fmt(ph)+'°',
        '(실험 2 오실로스코프 측정의 표준 계산)' ] }; },
    hints:['시간차/주기 × 360°.'] },
  { id:'u5-l3-14', level:3, type:'num', tags:['복소 연산 종합'], src:'창작 문제(검산됨)',
    params:{ R1:{min:2,max:6,step:2,unit:'Ω'}, X1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'}, X2:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return '\\(Z_1='+p.R1+'+j'+p.X1+'\\) Ω(RL)과 \\(Z_2='+p.R2+'-j'+p.X2+'\\) Ω(RC)의 병렬 합성 임피던스 크기와 각을 구하라.'; },
    solve:function(p){
      var Z1=SVH.cx(p.R1,p.X1), Z2=SVH.cx(p.R2,-p.X2);
      var Zp=SVH.cpar(Z1,Z2);
      return { ans:{mag:SVH.cmag(Zp), ang:SVH.cang(Zp)}, unit:{mag:'Ω', ang:'°'}, steps:[
        '곱: Z₁Z₂ = '+SVH.fmt(SVH.cmul(Z1,Z2).re)+'+j'+SVH.fmt(SVH.cmul(Z1,Z2).im),
        '합: Z₁+Z₂ = '+(p.R1+p.R2)+'+j'+(p.X1-p.X2),
        'Z_p = 곱/합 → |Z| = '+SVH.fmt(SVH.cmag(Zp))+' Ω, ∠ = '+SVH.fmt(SVH.cang(Zp))+'°' ] }; },
    hints:['병렬 = 곱/합, 복소수로 그대로.','유도성과 용량성이 일부 상쇄된다.'] },

  /* ---------- L4 (8) ---------- */
  { id:'u5-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'옳은 것을 모두 고르면?<br>㉠ DC 정상상태에서 인덕터의 전압은 0이다<br>㉡ 축전기 전류는 스위칭 순간 불연속일 수 있다<br>㉢ 서로 다른 주파수의 두 페이저는 직접 더할 수 있다<br>㉣ 직렬 RLC에서 X_L=X_C이면 임피던스는 순저항 R이 된다',
    choices:['㉠㉡㉣','㉠㉢㉣','㉡㉢','전부'],
    answer:0, expl:'페이저는 같은 ω끼리만(㉢ ✗). 공진(㉣)에서 리액턴스 상쇄 → |Z| 최소 = R.' },
  { id:'u5-l4-02', level:4, type:'num', tags:['기출 3번 재현'], src:'기출 유형',
    params:{ Vm:{choices:[20,25,30],unit:'V'}, R:{choices:[12],unit:'Ω'}, L1:{choices:[3,6],unit:'H'}, R2:{choices:[6],unit:'Ω'}, w:{choices:[2],unit:'rad/s'} },
    statement:function(p){ return '기출 3번 구조: \\(V='+p.Vm+'\\angle 0°\\) V, ω='+p.w+' rad/s. 직렬 R='+p.R+' Ω·L='+p.L1+' H 다음에 R₂='+p.R2+' Ω가 병렬로 매달린 구조에서 R₂ 양단 전압 \\(V_2\\)의 크기·각을 구하고 시간영역으로 써라. (t=0 값으로 검증)'; },
    solve:function(p){
      var ZL=SVH.cx(0,p.w*p.L1);
      var Zser=SVH.cx(p.R,p.w*p.L1);
      var Z2=SVH.cx(p.R2,0);
      // V2 = V * Z2/(Zser+Z2)
      var V=SVH.cx(p.Vm,0);
      var V2=SVH.cmul(V, SVH.cdiv(Z2, SVH.cadd(Zser,Z2)));
      var m=SVH.cmag(V2), a=SVH.cang(V2);
      return { ans:{V2:m, ph:a, v0:m*Math.cos(SVH.rad(a))}, unit:{V2:'V', ph:'°', v0:'V'}, steps:[
        'Z_직렬 = '+p.R+'+j'+SVH.fmt(p.w*p.L1)+' Ω, 분압: \\(V_2=V\\dfrac{R_2}{R+j\\omega L+R_2}\\)',
        '분모 = '+(p.R+p.R2)+'+j'+SVH.fmt(p.w*p.L1)+' → |V₂| = '+SVH.fmt(m)+' V, ∠ = '+SVH.fmt(a)+'°',
        '\\(v_2(t)='+SVH.fmt(m)+'\\cos('+p.w+'t'+(a>=0?'+':'−')+SVH.fmt(Math.abs(a))+'°)\\) V',
        't=0 검증: v₂(0) = '+SVH.fmt(m*Math.cos(SVH.rad(a)))+' V' ] }; },
    hints:['병렬 저항까지 분압 한 방으로.','시간영역 복원까지가 만점 조건(기출 채점 기준).'] },
  { id:'u5-l4-03', level:4, type:'num', tags:['기말 P1형 2단 회로'], src:'기출 유형',
    params:{ Im:{choices:[4,6],unit:'A'}, w:{choices:[2],unit:'rad/s'}, R:{choices:[5,10],unit:'Ω'}, L:{choices:[0.5,1],unit:'H'}, C:{choices:[0.1,0.5],unit:'F'} },
    statement:function(p){ return '전류원 \\('+p.Im+'\\cos('+p.w+'t)\\) A가 [L='+p.L+' H 직렬 R='+p.R+' Ω] ∥ [C='+p.C+' F] 에 연결되어 있다. 저항 R에 흐르는 전류의 진폭·위상을 구하라. (기말 P1 유형)'; },
    solve:function(p){
      var ZRL=SVH.cx(p.R,p.w*p.L);
      var ZC=SVH.cx(0,-1/(p.w*p.C));
      // 분류: I_RL = I * ZC/(ZRL+ZC)
      var I=SVH.cx(p.Im,0);
      var IRL=SVH.cmul(I, SVH.cdiv(ZC, SVH.cadd(ZRL,ZC)));
      return { ans:{Im:SVH.cmag(IRL), ph:SVH.cang(IRL)}, unit:{Im:'A', ph:'°'}, steps:[
        'Z_RL = '+p.R+'+j'+SVH.fmt(p.w*p.L)+' Ω, Z_C = −j'+SVH.fmt(1/(p.w*p.C))+' Ω',
        '전류 분배(반대편 임피던스): \\(I_{RL}=I\\dfrac{Z_C}{Z_{RL}+Z_C}\\)',
        '|I_RL| = '+SVH.fmt(SVH.cmag(IRL))+' A, ∠ = '+SVH.fmt(SVH.cang(IRL))+'°' ] }; },
    hints:['분류 법칙도 복소수 그대로.','분모의 리액턴스 상쇄에 주의.'] },
  { id:'u5-l4-04', level:4, type:'num', tags:['미지 소자 판별'], src:'기출 유형',
    params:{ Vm:{choices:[10,20],unit:'V'}, Im:{choices:[2,4],unit:'A'}, ph:{choices:[-60,-45,-30]} },
    statement:function(p){ return '블랙박스에 \\(v='+p.Vm+'\\cos(100t)\\) V를 걸었더니 \\(i='+p.Im+'\\cos(100t'+p.ph+'°)\\) A가 흘렀다. 박스를 R+L 직렬로 모델링할 때 R과 L을 구하라.'; },
    solve:function(p){
      var Zm=p.Vm/p.Im, R=Zm*Math.cos(SVH.rad(-p.ph)), X=Zm*Math.sin(SVH.rad(-p.ph)), L=X/100;
      return { ans:{R:R, L:L*1000}, unit:{R:'Ω', L:'mH'}, steps:[
        '|Z| = V_m/I_m = '+SVH.fmt(Zm)+' Ω, ∠Z = −(전류 위상) = '+(-p.ph)+'°',
        'R = |Z|cos∠ = '+SVH.fmt(R)+' Ω, X_L = |Z|sin∠ = '+SVH.fmt(X)+' Ω',
        'L = X_L/ω = '+SVH.fmt(L*1000)+' mH — 전류가 뒤지므로(음의 위상) 유도성 판정과 일치' ] }; },
    hints:['임피던스의 크기와 각을 측정치에서 역산.','∠Z = 전압 위상 − 전류 위상.'] },
  { id:'u5-l4-05', level:4, type:'derive', tags:['유도'], src:'교재 표준',
    statement:'축전기의 v–i 관계 \\(i=C\\,dv/dt\\)에서 출발해 임피던스 \\(Z_C=1/(j\\omega C)\\)를 유도하고, 극한으로 물리적 의미를 검증하라.',
    steps:[
      '정상상태 가정: \\(v(t)=V_m e^{j\\omega t}\\) (복소 지수 표기 — 실제 신호는 실수부) [왜] 미분을 곱셈으로 바꾸기 위해',
      '대입: \\(i=C\\dfrac{d}{dt}(V_m e^{j\\omega t}) = j\\omega C\\,V_m e^{j\\omega t}\\) — 미분이 \\(j\\omega\\) 곱으로',
      '임피던스 정의 \\(Z=\\mathbf{V}/\\mathbf{I}\\): \\(Z_C=\\dfrac{V_m}{j\\omega C V_m}=\\dfrac{1}{j\\omega C}=-\\dfrac{j}{\\omega C}\\)',
      '각도 해석: −90° → 축전기 전압은 전류보다 90° 뒤진다(전류가 먼저 흘러 들어가야 전압이 쌓인다)',
      '극한 체크: ω→0 ⇒ |Z_C|→∞ (DC 개방 ✓), ω→∞ ⇒ 0 (고주파 단락 ✓) · 차원: 1/[(1/s)(C/V)] = V·s/C = Ω ✓'
    ],
    hints:['e^{jωt}를 넣으면 d/dt가 jω로.','유도 후 ω 극한 2개로 DC 규칙을 회수해 본다.'],
    expl:'기말 P4(임피던스로 H(ω) 유도)의 출발점. L도 같은 방법으로 Z_L=jωL.' },
  { id:'u5-l4-06', level:4, type:'num', tags:['공진 설계'], src:'창작 문제(검산됨)',
    params:{ f0:{choices:[1,5,10],unit:'kHz'}, L:{choices:[10,40],unit:'mH'}, R:{choices:[10,20],unit:'Ω'} },
    statement:function(p){ return '직렬 RLC를 f₀='+p.f0+' kHz에서 공진시키려 한다. L='+p.L+' mH일 때 (a) 필요한 C(µF) (b) 공진에서 전류가 최대가 되는 이유를 반영한, '+p.R+' Ω·V_m=10 V 기준 공진 전류 진폭을 구하라.'; },
    solve:function(p){
      var w0=2*Math.PI*p.f0*1000, C=1/(w0*w0*p.L/1000)*1e6, I=10/p.R;
      return { ans:{C:C, I:I}, unit:{C:'µF', I:'A'}, steps:[
        'ω₀ = 2πf₀ = '+SVH.fmt(w0)+' rad/s, 공진 조건 ω₀²=1/LC',
        'C = 1/(ω₀²L) = '+SVH.fmt(C)+' µF',
        '공진에서 X_L=X_C 상쇄 → Z=R → I_max = V/R = '+SVH.fmt(I)+' A' ] }; },
    hints:['공진 조건에서 C를 역산.','공진 = 리액턴스 소멸.'] },
  { id:'u5-l4-07', level:4, type:'num', tags:['3소자 종합'], src:'기출 유형',
    params:{ Vm:{choices:[10,20],unit:'V'}, R:{choices:[4,8],unit:'Ω'}, XL:{choices:[6,10],unit:'Ω'}, XC:{choices:[3,6],unit:'Ω'} },
    constraint:function(p){ return p.XL!==p.XC; }, /* 병렬 LC 공진(Z→∞) 배제 */
    statement:function(p){ return p.Vm+'∠0° V가 R='+p.R+' Ω 직렬 후 [L(X_L='+p.XL+' Ω) ∥ C(X_C='+p.XC+' Ω)]에 연결. 병렬부 양단 전압의 크기·각을 구하라.'; },
    solve:function(p){
      var ZL=SVH.cx(0,p.XL), ZC=SVH.cx(0,-p.XC);
      var Zp=SVH.cpar(ZL,ZC);
      var V=SVH.cx(p.Vm,0);
      var Vp=SVH.cmul(V, SVH.cdiv(Zp, SVH.cadd(SVH.cx(p.R,0),Zp)));
      return { ans:{V:SVH.cmag(Vp), ph:SVH.cang(Vp)}, unit:{V:'V', ph:'°'}, steps:[
        'L∥C: \\(Z_p=\\dfrac{(jX_L)(-jX_C)}{j(X_L-X_C)}\\) = '+SVH.fmt(SVH.cmag(Zp))+'∠'+SVH.fmt(SVH.cang(Zp))+'° Ω (순수 리액턴스)',
        '분압: V_p = V·Z_p/(R+Z_p)',
        '|V_p| = '+SVH.fmt(SVH.cmag(Vp))+' V, ∠ = '+SVH.fmt(SVH.cang(Vp))+'°' ] }; },
    hints:['L∥C는 순허수 — 부호가 어느 쪽 우세인지 먼저.','그 다음은 평범한 분압.'] },
  { id:'u5-l4-08', level:4, type:'num', tags:['오실로스코프 역산'], src:'기출 유형',
    params:{ Vm:{choices:[8,12],unit:'V'}, f:{choices:[100,200],unit:'Hz'}, R:{choices:[100,200],unit:'Ω'}, ph:{choices:[30,45,60]} },
    statement:function(p){ return '실험: 함수발생기('+p.Vm+' V 진폭, '+p.f+' Hz)를 R='+p.R+' Ω와 미지 축전기 직렬에 연결했더니 전류(R 전압으로 측정)가 전압보다 '+p.ph+'° 앞섰다. C를 µF로 구하라.'; },
    solve:function(p){
      var Xc=p.R*Math.tan(SVH.rad(p.ph));
      var C=1/(2*Math.PI*p.f*Xc)*1e6;
      return { ans:C, unit:'µF', steps:[
        '전류 앞섬 '+p.ph+'° → ∠Z = −'+p.ph+'° → tan'+p.ph+'° = X_C/R',
        'X_C = R·tan'+p.ph+'° = '+SVH.fmt(Xc)+' Ω',
        'C = 1/(2πf·X_C) = '+SVH.fmt(C)+' µF (실험 2에서 C 측정하는 실제 절차)' ] }; },
    hints:['위상각에서 X_C/R를 얻는다.','X_C에서 C 역산.'] }
  ]
});

SV_BANK.push({

  { id:'u6-l1-03', level:1, type:'mc', tags:['τ의 R'], src:'기출 유형',

  { id:'u6-l1-04', level:1, type:'tf', tags:['완전응답'], src:'교재 표준',

  { id:'u6-l1-06', level:1, type:'tf', tags:['실험'], src:'기출 유형',

    answer:true, expl:'기말 P3(a)의 서술형 그대로 — 계측기 저항이 R_eq에 병렬/직렬로 끼어들어 τ를 바꾼다는 논리까지 쓸 수 있어야 한다.' },

  /* ---------- L2 (12) ---------- */
  { id:'u6-l2-01', level:2, type:'num', tags:['τ 계산'], src:'창작 문제(검산됨)',

  { id:'u6-l2-02', level:2, type:'num', tags:['τ 계산 RL'], src:'창작 문제(검산됨)',

  { id:'u6-l2-03', level:2, type:'num', tags:['방전 평가'], src:'창작 문제(검산됨)',

      return { ans:t, unit:'ms', steps:[
        '1−e^{−t/τ} = '+(p.pct/100)+' → e^{−t/τ} = '+SVH.fmt(1-p.pct/100),
        't = −τ ln('+SVH.fmt(1-p.pct/100)+') = '+SVH.fmt(t)+' ms',
        (p.pct===50?'(50% 도달 = τ·ln2 ≈ 0.693τ — 반감기 공식)':'') ] }; },
    hints:['식을 t에 대해 풀어 ln.'] },
  { id:'u6-l2-06', level:2, type:'num', tags:['초기·최종'], src:'기출 유형',
    params:{ Vs:{min:10,max:20,step:5,unit:'V'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:4,max:12,step:4,unit:'Ω'} },
    statement:function(p){ return 't<0에서 스위치가 오래 닫혀 있던 회로: '+p.Vs+' V → R₁='+p.R1+' Ω → (C ∥ R₂='+p.R2+' Ω). t=0에 전원 쪽 스위치가 열린다. (a) v_C(0⁺) (b) v_C(∞)를 구하라.'; },
    solve:function(p){ var v0=p.Vs*p.R2/(p.R1+p.R2);
      return { ans:{v0:v0, vinf:0}, unit:{v0:'V', vinf:'V'}, steps:[
        't<0 정상상태(C 개방): v_C(0⁻) = 분압 '+SVH.fmt(v0)+' V = v_C(0⁺) (연속)',
        't→∞: 전원이 끊겨 R₂로 완전 방전 → v_C(∞) = 0 V' ] }; },
    hints:['0⁻ 회로와 ∞ 회로를 따로 그린다.'] },
  { id:'u6-l2-07', level:2, type:'num', tags:['RL 초기 전류'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:12,max:24,step:6,unit:'V'}, R:{min:4,max:12,step:4,unit:'Ω'} },
    statement:function(p){ return p.Vs+' V 전원과 R='+p.R+' Ω, L 직렬 회로에서 스위치가 오래 닫혀 있었다. (a) 그때 인덕터 전류 (b) 그 순간 인덕터에 걸린 전압을 구하라.'; },
    solve:function(p){ var i=p.Vs/p.R;
      return { ans:{iL:i, vL:0}, unit:{iL:'A', vL:'V'}, steps:[
        '정상상태 L = 단락 → i_L = V/R = '+SVH.fmt(i)+' A',
        'v_L = 0 V (단락이므로)' ] }; },
    hints:['정상상태 L은 전선.'] },
  { id:'u6-l2-08', level:2, type:'num', tags:['τ 설계'], src:'창작 문제(검산됨)',
    params:{ C:{choices:[10,47,100],unit:'µF'}, tau:{choices:[10,47,100],unit:'ms'} },
    statement:function(p){ return 'C='+p.C+' µF로 시정수 '+p.tau+' ms를 만들려면 R은 몇 kΩ이어야 하는가?'; },
    solve:function(p){ var R=p.tau/1000/(p.C*1e-6)/1000;
      return { ans:R, unit:'kΩ', steps:[
        'τ = RC를 R에 대해 풀면 R = τ/C',
        'R = '+SVH.fmt(p.tau/1000)+'/'+SVH.fmt(p.C*1e-6)+' = '+SVH.fmt(R*1000)+' Ω = '+SVH.fmt(R)+' kΩ' ] }; },
    hints:['τ=RC를 R로 푼다.'] },
  { id:'u6-l2-09', level:2, type:'num', tags:['남은 비율'], src:'창작 문제(검산됨)',
    params:{ n:{choices:[1,2,3]} },
    statement:function(p){ return '방전 회로에서 t='+p.n+'τ일 때 초기 전압의 몇 %가 남아 있는가?'; },
    solve:function(p){ var r=Math.exp(-p.n)*100;
      return { ans:r, unit:'%', steps:[
        'e^{−'+p.n+'} = '+SVH.fmt(Math.exp(-p.n)),
        '남은 비율 = '+SVH.fmt(r)+' % (1τ 36.8%, 2τ 13.5%, 3τ 5.0% — 표로 외워두면 스케치가 빨라진다)' ] }; },
    hints:['e⁻ⁿ.'] },
  { id:'u6-l2-10', level:2, type:'num', tags:['0⁺ 전류'], src:'기출 유형',
    params:{ Vs:{min:10,max:20,step:5,unit:'V'}, R:{min:2,max:10,step:2,unit:'Ω'} },
    statement:function(p){ return '방전되어 있던(0 V) 축전기를 t=0에 '+p.Vs+' V 전원+R='+p.R+' Ω에 연결했다. (a) i(0⁺) (b) i(∞)를 구하라.'; },
    solve:function(p){ var i0=p.Vs/p.R;
      return { ans:{i0:i0, iinf:0}, unit:{i0:'A', iinf:'A'}, steps:[
        '0⁺: v_C 연속=0 → C가 순간 단락처럼 → i(0⁺) = V/R = '+SVH.fmt(i0)+' A',
        '∞: C 개방 → i = 0 (전류는 점프했지만 v_C는 연속이었다는 점을 확인)' ] }; },
    hints:['0⁺에서 C는 "그 순간 전압의 전지"처럼 그린다.'] },
  { id:'u6-l2-11', level:2, type:'num', tags:['에너지 소산'], src:'창작 문제(검산됨)',
    params:{ C:{choices:[100,220,470],unit:'µF'}, V0:{min:5,max:25,step:5,unit:'V'} },
    statement:function(p){ return 'C='+p.C+' µF가 V₀='+p.V0+' V에서 저항으로 완전 방전했다. 저항에서 소산된 총 에너지는 몇 mJ이며, 저항값에 따라 달라지는가? (달라지면 1, 아니면 0)'; },
    solve:function(p){ var E=0.5*p.C*1e-6*p.V0*p.V0*1000;
      return { ans:{E:E, dep:0}, unit:{E:'mJ', dep:''}, steps:[
        '에너지 보존: 소산 = 초기 저장 = ½CV₀² = '+SVH.fmt(E)+' mJ',
        'R은 "얼마나 빨리"(τ)만 정하고 총량은 못 바꾼다 → 0' ] }; },
    hints:['적분해도 되고, 보존으로 바로 가도 된다.'] },
  { id:'u6-l2-12', level:2, type:'num', tags:['그래프 역산'], src:'기출 유형',
    params:{ V0:{choices:[10,20],unit:'V'}, t1:{choices:[5,10],unit:'ms'}, frac:{choices:[0.368,0.135]} },
    statement:function(p){ return '방전 곡선에서 전압이 '+p.V0+' V로 시작해 t='+p.t1+' ms에 '+SVH.fmt(p.V0*p.frac)+' V가 되었다. 시정수를 구하라.'; },
    solve:function(p){ var tau=-p.t1/Math.log(p.frac);
      return { ans:tau, unit:'ms', steps:[
        'e^{−t₁/τ} = '+p.frac+' → τ = −t₁/ln('+p.frac+')',
        'τ = '+SVH.fmt(tau)+' ms ('+p.frac+'≈e^{−'+SVH.fmt(-Math.log(p.frac))+'})',
        '(실험 데이터에서 τ 읽는 표준법: 36.8% 지점의 시간)' ] }; },
    hints:['36.8%가 1τ, 13.5%가 2τ.'] },

  /* ---------- L3 (14) ---------- */
  { id:'u6-l3-01', level:3, type:'num', tags:['3종 세트 풀코스'], src:'기출 유형',
    params:{ Vs:{min:12,max:24,step:6,unit:'V'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:4,max:12,step:4,unit:'Ω'}, C:{choices:[0.5,1,2],unit:'F'} },
    statement:function(p){ return 't<0: 스위치 열림, C는 0 V. t=0에 닫히며 '+p.Vs+' V → R₁='+p.R1+' Ω → (C='+p.C+' F ∥ R₂='+p.R2+' Ω). (a) v_C(∞) (b) τ (c) v_C(t) 식의 t=τ에서 값.'; },
    solve:function(p){
      var vinf=p.Vs*p.R2/(p.R1+p.R2);
      var Rt=SVH.par(p.R1,p.R2), tau=Rt*p.C;
      var vtau=vinf*(1-Math.exp(-1));
      return { ans:{vinf:vinf, tau:tau, vtau:vtau}, unit:{vinf:'V', tau:'s', vtau:'V'}, steps:[
        'v_C(∞): C 개방 → 분압 '+SVH.fmt(vinf)+' V',
        'τ: C에서 본 R_eq = R₁∥R₂ = '+SVH.fmt(Rt)+' Ω (전원 단락) → τ = '+SVH.fmt(tau)+' s',
        'v_C(t) = '+SVH.fmt(vinf)+'(1−e^{−t/'+SVH.fmt(tau)+'}) → t=τ: '+SVH.fmt(vtau)+' V (63.2%)' ] }; },
    hints:['초기 0, 최종 분압, τ는 테브난 — 3종 세트.'] },
  { id:'u6-l3-02', level:3, type:'num', tags:['방전형 3종'], src:'기출 유형',
    params:{ Vs:{min:10,max:20,step:5,unit:'V'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:4,max:12,step:4,unit:'Ω'}, C:{choices:[1,2],unit:'F'}, t1:{choices:[2,5],unit:'s'} },
    statement:function(p){ return 't<0 정상상태: '+p.Vs+' V → R₁='+p.R1+' Ω → (C='+p.C+' F ∥ R₂='+p.R2+' Ω). t=0에 전원+R₁ 가지가 분리된다. v_C(t) 식을 세우고 t='+p.t1+' s의 값을 구하라.'; },
    solve:function(p){
      var v0=p.Vs*p.R2/(p.R1+p.R2), tau=p.R2*p.C, v=v0*Math.exp(-p.t1/tau);
      return { ans:{v0:v0, tau:tau, v:v}, unit:{v0:'V', tau:'s', v:'V'}, steps:[
        'v_C(0) = 분압 '+SVH.fmt(v0)+' V',
        '분리 후 τ = R₂C = '+SVH.fmt(tau)+' s (R₁은 이제 없음!)',
        'v_C(t) = '+SVH.fmt(v0)+'e^{−t/'+SVH.fmt(tau)+'} → t='+p.t1+': '+SVH.fmt(v)+' V' ] }; },
    hints:['스위칭 전후의 회로가 다르다 — τ도 달라진다.'] },
  { id:'u6-l3-03', level:3, type:'num', tags:['RL 상승'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:12,max:24,step:6,unit:'V'}, R:{min:4,max:12,step:4,unit:'Ω'}, L:{choices:[0.2,0.5,1],unit:'H'}, t1:{choices:[50,100],unit:'ms'} },
    statement:function(p){ return 't=0에 '+p.Vs+' V 전원이 R='+p.R+' Ω, L='+p.L+' H 직렬에 연결(초기 전류 0). i(t) 식을 세우고 t='+p.t1+' ms의 전류를 구하라.'; },
    solve:function(p){
      var iinf=p.Vs/p.R, tau=p.L/p.R, i=iinf*(1-Math.exp(-p.t1/1000/tau));
      return { ans:{iinf:iinf, tau:tau*1000, i:i}, unit:{iinf:'A', tau:'ms', i:'A'}, steps:[
        'i(∞) = V/R = '+SVH.fmt(iinf)+' A, τ = L/R = '+SVH.fmt(tau*1000)+' ms',
        'i(t) = '+SVH.fmt(iinf)+'(1−e^{−t/τ})',
        't='+p.t1+' ms: i = '+SVH.fmt(i)+' A' ] }; },
    hints:['RL도 같은 3종 세트 — 변수만 i_L.'] },
  { id:'u6-l3-04', level:3, type:'num', tags:['τ만 다른 두 구간'], src:'기출 유형',
    params:{ V0:{choices:[10,20],unit:'V'}, R1:{choices:[1,2],unit:'kΩ'}, R2:{choices:[3,4],unit:'kΩ'}, C:{choices:[100,200],unit:'µF'} },
    statement:function(p){ return 'V₀='+p.V0+' V로 충전된 C='+p.C+' µF가 t=0부터 R₁='+p.R1+' kΩ로 방전하다가, 회로가 바뀌어 R₁+R₂ 직렬('+(p.R1+p.R2)+' kΩ)로 방전하게 되면 τ가 몇 배가 되는가? 또, 첫 구성에서 t=τ₁일 때 전압을 구하라.'; },
    solve:function(p){
      var ratio=(p.R1+p.R2)/p.R1, v=p.V0*Math.exp(-1);
      return { ans:{ratio:ratio, v:v}, unit:{ratio:'배', v:'V'}, steps:[
        'τ ∝ R → τ₂/τ₁ = (R₁+R₂)/R₁ = '+SVH.fmt(ratio)+'배 (느려짐)',
        't=τ₁에서 v = V₀e⁻¹ = '+SVH.fmt(v)+' V' ] }; },
    hints:['τ 비교는 R 비교다.'] },
  { id:'u6-l3-05', level:3, type:'num', tags:['일반형(0 아닌 초기·최종)'], src:'기출 유형',
    params:{ V1:{choices:[4,6],unit:'V'}, V2:{choices:[10,12],unit:'V'}, tau:{choices:[2,4],unit:'ms'}, t1:{choices:[2,4],unit:'ms'} },
    statement:function(p){ return 'v_C가 '+p.V1+' V에서 시작해 '+p.V2+' V를 향해 τ='+p.tau+' ms로 접근한다. (a) v(t) 식 (b) t='+p.t1+' ms 값 (c) '+SVH.fmt((p.V1+p.V2)/2)+' V(중간)에 도달하는 시각을 구하라.'; },
    solve:function(p){
      var v=p.V2+(p.V1-p.V2)*Math.exp(-p.t1/p.tau);
      var tmid=-p.tau*Math.log(0.5);
      return { ans:{v:v, tmid:tmid}, unit:{v:'V', tmid:'ms'}, steps:[
        'v(t) = '+p.V2+' + ('+p.V1+'−'+p.V2+')e^{−t/'+p.tau+'}',
        't='+p.t1+': '+SVH.fmt(v)+' V',
        '중간 도달 = 남은 거리 절반 → t = τ·ln2 = '+SVH.fmt(tmid)+' ms (초기·최종이 무엇이든!)' ] }; },
    hints:['일반형에 그대로 대입.','중간점은 항상 ln2·τ.'] },
  { id:'u6-l3-06', level:3, type:'num', tags:['전류 응답'], src:'창작 문제(검산됨)',
    params:{ Vs:{min:10,max:20,step:5,unit:'V'}, R:{min:2,max:10,step:2,unit:'kΩ'}, C:{choices:[100,470],unit:'µF'}, t1:{choices:[0.5,1],unit:'s'} },
    statement:function(p){ return 't=0에 '+p.Vs+' V가 R='+p.R+' kΩ와 방전된 C='+p.C+' µF 직렬에 인가. 충전 전류 i(t) 식과 t='+p.t1+' s 값(mA)을 구하라.'; },
    solve:function(p){
      var i0=p.Vs/p.R, tau=p.R*1000*p.C*1e-6, i=i0*Math.exp(-p.t1/tau);
      return { ans:{i0:i0, i:i}, unit:{i0:'mA', i:'mA'}, steps:[
        'i(0⁺) = V/R = '+SVH.fmt(i0)+' mA, i(∞)=0 → i(t) = '+SVH.fmt(i0)+'e^{−t/τ}, τ='+SVH.fmt(tau)+' s',
        't='+p.t1+': i = '+SVH.fmt(i)+' mA',
        '(전압은 올라가고 전류는 같은 τ로 내려간다 — 둘 다 그릴 수 있어야)' ] }; },
    hints:['전류는 항상 지수 "감쇠" 쪽.'] },
  { id:'u6-l3-07', level:3, type:'num', tags:['테브난 τ'], src:'기출 유형',
    params:{ R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:4,max:12,step:4,unit:'Ω'}, R3:{min:2,max:6,step:2,unit:'Ω'}, C:{choices:[0.5,1],unit:'F'} },
    statement:function(p){ return 'C='+p.C+' F가 회로에 연결: C 단자에서 보면 R₃='+p.R3+' Ω 직렬 뒤에 (R₁='+p.R1+' Ω ∥ R₂='+p.R2+' Ω), 전원은 전압원 하나. 시정수를 구하라.'; },
    solve:function(p){ var Rt=p.R3+SVH.par(p.R1,p.R2), tau=Rt*p.C;
      return { ans:tau, unit:'s', steps:[
        '전원 단락 → R_eq = R₃ + R₁∥R₂ = '+SVH.fmt(Rt)+' Ω',
        'τ = R_eq·C = '+SVH.fmt(tau)+' s (기출 5번: R_T=6 Ω 구하는 바로 그 절차)' ] }; },
    hints:['U4 테브난 저항이 여기서 재등장.'] },
  { id:'u6-l3-08', level:3, type:'num', tags:['RL 감쇠'], src:'창작 문제(검산됨)',
    params:{ I0:{min:2,max:6,step:2,unit:'A'}, R:{min:5,max:20,step:5,unit:'Ω'}, L:{choices:[0.1,0.5],unit:'H'}, t1:{choices:[10,20],unit:'ms'} },
    statement:function(p){ return '인덕터 L='+p.L+' H에 I₀='+p.I0+' A가 흐르다가 t=0에 전원이 분리되고 R='+p.R+' Ω로만 감쇠한다. (a) i(t) (b) t='+p.t1+' ms 값 (c) 초기 저항 전압을 구하라.'; },
    solve:function(p){
      var tau=p.L/p.R, i=p.I0*Math.exp(-p.t1/1000/tau), v0=p.I0*p.R;
      return { ans:{i:i, v0:v0}, unit:{i:'A', v0:'V'}, steps:[
        'τ = L/R = '+SVH.fmt(tau*1000)+' ms → i(t) = '+p.I0+'e^{−t/τ}',
        't='+p.t1+' ms: '+SVH.fmt(i)+' A',
        'v_R(0⁺) = I₀R = '+SVH.fmt(v0)+' V (인덕터가 전류를 유지하려고 만드는 전압 — 스파크의 원리)' ] }; },
    hints:['전류 연속 → 초기 전류가 그대로 R로.'] },
  { id:'u6-l3-09', level:3, type:'num', tags:['이중 전원 최종값'], src:'창작 문제(검산됨)',
    params:{ V1:{choices:[6,12],unit:'V'}, V2:{choices:[18,24],unit:'V'}, R:{min:2,max:6,step:2,unit:'Ω'}, C:{choices:[1,2],unit:'F'} },
    statement:function(p){ return 'C가 V₁='+p.V1+' V로 충전된 상태에서, t=0에 V₂='+p.V2+' V 전원+R='+p.R+' Ω에 연결된다. (a) v_C(t) 식 (b) 전압이 '+SVH.fmt((p.V1+p.V2)/2)+' V가 되는 시각(τ 단위)을 구하라.'; },
    solve:function(p){
      var tau=p.R*p.C;
      return { ans:{tau:tau, tmid:tau*Math.LN2}, unit:{tau:'s', tmid:'s'}, steps:[
        'v(t) = '+p.V2+' + ('+p.V1+'−'+p.V2+')e^{−t/'+SVH.fmt(tau)+'}, τ=RC='+SVH.fmt(tau)+' s',
        '중간값 도달 t = τ ln2 = '+SVH.fmt(tau*Math.LN2)+' s',
        '(재충전도 같은 일반형 — 부호는 식이 알아서 처리한다)' ] }; },
    hints:['초기≠0, 최종≠0인 일반형 그대로.'] },
  { id:'u6-l3-10', level:3, type:'num', tags:['실험 오차 정량'], src:'기출 유형',
    params:{ R:{choices:[10,20,50],unit:'kΩ'}, Rs:{choices:[1,10],unit:'MΩ'}, C:{choices:[1,10],unit:'µF'} },
    statement:function(p){ return 'RC 방전 실험: R='+p.R+' kΩ, C='+p.C+' µF인데 오실로스코프 입력저항 '+p.Rs+' MΩ이 C에 병렬로 붙는다. (a) 이론 τ (b) 실측될 τ (c) 오차율(%)을 구하라. (기말 P3(a)의 정량판)'; },
    solve:function(p){
      var tau0=p.R*1000*p.C*1e-6*1000;
      var Rp=SVH.par(p.R*1000,p.Rs*1e6), tau1=Rp*p.C*1e-6*1000;
      var err=(tau0-tau1)/tau0*100;
      return { ans:{tau0:tau0, tau1:tau1, err:err}, unit:{tau0:'ms', tau1:'ms', err:'%'}, steps:[
        '이론: τ = RC = '+SVH.fmt(tau0)+' ms',
        '실측: R∥R_scope = '+SVH.fmt(Rp/1000)+' kΩ → τ = '+SVH.fmt(tau1)+' ms (더 빨리 방전)',
        '오차 = '+SVH.fmt(err)+' % — R가 클수록 계측기 영향이 커진다는 결론까지' ] }; },
    hints:['계측기 저항이 방전 경로에 병렬로 추가된다.'] },
  { id:'u6-l3-11', level:3, type:'num', tags:['도달시간 설계'], src:'창작 문제(검산됨)',
    params:{ C:{choices:[10,100],unit:'µF'}, t99:{choices:[1,5],unit:'s'} },
    statement:function(p){ return '카메라 플래시: C='+p.C+' µF를 '+p.t99+' s 안에 최종값의 99%까지 충전시키려 한다. 허용되는 최대 R(kΩ)은? (99% ≈ 4.6τ)'; },
    solve:function(p){
      var tau=p.t99/(-Math.log(0.01)), R=tau/(p.C*1e-6)/1000;
      return { ans:R, unit:'kΩ', steps:[
        '99% → e^{−t/τ}=0.01 → t = τ·ln100 = 4.605τ',
        'τ_max = '+p.t99+'/4.605 = '+SVH.fmt(tau)+' s',
        'R_max = τ/C = '+SVH.fmt(R)+' kΩ' ] }; },
    hints:['목표 %에서 필요한 τ부터.'] },
  { id:'u6-l3-12', level:3, type:'num', tags:['스위치 닫기 전류 점프'], src:'기출 유형',
    params:{ Vs:{min:12,max:24,step:6,unit:'V'}, R1:{min:2,max:6,step:2,unit:'Ω'}, R2:{min:2,max:6,step:2,unit:'Ω'} },
    statement:function(p){ return p.Vs+' V → R₁='+p.R1+' Ω → C, 그리고 C에 병렬인 R₂='+p.R2+' Ω 스위치 가지가 t=0에 닫힌다(그 전은 정상상태). (a) v_C(0⁺) (b) 닫힌 직후 R₂의 전류 (c) v_C(∞)를 구하라.'; },
    solve:function(p){
      var v0=p.Vs; // t<0: C 개방, R1 전류 0 → vC = Vs
      var i2=v0/p.R2;
      var vinf=p.Vs*p.R2/(p.R1+p.R2);
      return { ans:{v0:v0, i2:i2, vinf:vinf}, unit:{v0:'V', i2:'A', vinf:'V'}, steps:[
        't<0: R₁ 전류 0(C 개방) → 강하 없음 → v_C(0⁻) = '+p.Vs+' V = v_C(0⁺)',
        '0⁺: R₂에 바로 '+SVH.fmt(v0)+' V → i₂(0⁺) = '+SVH.fmt(i2)+' A',
        '∞: 분압 v_C(∞) = '+SVH.fmt(vinf)+' V (전압이 "내려가는" 과도)' ] }; },
    hints:['t<0에 전류가 안 흐르면 R₁ 강하도 없다.'] },
  { id:'u6-l3-13', level:3, type:'num', tags:['두 C 병합 아님·독립 τ'], src:'창작 문제(검산됨)',
    params:{ R:{choices:[1,2],unit:'kΩ'}, C1:{choices:[10,20],unit:'µF'}, C2:{choices:[30,60],unit:'µF'} },
    statement:function(p){ return '같은 R='+p.R+' kΩ로 각각 방전하는 두 회로: C₁='+p.C1+' µF, C₂='+p.C2+' µF. 같은 시각에 시작해 C₁의 전압이 절반이 됐을 때, C₂의 전압은 초기값의 몇 %인가?'; },
    solve:function(p){
      var t=p.R*1000*p.C1*1e-6*Math.LN2;
      var frac=Math.exp(-t/(p.R*1000*p.C2*1e-6))*100;
      return { ans:frac, unit:'%', steps:[
        'C₁ 절반 시각: t = τ₁ln2 = '+SVH.fmt(t*1000)+' ms',
        'C₂: e^{−t/τ₂} = e^{−(C₁/C₂)ln2} = '+SVH.fmt(frac)+' %',
        '(큰 C가 더 천천히 — 비율만으로도 답이 나오는 구조)' ] }; },
    hints:['시각을 τ₁로 표현해 τ₂에 대입.'] },
  { id:'u6-l3-14', level:3, type:'num', tags:['펄스 응답'], src:'기출 유형',
    params:{ Vs:{choices:[5,10],unit:'V'}, tau:{choices:[1,2],unit:'ms'}, Tp:{choices:[1,2,4],unit:'ms'} },
    statement:function(p){ return 'RC 회로(τ='+p.tau+' ms)에 폭 '+p.Tp+' ms, 높이 '+p.Vs+' V의 펄스가 들어온다(그 전 0 V). (a) 펄스 끝(t=T_p)의 v_C (b) 펄스가 끝난 뒤 T_p ms 더 지난 시점의 v_C를 구하라.'; },
    solve:function(p){
      var v1=p.Vs*(1-Math.exp(-p.Tp/p.tau));
      var v2=v1*Math.exp(-p.Tp/p.tau);
      return { ans:{v1:v1, v2:v2}, unit:{v1:'V', v2:'V'}, steps:[
        '구간1(충전): v(T_p) = '+p.Vs+'(1−e^{−'+p.Tp+'/'+p.tau+'}) = '+SVH.fmt(v1)+' V',
        '구간2(방전, 초기값 '+SVH.fmt(v1)+'): v = '+SVH.fmt(v1)+'e^{−'+p.Tp+'/'+p.tau+'} = '+SVH.fmt(v2)+' V',
        '(구간을 나누고 앞 구간의 끝이 뒷 구간의 초기값 — 이중 스위칭의 원형)' ] }; },
    hints:['구간별로 3종 세트를 다시 세팅.'] },

  /* ---------- L4 (8) ---------- */
  { id:'u6-l4-01', level:4, type:'mc', tags:['개념 종합'], src:'기출 유형',
    statement:'옳은 것을 모두 고르면?<br>㉠ τ를 구할 때 보는 저항은 C(또는 L) 단자에서의 테브난 저항이다<br>㉡ 스위칭 순간 축전기 전류는 연속이어야 한다<br>㉢ 방전에서 저항이 크면 총 소산 에너지도 커진다<br>㉣ 5τ가 지나면 응답은 사실상 정상상태다',
    choices:['㉠㉣','㉠㉡㉣','㉢㉣','전부'],
    answer:0, expl:'연속인 건 v_C(㉡ ✗). 소산 총량은 ½CV₀²로 R와 무관(㉢ ✗) — R는 속도만 바꾼다.' },
  { id:'u6-l4-02', level:4, type:'num', tags:['기출 5번 완전 재현'], src:'기출 유형',
    params:{ Vs:{choices:[20],unit:'V'}, R1:{choices:[5],unit:'Ω'}, R2:{choices:[4],unit:'Ω'}, R3:{choices:[3],unit:'Ω'}, R4:{choices:[6],unit:'Ω'}, C:{choices:[8],unit:'F'}, Is:{choices:[4],unit:'A'} },
    statement:function(p){ return '기출 5번 구조: t<0 — '+p.Vs+' V 전원(직렬 R₁='+p.R1+' Ω)이 C='+p.C+' F를 충전(다른 가지 분리, 정상상태). t=0 — 전원 분리되고 C가 [R₂='+p.R2+' Ω 직렬 후 (R₃='+p.R3+' Ω ∥ R₄='+p.R4+' Ω)] + 전류원 '+p.Is+' A(R₄ 가지 쪽에서 유입, 유입 절점은 R₃∥R₄ 위)와 연결. (a) v_C(0⁺) (b) τ (c) v_C(∞) (d) v_C(t) — t=τ 값으로 답하라.'; },
    solve:function(p){
      var v0=p.Vs; // t<0 정상상태: 전류 0 → R1 강하 0
      var Rp=SVH.par(p.R3,p.R4);
      var Rt=p.R2+Rp, tau=Rt*p.C;
      var vinf=p.Is*Rp; // C 개방: Is가 R3||R4로 → 그 전압이 C까지 (R2 전류 0)
      var vtau=vinf+(v0-vinf)*Math.exp(-1);
      return { ans:{v0:v0, tau:tau, vinf:vinf, vtau:vtau}, unit:{v0:'V', tau:'s', vinf:'V', vtau:'V'}, steps:[
        '(a) t<0: C 개방 → R₁ 전류 0 → v_C(0⁻)=V_s='+p.Vs+' V = v_C(0⁺)',
        '(b) 전류원 개방 후 C에서 본 R: R₂+(R₃∥R₄) = '+p.R2+'+'+SVH.fmt(Rp)+' = '+SVH.fmt(Rt)+' Ω → τ = '+SVH.fmt(tau)+' s',
        '(c) t→∞: C 개방 → I_s가 R₃∥R₄에 전압 '+SVH.fmt(vinf)+' V 형성, R₂ 전류 0 → v_C(∞) = '+SVH.fmt(vinf)+' V',
        '(d) v_C(t) = '+SVH.fmt(vinf)+'+('+SVH.fmt(v0)+'−'+SVH.fmt(vinf)+')e^{−t/'+SVH.fmt(tau)+'} → t=τ: '+SVH.fmt(vtau)+' V',
        '스케치: '+SVH.fmt(v0)+' V에서 '+SVH.fmt(vinf)+' V로 지수 접근 (기출 정답 흐름과 동일 구조)' ] }; },
    hints:['네 값(초기·τ·최종·식)이 각각 소문항 — 순서대로.','∞ 회로에서 R₂에 전류가 흐르는지부터 따져라.'] },
  { id:'u6-l4-03', level:4, type:'num', tags:['기말 P2형 이중 스위칭'], src:'기출 유형',
    params:{ VB:{choices:[15],unit:'V'}, R1:{choices:[1],unit:'kΩ'}, R2:{choices:[1],unit:'kΩ'}, C:{choices:[25],unit:'µF'}, ts:{choices:[50],unit:'ms'} },
    statement:function(p){ return '기말 P2 구조: t=0에 스위치가 닫혀 V_B='+p.VB+' V → R₁='+p.R1+' kΩ → (C='+p.C+' µF ∥ R₂='+p.R2+' kΩ)로 충전(초기 0 V), t='+p.ts+' ms에 스위치가 다시 열려 C가 R₂로만 방전. (a) 구간1의 τ₁·최종값 (b) v_C('+p.ts+' ms) (c) 구간2의 τ₂ (d) t='+(2*p.ts)+' ms의 v_C를 구하라.'; },
    solve:function(p){
      var R1=p.R1*1000, R2=p.R2*1000, C=p.C*1e-6;
      var tau1=SVH.par(R1,R2)*C*1000; // ms
      var vf1=p.VB*R2/(R1+R2);
      var vs=vf1*(1-Math.exp(-p.ts/tau1));
      var tau2=R2*C*1000;
      var v2=vs*Math.exp(-p.ts/tau2);
      return { ans:{tau1:tau1, vf1:vf1, vs:vs, tau2:tau2, v2:v2}, unit:{tau1:'ms', vf1:'V', vs:'V', tau2:'ms', v2:'V'}, steps:[
        '구간1: τ₁=(R₁∥R₂)C = '+SVH.fmt(tau1)+' ms, 목표값 = 분압 '+SVH.fmt(vf1)+' V',
        'v_C('+p.ts+' ms) = '+SVH.fmt(vf1)+'(1−e^{−'+p.ts+'/'+SVH.fmt(tau1)+'}) = '+SVH.fmt(vs)+' V',
        '구간2: 전원 제거 → τ₂=R₂C = '+SVH.fmt(tau2)+' ms (τ가 2배로!)',
        'v_C('+(2*p.ts)+' ms) = '+SVH.fmt(vs)+'e^{−'+p.ts+'/'+SVH.fmt(tau2)+'} = '+SVH.fmt(v2)+' V',
        '스케치: 상승(빠름)→꺾여서 하강(느림) — 두 τ가 다른 것이 채점 포인트' ] }; },
    hints:['구간마다 회로가 다르다: τ도 목표값도 다시.','구간1의 끝값이 구간2의 초기값.'] },
  { id:'u6-l4-04', level:4, type:'num', tags:['RL 스위칭 종합'], src:'기출 유형',
    params:{ Vs:{choices:[12,24],unit:'V'}, R1:{choices:[4,6],unit:'Ω'}, R2:{choices:[8,12],unit:'Ω'}, L:{choices:[2],unit:'H'} },
    statement:function(p){ return 't<0: '+p.Vs+' V → R₁='+p.R1+' Ω → L='+p.L+' H (정상상태). t=0에 전원 가지가 끊기고 L이 R₁ 대신 R₂='+p.R2+' Ω 경로로 감쇠한다. (a) i_L(0⁺) (b) τ (c) L 양단 전압의 0⁺ 값(극성 포함) (d) i가 초기의 10%가 되는 시각을 구하라.'; },
    solve:function(p){
      var i0=p.Vs/p.R1, tau=p.L/p.R2, vL0=-i0*p.R2, t10=tau*Math.log(10);
      return { ans:{i0:i0, tau:tau, vL0:vL0, t10:t10}, unit:{i0:'A', tau:'s', vL0:'V', t10:'s'}, steps:[
        'i_L(0⁺) = i_L(0⁻) = V/R₁ = '+SVH.fmt(i0)+' A',
        'τ = L/R₂ = '+SVH.fmt(tau)+' s (감쇠 경로의 R!)',
        'v_L(0⁺) = −i₀R₂ = '+SVH.fmt(vL0)+' V — 전류 유지를 위해 극성이 뒤집힌다 (|v_L|이 V_s보다 클 수 있음: 유도 킥)',
        '10%: e^{−t/τ}=0.1 → t = τln10 = '+SVH.fmt(t10)+' s' ] }; },
    hints:['τ는 "지금" 연결된 R로.','v_L 부호는 KVL로 확인.'] },
  { id:'u6-l4-05', level:4, type:'derive', tags:['유도'], src:'교재 표준',
    statement:'RC 방전 회로의 미분방정식을 세우고 \\(v(t)=V_0e^{-t/RC}\\)를 유도하라. 충전(전원 V_s 포함)의 일반해까지 확장하라.',
    steps:[
      'KCL(방전 루프): \\(C\\dfrac{dv}{dt}+\\dfrac{v}{R}=0\\) [무엇을] C 전류 + R 전류 = 0 [왜] 외부 전원이 없으므로',
      '변수 분리: \\(\\dfrac{dv}{v}=-\\dfrac{dt}{RC}\\) → 적분 \\(\\ln v = -t/RC + K\\)',
      '초기조건 v(0)=V₀ → \\(v(t)=V_0e^{-t/RC}\\) — τ=RC가 지수에서 자연히 등장',
      '충전: \\(C\\dfrac{dv}{dt}+\\dfrac{v-V_s}{R}=0\\) → 같은 방법으로 \\(v=V_s+(V_0-V_s)e^{-t/\\tau}\\) (일반형)',
      '극한 체크: t=0 ⇒ V₀ ✓, t→∞ ⇒ V_s ✓, R→∞ ⇒ 변화 없음(개방) ✓ · 차원: RC=[Ω][F]=[s] ✓'
    ],
    hints:['KCL 한 줄 → 변수 분리.','일반형이 어떻게 나오는지가 시험 서술형 포인트.'],
    expl:'"3종 세트 공식"의 출처. 유도를 알면 이중 스위칭·펄스도 그냥 구간별 재적용이다.' },
  { id:'u6-l4-06', level:4, type:'num', tags:['설계: 타이머'], src:'창작 문제(검산됨)',
    params:{ Vs:{choices:[9,12],unit:'V'}, Vth:{choices:[6,8],unit:'V'}, C:{choices:[10,100],unit:'µF'}, td:{choices:[1,5],unit:'s'} },
    constraint:function(p){ return p.Vth<p.Vs*0.9; },
    statement:function(p){ return '타이머 설계: '+p.Vs+' V로 충전되는 RC 회로가 임계 전압 '+p.Vth+' V에 정확히 '+p.td+' s 만에 도달해야 한다. C='+p.C+' µF일 때 R(kΩ)을 구하라.'; },
    solve:function(p){
      var tau=p.td/(-Math.log(1-p.Vth/p.Vs));
      var R=tau/(p.C*1e-6)/1000;
      return { ans:R, unit:'kΩ', steps:[
        '조건: '+p.Vth+' = '+p.Vs+'(1−e^{−t_d/τ}) → e^{−t_d/τ} = '+SVH.fmt(1-p.Vth/p.Vs),
        'τ = t_d/ln('+SVH.fmt(1/(1-p.Vth/p.Vs))+') = '+SVH.fmt(tau)+' s',
        'R = τ/C = '+SVH.fmt(R)+' kΩ (555 타이머류의 실제 설계 계산)' ] }; },
    hints:['도달 조건식을 τ로 풀고 R 역산.'] },
  { id:'u6-l4-07', level:4, type:'num', tags:['에너지 수지 종합'], src:'기출 유형',
    params:{ Vs:{choices:[10,20],unit:'V'}, R:{choices:[1,2],unit:'kΩ'}, C:{choices:[100,470],unit:'µF'} },
    statement:function(p){ return '방전된 C='+p.C+' µF를 '+p.Vs+' V·R='+p.R+' kΩ로 완전 충전할 때 (a) C에 저장되는 에너지 (b) R에서 소산되는 에너지 (c) 전원이 공급한 총 에너지를 구하고, 충전 효율이 50%임을 확인하라. (mJ)'; },
    solve:function(p){
      var E=0.5*p.C*1e-6*p.Vs*p.Vs*1000;
      return { ans:{Ec:E, Er:E, Es:2*E}, unit:{Ec:'mJ', Er:'mJ', Es:'mJ'}, steps:[
        'E_C = ½CV² = '+SVH.fmt(E)+' mJ',
        '전원 공급 = ∫V_s i dt = V_s·Q = V_s·CV_s = CV² = '+SVH.fmt(2*E)+' mJ',
        'E_R = 공급 − 저장 = '+SVH.fmt(E)+' mJ — 정확히 절반. R값과 무관하게 효율 50% (놀랍지만 적분해도 같다)' ] }; },
    hints:['전원 에너지는 V_s×총 전하.','저장분을 빼면 소산분.'] },
  { id:'u6-l4-08', level:4, type:'num', tags:['미지 회로 역추정'], src:'기출 유형',
    params:{ V0:{choices:[12,15],unit:'V'}, vA:{choices:[3,5],unit:'V'}, t1:{choices:[10,20],unit:'ms'} },
    constraint:function(p){ return p.vA<p.V0*0.6; },
    statement:function(p){ return '실험 데이터: 방전 곡선이 '+p.V0+' V에서 시작, t='+p.t1+' ms에 '+p.vA+' V. (a) τ (b) C=10 µF일 때 방전 저항 R (c) t=0에서의 방전 전류를 구하라.'; },
    solve:function(p){
      var tau=p.t1/Math.log(p.V0/p.vA);
      var R=tau/1000/(10e-6)/1000; // kΩ
      var i0=p.V0/(R*1000)*1000; // mA
      return { ans:{tau:tau, R:R, i0:i0}, unit:{tau:'ms', R:'kΩ', i0:'mA'}, steps:[
        'e^{−t₁/τ} = '+p.vA+'/'+p.V0+' → τ = t₁/ln('+p.V0+'/'+p.vA+') = '+SVH.fmt(tau)+' ms',
        'R = τ/C = '+SVH.fmt(R)+' kΩ',
        'i(0) = V₀/R = '+SVH.fmt(i0)+' mA (데이터 2점이면 회로가 역추정된다 — 실험 보고서의 핵심 계산)' ] }; },
    hints:['두 점 비율에 ln.','τ에서 R, R에서 초기 전류.'] }
  ]
});
