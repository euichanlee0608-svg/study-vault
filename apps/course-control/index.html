<script>
(function(){
'use strict';
var APP='course-control', VP=Vault.progress(APP), VD=Vault.drill(APP), VM=Vault.meta(APP);
var UNITS=SV_BANK, BYID={}, ALL=[];
UNITS.forEach(function(u){ u.problems.forEach(function(p){ p._unit=u; BYID[p.id]=p; ALL.push(p); }); });
var LAYERS=['concept','derive','worked'], LAYER_KO={concept:'개념',derive:'수식·유도',worked:'풀이된 예제'};
var $=function(s,el){ return (el||document).querySelector(s); };
var esc=function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
function typeset(el){
  if(window.MathJax&&window.__mjready){ MathJax.typesetPromise([el]).catch(function(){}); }
  else { (window.__mjq=window.__mjq||[]).push(el); }
}

/* ---------- 파라미터 추출/리롤 (러너와 동일 규칙) ---------- */
function draw(spec){ 
  if(spec.choices) return spec.choices[Math.floor(Math.random()*spec.choices.length)];
  var steps=Math.round((spec.max-spec.min)/spec.step);
  return spec.min+spec.step*Math.floor(Math.random()*(steps+1));
}
function sample(prob){
  for(var t=0;t<500;t++){
    var p={}; for(var k in prob.params) p[k]=draw(prob.params[k]);
    if(!prob.constraint||prob.constraint(p)) return p;
  }
  return null;
}
var CUR={}; // 문제별 현재 파라미터
function statementOf(prob){
  if(!prob.params) return (typeof prob.statement==='function')?prob.statement({}):prob.statement;
  if(!CUR[prob.id]) CUR[prob.id]=sample(prob);
  return prob.statement(CUR[prob.id]);
}
function ansText(r){
  if(r==null) return '';
  var a=r.ans, u=r.unit;
  if(typeof a==='number') return SVH.fmt(a)+' '+(u||'');
  var parts=[]; for(var k in a){ parts.push(k+' = '+SVH.fmt(a[k])+' '+((u&&u[k])||'')); }
  return parts.join(' · ');
}

/* ---------- 진도 ---------- */
function readItems(){ var ids=[]; UNITS.forEach(function(u){ LAYERS.forEach(function(l){ ids.push(u.id+'-'+l); }); }); return ids; }
function refreshProg(){
  var ids=readItems(), n=0; ids.forEach(function(id){ if(VP.get(id)) n++; });
  $('#pbar').style.width=Math.round(n/ids.length*100)+'%';
  $('#ptxt').textContent='읽음 '+n+' / '+ids.length+' · 문제 '+VD.counts().total+'/'+ALL.length;
  document.querySelectorAll('.readbtn[data-read]').forEach(function(b){
    var on=VP.get(b.getAttribute('data-read'));
    b.setAttribute('aria-pressed',on?'true':'false');
    b.textContent=on?'✓ 읽음':'읽음으로 표시';
  });
  var wc=wrongList().length, badge=$('#nav-wrong .nv'); if(badge) badge.textContent=wc||'';
}
function wrongList(){
  var all=VD.all(), ids=[];
  for(var k in all){ if((all[k]==='wrong'||all[k]==='partial')&&BYID[k]) ids.push(k); }
  return ids;
}

/* ---------- 문제 카드 ---------- */
function grade(prob, status, card){
  VD.set(prob.id, status);
  card.querySelectorAll('.pbtn.sel').forEach(function(b){ b.classList.remove('sel'); });
  var btn=card.querySelector('.pbtn.grade-'+status[0]); if(btn) btn.classList.add('sel');
  var dot=card.querySelector('.sdot'); if(dot){ dot.className='sdot '+status; }
  refreshProg();
  if(EXAM.running) examAnswered(prob.id, status);
}
function renderProblem(prob){
  var card=document.createElement('article'); card.className='pcard'; card.setAttribute('data-pid',prob.id);
  var st=VD.get(prob.id);
  var srcb=prob.src?'<span class="srcb">'+esc(prob.src)+'</span>':'';
  card.innerHTML='<div class="pc-head"><span class="lv lv'+prob.level+'">L'+prob.level+'</span>'+
    '<span class="tagc">'+esc(prob.id)+' · '+esc((prob.tags||[]).join('·'))+'</span>'+srcb+
    '<span class="sdot'+(st?' '+st:'')+'"></span></div>'+
    '<div class="pc-st"></div><div class="pc-body"></div><div class="pc-btns"></div>';
  var stEl=$('.pc-st',card), body=$('.pc-body',card), btns=$('.pc-btns',card);
  stEl.innerHTML=statementOf(prob);

  function addBtn(label, cls, fn){
    var b=document.createElement('button'); b.type='button'; b.className='pbtn'+(cls?' '+cls:''); b.textContent=label;
    b.addEventListener('click',fn); btns.appendChild(b); return b;
  }
  function gradeBtns(){
    addBtn('맞음 ✓','grade-c',function(){ grade(prob,'correct',card); });
    addBtn('부분 △','grade-p',function(){ grade(prob,'partial',card); });
    addBtn('틀림 ✗','grade-w',function(){ grade(prob,'wrong',card); });
    if(st){ var b=card.querySelector('.pbtn.grade-'+st[0]); if(b) b.classList.add('sel'); }
  }

  if(prob.type==='mc'||prob.type==='tf'){
    var choices = prob.type==='tf' ? ['참 (O)','거짓 (X)'] : prob.choices;
    var correctIdx = prob.type==='tf' ? (prob.answer?0:1) : prob.answer;
    var wrap=document.createElement('div'); wrap.className='choices';
    choices.forEach(function(c,i){
      var b=document.createElement('button'); b.type='button'; b.className='choice'; b.innerHTML=c;
      b.addEventListener('click',function(){
        if(card.__done) return; card.__done=true;
        wrap.children[correctIdx].classList.add('right');
        if(i!==correctIdx) b.classList.add('wrongpick');
        var ex=document.createElement('div'); ex.className='expl'; ex.innerHTML='<b>해설</b> — '+prob.expl;
        body.appendChild(ex); typeset(ex);
        grade(prob, i===correctIdx?'correct':'wrong', card);
      });
      wrap.appendChild(b);
    });
    body.appendChild(wrap);
  } else {
    var hintIdx=0, hb=null;
    if(prob.hints&&prob.hints.length){
      addBtn('💡 힌트','',function(){
        if(hintIdx>=prob.hints.length) return;
        if(!hb){ hb=document.createElement('div'); hb.className='hintbox'; body.appendChild(hb); }
        var d=document.createElement('div'); d.innerHTML='힌트 '+(hintIdx+1)+'. '+prob.hints[hintIdx];
        hb.appendChild(d); typeset(d); hintIdx++;
        this.textContent = hintIdx>=prob.hints.length ? '힌트 끝' : '💡 힌트 '+(hintIdx+1);
      });
    }
    var solBtn=addBtn('풀이 보기','',function(){
      if(card.__sol){ card.__sol.hidden=!card.__sol.hidden; this.textContent=card.__sol.hidden?'풀이 보기':'풀이 닫기'; return; }
      var box=document.createElement('div'); box.className='solbox';
      var steps, aline='';
      if(prob.type==='derive'){ steps=prob.steps; }
      else{
        var r=prob.solve(prob.params?CUR[prob.id]:{});
        steps=r.steps; aline='<div class="ansline">답: '+esc(ansText(r))+'</div>';
      }
      box.innerHTML='<ol>'+steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol>'+aline+
        (prob.expl?'<div class="expl">'+prob.expl+'</div>':'');
      body.appendChild(box); typeset(box);
      card.__sol=box; this.textContent='풀이 닫기';
      if(!card.__graded){ card.__graded=true; gradeBtns(); }
    });
    if(prob.params){
      addBtn('🎲 새 숫자로','',function(){
        CUR[prob.id]=sample(prob);
        stEl.innerHTML=statementOf(prob); typeset(stEl);
        if(card.__sol){ card.__sol.remove(); card.__sol=null; solBtn.textContent='풀이 보기'; }
        if(hb){ hb.remove(); hb=null; hintIdx=0; }
      });
    }
    if(st&&!card.__graded){ card.__graded=true; gradeBtns(); }
  }
  return card;
}

/* ---------- 뷰 ---------- */
var view=$('#view');
function setView(html){ view.innerHTML=html; }
function renderHome(){
  var dc=VD.counts();
  var rate=dc.total?Math.round(dc.correct/dc.total*100):null;
  setView('<div class="eyebrow">MECH387 Automatic Control · 중간범위 (중간 10/22 19시)</div>'+
    '<h1>자동제어 문제은행</h1>'+
    '<p class="lede">개념 → 유도 → 예제 → 4단계 문제(L1~L4). 전 문제가 검산 게이트(sympy 독립 재계산 대조)를 통과했고, 계산형 문제는 <b>🎲 새 숫자로</b>를 눌러 무한 반복할 수 있다.</p>'+
    '<p class="note-line">현황 — 풀어본 문제 '+dc.total+' / '+ALL.length+(rate!==null?(' · 정답률 '+rate+'%'):'')+
    ' · <a href="#wrong">오답노트 '+wrongList().length+'문제</a> · 빌드 '+SV_BUILD.date+' (게이트 '+SV_BUILD.gate+')</p>'+
    '<div class="ucards" id="ucards"></div>'+
    '<h3>모드</h3><div class="ucards">'+
    '<a class="ucard" href="#exam"><span class="uc-no">MOCK EXAM</span><span class="uc-ti">📝 모의고사</span><span class="uc-scope">범위·난이도·문항수를 골라 랜덤 출제 — 매번 새 수치, 종료 리포트 제공.</span></a>'+
    '<a class="ucard" href="#wrong"><span class="uc-no">RETRY QUEUE</span><span class="uc-ti">🔁 오답노트</span><span class="uc-scope">틀림·부분 문제만 모아 재도전. 맞음으로 바꾸면 큐에서 빠진다.</span></a></div>');
  var uc=$('#ucards');
  UNITS.forEach(function(u){
    var solved=0, ok=0;
    u.problems.forEach(function(p){ var s=VD.get(p.id); if(s){solved++; if(s==='correct')ok++;} });
    var reads=LAYERS.filter(function(l){return VP.get(u.id+'-'+l);}).length;
    var a=document.createElement('a'); a.className='ucard'; a.href='#'+u.id;
    a.innerHTML='<span class="uc-no">UNIT '+u.no+'</span><span class="uc-ti">'+esc(u.title)+'</span>'+
      '<span class="uc-scope">'+esc(u.scope)+'</span>'+
      '<span class="uc-stat">읽음 '+reads+'/3 · 문제 '+solved+'/'+u.problems.length+(solved?' · 정답 '+ok:'')+'</span>';
    uc.appendChild(a);
  });
  typeset(view);
}
function renderUnit(u){
  var c=SV_CONTENT[u.id]||{};
  setView('<div class="eyebrow">UNIT '+u.no+' / '+UNITS.length+'</div><h1>'+esc(u.title)+'</h1>'+
    '<p class="lede">'+esc(u.scope)+'</p><div id="layers"></div>'+
    '<h3>문제 세트 <span class="src">L1 개념확인 → L4 시험급 · '+u.problems.length+'문제</span></h3>'+
    '<div class="filters" id="filters"></div><div id="plist"></div>');
  var layers=$('#layers');
  LAYERS.forEach(function(l){
    var d=document.createElement('details'); d.className='layer'; if(l==='concept') d.open=true;
    var inner='';
    if(l==='derive'){
      (c.derive||[]).forEach(function(dv){
        inner+='<details class="dstep"><summary>'+esc(dv.title)+'</summary><ol>'+
          dv.steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol></details>';
      });
    } else inner=c[l]||'';
    d.innerHTML='<summary><span class="lb">'+(l.toUpperCase())+'</span>'+LAYER_KO[l]+'<span class="arrow">›</span></summary>'+
      '<div class="body">'+inner+'<div class="readrow"><button type="button" class="readbtn" data-read="'+u.id+'-'+l+'"></button></div></div>';
    layers.appendChild(d);
  });
  layers.addEventListener('click',function(e){
    var b=e.target.closest('.readbtn'); if(!b) return;
    VP.toggle(b.getAttribute('data-read')); refreshProg();
  });
  var lv=0, fl=$('#filters'), pl=$('#plist');
  function renderList(){
    pl.innerHTML='';
    u.problems.filter(function(p){ return !lv||p.level===lv; }).forEach(function(p){ pl.appendChild(renderProblem(p)); });
    typeset(pl);
  }
  [['전체',0],['L1 개념',1],['L2 기본',2],['L3 응용',3],['L4 시험급',4]].forEach(function(f){
    var b=document.createElement('button'); b.type='button'; b.className='fchip'+(f[1]===0?' on':''); b.textContent=f[0];
    b.addEventListener('click',function(){ lv=f[1]; fl.querySelectorAll('.fchip').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); renderList(); });
    fl.appendChild(b);
  });
  renderList(); typeset(layers);
}
function renderWrong(){
  var ids=wrongList();
  setView('<div class="eyebrow">RETRY QUEUE</div><h1>오답노트</h1>'+
    '<p class="lede">틀림·부분 표시 문제 '+ids.length+'개. 다시 풀어 <b>맞음</b>으로 바꾸면 큐에서 빠진다. 계산형은 자동으로 새 수치다.</p><div id="plist"></div>');
  var pl=$('#plist');
  if(!ids.length){ pl.innerHTML='<div class="empty">비어 있음 — 문제를 풀고 자가채점하면 틀림/부분이 여기 모인다.</div>'; return; }
  ids.forEach(function(id){ var p=BYID[id]; if(p&&p.params) CUR[id]=sample(p); pl.appendChild(renderProblem(BYID[id])); });
  typeset(pl);
}
/* ---------- 모의고사 ---------- */
var EXAM={running:false};
function renderExam(){
  if(EXAM.running){ renderExamRun(); return; }
  var uchecks=UNITS.map(function(u){ return '<label class="ck"><input type="checkbox" class="exu" value="'+u.id+'" checked> U'+u.no+' '+esc(u.title)+'</label>'; }).join('');
  setView('<div class="eyebrow">MOCK EXAM</div><h1>모의고사</h1>'+
    '<p class="lede">범위와 난이도를 고르면 랜덤 출제. 채점은 문제마다(객관식 자동 · 계산형 자가채점), 종료하면 리포트.</p>'+
    '<div class="exam-setup">'+
    '<div class="grp"><h4>범위</h4>'+uchecks+'</div>'+
    '<div class="grp"><h4>난이도</h4>'+[1,2,3,4].map(function(l){return '<label class="ck"><input type="checkbox" class="exl" value="'+l+'" '+(l>1?'checked':'')+'> L'+l+'</label>';}).join('')+'</div>'+
    '<div class="grp"><h4>문항 수</h4><select id="exn"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>'+
    '<button class="bigbtn" id="exgo">모의고사 시작 →</button></div>');
  $('#exgo').addEventListener('click',function(){
    var us={}, ls={};
    document.querySelectorAll('.exu:checked').forEach(function(c){us[c.value]=1;});
    document.querySelectorAll('.exl:checked').forEach(function(c){ls[+c.value]=1;});
    var pool=ALL.filter(function(p){ return us[p._unit.id]&&ls[p.level]; });
    var n=Math.min(+$('#exn').value, pool.length);
    if(!n){ alert('선택한 범위에 문제가 없습니다'); return; }
    for(var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
    EXAM={running:true, list:pool.slice(0,n), idx:0, res:{}};
    EXAM.list.forEach(function(p){ if(p.params) CUR[p.id]=sample(p); });
    renderExamRun();
  });
}
function examAnswered(pid, status){ if(EXAM.running&&EXAM.res) EXAM.res[pid]=status; }
function renderExamRun(){
  var i=EXAM.idx, p=EXAM.list[i];
  setView('<div class="eyebrow">MOCK EXAM · '+(i+1)+' / '+EXAM.list.length+'</div>'+
    '<div class="exam-top"><span>'+(i+1)+'/'+EXAM.list.length+'</span><div class="bar"><i style="width:'+Math.round(i/EXAM.list.length*100)+'%"></i></div>'+
    '<button class="pbtn" id="exquit">종료</button></div><div id="pslot"></div>'+
    '<div class="pc-btns" style="margin-top:14px"><button class="bigbtn" id="exnext">'+(i+1<EXAM.list.length?'다음 문제 →':'리포트 보기 →')+'</button></div>');
  $('#pslot').appendChild(renderProblem(p)); typeset($('#pslot'));
  $('#exnext').addEventListener('click',function(){
    if(EXAM.idx+1<EXAM.list.length){ EXAM.idx++; renderExamRun(); } else renderExamReport();
  });
  $('#exquit').addEventListener('click',renderExamReport);
}
function renderExamReport(){
  var res=EXAM.res, list=EXAM.list; EXAM.running=false;
  var c=0,pt=0,w=0,na=0;
  var perUnit={};
  list.forEach(function(p){
    var s=res[p.id];
    var u=perUnit[p._unit.id]=perUnit[p._unit.id]||{t:0,c:0,title:p._unit.title,no:p._unit.no};
    u.t++;
    if(s==='correct'){c++;u.c++;} else if(s==='partial'){pt++;} else if(s==='wrong'){w++;} else na++;
  });
  var score=Math.round((c+0.5*pt)/list.length*100);
  var rows=Object.keys(perUnit).sort().map(function(k){var u=perUnit[k];return '<tr><td>U'+u.no+' '+esc(u.title)+'</td><td>'+u.c+' / '+u.t+'</td></tr>';}).join('');
  setView('<div class="eyebrow">MOCK EXAM · REPORT</div><h1>결과 리포트</h1>'+
    '<div class="report"><div class="score">'+score+'점</div>'+
    '<p>맞음 '+c+' · 부분 '+pt+' · 틀림 '+w+(na?' · 무응답 '+na:'')+' (총 '+list.length+'문제)</p>'+
    '<table><thead><tr><th>단원</th><th>정답</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="pc-btns"><a class="pbtn" href="#wrong">🔁 오답노트로</a><a class="pbtn" href="#exam" onclick="">다시 설정</a><a class="pbtn" href="#home">홈</a></div></div>');
}

/* ---------- 내비 · 라우팅 ---------- */
function buildNav(){
  var nav=$('#sidenav'), sheet=$('#tb-sheet');
  var html='<div class="ng">학습</div><a href="#home" data-v="home">홈 · 현황</a>';
  UNITS.forEach(function(u){ html+='<a href="#'+u.id+'" data-v="'+u.id+'">U'+u.no+' '+esc(u.title)+'</a>'; });
  html+='<div class="ng">훈련</div><a href="#wrong" data-v="wrong" id="nav-wrong">오답노트<span class="nv"></span></a><a href="#exam" data-v="exam">모의고사</a>';
  nav.innerHTML=html;
  sheet.innerHTML=UNITS.map(function(u){ return '<a href="#'+u.id+'">U'+u.no+' '+esc(u.title)+'</a>'; }).join('');
}
function route(){
  var h=(location.hash||'#home').slice(1);
  var valid={home:1,wrong:1,exam:1}; UNITS.forEach(function(u){valid[u.id]=1;});
  if(!valid[h]) h='home';
  if(h!=='exam') EXAM.running=false;
  document.querySelectorAll('.side nav a').forEach(function(a){ a.classList.toggle('on',a.getAttribute('data-v')===h); });
  document.querySelectorAll('.tabbar [data-tv]').forEach(function(a){ a.classList.toggle('on',a.getAttribute('data-tv')===h); });
  var sh=$('#tb-sheet'); if(sh) sh.hidden=true;
  VM.touch(location.hash||'#home');
  if(h==='home') renderHome();
  else if(h==='wrong') renderWrong();
  else if(h==='exam') renderExam();
  else renderUnit(UNITS.filter(function(u){return u.id===h;})[0]);
  window.scrollTo(0,0);
  refreshProg();
}
var tbMore=$('#tb-more'), tbSheet=$('#tb-sheet');
if(tbMore){ tbMore.addEventListener('click',function(e){ e.stopPropagation(); tbSheet.hidden=!tbSheet.hidden; });
  document.addEventListener('click',function(e){ if(!tbSheet.hidden&&!tbSheet.contains(e.target)) tbSheet.hidden=true; }); }
window.addEventListener('hashchange',route);
buildNav(); route();
})();
